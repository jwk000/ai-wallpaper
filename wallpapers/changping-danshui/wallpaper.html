let seed=69221;

function line(g,pts,color=INK,lw=1){g.strokeStyle=color;g.lineWidth=lw;g.beginPath();for(let i=0;i<pts.length;i++)i?g.lineTo(...pts[i]):g.moveTo(...pts[i]);g.stroke()}

 for(let layer=0;layer<3;layer++){let pts=[[-60,330-layer*22]];for(let x=-60;x<=2460;x+=24){let yy=225+layer*28-65*Math.sin(x*.0035+layer*1.7)-25*Math.sin(x*.012+layer)-17*Math.cos(x*.021);pts.push([x,yy])}pts.push([2460,385],[-60,385]);poly(g,pts,['#a9b2a323','#8b9b8f20','#8590801a'][layer],['#9a9f8e55','#8f9a8940','#8b957c44'][layer],1);for(let x=40;x<2400;x+=rand(40,85)){const y=280+layer*15-48*Math.sin(x*.0035+layer*1.7);line(g,[[x,y],[x-25,y+35],[x-14,y+47]],'#818b7722',.8)}}

 for(let i=0;i<21;i++)tree(g,i<10?rand(30,430):rand(2040,2380),rand(365,480),rand(.6,1.05));

 for(let i=0;i<6;i++)line(g,[[1520,riverY(1520)-5+i*7],[1550,riverY(1550)-5+i*7]],'#756d52',.7);
 g.font='17px SimSun,serif';g.fillStyle='#687e73';g.fillText('丹 水',1110,riverY(1110)+17);g.fillStyle='#8b8068';g.font='13px SimSun,serif';g.fillText('上 党',1720,266);

 for(let i=0;i<2200;i++){const x=rand(0,2400),y=rand(390,1320),s=(y/1320)*rand(1,3);line(g,[[x-s,y],[x,y-s*2],[x+s,y]],'#827c5532',.7)}

 // Wagon tracks, troop paths and broken ground.

}
function perspective(y){return .49+(y-340)/1030*.69}
function flag(g,x,y,s,side,t,broken=false){const a=armies[side];g.save();g.translate(x,y);g.scale(s,s);if(broken)g.rotate(-1.08);line(g,[[0,0],[0,-79]],a.ink,1.6);line(g,[[-3,-80],[3,-80]],a.ink,1);const wave=Math.sin(t*2+x)*3;g.beginPath();g.moveTo(1,-77);g.bezierCurveTo(12,-81+wave,23,-72-wave,34,-77+wave);if(broken){g.lineTo(25,-67);g.lineTo(33,-62);g.lineTo(21,-54);g.lineTo(31,-49);g.lineTo(23,-40+wave)}else g.lineTo(32,-40+wave);g.bezierCurveTo(22,-35-wave,13,-44+wave,1,-39);g.closePath();g.fillStyle=a.color+'d9';g.fill();g.strokeStyle=a.ink;g.lineWidth=.8;g.stroke();g.fillStyle='#e8dbc0';g.font='19px SimSun,serif';g.textAlign='center';g.fillText(a.flag,17,-51+wave*.4);line(g,[[5,-75],[5,-42]],'#e8dbc08a',.6);if(!broken){g.fillStyle=a.ink;g.beginPath();g.moveTo(0,-87);g.lineTo(-3,-79);g.lineTo(3,-79);g.fill()}g.restore()}
function tent(g,p){const {x,y,s,side}=p,a=armies[side];g.save();g.translate(x,y);g.scale(s,s);ellipse(g,0,3,49,10,'#6656380c');poly(g,[[-42,0],[-30,-44],[0,-65],[32,-44],[43,0]],'#d4c7a6',a.ink+'a0',1.1);poly(g,[[-30,-44],[0,-65],[32,-44],[8,-47]],a.color+'30',a.ink+'90',.8);line(g,[[0,-65],[1,-5]],a.ink+'70',.8);poly(g,[[-14,0],[0,-35],[15,0]],'#665c494a',a.ink+'60',.8);line(g,[[-32,-43],[-58,3],[-61,3]],a.ink+'70',.7);line(g,[[32,-43],[60,3],[63,3]],a.ink+'70',.7);g.restore()}

function prop(g,p,t){g.save();g.translate(p.x,p.y);g.scale(p.s,p.s);const a=armies[p.side];switch(p.kind){
 case 'rampart':poly(g,[[-70,0],[-61,-24],[60,-24],[72,0]],'#a99b783e','#7d765d',1);line(g,[[-60,-24],[60,-24]],'#6c6d55',1.8);for(let i=-57;i<59;i+=8)line(g,[[i,-23],[i-5,-9]],'#84795760',.8);for(let i=-62;i<65;i+=12)line(g,[[i,-22],[i,-39],[i+3,-33]],a.ink,.9);break;

function pure(){document.body.classList.toggle('pure');document.getElementById('settings').hidden=true;document.getElementById('settingBtn').setAttribute('aria-expanded','false')}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('请在浏览器中使用全屏，或按 F11')}}
document.getElementById('pause').onclick=togglePause;document.getElementById('drift').onclick=toggleDrift;document.getElementById('hide').onclick=pure;document.getElementById('full').onclick=fullscreen;
document.getElementById('settingBtn').onclick=()=>{const p=document.getElementById('settings');p.hidden=!p.hidden;document.getElementById('settingBtn').setAttribute('aria-expanded',String(!p.hidden))};
document.getElementById('speed').oninput=e=>{speed=+e.target.value;document.getElementById('speedValue').textContent=speed.toFixed(1)};
document.getElementById('blood').onchange=e=>{showBlood=e.target.checked;if(!showBlood)particles=particles.filter(p=>p.type!=='blood')};
document.getElementById('quality').onchange=resize;document.getElementById('density').onchange=()=>{populate();render();updateCount()};
document.getElementById('reset').onclick=()=>{populate();render();updateCount();toast('两军已重新布阵')};
document.getElementById('home').onclick=()=>{zoom=1;camX=1200;camY=660;render();toast('已还原全景视角')};
window.addEventListener('keydown',e=>{if(e.key!=='Escape'&&['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.repeat)return;if(e.code==='Space'&&document.activeElement.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();togglePause()}if(e.key.toLowerCase()==='h')pure();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Escape'){document.body.classList.remove('pure');document.getElementById('settings').hidden=true;document.getElementById('settingBtn').setAttribute('aria-expanded','false')}});
const pointers=new Map();let gesture=null;
function beginGesture(){const pts=[...pointers.values()];gesture={x:pts.reduce((s,p)=>s+p.x,0)/pts.length,y:pts.reduce((s,p)=>s+p.y,0)/pts.length,camX,camY,zoom,dist:pts.length>1?Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y):0}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(drift)toggleDrift();beginGesture()});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...pointers.values()],x=pts.reduce((s,p)=>s+p.x,0)/pts.length,y=pts.reduce((s,p)=>s+p.y,0)/pts.length;if(pts.length>1&&gesture.dist){const dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);zoom=clamp(gesture.zoom*dist/gesture.dist,1,3)}camX=clamp(gesture.camX-(x-gesture.x)/(baseScale*zoom),0,2400);camY=clamp(gesture.camY-(y-gesture.y)/(baseScale*zoom),0,1320);render()});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size)beginGesture();else gesture=null}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();if(drift)toggleDrift();const old=zoom;zoom=clamp(zoom*Math.exp(-e.deltaY*.001),1,3);camX+=(e.clientX-width/2)/baseScale*(1/old-1/zoom);camY+=(e.clientY-height/2)/baseScale*(1/old-1/zoom);render()},{passive:false});
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{last=0;acc=0});
function updateCount(){document.getElementById('count').textContent=units.length+' 兵'}
populate();resize();updateCount();requestAnimationFrame(frame);
// Read-only diagnostics also let the offline verification script inspect the simulation.
window.battlefield={get units(){return units},get arrows(){return arrows},get corpses(){return corpses},get particles(){return particles},get props(){return props},get stats(){return {...stats}},get time(){return time},get view(){return {width,height,zoom,camX,camY}},update,render,reset:populate};
})();
</script>
