    if (el.pause) el.pause.textContent = paused ? '继续' : '暂停';
    if (!paused && !document.hidden) raf = requestAnimationFrame(frame);
  }

  function toggleHud() {
    const off = el.body.classList.toggle('hud-off');
    el.body.classList.remove('quiet');
    if (!off) {
      scheduleQuiet();
      refreshReadout(true);
    }
    el.settings.setAttribute('aria-expanded', String(!el.panel.hidden));
  }

  function scheduleQuiet() {
    clearTimeout(quietTimer);
    quietTimer = setTimeout(() => {
      if (!el.body.classList.contains('hud-off')) el.body.classList.add('quiet');
    }, 13000);
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* some wallpaper hosts do not expose fullscreen */ }
  }

  /* -------------------------------- loop & input -------------------------------- */

  function frame(now) {
    raf = 0;
    if (paused || document.hidden) {
      last = 0;
      return;
    }
    if (!last) last = now;
    const elapsed = now - last;
    if (elapsed < MIN_FRAME_MS) {
      raf = requestAnimationFrame(frame);
      return;
    }
    const dt = Math.min(elapsed / 1000, 0.12);
    last = now;
    update(dt);
    render();
    raf = requestAnimationFrame(frame);
  }

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: clamp(((e.clientX - rect.left) / Math.max(1, rect.width)) * w, 0, w),
      y: clamp(((e.clientY - rect.top) / Math.max(1, rect.height)) * h, 0, h),
    };
  }

  function strike(x, y, manual) {
    const R = layout.radius;
    const dx = x - layout.webX;
    const dy = y - layout.webY;
    const radN = clamp(Math.hypot(dx, dy) / R, 0.16, 0.94);
    const ang = Math.atan2(dy, dx);
    const plan = {
      ang,
      radN,
      rHalf: 0.070 + 0.045 * hash01(x * 0.013 + y * 0.029 + time * 0.017),
      aHalf: 0.32 + 0.18 * hash01(x * 0.031 + y * 0.011 + time * 0.023),
      wake: 4 + 5 * hash01(x * 0.07 + y * 0.013),
      travel: 26 + 20 * hash01(x * 0.017 + y * 0.041 + 2.1),
      mend: 52 + 34 * hash01(x * 0.023 + y * 0.019 + 4.7),
    };
    const d = spawnDamage(time, plan, manual !== false);
    if (paused) render();
    refreshReadout(true);
    return d;
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const p = pointerPos(e);
    const dist = Math.hypot(p.x - layout.webX, p.y - layout.webY);
    if (dist > layout.radius * 1.15) {
      const ang = Math.atan2(p.y - layout.webY, p.x - layout.webX);
      strike(
        layout.webX + Math.cos(ang) * layout.radius * 0.88,
        layout.webY + Math.sin(ang) * layout.radius * 0.88,
        true,
      );
    } else {
      strike(p.x, p.y, true);
    }
    showToast('虫撞上网了');
  }

  function onPointerMove(e) {
    if (e.buttons !== 1) return;
    const p = pointerPos(e);
    const now = Date.now();
    if (wind.dragAt > -900) {
      const dx = p.x - wind.dragX;
      const dy = p.y - wind.dragY;
      const len = Math.hypot(dx, dy);
      if (len > 2) {
        wind.manualX = lerp(wind.manual > 0 ? wind.manualX : dx / len, dx / len, 0.5);
        wind.manualY = lerp(wind.manual > 0 ? wind.manualY : dy / len, dy / len, 0.5);
        const l = Math.hypot(wind.manualX, wind.manualY) || 1;
        wind.manualX /= l;
        wind.manualY /= l;
        wind.manual = clamp(wind.manual + 0.25, 0, 1);
        updateWindVector(time);
      }
    }
    wind.dragX = p.x;
    wind.dragY = p.y;
    wind.dragAt = now;
    if (paused) { updateWindVector(time); render(); }
  }

  function onPointerUp() {
    wind.dragAt = -999;
  }

  /* -------------------------------- actions -------------------------------- */

  function mendNow() {
    if (damages.length && damages[damages.length - 1].end > time) {
      const d = damages[damages.length - 1];
      d.wake = Math.min(d.wake, time + 1.5);
      d.arrive = Math.max(d.arrive, time + 8);
      showToast('蜘蛛加快了脚步');
    } else {
      const ang = hash01(time * 0.71 + seed * 0.001) * TAU;
      const radN = 0.42 + 0.34 * hash01(time * 1.31);
      const R = layout.radius;
      strike(layout.webX + Math.cos(ang) * R * radN, layout.webY + Math.sin(ang) * R * radN, true);
      showToast('叫来了下一只虫');
    }
    if (paused) render();
    refreshReadout(true);
  }

  function reseed() {
    seed = 1 + Math.floor(Math.random() * 2147483645);
    cycleStarts.length = 1;
    cycleStarts[0] = 0;
    nextCycle = 0;
    nextImpactAt = cycleStart(0) + impactOffset(0);
    damages = [];
    damageCount = 0;
    spiderFreeAt = -1e9;
    gusts = [];
    gustCount = 0;
    gustRng = mulberry32((seed ^ 0x3f1c9a7d) >>> 0);
    nextGustAt = time + 4 + gustRng() * 8;
    lastImpact = null;
    wind.manual = 0;
    focusPhase = hash01(seed * 0.0011) * TAU;
    ensureTimeline(time);
    buildBokeh();
    bakeBackground();
    bakeOverlay();
    buildWebGeometry();
    render();
    refreshReadout(true);
    showToast('换了一张新网');
  }

  function resize() {
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 1.5, Math.max(0.5, Math.sqrt(MAX_PIXELS / (w * h))));
    unit = clamp(Math.min(w, h) / 1080, 0.68, 2.2);
    layout = layoutFor(w, h);

    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    soft.width = Math.max(1, Math.round(w * 0.42));
    soft.height = Math.max(1, Math.round(h * 0.42));


    buildBokeh();
    bakeBackground();
    bakeOverlay();
    buildWebGeometry();
    render();
    refreshReadout(true);
  }

  /* -------------------------------- events -------------------------------- */

  function installEvents() {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('pointerleave', onPointerUp);

    el.settings.addEventListener('click', () => {
      const open = el.panel.hidden;
      el.panel.hidden = !open;
      el.settings.setAttribute('aria-expanded', String(open));
      if (open) scheduleQuiet();
    });
    el.pause.addEventListener('click', togglePause);
    document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
    el.mend.addEventListener('click', mendNow);
    el.reseed.addEventListener('click', () => {
      if (!el.reseed.classList.contains('armed')) {
        el.reseed.classList.add('armed');
        el.reseed.textContent = '确认换网？';
        clearTimeout(reseedTimer);
        reseedTimer = setTimeout(() => {
          el.reseed.classList.remove('armed');
          el.reseed.textContent = '换一张网';
        }, 3200);
        return;
      }
      clearTimeout(reseedTimer);
      el.reseed.classList.remove('armed');
      el.reseed.textContent = '换一张网';
      reseed();
    });
    el.autoDamage.checked = autoDamage;
    el.autoDamage.addEventListener('change', () => {
      autoDamage = el.autoDamage.checked;
      if (autoDamage && nextImpactAt < time + 2) {
        nextCycle++;
        nextImpactAt = cycleStart(nextCycle) + impactOffset(nextCycle);
      }
    });
    el.focusBreath.checked = focusBreathing;
    el.focusBreath.addEventListener('change', () => {
      focusBreathing = el.focusBreath.checked;
      if (paused) render();
    });

    addEventListener('keydown', (e) => {
      if (e.target && e.target.matches && e.target.matches('input, select, button')) return;
      if (e.repeat) return;
      if (e.code === 'Space') { e.preventDefault(); togglePause(); }
      else if (e.key && e.key.toLowerCase() === 'h') toggleHud();
      else if (e.key && e.key.toLowerCase() === 'f') toggleFullscreen();
    });

    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        syncPlayback();
      } else {
        last = 0;
        syncPlayback();
        if (paused) render();
      }
    });
    reducedMotion.addEventListener('change', (e) => {
      if (stillParam === null) {
        paused = e.matches;
        syncPlayback();
        render();
      }
    });
    if (q.get('hud') === '0') el.body.classList.add('hud-off');
    scheduleQuiet();
  }

  /* -------------------------------- debug api -------------------------------- */

  const api = {
    snapshot: () => {
      const pose = spiderPose(time);
      return {
        seed,
        t: time,
        paused,
        frames,
        w, h, dpr,
        aspect: w / h,
        mode: layout.mode,
        webX: layout.webX,
        webY: layout.webY,
        radius: layout.radius,
        silkSegments: SILK_SEGMENTS,
        visibleSegments: frameStats.visibleSegments,
        beads: BEAD_COUNT,
        visibleBeads: frameStats.visibleBeads,
        nodes: NODE_COUNT,
        tears: frameStats.tears,
        mend: frameStats.mend,
        damageCount,
        focus: focusValue(time),
        vibration: vibrationEnergy(time),
        wind: { x: wind.x, y: wind.y, strength: windStrength(time) },
        gustCount,
        gusts: gusts.length,
        autoDamage,
        focusBreathing,
        spider: {
          x: Math.round(pose.x * 100) / 100,
          y: Math.round(pose.y * 100) / 100,
          radN: Math.round(pose.radN * 1000) / 1000,
          repairing: pose.repairing,
        },
        sample: [0, 80, 160, 240].map((k) => ({
          x: Math.round(sp.x[k] * 100) / 100,
          y: Math.round(sp.y[k] * 100) / 100,
          dx: Math.round(sp.dx[k] * 1000) / 1000,
          dy: Math.round(sp.dy[k] * 1000) / 1000,
          vis: sp.vis[k],
        })),
        sampleBeads: beads.slice(0, 4).map((b) => ({
          x: Math.round(b._x * 100) / 100,
          y: Math.round(b._y * 100) / 100,
          s: Math.round(b._s * 1000) / 1000,
          a: Math.round(b._a * 1000) / 1000,
        })),
      };
    },
    audit: () => {
      let bad = 0;
      let badBeads = 0;
      let badNodes = 0;
      let maxOffset = 0;
      let maxBead = 0;
      for (let i = 0; i < NODE_COUNT; i++) {
        if (!Number.isFinite(oX[i] + oY[i] + nodeBaseX[i] + nodeBaseY[i])) badNodes++;
        maxOffset = Math.max(maxOffset, Math.hypot(oX[i], oY[i]));
      }
      for (let k = 0; k < SPIRAL_POINTS; k++) {
        if (!Number.isFinite(sp.x[k] + sp.y[k] + sp.dx[k] + sp.dy[k])) bad++;
      }
      for (let i = 0; i < beads.length; i++) {
        const b = beads[i];
        if (!Number.isFinite(b._x + b._y + b._s + b._a)) badBeads++;
        maxBead = Math.max(maxBead, b._s || 0);
      }
      return {
        silkSegments: SILK_SEGMENTS,
        visibleSegments: frameStats.visibleSegments,
        beads: BEAD_COUNT,
        visibleBeads: frameStats.visibleBeads,
        nodes: NODE_COUNT,
        maxSilk: MAX_SILK,
        maxBeads: MAX_BEADS,
        maxNodes: MAX_NODES,
        bad,
        badBeads,
        badNodes,
        maxOffset,
        maxBead,
        tears: frameStats.tears,
        damageCount,
        vibration: vibrationEnergy(time),
        gustCount,
        focus: focusValue(time),
      };
    },
    advance: (seconds) => {
      const n = Math.max(1, Math.round(clamp(seconds, 0, 7200) * 30));
      for (let i = 0; i < n; i++) update(1 / 30);
      render();
      return api.snapshot();
    },
    tapAt: (nx, ny) => {
      const d = strike(clamp(nx, 0, 1) * w, clamp(ny, 0, 1) * h, true);
      return { ang: d.ang, radN: d.radN, t0: d.t0 };
    },
    setWind: (x, y) => {
      const len = Math.hypot(x, y) || 1;
      wind.manualX = x / len;
      wind.manualY = y / len;
      wind.manual = 1;
      updateWindVector(time);
      render();
      return { x: wind.x, y: wind.y };
    },
    releaseWind: () => {
      wind.manual = 0;
      updateWindVector(time);
      render();
    },
    setAutoDamage: (v) => {
      autoDamage = !!v;
      el.autoDamage.checked = autoDamage;
      if (autoDamage && nextImpactAt < time + 2) {
        nextCycle++;
        nextImpactAt = cycleStart(nextCycle) + impactOffset(nextCycle);
      }
    },
    setFocusBreathing: (v) => {
      focusBreathing = !!v;
      el.focusBreath.checked = focusBreathing;
      if (paused) render();
    },
    mendNow,
    reseed,
    togglePause,
    render,
    vibrationEnergy: () => vibrationEnergy(time),
    focusValue: () => focusValue(time),
    tearCount: () => activeTears(time),
  };
  window.__lumenDew = api;

  /* -------------------------------- boot -------------------------------- */

  function boot() {
    gustRng = mulberry32((seed ^ 0x3f1c9a7d) >>> 0);
    focusPhase = hash01(seed * 0.0011) * TAU;
    buildSprites();
    installEvents();

    const requested = time;
    time = paused ? requested : Math.max(0, requested - Math.min(warmSeconds, requested));

    nextGustAt = time + 3 + gustRng() * 8;
    nextCycle = 0;
    nextImpactAt = cycleStart(0) + impactOffset(0);
    updateWindVector(time);
    ensureGusts(time + 1);
    ensureTimeline(time);

    resize();

    if (!paused) {
      const steps = Math.round(Math.min(warmSeconds, requested) * 30);
      for (let i = 0; i < steps; i++) update(1 / 30);
      time = requested;
      render();
    }
    refreshReadout(true);
    syncPlayback();
  }

  boot();
})();
</script>
</body>
</html>
