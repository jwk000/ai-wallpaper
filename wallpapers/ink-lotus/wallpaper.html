<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨荷游鱼 · Ink Lotus Pond</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0; padding: 0;
    overflow: hidden;
    background: #ece5d5;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
    user-select: none; -webkit-user-select: none;
    cursor: default;
    touch-action: none;
  }
  #pond {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
    max-width: none; max-height: none;
    margin: 0; padding: 0;
    display: block;
    opacity: 0;
    filter: saturate(.9) contrast(1.025);
    animation: scene-in 2.6s cubic-bezier(.22,.61,.36,1) .15s forwards;
  }
  html:fullscreen, body:fullscreen, #pond:fullscreen {
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
  }
  .inscription {
    position: fixed;
    right: clamp(18px, 4.2vw, 72px);
    top: 38%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 1.1vw, 18px);
    writing-mode: vertical-rl;
    font-family: "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", "SimSun", serif;
    font-size: clamp(15px, 1.25vw, 22px);
    letter-spacing: .36em;
    color: rgba(55, 52, 44, .40);
    text-shadow: 0 0 16px rgba(247, 241, 226, .8);
    pointer-events: none;
    opacity: 0;
    animation: poem-in 3.4s ease 2s forwards;
  }
  .seal {
    writing-mode: horizontal-tb;
    width: clamp(28px, 2.1vw, 36px);
    height: clamp(28px, 2.1vw, 36px);
    display: grid;
    place-items: center;
    font-family: "STKaiti", "KaiTi", "SimSun", serif;
    font-size: clamp(10px, .78vw, 13px);
    line-height: 1;
    letter-spacing: .06em;
    color: #f2e7d1;
    background: #a64330;
    border: 1px solid rgba(255, 244, 222, .28);
    border-radius: 3px;
    box-shadow: inset 0 0 0 2px rgba(102, 27, 18, .18), 0 1px 5px rgba(80, 44, 30, .16);
    transform: rotate(-3deg);
    opacity: .78;
    padding-left: .06em;
  }
  @keyframes scene-in { to { opacity: 1; } }
  @keyframes poem-in { to { opacity: 1; } }
  @media (max-width: 760px), (max-height: 520px) {
    .inscription { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #pond { animation-duration: .6s; }
    .inscription { animation-duration: .8s; animation-delay: .2s; }
  }
</style>
</head>
<body>
<canvas id="pond" aria-label="水墨荷塘中，五条金鱼时而成群、时而散开地游动"></canvas>
<div class="inscription" aria-hidden="true">
  <span>鱼戏莲叶间</span>
  <span class="seal">清趣</span>
</div>
<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Utilities
   * ------------------------------------------------------------------ */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const angleWrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  const dist2 = (ax, ay, bx, by) => {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  };

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash2(ix, iy, seed) {
    let h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263) + Math.imul(seed | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function noise2(x, y, seed = 0) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, seed);
    const b = hash2(xi + 1, yi, seed);
    const c = hash2(xi, yi + 1, seed);
    const d = hash2(xi + 1, yi + 1, seed);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(x, y, seed = 0) {
    let v = 0, amp = .5, fx = x, fy = y;
    for (let i = 0; i < 4; i++) {
      v += noise2(fx, fy, seed + i * 71) * amp;
      fx *= 2.03; fy *= 2.01; amp *= .5;
    }
    return v;
  }

  function rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }

  /* ------------------------------------------------------------------ *
   *  Canvas & global state
   * ------------------------------------------------------------------ */
  const canvas = document.getElementById('pond');
  const ctx = canvas.getContext('2d', { alpha: false });
  const QUERY = new URLSearchParams(location.search);
  const DEBUG = QUERY.has('debug');
  const TEST = QUERY.has('test');
  const requestedFish = Number.parseInt(QUERY.get('fish'), 10);
  const FISH_COUNT = Number.isFinite(requestedFish)
    ? clamp(requestedFish, 1, 10)
    : 6 + Math.floor(Math.random() * 5);

  let W = 0, H = 0, U = 0, S = 1, DPR = 1;
  let time = 0;
  const WORLD = { left: 0, right: 0, top: 0, bottom: 0 };
  let bgLayer = null, overlayLayer = null;
  let leaves = [], flowers = [], obstacles = [], fishes = [], ripples = [], floaters = [], bubbles = [];
  let inkPattern = null, inkTile = null;
  let simRnd = mulberry32(1);
  let ambientTimer = 1.8;
  let lastFrame = 0;
  let destroyed = false;
  let frameCount = 0;
  let lastRenderCost = 0;
  let debugMinPair = Infinity;
  let debugMinObstacle = Infinity;

  const mood = {
    mode: 'school',
    intensity: 1,
    target: 1,
    timer: 11
  };

  const wind = {
    angle: -.42,
    strength: .28,
    x: 0,
    y: 0,
    phase: 0
  };

  const group = {
    x: 0, y: 0,
    angle: 0,
    speed: 62,
    phase: 0
  };

  const FISH_LENGTH_BASE = 72;

  /* ------------------------------------------------------------------ *
   *  Layers
   * ------------------------------------------------------------------ */
  function makeLayer(wCss, hCss) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(wCss * DPR));
    c.height = Math.max(1, Math.round(hCss * DPR));
    const g = c.getContext('2d');
    g.scale(DPR, DPR);
    return { canvas: c, ctx: g, w: wCss, h: hCss };
  }

  function buildInkTexture() {
    const size = 192;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    const img = g.createImageData(size, size);
    const d = img.data;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const n = fbm(x / 27, y / 27, 9);
        const grain = hash2(x, y, 27) - .5;
        const a = clamp((n - .36) * 105 + grain * 26, 0, 62);
        const j = (y * size + x) * 4;
        const v = 38 + hash2(x, y, 33) * 25;
        d[j] = v;
        d[j + 1] = v + 1;
        d[j + 2] = v - 3;
        d[j + 3] = a;
      }
    }
    g.putImageData(img, 0, 0);
    inkTile = c;
    inkPattern = ctx.createPattern(c, 'repeat');
  }

  function setupCanvas() {
    const root = document.documentElement;
    const rect = canvas.getBoundingClientRect();
    W = Math.max(320, Math.round(rect.width || root.clientWidth || window.innerWidth));
    H = Math.max(320, Math.round(rect.height || root.clientHeight || window.innerHeight));
    const rawDpr = window.devicePixelRatio || 1;
    const maxPixels = 6.2e6;
    DPR = Math.min(rawDpr, 1.8);
    if (W * H * DPR * DPR > maxPixels) DPR = Math.sqrt(maxPixels / (W * H));
    DPR = Math.max(1, DPR);
    U = Math.min(W, H);
    S = clamp(Math.sqrt((W * H) / (1920 * 1080)), .58, 1.5);

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = '100%';
    canvas.style.height = '100%';
  }

  /* ------------------------------------------------------------------ *
   *  Paper & water background
   * ------------------------------------------------------------------ */
  function buildBackground() {
    const layer = makeLayer(W, H);
    const g = layer.ctx;
    const rng = mulberry32(0x51a7c0de);

    const base = g.createLinearGradient(0, 0, W * .55, H);
    base.addColorStop(0, '#f1ebdc');
    base.addColorStop(.48, '#eee7d6');
    base.addColorStop(1, '#e8e0cd');
    g.fillStyle = base;
    g.fillRect(0, 0, W, H);

    // Broad, slow ink washes, the colour of shady pond water.
    const washColours = [
      [88, 104, 90], [102, 115, 101], [75, 93, 93],
      [115, 109, 89], [68, 86, 77], [126, 123, 102]
    ];
    for (let i = 0; i < 18; i++) {
      const cx = rng() * W;
      const cy = rng() * H;
      const rx = (.10 + rng() * .42) * W;
      const ry = (.07 + rng() * .32) * H;
      const col = washColours[i % washColours.length];
      g.save();
      g.translate(cx, cy);
      g.scale(rx, ry);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
      gr.addColorStop(0, rgba(col, .042 + rng() * .052));
      gr.addColorStop(.55, rgba(col, .022 + rng() * .026));
      gr.addColorStop(1, rgba(col, 0));
      g.fillStyle = gr;
      g.beginPath();
      g.arc(0, 0, 1, 0, TAU);
      g.fill();
      g.restore();
    }

    // A cool, deeper wash in the middle of the pond.
    for (let i = 0; i < 3; i++) {
      const cx = W * (.30 + rng() * .42);
      const cy = H * (.28 + rng() * .42);
      const rx = W * (.22 + rng() * .22);
      const ry = H * (.18 + rng() * .22);
      g.save();
      g.translate(cx, cy);
      g.scale(rx, ry);
      const gr = g.createRadialGradient(0, 0, .1, 0, 0, 1);
      gr.addColorStop(0, 'rgba(70,94,90,0.058)');
      gr.addColorStop(.62, 'rgba(78,100,93,0.032)');
      gr.addColorStop(1, 'rgba(78,100,93,0)');
      g.fillStyle = gr;
      g.beginPath();
      g.arc(0, 0, 1, 0, TAU);
      g.fill();
      g.restore();
    }

    // Large, soft ink washes gathering at the corners and margins. They give
    // the pale paper a sense of deep water without painting a hard edge.
    const cornerWashes = [
      { x: .02, y: .03, rx: .30, ry: .26, a: .085 },
      { x: .99, y: .92, rx: .28, ry: .30, a: .095 },
      { x: .92, y: .08, rx: .22, ry: .20, a: .055 },
      { x: .07, y: .93, rx: .24, ry: .22, a: .070 },
      { x: .62, y: .60, rx: .28, ry: .20, a: .032 }
    ];
    for (const spot of cornerWashes) {
      g.save();
      g.translate(W * spot.x, H * spot.y);
      g.scale(W * spot.rx, H * spot.ry);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
      gr.addColorStop(0, `rgba(54,70,60,${spot.a})`);
      gr.addColorStop(.52, `rgba(58,74,63,${spot.a * .55})`);
      gr.addColorStop(1, 'rgba(58,74,63,0)');
      g.fillStyle = gr;
      g.beginPath();
      g.arc(0, 0, 1, 0, TAU);
      g.fill();
      g.restore();
    }

    // Darker pools near the edges, like ink gathering at the rim of a wash.
    for (let i = 0; i < 9; i++) {
      const edge = Math.floor(rng() * 4);
      let cx, cy;
      if (edge === 0) { cx = rng() * W; cy = rng() * H * .12; }
      else if (edge === 1) { cx = W * (.88 + rng() * .12); cy = rng() * H; }
      else if (edge === 2) { cx = rng() * W; cy = H * (.88 + rng() * .12); }
      else { cx = rng() * W * .12; cy = rng() * H; }
      const rx = (.10 + rng() * .20) * W;
      const ry = (.06 + rng() * .14) * H;
      g.save();
      g.translate(cx, cy);
      g.scale(rx, ry);
      const gr = g.createRadialGradient(0, 0, .15, 0, 0, 1);
      gr.addColorStop(0, 'rgba(58,66,55,0.055)');
      gr.addColorStop(1, 'rgba(58,66,55,0)');
      g.fillStyle = gr;
      g.beginPath();
      g.arc(0, 0, 1, 0, TAU);
      g.fill();
      g.restore();
    }

    // A few ink splashes near the margins.
    for (let i = 0; i < 8; i++) {
      const edge = Math.floor(rng() * 4);
      const cx = edge < 2 ? rng() * W : (edge === 2 ? W * (.94 + rng() * .06) : W * rng() * .06);
      const cy = edge >= 2 ? rng() * H : (edge === 0 ? H * (.94 + rng() * .06) : H * rng() * .06);
      for (let k = 0; k < 6; k++) {
        g.beginPath();
        g.arc(
          cx + (rng() - .5) * 44,
          cy + (rng() - .5) * 36,
          .5 + rng() * 2.4,
          0, TAU
        );
        g.fillStyle = `rgba(62,69,56,${.025 + rng() * .055})`;
        g.fill();
      }
    }

    // Tiny islands of sediment / ink grit.
    for (let i = 0; i < 60; i++) {
      const x = rng() * W, y = rng() * H;
      const r = .4 + rng() * 1.6;
      g.beginPath();
      g.ellipse(x, y, r * (1 + rng()), r, rng() * TAU, 0, TAU);
      g.fillStyle = `rgba(79,82,67,${.018 + rng() * .045})`;
      g.fill();
    }

    bgLayer = layer;
  }

  function buildOverlay() {
    const layer = makeLayer(W, H);
    const g = layer.ctx;
    const rng = mulberry32(0x9f3c11);

    // Paper grain.
    const tile = document.createElement('canvas');
    tile.width = 180;
    tile.height = 180;
    const tg = tile.getContext('2d');
    const img = tg.createImageData(tile.width, tile.height);
    const d = img.data;
    for (let i = 0; i < tile.width * tile.height; i++) {
      const v = 72 + Math.random() * 62;
      const a = Math.random() < .48 ? 10 + Math.random() * 18 : 0;
      const j = i * 4;
      d[j] = v; d[j + 1] = v - 2; d[j + 2] = v - 9; d[j + 3] = a;
    }
    tg.putImageData(img, 0, 0);
    const pat = g.createPattern(tile, 'repeat');
    g.save();
    g.globalAlpha = .55;
    g.fillStyle = pat;
    g.fillRect(0, 0, W, H);
    g.restore();

    // A few paper fibres.
    for (let i = 0; i < 120; i++) {
      const x = rng() * W, y = rng() * H;
      const len = 4 + rng() * 34;
      const a = rng() * TAU;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(
        x + Math.cos(a + .4) * len * .55,
        y + Math.sin(a + .4) * len * .55,
        x + Math.cos(a) * len,
        y + Math.sin(a) * len
      );
      g.strokeStyle = `rgba(104,93,70,${.014 + rng() * .028})`;
      g.lineWidth = .35 + rng() * .55;
      g.stroke();
    }

    // Vignette.
    const rad = g.createRadialGradient(W * .47, H * .45, U * .16, W * .5, H * .5, Math.max(W, H) * .78);
    rad.addColorStop(0, 'rgba(73,65,50,0)');
    rad.addColorStop(.60, 'rgba(73,65,50,0.024)');
    rad.addColorStop(1, 'rgba(58,49,37,0.21)');
    g.fillStyle = rad;
    g.fillRect(0, 0, W, H);

    // Warm light resting on the paper.
    const light = g.createRadialGradient(W * .62, H * .30, 0, W * .62, H * .30, U * .72);
    light.addColorStop(0, 'rgba(255,248,228,0.075)');
    light.addColorStop(1, 'rgba(255,248,228,0)');
    g.fillStyle = light;
    g.fillRect(0, 0, W, H);

    overlayLayer = layer;
  }

  /* ------------------------------------------------------------------ *
   *  Lotus leaves & flowers
   * ------------------------------------------------------------------ */
  function leafRadiusAt(theta, radius, phase) {
    return radius * (
      1 +
      .036 * Math.sin(theta * 5 + phase) +
      .019 * Math.sin(theta * 9 - phase * 1.7) +
      .011 * Math.sin(theta * 17 + phase * .6)
    );
  }

  const LEAF_PALETTES = [
    [[137, 149, 123], [111, 126, 105], [74, 91, 74], [48, 63, 49]],
    [[128, 145, 138], [102, 120, 114], [71, 91, 86], [45, 64, 60]],
    [[124, 139, 108], [98, 114, 92], [65, 83, 65], [41, 58, 43]],
    [[143, 144, 117], [118, 121, 97], [81, 91, 67], [53, 65, 44]]
  ];

  function makeLeafSprite(seed, radius, alpha, variant = 0) {
    const rng = mulberry32(seed);
    const size = radius * 2.7;
    const layer = makeLayer(size, size);
    const g = layer.ctx;
    const pal = LEAF_PALETTES[variant % LEAF_PALETTES.length];
    g.translate(size / 2, size / 2);

    const phase = rng() * TAU;
    const notch = rng() * TAU;
    const gap = .10 + rng() * .10;
    const start = notch + gap * .5;
    const end = notch + TAU - gap * .5;
    const N = 110;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const th = lerp(start, end, i / (N - 1));
      const rr = leafRadiusAt(th, radius, phase);
      pts.push([Math.cos(th) * rr, Math.sin(th) * rr]);
    }

    const p = new Path2D();
    p.moveTo(0, 0);
    p.lineTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
    p.closePath();

    // A wet outer bleed, then the shadow.
    g.save();
    g.filter = `blur(${Math.max(4, radius * .045)}px)`;
    g.scale(1.025, 1.025);
    g.fillStyle = 'rgba(45,59,46,0.10)';
    g.fill(p);
    g.restore();

    g.save();
    g.translate(radius * .035, radius * .055);
    g.filter = `blur(${Math.max(3, radius * .035)}px)`;
    g.fillStyle = 'rgba(49,55,43,0.25)';
    g.fill(p);
    g.restore();

    // Two pale waterline rings, drawn on the water around the leaf.
    g.save();
    g.globalAlpha = .5 * alpha;
    g.strokeStyle = 'rgba(85,94,76,0.11)';
    g.lineWidth = 1.2;
    for (let k = 0; k < 2; k++) {
      const rr = radius * (1.045 + k * .038);
      g.beginPath();
      for (let i = 0; i <= 80; i++) {
        const th = (i / 80) * TAU;
        const wave = 1 + .012 * Math.sin(th * 7 + phase + k) + .008 * Math.sin(th * 13 - phase);
        const x = Math.cos(th) * rr * wave;
        const y = Math.sin(th) * rr * wave * .985;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath();
      g.stroke();
    }
    g.restore();

    // Base wash.
    const grad = g.createRadialGradient(-radius * .16, -radius * .21, radius * .03, 0, 0, radius * 1.03);
    grad.addColorStop(0, rgba(pal[0], .49));
    grad.addColorStop(.45, rgba(pal[1], .52));
    grad.addColorStop(.78, rgba(pal[2], .56));
    grad.addColorStop(.94, rgba(pal[3], .62));
    grad.addColorStop(1, rgba(pal[3], .66));
    g.fillStyle = grad;
    g.fill(p);

    g.save();
    g.clip(p);

    // Ink blooms in the body of the leaf.
    for (let i = 0; i < 9; i++) {
      const bx = (rng() - .5) * radius * 1.5;
      const by = (rng() - .5) * radius * 1.5;
      const br = radius * (.08 + rng() * .36);
      const dark = rng() > .42;
      const gr = g.createRadialGradient(bx, by, 0, bx, by, br);
      if (dark) {
        gr.addColorStop(0, `rgba(48,64,51,${.035 + rng() * .075})`);
        gr.addColorStop(1, 'rgba(48,64,51,0)');
      } else {
        gr.addColorStop(0, `rgba(226,223,199,${.035 + rng() * .065})`);
        gr.addColorStop(1, 'rgba(226,223,199,0)');
      }
      g.fillStyle = gr;
      g.beginPath();
      g.arc(bx, by, br, 0, TAU);
      g.fill();
    }

    // A wide, uneven brush sweep around the rim.
    g.strokeStyle = 'rgba(43,57,46,0.10)';
    g.lineWidth = radius * .12;
    g.beginPath();
    g.arc(0, 0, radius * .88, start + .35, end - .55);
    g.stroke();

    // Veins.
    const veinCount = 20 + Math.floor(rng() * 7);
    for (let i = 0; i < veinCount; i++) {
      const th = lerp(start + .06, end - .06, i / (veinCount - 1)) + (rng() - .5) * .018;
      const rr = leafRadiusAt(th, radius, phase) * (.93 + rng() * .03);
      const bend = (rng() - .5) * .12;
      const mx = Math.cos(th + bend) * rr * .53;
      const my = Math.sin(th + bend) * rr * .53;
      const ex = Math.cos(th) * rr;
      const ey = Math.sin(th) * rr;
      g.beginPath();
      g.moveTo(Math.cos(th) * radius * .04, Math.sin(th) * radius * .04);
      g.quadraticCurveTo(mx, my, ex, ey);
      g.strokeStyle = `rgba(40,55,43,${.075 + rng() * .12})`;
      g.lineWidth = .55 + rng() * 1.15;
      g.stroke();

      if (i % 4 === 0) {
        const bx = Math.cos(th + .035) * rr * .6;
        const by = Math.sin(th + .035) * rr * .6;
        g.beginPath();
        g.moveTo(bx, by);
        g.quadraticCurveTo(
          Math.cos(th + .09) * rr * .75,
          Math.sin(th + .09) * rr * .75,
          Math.cos(th + .1) * rr * .86,
          Math.sin(th + .1) * rr * .86
        );
        g.strokeStyle = 'rgba(42,57,44,0.075)';
        g.lineWidth = .55;
        g.stroke();
      }
    }

    // Sparse darker veins, like a dry-brush accent.
    for (let i = 0; i < 4; i++) {
      const th = start + .25 + rng() * (TAU - gap - .5);
      const rr = leafRadiusAt(th, radius, phase) * .94;
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(
        Math.cos(th + .05) * rr * .5,
        Math.sin(th + .05) * rr * .5,
        Math.cos(th) * rr,
        Math.sin(th) * rr
      );
      g.strokeStyle = `rgba(36,50,39,${.10 + rng() * .09})`;
      g.lineWidth = 1.1 + rng() * .8;
      g.stroke();
    }

    // Pale wet highlights near the edge.
    for (let i = 0; i < 3; i++) {
      const th = start + .4 + rng() * (TAU - gap - .8);
      const rr = leafRadiusAt(th, radius, phase) * (.72 + rng() * .18);
      g.save();
      g.translate(Math.cos(th) * rr, Math.sin(th) * rr);
      g.rotate(th + Math.PI * .5);
      g.beginPath();
      g.ellipse(0, 0, radius * (.03 + rng() * .045), radius * (.008 + rng() * .012), 0, 0, TAU);
      g.fillStyle = `rgba(247,241,222,${.055 + rng() * .075})`;
      g.fill();
      g.restore();
    }

    // A thin sheen along one section of the rim.
    const sheenStart = Math.floor(N * (.18 + rng() * .35));
    const sheenEnd = Math.min(N - 2, sheenStart + Math.floor(N * .22));
    g.beginPath();
    for (let i = sheenStart; i <= sheenEnd; i++) {
      const x = pts[i][0] * .988;
      const y = pts[i][1] * .988;
      if (i === sheenStart) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.strokeStyle = 'rgba(250,245,228,0.18)';
    g.lineWidth = 1.8;
    g.lineCap = 'round';
    g.stroke();

    // Paper grain, caught in the wash.
    if (inkTile) {
      const grain = g.createPattern(inkTile, 'repeat');
      g.save();
      g.globalCompositeOperation = 'multiply';
      g.globalAlpha = .40;
      g.fillStyle = grain;
      g.fillRect(-size / 2, -size / 2, size, size);
      g.restore();
    }

    g.restore();

    // Rim, in two passes: a fine dark edge and a soft bleed.
    g.strokeStyle = 'rgba(37,51,39,0.66)';
    g.lineWidth = 1.25;
    g.stroke(p);
    g.strokeStyle = 'rgba(42,56,43,0.16)';
    g.lineWidth = 4.8;
    g.stroke(p);

    // A little ink spray, as if the leaf edge were painted wet-on-wet.
    for (let i = 0; i < 10; i++) {
      const th = rng() * TAU;
      const rr = leafRadiusAt(th, radius, phase) * (1.008 + rng() * .09);
      g.beginPath();
      g.arc(Math.cos(th) * rr, Math.sin(th) * rr, .35 + rng() * 1.15, 0, TAU);
      g.fillStyle = `rgba(40,53,41,${.018 + rng() * .045})`;
      g.fill();
    }

    // Darker segments of the rim.
    for (let i = 0; i < 3; i++) {
      const a0 = start + rng() * (TAU - gap - 1);
      const a1 = a0 + .12 + rng() * .45;
      g.beginPath();
      const steps = 12;
      for (let j = 0; j <= steps; j++) {
        const th = lerp(a0, a1, j / steps);
        const rr = leafRadiusAt(th, radius, phase);
        const x = Math.cos(th) * rr;
        const y = Math.sin(th) * rr;
        if (j === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.strokeStyle = `rgba(32,45,35,${.24 + rng() * .22})`;
      g.lineWidth = 1.7 + rng() * 1.2;
      g.stroke();
    }

    // Heart of the leaf.
    g.beginPath();
    g.arc(0, 0, Math.max(2, radius * .022), 0, TAU);
    g.fillStyle = 'rgba(39,52,41,0.42)';
    g.fill();
    g.beginPath();
    g.arc(0, 0, Math.max(4, radius * .042), 0, TAU);
    g.strokeStyle = 'rgba(231,226,203,0.15)';
    g.lineWidth = 1;
    g.stroke();

    // Two dewdrops.
    for (let i = 0; i < 2; i++) {
      const th = rng() * TAU;
      const rr = radius * (.25 + rng() * .45);
      const x = Math.cos(th) * rr, y = Math.sin(th) * rr;
      const dr = radius * (.018 + rng() * .012);
      g.save();
      g.translate(x, y);
      g.rotate(rng() * TAU);
      g.beginPath();
      g.ellipse(0, 0, dr * 1.35, dr, 0, 0, TAU);
      g.fillStyle = 'rgba(240,237,218,0.20)';
      g.fill();
      g.strokeStyle = 'rgba(43,56,44,0.28)';
      g.lineWidth = .6;
      g.stroke();
      g.beginPath();
      g.ellipse(-dr * .38, -dr * .35, dr * .42, dr * .22, -.6, 0, TAU);
      g.fillStyle = 'rgba(255,251,235,0.5)';
      g.fill();
      g.restore();
    }

    return { canvas: layer.canvas, size };
  }

  function makeFlowerSprite(seed, radius, variant) {
    const rng = mulberry32(seed);
    const size = radius * 3.35;
    const layer = makeLayer(size, size);
    const g = layer.ctx;
    g.translate(size / 2, size / 2);

    // A soft, watery shadow, as if the bloom floats above the leaves.
    g.save();
    g.translate(radius * .06, radius * .09);
    g.filter = `blur(${Math.max(3, radius * .055)}px)`;
    g.fillStyle = 'rgba(61,56,43,0.20)';
    g.beginPath();
    g.ellipse(0, 0, radius * .84, radius * .74, 0, 0, TAU);
    g.fill();
    g.restore();

    // A green-grey wash beneath the petals, like a reflection in the pond.
    const under = g.createRadialGradient(0, radius * .04, radius * .1, 0, radius * .04, radius * .95);
    under.addColorStop(0, 'rgba(63,82,61,0.20)');
    under.addColorStop(.65, 'rgba(69,88,65,0.10)');
    under.addColorStop(1, 'rgba(69,88,65,0)');
    g.fillStyle = under;
    g.beginPath();
    g.arc(0, radius * .04, radius * .95, 0, TAU);
    g.fill();

    // Four small, dark sepals show beneath the petals.
    for (let i = 0; i < 4; i++) {
      const a = rng() * TAU;
      g.save();
      g.rotate(a);
      g.beginPath();
      g.moveTo(0, radius * .08);
      g.quadraticCurveTo(radius * .16, radius * .38, 0, radius * .56);
      g.quadraticCurveTo(-radius * .13, radius * .35, 0, radius * .08);
      g.fillStyle = 'rgba(73,91,64,0.34)';
      g.fill();
      g.restore();
    }

    const ring = (count, lenBase, widthBase, phase, palette, jitter) => {
      for (let i = 0; i < count; i++) {
        const a = phase + (i / count) * TAU + (rng() - .5) * jitter;
        // Petals into the "distance" are a touch shorter, giving a very
        // slight tilt to the blossom.
        const perspective = .86 + .14 * Math.cos(a - .65);
        const len = lenBase * perspective * (.78 + rng() * .27);
        const width = widthBase * (.72 + rng() * .46);
        g.save();
        g.rotate(a);
        g.beginPath();
        g.moveTo(0, 0);
        g.bezierCurveTo(
          width * 1.42, len * .13,
          width * 1.06 + (rng() - .5) * width * .25, len * .66,
          0, len
        );
        g.bezierCurveTo(
          -width * 1.06 + (rng() - .5) * width * .25, len * .66,
          -width * 1.42, len * .13,
          0, 0
        );
        g.closePath();

        const gr = g.createLinearGradient(0, 0, 0, len);
        gr.addColorStop(0, palette[0]);
        gr.addColorStop(.42, palette[1]);
        gr.addColorStop(.82, palette[2]);
        gr.addColorStop(1, palette[3]);
        g.fillStyle = gr;
        g.fill();

        // A broken ink edge, mostly at the tip.
        g.strokeStyle = 'rgba(76,53,43,0.08)';
        g.lineWidth = .6;
        g.stroke();
        g.beginPath();
        g.moveTo(-width * .44, len * .78);
        g.bezierCurveTo(-width * .24, len * .92, width * .12, len * .99, width * .13, len * .88);
        g.strokeStyle = 'rgba(80,51,41,0.26)';
        g.lineWidth = 1.15;
        g.stroke();

        // The brush sometimes pauses at a petal tip and leaves a dark bead.
        if (rng() > .58) {
          g.save();
          g.translate((rng() - .5) * width * .26, len * .95);
          g.rotate((rng() - .5) * .9);
          g.beginPath();
          g.ellipse(0, 0, width * .20, width * .06, 0, 0, TAU);
          g.fillStyle = 'rgba(80,49,40,0.34)';
          g.fill();
          g.restore();
        }

        // A crease down the middle of each petal.
        g.beginPath();
        g.moveTo(0, len * .06);
        g.quadraticCurveTo(width * .12, len * .52, (rng() - .5) * width * .24, len * .92);
        g.strokeStyle = 'rgba(124,78,64,0.12)';
        g.lineWidth = .65;
        g.stroke();

        // A glint of paper-white along the folded edge.
        g.beginPath();
        g.moveTo(width * .20, len * .2);
        g.quadraticCurveTo(width * .54, len * .55, width * .22, len * .8);
        g.strokeStyle = 'rgba(255,247,228,0.19)';
        g.lineWidth = 1;
        g.stroke();
        g.restore();
      }
    };

    if (variant === 0) {
      ring(7, radius * 1.02, radius * .31, rng() * TAU,
        ['rgba(249,241,224,0.72)', 'rgba(235,214,199,0.54)', 'rgba(203,171,161,0.34)', 'rgba(157,120,112,0.22)'], .27);
      ring(6, radius * .78, radius * .27, .34 + rng() * .16,
        ['rgba(246,230,211,0.72)', 'rgba(228,191,177,0.56)', 'rgba(197,149,139,0.36)', 'rgba(154,104,95,0.23)'], .23);
      ring(4, radius * .52, radius * .19, .85 + rng() * .2,
        ['rgba(240,216,195,0.78)', 'rgba(218,171,157,0.62)', 'rgba(181,124,113,0.42)', 'rgba(139,84,76,0.28)'], .22);
    } else {
      ring(7, radius * 1.02, radius * .315, rng() * TAU,
        ['rgba(251,245,231,0.74)', 'rgba(240,225,211,0.54)', 'rgba(214,190,177,0.32)', 'rgba(171,140,129,0.20)'], .27);
      ring(6, radius * .77, radius * .275, .32 + rng() * .16,
        ['rgba(249,236,219,0.74)', 'rgba(235,207,192,0.54)', 'rgba(207,167,154,0.34)', 'rgba(165,120,110,0.21)'], .23);
      ring(4, radius * .51, radius * .195, .82 + rng() * .2,
        ['rgba(244,226,205,0.80)', 'rgba(228,190,175,0.60)', 'rgba(195,144,131,0.40)', 'rgba(151,98,88,0.26)'], .22);
    }

    // The seed-vessel, green-gold, ringed by stamens.
    const receptacleR = radius * .175;
    const centre = g.createRadialGradient(-radius * .02, -radius * .02, 0, 0, 0, receptacleR);
    centre.addColorStop(0, 'rgba(220,198,134,0.95)');
    centre.addColorStop(.55, 'rgba(176,153,88,0.92)');
    centre.addColorStop(.9, 'rgba(103,99,58,0.72)');
    centre.addColorStop(1, 'rgba(69,75,45,0.18)');
    g.beginPath();
    g.arc(0, 0, receptacleR, 0, TAU);
    g.fillStyle = centre;
    g.fill();

    const stamens = 22;
    for (let i = 0; i < stamens; i++) {
      const a = (i / stamens) * TAU + rng() * .17;
      const rr = radius * (.17 + rng() * .1);
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      g.beginPath();
      g.moveTo(Math.cos(a) * radius * .07, Math.sin(a) * radius * .07);
      g.quadraticCurveTo(
        Math.cos(a + .18) * rr * .75, Math.sin(a + .18) * rr * .75,
        x, y
      );
      g.strokeStyle = 'rgba(136,103,49,0.38)';
      g.lineWidth = .55;
      g.stroke();
      g.beginPath();
      g.arc(x, y, radius * (.011 + rng() * .009), 0, TAU);
      g.fillStyle = 'rgba(71,54,32,0.68)';
      g.fill();
    }

    // Dark pores in the seed-vessel.
    for (let i = 0; i < 10; i++) {
      const a = rng() * TAU;
      const rr = rng() * receptacleR * .68;
      g.beginPath();
      g.arc(Math.cos(a) * rr, Math.sin(a) * rr, radius * (.009 + rng() * .007), 0, TAU);
      g.fillStyle = 'rgba(73,62,36,0.52)';
      g.fill();
    }

    // Loose ink at the heart, tying the flower to the wash around it.
    for (let i = 0; i < 5; i++) {
      const a = rng() * TAU;
      g.beginPath();
      g.arc(0, 0, radius * (.30 + rng() * .24), a, a + .22 + rng() * .25);
      g.strokeStyle = 'rgba(67,58,44,0.08)';
      g.lineWidth = radius * .026;
      g.stroke();
    }

    return { canvas: layer.canvas, size };
  }

  function makeBudSprite(seed, radius, variant) {
    const rng = mulberry32(seed);
    const size = radius * 2.8;
    const layer = makeLayer(size, size);
    const g = layer.ctx;
    g.translate(size / 2, size / 2);

    g.save();
    g.translate(radius * .08, radius * .12);
    g.filter = `blur(${Math.max(2, radius * .06)}px)`;
    g.fillStyle = 'rgba(65,59,43,0.17)';
    g.beginPath();
    g.ellipse(0, 0, radius * .55, radius * .82, .5, 0, TAU);
    g.fill();
    g.restore();

    g.rotate(-.35 + rng() * .7);
    const petals = 3;
    for (let i = 0; i < petals; i++) {
      const off = (i - 1) * radius * .17;
      const len = radius * (.9 + i * .04);
      g.save();
      g.translate(off, 0);
      g.beginPath();
      g.moveTo(0, 0);
      g.bezierCurveTo(radius * .30, -len * .32, radius * .24, -len * .78, 0, -len);
      g.bezierCurveTo(-radius * .22, -len * .74, -radius * .25, -len * .25, 0, 0);
      const gr = g.createLinearGradient(0, 0, 0, -len);
      if (variant === 0) {
        gr.addColorStop(0, 'rgba(214,190,168,0.9)');
        gr.addColorStop(.55, 'rgba(215,165,154,0.88)');
        gr.addColorStop(1, 'rgba(169,102,94,0.78)');
      } else {
        gr.addColorStop(0, 'rgba(232,217,194,0.92)');
        gr.addColorStop(1, 'rgba(192,146,130,0.78)');
      }
      g.fillStyle = gr;
      g.fill();
      g.strokeStyle = 'rgba(85,61,50,0.24)';
      g.lineWidth = .8;
      g.stroke();
      g.restore();
    }

    // Sepals.
    for (let i = 0; i < 3; i++) {
      g.save();
      g.rotate((i - 1) * .7);
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(radius * .2, radius * .35, 0, radius * .64);
      g.quadraticCurveTo(-radius * .18, radius * .32, 0, 0);
      g.fillStyle = 'rgba(88,104,78,0.55)';
      g.fill();
      g.restore();
    }

    g.beginPath();
    g.moveTo(-radius * .02, 0);
    g.quadraticCurveTo(radius * .03, -radius * .3, 0, -radius * .7);
    g.strokeStyle = 'rgba(91,63,50,0.18)';
    g.lineWidth = 1;
    g.stroke();

    return { canvas: layer.canvas, size };
  }

  /* ------------------------------------------------------------------ *
   *  Scene layout
   * ------------------------------------------------------------------ */
  const LEAF_DEFS = [
    { x: .075, y: .095, r: .155, rot: -0.55, alpha: .98 },
    { x: .865, y: .845, r: .176, rot: 2.50, alpha: 1.00 },
    { x: .890, y: .135, r: .104, rot: 1.20, alpha: .90 },
    { x: .073, y: .825, r: .110, rot: -2.20, alpha: .92 },
    { x: .515, y: .975, r: .077, rot: .80, alpha: .86 },
    { x: .352, y: .055, r: .070, rot: -1.00, alpha: .82 },
    { x: .666, y: .600, r: .058, rot: 2.90, alpha: .84 },
    { x: .790, y: .405, r: .044, rot: .20, alpha: .78 },
    { x: .157, y: .535, r: .049, rot: -.80, alpha: .80 },
    { x: .208, y: .048, r: .084, rot: .72, alpha: .92 },
    { x: .946, y: .790, r: .066, rot: -1.25, alpha: .86 },
    { x: .316, y: .748, r: .051, rot: 1.35, alpha: .82 }
  ];

  const FLOWER_DEFS = [
    { x: .742, y: .372, r: .061, rot: .55, kind: 'flower', variant: 0, alpha: .96 },
    { x: .243, y: .665, r: .053, rot: -.40, kind: 'flower', variant: 1, alpha: .94 },
    { x: .902, y: .555, r: .042, rot: 1.55, kind: 'flower', variant: 0, alpha: .88 },
    { x: .614, y: .806, r: .035, rot: 2.10, kind: 'bud', variant: 1, alpha: .90 },
    { x: .438, y: .168, r: .031, rot: -1.25, kind: 'bud', variant: 0, alpha: .82 }
  ];

  function buildScene() {
    setupCanvas();
    U = Math.min(W, H);
    S = clamp(Math.sqrt((W * H) / (1920 * 1080)), .58, 1.5);
    WORLD.left = -Math.max(W * .30, 420 * S);
    WORLD.right = W + Math.max(W * .30, 420 * S);
    WORLD.top = -Math.max(H * .25, 320 * S);
    WORLD.bottom = H + Math.max(H * .25, 320 * S);
    simRnd = mulberry32(0x1a2b3c4d);
    leaves = [];
    flowers = [];
    buildInkTexture();

    LEAF_DEFS.forEach((def, i) => {
      const radius = U * def.r * (.95 + simRnd() * .1);
      const sprite = makeLeafSprite(0x3000 + i * 977, radius, def.alpha, i % LEAF_PALETTES.length);
      leaves.push({
        x: W * def.x + (simRnd() - .5) * W * .012,
        y: H * def.y + (simRnd() - .5) * H * .012,
        radius,
        rot: def.rot,
        alpha: def.alpha,
        phase: simRnd() * TAU,
        bob: .6 + simRnd() * .9,
        rippleTimer: 3 + simRnd() * 9,
        sprite,
        kind: 'leaf'
      });
    });

    FLOWER_DEFS.forEach((def, i) => {
      const radius = U * def.r * (.95 + simRnd() * .1);
      const sprite = def.kind === 'flower'
        ? makeFlowerSprite(0x7000 + i * 613, radius, def.variant)
        : makeBudSprite(0x9000 + i * 419, radius, def.variant);
      flowers.push({
        x: W * def.x + (simRnd() - .5) * W * .009,
        y: H * def.y + (simRnd() - .5) * H * .009,
        radius,
        rot: def.rot,
        alpha: def.alpha,
        phase: simRnd() * TAU,
        kind: def.kind,
        sprite
      });
    });

    obstacles = [];
    leaves.forEach(l => {
      obstacles.push({
        x: l.x, y: l.y,
        solid: l.radius * .96,
        influence: l.radius * .96 + U * .15,
        kind: 'leaf', ref: l
      });
    });
    flowers.forEach(f => {
      const solid = f.kind === 'flower' ? f.radius * .90 : f.radius * .70;
      obstacles.push({
        x: f.x, y: f.y,
        solid,
        influence: solid + U * .11,
        kind: f.kind, ref: f
      });
    });

    buildBackground();
    buildOverlay();
    buildFloaters();

    group.x = W * .48;
    group.y = H * .46;
    group.angle = -.22;
    group.speed = 62 * S;
    group.phase = 0;
    updateGroup(0);

    mood.mode = 'school';
    mood.intensity = 1;
    mood.target = 1;
    mood.timer = 11 + simRnd() * 3;

    createFishes();
    ripples = [];
    bubbles = [];
    ambientTimer = 2.5 + simRnd() * 2;
  }

  /* ------------------------------------------------------------------ *
   *  Small things adrift: duckweed and fallen petals
   * ------------------------------------------------------------------ */
  function buildFloaters() {
    floaters = [];
    const rng = mulberry32(0x7ac31d);
    const margin = 18 * S;

    for (let i = 0; i < 11; i++) {
      let x, y;
      if (i < 7 && leaves.length) {
        const leaf = leaves[i % leaves.length];
        const a = rng() * TAU;
        const rr = leaf.radius * (1.02 + rng() * .35);
        x = leaf.x + Math.cos(a) * rr;
        y = leaf.y + Math.sin(a) * rr;
      } else {
        x = lerp(W * .08, W * .92, rng());
        y = lerp(H * .10, H * .90, rng());
      }
      x = clamp(x, margin, W - margin);
      y = clamp(y, margin, H - margin);
      const dots = [];
      const n = 4 + Math.floor(rng() * 5);
      const spread = (8 + rng() * 20) * S;
      for (let k = 0; k < n; k++) {
        dots.push({
          x: (rng() - .5) * spread,
          y: (rng() - .5) * spread * .7,
          r: (1.1 + rng() * 2.5) * S,
          tone: rng()
        });
      }
      floaters.push({
        type: 'duckweed',
        x, y,
        rot: rng() * TAU,
        phase: rng() * TAU,
        driftAngle: rng() * TAU,
        speed: (1 + rng() * 2.2) * S,
        bob: .5 + rng() * 1.4,
        dots
      });
    }

    for (let i = 0; i < 5; i++) {
      const x = lerp(W * .16, W * .84, rng());
      const y = lerp(H * .18, H * .82, rng());
      floaters.push({
        type: 'petal',
        x, y,
        len: (8 + rng() * 9) * S,
        width: (3 + rng() * 2.2) * S,
        rot: rng() * TAU,
        phase: rng() * TAU,
        driftAngle: rng() * TAU,
        speed: (2.2 + rng() * 2.8) * S,
        spin: (rng() - .5) * .10,
        pale: rng() > .45
      });
    }
  }

  function updateFloaters(dt) {
    const margin = 26 * S;
    for (const f of floaters) {
      const current = f.driftAngle + (noise2(time * .035, f.phase * 2.3, 44) - .5) * 1.2;
      const windPush = (7 + 22 * wind.strength) * S;
      f.x += (Math.cos(current) * f.speed + wind.x * windPush) * dt;
      f.y += (Math.sin(current) * f.speed + wind.y * windPush) * dt;
      f.rot += (f.spin || 0) * dt
        + (noise2(time * .06, f.phase, 51) - .5) * .0012
        + wind.x * .006 * dt;
      if (f.x < -margin) f.x = W + margin;
      if (f.x > W + margin) f.x = -margin;
      if (f.y < -margin) f.y = H + margin;
      if (f.y > H + margin) f.y = -margin;
    }
  }

  function drawFloaters() {
    for (const f of floaters) {
      if (f.type === 'duckweed') {
        const bob = Math.sin(time * .72 - (f.x + f.y) / (U * .7)) * .65 * S * (.4 + wind.strength);
        ctx.save();
        ctx.translate(f.x, f.y + bob);
        ctx.rotate(f.rot + wind.x * .20 + Math.sin(time * .6 - (f.x + f.y) / (U * .5)) * .008 * (.3 + wind.strength));
        for (const dot of f.dots) {
          ctx.beginPath();
          ctx.ellipse(dot.x, dot.y, dot.r * 1.15, dot.r * .85, dot.tone * TAU, 0, TAU);
          ctx.fillStyle = dot.tone > .5
            ? 'rgba(101,123,88,0.50)'
            : 'rgba(81,103,77,0.55)';
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(dot.x - dot.r * .25, dot.y - dot.r * .25, dot.r * .38, dot.r * .25, 0, 0, TAU);
          ctx.fillStyle = 'rgba(226,229,202,0.26)';
          ctx.fill();
        }
        ctx.restore();
      } else {
        const bob = Math.sin(time * .78 - (f.x + f.y) / (U * .8)) * .8 * S * (.4 + wind.strength);
        ctx.save();
        ctx.translate(f.x, f.y + bob);
        ctx.rotate(f.rot);
        ctx.beginPath();
        ctx.moveTo(0, -f.len * .5);
        ctx.bezierCurveTo(f.width, -f.len * .08, f.width * .65, f.len * .42, 0, f.len * .5);
        ctx.bezierCurveTo(-f.width * .65, f.len * .42, -f.width, -f.len * .08, 0, -f.len * .5);
        ctx.closePath();
        const gr = ctx.createLinearGradient(0, -f.len * .5, 0, f.len * .5);
        if (f.pale) {
          gr.addColorStop(0, 'rgba(240,221,208,0.64)');
          gr.addColorStop(1, 'rgba(210,164,155,0.54)');
        } else {
          gr.addColorStop(0, 'rgba(223,198,187,0.58)');
          gr.addColorStop(1, 'rgba(190,137,130,0.52)');
        }
        ctx.fillStyle = gr;
        ctx.fill();
        ctx.strokeStyle = 'rgba(109,72,62,0.22)';
        ctx.lineWidth = .5;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -f.len * .34);
        ctx.quadraticCurveTo(f.width * .35, 0, 0, f.len * .34);
        ctx.strokeStyle = 'rgba(151,102,91,0.20)';
        ctx.lineWidth = .45;
        ctx.stroke();
        ctx.restore();
      }
    }
  }
