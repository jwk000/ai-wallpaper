<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>会遗忘的花园 · A Garden That Forgets</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;color:#f2eadb;font-family:system-ui,"Microsoft YaHei",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button,select,input{font:inherit;accent-color:#b9caa2}button,select{color:inherit;background:#ffffff0c;border:1px solid #ffffff24;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover{background:#ffffff1c}button:focus-visible,select:focus-visible{outline:2px solid #b9caa2;outline-offset:4px}#settings{position:fixed;right:20px;bottom:20px;opacity:0;transition:opacity .3s;background:#111820b8;backdrop-filter:blur(12px)}body:hover #settings,body:focus-within #settings,body.intro #settings{opacity:.75}#panel{position:fixed;bottom:72px;right:20px;width:min(330px,calc(100vw - 40px));max-height:calc(100vh - 100px);overflow:auto;background:#10151eea;border:1px solid #ffffff25;border-radius:14px;padding:22px;backdrop-filter:blur(20px);box-shadow:0 18px 70px #0006}#panel[hidden]{display:none}h1{font-family:serif;font-size:23px;font-weight:400;margin:0 0 5px}small{font-size:10px;letter-spacing:2px;color:#b9caa2}p{font-size:12px;line-height:1.8;color:#c3c6cd}.controls{display:flex;flex-wrap:wrap;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;margin:14px 0;font-size:12px}#status{display:block;margin-top:14px;color:#a4b1c1;font-size:11px}kbd{font-family:inherit;color:#eee}body.clean #settings{opacity:0;pointer-events:none}body.clean #panel{display:none}
</style></head><body class="intro"><canvas id="scene" aria-label="会遗忘的花园：递归枝条、叶序螺旋与数学花瓣组成的植物不断生长、盛开、遗忘，在原地留下漂散的孢子。"></canvas>
<button id="settings" type="button" aria-controls="panel" aria-expanded="false" title="显示设置（H）">☷ 设置</button>
<aside id="panel" hidden aria-label="壁纸设置"><h1>会遗忘的花园</h1><small>A Garden That Forgets</small><p>递归枝条、叶序螺旋与数学花瓣组成的植物不断生长、盛开、遗忘，在原地留下漂散的孢子。</p><div class="controls"><button id="pause" type="button">暂停</button><button id="event" type="button">夜花盛开</button><button id="reseed" type="button">变换构图</button></div><label class="row">时间流速<select id="speed"><option value="0.5">舒缓 · ½</option><option value="1" selected>自然 · 1</option><option value="2">轻快 · 2</option></select></label><label class="row">画质<select id="quality"><option value="high">精细</option><option value="low">节能</option></select></label><p><kbd>空格</kbd> 暂停 / 继续 · <kbd>H</kbd> 设置<br><kbd>E</kbd> 特殊事件 · <kbd>R</kbd> 变换构图</p><output id="status" aria-live="polite"></output></aside>
<script>(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const params = new URLSearchParams(location.search);
  const TAU = Math.PI * 2;
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const mix = (a, b, x) => a + (b - a) * x;
  const smooth = (a, b, x) => { const v = clamp((x - a) / (b - a)); return v * v * (3 - 2 * v); };
  const mod = (x, n) => ((x % n) + n) % n;
  function numberParam(key, fallback, lo, hi) {
    const v = params.has(key) ? Number(params.get(key)) : NaN;
    return Number.isFinite(v) ? clamp(v, lo, hi) : fallback;
  }
  let seed = numberParam('seed', 20261111, 1, 4294967295) >>> 0;
  function randomSource(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let v = Math.imul(s ^ s >>> 15, 1 | s); v ^= v + Math.imul(v ^ v >>> 7, 61 | v); return ((v ^ v >>> 14) >>> 0) / 4294967296; }; }
  let rand = randomSource(seed);
  // Smooth, bounded harmonic field: no texture or network input.
  const field = (x, y = 0) => Math.sin(x * 1.73 + y * .73) * .5 + Math.sin(x * 3.17 - y * 1.37) * .27 + Math.sin(x * 7.13 + y * 2.71) * .13 + Math.cos(x * 13.31 - y) * .1;
  const rgba = (r, g, b, a) => `rgba(${r},${g},${b},${clamp(a)})`;
  let w = 1, h = 1, unit = 1, dpr = 1;
  let t = numberParam('t', 24, 0, 1e8), speed = 1, frames = 0, raf = 0, last = null;
  let quality = params.get('quality') === 'low' ? 'low' : 'high';
  const media = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = params.has('still') ? params.get('still') !== '0' : media.matches;
  let manualMotion = params.has('still');
  let specialStart = -1e9, drawMs = 0, clockDate = new Date();
  const pointer = { x: 0, y: 0, active: false };
  const panel = document.getElementById('panel');
  const status = document.getElementById('status');
  function circle(x, y, r, color) { if (r <= 0) return; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function ellipse(x, y, rx, ry, color, rotation = 0) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rotation, 0, TAU); ctx.fill(); }
  function glow(x, y, r, color) { const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(.1, r)); g.addColorStop(0, color); g.addColorStop(1, 'transparent'); circle(x, y, r, g); }
  function background(top, bottom) { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, top); g.addColorStop(1, bottom); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }
  function stroke(color, width = 1) { ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(); }
  function eventPhase(time, period, duration, offset = 0) {
    const manual = time - specialStart;
    if (manual >= 0 && manual <= duration) return manual / duration;
    const cycle = mod(time + offset, period);
    return cycle < duration ? cycle / duration : -1;
  }
  const bell = p => p < 0 ? 0 : Math.sin(clamp(p) * Math.PI) ** 2;
  function stars(list, time, alpha = .6) {
    for (const p of list) circle(p.x * w, p.y * h, p.r, rgba(174, 191, 214, alpha * (.65 + .35 * Math.sin(time * .25 + p.a))));
  }
  function makeStars(count) { return Array.from({ length: count }, () => ({ x: rand(), y: rand(), r: .3 + rand() * 1.1, a: rand() * TAU })); }
  function vignette(alpha = .35) { const g = ctx.createRadialGradient(w / 2, h * .46, unit * .2, w / 2, h / 2, Math.hypot(w, h) * .55); g.addColorStop(0, 'transparent'); g.addColorStop(1, `rgba(0,0,0,${alpha})`); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }

  function createArtwork() {
  let plants, motes;
  function reset() {
    plants = Array.from({ length: 11 }, (_, i) => ({ x: .10 + i * .08 + (rand() - .5) * .035, height: .21 + rand() * .35, phase: i / 11 * 180, lean: (rand() - .5) * .36, hue: [35, 74, 158, 198][i % 4], petals: 7 + Math.floor(rand() * 7), a: rand() * TAU }));
    motes = Array.from({ length: 145 }, () => ({ x: rand(), y: rand(), a: rand() * TAU, r: .4 + rand() * 1.1 }));
  }
  reset();
  function flower(x, y, r, p, open, fade, time) {
    if (open < .01) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.a + time * .008);
    const radius = r * (.15 + .85 * open);
    for (let layer = 0; layer < 2; layer++) {
      ctx.beginPath();
      for (let i = 0; i <= 260; i++) {
        const a = i / 260 * TAU, lobe = .47 + .53 * Math.pow(.5 + .5 * Math.cos(p.petals * a + layer * Math.PI), .65);
        const rr = radius * lobe * (1 - layer * .29);
        const xx = Math.cos(a) * rr, yy = Math.sin(a) * rr * .78;
        i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
      }
      ctx.closePath(); ctx.fillStyle = `hsla(${p.hue},30%,62%,${.085 * fade})`; ctx.fill(); stroke(`hsla(${p.hue},36%,80%,${.84 * fade})`, .85);
      ctx.beginPath();
      for (let j = 0; j < p.petals; j++) {
        const a = j / p.petals * TAU + layer * Math.PI / p.petals;
        ctx.moveTo(Math.cos(a) * radius * .15, Math.sin(a) * radius * .12);
        ctx.quadraticCurveTo(Math.cos(a + .1) * radius * .5, Math.sin(a + .1) * radius * .4, Math.cos(a) * radius * (1 - layer * .29), Math.sin(a) * radius * .78 * (1 - layer * .29));
      }
      stroke(`hsla(${p.hue},29%,77%,${.3 * fade})`, .65);
    }
    // Vogel's golden-angle phyllotaxis, with no repeated angular rows.
    ctx.beginPath();
    for (let j = 1; j < 72; j++) {
      const a = j * 2.399963229728653, rr = Math.sqrt(j / 72) * radius * .23;
      ctx.rect(Math.cos(a) * rr, Math.sin(a) * rr * .8, Math.max(.6, radius * .025), Math.max(.6, radius * .025));
    }
    ctx.fillStyle = `rgba(227,211,151,${fade * .75})`; ctx.fill(); ctx.restore();
  }
  function branch(x, y, length, angle, depth, grow, fade, p, time) {
    if (grow <= .01 || depth < 0) return;
    const sway = Math.sin(time * .21 + p.a + depth) * .035;
    const endX = x + Math.sin(angle + sway) * length * grow, endY = y - Math.cos(angle) * length * grow;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.sin(angle - .12) * length * .55 * grow, y - length * .55 * grow, endX, endY);
    stroke(`rgba(154,180,142,${fade * (.32 + depth * .14)})`, .7 + depth * .4);
    for (let j = 1; j <= 3; j++) {
      const f = j / 4, lx = mix(x, endX, f), ly = mix(y, endY, f), sign = j % 2 ? 1 : -1;
      const leaf = length * .19 * grow;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.quadraticCurveTo(lx + sign * leaf * .9, ly - leaf * .1, lx + sign * leaf, ly - leaf * .8); ctx.quadraticCurveTo(lx + sign * leaf * .3, ly - leaf * .9, lx, ly);
      ctx.fillStyle = `rgba(123,153,119,${fade * .085})`; ctx.fill(); stroke(`rgba(160,187,143,${fade * .56})`, .7);
    }
    if (depth > 0) {
      branch(endX, endY, length * .62, angle - .46, depth - 1, clamp(grow * 1.8 - .65), fade, p, time);
      branch(endX, endY, length * .64, angle + .52, depth - 1, clamp(grow * 1.8 - .65), fade, p, time);
    } else flower(endX, endY, unit * (.023 + p.height * .045), p, smooth(.55, 1, grow), fade, time);
  }
  return {
    reset, eventDuration: 24,
    snapshot: () => ({ plants: plants.length, motes: motes.length, ages: plants.map(p => mod(t + p.phase, 180) / 180) }),
    draw(time) {
      background('#101c1b', '#070f12');
      glow(w * .48, h * .52, unit * .68, 'rgba(86,112,85,.12)');
      const ground = h * .88;
      ctx.beginPath(); ctx.moveTo(0, ground); ctx.bezierCurveTo(w * .3, ground - 8, w * .7, ground + 4, w, ground - 4); stroke('rgba(144,161,134,.12)', .7);
      for (const p of plants) {
        const age = mod(time + p.phase, 180) / 180;
        const grow = smooth(0, .47, age), fade = 1 - smooth(.72, 1, age);
        const x = p.x * w, y = ground + Math.sin(p.a) * h * .02;
        branch(x, y, p.height * h * .5, p.lean, 2, grow, fade, p, time);
        // The central bloom remains individually legible above its branching stem.
        const tipX = x + Math.sin(p.lean) * p.height * h * grow;
        const tipY = y - p.height * h * grow;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - p.lean * h * .15, y - p.height * h * .6 * grow, tipX, tipY); stroke(`rgba(164,182,139,${fade * .65})`, 1);
        flower(tipX, tipY, unit * (.03 + p.height * .055), p, smooth(.22, .5, age), fade, time);
        if (age > .72) {
          const drift = (age - .72) / .28;
          for (let i = 0; i < 35; i++) {
            const a = i * 2.39996, rr = Math.sqrt(i / 35) * unit * .04;
            const xx = tipX + Math.cos(a) * rr + drift * unit * (.1 + .08 * Math.sin(i));
            const yy = tipY + Math.sin(a) * rr - drift * unit * (.06 + i / 35 * .1);
            circle(xx, yy, .7, `rgba(208,215,169,${Math.sin(drift * Math.PI) * .55})`);
          }
        }
      }
      const rare = bell(eventPhase(time, 260, 24, 75));
      if (rare > 0) {
        const p = { a: -.3, petals: 17, hue: 185, height: .5 };
        const xx = w * .56, yy = h * .3;
        ctx.beginPath(); ctx.moveTo(w * .53, ground); ctx.quadraticCurveTo(w * .49, h * .46, xx, yy); stroke(`rgba(157,208,196,${rare * .4})`, 1);
        glow(xx, yy, unit * .12, `rgba(137,221,205,${rare * .16})`);
        flower(xx, yy, unit * .078, p, rare, rare, time);
      }
      for (const m of motes) {
        const x = mod(m.x + time * .002 + Math.sin(time * .12 + m.a) * .012, 1), y = mod(m.y - time * .003, 1);
        circle(x * w, y * h, m.r, `rgba(178,201,153,${.12 + .16 * Math.sin(time * .2 + m.a) ** 2})`);
      }
      vignette(.52);
    },
  };
}


  const art = createArtwork();
  function draw() {
    const begin = performance.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    art.draw(t);
    drawMs = performance.now() - begin;
    frames++;
  }
  function resize() {
    w = Math.max(1, innerWidth); h = Math.max(1, innerHeight); unit = Math.min(w, h);
    const budget = quality === 'low' ? 1200000 : 2600000;
    dpr = Math.min(devicePixelRatio || 1, 2, Math.sqrt(budget / (w * h)));
    canvas.width = Math.max(1, Math.floor(w * dpr)); canvas.height = Math.max(1, Math.floor(h * dpr));
    art.resize?.(); draw();
  }
  function syncPanel() {
    document.getElementById('pause').textContent = paused ? '继续' : '暂停';
    document.getElementById('pause').setAttribute('aria-pressed', String(paused));
    document.getElementById('settings').setAttribute('aria-expanded', String(!panel.hidden));
    status.textContent = art.status?.() || (paused ? '画面已暂停' : '离线绘制 · 30 FPS');
  }
  function loop(now) {
    raf = 0;
    if (paused || document.hidden) { last = null; return; }
    if (last === null) last = now;
    if (now - last >= 1000 / 30 - .5) {
      const dt = Math.min(.1, (now - last) / 1000); last = now;
      t += dt * speed; clockDate = new Date(); art.update?.(dt, t); draw();
      if (!panel.hidden) syncPanel();
    }
    raf = requestAnimationFrame(loop);
  }
  function schedule() { if (!raf && !paused && !document.hidden) { last = null; raf = requestAnimationFrame(loop); } }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; last = null; }
  function togglePause() { paused = !paused; manualMotion = true; if (paused) { stop(); art.flush?.(); } else { clockDate = new Date(); schedule(); } syncPanel(); }
  function trigger() { specialStart = t - (paused ? (art.eventDuration || 20) * .5 : 0); draw(); syncPanel(); }
  function reseed() { seed = (seed + 2654435761) >>> 0; rand = randomSource(seed); art.reset?.(); art.resize?.(); draw(); }
  function togglePanel() { document.body.classList.remove('clean'); panel.hidden = !panel.hidden; syncPanel(); }
  document.getElementById('settings').addEventListener('click', togglePanel);
  document.getElementById('pause').addEventListener('click', togglePause);
  document.getElementById('event').addEventListener('click', trigger);
  document.getElementById('reseed').addEventListener('click', reseed);
  document.getElementById('speed').addEventListener('change', e => { speed = Number(e.target.value); });
  document.getElementById('quality').value = quality;
  document.getElementById('quality').addEventListener('change', e => { quality = e.target.value; resize(); });
  addEventListener('keydown', e => {
    if (e.repeat || /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key.toLowerCase() === 'h') togglePanel();
    else if (e.key.toLowerCase() === 'e') trigger();
    else if (e.key.toLowerCase() === 'r') reseed();
  });
  canvas.addEventListener('pointermove', e => { pointer.x = (e.clientX / w - .5) * 2; pointer.y = (e.clientY / h - .5) * 2; pointer.active = true; });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.x = pointer.y = 0; });
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); art.flush?.(); } else { clockDate = new Date(); if (!paused) draw(); schedule(); } });
  addEventListener('pagehide', () => { stop(); art.flush?.(); });
  media.addEventListener('change', e => { if (!manualMotion) { paused = e.matches; if (paused) stop(); else schedule(); syncPanel(); } });
  if (params.get('hud') === '0') document.body.classList.add('clean');
  setTimeout(() => document.body.classList.remove('intro'), 4500);
  // Small diagnostics surface for deterministic captures and long-duration checks.
  window.__dreamAtlas = {
    snapshot: () => ({ id: 'forgetting-garden', seed, t, paused, frames, w, h, dpr, quality, speed, drawMs, scheduled: !!raf, specialStart, ...art.snapshot?.() }),
    seek(time) { if (!Number.isFinite(time) || time < 0) throw new Error('Invalid time'); t = time; draw(); },
    render: draw,
    trigger,
    // Advance active time only for persistence verification; normal playback uses RAF.
    advance(seconds) { if (!Number.isFinite(seconds) || seconds < 0 || seconds > 86400) throw new Error('Invalid duration'); t += seconds * speed; art.update?.(seconds, t); draw(); },
    flush() { art.flush?.(); },
  };
  resize(); syncPanel(); schedule();
})();
</script></body></html>
