<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>月球上的潮汐钟 · A Lunar Tide Clock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;color:#f2eadb;font-family:system-ui,"Microsoft YaHei",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button,select,input{font:inherit;accent-color:#c6c3b4}button,select{color:inherit;background:#ffffff0c;border:1px solid #ffffff24;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover{background:#ffffff1c}button:focus-visible,select:focus-visible{outline:2px solid #c6c3b4;outline-offset:4px}#settings{position:fixed;right:20px;bottom:20px;opacity:0;transition:opacity .3s;background:#111820b8;backdrop-filter:blur(12px)}body:hover #settings,body:focus-within #settings,body.intro #settings{opacity:.75}#panel{position:fixed;bottom:72px;right:20px;width:min(330px,calc(100vw - 40px));max-height:calc(100vh - 100px);overflow:auto;background:#10151eea;border:1px solid #ffffff25;border-radius:14px;padding:22px;backdrop-filter:blur(20px);box-shadow:0 18px 70px #0006}#panel[hidden]{display:none}h1{font-family:serif;font-size:23px;font-weight:400;margin:0 0 5px}small{font-size:10px;letter-spacing:2px;color:#c6c3b4}p{font-size:12px;line-height:1.8;color:#c3c6cd}.controls{display:flex;flex-wrap:wrap;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;margin:14px 0;font-size:12px}#status{display:block;margin-top:14px;color:#a4b1c1;font-size:11px}kbd{font-family:inherit;color:#eee}body.clean #settings{opacity:0;pointer-events:none}body.clean #panel{display:none}
</style></head><body class="intro"><canvas id="scene" aria-label="月球上的潮汐钟：低悬的月亮照着银灰沙地，潮汐梳理出唱片般的沙纹；月面明暗显示本地小时，沙上的光圈记录分钟。"></canvas>
<button id="settings" type="button" aria-controls="panel" aria-expanded="false" title="显示设置（H）">☷ 设置</button>
<aside id="panel" hidden aria-label="壁纸设置"><h1>月球上的潮汐钟</h1><small>A Lunar Tide Clock</small><p>低悬的月亮照着银灰沙地，潮汐梳理出唱片般的沙纹；月面明暗显示本地小时，沙上的光圈记录分钟。</p><div class="controls"><button id="pause" type="button">暂停</button><button id="event" type="button">月尘流星</button><button id="reseed" type="button">变换构图</button></div><label class="row">时间流速<select id="speed"><option value="0.5">舒缓 · ½</option><option value="1" selected>自然 · 1</option><option value="2">轻快 · 2</option></select></label><label class="row">画质<select id="quality"><option value="high">精细</option><option value="low">节能</option></select></label><p><kbd>空格</kbd> 暂停 / 继续 · <kbd>H</kbd> 设置<br><kbd>E</kbd> 特殊事件 · <kbd>R</kbd> 变换构图</p><output id="status" aria-live="polite"></output></aside>
<script>(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const params = new URLSearchParams(location.search);
  const TAU = Math.PI * 2;
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const mix = (a, b, x) => a + (b - a) * x;
  const smooth = (a, b, x) => { const v = clamp((x - a) / (b - a)); return v * v * (3 - 2 * v); };
  const mod = (x, n) => ((x % n) + n) % n;
  function numberParam(key, fallback, lo, hi) {
    const v = params.has(key) ? Number(params.get(key)) : NaN;
    return Number.isFinite(v) ? clamp(v, lo, hi) : fallback;
  }
  let seed = numberParam('seed', 20261111, 1, 4294967295) >>> 0;
  function randomSource(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let v = Math.imul(s ^ s >>> 15, 1 | s); v ^= v + Math.imul(v ^ v >>> 7, 61 | v); return ((v ^ v >>> 14) >>> 0) / 4294967296; }; }
  let rand = randomSource(seed);
  // Smooth, bounded harmonic field: no texture or network input.
  const field = (x, y = 0) => Math.sin(x * 1.73 + y * .73) * .5 + Math.sin(x * 3.17 - y * 1.37) * .27 + Math.sin(x * 7.13 + y * 2.71) * .13 + Math.cos(x * 13.31 - y) * .1;
  const rgba = (r, g, b, a) => `rgba(${r},${g},${b},${clamp(a)})`;
  let w = 1, h = 1, unit = 1, dpr = 1;
  let t = numberParam('t', 24, 0, 1e8), speed = 1, frames = 0, raf = 0, last = null;
  let quality = params.get('quality') === 'low' ? 'low' : 'high';
  const media = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = params.has('still') ? params.get('still') !== '0' : media.matches;
  let manualMotion = params.has('still');
  let specialStart = -1e9, drawMs = 0, clockDate = new Date();
  const pointer = { x: 0, y: 0, active: false };
  const panel = document.getElementById('panel');
  const status = document.getElementById('status');
  function circle(x, y, r, color) { if (r <= 0) return; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function ellipse(x, y, rx, ry, color, rotation = 0) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rotation, 0, TAU); ctx.fill(); }
  function glow(x, y, r, color) { const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(.1, r)); g.addColorStop(0, color); g.addColorStop(1, 'transparent'); circle(x, y, r, g); }
  function background(top, bottom) { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, top); g.addColorStop(1, bottom); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }
  function stroke(color, width = 1) { ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(); }
  function eventPhase(time, period, duration, offset = 0) {
    const manual = time - specialStart;
    if (manual >= 0 && manual <= duration) return manual / duration;
    const cycle = mod(time + offset, period);
    return cycle < duration ? cycle / duration : -1;
  }
  const bell = p => p < 0 ? 0 : Math.sin(clamp(p) * Math.PI) ** 2;
  function stars(list, time, alpha = .6) {
    for (const p of list) circle(p.x * w, p.y * h, p.r, rgba(174, 191, 214, alpha * (.65 + .35 * Math.sin(time * .25 + p.a))));
  }
  function makeStars(count) { return Array.from({ length: count }, () => ({ x: rand(), y: rand(), r: .3 + rand() * 1.1, a: rand() * TAU })); }
  function vignette(alpha = .35) { const g = ctx.createRadialGradient(w / 2, h * .46, unit * .2, w / 2, h / 2, Math.hypot(w, h) * .55); g.addColorStop(0, 'transparent'); g.addColorStop(1, `rgba(0,0,0,${alpha})`); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }

  function createArtwork() {
  let sky, craters, moon, cachedMinute = -1;
  function reset() { sky = makeStars(150); craters = Array.from({ length: 45 }, () => ({ x: (rand() - .5) * 1.7, y: (rand() - .5) * 1.7, r: .013 + rand() ** 2 * .15 })); cachedMinute = -1; }
  reset();
  function lunarTexture(date) {
    const minute = date.getHours() * 60 + date.getMinutes();
    if (minute === cachedMinute && moon) return;
    cachedMinute = minute;
    moon = document.createElement('canvas'); moon.width = moon.height = 400;
    const mc = moon.getContext('2d'), data = mc.createImageData(400, 400);
    const angle = minute / 1440 * TAU - Math.PI / 2;
    for (let y = 0; y < 400; y++) for (let x = 0; x < 400; x++) {
      const nx = (x - 199.5) / 199, ny = (y - 199.5) / 199, r2 = nx * nx + ny * ny;
      if (r2 >= 1) continue;
      const nz = Math.sqrt(1 - r2), light = Math.max(0, nx * Math.cos(angle) * .94 - ny * .22 + nz * Math.sin(angle) * .94);
      const surface = .84 + field(nx * 8 + seed % 33, ny * 8) * .12;
      const value = (32 + Math.pow(light, .6) * 191) * surface;
      const i = (y * 400 + x) * 4;
      data.data[i] = value * 1.03; data.data[i + 1] = value * 1.02; data.data[i + 2] = value; data.data[i + 3] = clamp((1 - r2) * 200) * 255;
    }
    mc.putImageData(data, 0, 0); mc.save(); mc.beginPath(); mc.arc(200, 200, 198, 0, TAU); mc.clip();
    for (const c of craters) {
      const x = 200 + c.x * 200, y = 200 + c.y * 200, rr = c.r * 200;
      mc.beginPath(); mc.ellipse(x, y, rr, rr * .79, .2, 0, TAU); mc.fillStyle = 'rgba(8,10,14,.13)'; mc.fill();
      mc.beginPath(); mc.ellipse(x, y + .8, rr, rr * .79, .2, .1, Math.PI); mc.strokeStyle = 'rgba(236,228,205,.11)'; mc.lineWidth = 1; mc.stroke();
    }
    mc.restore();
  }
  return {
    reset, eventDuration: 14,
    snapshot: () => ({ hour: clockDate.getHours(), minute: clockDate.getMinutes(), second: clockDate.getSeconds(), sandRings: quality === 'low' ? 95 : 155 }),
    draw(time) {
      background('#0a0e16', '#22262a'); stars(sky, time, .4);
      const mx = w * .51, my = h * .29, radius = unit * .174;
      glow(mx, my, radius * 1.9, 'rgba(161,169,175,.08)'); lunarTexture(clockDate);
      ctx.drawImage(moon, mx - radius, my - radius, radius * 2, radius * 2);
      // Long low dunes form a quiet horizon beneath the moon.
      ctx.beginPath(); ctx.moveTo(0, h);
      for (let x = 0; x <= w + 8; x += 8) ctx.lineTo(x, h * (.58 + .018 * field(x / w * 5 + 3)));
      ctx.lineTo(w, h); ctx.closePath();
      const sand = ctx.createLinearGradient(0, h * .56, 0, h); sand.addColorStop(0, '#5d5d56'); sand.addColorStop(.22, '#77766a'); sand.addColorStop(1, '#343b3e'); ctx.fillStyle = sand; ctx.fill();
      const cx = w * .51, cy = h * .78, spread = Math.max(w * .6, h * .42), count = quality === 'low' ? 95 : 155;
      ctx.save(); ctx.beginPath(); ctx.rect(0, h * .605, w, h); ctx.clip();
      for (let i = 0; i < count; i++) {
        const r = .03 + i / count * 1.48;
        ctx.beginPath();
        for (let j = 0; j <= 210; j++) {
          const a = j / 210 * TAU;
          const ripple = .0035 * Math.sin(a * 9 + r * 23 - time * .09) + .002 * Math.sin(a * 17 - time * .07);
          const rr = r + ripple;
          const x = cx + Math.cos(a) * rr * spread;
          const y = cy + Math.sin(a) * rr * unit * .22;
          j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        stroke(i % 3 ? 'rgba(214,209,184,.19)' : 'rgba(26,34,38,.37)', i % 3 ? .7 : 1);
      }
      const minute = (clockDate.getMinutes() + clockDate.getSeconds() / 60) / 60;
      ctx.beginPath(); ctx.ellipse(cx, cy, spread * (.09 + minute * .88), unit * .22 * (.09 + minute * .88), 0, 0, TAU); stroke('rgba(230,226,201,.53)', 1.1);
      const hour = clockDate.getHours() + clockDate.getMinutes() / 60;
      for (let i = 0; i < 24; i++) {
        const a = i / 24 * TAU - Math.PI / 2;
        circle(cx + Math.cos(a) * spread * .69, cy + Math.sin(a) * unit * .152, i % 6 ? 1 : 1.8, '#ded8b95c');
      }
      const a = hour / 24 * TAU - Math.PI / 2;
      const hx = cx + Math.cos(a) * spread * .69, hy = cy + Math.sin(a) * unit * .152;
      glow(hx, hy, unit * .022, 'rgba(239,225,177,.34)'); circle(hx, hy, 2, '#e4dbb9');
      ctx.restore();
      const p = eventPhase(time, 240, 14, 70);
      if (p >= 0) {
        const xx = w * (.17 + p * .58), yy = h * (.13 + p * .27), fade = bell(p);
        ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx - w * .11, yy - h * .052); stroke(`rgba(210,218,220,${fade * .48})`, .8);
        glow(xx, yy, unit * .015, `rgba(231,224,200,${fade * .48})`);
      }
      vignette(.44);
    },
  };
}


  const art = createArtwork();
  function draw() {
    const begin = performance.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    art.draw(t);
    drawMs = performance.now() - begin;
    frames++;
  }
  function resize() {
    w = Math.max(1, innerWidth); h = Math.max(1, innerHeight); unit = Math.min(w, h);
    const budget = quality === 'low' ? 1200000 : 2600000;
    dpr = Math.min(devicePixelRatio || 1, 2, Math.sqrt(budget / (w * h)));
    canvas.width = Math.max(1, Math.floor(w * dpr)); canvas.height = Math.max(1, Math.floor(h * dpr));
    art.resize?.(); draw();
  }
  function syncPanel() {
    document.getElementById('pause').textContent = paused ? '继续' : '暂停';
    document.getElementById('pause').setAttribute('aria-pressed', String(paused));
    document.getElementById('settings').setAttribute('aria-expanded', String(!panel.hidden));
    status.textContent = art.status?.() || (paused ? '画面已暂停' : '离线绘制 · 30 FPS');
  }
  function loop(now) {
    raf = 0;
    if (paused || document.hidden) { last = null; return; }
    if (last === null) last = now;
    if (now - last >= 1000 / 30 - .5) {
      const dt = Math.min(.1, (now - last) / 1000); last = now;
      t += dt * speed; clockDate = new Date(); art.update?.(dt, t); draw();
      if (!panel.hidden) syncPanel();
    }
    raf = requestAnimationFrame(loop);
  }
  function schedule() { if (!raf && !paused && !document.hidden) { last = null; raf = requestAnimationFrame(loop); } }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; last = null; }
  function togglePause() { paused = !paused; manualMotion = true; if (paused) { stop(); art.flush?.(); } else { clockDate = new Date(); schedule(); } syncPanel(); }
  function trigger() { specialStart = t - (paused ? (art.eventDuration || 20) * .5 : 0); draw(); syncPanel(); }
  function reseed() { seed = (seed + 2654435761) >>> 0; rand = randomSource(seed); art.reset?.(); art.resize?.(); draw(); }
  function togglePanel() { document.body.classList.remove('clean'); panel.hidden = !panel.hidden; syncPanel(); }
  document.getElementById('settings').addEventListener('click', togglePanel);
  document.getElementById('pause').addEventListener('click', togglePause);
  document.getElementById('event').addEventListener('click', trigger);
  document.getElementById('reseed').addEventListener('click', reseed);
  document.getElementById('speed').addEventListener('change', e => { speed = Number(e.target.value); });
  document.getElementById('quality').value = quality;
  document.getElementById('quality').addEventListener('change', e => { quality = e.target.value; resize(); });
  addEventListener('keydown', e => {
    if (e.repeat || /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key.toLowerCase() === 'h') togglePanel();
    else if (e.key.toLowerCase() === 'e') trigger();
    else if (e.key.toLowerCase() === 'r') reseed();
  });
  canvas.addEventListener('pointermove', e => { pointer.x = (e.clientX / w - .5) * 2; pointer.y = (e.clientY / h - .5) * 2; pointer.active = true; });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.x = pointer.y = 0; });
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); art.flush?.(); } else { clockDate = new Date(); if (!paused) draw(); schedule(); } });
  addEventListener('pagehide', () => { stop(); art.flush?.(); });
  media.addEventListener('change', e => { if (!manualMotion) { paused = e.matches; if (paused) stop(); else schedule(); syncPanel(); } });
  if (params.get('hud') === '0') document.body.classList.add('clean');
  setTimeout(() => document.body.classList.remove('intro'), 4500);
  // Small diagnostics surface for deterministic captures and long-duration checks.
  window.__dreamAtlas = {
    snapshot: () => ({ id: 'lunar-tide-clock', seed, t, paused, frames, w, h, dpr, quality, speed, drawMs, scheduled: !!raf, specialStart, ...art.snapshot?.() }),
    seek(time) { if (!Number.isFinite(time) || time < 0) throw new Error('Invalid time'); t = time; draw(); },
    render: draw,
    trigger,
    // Advance active time only for persistence verification; normal playback uses RAF.
    advance(seconds) { if (!Number.isFinite(seconds) || seconds < 0 || seconds > 86400) throw new Error('Invalid duration'); t += seconds * speed; art.update?.(seconds, t); draw(); },
    flush() { art.flush?.(); },
  };
  resize(); syncPanel(); schedule();
})();
</script></body></html>
