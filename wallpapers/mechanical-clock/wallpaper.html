<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05090a">
<title>机芯 · Skeleton Clock</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090a;color:#e7d8b8}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;opacity:0;transition:opacity 1.6s ease}
  body.ready canvas{opacity:1}
  .hud{position:fixed;pointer-events:none;z-index:2;opacity:0;transform:translateY(12px);transition:opacity 1.1s ease .5s,transform 1.1s ease .5s}
  body.ready .hud{opacity:1;transform:none}
  .brand{left:clamp(24px,4.5vw,112px);bottom:clamp(42px,9vh,126px);width:clamp(188px,17vw,310px)}
  .kicker{font-size:clamp(7px,.62vw,11px);letter-spacing:.34em;color:#998663;text-transform:uppercase;margin-bottom:14px;white-space:nowrap}
  .brand h1{margin:0;font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;font-weight:400;font-size:clamp(18px,1.55vw,30px);letter-spacing:.17em;line-height:1.25;color:#e4d2ae;text-transform:uppercase;white-space:nowrap}
  .brand .rule{height:1px;width:56px;margin:18px 0 17px;background:linear-gradient(90deg,rgba(217,183,123,.78),rgba(217,183,123,0))}
  .spec{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;font-size:clamp(6.5px,.53vw,9.5px);letter-spacing:.16em;color:#776b57;text-transform:uppercase}
  .spec b{font-weight:500;color:#b89b69;margin-right:6px;font-variant-numeric:tabular-nums}
  .readout{right:clamp(26px,4.5vw,110px);bottom:clamp(40px,8.5vh,118px);text-align:right}
  .readout .kicker{margin-bottom:10px;color:#93805f}
  .time{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:clamp(24px,2.3vw,44px);line-height:1;letter-spacing:.035em;color:#f0d9ac;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(230,178,92,.16)}
  .time i{font-style:normal;opacity:.38;padding:0 .045em}
  .date{margin-top:12px;font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;font-size:clamp(8px,.72vw,12px);letter-spacing:.24em;color:#9e8a68;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .date em{font-style:normal;color:#c5aa78}
  @media (max-aspect-ratio:3/2),(max-width:1050px){
    .brand{display:none}
    .readout{right:clamp(18px,4vw,46px);bottom:clamp(24px,5vh,48px)}
    .readout .time{font-size:clamp(22px,3.4vw,36px)}
  }
  @media (max-aspect-ratio:4/3){
    .readout{display:none}
  }
  @media (max-height:620px){
    .spec{display:none}
    .brand .rule{margin-bottom:0}
  }
  body.clean .hud{opacity:0!important}
</style>
</head>
<body>
<canvas id="stage" aria-label="机械时钟内部演示：旋转陀飞轮、月相、主发条盒与棘轮、上链轮系、齿轮组、擒纵叉与摆轮持续运转，并按系统本地时间显示时、分、秒与日期。"></canvas>

<div class="hud brand" aria-hidden="true">
  <div class="kicker">Mécanique à squelette · Tourbillon</div>
  <h1>Calibre Lumen 08</h1>
  <div class="rule"></div>
  <div class="spec">
    <span><b>01</b>Barrel</span>
    <span><b>02</b>Ratchet</span>
    <span><b>03</b>Train</span>
    <span><b>04</b>Escape</span>
    <span><b>05</b>Tourbillon</span>
    <span><b>06</b>Moonphase</span>
    <span><b>07</b>Jewels</span>
    <span><b>08</b>Regulator</span>
  </div>
</div>

<div class="hud readout" aria-live="off">
  <div class="kicker">Local time</div>
  <div class="time"><span id="hh">--</span><i>:</i><span id="mm">--</span><i>:</i><span id="ss">--</span></div>
  <div class="date"><em id="date">----.--.--</em> · <span id="weekday">---</span></div>
</div>

<script>
'use strict';
(() => {
  const TAU = Math.PI * 2;
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hhEl = document.getElementById('hh');
  const mmEl = document.getElementById('mm');
  const ssEl = document.getElementById('ss');
  const dateEl = document.getElementById('date');
  const weekdayEl = document.getElementById('weekday');

  let W = 0, H = 0, dpr = 1, S = 0, R = 0, viewScale = 1, cx = 0, cy = 0;
  let bg = null, baseLayer = null, bridgeLayer = null, glassLayer = null;
  let gearSprites = null, balanceSprite = null, cageSprite = null, dustSprite = null;
  let debugTime = null;
  let lastHudSecond = -1, lastDateKey = '';

  const D = 1000;                    // design radius
  const CASE_R = 1.075 * D;
  const CHAPTER_OUT = 1.0 * D;
  const CHAPTER_IN = 0.815 * D;
  const PLATE_R = 0.795 * D;

  const POS = {
    center: { x: 0, y: 0 },
    barrel: { x: -244, y: -153 },
    third:  { x: 196, y: 148 },
    fourth: { x: 126, y: 340 },
    escape: { x: -10, y: 428 },
    tourbillon: { x: -10, y: 428 },
    balance:{ x: -88, y: 494 },
    pallet: { x: -48, y: 461 },
    moon: { x: -360, y: 230 },
    crownWheel: { x: -334, y: -229 },
    power: { x: 360, y: -270 },
    date: { x: 500, y: 20 }
  };

  const MAT = {
    gold: {
      stops: [[0, '#f8e6b7'], [.26, '#d9b273'], [.58, '#a37338'], [.82, '#754a20'], [1, '#3c230f']],
      edge: '#ffe9b7', dark: '#2a180a', texture: 'rgba(255,244,214,.06)', label: 'rgba(255,235,189,.42)'
    },
    bronze: {
      stops: [[0, '#c9a971'], [.24, '#9b7546'], [.55, '#6b4a29'], [.82, '#3e2a16'], [1, '#1b1108']],
      edge: '#d9bd86', dark: '#130b05', texture: 'rgba(255,235,192,.05)', label: 'rgba(239,215,171,.38)'
    },
    rose: {
      stops: [[0, '#f7ddbe'], [.27, '#d2a47e'], [.6, '#946347'], [.84, '#5e3728'], [1, '#321b14']],
      edge: '#f8dfc1', dark: '#27130d', texture: 'rgba(255,238,219,.055)', label: 'rgba(255,230,205,.38)'
    },
    rhodium: {
      stops: [[0, '#dbe4e1'], [.25, '#9caaa8'], [.57, '#59686a'], [.82, '#303d40'], [1, '#151f22']],
      edge: '#e8eeea', dark: '#0c1416', texture: 'rgba(223,241,238,.055)', label: 'rgba(220,239,234,.34)'
    },
    steel: {
      stops: [[0, '#d8e3e5'], [.28, '#8fa0a4'], [.6, '#53656b'], [.85, '#29383d'], [1, '#111b1e']],
      edge: '#eef6f5', dark: '#0b1315', texture: 'rgba(230,246,246,.06)', label: 'rgba(228,244,244,.34)'
    },
    blued: {
      stops: [[0, '#9cbacd'], [.28, '#55798f'], [.6, '#2b4d63'], [.84, '#172f41'], [1, '#0a1722']],
      edge: '#b8d5e4', dark: '#07111a', texture: 'rgba(206,234,247,.07)', label: 'rgba(200,230,245,.34)'
    }
  };

  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const WEEKDAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const ROMAN = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];

  function rng(seed) {
    return () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }

  function radial(c, x0, y0, r0, x1, y1, r1, stops) {
    const g = c.createRadialGradient(x0, y0, r0, x1, y1, r1);
    for (const [p, color] of stops) g.addColorStop(p, color);
    return g;
  }

  function linear(c, x0, y0, x1, y1, stops) {
    const g = c.createLinearGradient(x0, y0, x1, y1);
    for (const [p, color] of stops) g.addColorStop(p, color);
    return g;
  }

  function circlePath(c, x, y, r) {
    c.beginPath();
    c.arc(x, y, r, 0, TAU);
  }

  function ringPath(c, ro, ri) {
    c.beginPath();
    c.arc(0, 0, ro, 0, TAU);
    c.arc(0, 0, ri, 0, TAU, true);
  }

  function strokeCircle(c, r, color, width) {
    c.beginPath();
    c.arc(0, 0, r, 0, TAU);
    c.strokeStyle = color;
    c.lineWidth = width;
    c.stroke();
  }

  function roundRectPath(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function spacedText(c, text, x, y, spacing) {
    const chars = Array.from(text);
    const widths = chars.map((ch) => c.measureText(ch).width);
    let total = spacing * Math.max(0, chars.length - 1);
    for (const w of widths) total += w;
    let cursor = x - total / 2;
    const align = c.textAlign;
    c.textAlign = 'left';
    for (let i = 0; i < chars.length; i++) {
      c.fillText(chars[i], cursor, y);
      cursor += widths[i] + spacing;
    }
    c.textAlign = align;
  }

  function currentDate() {
    return debugTime === null ? new Date() : new Date(debugTime);
  }

  function clockParts(now) {
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();
    const t = h * 3600 + m * 60 + s + ms / 1000;
    const hourAngle = ((t % 43200) / 43200) * TAU;
    const minuteAngle = ((m * 60 + s + ms / 1000) / 3600) * TAU;
    const beats = Math.floor(t * 8);
    const secondBase = ((beats % 480) / 8) * 6;
    const frac = t * 8 - beats;
    const bounce = -0.95 * Math.exp(-frac * 17) * Math.sin(frac * TAU * 2.4);
    const secondAngle = (secondBase + bounce) * Math.PI / 180;
    const beatPhase = t * 8;
    const balanceSwing = 3.55 * Math.sin(beatPhase * TAU / 8 + 0.35);
    const forkSnap = 0.105 * Math.tanh(6 * Math.sin(beatPhase * TAU / 8 + 0.18));
    return { h, m, s, ms, t, hourAngle, minuteAngle, secondAngle, beats, beatPhase, balanceSwing, forkSnap };
  }

  // The going train is laid out with module 6. Each pair of centres is the
  // sum of the two pitch radii, so the teeth stay in mesh as the train turns.
  function meshAngle(parentAngle, parentTeeth, childTeeth, parentPos, childPos) {
    const phi1 = Math.atan2(childPos.y - parentPos.y, childPos.x - parentPos.x);
    const phi2 = phi1 + Math.PI;
    const p1 = (parentAngle - phi1) * parentTeeth / TAU;
    return phi2 + (TAU / childTeeth) * (0.5 - p1);
  }

  function trainAngles(t) {
    const center = (t / 3600) * TAU;
    const barrel = meshAngle(center, 12, 84, POS.center, POS.barrel);
    const third = meshAngle(center, 72, 10, POS.center, POS.third);
    const fourth = meshAngle(third, 60, 8, POS.third, POS.fourth);
    const escape = meshAngle(fourth, 48, 6, POS.fourth, POS.escape);
    return { center, barrel, third, fourth, escape };
  }

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    S = Math.min(W, H);
    R = S * 0.415;
    viewScale = R / D;
    cx = W * 0.5;
    cy = H * 0.505;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lastHudSecond = -1;
    buildScene();
    document.body.classList.add('ready');
  }

  function buildScene() {
    bg = makeBackground();
    baseLayer = makeClockLayer((c) => drawClockBase(c), 2.30 * R);
    bridgeLayer = makeClockLayer((c) => drawBridges(c), 2.30 * R);
    glassLayer = makeClockLayer((c) => drawGlass(c), 2.30 * R);
    gearSprites = buildGearSprites();
    balanceSprite = buildBalanceSprite();
    cageSprite = buildCageSprite();
    dustSprite = buildDustSprite();
  }

  function makeCanvas(cssW, cssH) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(cssW * dpr));
    c.height = Math.max(1, Math.ceil(cssH * dpr));
    return c;
  }

  function makeBackground() {
    const c = makeCanvas(W, H);
    const p = c.getContext('2d');
    p.setTransform(dpr, 0, 0, dpr, 0, 0);

    p.fillStyle = '#040809';
    p.fillRect(0, 0, W, H);

    let g = p.createRadialGradient(cx, cy - H * 0.09, S * 0.02, cx, cy + H * 0.02, S * 0.72);
    g.addColorStop(0, '#122427');
    g.addColorStop(.38, '#0b1719');
    g.addColorStop(.72, '#071012');
    g.addColorStop(1, '#030607');
    p.fillStyle = g;
    p.fillRect(0, 0, W, H);

    g = p.createRadialGradient(cx - R * 0.15, cy - R * 0.2, R * 0.05, cx, cy, R * 1.55);
    g.addColorStop(0, 'rgba(187,127,58,.17)');
    g.addColorStop(.42, 'rgba(126,78,33,.075)');
    g.addColorStop(1, 'rgba(80,45,20,0)');
    p.fillStyle = g;
    p.fillRect(0, 0, W, H);

    g = p.createRadialGradient(cx + R * 0.78, cy + R * 0.72, 0, cx + R * 0.78, cy + R * 0.72, R * 1.1);
    g.addColorStop(0, 'rgba(35,91,104,.075)');
    g.addColorStop(1, 'rgba(20,62,74,0)');
    p.fillStyle = g;
    p.fillRect(0, 0, W, H);

    // Shadow and warm reflected light under the case.
    p.save();
    p.filter = 'blur(' + Math.max(18, R * 0.075) + 'px)';
    p.fillStyle = 'rgba(0,0,0,.72)';
    p.beginPath();
    p.ellipse(cx + R * 0.035, cy + R * 0.96, R * 0.83, R * 0.19, 0, 0, TAU);
    p.fill();
    p.restore();

    // Fine horizontal brushing in the deep background.
    p.save();
    for (let y = 0; y < H; y += 3) {
      p.strokeStyle = y % 2 ? 'rgba(220,235,232,.009)' : 'rgba(0,0,0,.028)';
      p.beginPath();
      p.moveTo(0, y + .4);
      p.lineTo(W, y + .4);
      p.stroke();
    }
    p.restore();

    // Faint technical orbit around the clock.
    p.save();
    p.translate(cx, cy);
    p.strokeStyle = 'rgba(203,174,123,.055)';
    p.lineWidth = 1;
    p.beginPath();
    p.arc(0, 0, R * 1.145, 0, TAU);
    p.stroke();
    p.beginPath();
    p.arc(0, 0, R * 1.19, 0, TAU);
    p.stroke();
    for (let i = 0; i < 180; i++) {
      const a = i / 180 * TAU;
      const long = i % 15 === 0;
      const r1 = R * 1.145;
      const r2 = R * (long ? 1.165 : 1.154);
      p.strokeStyle = long ? 'rgba(213,182,128,.12)' : 'rgba(185,164,127,.045)';
      p.beginPath();
      p.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      p.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      p.stroke();
    }
    p.restore();

    // Grain / film speckle.
    const noise = makeCanvas(170, 170);
    const np = noise.getContext('2d');
    const img = np.createImageData(noise.width, noise.height);
    const rand = rng(81031);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 128 + (rand() - .5) * 110;
      img.data[i] = v;
      img.data[i + 1] = v;
      img.data[i + 2] = v;
      img.data[i + 3] = 18 + rand() * 28;
    }
    np.putImageData(img, 0, 0);
    const pat = p.createPattern(noise, 'repeat');
    p.save();
    p.globalAlpha = .20;
    p.globalCompositeOperation = 'overlay';
    p.fillStyle = pat;
    p.fillRect(0, 0, W, H);
    p.restore();

    // Vignette.
    g = p.createRadialGradient(cx, cy, S * 0.30, cx, cy, S * 0.86);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(.68, 'rgba(0,0,0,.16)');
    g.addColorStop(1, 'rgba(0,0,0,.70)');
    p.fillStyle = g;
    p.fillRect(0, 0, W, H);

    return c;
  }

  function makeClockLayer(draw, cssSize) {
    const c = makeCanvas(cssSize, cssSize);
    const p = c.getContext('2d');
    p.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, c.width / 2, c.height / 2);
    p.lineCap = 'round';
    p.lineJoin = 'round';
    draw(p);
    return c;
  }

  function blitLayer(layer) {
    const size = layer.width / dpr;
    ctx.drawImage(layer, cx - size / 2, cy - size / 2, size, size);
  }

  function drawSceneBase(c) {
    const caseGrad = radial(c, -D * .28, -D * .34, D * .05, D * .04, D * .08, D * 1.31, [
      [0, '#45382a'], [.23, '#211b16'], [.53, '#121516'], [.75, '#17130f'], [1, '#080a0a']
    ]);
    c.beginPath();
    c.arc(0, 0, CASE_R, 0, TAU);
    c.fillStyle = caseGrad;
    c.fill();

    // Broad curved sheen on the case.
    c.save();
    c.beginPath();
    c.arc(0, 0, CASE_R, 0, TAU);
    c.clip();
    const sheen = c.createLinearGradient(-CASE_R, -CASE_R, CASE_R, CASE_R);
    sheen.addColorStop(0, 'rgba(255,239,204,.16)');
    sheen.addColorStop(.28, 'rgba(255,231,184,.035)');
    sheen.addColorStop(.55, 'rgba(0,0,0,0)');
    sheen.addColorStop(.82, 'rgba(196,143,75,.055)');
    sheen.addColorStop(1, 'rgba(255,224,174,.10)');
    c.fillStyle = sheen;
    c.fillRect(-CASE_R, -CASE_R, CASE_R * 2, CASE_R * 2);
    c.restore();

    strokeCircle(c, CASE_R - 3, 'rgba(228,190,128,.28)', 2.2);
    strokeCircle(c, CASE_R - 9, 'rgba(0,0,0,.55)', 7);
    strokeCircle(c, D * 1.058, 'rgba(236,199,139,.34)', 2);
    strokeCircle(c, D * 1.047, 'rgba(0,0,0,.38)', 12);
    strokeCircle(c, D * 1.017, 'rgba(232,194,131,.31)', 2);
    strokeCircle(c, CHAPTER_OUT + 1.5, 'rgba(255,236,196,.42)', 3.2);
  }

  function drawClockBase(c) {
    drawSceneBase(c);

    // Movement plate.
    const plate = radial(c, -D * .32, -D * .38, D * .08, 0, 0, PLATE_R, [
      [0, '#334245'], [.37, '#1e2a2d'], [.75, '#121b1e'], [1, '#080e10']
    ]);
    circlePath(c, 0, 0, PLATE_R);
    c.fillStyle = plate;
    c.fill();

    // Geneva stripes on the plate.
    c.save();
    circlePath(c, 0, 0, PLATE_R - 7);
    c.clip();
    c.rotate(-.34);
    for (let y = -PLATE_R; y < PLATE_R; y += 17) {
      const band = c.createLinearGradient(0, y, 0, y + 17);
      band.addColorStop(0, 'rgba(255,255,255,0)');
      band.addColorStop(.35, 'rgba(207,229,226,.026)');
      band.addColorStop(.62, 'rgba(0,0,0,.075)');
      band.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = band;
      c.fillRect(-PLATE_R, y, PLATE_R * 2, 17);
    }
    // Concentric graining and perlage clusters.
    for (let r = 50; r < PLATE_R; r += 9) {
      c.beginPath();
      c.arc(0, 0, r, 0, TAU);
      c.strokeStyle = r % 18 ? 'rgba(210,229,225,.012)' : 'rgba(210,229,225,.025)';
      c.lineWidth = .8;
      c.stroke();
    }
    const perl = rng(8812);
    for (let i = 0; i < 270; i++) {
      const a = perl() * TAU;
      const rr = Math.sqrt(perl()) * PLATE_R * .92;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      const cr = 3.5 + perl() * 7;
      c.beginPath();
      c.arc(x, y, cr, 0, TAU);
      c.strokeStyle = 'rgba(220,238,232,.017)';
      c.lineWidth = .9;
      c.stroke();
      c.beginPath();
      c.arc(x + .9, y + .9, cr, 0, TAU);
      c.strokeStyle = 'rgba(0,0,0,.032)';
      c.lineWidth = .7;
      c.stroke();
    }
    c.restore();

    // Recessed lip and its shadow.
    strokeCircle(c, PLATE_R - 2, 'rgba(216,234,230,.16)', 2.4);
    strokeCircle(c, PLATE_R - 13, 'rgba(0,0,0,.42)', 18);
    const innerShade = radial(c, 0, 0, PLATE_R * .70, 0, 0, PLATE_R, [
      [0, 'rgba(0,0,0,0)'], [.72, 'rgba(0,0,0,.10)'], [1, 'rgba(0,0,0,.56)']
    ]);
    circlePath(c, 0, 0, PLATE_R);
    c.fillStyle = innerShade;
    c.fill();

    // Skeleton windows in the plate reveal a darker second layer.
    c.save();
    circlePath(c, 0, 0, PLATE_R - 8);
    c.clip();
    const windows = [
      [-.42, -.53, 92, 35, -.44],
      [.52, -.34, 76, 27, .32],
      [.17, .63, 88, 30, -.05]
    ];
    for (const [wx, wy, rx, ry, rot] of windows) {
      c.save();
      c.translate(wx * D, wy * D);
      c.rotate(rot);
      const hole = c.createRadialGradient(0, -ry * .3, 0, 0, 0, rx);
      hole.addColorStop(0, '#020506');
      hole.addColorStop(.8, '#050a0b');
      hole.addColorStop(1, '#0e1719');
      c.beginPath();
      c.ellipse(0, 0, rx, ry, 0, 0, TAU);
      c.fillStyle = hole;
      c.fill();
      c.strokeStyle = 'rgba(209,229,224,.13)';
      c.lineWidth = 2;
      c.stroke();
      c.restore();
    }
    c.restore();

    // Four polished movement pillars.
    for (const [a] of [[0], [Math.PI / 2], [Math.PI], [-Math.PI / 2]]) {
      drawPillar(c, Math.cos(a) * 758, Math.sin(a) * 758, 26);
    }

    // Calibre engravings on exposed plate surfaces.
    c.save();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(226,204,158,.42)';
    c.font = '500 ' + (D * .0135) + 'px "Segoe UI",sans-serif';
    spacedText(c, 'CALIBRE LUMEN · N° 08', 0, -612, D * .0048);
    c.fillStyle = 'rgba(208,189,148,.34)';
    c.font = '500 ' + (D * .012) + 'px "Segoe UI",sans-serif';
    c.save();
    c.translate(438, 430);
    c.rotate(.72);
    spacedText(c, '42 JEWELS · 8 DAYS', 0, 0, D * .0038);
    c.restore();
    c.restore();

    // Narrow chapter ring in aged grand-feu enamel.
    ringPath(c, CHAPTER_OUT, CHAPTER_IN);
    const enamel = radial(c, -D * .30, -D * .48, D * .12, 0, 0, D * 1.12, [
      [0, '#f6efd9'], [.35, '#e7dbc0'], [.72, '#d8c7a4'], [1, '#b7a37c']
    ]);
    c.fillStyle = enamel;
    c.fill();

    c.save();
    ringPath(c, CHAPTER_OUT, CHAPTER_IN);
    c.clip();
    // Delicate enamel grain and patina.
    const rand = rng(3771);
    for (let i = 0; i < 120; i++) {
      const a = rand() * TAU;
      const r = CHAPTER_IN + rand() * (CHAPTER_OUT - CHAPTER_IN);
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      const rr = 1 + rand() * 8;
      const smudge = c.createRadialGradient(x, y, 0, x, y, rr);
      smudge.addColorStop(0, i % 4 ? 'rgba(104,85,53,.026)' : 'rgba(255,255,247,.055)');
      smudge.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = smudge;
      c.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    for (let r = CHAPTER_IN + 5; r < CHAPTER_OUT; r += 2.6) {
      c.beginPath();
      c.arc(0, 0, r, 0, TAU);
      c.strokeStyle = 'rgba(81,64,39,.018)';
      c.lineWidth = .8;
      c.stroke();
    }
    // Inner edge shadow.
    const edgeShade = radial(c, 0, 0, CHAPTER_IN, 0, 0, CHAPTER_OUT, [
      [0, 'rgba(26,19,10,.42)'], [.075, 'rgba(26,19,10,.13)'], [.26, 'rgba(26,19,10,0)'],
      [.82, 'rgba(255,252,234,.04)'], [1, 'rgba(255,252,234,.16)']
    ]);
    c.fillStyle = edgeShade;
    c.fillRect(-D, -D, D * 2, D * 2);
    c.restore();

    strokeCircle(c, CHAPTER_IN + 1.2, 'rgba(92,69,38,.42)', 3);
    strokeCircle(c, CHAPTER_OUT - 1.3, 'rgba(92,69,38,.38)', 2.5);

    drawChapterMarks(c);

    // Date aperture frame at 3 o'clock.
    drawDateFrame(c);

    // Four polished case bolts.
    for (let i = 0; i < 8; i++) {
      const a = (22.5 + i * 45) * Math.PI / 180;
      const x = Math.cos(a) * D * 1.034;
      const y = Math.sin(a) * D * 1.034;
      drawScrew(c, x, y, D * .0145, a * 1.7 + .4, false);
    }

    drawCaseCrown(c);

    // Hand-engraved case back signature.
    c.save();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(238,211,160,.34)';
    c.font = '500 ' + (D * .0105) + 'px "Segoe UI",sans-serif';
    spacedText(c, 'LUMEN · N° 08', 0, D * 1.044, D * .0038);
    c.restore();
  }

  function drawCaseCrown(c) {
    const a = 220 * Math.PI / 180;
    const x = Math.cos(a) * D * 1.082;
    const y = Math.sin(a) * D * 1.082;
    c.save();
    c.translate(x, y);
    c.rotate(a);

    // Winding stem and neck.
    c.beginPath();
    c.moveTo(-50, 0);
    c.lineTo(2, 0);
    c.strokeStyle = 'rgba(0,0,0,.6)';
    c.lineWidth = 13;
    c.stroke();
    c.strokeStyle = linear(c, -54, -8, 10, 8, [
      [0, '#d5e3e0'], [.36, '#7e9294'], [.74, '#304448'], [1, '#101b1e']
    ]);
    c.lineWidth = 8;
    c.stroke();
    c.strokeStyle = 'rgba(245,255,250,.18)';
    c.lineWidth = 1;
    c.stroke();

    // Knurled crown.
    const crown = c.createRadialGradient(-8, -10, 2, 0, 0, 31);
    crown.addColorStop(0, '#f6e2b3');
    crown.addColorStop(.28, '#c39855');
    crown.addColorStop(.66, '#6d4b24');
    crown.addColorStop(1, '#2b1a0b');
    circlePath(c, 0, 0, 31);
    c.fillStyle = crown;
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.65)';
    c.lineWidth = 2;
    c.stroke();
    for (let i = 0; i < 32; i++) {
      const t = i / 32 * TAU;
      c.beginPath();
      c.moveTo(Math.cos(t) * 23, Math.sin(t) * 23);
      c.lineTo(Math.cos(t) * 30, Math.sin(t) * 30);
      c.strokeStyle = i % 2 ? 'rgba(50,31,12,.52)' : 'rgba(255,239,198,.24)';
      c.lineWidth = 1;
      c.stroke();
    }
    circlePath(c, 0, 0, 17);
    c.fillStyle = '#21160c';
    c.fill();
    c.strokeStyle = 'rgba(255,235,192,.25)';
    c.lineWidth = 1;
    c.stroke();
    const stone = c.createRadialGradient(-4, -5, 0, 0, 0, 10);
    stone.addColorStop(0, '#b8d9e6');
    stone.addColorStop(.38, '#4d7488');
    stone.addColorStop(1, '#101f2b');
    circlePath(c, 0, 0, 10);
    c.fillStyle = stone;
    c.fill();
    c.beginPath();
    c.arc(-2.5, -3, 2.2, 0, TAU);
    c.fillStyle = 'rgba(240,251,255,.7)';
    c.fill();
    c.restore();
  }

  function drawChapterMarks(c) {
    // Minute track.
    c.save();
    for (let i = 0; i < 60; i++) {
      const a = -Math.PI / 2 + i * TAU / 60;
      const major = i % 5 === 0;
      const r1 = D * (major ? .936 : .952);
      const r2 = D * .989;
      c.beginPath();
      c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      c.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      c.strokeStyle = major ? 'rgba(48,35,20,.78)' : 'rgba(71,55,34,.50)';
      c.lineWidth = major ? 2.8 : 1.15;
      c.stroke();
      if (major) {
        c.beginPath();
        c.arc(Math.cos(a) * D * .925, Math.sin(a) * D * .925, 1.6, 0, TAU);
        c.fillStyle = 'rgba(91,58,25,.55)';
        c.fill();
      }
    }
    c.restore();

    // Applied Roman numerals.
    c.save();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = '400 ' + (D * .071) + 'px "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif';
    for (let i = 0; i < 12; i++) {
      if (i === 3) continue; // date aperture replaces III
      const a = -Math.PI / 2 + i * TAU / 12;
      const x = Math.cos(a) * D * .895;
      const y = Math.sin(a) * D * .895;
      c.fillStyle = 'rgba(255,250,231,.42)';
      c.fillText(ROMAN[i], x + 1.2, y + 1.6);
      c.fillStyle = '#3a2c1c';
      c.fillText(ROMAN[i], x, y);
    }
    c.restore();

    // Tiny hand-painted index at 12 and applied maker's marks.
    c.save();
    c.fillStyle = 'rgba(92,64,33,.62)';
    c.beginPath();
    c.moveTo(0, -D * .842);
    c.lineTo(-5, -D * .862);
    c.lineTo(5, -D * .862);
    c.closePath();
    c.fill();

    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(82,59,31,.55)';
    c.font = '500 ' + (D * .013) + 'px "Segoe UI",sans-serif';
    spacedText(c, 'LUMEN', 0, -D * .835, D * .0042);
    c.font = '500 ' + (D * .0105) + 'px "Segoe UI",sans-serif';
    spacedText(c, 'SKELETON', 0, D * .837, D * .0038);
    c.restore();
  }

  function drawDateFrame(c) {
    const x = D * .895;
    const y = 0;
    const w = D * .148;
    const h = D * .082;
    c.save();
    c.shadowColor = 'rgba(0,0,0,.55)';
    c.shadowBlur = 10;
    c.shadowOffsetY = 3;
    roundRectPath(c, x - w / 2, y - h / 2, w, h, h * .17);
    c.fillStyle = '#17130e';
    c.fill();
    c.shadowColor = 'transparent';
    const frame = c.createLinearGradient(x - w / 2, y - h / 2, x + w / 2, y + h / 2);
    frame.addColorStop(0, '#ead19b');
    frame.addColorStop(.45, '#8d6c3b');
    frame.addColorStop(1, '#d8b97e');
    c.strokeStyle = frame;
    c.lineWidth = 2.2;
    c.stroke();
    roundRectPath(c, x - w / 2 + 4, y - h / 2 + 4, w - 8, h - 8, h * .10);
    c.strokeStyle = 'rgba(241,217,164,.17)';
    c.lineWidth = 1;
    c.stroke();
    c.restore();
  }

  function drawScrew(c, x, y, r, slot, blued) {
    c.save();
    c.translate(x, y);
    const base = blued ? ['#a9c9db', '#496c82', '#1b3446', '#07131d'] : ['#f0f4ef', '#9aa7a5', '#4e5b5d', '#182023'];
    const g = c.createRadialGradient(-r * .32, -r * .4, r * .04, 0, 0, r);
    g.addColorStop(0, base[0]);
    g.addColorStop(.30, base[1]);
    g.addColorStop(.72, base[2]);
    g.addColorStop(1, base[3]);
    circlePath(c, 0, 0, r);
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.62)';
    c.lineWidth = Math.max(.7, r * .18);
    c.stroke();
    c.beginPath();
    c.arc(0, 0, r * .82, Math.PI * 1.08, Math.PI * 1.78);
    c.strokeStyle = 'rgba(255,255,255,.32)';
    c.lineWidth = Math.max(.5, r * .10);
    c.stroke();
    c.rotate(slot);
    c.beginPath();
    c.moveTo(-r * .68, 0);
    c.lineTo(r * .68, 0);
    c.strokeStyle = 'rgba(3,7,8,.82)';
    c.lineWidth = Math.max(1, r * .25);
    c.stroke();
    c.beginPath();
    c.moveTo(-r * .58, -r * .10);
    c.lineTo(r * .58, -r * .10);
    c.strokeStyle = 'rgba(255,255,255,.13)';
    c.lineWidth = Math.max(.4, r * .07);
    c.stroke();
    c.restore();
  }

  function drawPillar(c, x, y, r) {
    c.save();
    c.translate(x, y);
    const g = c.createRadialGradient(-r * .34, -r * .38, r * .06, 0, 0, r);
    g.addColorStop(0, '#d9e2dd');
    g.addColorStop(.30, '#8a9a9b');
    g.addColorStop(.68, '#3c4b4e');
    g.addColorStop(1, '#111b1e');
    circlePath(c, 0, 0, r);
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.58)';
    c.lineWidth = 1.6;
    c.stroke();
    circlePath(c, 0, 0, r * .76);
    c.strokeStyle = 'rgba(255,247,219,.22)';
    c.lineWidth = 1;
    c.stroke();
    circlePath(c, 0, 0, r * .61);
    c.strokeStyle = 'rgba(0,0,0,.33)';
    c.lineWidth = 2;
    c.stroke();
    drawScrew(c, 0, 0, r * .44, .7, false);
    c.restore();
  }

  function drawJewel(c, x, y, r, chaton) {
    c.save();
    if (chaton !== false) {
      const chat = c.createRadialGradient(x - r * .4, y - r * .5, r * .1, x, y, r * 1.55);
      chat.addColorStop(0, '#f6e0b0');
      chat.addColorStop(.45, '#a67a3f');
      chat.addColorStop(.78, '#5b3b1b');
      chat.addColorStop(1, '#24150a');
      circlePath(c, x, y, r * 1.48);
      c.fillStyle = chat;
      c.fill();
      c.strokeStyle = 'rgba(255,237,190,.26)';
      c.lineWidth = 1;
      c.stroke();
    }
    const ruby = c.createRadialGradient(x - r * .35, y - r * .4, r * .05, x, y, r);
    ruby.addColorStop(0, '#ff9bab');
    ruby.addColorStop(.28, '#ea4c65');
    ruby.addColorStop(.66, '#b11736');
    ruby.addColorStop(1, '#4d0616');
    circlePath(c, x, y, r);
    c.fillStyle = ruby;
    c.fill();
    c.strokeStyle = 'rgba(64,0,14,.7)';
    c.lineWidth = 1;
    c.stroke();
    circlePath(c, x, y, r * .24);
    c.fillStyle = 'rgba(30,2,8,.82)';
    c.fill();
    c.beginPath();
    c.arc(x - r * .28, y - r * .33, r * .20, 0, TAU);
    c.fillStyle = 'rgba(255,235,235,.78)';
    c.fill();
    if (chaton !== false && r >= 11) {
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI / 2 + i * TAU / 3 + .25;
        drawScrew(c, x + Math.cos(a) * r * 2.05, y + Math.sin(a) * r * 2.05, r * .22, a, i === 1);
      }
    }
    c.restore();
  }

  function buildGearOutline(c, teeth, pitch, outer, root) {
    const step = TAU / teeth;
    const start = -step * .5;
    c.beginPath();
    let first = true;
    for (let i = 0; i < teeth; i++) {
      const a = i * step;
      const a0 = a + start;
      const a1 = a - step * .28;
      const a2 = a - step * .155;
      const a3 = a + step * .155;
      const a4 = a + step * .28;
      const a5 = a + step * .5;
      const p0 = [Math.cos(a0) * root, Math.sin(a0) * root];
      const p1 = [Math.cos(a1) * root, Math.sin(a1) * root];
      const p2 = [Math.cos(a2) * outer, Math.sin(a2) * outer];
      const p3 = [Math.cos(a3) * outer, Math.sin(a3) * outer];
      const p4 = [Math.cos(a4) * root, Math.sin(a4) * root];
      const p5 = [Math.cos(a5) * root, Math.sin(a5) * root];
      if (first) { c.moveTo(p0[0], p0[1]); first = false; }
      c.lineTo(p1[0], p1[1]);
      c.lineTo(p2[0], p2[1]);
      c.arc(0, 0, outer, a2, a3, false);
      c.lineTo(p4[0], p4[1]);
      c.arc(0, 0, root, a4, a5, false);
      c.lineTo(p0[0], p0[1]);
    }
    c.closePath();
  }

  function gearMaterialGradient(c, mat, outer) {
    return linear(c, -outer * .8, -outer * .95, outer * .9, outer * .85, mat.stops);
  }

  function addRadialTexture(c, pitch, mat) {
    const rand = rng(Math.round(pitch * 31 + 7));
    c.save();
    c.globalCompositeOperation = 'source-atop';
    for (let i = 0; i < 96; i++) {
      const a = rand() * TAU;
      const r1 = pitch * (.22 + rand() * .18);
      const r2 = pitch * (.82 + rand() * .17);
      c.beginPath();
      c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      c.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      c.strokeStyle = mat.texture;
      c.lineWidth = .55 + rand() * .9;
      c.stroke();
    }
    for (let i = 0; i < 46; i++) {
      const a = rand() * TAU;
      const r = pitch * (.3 + rand() * .66);
      c.beginPath();
      c.arc(Math.cos(a) * r, Math.sin(a) * r, 1 + rand() * 3.5, 0, TAU);
      c.fillStyle = i % 3 ? 'rgba(255,255,255,.022)' : 'rgba(0,0,0,.035)';
      c.fill();
    }
    c.restore();
  }

  function makeGearSprite({ teeth, pitch, material, holeCount = 5, holeScale = .175, hub = true }) {
    const module = 2 * pitch / teeth;
    const add = module * 1.55;
    const ded = module * 1.28;
    const outer = pitch + add;
    const root = pitch - ded;
    const css = (outer + 14) * 2;
    const c = makeCanvas(css * viewScale, css * viewScale);
    const p = c.getContext('2d');
    p.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, c.width / 2, c.height / 2);
    p.lineCap = 'round';
    p.lineJoin = 'round';
    const mat = MAT[material] || MAT.gold;

    buildGearOutline(p, teeth, pitch, outer, root);
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.72)';
    p.lineWidth = 1.8;
    p.stroke();

    const holes = [];
    for (let i = 0; i < holeCount; i++) {
      const a = i / holeCount * TAU + .20;
      const orbit = pitch * .54;
      const rx = pitch * holeScale * 1.14;
      const ry = pitch * holeScale * .82;
      holes.push({ x: Math.cos(a) * orbit, y: Math.sin(a) * orbit, rx, ry, rot: a });
    }
    holes.teeth = teeth;
    p.globalCompositeOperation = 'destination-out';
    p.beginPath();
    p.arc(0, 0, pitch * .066, 0, TAU);
    p.fill();
    for (const h of holes) {
      p.beginPath();
      p.ellipse(h.x, h.y, h.rx, h.ry, h.rot, 0, TAU);
      p.fill();
    }
    p.globalCompositeOperation = 'source-over';

    if (hub) {
      ringPath(p, pitch * .17, pitch * .062);
      p.fillStyle = gearMaterialGradient(p, mat, outer);
      p.fill();
      p.strokeStyle = 'rgba(0,0,0,.58)';
      p.lineWidth = 1.4;
      p.stroke();
      circlePath(p, 0, 0, pitch * .061);
      p.fillStyle = '#05090a';
      p.fill();
    }

    addRadialTexture(p, pitch, mat);

    // Outline / edge bevel.
    buildGearOutline(p, teeth, pitch, outer, root);
    p.strokeStyle = 'rgba(255,247,220,.30)';
    p.lineWidth = .9;
    p.stroke();

    for (const h of holes) {
      p.beginPath();
      p.ellipse(h.x, h.y, h.rx, h.ry, h.rot, 0, TAU);
      p.strokeStyle = 'rgba(0,0,0,.55)';
      p.lineWidth = 2;
      p.stroke();
      p.save();
      p.translate(-.9, -.9);
      p.beginPath();
      p.ellipse(h.x, h.y, h.rx, h.ry, h.rot, 0, TAU);
      p.strokeStyle = 'rgba(255,247,220,.15)';
      p.lineWidth = .8;
      p.stroke();
      p.restore();
    }

    p.beginPath();
    p.arc(0, 0, pitch * .91, 0, TAU);
    p.strokeStyle = 'rgba(255,247,220,.08)';
    p.lineWidth = 1;
    p.stroke();

    return c;
  }

  function makePinionSprite({ teeth, pitch, material }) {
    const module = 2 * pitch / teeth;
    const outer = pitch + module * 1.25;
    const root = Math.max(3, pitch - module * 1.15);
    const css = (outer + 10) * 2;
    const c = makeCanvas(css * viewScale, css * viewScale);
    const p = c.getContext('2d');
    p.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, c.width / 2, c.height / 2);
    p.lineCap = 'round';
    p.lineJoin = 'round';
    const mat = MAT[material] || MAT.blued;
    buildGearOutline(p, teeth, pitch, outer, root);
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.75)';
    p.lineWidth = 1.8;
    p.stroke();
    addRadialTexture(p, pitch, mat);
    buildGearOutline(p, teeth, pitch, outer, root);
    p.strokeStyle = 'rgba(225,246,255,.34)';
    p.lineWidth = .9;
    p.stroke();

    circlePath(p, 0, 0, pitch * .35);
    p.fillStyle = mat === MAT.blued ? 'rgba(8,15,22,.90)' : 'rgba(7,12,13,.88)';
    p.fill();
    p.strokeStyle = 'rgba(214,238,245,.26)';
    p.lineWidth = 1;
    p.stroke();
    circlePath(p, 0, 0, pitch * .13);
    p.fillStyle = '#030607';
    p.fill();
    return c;
  }

  function makeRatchetSprite() {
    const teeth = 48;
    const outer = 76;
    const root = 62;
    const css = (outer + 14) * 2;
    const c = makeCanvas(css * viewScale, css * viewScale);
    const p = c.getContext('2d');
    p.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, c.width / 2, c.height / 2);
    p.lineCap = 'round';
    p.lineJoin = 'round';
    const mat = MAT.steel;
    const step = TAU / teeth;

    p.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a = i * step;
      const a0 = a + step * .04;
      const a1 = a + step * .70;
      const a2 = a + step * .84;
      const p0 = [Math.cos(a0) * root, Math.sin(a0) * root];
      const p1 = [Math.cos(a1) * outer, Math.sin(a1) * outer];
      const p2 = [Math.cos(a2) * root, Math.sin(a2) * root];
      if (i === 0) p.moveTo(p0[0], p0[1]); else p.lineTo(p0[0], p0[1]);
      p.lineTo(p1[0], p1[1]);
      p.lineTo(p2[0], p2[1]);
      p.arc(0, 0, root, a2, a + step, false);
    }
    p.closePath();
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.72)';
    p.lineWidth = 1.8;
    p.stroke();

    // Five skeleton windows and a raised hub.
    p.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU + .13;
      p.beginPath();
      p.ellipse(Math.cos(a) * 36, Math.sin(a) * 36, 16, 10, a, 0, TAU);
      p.fill();
    }
    p.globalCompositeOperation = 'source-over';
    ringPath(p, 21, 9);
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.60)';
    p.lineWidth = 1.4;
    p.stroke();

    addRadialTexture(p, 52, mat);
    p.beginPath();
    p.arc(0, 0, outer - 1, 0, TAU);
    p.strokeStyle = 'rgba(238,248,245,.31)';
    p.lineWidth = .9;
    p.stroke();
    p.beginPath();
    p.arc(0, 0, root + 1, 0, TAU);
    p.strokeStyle = 'rgba(0,0,0,.35)';
    p.lineWidth = 2;
    p.stroke();

    // Winding square.
    p.save();
    p.rotate(.2);
    roundRectPath(p, -5.5, -5.5, 11, 11, 1.5);
    p.fillStyle = '#071114';
    p.fill();
    p.strokeStyle = 'rgba(217,240,243,.34)';
    p.lineWidth = .8;
    p.stroke();
    p.restore();
    return c;
  }

  function makeBarrelSprite() {
    const teeth = 84;
    const pitch = 252;
    const module = 2 * pitch / teeth;
    const outer = pitch + module * 1.8;
    const root = pitch - module * 1.3;
    const inner = pitch * .69;
    const css = (outer + 18) * 2;
    const c = makeCanvas(css * viewScale, css * viewScale);
    const p = c.getContext('2d');
    p.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, c.width / 2, c.height / 2);
    p.lineCap = 'round';
    p.lineJoin = 'round';
    const mat = MAT.gold;

    // Toothed rim with an open centre.
    buildGearOutline(p, teeth, pitch, outer, root);
    p.arc(0, 0, inner, 0, TAU, true);
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill('evenodd');
    p.strokeStyle = 'rgba(0,0,0,.70)';
    p.lineWidth = 2;
    p.stroke();

    // Curved spokes.
    p.save();
    p.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU + .16;
      const x1 = Math.cos(a) * pitch * .15;
      const y1 = Math.sin(a) * pitch * .15;
      const x2 = Math.cos(a + .20) * pitch * .40;
      const y2 = Math.sin(a + .20) * pitch * .40;
      const x3 = Math.cos(a + .05) * inner;
      const y3 = Math.sin(a + .05) * inner;
      p.beginPath();
      p.moveTo(x1, y1);
      p.quadraticCurveTo(x2, y2, x3, y3);
      p.strokeStyle = gearMaterialGradient(p, mat, outer);
      p.lineWidth = pitch * .068;
      p.stroke();
      p.strokeStyle = 'rgba(255,240,200,.16)';
      p.lineWidth = pitch * .014;
      p.stroke();
      p.strokeStyle = 'rgba(0,0,0,.32)';
      p.lineWidth = pitch * .006;
      p.stroke();
    }
    p.restore();

    // Hub.
    ringPath(p, pitch * .185, pitch * .070);
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.62)';
    p.lineWidth = 1.6;
    p.stroke();
    circlePath(p, 0, 0, pitch * .068);
    p.fillStyle = '#05090a';
    p.fill();

    addRadialTexture(p, pitch, mat);

    // Rim bevels.
    buildGearOutline(p, teeth, pitch, outer, root);
    p.strokeStyle = 'rgba(255,247,220,.30)';
    p.lineWidth = 1;
    p.stroke();
    circlePath(p, 0, 0, inner);
    p.strokeStyle = 'rgba(0,0,0,.58)';
    p.lineWidth = 3;
    p.stroke();
    circlePath(p, 0, 0, inner - 3);
    p.strokeStyle = 'rgba(255,243,207,.23)';
    p.lineWidth = 1;
    p.stroke();
    circlePath(p, 0, 0, pitch * .185);
    p.strokeStyle = 'rgba(255,246,218,.22)';
    p.lineWidth = 1;
    p.stroke();

    return c;
  }

  function buildGearSprites() {
    return {
      barrel: makeBarrelSprite(),
      centerWheel: makeGearSprite({ teeth: 72, pitch: 216, material: 'rose', holeCount: 6, holeScale: .175 }),
      centerPinion: makePinionSprite({ teeth: 12, pitch: 36, material: 'blued' }),
      thirdWheel: makeGearSprite({ teeth: 60, pitch: 180, material: 'gold', holeCount: 5, holeScale: .178 }),
      thirdPinion: makePinionSprite({ teeth: 10, pitch: 30, material: 'blued' }),
      fourthWheel: makeGearSprite({ teeth: 48, pitch: 144, material: 'rhodium', holeCount: 5, holeScale: .178 }),
      fourthPinion: makePinionSprite({ teeth: 8, pitch: 24, material: 'steel' }),
      escapeWheel: makeGearSprite({ teeth: 15, pitch: 58, material: 'steel', holeCount: 3, holeScale: .16 }),
      escapePinion: makePinionSprite({ teeth: 6, pitch: 18, material: 'blued' }),
      ratchet: makeRatchetSprite(),
      crownWheel: makeGearSprite({ teeth: 40, pitch: 48, material: 'steel', holeCount: 4, holeScale: .17 }),
      powerGear: makeGearSprite({ teeth: 18, pitch: 30, material: 'steel', holeCount: 3, holeScale: .18 }),
      cannonPinion: makeGearSprite({ teeth: 24, pitch: 50, material: 'steel', holeCount: 0, holeScale: .12, hub: false })
    };
  }

  function drawSprite(sprite, x, y, angle) {
    const css = sprite.width / dpr;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.drawImage(sprite, -css / (2 * viewScale), -css / (2 * viewScale), css / viewScale, css / viewScale);
    ctx.restore();
  }

  function drawMainspring(c, angle) {
    const B = POS.barrel;
    const maxR = 252 * .655;
    const minR = 252 * .105;
    const turns = 9.2;
    c.save();
    c.translate(B.x, B.y);
    c.rotate(angle * .06);
    c.lineCap = 'round';
    c.beginPath();
    const points = 520;
    for (let i = 0; i <= points; i++) {
      const u = i / points;
      const a = u * turns * TAU;
      const r = minR + (maxR - minR) * u;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.strokeStyle = 'rgba(0,0,0,.48)';
    c.lineWidth = 8.5;
    c.stroke();
    c.strokeStyle = linear(c, -maxR, -maxR, maxR, maxR, [
      [0, '#8ba5ae'], [.32, '#4f6d78'], [.66, '#263e49'], [1, '#14252d']
    ]);
    c.lineWidth = 5.2;
    c.stroke();
    c.strokeStyle = 'rgba(207,236,243,.28)';
    c.lineWidth = 1.2;
    c.stroke();

    // Arbor and mainspring clamp.
    const arb = c.createRadialGradient(-8, -9, 1, 0, 0, 26);
    arb.addColorStop(0, '#f4ddaf');
    arb.addColorStop(.45, '#a97b42');
    arb.addColorStop(1, '#3b2410');
    circlePath(c, 0, 0, 26);
    c.fillStyle = arb;
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.6)';
    c.lineWidth = 2;
    c.stroke();
    circlePath(c, 0, 0, 8);
    c.fillStyle = '#1a2e3a';
    c.fill();
    c.restore();
  }

  function drawTrain(nowParts) {
    const t = nowParts.t;
    const a = trainAngles(t);

    drawMainspring(ctx, a.barrel);
    drawSprite(gearSprites.barrel, POS.barrel.x, POS.barrel.y, a.barrel);

    drawSprite(gearSprites.centerPinion, 0, 0, a.center);
    drawSprite(gearSprites.centerWheel, 0, 0, a.center);
    drawSprite(gearSprites.cannonPinion, 0, 0, a.center + .11);

    drawSprite(gearSprites.thirdWheel, POS.third.x, POS.third.y, a.third);
    drawSprite(gearSprites.thirdPinion, POS.third.x, POS.third.y, a.third);

    drawSprite(gearSprites.fourthWheel, POS.fourth.x, POS.fourth.y, a.fourth);
    drawSprite(gearSprites.fourthPinion, POS.fourth.x, POS.fourth.y, a.fourth);
  }

  function drawWinding(c, parts) {
    const a = trainAngles(parts.t);
    const B = POS.barrel;
    const CW = POS.crownWheel;
    const crownAngle = -a.barrel * (84 / 40) + .17;

    // Winding stem and crown wheel.
    c.save();
    const stemAngle = Math.atan2(CW.y - B.y, CW.x - B.x);
    c.beginPath();
    c.moveTo(CW.x + Math.cos(stemAngle) * 34, CW.y + Math.sin(stemAngle) * 34);
    c.lineTo(CW.x + Math.cos(stemAngle) * 172, CW.y + Math.sin(stemAngle) * 172);
    c.strokeStyle = 'rgba(0,0,0,.55)';
    c.lineWidth = 14;
    c.stroke();
    c.strokeStyle = linear(c, CW.x, CW.y - 60, CW.x + 100, CW.y + 60, [
      [0, '#d5e3e3'], [.35, '#7c9294'], [.72, '#30454a'], [1, '#111d21']
    ]);
    c.lineWidth = 9;
    c.stroke();
    c.strokeStyle = 'rgba(240,255,250,.18)';
    c.lineWidth = 1.2;
    c.stroke();
    drawScrew(c, CW.x + Math.cos(stemAngle) * 158, CW.y + Math.sin(stemAngle) * 158, 9, stemAngle, true);
    c.restore();

    drawSprite(gearSprites.crownWheel, CW.x, CW.y, crownAngle);
    drawJewel(c, CW.x, CW.y, 8, false);

    // Ratchet wheel above the barrel bridge.
    drawSprite(gearSprites.ratchet, B.x, B.y, a.barrel);

    // Click pawl and its blued spring.
    const pivotX = B.x - 76;
    const pivotY = B.y - 66;
    c.save();
    c.beginPath();
    c.moveTo(pivotX, pivotY);
    c.lineTo(B.x - 27, B.y - 62);
    c.lineTo(B.x - 19, B.y - 57);
    c.strokeStyle = linear(c, pivotX, pivotY - 20, B.x, B.y, [
      [0, '#c9d7d6'], [.4, '#6e8386'], [1, '#1b2a2e']
    ]);
    c.lineWidth = 6;
    c.stroke();
    c.strokeStyle = 'rgba(255,255,240,.20)';
    c.lineWidth = .9;
    c.stroke();
    circlePath(c, pivotX, pivotY, 9);
    c.fillStyle = '#cfdad6';
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.55)';
    c.lineWidth = 1.8;
    c.stroke();

    c.beginPath();
    c.moveTo(pivotX - 24, pivotY - 18);
    c.bezierCurveTo(pivotX - 58, pivotY - 48, pivotX - 18, pivotY - 66, pivotX + 4, pivotY - 34);
    c.strokeStyle = '#547c91';
    c.lineWidth = 3.1;
    c.stroke();
    c.strokeStyle = 'rgba(196,232,243,.28)';
    c.lineWidth = .8;
    c.stroke();
    drawScrew(c, pivotX - 24, pivotY - 18, 6, .7, true);
    c.restore();

    drawScrew(c, B.x, B.y, 7, a.barrel + .6, true);

    // Faint ratchet engraving.
    c.save();
    c.translate(B.x, B.y);
    c.rotate(a.barrel);
    c.fillStyle = 'rgba(237,215,173,.34)';
    c.font = '500 ' + (D * .0105) + 'px "Segoe UI",sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('RATCHET · 84T', 0, 50);
    c.restore();
  }

  function drawPallet(c, parts) {
    const P = POS.pallet;
    const E = POS.escape;
    const base = Math.atan2(E.y - P.y, E.x - P.x);
    c.save();
    c.translate(P.x, P.y);
    c.rotate(base + parts.forkSnap);

    // Main lever.
    c.beginPath();
    c.moveTo(-162, 0);
    c.lineTo(-38, 0);
    c.lineTo(58, 0);
    c.strokeStyle = linear(c, -170, -22, 70, 22, [
      [0, '#8fa7ad'], [.30, '#486068'], [.64, '#1d2d33'], [1, '#081115']
    ]);
    c.lineWidth = 7;
    c.stroke();
    c.strokeStyle = 'rgba(205,235,240,.20)';
    c.lineWidth = 1;
    c.stroke();

    // Pallet arms and ruby stones.
    for (const sign of [-1, 1]) {
      c.save();
      c.rotate(sign * .36);
      c.beginPath();
      c.moveTo(28, 0);
      c.lineTo(67, 0);
      c.strokeStyle = '#5d747b';
      c.lineWidth = 5.4;
      c.stroke();
      c.translate(67, 0);
      c.rotate(sign * .25);
      roundRectPath(c, -7, -4.5, 15, 9, 2.5);
      c.fillStyle = '#b51c3a';
      c.fill();
      c.strokeStyle = 'rgba(255,136,154,.35)';
      c.lineWidth = 1;
      c.stroke();
      c.restore();
    }

    // Fork horns at the balance end.
    c.beginPath();
    c.moveTo(-162, 0);
    c.lineTo(-178, -12);
    c.moveTo(-162, 0);
    c.lineTo(-178, 12);
    c.strokeStyle = '#748b90';
    c.lineWidth = 3.2;
    c.stroke();

    // Pivot boss.
    circlePath(c, 0, 0, 11);
    c.fillStyle = '#d9e2de';
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.55)';
    c.lineWidth = 2;
    c.stroke();
    circlePath(c, 0, 0, 3.4);
    c.fillStyle = '#071012';
    c.fill();

    // Banking pins.
    c.fillStyle = '#c8a468';
    for (const y of [-24, 24]) {
      c.beginPath();
      c.arc(-8, y, 3.2, 0, TAU);
      c.fill();
    }
    c.restore();
  }

  function buildBalanceSprite() {
    const rr = 72;
    const css = (rr + 14) * 2;
    const c = makeCanvas(css * viewScale, css * viewScale);
    const p = c.getContext('2d');
    p.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, c.width / 2, c.height / 2);
    p.lineCap = 'round';
    p.lineJoin = 'round';
    const mat = MAT.gold;

    ringPath(p, rr, rr - 14);
    p.fillStyle = gearMaterialGradient(p, mat, rr);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.66)';
    p.lineWidth = 2;
    p.stroke();
    p.beginPath();
    p.arc(0, 0, rr - 14, 0, TAU);
    p.strokeStyle = 'rgba(255,248,220,.17)';
    p.lineWidth = 1;
    p.stroke();

    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + .20;
      p.beginPath();
      p.moveTo(Math.cos(a) * 12, Math.sin(a) * 12);
      p.quadraticCurveTo(Math.cos(a + .32) * 42, Math.sin(a + .32) * 42, Math.cos(a + .12) * 59, Math.sin(a + .12) * 59);
      p.strokeStyle = gearMaterialGradient(p, mat, rr);
      p.lineWidth = 8;
      p.stroke();
      p.strokeStyle = 'rgba(255,243,207,.19)';
      p.lineWidth = 1.4;
      p.stroke();
    }

    // Timing screws around the rim.
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + .37;
      drawScrew(p, Math.cos(a) * (rr - 7), Math.sin(a) * (rr - 7), 3.7, a, i % 3 === 0);
    }

    ringPath(p, 17, 6);
    p.fillStyle = gearMaterialGradient(p, mat, rr);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.58)';
    p.lineWidth = 1.4;
    p.stroke();
    circlePath(p, 0, 0, 4.5);
    p.fillStyle = '#05090a';
    p.fill();

    addRadialTexture(p, rr, mat);
    p.beginPath();
    p.arc(0, 0, rr - 1, 0, TAU);
    p.strokeStyle = 'rgba(255,247,220,.30)';
    p.lineWidth = 1;
    p.stroke();

    return c;
  }

  function buildCageSprite() {
    const teeth = 48;
    const pitch = 198;
    const module = 2 * pitch / teeth;
    const outer = pitch + module * 1.15;
    const root = pitch - module * 1.05;
    const inner = 178;
    const maxR = 244;
    const css = (maxR + 16) * 2;
    const c = makeCanvas(css * viewScale, css * viewScale);
    const p = c.getContext('2d');
    p.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, c.width / 2, c.height / 2);
    p.lineCap = 'round';
    p.lineJoin = 'round';
    const mat = MAT.rhodium;

    // Fine-toothed carriage wheel.
    buildGearOutline(p, teeth, pitch, outer, root);
    p.arc(0, 0, inner, 0, TAU, true);
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill('evenodd');
    p.strokeStyle = 'rgba(0,0,0,.72)';
    p.lineWidth = 1.8;
    p.stroke();

    // Three open carriage arms.
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * TAU + .18;
      p.beginPath();
      p.moveTo(Math.cos(a) * 18, Math.sin(a) * 18);
      p.quadraticCurveTo(Math.cos(a + .20) * 82, Math.sin(a + .20) * 82, Math.cos(a + .08) * inner, Math.sin(a + .08) * inner);
      p.strokeStyle = gearMaterialGradient(p, mat, outer);
      p.lineWidth = 11;
      p.stroke();
      p.strokeStyle = 'rgba(255,249,230,.20)';
      p.lineWidth = 1.8;
      p.stroke();
      p.strokeStyle = 'rgba(0,0,0,.32)';
      p.lineWidth = 1.1;
      p.stroke();
    }

    // Jewelled carriage screws.
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * TAU + .95;
      drawScrew(p, Math.cos(a) * (pitch - 6), Math.sin(a) * (pitch - 6), 5.4, a, true);
    }

    // Lightweight timing poise weights.
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU + .12;
      p.beginPath();
      p.arc(Math.cos(a) * 187, Math.sin(a) * 187, 2.2, 0, TAU);
      p.fillStyle = 'rgba(255,239,201,.55)';
      p.fill();
    }

    // Seconds pointer at the carriage rim.
    p.save();
    p.beginPath();
    p.moveTo(outer + 1, -5);
    p.lineTo(maxR, 0);
    p.lineTo(outer + 1, 5);
    p.closePath();
    p.fillStyle = '#ff6d42';
    p.fill();
    p.strokeStyle = 'rgba(255,207,184,.55)';
    p.lineWidth = .8;
    p.stroke();
    p.restore();

    ringPath(p, 19, 7);
    p.fillStyle = gearMaterialGradient(p, mat, outer);
    p.fill();
    p.strokeStyle = 'rgba(0,0,0,.55)';
    p.lineWidth = 1.4;
    p.stroke();
    circlePath(p, 0, 0, 3.8);
    p.fillStyle = '#05090a';
    p.fill();

    addRadialTexture(p, pitch, mat);
    p.beginPath();
    p.arc(0, 0, outer - 1, 0, TAU);
    p.strokeStyle = 'rgba(255,247,220,.25)';
    p.lineWidth = .9;
    p.stroke();
    return c;
  }

  function drawBalanceAssembly(c, x, y, parts) {
    c.save();
    c.translate(x, y);

    // Blued overcoil hairspring: inner end follows the balance, outer stud is fixed.
    const turns = 7.6;
    const r0 = 8;
    const r1 = 56;
    c.save();
    c.rotate(parts.balanceSwing * .10);
    for (let pass = 0; pass < 3; pass++) {
      c.beginPath();
      for (let i = 0; i <= 360; i++) {
        const u = i / 360;
        const a = u * turns * TAU + parts.balanceSwing * .18 * (1 - u);
        const r = r0 + (r1 - r0) * u;
        const sx = Math.cos(a) * r;
        const sy = Math.sin(a) * r;
        if (i === 0) c.moveTo(sx, sy); else c.lineTo(sx, sy);
      }
      c.strokeStyle = pass === 0 ? 'rgba(0,0,0,.40)' : pass === 1 ? '#54798d' : 'rgba(203,233,241,.28)';
      c.lineWidth = pass === 0 ? 4.2 : pass === 1 ? 2.2 : .7;
      c.stroke();
    }
    c.restore();

    c.save();
    c.rotate(parts.balanceSwing);
    drawSpriteInContext(c, balanceSprite, 0, 0, 0);
    c.restore();

    // Stud and centre collet.
    c.beginPath();
    c.moveTo(44, -21);
    c.lineTo(57, -27);
    c.strokeStyle = '#a8b9ba';
    c.lineWidth = 2.2;
    c.stroke();
    circlePath(c, 0, 0, 3.8);
    c.fillStyle = '#d9e3df';
    c.fill();
    c.restore();
  }

  function drawTourbillonPallet(c, parts) {
    const E = { x: 0, y: 0 };
    const B = { x: -78, y: 66 };
    const P = { x: -36, y: 31 };
    const base = Math.atan2(E.y - P.y, E.x - P.x);
    c.save();
    c.translate(P.x, P.y);
    c.rotate(base + parts.forkSnap * .70);

    c.beginPath();
    c.moveTo(-92, 0);
    c.lineTo(-30, 0);
    c.lineTo(32, 0);
    c.strokeStyle = linear(c, -96, -16, 42, 16, [
      [0, '#8fa7ad'], [.30, '#486068'], [.64, '#1d2d33'], [1, '#081115']
    ]);
    c.lineWidth = 4.6;
    c.stroke();
    c.strokeStyle = 'rgba(205,235,240,.20)';
    c.lineWidth = .7;
    c.stroke();

    for (const sign of [-1, 1]) {
      c.save();
      c.rotate(sign * .38);
      c.beginPath();
      c.moveTo(16, 0);
      c.lineTo(38, 0);
      c.strokeStyle = '#5d747b';
      c.lineWidth = 3.4;
      c.stroke();
      c.translate(38, 0);
      c.rotate(sign * .25);
      roundRectPath(c, -4, -2.6, 9, 5.2, 1.8);
      c.fillStyle = '#b51c3a';
      c.fill();
      c.strokeStyle = 'rgba(255,136,154,.35)';
      c.lineWidth = .7;
      c.stroke();
      c.restore();
    }

    c.beginPath();
    c.moveTo(-92, 0);
    c.lineTo(-102, -7);
    c.moveTo(-92, 0);
    c.lineTo(-102, 7);
    c.strokeStyle = '#748b90';
    c.lineWidth = 2.0;
    c.stroke();

    circlePath(c, 0, 0, 6.5);

  function drawTourbillonTrack(c) {
    c.save();

    ringPath(c, 245, 231);
    c.fillStyle = 'rgba(10,18,20,.72)';
    c.fill();
    c.strokeStyle = 'rgba(211,181,122,.34)';
    c.lineWidth = 1;
    c.stroke();

  function lunarPhase(now) {
    const synodic = 29.530588853;
    const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14);
    let phase = ((now.getTime() - knownNewMoon) / 86400000 / synodic) % 1;
    if (phase < 0) phase += 1;
    return phase;
  }

  const MOON_STARS = (() => {
    const rand = rng(47017);
    return Array.from({ length: 58 }, () => {
      const a = rand() * TAU;
      const r = Math.sqrt(rand()) * 100;
      return {
        x: Math.cos(a) * r,
        y: Math.sin(a) * r,
        r: .45 + rand() * 1.35,
        alpha: .18 + rand() * .68
      };
    });
  })();

  function drawMoonphase(c, now) {
    const M = POS.moon;
    const phase = lunarPhase(now);
    const illum = .24 + .76 * (1 - Math.cos(phase * TAU)) / 2;
    c.save();
    c.translate(M.x, M.y);

    // Deep-blue night sky with a soft sapphire pool of light.
    const sky = radial(c, -34, -42, 4, 0, 0, 112, [
      [0, '#254c68'], [.38, '#122b42'], [.76, '#071321'], [1, '#03080d']
    ]);
    circlePath(c, 0, 0, 112);
    c.fillStyle = sky;
    c.fill();

    c.save();
    circlePath(c, 0, 0, 110);
    c.clip();
    for (const star of MOON_STARS) {
      c.beginPath();
      c.arc(star.x, star.y, star.r, 0, TAU);
      c.fillStyle = 'rgba(232,241,229,' + star.alpha + ')';
      c.fill();
    }

    // Moon and terminator shadow.
    const moonR = 45;
    const glow = radial(c, -8, -12, 4, 0, 0, moonR * 1.8, [
      [0, 'rgba(255,239,193,.38)'], [.55, 'rgba(255,220,148,.10)'], [1, 'rgba(255,220,148,0)']
    ]);
    c.fillStyle = glow;
    c.fillRect(-100, -100, 200, 200);
    const moon = radial(c, -14, -15, 2, 0, 0, moonR, [
      [0, '#fffbea'], [.36, '#f1dca4'], [.74, '#c9a45f'], [1, '#7d5c2c']
    ]);
    circlePath(c, 0, 0, moonR);
    c.fillStyle = moon;
    c.fill();
    c.strokeStyle = 'rgba(255,247,211,.46)';
    c.lineWidth = 1;
    c.stroke();
    for (const [cx, cy, cr] of [[-10, 5, 6], [8, -10, 4.5], [9, 14, 7], [-16, -15, 3.4], [20, 3, 2.6]]) {
      c.beginPath();
      c.arc(cx, cy, cr, 0, TAU);
      c.fillStyle = 'rgba(112,82,42,.20)';
      c.fill();
    }
    const side = phase < .5 ? 1 : -1;
    const shadowX = side * illum * moonR * 2.04;
    circlePath(c, shadowX, 0, moonR * 1.015);
    c.fillStyle = '#06111d';
    c.fill();
    c.restore();

    // Inner shadow ring.
    const inner = radial(c, 0, 0, 86, 0, 0, 112, [
      [0, 'rgba(0,0,0,0)'], [.82, 'rgba(0,0,0,.10)'], [1, 'rgba(0,0,0,.56)']
    ]);
    circlePath(c, 0, 0, 112);
    c.fillStyle = inner;
    c.fill();

    // Lunar-day pointer and small corrector at the rim.
    c.save();
    c.rotate(phase * TAU - Math.PI / 2);
    c.beginPath();
    c.moveTo(0, -116);
    c.lineTo(-5, -105);
    c.lineTo(5, -105);
    c.closePath();
    c.fillStyle = '#e6c783';
    c.fill();
    c.restore();
    c.restore();
  }

  function drawPowerReserve(c, now) {
    const P = POS.power;

    c.save();
    c.translate(P.x, P.y);

    // Open fan-shaped power reserve aperture.
    arcSectorPath(c, 58, 108, start, start + sweep);
    c.fillStyle = radial(c, -20, -30, 4, 0, 0, 116, [
      [0, '#16282b'], [.55, '#0b1719'], [1, '#050a0b']
    ]);
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.58)';
    c.lineWidth = 3;
    c.stroke();
    arcSectorPath(c, 58, 108, start, start + sweep);
    c.strokeStyle = 'rgba(226,201,148,.36)';

    c.beginPath();
    c.arc(0, 0, 108, start, start + sweep);
    c.strokeStyle = 'rgba(255,235,192,.28)';
    c.lineWidth = 1;
    c.stroke();
    c.save();
    arcSectorPath(c, 58, 108, start, start + sweep);

        c.textBaseline = 'middle';

    }
    c.fillStyle = 'rgba(216,192,142,.46)';
    c.font = '500 ' + (D * .0095) + 'px "Segoe UI",sans-serif';
    c.textAlign = 'center';
    spacedText(c, '8 DAYS', 0, 49, D * .0025);

    // Differential wheel, blued reserve hand and jewel.

    c.rotate(handAngle);
    c.beginPath();
    c.moveTo(-9, 0);
    c.lineTo(91, 0);
    c.lineTo(100, -3.5);
    c.lineTo(91, 0);
    c.lineTo(100, 3.5);
    c.closePath();
    c.fillStyle = '#547c91';
    c.fill();
    c.strokeStyle = 'rgba(210,239,247,.28)';
    c.lineWidth = .8;
    c.stroke();
    c.restore();
    drawJewel(c, 0, 0, 8, false);
    drawScrew(c, -91, 49, 5.4, .5, true);
