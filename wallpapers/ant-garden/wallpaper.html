<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="theme-color" content="#120b07">
<title>微观文明 · 桌面蚁园</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #120b07;
    --paper: #f2e3ca;
    --muted: rgba(235, 211, 177, .57);
    --faint: rgba(226, 196, 155, .27);
    --line: rgba(226, 196, 155, .15);
    --accent: #e0a55f;
    --sans: "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --serif: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --pad: clamp(20px, 3.2vw, 54px);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
  body {
    position: fixed; inset: 0; font-family: var(--sans); color: var(--paper);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
    cursor: default;
  }
  #scene { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .hud a, .hud button, .hud input, .hud label, .hud .controls, .hud #panel { pointer-events: auto; }

  .masthead {
    position: absolute; left: var(--pad); top: var(--pad);
    display: flex; align-items: center; gap: 11px;
    font-family: var(--mono); font-size: 8px; letter-spacing: .30em; color: var(--muted);
    transition: opacity 1.2s;
  }
  .mark { width: 13px; height: 13px; border: 1px solid rgba(224, 165, 95, .55); border-radius: 50%; position: relative; }
  .mark::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); opacity: .72; }
  .brand { color: rgba(244, 225, 199, .82); letter-spacing: .34em; }
  .rule { width: 28px; height: 1px; background: var(--line); }
  .collection { color: var(--faint); letter-spacing: .24em; }
  .index { color: rgba(224, 165, 95, .55); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; letter-spacing: .12em; }

  .live {
    position: absolute; right: var(--pad); top: calc(var(--pad) + 2px); text-align: right;
    font-family: var(--mono); font-size: 8px; letter-spacing: .20em; color: var(--faint);
    display: flex; align-items: center; gap: 8px; transition: opacity 1.6s;
  }
  .live .dot { width: 5px; height: 5px; border-radius: 50%; background: #b8c07a; box-shadow: 0 0 10px rgba(184, 192, 122, .8); animation: breathe 4.2s ease-in-out infinite; }
  .live b { color: rgba(240, 219, 186, .62); font-weight: 400; letter-spacing: .16em; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .caption { position: absolute; left: var(--pad); top: calc(var(--pad) + 52px); width: min(560px, 48vw); transition: opacity 2.2s ease; }
  .kicker { margin: 0; font-family: var(--mono); font-size: 8px; letter-spacing: .30em; color: rgba(224, 165, 95, .70); }
  h1 {
    margin: 14px 0 11px; font-family: var(--serif); font-weight: 400;
    font-size: clamp(32px, 3.55vw, 54px); line-height: 1.08; letter-spacing: .17em;
    color: #f3e3c8; text-shadow: 0 2px 30px rgba(16, 8, 4, .6);
  }
  .caption .sub { margin: 0; font-size: 11px; line-height: 2.0; letter-spacing: .10em; color: var(--muted); }
  .measure { margin-top: 18px; display: flex; align-items: center; gap: 13px; }
  .measure .line { width: 36px; height: 1px; background: rgba(224, 165, 95, .42); flex: none; }
  .measure span { font-family: var(--mono); font-size: 8px; letter-spacing: .14em; color: var(--faint); }

  .readout {
    position: absolute; left: var(--pad); bottom: var(--pad);
    display: flex; gap: clamp(18px, 2.5vw, 42px); transition: opacity 1.6s;
  }
  .readout div { display: flex; flex-direction: column; gap: 6px; }
  .readout span { font-family: var(--mono); font-size: 7px; letter-spacing: .19em; color: var(--faint); }
  .readout b { font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: .08em; color: rgba(240, 219, 186, .66); }
  .readout b em { font-style: normal; font-size: 8px; color: var(--faint); }

  .controls {
    position: absolute; right: var(--pad); bottom: var(--pad);
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    opacity: .32; transition: opacity .35s;
  }
  .controls:hover, .controls:focus-within, .controls:has([aria-expanded="true"]) { opacity: 1; }
  button {
    font: inherit; cursor: pointer; color: #ecdcc2;
    background: rgba(24, 15, 9, .84); border: 1px solid rgba(224, 165, 95, .20);
    border-radius: 7px; padding: 9px 13px; font-size: 10.5px; letter-spacing: .14em;
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    transition: border-color .25s, background .25s, color .25s;
  }
  button:hover { border-color: rgba(224, 165, 95, .5); background: rgba(38, 24, 14, .92); }
  button:focus-visible, input:focus-visible { outline: 2px solid rgba(224, 165, 95, .8); outline-offset: 4px; }
  #panel {
    width: 272px; max-height: calc(100vh - 100px); overflow: auto; padding: 18px; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 12px;
    border: 1px solid rgba(224, 165, 95, .18); border-radius: 11px;
    background: rgba(20, 12, 8, .94); box-shadow: 0 20px 70px rgba(0, 0, 0, .55);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  #panel[hidden] { display: none; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
  .panel-head b { font-family: var(--serif); font-weight: 400; font-size: 13px; letter-spacing: .18em; color: rgba(244, 226, 201, .85); }
  .panel-head span { font-family: var(--mono); font-size: 7px; letter-spacing: .12em; color: var(--faint); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .switch input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
  .panel .tips { margin: 2px 0 0; font-size: 8.5px; line-height: 1.95; letter-spacing: .06em; color: var(--faint); }
  .panel .tips b { color: var(--muted); font-weight: 400; }
  .danger { color: #e5b793; }
  .danger.armed { border-color: rgba(224, 120, 80, .65); color: #ffc7a8; background: rgba(74, 28, 16, .7); }

  .toast {
    position: absolute; left: 50%; bottom: 12%; transform: translate(-50%, 12px);
    padding: 8px 15px; border: 1px solid rgba(224, 165, 95, .20); border-radius: 999px;
    background: rgba(20, 12, 8, .76); color: rgba(240, 219, 186, .72);
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .16em;
    opacity: 0; transition: opacity .7s, transform .7s; pointer-events: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  body.quiet .caption, body.quiet .readout, body.quiet .live { opacity: 0; }
  body.hud-off .masthead, body.hud-off .caption, body.hud-off .readout,
  body.hud-off .live, body.hud-off .toast, body.hud-off .controls { display: none; }
  body.hud-off .hud { pointer-events: none; }
  body.prompting #scene { cursor: crosshair; }

  @media (max-width: 760px), (max-height: 600px) {
    .readout, .live { display: none; }
    .caption { width: min(86vw, 430px); top: calc(var(--pad) + 42px); }
    h1 { font-size: clamp(27px, 8vw, 42px); letter-spacing: .14em; }
    .caption .sub { font-size: 10px; line-height: 1.9; }
    .measure { margin-top: 13px; }
    .measure span { letter-spacing: .08em; }
    .collection, .masthead .rule, .index { display: none; }
    .controls { right: 16px; bottom: 16px; }
    .toast { bottom: 17%; }
  }
  @media (max-width: 460px) {
    .caption .sub br { display: none; }
    .measure { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hud *, .toast { transition-duration: .01s !important; }
    .live .dot { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="玻璃蚁园的横截面：苔藓覆盖的地表、层层土壤与地下巢室，工蚁沿信息素小路搬运食物，巢穴随储粮逐渐扩展"></canvas>

<div class="hud" id="hud">
  <header class="masthead">
    <span class="mark"></span>
    <span class="brand">LUMEN</span>
    <span class="rule"></span>
    <span class="collection">地下生态档案</span>
    <span class="index">07</span>
  </header>

  <div class="live">
    <span class="dot"></span>
    <span>COLONY ACTIVE</span>
    <b id="liveStage">初建</b>
  </div>

  <div class="caption">
    <p class="kicker">MICRO CIVILIZATION / FORMICARIUM</p>
    <h1>桌面蚁园</h1>
    <p class="sub">玻璃之下，一座用气味丈量的城。<br>它们搬运、挖掘，把日子过成一条发亮的路。</p>
  </div>

  <div class="readout">
    <div><span>WORKERS</span><b id="statAnts">008</b></div>
    <div><span>STORED</span><b id="statStored">000</b></div>
    <div><span>CHAMBERS</span><b id="statRooms">02<em>/08</em></b></div>
    <div><span>STAGE</span><b id="statStage">01<em>/06</em></b></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="controls">
    <div id="panel" hidden>
      <div class="panel-head"><b>蚁园设置</b><span>进度自动保存</span></div>
      <div class="row"><button id="feed">投食一份</button><button id="pause">暂停</button></div>
      <label class="switch"><span>自动投食</span><input id="auto" type="checkbox" checked></label>
      <label class="switch"><span>显示信息素</span><input id="phero" type="checkbox" checked></label>
      <div class="row"><button id="fullscreen">全屏</button><button id="reset" class="danger">重新开始</button></div>
      <p class="tips">点击地表上方投食 · <b>Space</b> 暂停<br><b>H</b> 隐藏界面 · <b>F</b> 全屏<br><span id="panelStats">工蚁 8 · 储粮 0 · 阶段 1/6</span><br><span id="nextStage">距「育婴」还需 24</span></p>
    </div>
    <button id="settings" aria-expanded="false" aria-controls="panel">蚁园设置</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  A glass formicarium, seen in cross-section.
   *
   *  Surface   one-dimensional terrain; foragers follow a 1D pheromone
   *            field and carry crumbs back to the entrance.
   *  Nest      a deterministic node graph. New chambers are excavated when
   *            enough food has been delivered, then stay.
   *  Memory    seed, stage, delivered food and population persist locally.
   *
   *  One file, Canvas 2D, no images, fonts, audio or network.
   * ------------------------------------------------------------------ */

  const TAU = Math.PI * 2;
  const KEY = 'lumen.ant-garden.v1';
  const SCENT_BINS = 512;
  const STAGE_NAMES = ['', '初建', '育婴', '储粮', '王庭', '菌圃', '深厅'];
  const NEED = [0, 0, 24, 56, 100, 160, 240];
  const POP_CAP = [0, 16, 28, 40, 54, 68, 84];
  const FOOD_KINDS = ['crumb', 'seed', 'leaf', 'honey'];
  const FOOD_NAMES = { crumb: '面包屑', seed: '葵花籽', leaf: '叶片', honey: '蜜滴' };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const fract = (v) => v - Math.floor(v);
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const hash1 = (n) => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453);

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFor(salt) {
    return mulberry32((seed ^ Math.imul(salt | 0, 0x9E3779B1)) >>> 0);
  }

  function lerpAngle(a, b, t) {
    let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    return a + d * t;
  }

  /* -------------------------------- parameters -------------------------------- */

  const q = new URLSearchParams(location.search);
  const numberParam = (key, fallback, min, max) => {
    if (!q.has(key)) return fallback;
    const value = Number(q.get(key));
    return Number.isFinite(value) ? clamp(value, min, max) : fallback;
  };
  let demo = q.has('stage') || q.has('seed');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const stillParam = q.has('still') ? q.get('still') !== '0' : null;
  let paused = stillParam !== null ? stillParam : reducedMotion.matches;
  let autoFeed = q.get('auto') !== '0';
  let showPhero = q.get('phero') !== '0';
  const detail = numberParam('detail', 1, 0.55, 1);
  const warm = numberParam('warm', 0, 0, 120);
  const demoStage = q.has('stage') ? Math.round(numberParam('stage', 3, 1, 6)) : 0;
  const foodParam = q.has('food') ? Math.round(numberParam('food', 2, 0, 6)) : null;

  function readSaved() {
    if (demo) return null;
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.v !== 1) return null;
      return data;
    } catch { return null; }
  }
  const saved = readSaved();

  let seed = q.has('seed')
    ? Math.floor(numberParam('seed', 1, 1, 2147483646))
    : (saved && Number.isFinite(saved.seed) ? (saved.seed >>> 0) || 1 : 1 + Math.floor(Math.random() * 2147483645));

  // Deterministic simulation stream. The scenery uses its own seeded RNG in
  // buildWorld; this one drives ant choices, food and births.
  let simState = (seed ^ 0x9E3779B9) >>> 0;
  function simRandom() {
    simState = (Math.imul(simState, 1664525) + 1013904223) >>> 0;
    return simState / 4294967296;
  }

  let stage = 1;
  let delivered = 0;
  let stored = 0;
  let population = 8;
  let born = 0;

  if (demoStage) {
    stage = demoStage;
    delivered = NEED[stage] + 12;
    stored = 8 + stage * 6;
    population = clamp(8 + (stage - 1) * 9, 8, POP_CAP[stage]);
    born = Math.max(0, population - 8);
  } else if (saved) {
    stage = clamp(Math.round(Number(saved.stage) || 1), 1, 6);
    delivered = Math.max(0, Math.floor(Number(saved.delivered) || 0));
    stored = clamp(Math.floor(Number(saved.stored) || 0), 0, 9999);
    born = Math.max(0, Math.floor(Number(saved.born) || 0));
    if (delivered < NEED[stage]) delivered = NEED[stage];
    while (stage < 6 && delivered >= NEED[stage + 1]) stage += 1;
    population = clamp(Math.floor(Number(saved.population) || 8), 1, POP_CAP[stage]);
  }

  /* -------------------------------- runtime state -------------------------------- */

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const hud = document.getElementById('hud');
  const el = {
    ants: document.getElementById('statAnts'),
    stored: document.getElementById('statStored'),
    rooms: document.getElementById('statRooms'),
    stage: document.getElementById('statStage'),
    live: document.getElementById('liveStage'),
    panel: document.getElementById('panel'),
    settings: document.getElementById('settings'),
    pause: document.getElementById('pause'),
    auto: document.getElementById('auto'),
    phero: document.getElementById('phero'),
    reset: document.getElementById('reset'),
    toast: document.getElementById('toast'),
    panelStats: document.getElementById('panelStats'),
    nextStage: document.getElementById('nextStage'),
  };

  let w = 0, h = 0, dpr = 1;
  let time = 0, frames = 0;
  let last = 0, accumulator = 0, raf = 0;
  let colonyReady = false;
  let booting = true;
  let saveTimer = 0, hudTimer = 0, autoTimer = 26, birthTimer = 11, scoutTimer = 2;
  let digActive = false, digTime = 0, digStage = 1, digPaint = 0;
  let captionTimer = 0, resetTimer = 0, toastTimer = 0;
  let pointer = { x: 0.5, y: 0.4, active: false };
  let ants = [];
  let foods = [];
  let foodSeq = 0;
  let motes = [];
  let scent = new Float32Array(SCENT_BINS);
  const scentTmp = new Float32Array(SCENT_BINS);
  let scentClock = 0;

  let gate, nodes = [], edges = [], nodeById = new Map();
  let moss = [], blades = [], foreground = [], finds = [];
  let airCache = null, soilCache = null, nestCache = null, glassCache = null, vignetteCache = null;
  let glowSprite = null;
  let groundBase = 0.322;

  /* -------------------------------- world -------------------------------- */

  function groundAt(x) {
    const nx = clamp(x, 0, 1);
    let y = groundBase
      + 0.0060 * Math.sin(nx * TAU * 2.15 + 0.7)
      + 0.0036 * Math.sin(nx * TAU * 4.9 + 2.1)
      + 0.0018 * Math.sin(nx * TAU * 10.7 + 1.3);
    for (let i = 0; i < moss.length; i++) {
      const m = moss[i];
      const d = (nx - m.x) / m.w;
      y -= m.h * Math.exp(-d * d * 2.1);
    }
    if (gate) {
      const d = (nx - gate.x) / 0.022;
      y -= 0.0055 * Math.exp(-d * d);
    }
    return y;
  }

  function buildWorld() {
    const aspect = w / h;
    groundBase = aspect < 0.82 ? 0.310 : aspect > 2.1 ? 0.348 : 0.338;
    const rnd = rngFor(0x51A7);

    moss = [];
    const centers = [0.035, 0.115, 0.195, 0.285, 0.385, 0.475, 0.565, 0.655, 0.725, 0.805, 0.875, 0.945];
    for (let i = 0; i < centers.length; i++) {
      moss.push({
        x: clamp(centers[i] + (rnd() - 0.5) * 0.028, 0.015, 0.985),
        w: 0.017 + rnd() * 0.034,
        h: 0.0040 + rnd() * 0.0100,
        tone: rnd(),
      });
    }

    const cx = aspect < 0.82 ? 0.560 : 0.575;
    const spread = aspect < 0.82 ? 0.72 : 1;
    const nx = (o) => clamp(cx + o * spread, 0.075, 0.925);
    const tpx = clamp(Math.min(w * 0.028, h * 0.027), 14, 50);

    const defs = [
      { id: 'gate', ox: 0, y: 'ground', stage: 1, chamber: false, label: '入口' },
      { id: 'shaft', ox: 0, y: 0.408, stage: 1, chamber: false },
      { id: 'hall', ox: 0, y: 0.478, stage: 1, chamber: true, scale: 1.00, type: 'hall', label: '前厅' },
      { id: 'rest', ox: -0.085, y: 0.538, stage: 1, chamber: true, scale: 0.72, type: 'rest', label: '卧廊' },
      { id: 'nursery', ox: 0.098, y: 0.566, stage: 2, chamber: true, scale: 1.05, type: 'nursery', label: '育婴室' },
      { id: 'gate2', ox: 0.140, y: 'ground', stage: 2, chamber: false },
      { id: 'shaft2', ox: 0.140, y: 0.424, stage: 2, chamber: false },
      { id: 'granary', ox: -0.160, y: 0.646, stage: 3, chamber: true, scale: 1.06, type: 'granary', label: '粮仓' },
      { id: 'court', ox: -0.018, y: 0.752, stage: 4, chamber: true, scale: 1.40, type: 'court', label: '王庭' },
      { id: 'garden', ox: 0.208, y: 0.798, stage: 5, chamber: true, scale: 1.04, type: 'garden', label: '菌圃' },
      { id: 'gate3', ox: 0.288, y: 'ground', stage: 5, chamber: false },
      { id: 'shaft3', ox: 0.288, y: 0.444, stage: 5, chamber: false },
      { id: 'grand', ox: 0.058, y: 0.888, stage: 6, chamber: true, scale: 1.40, type: 'grand', label: '深厅' },
      { id: 'spring', ox: -0.252, y: 0.906, stage: 6, chamber: true, scale: 0.66, type: 'spring', label: '泉滴' },
    ];

    nodes = defs.map((d, index) => {
      const rxPx = clamp(Math.min(w * 0.070, h * 0.068) * (d.scale || 1), 26, 170);
      return {
        id: d.id,
        x: nx(d.ox),
        y: d.y === 'ground' ? 0 : d.y,
        stage: d.stage,
        chamber: !!d.chamber,
        type: d.type || '',
        label: d.label || '',
        index,
        rx: d.chamber ? rxPx / w : 0,
        ry: d.chamber ? (rxPx * 0.58) / h : 0,
      };
    });
    nodeById = new Map(nodes.map((n) => [n.id, n]));
    gate = nodeById.get('gate');
    gate.y = groundAt(gate.x);
    for (const n of nodes) {
      if (n.y === 0) n.y = groundAt(n.x);
    }

    const edgeDefs = [
      ['gate', 'shaft', 1], ['shaft', 'hall', 1], ['hall', 'rest', 1],
      ['hall', 'nursery', 2], ['gate2', 'shaft2', 2], ['shaft2', 'nursery', 2],
      ['hall', 'granary', 3],
      ['hall', 'court', 4],
      ['nursery', 'garden', 5], ['gate3', 'shaft3', 5], ['shaft3', 'garden', 5],
      ['court', 'grand', 6], ['grand', 'spring', 6],
    ];
    edges = edgeDefs.map(([a, b, st], i) => {
      const A = nodeById.get(a), B = nodeById.get(b);
      const r = rngFor(0x2200 + i * 31);
      const dx = B.x - A.x, dy = B.y - A.y;
      const len = Math.hypot(dx, dy) || 1;
      const perpX = -dy / len, perpY = dx / len;
      const raw = [{ x: A.x, y: A.y }];
      const count = len > 0.26 ? 3 : len > 0.15 ? 2 : 1;
      for (let k = 1; k <= count; k++) {
        const t = k / (count + 1);
        const wob = (r() - 0.5) * 0.020;
        raw.push({
          x: lerp(A.x, B.x, t) + perpX * wob,
          y: lerp(A.y, B.y, t) + perpY * wob,
        });
      }
      raw.push({ x: B.x, y: B.y });
      return { a, b, stage: st, width: tpx, pts: catmullRom(raw, 10), index: i };
    });

    // Seed-static decorations. Positions are normalized; sizes are CSS pixels.
    const r2 = rngFor(0x7E44);
    blades = [];
    const clusters = aspect < 0.82 ? 6 : 11;
    for (let i = 0; i < clusters; i++) {
      const fromLeft = i % 2 === 0;
      const slot = Math.floor(i / 2) / Math.max(1, Math.ceil(clusters / 2) - 1);
      const baseX = fromLeft
        ? 0.02 + slot * 0.27 + (r2() - 0.5) * 0.035
        : 0.71 + slot * 0.26 + (r2() - 0.5) * 0.035;
      const count = 3 + Math.floor(r2() * 3);
      const cluster = [];
      for (let k = 0; k < count; k++) {
        cluster.push({
          offset: (r2() - 0.5) * 9,
          h: 18 + r2() * 42,
          lean: (r2() - 0.5) * 22,
          phase: r2() * TAU,
          speed: 0.4 + r2() * 0.6,
          width: 1.0 + r2() * 1.6,
          tone: r2(),
        });
      }
      blades.push({ x: clamp(baseX, 0.015, 0.985), cluster });
    }

    foreground = [
      { kind: 'mushroom', x: clamp(0.155 + (r2() - 0.5) * 0.04, 0.08, 0.92), scale: 0.85 + r2() * 0.5 },
      { kind: 'mushroom', x: clamp(0.862 + (r2() - 0.5) * 0.03, 0.08, 0.92), scale: 0.65 + r2() * 0.35 },
      { kind: 'fern', x: 0.035 + r2() * 0.015, scale: 0.9 + r2() * 0.45 },
      { kind: 'twig', x: 0.79 + r2() * 0.04, scale: 0.8 + r2() * 0.4 },
    ];

    finds = [
      { kind: 'bead', x: 0.315 + (r2() - 0.5) * 0.03, y: 0.565 + r2() * 0.04, s: 5 + r2() * 3 },
      { kind: 'nail', x: 0.735 + (r2() - 0.5) * 0.04, y: 0.700 + r2() * 0.05, s: 10 + r2() * 8 },
      { kind: 'stone', x: 0.47 + (r2() - 0.5) * 0.04, y: 0.815 + r2() * 0.04, s: 7 + r2() * 5 },
    ].filter((f) => f.x > 0.1 && f.x < 0.9 && f.y > groundBase + 0.1);

    motes = [];
    const r3 = rngFor(0x3C1D);
    for (let i = 0; i < 46; i++) {
      motes.push({
        x: r3(), y: r3() * (groundBase - 0.02),
        r: 0.4 + r3() * 1.1,
        phase: r3() * TAU,
        speed: 0.006 + r3() * 0.014,
        drift: 0.004 + r3() * 0.012,
        alpha: 0.08 + r3() * 0.26,
      });
    }
  }

  function catmullRom(points, samples) {
    if (points.length < 2) return points.slice();
    const out = [];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i - 1)];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[Math.min(points.length - 1, i + 2)];
      for (let s = 0; s < samples; s++) {
        const t = s / samples;
        const t2 = t * t, t3 = t2 * t;
        out.push({
          x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
        });
      }
    }
    out.push({ x: points[points.length - 1].x, y: points[points.length - 1].y });
    return out;
  }

  function usableStage() {
    return digActive ? Math.max(1, stage - 1) : stage;
  }
  function revealOf(nodeStage, index) {
    if (nodeStage < stage) return 1;
    if (nodeStage > stage) return 0;
    if (!digActive) return 1;
    return smoothstep(0, 1, clamp((digTime - index * 0.05) / 5.2, 0, 1));
  }

  /* -------------------------------- caches -------------------------------- */

  function makeCache() {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * dpr));
    c.height = Math.max(1, Math.round(h * dpr));
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c, x };
  }

  function buildCaches() {
    airCache = makeCache();
    paintAir(airCache.x);
    soilCache = makeCache();
    paintSoil(soilCache.x);
    nestCache = makeCache();
    paintNest(nestCache.x);
    glassCache = makeCache();
    paintGlass(glassCache.x);
    vignetteCache = makeCache();
    paintVignette(vignetteCache.x);
    glowSprite = makeGlowSprite();
  }

  function makeGlowSprite() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 201, 120, .95)');
    grad.addColorStop(0.28, 'rgba(255, 180, 92, .44)');
    grad.addColorStop(0.68, 'rgba(240, 145, 60, .10)');
    grad.addColorStop(1, 'rgba(240, 140, 50, 0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return c;
  }

  /* -------------------------------- static painting -------------------------------- */

  function paintAir(c) {
    const rnd = rngFor(0x0A1);
    const base = groundBase * h;
    const sky = c.createLinearGradient(0, 0, 0, h * 0.62);
    sky.addColorStop(0, '#130b07');
    sky.addColorStop(0.45, '#25150c');
    sky.addColorStop(1, '#3a2414');
    c.fillStyle = sky;
    c.fillRect(0, 0, w, h);

    // Warm desk lamp from upper left.
    const lamp = c.createRadialGradient(w * 0.12, h * 0.02, 0, w * 0.24, h * 0.14, Math.max(w, h) * 0.72);
    lamp.addColorStop(0, 'rgba(255, 191, 112, .16)');
    lamp.addColorStop(0.34, 'rgba(197, 127, 63, .06)');
    lamp.addColorStop(1, 'rgba(30, 15, 7, 0)');
    c.fillStyle = lamp;
    c.fillRect(0, 0, w, h);

    // Warm window light far behind the glass.
    const room = c.createRadialGradient(w * 0.74, h * 0.10, 0, w * 0.70, h * 0.16, Math.max(w, h) * 0.58);
    room.addColorStop(0, 'rgba(255, 205, 136, .17)');
    room.addColorStop(0.38, 'rgba(206, 143, 74, .075)');
    room.addColorStop(1, 'rgba(60, 35, 17, 0)');
    c.fillStyle = room;
    c.fillRect(0, 0, w, h);

    // Out-of-focus garden: three size classes so the depth reads.
    const palette = [
      [226, 178, 104], [146, 154, 79], [107, 137, 101],
      [203, 140, 73], [88, 116, 81], [241, 204, 137],
      [170, 133, 73], [126, 149, 106],
    ];
    for (let i = 0; i < 38; i++) {
      const x = rnd() * w;
      const y = rnd() * (base * 0.95 - 12);
      const band = rnd();
      const r = (band > 0.82 ? 120 + rnd() * 150 : band > 0.48 ? 45 + rnd() * 95 : 14 + rnd() * 38) * clamp(h / 1080, 0.55, 1.4);
      const p = palette[Math.floor(rnd() * palette.length)];
      const a = 0.05 + rnd() * 0.11;
      const grad = c.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, `rgba(${p[0]},${p[1]},${p[2]},${a})`);
      grad.addColorStop(band > 0.82 ? 0.72 : 0.52, `rgba(${p[0]},${p[1]},${p[2]},${a * 0.55})`);
      grad.addColorStop(1, `rgba(${p[0]},${p[1]},${p[2]},0)`);
      c.fillStyle = grad;
      c.fillRect(x - r, y - r, r * 2, r * 2);
      if (band > 0.88) {
        c.strokeStyle = `rgba(${p[0]},${p[1]},${p[2]},${a * 0.5})`;
        c.lineWidth = 1;
        c.beginPath(); c.arc(x, y, r * 0.72, 0, TAU); c.stroke();
      }
    }

    // Blurred foliage silhouettes, close to the glass. Soft-edged, never hard blobs.
    const leafPalette = [[42, 55, 31], [54, 66, 37], [33, 47, 29], [62, 71, 38]];
    for (let i = 0; i < 9; i++) {
      const x = rnd() * w;
      const y = base * (0.18 + rnd() * 0.66);
      const rx = 58 + rnd() * 150;
      const ry = 18 + rnd() * 52;
      const p = leafPalette[Math.floor(rnd() * leafPalette.length)];
      c.save();
      c.translate(x, y);
      c.rotate((rnd() - 0.5) * 0.7);
      c.scale(1, ry / rx);
      const grad = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      grad.addColorStop(0, `rgba(${p[0]},${p[1]},${p[2]},.26)`);
      grad.addColorStop(0.55, `rgba(${p[0]},${p[1]},${p[2]},.14)`);
      grad.addColorStop(1, `rgba(${p[0]},${p[1]},${p[2]},0)`);
      c.fillStyle = grad;
      c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill();
      c.restore();
    }

    // A few distant soft stems, barely readable through the glass.
    c.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const x = rnd() * w;
      const top = base * (0.15 + rnd() * 0.55);
      const bend = (rnd() - 0.5) * 65;
      c.strokeStyle = `rgba(138, 127, 69, ${0.035 + rnd() * 0.045})`;
      c.lineWidth = 2 + rnd() * 6;
      c.beginPath();
      c.moveTo(x, base);
      c.quadraticCurveTo(x + bend, (base + top) / 2, x + bend * 0.4, top);
      c.stroke();
    }

    // A handful of small, brighter bokeh: dew or distant lamp glints.
    for (let i = 0; i < 11; i++) {
      const x = rnd() * w;
      const y = rnd() * base * 0.62;
      const r = 2 + rnd() * 8;
      const a = 0.10 + rnd() * 0.16;
      const grad = c.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, `rgba(255, 230, 178, ${a})`);
      grad.addColorStop(0.45, `rgba(255, 199, 126, ${a * 0.55})`);
      grad.addColorStop(1, 'rgba(255, 190, 110, 0)');
      c.fillStyle = grad;
      c.fillRect(x - r, y - r, r * 2, r * 2);
    }

    // Soft window bands in the distance.
    const bandGrad = c.createLinearGradient(w * 0.58, 0, w * 0.70, 0);
    bandGrad.addColorStop(0, 'rgba(255, 214, 158, 0)');
    bandGrad.addColorStop(0.35, 'rgba(255, 214, 158, .035)');
    bandGrad.addColorStop(1, 'rgba(255, 214, 158, 0)');
    c.fillStyle = bandGrad;
    c.fillRect(w * 0.55, 0, w * 0.18, base);

    // Haze just above the soil.
    const haze = c.createLinearGradient(0, base - h * 0.18, 0, base + 8);
    haze.addColorStop(0, 'rgba(92, 58, 28, 0)');
    haze.addColorStop(0.62, 'rgba(94, 58, 27, .13)');
    haze.addColorStop(1, 'rgba(48, 29, 15, .34)');
    c.fillStyle = haze;
    c.fillRect(0, base - h * 0.18, w, h * 0.18);
  }

  function bandPath(c, topFn, botFn) {
    c.beginPath();
    c.moveTo(0, topFn(0));
    for (let x = 3; x <= w; x += 3) c.lineTo(x, topFn(x));
    for (let x = w; x >= 0; x -= 3) c.lineTo(x, botFn(x));
    c.closePath();
  }

  function paintSoil(c) {
    const rnd = rngFor(0x5011);
    const terr = (x) => groundAt(x / w) * h;
    const sandTop = (x) => h * (0.492 + 0.016 * Math.sin(x * 0.0041 + 1.1) + 0.006 * Math.sin(x * 0.011 + 2.2));
    const clayTop = (x) => h * (0.668 + 0.018 * Math.sin(x * 0.0034 + 2.6) + 0.007 * Math.sin(x * 0.0093 + 0.4));
    const gravelTop = (x) => h * (0.828 + 0.012 * Math.sin(x * 0.0048 + 0.8) + 0.005 * Math.sin(x * 0.013 + 2.9));
    const topsoilBot = (x) => terr(x) + h * (0.058 + 0.010 * Math.sin(x * 0.0062 + 1.9));

    c.save();
    c.beginPath();
    c.moveTo(0, terr(0));
    for (let x = 2; x <= w; x += 2) c.lineTo(x, terr(x));
    c.lineTo(w, h); c.lineTo(0, h); c.closePath();
    c.clip();

    const base = c.createLinearGradient(0, h * 0.3, 0, h);
    base.addColorStop(0, '#2c1b10');
    base.addColorStop(0.36, '#5f4126');
    base.addColorStop(0.66, '#432c19');
    base.addColorStop(1, '#140d08');
    c.fillStyle = base;
    c.fillRect(0, 0, w, h);

    const bands = [
      { top: terr, bot: topsoilBot, a: '#1f130c', b: '#2c1b11' },
      { top: topsoilBot, bot: sandTop, a: '#412916', b: '#2d1c11' },
      { top: sandTop, bot: clayTop, a: '#8a6037', b: '#634326' },
      { top: clayTop, bot: gravelTop, a: '#4d301c', b: '#2d1c11' },
      { top: gravelTop, bot: () => h, a: '#241810', b: '#100a06' },
    ];
    for (const band of bands) {
      bandPath(c, band.top, band.bot);
      const grad = c.createLinearGradient(0, h * 0.32, 0, h);
      grad.addColorStop(0, band.a);
      grad.addColorStop(1, band.b);
      c.fillStyle = grad;
      c.fill();
    }

    // Strata lines and thin clay lenses.
    for (let i = 0; i < 30; i++) {
      const y0 = h * (0.49 + i * 0.0125) + (rnd() - 0.5) * 10;
      if (y0 > h * 0.93) break;
      c.strokeStyle = `rgba(236, 198, 137, ${0.02 + rnd() * 0.055})`;
      c.lineWidth = 0.6 + rnd() * 1.4;
      c.beginPath();
      c.moveTo(-10, y0);
      for (let x = 24; x <= w + 10; x += 24) c.lineTo(x, y0 + Math.sin(x * 0.006 + i * 1.7) * 5 + (rnd() - 0.5) * 2.5);
      c.stroke();
    }
    for (let i = 0; i < 16; i++) {
      const x = rnd() * w;
      const y = h * (0.5 + rnd() * 0.28);
      const rx = 18 + rnd() * 70;
      c.fillStyle = `rgba(36, 23, 14, ${0.10 + rnd() * 0.12})`;
      c.beginPath(); c.ellipse(x, y, rx, 3 + rnd() * 7, (rnd() - 0.5) * 0.12, 0, TAU); c.fill();
    }

    // Fine grain tile.
    const tile = makeNoiseTile();
    const pat = c.createPattern(tile, 'repeat');
    if (pat) {
      c.globalAlpha = 0.62;
      c.fillStyle = pat;
      c.fillRect(0, 0, w, h);
      c.globalAlpha = 1;
    }

    // Grains.
    const grainCount = clamp(Math.round((w * h) / 620 * detail), 1400, 8200);
    const grainColors = ['#d2ab72', '#9a7342', '#6a492b', '#e0c08a', '#3c2818'];
    for (let i = 0; i < grainCount; i++) {
      const x = rnd() * w;
      const top = terr(x) + 8;
      const y = top + Math.pow(rnd(), 0.72) * (h - top);
      const s = 0.35 + rnd() * 1.65;
      c.fillStyle = grainColors[Math.floor(rnd() * grainColors.length)];
      c.globalAlpha = 0.055 + rnd() * 0.20;
      c.fillRect(x, y, s, s * (0.5 + rnd()));
    }
    c.globalAlpha = 1;

    // Pebbles with a rim light from the upper left.
    for (let i = 0; i < 88; i++) {
      const x = rnd() * w;
      const top = terr(x) + h * 0.10;
      const y = top + rnd() * (h - top);
      const rx = 1.6 + rnd() * 8.5;
      const ry = rx * (0.45 + rnd() * 0.35);
      const tone = rnd();
      c.fillStyle = `rgba(24, 15, 10, ${0.25 + rnd() * 0.3})`;
      c.beginPath(); c.ellipse(x + 1.5, y + 2, rx, ry, -0.15, 0, TAU); c.fill();
      c.fillStyle = tone > 0.5 ? '#735031' : '#5a402a';
      c.beginPath(); c.ellipse(x, y, rx, ry, -0.15, 0, TAU); c.fill();
      c.strokeStyle = `rgba(222, 181, 122, ${0.10 + rnd() * 0.17})`;
      c.lineWidth = 0.8;
      c.beginPath(); c.ellipse(x, y, rx - 0.4, ry - 0.4, -0.15, Math.PI * 1.02, Math.PI * 1.78); c.stroke();
    }

    // Organic flecks and tiny leaf litter.
    for (let i = 0; i < 130; i++) {
      const x = rnd() * w;
      const y = terr(x) + 6 + rnd() * h * 0.55;
      c.fillStyle = rnd() > 0.5 ? 'rgba(112, 84, 46, .24)' : 'rgba(31, 20, 12, .3)';
      c.save();
      c.translate(x, y); c.rotate(rnd() * TAU);
      c.beginPath(); c.ellipse(0, 0, 1 + rnd() * 4, 0.5 + rnd() * 1.4, 0, 0, TAU); c.fill();
      c.restore();
    }

    // Fine quartz and mica specks catch the light.
    for (let i = 0; i < 90; i++) {
      const x = rnd() * w;
      const y = terr(x) + 20 + rnd() * (h - terr(x) - 20);
      c.fillStyle = rnd() > 0.5 ? 'rgba(255, 229, 187, .30)' : 'rgba(196, 205, 195, .17)';
      c.fillRect(x, y, 0.7 + rnd() * 1.2, 0.5 + rnd() * 0.8);
    }

    // Dry cracks in the clay.
    for (let i = 0; i < 14; i++) {
      const x0 = rnd() * w;
      const y0 = h * (0.62 + rnd() * 0.20);
      c.strokeStyle = `rgba(18, 11, 7, ${0.10 + rnd() * 0.10})`;
      c.lineWidth = 0.7;
      c.beginPath();
      c.moveTo(x0, y0);
      let cx0 = x0, cy0 = y0;
      for (let k = 0; k < 3; k++) {
        cx0 += (rnd() - 0.5) * 28;
        cy0 += 8 + rnd() * 18;
        c.lineTo(cx0, cy0);
      }
      c.stroke();
    }

    // Buried finds: a bead, a nail, a pale stone.
    for (const f of finds) {
      const x = f.x * w, y = f.y * h;
      if (f.kind === 'bead') {
        const grad = c.createRadialGradient(x - f.s * 0.35, y - f.s * 0.4, 0, x, y, f.s * 1.4);
        grad.addColorStop(0, 'rgba(174, 216, 218, .82)');
        grad.addColorStop(0.5, 'rgba(68, 139, 151, .72)');
        grad.addColorStop(1, 'rgba(28, 77, 91, .34)');
        c.fillStyle = grad;
        c.beginPath(); c.arc(x, y, f.s, 0, TAU); c.fill();
        c.fillStyle = 'rgba(244, 255, 250, .55)';
        c.beginPath(); c.arc(x - f.s * 0.35, y - f.s * 0.38, f.s * 0.22, 0, TAU); c.fill();
      } else if (f.kind === 'nail') {
        c.save(); c.translate(x, y); c.rotate(0.55 + f.s * 0.01);
        c.fillStyle = 'rgba(92, 57, 31, .82)';
        c.fillRect(-f.s * 0.5, -1.8, f.s, 3.6);
        c.fillStyle = 'rgba(151, 95, 48, .55)';
        c.fillRect(-f.s * 0.5, -1.8, f.s, 1.1);
        c.beginPath(); c.arc(f.s * 0.5, 0, 3.4, 0, TAU); c.fill();
        c.restore();
      } else {
        c.fillStyle = 'rgba(199, 184, 154, .55)';
        c.beginPath(); c.ellipse(x, y, f.s, f.s * 0.62, 0.4, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(246, 228, 192, .25)'; c.lineWidth = 1;
        c.beginPath(); c.ellipse(x, y, f.s - 1, f.s * 0.62 - 0.6, 0.4, Math.PI, Math.PI * 1.7); c.stroke();
      }
    }

    // Roots: fewer, thicker at the top, wandering as they descend.
    for (let i = 0; i < 11; i++) {
      const x = 0.045 + rnd() * 0.91;
      paintRoot(c, x * w, terr(x * w) + 2, h * (0.52 + rnd() * 0.44), 2.2 + rnd() * 3.8, rnd);
    }

    // Buried leaf imprint.
    c.save();
    c.translate(0.62 * w, 0.615 * h);
    c.rotate(-0.28);
    c.globalAlpha = 0.14;
    c.fillStyle = '#c49a5e';
    c.beginPath();
    c.ellipse(0, 0, 34, 10, 0, 0, TAU);
    c.fill();
    c.strokeStyle = '#f0cf98';
    c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-32, 0); c.lineTo(32, 0); c.stroke();
    for (let i = -3; i <= 3; i++) {
      c.beginPath(); c.moveTo(i * 8, 0); c.lineTo(i * 8 + 5, -8); c.moveTo(i * 8, 0); c.lineTo(i * 8 + 5, 8); c.stroke();
    }
    c.restore();

    // Topsoil crumbs near the surface.
    for (let i = 0; i < 250; i++) {
      const x = rnd() * w;
      const y = terr(x) + 2 + rnd() * h * 0.055;
      const s = 0.6 + rnd() * 2.2;
      c.fillStyle = rnd() > 0.45 ? 'rgba(16, 9, 5, .42)' : 'rgba(120, 84, 48, .34)';
      c.beginPath(); c.ellipse(x, y, s, s * 0.7, 0, 0, TAU); c.fill();
    }

    // Directional light falling into the cut face, and a dark base.
    const wash = c.createLinearGradient(0, h * 0.34, w * 0.62, h);
    wash.addColorStop(0, 'rgba(255, 203, 143, .065)');
    wash.addColorStop(0.45, 'rgba(255, 186, 118, .018)');
    wash.addColorStop(1, 'rgba(10, 5, 3, .16)');
    c.fillStyle = wash;
    c.fillRect(0, 0, w, h);
    const deep = c.createLinearGradient(0, h * 0.78, 0, h);
    deep.addColorStop(0, 'rgba(8, 4, 2, 0)');
    deep.addColorStop(1, 'rgba(8, 4, 2, .42)');
    c.fillStyle = deep;
    c.fillRect(0, h * 0.78, w, h * 0.22);

    // A dark seam where the topsoil meets the air.
    c.strokeStyle = 'rgba(9, 5, 3, .60)';
    c.lineWidth = 2.6;
    c.beginPath();
    c.moveTo(0, terr(0));
    for (let x = 3; x <= w; x += 3) c.lineTo(x, terr(x));
    c.stroke();
    c.strokeStyle = 'rgba(231, 181, 116, .28)';
    c.lineWidth = 0.8;
    c.beginPath();
    c.moveTo(0, terr(0) - 1.6);
    for (let x = 3; x <= w; x += 3) c.lineTo(x, terr(x) - 1.6);
    c.stroke();

    c.restore();

    // Moss mounds and low surface plants (not clipped to soil).
    paintMoss(c, rnd);

    // Entrances: a small crater and a dark hole at each surface gate.
    for (const n of nodes) {
      if (n.chamber || !n.id.startsWith('gate')) continue;
      const ex = n.x * w, ey = n.y * h;
      const big = n.id === 'gate';
      const rx = big ? 18 : 13;
      const ry = big ? 6.4 : 4.8;
      c.fillStyle = 'rgba(123, 86, 49, .30)';
      c.beginPath(); c.ellipse(ex, ey - 1, rx * 1.45, ry * 1.35, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(9, 5, 3, .94)';
      c.beginPath(); c.ellipse(ex, ey + 1, rx, ry, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(180, 126, 72, .45)';
      c.lineWidth = 1.3;
      c.beginPath(); c.ellipse(ex, ey + 0.5, rx * 1.1, ry * 1.15, 0, Math.PI * 0.06, Math.PI * 0.94); c.stroke();
      for (let i = 0; i < 16; i++) {
        const a = rnd() * TAU;
        const d = rx + 3 + rnd() * 9;
        c.fillStyle = rnd() > 0.5 ? 'rgba(148, 104, 59, .48)' : 'rgba(45, 29, 16, .58)';
        c.beginPath(); c.arc(ex + Math.cos(a) * d, ey + Math.sin(a) * d * 0.38, 0.8 + rnd() * 1.7, 0, TAU); c.fill();
      }
    }
  }

  function paintRoot(c, x, y, length, width, rnd) {
    c.save();
    c.lineCap = 'round';
    let px = x, py = y;
    const steps = 8 + Math.floor(rnd() * 4);
    const seg = length / steps;
    const phase = rnd() * TAU;
    const pts = [[px, py]];
    for (let i = 1; i <= steps; i++) {
      px += Math.sin(i * 0.95 + phase) * (17 + rnd() * 30) * (0.4 + i / steps);
      px = Math.max(4, Math.min(w - 4, px));
      py += seg * (0.85 + rnd() * 0.3);
      pts.push([px, py]);
    }
    // Tapered trunk.
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const t = i / pts.length;
      c.strokeStyle = `rgba(24, 14, 8, ${0.26 + (1 - t) * 0.16})`;
      c.lineWidth = Math.max(0.6, width * (1 - t * 0.72));
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
      if (i % 2 === 0) {
        const dir = rnd() > 0.5 ? 1 : -1;
        c.strokeStyle = 'rgba(24, 14, 8, .20)';
        c.lineWidth = Math.max(0.45, width * 0.34);
        c.beginPath();
        c.moveTo(b[0], b[1]);
        c.quadraticCurveTo(b[0] + dir * (12 + rnd() * 22), b[1] + 10, b[0] + dir * (18 + rnd() * 34), b[1] + 26 + rnd() * 30);
        c.stroke();
      }
      if (i % 3 === 0) {
        c.strokeStyle = 'rgba(122, 83, 48, .10)';
        c.lineWidth = 0.7;
        c.beginPath();
        c.moveTo(b[0] + 1, b[1]);
        c.lineTo(b[0] + 1 + (rnd() - 0.5) * 30, b[1] + 18 + rnd() * 26);
        c.stroke();
      }
    }
    c.restore();
  }

  function makeNoiseTile() {
    const tile = document.createElement('canvas');
    tile.width = 148; tile.height = 148;
    const g = tile.getContext('2d');
    const rnd = mulberry32(0x1F0F);
    for (let i = 0; i < 1500; i++) {
      const a = 0.02 + rnd() * 0.09;
      g.fillStyle = rnd() > 0.5 ? `rgba(255, 220, 168, ${a})` : `rgba(20, 11, 6, ${a * 1.5})`;
      const s = 0.5 + rnd() * 1.4;
      g.fillRect(rnd() * 148, rnd() * 148, s, s);
    }
    return tile;
  }

  function paintMoss(c, rnd) {
    for (const m of moss) {
      const x = m.x * w;
      const y = groundAt(m.x) * h;
      const radius = m.w * w;
      // A damp cushion under the fuzzy tips.
      c.fillStyle = 'rgba(25, 34, 17, .55)';
      c.beginPath(); c.ellipse(x, y + 1.5, radius * 1.08, radius * 0.20 + 2, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(74, 89, 44, .30)';
      c.beginPath(); c.ellipse(x, y - radius * 0.06, radius * 0.92, radius * 0.18 + 2, 0, 0, TAU); c.fill();
      for (let i = 0; i < 44; i++) {
        const a = rnd() * TAU;
        const d = Math.sqrt(rnd()) * radius;
        const px = x + Math.cos(a) * d;
        const py = y + Math.sin(a) * 0.24 * radius - rnd() * 7;
        const s = 1.2 + rnd() * 4.8;
        const t = rnd();
        c.fillStyle = t > 0.76 ? 'rgba(173, 177, 94, .55)'
          : t > 0.46 ? 'rgba(111, 131, 60, .62)'
            : t > 0.2 ? 'rgba(72, 92, 45, .68)' : 'rgba(48, 64, 34, .74)';
        c.beginPath(); c.ellipse(px, py, s, s * (0.5 + rnd() * 0.4), a, 0, TAU); c.fill();
      }
      // Sporophytes: tiny stems with capsules.
      for (let i = 0; i < 7; i++) {
        const sx = x + (rnd() - 0.5) * radius * 1.3;
        const sh = 7 + rnd() * 13;
        c.strokeStyle = `rgba(85, 103, 51, ${0.30 + rnd() * 0.25})`;
        c.lineWidth = 0.7;
        c.beginPath(); c.moveTo(sx, y); c.quadraticCurveTo(sx + 2, y - sh * 0.6, sx + 3, y - sh); c.stroke();
        c.fillStyle = 'rgba(157, 154, 89, .42)';
        c.beginPath(); c.ellipse(sx + 3, y - sh, 1.4, 2.2, 0.2, 0, TAU); c.fill();
      }
      // A handful of bright protonema tips.
      for (let i = 0; i < 12; i++) {
        c.fillStyle = `rgba(205, 200, 116, ${0.14 + rnd() * 0.24})`;
        c.beginPath();
        c.arc(x + (rnd() - 0.5) * radius * 1.7, y - rnd() * 7, 0.5 + rnd() * 1.0, 0, TAU);
        c.fill();
      }
    }

    // Background grass tufts, out of focus behind the ants.
    for (let i = 0; i < 9; i++) {
      const x = i < 5 ? 0.01 + rnd() * 0.27 : 0.72 + rnd() * 0.26;
      const baseY = groundAt(x) * h;
      for (let k = 0; k < 4; k++) {
        const hh = 9 + rnd() * 20;
        const lean = (rnd() - 0.5) * 12;
        c.strokeStyle = `rgba(58, 76, 41, ${0.18 + rnd() * 0.2})`;
        c.lineWidth = 0.8 + rnd() * 1.2;
        c.beginPath();
        c.moveTo(x * w + (rnd() - 0.5) * 8, baseY);
        c.quadraticCurveTo(x * w + lean * 0.4, baseY - hh * 0.6, x * w + lean, baseY - hh);
        c.stroke();
      }
    }

    // Small surface stones and a clover.
    for (let i = 0; i < 12; i++) {
      const x = 0.05 + rnd() * 0.9;
      const px = x * w, py = groundAt(x) * h - 1;
      const s = 1.5 + rnd() * 4;
      c.fillStyle = 'rgba(35, 23, 15, .55)';
      c.beginPath(); c.ellipse(px + 1, py + 1, s, s * 0.6, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(112, 88, 59, .7)';
      c.beginPath(); c.ellipse(px, py, s, s * 0.55, 0, Math.PI, TAU); c.fill();
      c.strokeStyle = 'rgba(190, 160, 112, .22)'; c.lineWidth = 0.7;
      c.beginPath(); c.ellipse(px, py, s - 0.5, s * 0.5, 0, Math.PI, TAU); c.stroke();
    }

    // Two fallen leaves lying flat on the moss.
    for (const leaf of [
      { x: 0.315, rot: -0.32, s: 1.0 },
      { x: 0.812, rot: 0.45, s: 0.72 },
    ]) {
      const lx = leaf.x * w, ly = groundAt(leaf.x) * h - 2;
      c.save();
      c.translate(lx, ly);
      c.rotate(leaf.rot);
      c.scale(leaf.s, leaf.s);
      c.fillStyle = 'rgba(91, 104, 49, .72)';
      c.beginPath();
      c.moveTo(-22, 0);
      c.quadraticCurveTo(-8, -10, 20, -2);
      c.quadraticCurveTo(7, 8, -22, 0);
      c.fill();
      c.strokeStyle = 'rgba(166, 166, 96, .34)';
      c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(-19, 0); c.lineTo(16, -1.5); c.stroke();
      for (let i = -3; i <= 3; i++) {
        c.strokeStyle = 'rgba(60, 74, 34, .25)';
        c.beginPath(); c.moveTo(i * 5, 0); c.lineTo(i * 5 + 4, -4.5); c.stroke();
      }
      c.restore();
    }

    // A few tiny white flowers.
    for (let i = 0; i < 6; i++) {
      const fx = 0.08 + hash1(i + 31) * 0.84;
      const fy = groundAt(fx) * h - 2 - hash1(i + 12) * 5;
      const fs = 1.2 + hash1(i + 4) * 1.3;
      c.fillStyle = 'rgba(238, 231, 199, .62)';
      for (let k = 0; k < 4; k++) {
        const a = (k / 4) * TAU + 0.4;
        c.beginPath(); c.ellipse(fx + Math.cos(a) * fs, fy + Math.sin(a) * fs * 0.7, fs * 0.65, fs * 0.45, a, 0, TAU); c.fill();
      }
      c.fillStyle = 'rgba(218, 178, 92, .72)';
      c.beginPath(); c.arc(fx, fy, fs * 0.35, 0, TAU); c.fill();
    }

    // A clover at the right, low enough to read as ground cover.
    const cx = 0.705 * w, cy = groundAt(0.705) * h;
    c.strokeStyle = 'rgba(71, 93, 45, .8)'; c.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * 0.55;
      c.beginPath();
      c.moveTo(cx, cy);
      c.quadraticCurveTo(cx + Math.cos(a) * 7, cy - 10, cx + Math.cos(a) * 12, cy - 16 - i * 2);
      c.stroke();
      c.fillStyle = 'rgba(91, 112, 54, .82)';
      c.beginPath();
      c.ellipse(cx + Math.cos(a) * 13, cy - 18 - i * 2, 4.5, 2.4, a, 0, TAU);
      c.fill();
    }
  }

  function polygonFor(shape, expand) {
    return shape.kind === 'edge'
      ? edgePolygon(shape.edge, shape.r, expand)
      : roomPolygon(shape.node, shape.r, expand);
  }

  function tracePolygon(c, pts) {
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
    c.closePath();
  }

  function fillPolygon(c, pts, style) {
    tracePolygon(c, pts);
    c.fillStyle = style;
    c.fill();
  }

  function edgePolygon(edge, reveal, expand) {
    const n = Math.max(2, Math.floor(edge.pts.length * reveal));
    const left = [], right = [];
    for (let i = 0; i < n; i++) {
      const p = edge.pts[i];
      const a = edge.pts[Math.max(0, i - 1)];
      const b = edge.pts[Math.min(n - 1, i + 1)];
      const dx = (b.x - a.x) * w, dy = (b.y - a.y) * h;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const wob = 1
        + 0.19 * Math.sin(i * 0.51 + edge.index * 2.1)
        + 0.08 * Math.sin(i * 1.27 + edge.index * 0.7);
      const jitter = (hash1(i * 1.7 + edge.index * 13.1) - 0.5) * 1.6;
      const half = edge.width * 0.5 * wob + expand + jitter;
      left.push({ x: p.x * w + nx * half, y: p.y * h + ny * half });
      right.push({ x: p.x * w - nx * half, y: p.y * h - ny * half });
    }
    for (let i = right.length - 1; i >= 0; i--) left.push(right[i]);
    return left;
  }

  function roomPolygon(node, reveal, expand) {
    const k = 0.12 + 0.88 * reveal;
    const rx = node.rx * w * k + expand;
    const ry = node.ry * h * k + expand;
    const pts = [];
    const n = 38;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const wob = 1
        + 0.045 * Math.sin(a * 3 + node.index * 1.7)
        + 0.022 * Math.sin(a * 7 + node.index * 2.3);
      pts.push({
        x: node.x * w + Math.cos(a) * rx * wob,
        y: node.y * h + Math.sin(a) * ry * wob,
      });
    }
    return pts;
  }

  function paintNest(c) {
    c.clearRect(0, 0, w, h);
    const shapes = [];
    for (const n of nodes) {
      if (!n.chamber) continue;
      const r = revealOf(n.stage, n.index);
      if (r > 0.004) shapes.push({ kind: 'room', node: n, r });
    }
    for (const e of edges) {
      const r = revealOf(e.stage, e.index);
      if (r > 0.004) shapes.push({ kind: 'edge', edge: e, r });
    }
    const rnd = rngFor(0x9911);
    const voidGrad = c.createLinearGradient(0, h * 0.34, 0, h);
    voidGrad.addColorStop(0, '#3b271a');
    voidGrad.addColorStop(0.55, '#301e14');
    voidGrad.addColorStop(1, '#21140d');

    // 1) soft soil shadow
    for (const s of shapes) fillPolygon(c, polygonFor(s, 12), 'rgba(10, 5, 3, .20)');
    // 2) two loose bands of packed earth
    for (const s of shapes) fillPolygon(c, polygonFor(s, 6.5), 'rgba(67, 44, 27, .62)');
    for (const s of shapes) fillPolygon(c, polygonFor(s, 3.2), 'rgba(103, 70, 42, .88)');

    // 3) cavities
    for (const s of shapes) {
      if (s.kind === 'edge') {
        fillPolygon(c, polygonFor(s, 0), voidGrad);
      } else {
        const n = s.node;
        const cx = n.x * w, cy = n.y * h;
        const rx = n.rx * w * (0.12 + 0.88 * s.r);
        const ry = n.ry * h * (0.12 + 0.88 * s.r);
        const grad = c.createRadialGradient(cx, cy - ry * 0.2, 0, cx, cy, Math.max(rx, ry) * 1.5);
        grad.addColorStop(0, 'rgba(132, 83, 46, .72)');
        grad.addColorStop(0.4, '#482c1b');
        grad.addColorStop(0.76, '#301e14');
        grad.addColorStop(1, '#20130c');
        fillPolygon(c, polygonFor(s, 0), grad);
        c.save();
        tracePolygon(c, polygonFor(s, 0));
        c.clip();
        const shade = c.createLinearGradient(0, cy - ry, 0, cy + ry);
        shade.addColorStop(0, 'rgba(4, 2, 1, .34)');
        shade.addColorStop(0.52, 'rgba(4, 2, 1, 0)');
        shade.addColorStop(1, 'rgba(238, 167, 100, .06)');
        c.fillStyle = shade;
        c.fillRect(cx - rx * 1.3, cy - ry * 1.3, rx * 2.6, ry * 2.6);
        c.restore();
      }
    }

    // 4) inner depth, crumbs and a rough earthen lip along every wall
    for (const s of shapes) {
      if (s.kind !== 'edge') continue;
      const voidPoly = polygonFor(s, 0);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of voidPoly) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      c.save();
      tracePolygon(c, voidPoly);
      c.clip();
      const depth = c.createLinearGradient(0, minY, 0, maxY);
      depth.addColorStop(0, 'rgba(3, 2, 1, .24)');
      depth.addColorStop(0.55, 'rgba(3, 2, 1, 0)');
      depth.addColorStop(1, 'rgba(247, 174, 105, .05)');
      c.fillStyle = depth;
      c.fillRect(minX, minY, maxX - minX, maxY - minY);
      c.restore();

      const pts = s.edge.pts;
      const n = Math.max(2, Math.floor(pts.length * s.r));
      for (let i = 3; i < n - 2; i += 2) {
        const p = pts[i];
        const a = pts[i - 1], b = pts[Math.min(n - 1, i + 1)];
        const dx = (b.x - a.x) * w, dy = (b.y - a.y) * h;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const half = s.edge.width * 0.5;
        if (i % 4 === 1) {
          c.fillStyle = rnd() > 0.45 ? 'rgba(146, 102, 58, .32)' : 'rgba(15, 8, 4, .42)';
          c.beginPath();
          c.arc(p.x * w - nx * half * 0.55, p.y * h - ny * half * 0.55, 0.5 + rnd() * 1.2, 0, TAU);
          c.fill();
        }
        if (i % 2 === 0) {
          for (const side of [-1, 1]) {
            const off = half + 0.5 + rnd() * 5.5;
            const light = rnd() > 0.45;
            c.fillStyle = light
              ? `rgba(172, 124, 74, ${0.12 + rnd() * 0.28})`
              : `rgba(12, 7, 3, ${0.12 + rnd() * 0.28})`;
            c.beginPath();
            c.arc(p.x * w + nx * off * side, p.y * h + ny * off * side, 0.4 + rnd() * 1.9, 0, TAU);
            c.fill();
          }
          // Loose sand on the tunnel floor catches a little light.
          c.fillStyle = `rgba(203, 156, 96, ${0.10 + rnd() * 0.22})`;
          c.beginPath();
          c.arc(
            p.x * w + (rnd() - 0.5) * half * 0.9,
            p.y * h + half * (0.42 + rnd() * 0.18),
            0.4 + rnd() * 1.4,
            0,
            TAU
          );
          c.fill();
        }
      }
    }

    // 5) a root hair or two crossing the corridors
    c.save();
    c.strokeStyle = 'rgba(28, 16, 8, .42)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(0.365 * w, 0.49 * h);
    c.bezierCurveTo(0.42 * w, 0.60 * h, 0.48 * w, 0.63 * h, 0.51 * w, 0.76 * h);
    c.stroke();
    c.strokeStyle = 'rgba(28, 16, 8, .32)';
    c.beginPath();
    c.moveTo(0.80 * w, 0.60 * h);
    c.bezierCurveTo(0.77 * w, 0.70 * h, 0.73 * w, 0.77 * h, 0.71 * w, 0.87 * h);
    c.stroke();
    c.restore();
  }
  function paintGlass(c) {
    // Thin glass edges, with a diagonal reflection near the top.
    const left = c.createLinearGradient(0, 0, w * 0.045, 0);
    left.addColorStop(0, 'rgba(255, 225, 184, .20)');
    left.addColorStop(0.14, 'rgba(255, 225, 184, .055)');
    left.addColorStop(0.55, 'rgba(255, 225, 184, .012)');
    left.addColorStop(1, 'rgba(255, 225, 184, 0)');
    c.fillStyle = left;
    c.fillRect(0, 0, w * 0.045, h);
    const right = c.createLinearGradient(w, 0, w * 0.955, 0);
    right.addColorStop(0, 'rgba(255, 225, 184, .16)');
    right.addColorStop(0.14, 'rgba(255, 225, 184, .042)');
    right.addColorStop(0.6, 'rgba(255, 225, 184, .010)');
    right.addColorStop(1, 'rgba(255, 225, 184, 0)');
    c.fillStyle = right;
    c.fillRect(w * 0.955, 0, w * 0.045, h);

    c.save();
    c.globalAlpha = 0.075;
    c.fillStyle = 'rgba(255, 236, 208, 1)';
    c.beginPath();
    c.moveTo(w * 0.10, 0);
    c.lineTo(w * 0.19, 0);
    c.lineTo(w * 0.055, h * 0.55);
    c.lineTo(w * 0.02, h * 0.55);
    c.closePath();
    c.fill();
    c.restore();

    c.strokeStyle = 'rgba(255, 230, 190, .12)';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(w * 0.055, h * 0.12); c.lineTo(w * 0.055, h * 0.62); c.stroke();
    c.strokeStyle = 'rgba(255, 230, 190, .06)';
    c.beginPath(); c.moveTo(w * 0.947, h * 0.18); c.lineTo(w * 0.947, h * 0.72); c.stroke();
  }

  function paintVignette(c) {
    const g = c.createRadialGradient(w * 0.5, h * 0.47, Math.min(w, h) * 0.18, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
    g.addColorStop(0, 'rgba(10, 5, 3, 0)');
    g.addColorStop(0.60, 'rgba(10, 5, 3, .15)');
    g.addColorStop(1, 'rgba(7, 3, 2, .66)');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    const bottom = c.createLinearGradient(0, h * 0.82, 0, h);
    bottom.addColorStop(0, 'rgba(10, 5, 3, 0)');
    bottom.addColorStop(1, 'rgba(6, 3, 2, .42)');
    c.fillStyle = bottom;
    c.fillRect(0, h * 0.82, w, h * 0.18);
    const top = c.createLinearGradient(0, 0, 0, h * 0.12);
    top.addColorStop(0, 'rgba(6, 3, 2, .30)');
    top.addColorStop(1, 'rgba(6, 3, 2, 0)');
    c.fillStyle = top;
    c.fillRect(0, 0, w, h * 0.12);
  }

  /* -------------------------------- colony state -------------------------------- */

  function makeAnt() {
    const sizeFactor = 0.90 + simRandom() * 0.18;
    const size = clamp(Math.min(w * 0.030, h * 0.028), 14, 44) * sizeFactor;
    return {
      size, sizeFactor,
      x: 0.5, y: 0.5, face: 0, moveDir: 1,
      mode: 'surface', state: 'forage',
      phase: simRandom() * TAU,
      walk: simRandom() * TAU,
      rest: 0, turn: 0.4 + simRandom() * 2,
      carrying: null, targetFood: null,
      node: 'gate', targetNode: null, path: null, pathIndex: 0,
      dwell: 0, pendingDeposit: false, slot: simRandom(),
      fade: 0, scentClock: 0,
    };
  }

  function makeSurfaceAntAt(x) {
    const a = makeAnt();
    a.x = clamp(x, 0.03, 0.97);
    a.y = groundAt(a.x);
    a.moveDir = simRandom() < 0.5 ? -1 : 1;
    a.face = a.moveDir > 0 ? 0 : Math.PI;
    a.fade = 0.6;
    return a;
  }

  function initColony() {
    ants = [];
    foods = [];
    foodSeq = 0;
    scent.fill(0);
    saveTimer = 0;
    hudTimer = 0;
    autoTimer = 28 + simRandom() * 14;
    birthTimer = 9 + simRandom() * 5;
    scoutTimer = 2;

    for (let i = 0; i < population; i++) {
      if (simRandom() < 0.34 && stage >= 1) {
        const rooms = nodes.filter((n) => n.chamber && n.stage <= usableStage());
        const room = rooms[Math.floor(simRandom() * rooms.length)] || nodeById.get('hall');
        const a = makeAnt();
        a.mode = 'underground';
        a.node = room.id;
        a.targetNode = room.id;
        a.x = room.x + (simRandom() - 0.5) * room.rx * 0.5;
        a.y = room.y + (simRandom() - 0.5) * room.ry * 0.5;
        a.state = 'rest';
        a.dwell = 3.5 + simRandom() * 8;
        a.fade = 1;
        ants.push(a);
      } else {
        ants.push(makeSurfaceAntAt(0.05 + simRandom() * 0.9));
      }
    }

    const initialFood = foodParam !== null ? clamp(foodParam, 0, 6) : 1;
    for (let i = 0; i < initialFood; i++) {
      dropFood(0.18 + simRandom() * 0.64, FOOD_KINDS[i % FOOD_KINDS.length], { landed: true });
    }
    refreshReadout();
  }

  function spawnAnt() {
    const a = makeAnt();
    const nursery = nodeById.get('nursery');
    if (stage >= 2 && nursery) {
      a.mode = 'underground';
      a.node = 'nursery';
      a.targetNode = 'nursery';
      a.x = nursery.x + (simRandom() - 0.5) * nursery.rx * 0.5;
      a.y = nursery.y + (simRandom() - 0.5) * nursery.ry * 0.4;
      a.state = 'rest';
      a.dwell = 1 + simRandom() * 3;
      a.fade = 0;
    } else {
      a.x = gate.x;
      a.y = gate.y;
      a.moveDir = simRandom() < 0.5 ? -1 : 1;
      a.face = a.moveDir > 0 ? 0 : Math.PI;
      a.fade = 0;
    }
    ants.push(a);
  }

  function dropFood(x, kind, opts = {}) {
    const alive = foods.filter((f) => !f.dead && f.amount > 0);
    if (alive.length >= 6 && !opts.force) {
      return null;
    }
    const type = FOOD_KINDS.includes(kind) ? kind : FOOD_KINDS[foodSeq % FOOD_KINDS.length];
    const amount = 8 + Math.floor(simRandom() * 7);
    const spawnLanded = !!opts.landed || (paused && !booting);
    const f = {
      id: ++foodSeq,
      x: clamp(x, 0.055, 0.945),
      y: spawnLanded ? groundAt(clamp(x, 0.055, 0.945)) : -0.045,
      vy: 0, rot: (simRandom() - 0.5) * 0.7, spin: (simRandom() - 0.5) * 2.4,
      type, amount, max: amount,
      landed: spawnLanded, age: 0, fade: 1,
      active: 0,
    };
    foods.push(f);
    return f;
  }

  function nearestFood(x, radius) {
    let best = null, bestD = radius;
    for (const f of foods) {
      if (!f.landed || f.amount <= 0 || f.dead) continue;
      const d = Math.abs(f.x - x) * w;
      if (d < bestD) {
        const claimed = ants.some((a) => a.targetFood === f.id && a.carrying !== f.id);
        if (claimed) continue;
        best = f; bestD = d;
      }
    }
    return best;
  }

  function pickup(a, f) {
    if (!f || f.amount <= 0 || !f.landed) return;
    f.amount -= 1;
    f.active = 1;
    a.carrying = { type: f.type, size: f.max };
    a.targetFood = null;
    a.state = 'carry';
    a.rest = 0;
    a.scentClock = 0.2;
    if (f.amount <= 0) {
      for (const o of ants) if (o.targetFood === f.id) o.targetFood = null;
    }
  }

  function depositScent(x, amount) {
    const center = clamp(Math.floor(x * SCENT_BINS), 0, SCENT_BINS - 1);
    scent[center] = Math.min(1.0, scent[center] + amount);
    if (center > 0) scent[center - 1] = Math.min(1.0, scent[center - 1] + amount * 0.34);
    if (center < SCENT_BINS - 1) scent[center + 1] = Math.min(1.0, scent[center + 1] + amount * 0.34);
  }

  function scentAt(x) {
    const i = clamp(Math.floor(x * SCENT_BINS), 0, SCENT_BINS - 1);
    return scent[i];
  }

  function scentDirection(x, fallback) {
    const radiusPx = Math.max(26, Math.min(56, w * 0.024));
    const bins = Math.max(2, Math.round(radiusPx / w * SCENT_BINS));
    const center = Math.round(x * SCENT_BINS);
    let left = 0, right = 0;
    for (let d = 2; d <= bins; d++) {
      left = Math.max(left, scent[clamp(center - d, 0, SCENT_BINS - 1)]);
      right = Math.max(right, scent[clamp(center + d, 0, SCENT_BINS - 1)]);
    }
    if (Math.max(left, right) < 0.035) return 0;
    if (Math.abs(left - right) < 0.018) {
      if (Math.abs(x - gate.x) < 0.04 && fallback !== 0) return Math.sign(x - gate.x) || fallback;
      return fallback;
    }
    return right > left ? 1 : -1;
  }

  function enterNest(a) {
    a.mode = 'underground';
    a.node = 'gate';
    a.path = null;
    a.pathIndex = 0;
    a.state = 'inside';
    a.dwell = 0;
    a.face = -Math.PI / 2;
    a.pendingDeposit = !!a.carrying;
    const target = a.carrying ? (stage >= 3 ? 'granary' : 'hall') : chooseChamber('gate');
    setPath(a, target);
  }

  function exitNest(a) {
    a.mode = 'surface';
    a.node = 'gate';
    a.path = null;
    a.pathIndex = 0;
    a.state = 'forage';
    a.pendingDeposit = false;
    a.carrying = a.carrying || null;
    a.x = clamp(gate.x + (simRandom() - 0.5) * 0.02, 0.03, 0.97);
    a.y = groundAt(a.x);
    a.moveDir = simRandom() < 0.5 ? -1 : 1;
    a.face = a.moveDir > 0 ? 0 : Math.PI;
    a.rest = 0.4 + simRandom() * 1.4;
    a.turn = 0.8 + simRandom() * 1.8;
  }

  function chooseChamber(fromId) {
    const rooms = nodes.filter((n) => n.chamber && n.stage <= usableStage() && n.id !== fromId);
    if (!rooms.length) return 'hall';
    const weights = rooms.map((n) => {
      switch (n.type) {
        case 'nursery': return 3.2;
        case 'hall': return 2.4;
        case 'rest': return 2.0;
        case 'court': return 1.5;
        case 'garden': return 1.2;
        case 'granary': return 0.8;
        case 'grand': return 1.0;
        case 'spring': return 0.6;
        default: return 1;
      }
    });
    const total = weights.reduce((a, b) => a + b, 0);
    let pick = simRandom() * total;
    for (let i = 0; i < rooms.length; i++) {
      pick -= weights[i];
      if (pick <= 0) return rooms[i].id;
    }
    return rooms[rooms.length - 1].id;
  }

  function findNodePath(fromId, toId) {
    if (fromId === toId) return [];
    const prev = new Map([[fromId, null]]);
    const queue = [fromId];
    const maxStage = usableStage();
    while (queue.length) {
      const current = queue.shift();
      if (current === toId) break;
      for (const e of edges) {
        if (e.stage > maxStage) continue;
        let next = null;
        if (e.a === current) next = e.b;
        else if (e.b === current) next = e.a;
        if (!next || prev.has(next)) continue;
        const node = nodeById.get(next);
        if (!node || node.stage > maxStage) continue;
        prev.set(next, current);
        queue.push(next);
      }
    }
    if (!prev.has(toId)) return null;
    const ids = [];
    for (let cur = toId; cur; cur = prev.get(cur)) {
      ids.push(cur);
      if (prev.get(cur) === null) break;
    }
    ids.reverse();
    const points = [];
    for (let i = 0; i < ids.length - 1; i++) {
      const from = ids[i], to = ids[i + 1];
      const edge = edges.find((e) => (e.a === from && e.b === to) || (e.b === from && e.a === to));
      if (!edge) continue;
      const forward = edge.a === from;
      const pts = forward ? edge.pts : edge.pts.slice().reverse();
      for (let k = 0; k < pts.length; k++) {
        if (i > 0 && k === 0) continue;
        points.push({ x: pts[k].x, y: pts[k].y });
      }
    }
    return points;
  }

  function setPath(a, targetId) {
    const target = nodeById.get(targetId);
    if (!target) { exitNest(a); return; }
    const points = findNodePath(a.node || 'gate', targetId);
    if (!points) { exitNest(a); return; }
    if (target.chamber) {
      const ang = a.slot * TAU;
      points.push({
        x: target.x + Math.cos(ang) * target.rx * 0.34,
        y: target.y + Math.sin(ang) * target.ry * 0.30,
      });
    }
    a.path = points;
    a.pathIndex = points.length > 1 ? 1 : 0;
    a.targetNode = targetId;
    a.state = 'inside';
    a.face = -Math.PI / 2;
  }

  /* -------------------------------- simulation -------------------------------- */

  function update(dt) {
    time += dt;
    updateScent(dt);
    updateFoods(dt);
    updateAutoFeed(dt);

    for (const a of ants) {
      if (a.fade < 1) a.fade = Math.min(1, a.fade + dt * 1.6);
      a.phase += dt * (5.2 + a.size * 0.32);
      if (a.mode === 'surface') updateSurfaceAnt(a, dt);
      else updateUndergroundAnt(a, dt);
    }

    updateColony(dt);
    updateDig(dt);
    updateMotes(dt);

    if (!booting) {
      saveTimer += dt;
      if (saveTimer >= 8) { saveTimer = 0; saveState(); }
      hudTimer += dt;
      if (hudTimer >= 0.35) { hudTimer = 0; refreshReadout(); }
    }
  }

  function updateScent(dt) {
    const decay = Math.exp(-dt / 38);
    for (let i = 0; i < SCENT_BINS; i++) scent[i] *= decay;
    scentClock += dt;
    if (scentClock >= 0.18) {
      scentClock = 0;
      for (let i = 0; i < SCENT_BINS; i++) {
        scentTmp[i] = scent[i] * 0.64
          + (scent[i > 0 ? i - 1 : 0]) * 0.18
          + (scent[i < SCENT_BINS - 1 ? i + 1 : SCENT_BINS - 1]) * 0.18;
      }
      scent.set(scentTmp);
    }
  }

  function updateFoods(dt) {
    for (const f of foods) {
      f.age += dt;
      if (!f.landed) {
        f.vy += 920 * dt;
        f.y += f.vy * dt / h;
        f.rot += f.spin * dt;
        const g = groundAt(f.x);
        if (f.y >= g) {
          f.y = g;
          if (f.vy > 110) {
            f.vy *= -0.27;
            f.spin *= 0.5;
          } else {
            f.vy = 0;
            f.landed = true;
            f.rot = (simRandom() - 0.5) * 0.5;
          }
        }
      }
      if (f.active > 0) f.active = Math.max(0, f.active - dt * 0.7);
      if (f.amount <= 0) {
        f.fade = Math.max(0, f.fade - dt * 0.8);
        if (f.fade <= 0) f.dead = true;
      }
    }
    if (foods.some((f) => f.dead)) foods = foods.filter((f) => !f.dead);
  }

  function updateAutoFeed(dt) {
    if (!autoFeed) return;
    autoTimer -= dt;
    if (autoTimer > 0) return;
    const alive = foods.filter((f) => !f.dead && f.amount > 0);
    if (alive.length < 2) dropFood(0.14 + simRandom() * 0.72);
    autoTimer = 55 + simRandom() * 40;
  }

  function updateSurfaceAnt(a, dt) {
    if (a.rest > 0) {
      a.rest -= dt;
      return;
    }
    let moveDir = a.moveDir || 1;
    let targetX = null;
    let speed = 15 + (a.size - 9) * 0.55;

    if (a.carrying) {
      speed = 12.4;
      targetX = gate.x;
      a.scentClock += dt;
      if (a.scentClock > 0.10) {
        a.scentClock = 0;
        depositScent(a.x, 0.24);
      }
      if (Math.abs(a.x - gate.x) * w < Math.max(13, 15)) {
        enterNest(a);
        return;
      }
    } else if (a.targetFood !== null) {
      const f = foods.find((x) => x.id === a.targetFood);
      if (!f || f.amount <= 0 || f.dead) {
        a.targetFood = null;
        a.state = 'forage';
      } else {
        targetX = f.x;
        speed = 18;
        if (Math.abs(a.x - f.x) * w < Math.max(7, a.size * 0.6)) {
          pickup(a, f);
          return;
        }
      }
    } else {
      const f = nearestFood(a.x, Math.min(185, w * 0.105));
      if (f) {
        a.targetFood = f.id;
        a.state = 'scout';
        targetX = f.x;
        speed = 18.5;
      } else if (showPhero) {
        const dir = scentDirection(a.x, moveDir);
        if (dir !== 0 && simRandom() < 0.88) moveDir = dir;
      }
    }

    a.turn -= dt;
    if (targetX === null && a.turn <= 0) {
      a.turn = 0.8 + simRandom() * 2.6;
      if (simRandom() < 0.16) a.rest = 0.6 + simRandom() * 1.8;
      moveDir = simRandom() < 0.5 ? -1 : 1;
    }
    if (targetX !== null) moveDir = targetX > a.x ? 1 : -1;
    if (a.x < 0.028) moveDir = 1;
    if (a.x > 0.972) moveDir = -1;
    a.moveDir = moveDir;

    const speedScale = clamp(Math.min(w, h) / 900, 0.75, 2.4);
    const stepPx = speed * speedScale * dt;
    a.x = clamp(a.x + (moveDir * stepPx) / w, 0.018, 0.982);
    const ny = groundAt(a.x);
    const slope = (ny - a.y) * h;
    a.y = ny;
    const faceTarget = Math.atan2(slope, moveDir * stepPx || moveDir);
    a.face = lerpAngle(a.face, faceTarget, Math.min(1, dt * 9));
  }

  function updateUndergroundAnt(a, dt) {
    if (a.path && a.pathIndex < a.path.length) {
      const p = a.path[a.pathIndex];
      const dx = (p.x - a.x) * w;
      const dy = (p.y - a.y) * h;
      const dist = Math.hypot(dx, dy);
      const speedScale = clamp(Math.min(w, h) / 900, 0.75, 2.4);
      const step = (a.carrying ? 17 : 22) * speedScale * dt;
      if (dist <= step) {
        a.x = p.x; a.y = p.y; a.pathIndex++;
      } else {
        a.x += (dx / dist) * step / w;
        a.y += (dy / dist) * step / h;
        a.face = lerpAngle(a.face, Math.atan2(dy, dx), Math.min(1, dt * 10));
      }
      if (a.pathIndex >= a.path.length) {
        a.path = null;
        a.node = a.targetNode;
        a.dwell = 3.4 + simRandom() * 7.2;
        if (a.targetNode === 'gate') { exitNest(a); return; }
      }
      return;
    }

    if (a.dwell > 0) { a.dwell -= dt; return; }

    if (a.pendingDeposit) {
      a.pendingDeposit = false;
      a.carrying = null;
      stored += 1;
      delivered += 1;
      checkStage();
      a.dwell = 0.5 + simRandom() * 1.2;
      return;
    }

    if (simRandom() < 0.38 || a.node === 'gate') {
      setPath(a, 'gate');
    } else {
      setPath(a, chooseChamber(a.node));
    }
  }

  function updateColony(dt) {
    if (stored >= 4 && population < POP_CAP[stage]) {
      birthTimer -= dt;
      if (birthTimer <= 0) {
        stored -= 4;
        population += 1;
        born += 1;
        spawnAnt();
        birthTimer = 12 + simRandom() * 4;
      }
    } else {
      birthTimer = Math.max(birthTimer, 3);
    }

    scoutTimer -= dt;
    if (scoutTimer <= 0) {
      scoutTimer = 2.2;
      for (const f of foods) {
        if (!f.landed || f.amount <= 0 || f.dead) continue;
        const hasScout = ants.some((a) => a.targetFood === f.id);
        if (hasScout || f.age < 3.5) continue;
        const candidates = ants.filter((a) => a.mode === 'surface' && !a.carrying && a.targetFood === null);
        if (!candidates.length) continue;
        const ant = candidates[Math.floor(simRandom() * candidates.length)];
        ant.targetFood = f.id;
        ant.state = 'scout';
      }
    }
  }

  function updateDig(dt) {
    if (!digActive) return;
    digTime += dt;
    digPaint -= dt;
    if (digPaint <= 0) {
      digPaint = 0.12;
      paintNest(nestCache.x);
    }
    if (digTime >= 7) {
      digActive = false;
      digTime = 7;
      paintNest(nestCache.x);
    }
  }

  function updateMotes(dt) {
    for (const m of motes) {
      m.y -= m.speed * dt;
      m.x += Math.sin(time * 0.22 + m.phase) * m.drift * dt;
      if (m.y < 0.01) { m.y = groundBase - 0.02; m.x = simRandom(); }
      if (m.x < 0.01) m.x = 0.99;
      if (m.x > 0.99) m.x = 0.01;
    }
  }

  function checkStage() {
    let changed = false;
    while (stage < 6 && delivered >= NEED[stage + 1]) {
      stage += 1;
      changed = true;
      triggerDig(stage);
    }
    if (changed) {
      saveState();
      refreshReadout();
    }
  }

  function triggerDig(nextStage) {
    digActive = true;
    digTime = 0;
    digStage = nextStage;
    digPaint = 0;
    const room = nodes.find((n) => n.chamber && n.stage === nextStage);
    showToast('巢室延伸 · ' + (room ? room.label : STAGE_NAMES[nextStage]));
  }

  /* -------------------------------- drawing -------------------------------- */

  function render() {
    if (!w || !h || !airCache) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    ctx.drawImage(airCache.c, 0, 0, w, h);
    drawLightBreath(ctx);
    ctx.drawImage(soilCache.c, 0, 0, w, h);
    ctx.drawImage(nestCache.c, 0, 0, w, h);
    drawChambers(ctx);
    drawUndergroundAnts(ctx);
    drawPheromone(ctx);
    drawEntranceGlow(ctx);
    drawFoods(ctx);
    drawSurfaceAnts(ctx);
    drawForeground(ctx);
    drawEntranceLip(ctx);
    drawMotes(ctx);
    drawAtmosphere(ctx);
    ctx.drawImage(glassCache.c, 0, 0, w, h);
    drawPointer(ctx);
    ctx.drawImage(vignetteCache.c, 0, 0, w, h);
    frames++;
  }

  function drawLightBreath(c) {
    const breath = 0.5 + 0.5 * Math.sin(time / 68);
    const g = c.createRadialGradient(w * 0.16, h * 0.04, 0, w * 0.22, h * 0.16, Math.max(w, h) * 0.55);
    g.addColorStop(0, `rgba(255, 195, 120, ${0.028 + breath * 0.024})`);
    g.addColorStop(1, 'rgba(255, 195, 120, 0)');
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    c.restore();
  }

  function drawAtmosphere(c) {
    const lg = c.createLinearGradient(0, 0, w * 0.85, h);
    lg.addColorStop(0, 'rgba(255, 199, 132, .105)');
    lg.addColorStop(0.30, 'rgba(255, 190, 120, .028)');
    lg.addColorStop(0.64, 'rgba(16, 8, 4, .035)');
    lg.addColorStop(1, 'rgba(8, 4, 2, .20)');
    c.fillStyle = lg;
    c.fillRect(0, 0, w, h);
    const cool = c.createLinearGradient(w * 0.62, 0, w * 0.22, h * 0.72);
    cool.addColorStop(0, 'rgba(47, 64, 56, .07)');
    cool.addColorStop(0.55, 'rgba(38, 50, 44, .025)');
    cool.addColorStop(1, 'rgba(30, 40, 35, 0)');
    c.fillStyle = cool;
    c.fillRect(0, 0, w, h * 0.72);
  }

  function drawChambers(c) {
    for (const n of nodes) {
      if (!n.chamber || n.stage > stage) continue;
      const reveal = revealOf(n.stage, n.index);
      if (reveal < 0.6) continue;
      const cx = n.x * w, cy = n.y * h;
      const rx = n.rx * w, ry = n.ry * h;
      const pulse = 0.5 + 0.5 * Math.sin(time * 0.7 + n.index);
      switch (n.type) {
        case 'nursery': drawNursery(c, cx, cy, rx, ry, pulse); break;
        case 'granary': drawGranary(c, cx, cy, rx, ry); break;
        case 'court': drawCourt(c, cx, cy, rx, ry, pulse); break;
        case 'garden': drawGarden(c, cx, cy, rx, ry, pulse); break;
        case 'hall':
          drawSeed(c, cx - rx * 0.25, cy + ry * 0.34, 6.2, 0.2);
          drawSeed(c, cx + rx * 0.18, cy + ry * 0.42, 5.2, -0.4);
          break;
        case 'rest':
          c.fillStyle = 'rgba(95, 64, 37, .30)';
          c.beginPath(); c.ellipse(cx, cy + ry * 0.42, rx * 0.5, ry * 0.16, 0, 0, TAU); c.fill();
          break;
        case 'grand':
          c.fillStyle = 'rgba(214, 154, 94, .05)';
          c.beginPath(); c.ellipse(cx, cy + ry * 0.18, rx * 0.8, ry * 0.6, 0, 0, TAU); c.fill();
          for (let i = 0; i < 5; i++) {
            const a = hash1(i + n.index) * TAU;
            c.fillStyle = 'rgba(142, 104, 63, .22)';
            c.beginPath();
            c.ellipse(cx + Math.cos(a) * rx * 0.55, cy + ry * 0.45 + Math.sin(a) * ry * 0.14, 2 + hash1(i) * 3, 1.2 + hash1(i + 9) * 2, 0, 0, TAU);
            c.fill();
          }
          break;
        case 'spring': drawSpring(c, cx, cy, rx, ry); break;
      }
    }
  }

  function drawNursery(c, cx, cy, rx, ry, pulse) {
    const count = clamp(Math.ceil(population / 5), 4, 20);
    for (let i = 0; i < count; i++) {
      const row = i < 7 ? 0 : i < 14 ? 1 : 2;
      const inRow = row === 0 ? Math.min(7, count) : row === 1 ? Math.min(7, Math.max(0, count - 7)) : Math.max(0, count - 14);
      const idx = row === 0 ? i : row === 1 ? i - 7 : i - 14;
      const spread = rx * 0.62;
      const x = cx + (idx - (inRow - 1) / 2) * (spread / Math.max(1, inRow - 1 || 1));
      const y = cy + ry * (0.12 + row * 0.20) + Math.sin(time * 0.8 + i) * 0.4;
      if (i % 3 === 0) {
        c.fillStyle = 'rgba(243, 233, 208, .86)';
        c.beginPath(); c.ellipse(x, y, 3.7 * pulse, 2.3 * pulse, 0.3, 0, TAU); c.fill();
      } else if (i % 3 === 1) {
        c.fillStyle = 'rgba(233, 209, 164, .78)';
        c.beginPath(); c.ellipse(x, y, 4.2, 2.2, 0.2, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(160, 125, 77, .38)'; c.lineWidth = 0.7;
        c.beginPath(); c.moveTo(x - 3.2, y); c.lineTo(x + 3.2, y); c.stroke();
      } else {
        c.fillStyle = 'rgba(217, 186, 133, .74)';
        c.beginPath(); c.ellipse(x, y, 4.5, 3.0, -0.4, 0, TAU); c.fill();
      }
    }
    // A few pale cocoons near the upper left.
    c.fillStyle = 'rgba(232, 220, 190, .28)';
    c.beginPath(); c.ellipse(cx - rx * 0.55, cy - ry * 0.22, 3.4, 2.1, 0.5, 0, TAU); c.fill();
  }

  function drawGranary(c, cx, cy, rx, ry) {
    const count = Math.min(34, Math.floor(stored));
    for (let i = 0; i < count; i++) {
      const row = Math.floor(i / 9);
      const col = i % 9;
      const x = cx + (col - 4) * (rx * 0.15) + (row % 2 ? rx * 0.07 : 0);
      const y = cy + ry * (0.48 - row * 0.13);
      drawSeed(c, x, y, 3.1 + hash1(i + 2) * 1.6, hash1(i + 7) * 2 - 1);
    }
    if (count === 0) {
      c.strokeStyle = 'rgba(214, 170, 110, .16)';
      c.lineWidth = 1;
      c.beginPath(); c.ellipse(cx, cy + ry * 0.3, rx * 0.55, ry * 0.22, 0, 0, TAU); c.stroke();
    }
  }

  function drawSeed(c, x, y, s, rot) {
    c.save();
    c.translate(x, y); c.rotate(rot);
    c.fillStyle = 'rgba(210, 175, 112, .85)';
    c.beginPath(); c.ellipse(0, 0, s, s * 0.62, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(118, 83, 42, .55)'; c.lineWidth = Math.max(0.5, s * 0.18);
    c.beginPath(); c.moveTo(-s * 0.75, 0); c.lineTo(s * 0.75, 0); c.stroke();
    c.fillStyle = 'rgba(247, 223, 174, .5)';
    c.beginPath(); c.ellipse(-s * 0.2, -s * 0.24, s * 0.34, s * 0.16, 0, 0, TAU); c.fill();
    c.restore();
  }

  function drawCourt(c, cx, cy, rx, ry, pulse) {
    const halo = c.createRadialGradient(cx, cy, 0, cx, cy, rx * 1.45);
    halo.addColorStop(0, 'rgba(255, 196, 126, .17)');
    halo.addColorStop(0.6, 'rgba(255, 170, 96, .055)');
    halo.addColorStop(1, 'rgba(255, 160, 88, 0)');
    c.fillStyle = halo;
    c.fillRect(cx - rx * 1.5, cy - rx * 1.5, rx * 3, rx * 3);
    // Queen: larger abdomen, small thorax, calm antennae.
    const L = clamp(rx * 1.25, 28, 60);
    const qy = cy + ry * 0.06 + Math.sin(time * 0.8) * 0.5;
    c.save();
    c.translate(cx, qy);
    c.rotate(Math.PI * 0.98);
    c.fillStyle = 'rgba(18, 10, 5, .28)';
    c.beginPath(); c.ellipse(0, L * 0.34, L * 0.45, L * 0.1, 0, 0, TAU); c.fill();
    // legs
    c.strokeStyle = 'rgba(30, 17, 10, .92)'; c.lineWidth = Math.max(0.8, L * 0.035); c.lineCap = 'round';
    for (const side of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const bx = (i - 1) * L * 0.13;
        c.beginPath();
        c.moveTo(bx, side * L * 0.055);
        c.lineTo(bx + L * 0.10, side * L * 0.15);
        c.lineTo(bx + L * 0.18, side * L * 0.20);
        c.stroke();
      }
    }
    // gaster
