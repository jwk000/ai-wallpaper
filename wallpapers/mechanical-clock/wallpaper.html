  function drawDateWorks(c, now) {
    const P = POS.date;
    const dayAngle = ((now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400) * TAU - Math.PI / 2;
    const teeth = 31;
    const step = TAU / teeth;
    const outer = 50;
    const root = 41;

    c.save();
    c.translate(P.x, P.y);

    c.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a = i * step - Math.PI / 2;
      const p0 = [Math.cos(a) * root, Math.sin(a) * root];
      const p1 = [Math.cos(a + step * .42) * outer, Math.sin(a + step * .42) * outer];
      const p2 = [Math.cos(a + step * .84) * root, Math.sin(a + step * .84) * root];
      if (i === 0) c.moveTo(p0[0], p0[1]); else c.lineTo(p0[0], p0[1]);
      c.lineTo(p1[0], p1[1]);
      c.lineTo(p2[0], p2[1]);
    }
    c.closePath();
    c.fillStyle = linear(c, -50, -50, 50, 50, MAT.gold.stops);
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.70)';
    c.lineWidth = 1.5;
    c.stroke();

    ringPath(c, 18, 7);
    c.fillStyle = gearMaterialGradient(c, MAT.gold, 50);
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.55)';
    c.lineWidth = 1.2;
    c.stroke();
    circlePath(c, 0, 0, 5);
    c.fillStyle = '#05090a';
    c.fill();

    // Blued date finger.
    c.save();
    c.rotate(dayAngle);
    c.beginPath();
    c.moveTo(2, -4);
    c.lineTo(77, -2.5);
    c.lineTo(82, 0);
    c.lineTo(77, 2.5);
    c.lineTo(2, 4);
    c.closePath();
    c.fillStyle = '#4d7187';
    c.fill();
    c.strokeStyle = 'rgba(206,236,245,.30)';
    c.lineWidth = .8;
    c.stroke();
    c.restore();

    // Jumper spring and its screw.
    c.beginPath();
    c.moveTo(54, 57);
    c.bezierCurveTo(36, 68, 18, 55, 20, 36);
    c.strokeStyle = '#718a8f';
    c.lineWidth = 2.2;
    c.stroke();
    c.strokeStyle = 'rgba(225,245,245,.22)';
    c.lineWidth = .7;
    c.stroke();
    drawScrew(c, 54, 57, 4.8, .8, true);
    drawJewel(c, 0, 0, 6, false);
    c.fillStyle = 'rgba(221,197,146,.46)';
    c.font = '500 ' + (D * .0095) + 'px "Segoe UI",sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('DATE', 0, 73);
    c.restore();
  }

  function drawSpriteInContext(c, sprite, x, y, angle) {
    const css = sprite.width / dpr;
    c.save();
    c.translate(x, y);
    c.rotate(angle);
    c.drawImage(sprite, -css / (2 * viewScale), -css / (2 * viewScale), css / viewScale, css / viewScale);
    c.restore();
  }

  function arcSectorPath(c, r1, r2, a0, a1) {
    c.beginPath();
    c.arc(0, 0, r2, a0, a1, false);
    c.arc(0, 0, r1, a1, a0, true);
    c.closePath();
  }

  function taperedArmPath(c, start, end, bend, w0, w1, t0 = 0, t1 = 1) {
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    const cx = (start.x + end.x) * .5 + nx * len * bend;
    const cy = (start.y + end.y) * .5 + ny * len * bend;
    const steps = 34;
    const left = [];
    const right = [];
    for (let i = 0; i <= steps; i++) {
      const t = t0 + (t1 - t0) * i / steps;
      const u = 1 - t;
      const x = u * u * start.x + 2 * u * t * cx + t * t * end.x;
      const y = u * u * start.y + 2 * u * t * cy + t * t * end.y;
      const tx = 2 * u * (cx - start.x) + 2 * t * (end.x - cx);
      const ty = 2 * u * (cy - start.y) + 2 * t * (end.y - cy);
      const tl = Math.hypot(tx, ty) || 1;
      const px = -ty / tl;
      const py = tx / tl;
      const w = (w0 + (w1 - w0) * t) * .5;
      left.push([x + px * w, y + py * w]);
      right.push([x - px * w, y - py * w]);
    }
    c.beginPath();
    c.moveTo(left[0][0], left[0][1]);
    for (let i = 1; i < left.length; i++) c.lineTo(left[i][0], left[i][1]);
    for (let i = right.length - 1; i >= 0; i--) c.lineTo(right[i][0], right[i][1]);
    c.closePath();
  }

  function drawBridgeArm(c, angle, pivot, material, bend, w0, w1) {
    const mat = MAT[material] || MAT.rhodium;
    const start = { x: Math.cos(angle) * 680, y: Math.sin(angle) * 680 };
    const grad = linear(c, -D * .6, -D * .7, D * .75, D * .72, mat.stops);

    c.save();
    taperedArmPath(c, start, pivot, bend, w0, w1);
    c.shadowColor = 'rgba(0,0,0,.64)';
    c.shadowBlur = 20;
    c.shadowOffsetY = 9;
    c.fillStyle = 'rgba(0,0,0,.55)';
    c.fill();
    c.restore();

    taperedArmPath(c, start, pivot, bend, w0, w1);
    c.fillStyle = mat.dark;
    c.fill();
    c.strokeStyle = mat.dark;
    c.lineWidth = 5;
    c.stroke();

    taperedArmPath(c, start, pivot, bend + .002, w0 - 6, w1 - 5);
    c.fillStyle = grad;
    c.fill();

    // Skeletonised slot along the arm, with polished inner walls.
    c.save();
    c.globalCompositeOperation = 'destination-out';
    taperedArmPath(c, start, pivot, bend, w0 * .24, w1 * .24, .17, .80);
    c.fill();
    c.restore();
    taperedArmPath(c, start, pivot, bend, w0 * .24, w1 * .24, .17, .80);
    c.strokeStyle = 'rgba(0,0,0,.42)';
    c.lineWidth = 2.6;
    c.stroke();
    c.strokeStyle = 'rgba(255,247,220,.14)';
    c.lineWidth = .9;
    c.stroke();

    // Pivot boss.
    const br = w1 * .64;
    const bg = radial(c, pivot.x - br * .32, pivot.y - br * .38, br * .05, pivot.x, pivot.y, br * 1.25, [
      [0, mat.stops[0][1]], [.36, mat.stops[1][1]], [.76, mat.stops[3][1]], [1, mat.dark]
    ]);
    c.shadowColor = 'rgba(0,0,0,.50)';
    c.shadowBlur = 11;
    c.shadowOffsetY = 4;
    circlePath(c, pivot.x, pivot.y, br);
    c.fillStyle = bg;
    c.fill();
    c.shadowColor = 'transparent';
    c.strokeStyle = 'rgba(0,0,0,.60)';
    c.lineWidth = 1.8;
    c.stroke();
    c.beginPath();
    c.arc(pivot.x, pivot.y, br * .76, Math.PI * 1.04, Math.PI * 1.78);
    c.strokeStyle = 'rgba(255,247,220,.24)';
    c.lineWidth = 1.2;
    c.stroke();
  }

  function drawArcBridge(c, spec) {
    const mat = MAT[spec.material] || MAT.rhodium;
    const r1 = spec.r1 || 626;
    const r2 = spec.r2 || 738;
    const midR = (r1 + r2) * .5;
    const grad = linear(c, -D * .55, -D * .75, D * .7, D * .78, mat.stops);

    // Cast shadow.
    c.save();
    arcSectorPath(c, r1, r2, spec.a0, spec.a1);
    c.shadowColor = 'rgba(0,0,0,.68)';
    c.shadowBlur = 24;
    c.shadowOffsetY = 10;
    c.fillStyle = 'rgba(0,0,0,.52)';
    c.fill();
    c.restore();

    // Dark rim and body.
    arcSectorPath(c, r1, r2, spec.a0, spec.a1);
    c.fillStyle = mat.dark;
    c.fill();
    arcSectorPath(c, r1 + 6, r2 - 6, spec.a0 + .004, spec.a1 - .004);
    c.fillStyle = grad;
    c.fill();

    // Brushed concentric grain.
    c.save();
    arcSectorPath(c, r1 + 7, r2 - 7, spec.a0, spec.a1);
    c.clip();
    for (let r = r1 + 12; r < r2 - 8; r += 5.5) {
      c.beginPath();
      c.arc(0, 0, r, spec.a0, spec.a1);
      c.strokeStyle = r % 11 < 5.5 ? 'rgba(255,246,222,.018)' : 'rgba(0,0,0,.07)';
      c.lineWidth = 1.1;
      c.stroke();
    }
    const sheen = linear(c, -D * .7, -D * .8, D * .8, D * .55, [
      [0, 'rgba(255,247,222,.10)'], [.42, 'rgba(255,247,222,.015)'], [1, 'rgba(0,0,0,.06)']
    ]);
    c.fillStyle = sheen;
    c.fillRect(-D, -D, D * 2, D * 2);
    c.restore();

    // Polished edges.
    c.beginPath();
    c.arc(0, 0, r2 - 2, spec.a0 + .006, spec.a1 - .006);
    c.strokeStyle = 'rgba(255,247,220,.20)';
    c.lineWidth = 1.8;
    c.stroke();
    c.beginPath();
    c.arc(0, 0, r1 + 2, spec.a0 + .006, spec.a1 - .006);
    c.strokeStyle = 'rgba(0,0,0,.44)';
    c.lineWidth = 2.2;
    c.stroke();
    c.beginPath();
    c.arc(0, 0, r1 + 6, spec.a0 + .008, spec.a1 - .008);
    c.strokeStyle = 'rgba(255,246,220,.10)';
    c.lineWidth = 1;
    c.stroke();

    // Rounded junction collars where the arms meet the plate.
    for (const angle of spec.arms) {
      const jx = Math.cos(angle) * midR;
      const jy = Math.sin(angle) * midR;
      const jr = 24;
      const jg = radial(c, jx - 10, jy - 14, 3, jx, jy, jr * 1.2, [
        [0, mat.stops[0][1]], [.35, mat.stops[1][1]], [.78, mat.stops[3][1]], [1, mat.dark]
      ]);
      circlePath(c, jx, jy, jr);
      c.fillStyle = jg;
      c.fill();
      c.strokeStyle = 'rgba(0,0,0,.46)';
      c.lineWidth = 1.8;
      c.stroke();
      c.beginPath();
      c.arc(jx, jy, jr * .74, Math.PI * 1.03, Math.PI * 1.8);
      c.strokeStyle = 'rgba(255,247,220,.18)';
      c.lineWidth = 1;
      c.stroke();
    }

    // Fixing screws at both horns.
    drawScrew(c, Math.cos(spec.a0 + .045) * midR, Math.sin(spec.a0 + .045) * midR, 11, spec.a0 + 1.2, false);
    drawScrew(c, Math.cos(spec.a1 - .045) * midR, Math.sin(spec.a1 - .045) * midR, 11, spec.a1 - .8, true);

    // Engraving follows the tangent of the arc and is kept upright.
    let rot = spec.labelAngle + Math.PI / 2;
    if (Math.cos(rot) < 0) rot += Math.PI;
    c.save();
    c.translate(Math.cos(spec.labelAngle) * midR, Math.sin(spec.labelAngle) * midR);
    c.rotate(rot);
    c.fillStyle = mat.label;
    c.font = '500 ' + (D * .0135) + 'px "Segoe UI",sans-serif';
    c.textBaseline = 'middle';
    spacedText(c, spec.label, 0, 0, D * .0038);
    c.restore();
  }

  function drawMoonphaseRing(c) {
    const M = POS.moon;
    c.save();
    c.translate(M.x, M.y);

    // Applied polished bezel.
    ringPath(c, 130, 110);
    const ring = linear(c, -100, -120, 100, 120, [
      [0, '#f9e7b9'], [.26, '#c59a58'], [.55, '#755026'], [.78, '#b98a4a'], [1, '#f0d49a']
    ]);
    c.fillStyle = ring;
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.62)';
    c.lineWidth = 2;
    c.stroke();
    c.strokeStyle = 'rgba(255,241,208,.25)';
    c.lineWidth = 1;
    c.beginPath();
    c.arc(0, 0, 127, 0, TAU);
    c.stroke();

    // Lunar-day scale.
    for (let i = 0; i < 30; i++) {
      const a = -Math.PI / 2 + i / 30 * TAU;
      const major = i % 7 === 0;
      c.beginPath();
      c.moveTo(Math.cos(a) * 133, Math.sin(a) * 133);
      c.lineTo(Math.cos(a) * (major ? 145 : 139), Math.sin(a) * (major ? 145 : 139));
      c.strokeStyle = major ? 'rgba(224,199,146,.65)' : 'rgba(170,146,104,.28)';
      c.lineWidth = major ? 1.4 : .7;
      c.stroke();
    }
    c.fillStyle = 'rgba(221,197,146,.55)';
    c.font = '500 ' + (D * .0105) + 'px "Segoe UI",sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('0', 0, -153);
    c.fillText('7', 153, 0);
    c.fillText('15', 0, 153);
    c.fillText('22', -153, 0);

    // Corrector and jewel at the bridge junction.
    drawScrew(c, 103, -74, 6.4, 1.2, true);
    drawJewel(c, 88, 88, 7, false);
    c.restore();
  }

  function drawTourbillonCock(c) {
    const T = POS.tourbillon;
    c.save();
    c.translate(T.x, T.y);

    // Swan-neck regulator over the carriage.
    c.beginPath();
    c.moveTo(-64, 45);
    c.bezierCurveTo(-46, 71, -19, 78, -8, 58);
    c.strokeStyle = '#a8b7b6';
    c.lineWidth = 2.4;
    c.stroke();
    c.strokeStyle = 'rgba(255,255,240,.26)';
    c.lineWidth = .7;
    c.stroke();
    drawScrew(c, -64, 45, 5.4, .4, true);

    c.strokeStyle = 'rgba(226,206,164,.52)';
    c.lineWidth = 1.4;
    c.beginPath();
    c.arc(0, 0, 54, Math.PI * 1.18, Math.PI * 1.50);
    c.stroke();
    c.fillStyle = 'rgba(226,206,164,.62)';
    c.font = '500 10px "Palatino Linotype",Georgia,serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('S', -43, -31);
    c.fillText('F', -54, -5);

    drawJewel(c, 0, 0, 13);
    c.restore();
  }

  function drawBridges(c) {
    c.save();
    circlePath(c, 0, 0, PLATE_R - 5);
    c.clip();

    const barrelArc = { a0: 198 * Math.PI / 180, a1: 258 * Math.PI / 180, material: 'bronze', label: 'MAINSPRING · RATCHET', labelAngle: 238 * Math.PI / 180, arms: [218 * Math.PI / 180] };
    const thirdArc = { a0: 12 * Math.PI / 180, a1: 58 * Math.PI / 180, material: 'rhodium', label: 'THIRD WHEEL', labelAngle: 46 * Math.PI / 180, arms: [22 * Math.PI / 180] };
    const fourthArc = { a0: 63 * Math.PI / 180, a1: 88 * Math.PI / 180, material: 'rhodium', label: 'FOURTH', labelAngle: 75 * Math.PI / 180, arms: [69 * Math.PI / 180] };
    const tourbillonArc = { a0: 92 * Math.PI / 180, a1: 120 * Math.PI / 180, material: 'rhodium', label: 'TOURBILLON', labelAngle: 108 * Math.PI / 180, arms: [100 * Math.PI / 180] };
    const moonArc = { a0: 126 * Math.PI / 180, a1: 178 * Math.PI / 180, material: 'bronze', label: 'MOONPHASE', labelAngle: 150 * Math.PI / 180, arms: [147 * Math.PI / 180] };
    const powerArc = { a0: 292 * Math.PI / 180, a1: 334 * Math.PI / 180, material: 'rhodium', label: 'POWER RESERVE', labelAngle: 314 * Math.PI / 180, arms: [315 * Math.PI / 180] };
    const dateArc = { a0: 348 * Math.PI / 180, a1: 368 * Math.PI / 180, material: 'bronze', label: 'DATE', labelAngle: 358 * Math.PI / 180, arms: [0] };

    // Support arms terminate on the bezels, not over the displays.
    const moonEdge = {
      x: POS.moon.x + Math.cos(147 * Math.PI / 180) * 128,
      y: POS.moon.y + Math.sin(147 * Math.PI / 180) * 128
    };
    const powerEdge = {
      x: POS.power.x + Math.cos(315 * Math.PI / 180) * 108,
      y: POS.power.y + Math.sin(315 * Math.PI / 180) * 108
    };

    drawBridgeArm(c, barrelArc.arms[0], POS.barrel, 'bronze', .12, 76, 46);
    drawBridgeArm(c, thirdArc.arms[0], POS.third, 'rhodium', -.14, 70, 40);
    drawBridgeArm(c, fourthArc.arms[0], POS.fourth, 'rhodium', .10, 66, 38);
    drawBridgeArm(c, tourbillonArc.arms[0], POS.tourbillon, 'rhodium', -.12, 46, 24);
    drawBridgeArm(c, moonArc.arms[0], moonEdge, 'bronze', .14, 54, 30);
    drawBridgeArm(c, powerArc.arms[0], powerEdge, 'rhodium', -.10, 42, 22);
    drawBridgeArm(c, dateArc.arms[0], POS.date, 'rhodium', .12, 34, 17);

    drawArcBridge(c, barrelArc);
    drawArcBridge(c, thirdArc);
    drawArcBridge(c, fourthArc);
    drawArcBridge(c, tourbillonArc);
    drawArcBridge(c, moonArc);
    drawArcBridge(c, powerArc);
    drawArcBridge(c, dateArc);

    drawMoonphaseRing(c);
    drawTourbillonCock(c);

    // Fixed jewels over the rotating pivots.
    drawJewel(c, POS.third.x, POS.third.y, 13);
    drawJewel(c, POS.fourth.x, POS.fourth.y, 12);
    drawJewel(c, POS.crownWheel.x, POS.crownWheel.y, 7, false);
    drawJewel(c, moonEdge.x, moonEdge.y, 7, false);
    drawJewel(c, powerEdge.x, powerEdge.y, 7, false);
    drawJewel(c, POS.date.x, POS.date.y, 6, false);

    // Scattered movement screws.
    drawScrew(c, -430, 78, 10, .8, true);
    drawScrew(c, 420, -220, 10, 2.1, false);
    c.restore();
  }

  function drawDate(c, now) {
    const x = D * .895;
    const day = String(now.getDate()).padStart(2, '0');
    const month = MONTHS[now.getMonth()];
    c.save();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = '#f2dfb7';
    c.font = '500 ' + (D * .044) + 'px "Palatino Linotype","Book Antiqua",Georgia,serif';
    c.fillText(day, x, -D * .006);
    c.fillStyle = 'rgba(220,188,134,.74)';
    c.font = '500 ' + (D * .0135) + 'px "Segoe UI",sans-serif';
    spacedText(c, month, x, D * .0315, D * .0037);
    c.restore();
  }

  function drawHands(c, parts) {
    drawHand(c, parts.hourAngle, 562, 118, 52);
    drawHand(c, parts.minuteAngle, 800, 106, 38);
    drawSecondHand(c, parts.secondAngle);
    drawCenterCap(c);
  }

  function drawHand(c, angle, L, tail, w) {
    c.save();
    c.rotate(angle);
    c.shadowColor = 'rgba(0,0,0,.72)';
    c.shadowBlur = 15;
    c.shadowOffsetY = 8;

    c.beginPath();
    c.moveTo(0, tail);
    c.bezierCurveTo(-w * .34, tail * .58, -w * .62, -L * .10, -w * .43, -L * .34);
    c.bezierCurveTo(-w * .36, -L * .59, -w * .13, -L * .81, 0, -L);
    c.bezierCurveTo(w * .13, -L * .81, w * .36, -L * .59, w * .43, -L * .34);
    c.bezierCurveTo(w * .62, -L * .10, w * .34, tail * .58, 0, tail);
    c.closePath();
    const body = c.createLinearGradient(-w, -L, w, tail);
    body.addColorStop(0, '#8f7a50');
    body.addColorStop(.14, '#263034');
    body.addColorStop(.48, '#080e10');
    body.addColorStop(.78, '#1b2528');
    body.addColorStop(1, '#5f5036');
    c.fillStyle = body;
    c.fill();
    c.strokeStyle = 'rgba(238,211,158,.54)';
    c.lineWidth = 1.5;
    c.stroke();

    c.shadowColor = 'transparent';
    // Luminous inlay.
    c.beginPath();
    const lw = w * .42;
    const l0 = -L * .78;
    const l1 = -L * .15;
    c.moveTo(0, l0);
    c.bezierCurveTo(-lw * .9, l0 + L * .14, -lw * .8, l1 - L * .12, 0, l1);
    c.bezierCurveTo(lw * .8, l1 - L * .12, lw * .9, l0 + L * .14, 0, l0);
    c.closePath();
    const lume = c.createLinearGradient(0, l0, 0, l1);
    lume.addColorStop(0, 'rgba(255,244,214,.96)');
    lume.addColorStop(.52, 'rgba(226,208,168,.92)');
    lume.addColorStop(1, 'rgba(247,231,196,.95)');
    c.fillStyle = lume;
    c.fill();
    c.strokeStyle = 'rgba(255,252,232,.34)';
    c.lineWidth = .8;
    c.stroke();

    // Polish along the spine.
    c.beginPath();
    c.moveTo(0, tail * .42);
    c.lineTo(0, -L * .88);
    c.strokeStyle = 'rgba(255,247,220,.18)';
    c.lineWidth = 1;
    c.stroke();
    c.restore();
  }

  function drawSecondHand(c, angle) {
    c.save();
    c.rotate(angle);
    c.shadowColor = 'rgba(255,89,54,.40)';
    c.shadowBlur = 14;

    c.beginPath();
    c.moveTo(0, 245);
    c.lineTo(0, -845);
    c.strokeStyle = '#ff6d42';
    c.lineWidth = 4.1;
    c.stroke();
    c.strokeStyle = 'rgba(255,190,153,.52)';
    c.lineWidth = 1;
    c.stroke();

    c.beginPath();
    c.arc(0, -845, 9, 0, TAU);
    c.fillStyle = '#ff815a';
    c.fill();
    c.strokeStyle = 'rgba(255,219,191,.72)';
    c.lineWidth = 1.2;
    c.stroke();

    // Counterweight ring.
    c.beginPath();
    c.arc(0, 197, 27, 0, TAU);
    c.strokeStyle = '#f26b45';
    c.lineWidth = 4;
    c.stroke();
    c.beginPath();
    c.arc(0, 197, 18, 0, TAU);
    c.fillStyle = 'rgba(19,16,13,.55)';
    c.fill();

    c.beginPath();
    c.arc(0, 0, 9, 0, TAU);
    c.fillStyle = '#ff8d68';
    c.fill();
    c.restore();
  }

  function drawCenterCap(c) {
    const g = c.createRadialGradient(-9, -12, 2, 0, 0, 39);
    g.addColorStop(0, '#fff0c9');
    g.addColorStop(.25, '#d5ad69');
    g.addColorStop(.62, '#7a5125');
    g.addColorStop(1, '#2a190a');
    c.beginPath();
    c.arc(0, 0, 39, 0, TAU);
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = 'rgba(255,244,211,.46)';
    c.lineWidth = 1.5;
    c.stroke();
    circlePath(c, 0, 0, 21);
    c.fillStyle = '#11191b';
    c.fill();
    c.strokeStyle = 'rgba(255,240,202,.20)';
    c.lineWidth = 1;
    c.stroke();
    const ruby = c.createRadialGradient(-3, -4, 0, 0, 0, 9);
    ruby.addColorStop(0, '#ff9cae');
    ruby.addColorStop(.4, '#cb2444');
    ruby.addColorStop(1, '#470611');
    circlePath(c, 0, 0, 9);
    c.fillStyle = ruby;
    c.fill();
  }

  function drawGlass(c) {
    c.save();
    c.beginPath();
    c.arc(0, 0, CHAPTER_OUT - 1, 0, TAU);
    c.clip();

    const sheen = c.createLinearGradient(-D * .8, -D * .9, D * .7, D * .8);
    sheen.addColorStop(0, 'rgba(238,248,248,.085)');
    sheen.addColorStop(.22, 'rgba(220,239,240,.018)');
    sheen.addColorStop(.52, 'rgba(255,255,255,0)');
    sheen.addColorStop(.84, 'rgba(255,231,188,.012)');
    sheen.addColorStop(1, 'rgba(255,226,177,.055)');
    c.fillStyle = sheen;
    c.fillRect(-D, -D, D * 2, D * 2);

    c.globalCompositeOperation = 'screen';
    c.strokeStyle = 'rgba(230,246,247,.06)';
    c.lineWidth = D * .12;
    c.beginPath();
    c.ellipse(-D * .53, -D * .58, D * .55, D * .39, -.72, 0, TAU);
    c.stroke();
    c.strokeStyle = 'rgba(230,246,247,.035)';
    c.lineWidth = D * .055;
    c.beginPath();
    c.ellipse(D * .61, D * .54, D * .47, D * .25, -.45, 0, TAU);
    c.stroke();

    // Faint shop-dust scratches, only visible on close inspection.
    const rand = rng(9017);
    for (let i = 0; i < 22; i++) {
      const a = rand() * TAU;
      const r = D * (.25 + rand() * .69);
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      const len = 4 + rand() * 30;
      const ang = rand() * TAU;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      c.strokeStyle = i % 3 ? 'rgba(240,248,240,.027)' : 'rgba(255,231,191,.032)';
      c.lineWidth = .6 + rand();
      c.stroke();
    }
    c.globalCompositeOperation = 'source-over';

    const vign = c.createRadialGradient(0, 0, D * .52, 0, 0, D);
    vign.addColorStop(0, 'rgba(0,0,0,0)');
    vign.addColorStop(.78, 'rgba(0,0,0,.035)');
    vign.addColorStop(1, 'rgba(0,0,0,.22)');
    c.fillStyle = vign;
    c.fillRect(-D, -D, D * 2, D * 2);
    c.restore();

    // Polished inner bezel glint.
    c.save();
    c.beginPath();
    c.arc(0, 0, CHAPTER_OUT - 1, Math.PI * 1.04, Math.PI * 1.38);
    c.strokeStyle = 'rgba(255,242,207,.24)';
    c.lineWidth = 2.5;
    c.stroke();
    c.beginPath();
    c.arc(0, 0, CHAPTER_OUT - 1, Math.PI * .18, Math.PI * .34);
    c.strokeStyle = 'rgba(188,224,225,.13)';
    c.lineWidth = 1.5;
    c.stroke();
    c.restore();
  }

  function buildDustSprite() {
    const c = makeCanvas(40, 40);
    const p = c.getContext('2d');
    p.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = p.createRadialGradient(20, 20, 0, 20, 20, 20);
    g.addColorStop(0, 'rgba(255,238,199,.72)');
    g.addColorStop(.18, 'rgba(255,229,177,.30)');
    g.addColorStop(.52, 'rgba(255,221,164,.07)');
    g.addColorStop(1, 'rgba(255,220,160,0)');
    p.fillStyle = g;
    p.fillRect(0, 0, 40, 40);
    return c;
  }

  const dust = Array.from({ length: 28 }, (_, i) => {
    const rand = rng(7100 + i * 37);
    return {
      x: rand(),
      y: rand(),
      r: .7 + rand() * 2.4,
      speed: .0015 + rand() * .0045,
      drift: rand() * TAU,
      alpha: .10 + rand() * .34
    };
  });

  function drawDust(now) {
    const t = now / 1000;
    for (const p of dust) {
      const x = ((p.x + Math.sin(t * .035 + p.drift) * .012) % 1 + 1) % 1 * W;
      const y = ((p.y - t * p.speed) % 1 + 1) % 1 * H;
      const size = p.r * 15;
      ctx.save();
      ctx.globalAlpha = p.alpha * (0.72 + 0.28 * Math.sin(t * .5 + p.drift));
      ctx.drawImage(dustSprite, x - size / 2, y - size / 2, size, size);
      ctx.restore();
    }
  }

  function updateHud(now, parts) {
    if (parts.s !== lastHudSecond) {
      lastHudSecond = parts.s;
      hhEl.textContent = String(parts.h).padStart(2, '0');
      mmEl.textContent = String(parts.m).padStart(2, '0');
      ssEl.textContent = String(parts.s).padStart(2, '0');
      document.body.dataset.time = hhEl.textContent + ':' + mmEl.textContent + ':' + ssEl.textContent;
    }
    const key = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if (key !== lastDateKey) {
      lastDateKey = key;
      dateEl.textContent = now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');
      weekdayEl.textContent = WEEKDAYS[now.getDay()];
    }
  }

  function frame(nowMs) {
    const now = currentDate();
    const parts = clockParts(now);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0, W, H);
    blitLayer(baseLayer);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(viewScale, viewScale);
    drawTrain(parts);
    drawTourbillon(ctx, parts);
    drawMoonphase(ctx, now);
    drawPowerReserve(ctx, now);
    drawDateWorks(ctx, now);
    ctx.restore();

    blitLayer(bridgeLayer);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(viewScale, viewScale);
    drawWinding(ctx, parts);
    drawDate(ctx, now);
    drawHands(ctx, parts);
    ctx.restore();

    blitLayer(glassLayer);
    drawDust(nowMs);

    updateHud(now, parts);
    requestAnimationFrame(frame);
  }

  function readState() {
    const now = currentDate();
    const p = clockParts(now);
    const a = trainAngles(p.t);
    return {
      iso: now.toISOString(),
      local: now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(p.h).padStart(2, '0') + ':' + String(p.m).padStart(2, '0') + ':' + String(p.s).padStart(2, '0'),
      digits: { h: p.h, m: p.m, s: p.s, ms: p.ms },
      angles: {
        hour: p.hourAngle * 180 / Math.PI,
        minute: p.minuteAngle * 180 / Math.PI,
        second: p.secondAngle * 180 / Math.PI
      },
      train: a,
      beat: p.beats,
      tourbillonCage: ((p.t % 60) / 60) * 360,
      moonphase: lunarPhase(now),
      powerReserve: 8 - ((p.h + p.m / 60) / 24) % 8,
      dateFinger: ((p.h * 3600 + p.m * 60 + p.s) / 86400) * 360,
      view: { width: W, height: H, dpr, radius: R }
    };
  }

  window.__MECHANICAL_CLOCK__ = {
    setTime(value) {
      const d = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(d.getTime())) throw new Error('Invalid date');
      debugTime = d.getTime();
      lastHudSecond = -1;
      lastDateKey = '';
    },
    useRealTime() {
      debugTime = null;
    },
    read: readState
  };

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('keydown', (event) => {
    if (event.key === 'h' || event.key === 'H') document.body.classList.toggle('clean');
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
