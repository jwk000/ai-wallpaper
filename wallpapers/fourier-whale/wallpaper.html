<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020408">
<title>流光乐章 · G Clef Nocturne</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020408; }
  body { color: #e9dfca; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .signature { position: fixed; left: 4.5%; bottom: 6%; pointer-events: none; }
  .eyebrow { display: flex; align-items: center; gap: 12px; color: #b7a788; font-size: 9px; letter-spacing: 4px; }
  .eyebrow::before { content: ''; width: 26px; height: 1px; background: #b7a788; opacity: .65; }
  h1 { font-family: "Songti SC", "SimSun", serif; font-size: clamp(21px, 2vw, 31px); font-weight: 400; letter-spacing: .28em; margin: 15px 0 11px; }
  .subtitle { font-size: 9px; letter-spacing: 2.8px; color: #738797; }
  .edition { position: fixed; right: 4.5%; bottom: 6%; color: #74818d; font-size: 9px; letter-spacing: 3px; pointer-events: none; }
  .clean .signature, .clean .edition { display: none; }
  @media (max-width: 600px) { .signature { left: 7%; bottom: 6%; } .edition { display: none; } .eyebrow { letter-spacing: 2px; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="傅里叶行星轮沿暗色立体 G 高音谱号的边缘描绘蓝色背光，背景音符在五线谱上缓缓流动。"></canvas>
<div class="signature" aria-hidden="true"><div class="eyebrow">G CLEF / FOURIER</div><h1>流光乐章</h1><div class="subtitle">让旋律，缓缓流过夜色。</div></div>
<div class="edition" aria-hidden="true">EPICYCLES &nbsp; / &nbsp; 058</div>
<script>
'use strict';
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const params = new URLSearchParams(location.search);
  const still = params.has('still');
  const parsedTime = Number.parseFloat(params.get('t'));
  const stillTime = (Number.isFinite(parsedTime) ? ((parsedTime % 1) + 1) % 1 : .64) * 58;
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (params.has('clean')) document.body.classList.add('clean');
  const TAU = Math.PI * 2;
  const mod = (x, n) => ((x % n) + n) % n;
  const lerp = (a, b, t) => a + (b - a) * t;
  let W = 1, H = 1, dpr = 1, unit = 1, clefScale = 1;
  let elapsed = 0, lastTime = null, frame = null;
  let background, halo;

  // Original vector calligraphy: bottom curl, ascending stem, upper loop,
  // descending sweep and the spiral that encircles the G line.
  const segments = [
    [[-25,144],[-48,134],[-52,170],[-25,179], 16,7],
    [[-25,179],[23,195],[40,162],[28,107], 7,4.6],
    [[28,107],[17,43],[-4,-78],[-12,-125], 4.6,4.6],
    [[-12,-125],[-25,-193],[15,-210],[31,-169], 4.6,9],
    [[31,-169],[54,-115],[-21,-63],[-55,-20], 9,18],
    [[-55,-20],[-108,40],[-65,102],[0,101], 18,21],
    [[0,101],[59,101],[77,53],[54,19], 21,19],
    [[54,19],[33,-13],[-15,-10],[-30,25], 19,16],
    [[-30,25],[-45,60],[-10,83],[12,66], 16,2.2]
  ];
  const spine = [];
  for (const [p0,p1,p2,p3,w0,w1] of segments) {
    for (let i = 0; i < 64; i++) {
      const t = i / 64, q = 1 - t;
      spine.push({
        x: q*q*q*p0[0] + 3*q*q*t*p1[0] + 3*q*t*t*p2[0] + t*t*t*p3[0],
        y: q*q*q*p0[1] + 3*q*q*t*p1[1] + 3*q*t*t*p2[1] + t*t*t*p3[1],
        width: lerp(w0, w1, t*t*(3-2*t))
      });
    }
  }
  spine.push({ x:12, y:66, width:2.2 });
  const clefPath = new Path2D();
  const sides = [[], []];
  for (let i = 0; i < spine.length; i++) {
    const p = spine[i], a = spine[Math.max(0,i-1)], b = spine[Math.min(spine.length-1,i+1)];
    const len = Math.hypot(b.x-a.x,b.y-a.y) || 1;
    const nx = -(b.y-a.y)/len*p.width/2, ny = (b.x-a.x)/len*p.width/2;
    sides[0].push([p.x+nx,p.y+ny]); sides[1].push([p.x-nx,p.y-ny]);
  }
  sides[0].forEach(([x,y],i) => i ? clefPath.lineTo(x,y) : clefPath.moveTo(x,y));
  // Join the ribbon sides with tangent semicircles, so the actual filled
  // silhouette (and therefore its Fourier backlight) has rounded terminals.
  const tip=spine.at(-1),tipSide=sides[0].at(-1);
  const tipAngle=Math.atan2(tipSide[1]-tip.y,tipSide[0]-tip.x);
  clefPath.arc(tip.x,tip.y,tip.width/2,tipAngle,tipAngle-Math.PI,true);
  for(let i=sides[1].length-1;i>=0;i--)clefPath.lineTo(...sides[1][i]);
  const root=spine[0],rootSide=sides[1][0];
  const rootAngle=Math.atan2(rootSide[1]-root.y,rootSide[0]-root.x);
  clefPath.arc(root.x,root.y,root.width/2,rootAngle,rootAngle-Math.PI,true);
  clefPath.closePath();


  // Trace the filled silhouette, not the overlapping edges of the ribbon.
  // This preserves the holes while removing false seams at stroke crossings.
  function silhouetteContours() {
    const resolution=3, width=570, height=1230, stride=width+1;
    const mask=document.createElement('canvas');mask.width=width;mask.height=height;
    const c=mask.getContext('2d',{willReadFrequently:true});
    c.setTransform(resolution,0,0,resolution,110*resolution,215*resolution);
    c.fill(clefPath);
    const pixels=c.getImageData(0,0,width,height).data;
    const inside=(x,y)=>x>=0&&y>=0&&x<width&&y<height&&pixels[(y*width+x)*4+3]>=128;
    const edges=new Map();
    function edge(x,y,ex,ey,dir) {
      const key=y*stride+x;
      if(!edges.has(key))edges.set(key,[]);
      edges.get(key).push({end:ey*stride+ex,dir});
    }
    for(let y=0;y<height;y++)for(let x=0;x<width;x++)if(inside(x,y)) {
      if(!inside(x,y-1))edge(x,y,x+1,y,0);
      if(!inside(x+1,y))edge(x+1,y,x+1,y+1,1);
      if(!inside(x,y+1))edge(x+1,y+1,x,y+1,2);
      if(!inside(x-1,y))edge(x,y+1,x,y,3);
    }
    const loops=[];
    while(edges.size) {
      const start=edges.keys().next().value;let key=start,dir=0;
      const loop=[];
      do {
        loop.push([key%stride/resolution-110,Math.floor(key/stride)/resolution-215]);
        const choices=edges.get(key);
        if(!choices)throw new Error('Open silhouette contour');
        const rank=[1,0,3,2];
        choices.sort((a,b)=>rank.indexOf(mod(a.dir-dir,4))-rank.indexOf(mod(b.dir-dir,4)));
        const next=choices.shift();if(!choices.length)edges.delete(key);
        key=next.end;dir=next.dir;
      }while(key!==start);
      if(loop.length>60)loops.push(loop);
    }
    return loops.map(loop=>{
      for(let pass=0;pass<3;pass++)loop=loop.map((p,i)=>{
        const a=loop[mod(i-1,loop.length)],b=loop[(i+1)%loop.length];
        return [(a[0]+2*p[0]+b[0])/4,(a[1]+2*p[1]+b[1])/4];
      });
      const distances=[0];
      for(let i=0;i<loop.length;i++) {
        const a=loop[i],b=loop[(i+1)%loop.length];
        distances.push(distances[i]+Math.hypot(b[0]-a[0],b[1]-a[1]));
      }
      const length=distances.at(-1),count=Math.max(192,Math.min(1024,Math.ceil(length*1.25)));
      let j=0;
      const points=Array.from({length:count},(_,i)=>{
        const target=i/count*length;
        while(distances[j+1]<target)j++;
        const t=(target-distances[j])/(distances[j+1]-distances[j]);
        const a=loop[j],b=loop[(j+1)%loop.length];
        return [lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
      });
      return {points,length};
    }).sort((a,b)=>b.length-a.length);
  }

  function spectrumOf(points) {
    const n=points.length,terms=[];
    for(let k=0;k<n;k++) {
      let re=0,im=0;
      for(let j=0;j<n;j++) {
        const angle=TAU*k*j/n,c=Math.cos(angle),s=Math.sin(angle);
        re+=points[j][0]*c+points[j][1]*s;
        im+=points[j][1]*c-points[j][0]*s;
      }
      re/=n;im/=n;
      terms.push({freq:k<=n/2?k:k-n,amp:Math.hypot(re,im),angle:Math.atan2(im,re),re,im});
    }
    return {dc:terms[0],terms:terms.slice(1).sort((a,b)=>b.amp-a.amp)};
  }
  const contours=silhouetteContours();
  for(const contour of contours) {
    contour.spectrum=spectrumOf(contour.points);
    contour.path=new Path2D();
    contour.points.forEach(([x,y],i)=>i?contour.path.lineTo(x,y):contour.path.moveTo(x,y));
    contour.path.closePath();
  }
  const bevelPaths=Array.from({length:12},()=>new Path2D());
  for(const contour of contours) {
    const p=contour.points;
    for(let i=0;i<p.length;i++) {
      const a=p[i],b=p[(i+1)%p.length],dx=b[0]-a[0],dy=b[1]-a[1];
      const light=Math.max(0,(-dy*.65+dx*.75)/(Math.hypot(dx,dy)||1));
      const path=bevelPaths[Math.min(11,Math.floor(light*12))];
      path.moveTo(...a);path.lineTo(...b);
    }
  }
  function cycleAt(time) {
    const position=mod(time,58);
    return {reveal:Math.min(1,position/34),phase:position<34?position/34:(position-34)/24,
      alpha:position<55?1:(58-position)/3};
  }
  function chainAt(contour,phase) {
    let x=contour.spectrum.dc.re,y=contour.spectrum.dc.im;
    const links=[];
    for(const term of contour.spectrum.terms) {
      const angle=TAU*term.freq*phase+term.angle;
      const nx=x+term.amp*Math.cos(angle),ny=y+term.amp*Math.sin(angle);
      links.push({x,y,nx,ny,r:term.amp,angle});x=nx;y=ny;
    }
    return {links,x,y};
  }

  function contourStates(time) {
    const cycle=cycleAt(time);
    return contours.map((contour,index)=>({
      contour,index,reveal:cycle.reveal,alpha:cycle.alpha,
      chain:chainAt(contour,cycle.phase)
    }));
  }

  function drawEpicycles(states) {
    ctx.save();ctx.lineWidth=.75/clefScale;
    for(const {chain} of states) {
      for(let i=0;i<chain.links.length;i++) {
        const link=chain.links[i];
        if(i>=36||link.r*clefScale<1.1)continue;
        ctx.beginPath();ctx.arc(link.x,link.y,link.r,0,TAU);
        ctx.strokeStyle=`rgba(156,122,65,${i<7?.66:.40})`;ctx.stroke();
        ctx.beginPath();ctx.moveTo(link.x,link.y);ctx.lineTo(link.nx,link.ny);
        ctx.strokeStyle='rgba(156,122,65,.46)';ctx.stroke();
        ctx.beginPath();ctx.arc(link.x,link.y,1.3/clefScale,0,TAU);
        ctx.fillStyle='rgba(156,122,65,.9)';ctx.fill();
        if(i<7) {
          ctx.beginPath();ctx.arc(link.x,link.y,link.r,link.angle-.16,link.angle+.16);
          ctx.lineWidth=1.3/clefScale;ctx.strokeStyle='rgba(156,122,65,.92)';ctx.stroke();
          ctx.lineWidth=.75/clefScale;
        }
      }
      const radius=11/clefScale;
      const spark=ctx.createRadialGradient(chain.x,chain.y,0,chain.x,chain.y,radius);
      spark.addColorStop(0,'rgba(156,122,65,1)');
      spark.addColorStop(.16,'rgba(156,122,65,.8)');
      spark.addColorStop(1,'rgba(156,122,65,0)');
      ctx.fillStyle=spark;ctx.beginPath();ctx.arc(chain.x,chain.y,radius,0,TAU);ctx.fill();
    }
    ctx.restore();
  }

  let seed = 0x48E34A;
  function random() {
    seed = (Math.imul(seed,1664525)+1013904223) >>> 0;
    return seed/4294967296;
  }
  const staves = [.20,.39,.61,.80].map((y,i) => ({
    y, gap: [11,14,16,12][i], speed:[11,17,22,13][i],
    alpha:[.10,.14,.18,.12][i], phase:i*1.8, slant:[-.045,.035,-.025,.045][i],
    notes:Array.from({length:13},(_,j) => ({
      x:(j+random()*.45)/13, pitch:Math.floor(random()*13)-6,
      kind:Math.floor(random()*4), gold:random()>.65,
      size:.55+Math.pow(random(),1.3)*1.05,
      brightness:.55+random()*.85, twinklePhase:random()*TAU,
      twinkleSpeed:.30+random()*.55
    }))
  }));
  const dust = Array.from({length:80},()=>({
    x:random(),y:random(),size:.45+random()*1.1,phase:random()*TAU,speed:2+random()*6
  }));

  function resize() {
    W=Math.max(1,innerWidth); H=Math.max(1,innerHeight);
    dpr=Math.min(devicePixelRatio||1,2,Math.sqrt(7200000/(W*H)));
    canvas.width=Math.max(1,Math.round(W*dpr)); canvas.height=Math.max(1,Math.round(H*dpr));
    unit=Math.max(.5,Math.min(W,H)/1080);
    clefScale=Math.min(H*.57/390,W*.49/160);
    background=ctx.createLinearGradient(0,0,0,H);
    background.addColorStop(0,'#010205'); background.addColorStop(.5,'#03060b'); background.addColorStop(1,'#010308');
    halo=ctx.createRadialGradient(W*.50,H*.48,0,W*.50,H*.48,Math.max(W*.42,H*.48));
    halo.addColorStop(0,'rgba(24,41,58,.07)'); halo.addColorStop(.45,'rgba(16,29,45,.035)'); halo.addColorStop(1,'rgba(6,13,23,0)');
  }

  function staffY(staff,x,time) {
    return staff.y*H + (x-W*.5)*staff.slant
      + Math.sin(x/W*TAU*.73+staff.phase+time*.065)*24*unit
      + Math.sin(x/W*TAU*.31-staff.phase-time*.038)*12*unit;
  }

  function noteHead(x,y,gap,hollow) {
    ctx.beginPath(); ctx.ellipse(x,y,gap*.59,gap*.39,-.36,0,TAU);
    if(hollow) {ctx.lineWidth=1.5*unit;ctx.stroke();} else ctx.fill();
  }

  function drawNote(staff,n,x,time) {
    const staffGap=staff.gap*unit,gap=staffGap*n.size;
    const y=staffY(staff,x,time)+n.pitch*staffGap*.5;
    // Quiet the middle so the large clef remains the visual focus.
    const distance=Math.abs(x-W*.5)/(W*.27);
    const focus=.24+.76*Math.min(1,distance*distance);
    // Each note has a fixed size, luminosity and independent slow twinkle.
    // Smooth peaks keep the star field calm and avoid frame-to-frame flicker.
    const twinkle=Math.pow(.5+.5*Math.sin(time*n.twinkleSpeed+n.twinklePhase),4);
    const alpha=Math.min(.82,staff.alpha*focus*n.brightness*(.3+3.2*twinkle));
    const color=n.gold?'231,208,160':'172,211,241';
    ctx.save();
    if(twinkle>.3) {
      const radius=gap*(1.2+twinkle);
      const glow=ctx.createRadialGradient(x,y,0,x,y,radius);
      glow.addColorStop(0,`rgba(${color},${alpha*twinkle*.32})`);
      glow.addColorStop(1,`rgba(${color},0)`);
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,radius,0,TAU);ctx.fill();
    }
    ctx.fillStyle=ctx.strokeStyle=`rgba(${color},${alpha})`;
    const stem=gap*3.05, right=x+gap*.50;
    noteHead(x,y,gap,n.kind===0);
    ctx.lineWidth=Math.max(.5,unit*n.size*1.05); ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(right,y);ctx.lineTo(right,y-stem);ctx.stroke();
    // Ledger lines for notes immediately outside the five-line staff.
    if(Math.abs(n.pitch)>=6) {
      const ledger=staffY(staff,x,time)+Math.sign(n.pitch)*staffGap*3;
      ctx.beginPath();ctx.moveTo(x-gap*.85,ledger);ctx.lineTo(x+gap*.85,ledger);ctx.stroke();
    }
    if(n.kind===2) {
      ctx.beginPath();ctx.moveTo(right,y-stem);
      ctx.bezierCurveTo(right+gap*.05,y-stem+gap,right+gap*1.8,y-stem+gap*.9,right+gap*.65,y-stem+gap*2);
      ctx.bezierCurveTo(right+gap*1.2,y-stem+gap*.8,right+gap*.15,y-stem+gap*.9,right,y-stem+gap*.55);ctx.fill();
    } else if(n.kind===3) {
      const x2=x+gap*2.2, y2=staffY(staff,x2,time)+(n.pitch-1)*staffGap*.5;
      noteHead(x2,y2,gap,false);
      ctx.beginPath();ctx.moveTo(x2+gap*.5,y2);ctx.lineTo(x2+gap*.5,y2-stem);ctx.stroke();
      ctx.beginPath();ctx.moveTo(right,y-stem);ctx.lineTo(x2+gap*.5,y2-stem);
      ctx.lineTo(x2+gap*.5,y2-stem+gap*.32);ctx.lineTo(right,y-stem+gap*.32);ctx.closePath();ctx.fill();
    }
    if(twinkle>.75) {
      const sparkle=(twinkle-.75)*4;
      const reach=gap*(.65+sparkle*.55);
      ctx.strokeStyle=`rgba(${color},${alpha*sparkle*.5})`;
      ctx.lineWidth=.55*unit;
      ctx.beginPath();ctx.moveTo(x-reach,y);ctx.lineTo(x+reach,y);
      ctx.moveTo(x,y-reach);ctx.lineTo(x,y+reach);ctx.stroke();
    }
    ctx.restore();
  }

  function drawStaff(staff,time) {
    const gap=staff.gap*unit;
    const ink=ctx.createLinearGradient(0,0,W,0);
    ink.addColorStop(0,'rgba(94,137,159,0)');
    ink.addColorStop(.12,`rgba(105,150,171,${staff.alpha*.44})`);
    ink.addColorStop(.5,`rgba(105,150,171,${staff.alpha*.16})`);
    ink.addColorStop(.88,`rgba(105,150,171,${staff.alpha*.44})`);
    ink.addColorStop(1,'rgba(94,137,159,0)');
    ctx.strokeStyle=ink;ctx.lineWidth=Math.max(.5,unit*.75);
    for(let line=-2;line<=2;line++) {
      ctx.beginPath();
      for(let x=-12;x<=W+12;x+=12) {
        const y=staffY(staff,x,time)+line*gap;
        x===-12?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    // Bar lines and notes share the same travel speed and wrap off screen.
    const span=W+160*unit;
    for(let i=0;i<5;i++) {
      const x=mod(i*span/5-time*staff.speed*unit,span)-80*unit;
      const y=staffY(staff,x,time);
      ctx.strokeStyle=`rgba(105,150,171,${staff.alpha*.30})`;
      ctx.beginPath();ctx.moveTo(x,y-gap*2);ctx.lineTo(x,y+gap*2);ctx.stroke();
    }
    const count=W<600?7:staff.notes.length;
    for(let i=0;i<count;i++) {
      const n=staff.notes[i];
      const x=mod((i/count+n.x*.035)*span-time*staff.speed*unit,span)-80*unit;
      drawNote(staff,n,x,time);
    }
  }

  function drawClef(time) {
    const states=contourStates(time);
    ctx.save();ctx.translate(W*.5,H*.47+Math.sin(time*.24)*3*unit);
    ctx.scale(clefScale,clefScale);ctx.rotate(Math.sin(time*.14)*.008);

    // A cast shadow and a recessed side face establish the physical depth.
    ctx.save();ctx.translate(2.8,4.2);
    ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=16*unit;
    ctx.fillStyle='#03060b';ctx.fill(clefPath);ctx.restore();

    // Accumulated rim light is behind the opaque metal, spilling only around
    // its true silhouette, including the inner holes of the G clef.
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineJoin=ctx.lineCap='round';
    for(const {contour,reveal,alpha:rimAlpha} of states) {
      if(!reveal)continue;
      const p=contour.points,n=p.length,last=Math.min(n-1,Math.floor(reveal*n));
      ctx.beginPath();ctx.moveTo(...p[0]);
      for(let i=1;i<=last;i++)ctx.lineTo(...p[i]);
      if(reveal>=1)ctx.closePath();
      else {
        const next=p[(last+1)%n],fraction=reveal*n-last;
        ctx.lineTo(lerp(p[last][0],next[0],fraction),lerp(p[last][1],next[1],fraction));
      }
      for(const [width,alpha,blur,color] of [[14,.09,22,'72,136,255'],[5,.24,10,'94,181,255'],[1.8,.85,4,'184,226,255']]) {
        ctx.lineWidth=width/clefScale;ctx.strokeStyle=`rgba(${color},${alpha*rimAlpha})`;
        ctx.shadowColor=`rgba(${color},${rimAlpha*.7})`;ctx.shadowBlur=blur*unit;ctx.stroke();
      }
    }
    ctx.restore();

    // The face stays dark. Directional bevels add relief instead of lighting
    // the whole sign. The face occludes only the interior backlight.
    const metal=ctx.createLinearGradient(-65,-190,65,180);
    metal.addColorStop(0,'#080c13');metal.addColorStop(.25,'#03060b');
    metal.addColorStop(.48,'#090e16');metal.addColorStop(.62,'#03070d');metal.addColorStop(1,'#020409');
    ctx.fillStyle=metal;ctx.fill(clefPath);
    ctx.save();ctx.clip(clefPath);
    for(let i=0;i<bevelPaths.length;i++) {
      ctx.strokeStyle=`rgba(151,175,199,${.008+i/11*.07})`;ctx.lineWidth=1.6;
      ctx.stroke(bevelPaths[i]);
    }
    ctx.restore();
    // Independent chains run simultaneously and sit in front of the metal.
    // Every harmonic still contributes to each endpoint, including tiny rings.
    drawEpicycles(states);
    ctx.restore();

    ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(155,183,205,.45)';
    ctx.font=`${Math.max(8,10*unit)}px "Segoe UI", sans-serif`;
    if(!params.has('clean')) ctx.fillText('G   /   F O U R I E R',W*.5,H*.47+clefScale*211+24*unit);
    ctx.restore();
  }

  function draw(time) {
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=background;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
    for(const staff of staves) drawStaff(staff,time);
    for(const p of dust) {
      const x=mod(p.x*W-time*p.speed*unit*.23,W+20)-10;
      const y=p.y*H+Math.sin(time*.12+p.phase)*8*unit;
      const alpha=.015+.045*(.5+.5*Math.sin(time*.4+p.phase));
      ctx.fillStyle=`rgba(206,193,158,${alpha})`;
      ctx.beginPath();ctx.arc(x,y,p.size*unit,0,TAU);ctx.fill();
    }
    drawClef(time);
  }

  function render(now) {
    frame=null;
    if(lastTime!==null) elapsed+=Math.min(.05,Math.max(0,(now-lastTime)/1000));
    lastTime=now;
    draw(still?stillTime:motion.matches?37.12:elapsed+35);
    document.body.classList.add('ready');
    if(!still&&!motion.matches&&!document.hidden) frame=requestAnimationFrame(render);
  }
  function restart() {
    if(frame!==null) cancelAnimationFrame(frame);
    frame=null;lastTime=null;
    render(performance.now());
  }
  window.addEventListener('resize',()=>{resize();restart();},{passive:true});
  motion.addEventListener('change',restart);
  document.addEventListener('visibilitychange',restart);
  resize();restart();
})();
</script>
</body>
</html>
