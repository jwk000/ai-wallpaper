  function drawDeadHorse(cfg) {
    const { x, y, s = 1, side = 'chi' } = cfg;
    const pal = SIDE[side];
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    // blood and shadow
    ctx.globalAlpha = .22;
    ctx.fillStyle = PAL.blood;
    ctx.beginPath(); ctx.ellipse(-2, 1, 45, 5, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = .1;
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.ellipse(4, 2, 58, 7, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    // legs in the air, bent at the joints
    for (let i = 0; i < 4; i++) {
      const sx = -38 + i * 20;
      const knee = { x: sx - 5 + i * 2, y: -36 - (i % 2) * 7 };
      const foot = { x: sx + 1 - (i % 2) * 7, y: -54 - (i % 2) * 8 };
      ctx.globalAlpha = i < 2 ? .55 : 1;
      limb({ x: sx, y: -20 }, knee, foot, 3, i < 2 ? '#80684f' : '#96775b', PAL.ink, 1);
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(foot.x - 2, foot.y); ctx.lineTo(foot.x + 2, foot.y); ctx.stroke();
      ctx.globalAlpha = 1;

    // long barrel lying on its side

    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-55, -8);
    ctx.quadraticCurveTo(-48, -25, -24, -27);
    ctx.quadraticCurveTo(6, -30, 30, -24);
    ctx.quadraticCurveTo(41, -20, 38, -9);
    ctx.quadraticCurveTo(20, 0, -6, 0);
    ctx.quadraticCurveTo(-39, 0, -55, -8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // rib lines
    ctx.globalAlpha = .18;
    ctx.strokeStyle = PAL.ink;

    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(-26 + i * 13, -17, 9, .2, 2.9); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // arched neck and head
    ctx.fillStyle = '#96775b';
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(27, -25);
    ctx.quadraticCurveTo(46, -34, 58, -26);
    ctx.quadraticCurveTo(69, -22, 75, -13);
    ctx.quadraticCurveTo(72, -6, 63, -7);
    ctx.quadraticCurveTo(56, -10, 52, -15);
    ctx.quadraticCurveTo(40, -17, 30, -15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // head, muzzle, ears
    ctx.beginPath(); ctx.ellipse(66, -11, 10, 5.8, .12, 0, TAU); ctx.fill(); ctx.stroke();
    poly([[58, -16], [57, -22], [62, -17]], '#96775b', PAL.ink, .6);
    poly([[64, -17], [66, -23], [69, -17]], '#96775b', PAL.ink, .6);
    ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(73, -12); ctx.lineTo(78, -10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, -13); ctx.lineTo(64, -12); ctx.stroke();
    ctx.globalAlpha = 1;
    // mane
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .75;
    for (let i = 0; i < 7; i++) {
      const mx = 34 + i * 4, my = -26 - i * .3;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.quadraticCurveTo(mx - 4, my - 4, mx - 1, my - 7); ctx.stroke();
    }
    // tail
    ctx.beginPath();
    ctx.moveTo(-53, -14);
    ctx.bezierCurveTo(-70, -12, -76, -5, -69, 2);
    ctx.stroke();

    // saddle and torn caparison
    ctx.fillStyle = pal.cloth;
    ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.moveTo(-12, -27); ctx.lineTo(16, -28); ctx.lineTo(19, -15); ctx.lineTo(-10, -14); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .5;
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .55;
    ctx.beginPath(); ctx.moveTo(-8, -26); ctx.lineTo(14, -27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9, -19); ctx.lineTo(16, -20); ctx.stroke();
    ctx.globalAlpha = 1;

    // arrows and a broken lance
    for (let i = 0; i < 4; i++) {
      const ax = -30 + i * 19, ay = -22 + (i % 2) * 4;

      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 19, ay - 11); ctx.stroke();
      poly([[ax + 19, ay - 11], [ax + 13, ay - 11], [ax + 17, ay - 8]], PAL.ink, null, .4, .85);
      ctx.globalAlpha = .55;
      ctx.strokeStyle = PAL.blood; ctx.lineWidth = .55;
      ctx.beginPath(); ctx.moveTo(ax + 2, ay); ctx.lineTo(ax + 3, ay + 6); ctx.stroke();

  function drawCorpse(cfg) {
    const { x, y, s = 1, dir = 1, side = 'chi', seed = 1, blood = 1, arrows = 0 } = cfg;
    const pal = SIDE[side];
    const T = state.sceneTime;
    ctx.save();
    ctx.translate(x, y);
    // blood pool
    if (blood) {
      ctx.globalAlpha = .2 + blood * .07;
      ctx.fillStyle = PAL.blood;
      ctx.beginPath(); ctx.ellipse(-dir * 22 * s, 0, 31 * s, 4.5 * s, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = .16;
      ctx.beginPath(); ctx.ellipse(-dir * 12 * s, 1, 16 * s, 2.4 * s, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = .12;
      ctx.beginPath(); ctx.ellipse(-dir * 39 * s, 0, 12 * s, 1.8 * s, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.scale(dir * s, s);
    // body lying at a slight angle
    ctx.rotate(-.06 + (seed % 3) * .04);
    const hip = { x: 0, y: -4 };
    const sh = { x: -5, y: -9 };
    const head = { x: -17, y: -11 };
    // far leg
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(14, -4); ctx.lineTo(28, -8); ctx.stroke();
    ctx.strokeStyle = pal.trousers; ctx.lineWidth = 2.7;
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(14, -4); ctx.lineTo(28, -8); ctx.stroke();
    // torso horizontal
    ctx.fillStyle = pal.clothPale; ctx.strokeStyle = PAL.ink; ctx.lineWidth = .9;
    ctx.beginPath();
    ctx.moveTo(sh.x + 2, sh.y - 3);
    ctx.quadraticCurveTo(-3, -10, 4, -10);
    ctx.lineTo(8, -3);
    ctx.quadraticCurveTo(2, 1, -3, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // near leg
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4.2;
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(12, 1); ctx.lineTo(27, -2); ctx.stroke();
    ctx.strokeStyle = pal.trousers; ctx.lineWidth = 2.9;
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(12, 1); ctx.lineTo(27, -2); ctx.stroke();
    // arm out
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(-8, -2); ctx.lineTo(-15, -7); ctx.stroke();
    ctx.strokeStyle = pal.clothMid; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(-8, -2); ctx.lineTo(-15, -7); ctx.stroke();
    // head
    ctx.fillStyle = PAL.skin; ctx.strokeStyle = PAL.ink; ctx.lineWidth = .75;
    ctx.beginPath(); ctx.ellipse(head.x, head.y, 6.4, 5.2, -.3, 0, TAU); ctx.fill(); ctx.stroke();
    // helmet
    ctx.fillStyle = pal.cloth;
    ctx.beginPath();
    ctx.arc(head.x - 1, head.y - 2, 6.4, Math.PI * .75, Math.PI * 2.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // weapon dropped
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-30, -1); ctx.lineTo(10, -15); ctx.stroke();
    ctx.fillStyle = '#b9c2b8';
    ctx.beginPath(); ctx.moveTo(10, -15); ctx.lineTo(17, -18); ctx.lineTo(12, -12); ctx.closePath(); ctx.fill();
    // arrows in body
    for (let i = 0; i < arrows; i++) {
      const ax = -4 + i * 7, ay = -7 - i * 2;
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = .7;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 15, ay - 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax + 15, ay - 7); ctx.lineTo(ax + 11, ay - 7); ctx.stroke();
    }
    if (seed % 4 === 0) {
      // a discarded shield
      ctx.save(); ctx.translate(-28, -2); ctx.rotate(.4);
      drawShield({ x: 0, y: 0 }, side, false, T, seed);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .9;
    ctx.beginPath(); ctx.moveTo(-30, 1); ctx.lineTo(-8, -5); ctx.stroke();
    ctx.globalAlpha = .7;
    ctx.strokeStyle = PAL.blood; ctx.lineWidth = .7;
    ctx.beginPath(); ctx.moveTo(-18, -6); ctx.quadraticCurveTo(-9, -4, -2, -2); ctx.stroke();

  function drawReedClump(cfg) {
    const { x, y, s = 1, seed = 1, alpha = .55 } = cfg;
    const T = state.sceneTime;
    const R = rng(seed);
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.strokeStyle = PAL.inkSoft;
    ctx.globalAlpha = alpha;
    for (let i = 0; i < 13; i++) {
      const bx = (R() - .5) * 42;
      const h = 34 + R() * 70;
      const lean = (R() - .5) * 18 + Math.sin(T * .6 + i + seed) * 3.5;
      ctx.lineWidth = .65 + R() * .7;
      ctx.beginPath();
      ctx.moveTo(bx, 0);
      ctx.quadraticCurveTo(bx + lean * .2, -h * .55, bx + lean, -h);
      ctx.stroke();
      if (R() > .55) {
        // seed head
        ctx.globalAlpha = alpha * .65;
        ctx.beginPath();
        ctx.ellipse(bx + lean, -h - 3, 1.4, 4.6, lean * .01, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = alpha;
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function addTimedDeath(cfg) {
    actor(cfg.y, () => {
      const T = state.sceneTime;
      const e = T - cfg.start;
      const death = e <= 0 ? 0 : clamp((e - .65) / 1.55, 0, 1);
      const recoil = e > 0 ? Math.max(0, Math.sin(clamp(e / 1.2, 0, 1) * Math.PI)) * .9 : 0;
      drawFootman({ ...cfg, death, recoil });
      if (e > -.1 && e < .75) {
        const q = clamp((e + .1) / .85, 0, 1);
        drawBloodSpray(
          cfg.x + (cfg.dir || 1) * (16 + q * 8) * (cfg.s || 1),
          cfg.y - 48 * (cfg.s || 1) + q * 12,
          (cfg.s || 1) * 1.15, (cfg.seed || 1) + 900, Math.sin(q * Math.PI) * .95
        );
      }
      if (e > .55 && e < 2.4) {
        const q = (e - .55) / 1.85;
        drawDustPuff(cfg.x, cfg.y - 2, (cfg.s || 1) * 1.1, (cfg.seed || 1) * .4, Math.sin(q * Math.PI) * .16);
      }
    });
  }

  function drawSwordInGround(cfg) {
    const { x, y, s = 1, angle = .3 } = cfg;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(angle);
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -26); ctx.stroke();
    ctx.strokeStyle = PAL.ochre; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-5, -26); ctx.lineTo(5, -26); ctx.stroke();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .9;
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(0, -33); ctx.stroke();
    ctx.restore();
  }

  function drawDustPuff(x, y, s, phase, alpha) {
    const T = state.sceneTime;
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .8;
    for (let i = 0; i < 3; i++) {
      const a = T * .7 + phase + i * 2.1;
      const xx = Math.sin(a) * 8;
      const yy = -6 - i * 5 + Math.cos(a * 1.2) * 2;
      ctx.beginPath(); ctx.arc(xx, yy, 7 + i * 4, .2, 3.1); ctx.stroke();
    }
    ctx.globalAlpha = alpha * .7;
    ctx.fillStyle = PAL.haze;
    ctx.beginPath(); ctx.ellipse(0, -8, 14, 8, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ---------------------------------- landscape actors ---------------- */

  function drawTree(cfg) {
    const x = cfg.x, y = cfg.y, s = cfg.s || 1;
    const kind = cfg.kind || 'pine';
    const T = state.sceneTime;
    const R = rng(cfg.seed || 19);
    const sway = Math.sin(T * .5 + x) * .012;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.globalAlpha = .09;
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.ellipse(0, 2, 34, 5, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    if (kind === 'pine') {
      ctx.strokeStyle = PAL.ink; ctx.fillStyle = '#6f8374';
      // trunk
      ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-8, -34, 12, -54, 2, -92); ctx.stroke();
      ctx.strokeStyle = PAL.inkSoft; ctx.lineWidth = 1.2;
      for (let i = 0; i < 6; i++) {
        const yy = -16 - i * 13;
        const dir = i % 2 ? 1 : -1;
        const len = 24 + R() * 23;
        ctx.beginPath();
        ctx.moveTo(2, yy);
        ctx.quadraticCurveTo(2 + dir * len * .5, yy - 8, 2 + dir * len, yy - 5 + R() * 4);
        ctx.stroke();
        // needle clusters
        ctx.globalAlpha = .62;
        for (let j = 0; j < 12; j++) {
          const px = 2 + dir * (10 + j * (len - 12) / 12);
          const py = yy - 5 - Math.sin(j / 12 * Math.PI) * 4;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + dir * 5 + (R() - .5) * 3, py - 5 - R() * 4); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      // canopy wash
      ctx.globalAlpha = .16;
      ctx.fillStyle = '#4f6b5e';
      ctx.beginPath(); ctx.ellipse(0, -75, 42, 22, sway, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-20, -60, 25, 14, sway, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(23, -58, 22, 13, sway, 0, TAU); ctx.fill();
    } else {
      // old willow / bare tree
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.6;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-11, -36, 10, -62, -3, -100); ctx.stroke();
      ctx.lineWidth = 1.6;
      const branches = [];
      for (let i = 0; i < 7; i++) {
        const by = -48 - i * 8;
        const dir = i % 2 ? 1 : -1;
        const bx = -3 + dir * (18 + R() * 28);
        const ty = by - 20 - R() * 28;
        ctx.beginPath(); ctx.moveTo(-3 + i * .3, by);
        ctx.quadraticCurveTo(bx * .7, by - 8, bx, ty); ctx.stroke();
        branches.push({ x: bx, y: ty });
      }
      // drooping willow lines
      ctx.strokeStyle = PAL.inkSoft; ctx.lineWidth = .55;
      for (let i = 0; i < 90; i++) {
        const b = branches[i % branches.length];
        const xx = b.x + (R() - .5) * 35;
        const yy = b.y + R() * 18;
        const len = 15 + R() * 35;
        ctx.globalAlpha = .35 + R() * .3;
        ctx.beginPath(); ctx.moveTo(xx, yy);
        ctx.bezierCurveTo(xx + sway * 100, yy + len * .4, xx - 4 + sway * 150, yy + len * .8, xx - 7 + sway * 180, yy + len);
        ctx.stroke();
      }
      // sparse leaf wash
      ctx.globalAlpha = .13;
      ctx.fillStyle = '#7f9484';

  /* ---------------------------------- arrows & effects ---------------- */

  function drawVolley(cfg) {
    const t = state.sceneTime;
    const { x, y, tx, ty, period = 5.6, offset = 0, count = 7, spread = 110, color = PAL.ink, height = 150 } = cfg;
    const u = mod(t + offset, period);
    const flight = 1.55;
    for (let i = 0; i < count; i++) {
      const delay = i * .055;
      const lt = u - delay;
      if (lt < 0 || lt > flight) continue;
      const p = lt / flight;
      const x0 = x + (i / count - .5) * spread * .3;
      const x1 = tx + (i / count - .5) * spread;
      const y0 = y;
      const y1 = ty + ((i % 3) - 1) * 14;
      const cx = (x0 + x1) / 2;
      const cy = Math.min(y0, y1) - height - (i % 4) * 9;
      const inv = 1 - p;
      const px = inv * inv * x0 + 2 * inv * p * cx + p * p * x1;
      const py = inv * inv * y0 + 2 * inv * p * cy + p * p * y1;
      const dx = 2 * inv * (cx - x0) + 2 * p * (x1 - cx);
      const dy = 2 * inv * (cy - y0) + 2 * p * (y1 - cy);
      const ang = Math.atan2(dy, dx);
      drawArrow(px, py, ang, 1.02, color);
      // faint motion streak behind the shaft
      ctx.save();
      ctx.globalAlpha = .16;
      ctx.strokeStyle = PAL.inkSoft;
      ctx.lineWidth = .5;
      ctx.beginPath();
      ctx.moveTo(px - Math.cos(ang) * 12, py - Math.sin(ang) * 12);
      ctx.lineTo(px - Math.cos(ang) * 34, py - Math.sin(ang) * 34);
      ctx.stroke();
      ctx.restore();
    }
    const impact = u - flight;
    if (impact >= 0 && impact < .42) {
      const a = 1 - impact / .42;
      drawBloodSpray(tx + spread * .1, ty - 54, 1.35, 700 + Math.floor((t + offset) / period), a);
      drawBloodSpray(tx - spread * .22, ty - 20, .9, 740 + Math.floor((t + offset) / period), a * .7);
    }
  }

  function drawArrow(x, y, ang, s = 1, color = PAL.ink) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
    ctx.strokeStyle = color; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(9, 0); ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(5, -1.6); ctx.lineTo(5, 1.6); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .9;
    ctx.strokeStyle = PAL.ochre; ctx.lineWidth = .65;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-14, -2.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-14, 2.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-13, 0); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawWoundMark(x, y, s, angle, alpha = .75, seed = 1) {
    const T = state.sceneTime;
    const R = rng(seed);
    ctx.save();
    ctx.translate(x, y); ctx.rotate(angle); ctx.scale(s, s);

    ctx.beginPath(); ctx.moveTo(2, 1); ctx.lineTo(1, 10 + Math.sin(T * 2 + seed) * 2); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = alpha * (.4 + R() * .3);
      ctx.fillStyle = PAL.blood;
      ctx.beginPath();
      ctx.arc(-6 + R() * 14, 10 + R() * 9, .7 + R() * .9, 0, TAU); ctx.fill();

    ctx.restore();
  }

  function drawBloodSpray(x, y, s, seed, alpha = .8) {
    const R = rng(seed);
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.lineCap = 'round';
    ctx.globalAlpha = alpha * .07;
    ctx.fillStyle = PAL.blood;
    ctx.beginPath(); ctx.ellipse(0, -3, 14, 7, -.25, 0, TAU); ctx.fill();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * .84 + R() * Math.PI * .9;
      const len = 7 + R() * 18;
      const x2 = Math.cos(a) * len, y2 = Math.sin(a) * len;
      ctx.strokeStyle = i % 3 === 0 ? PAL.bloodPale : PAL.blood;
      ctx.lineWidth = .5 + R() * .7;
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(x2 * .4, y2 * .35 - 5, x2, y2);
      ctx.stroke();
      // a droplet at the end of the stroke
      ctx.fillStyle = PAL.blood;
      ctx.beginPath(); ctx.ellipse(x2, y2, .8 + R() * 1.2, .55 + R() * .8, a, 0, TAU); ctx.fill();
    }
    for (let i = 0; i < 6; i++) {
      ctx.globalAlpha = alpha * (.25 + R() * .4);
      ctx.fillStyle = PAL.blood;
      ctx.beginPath();
      ctx.ellipse((R() - .35) * 28, (R() - .4) * 26, .6 + R() * 1.4, .5 + R() * .9, R(), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

    addReeds({ x: 2520, y: 1064, s: .92, seed: 17 });
    addReeds({ x: 3000, y: 1082, s: 1.28, seed: 20 });
    addReeds({ x: 3460, y: 1070, s: 1.0, seed: 23 });
    addReeds({ x: 3910, y: 1078, s: 1.22, seed: 26 });
    // spent arrows, dropped shields and a broken wheel
    for (let i = 0; i < 10; i++) {
      const R = rng(880 + i);
      const x = 780 + R() * 3100, y = 1000 + R() * 62;
      actor(y, () => {
        ctx.save(); ctx.translate(x, y); ctx.rotate((R() - .5) * 2.4);
        drawShield({ x: 0, y: 0 }, R() > .5 ? 'chi' : 'jin', false, state.sceneTime, i);
        ctx.restore();
      });
    }
    actor(1050, () => {
      ctx.save(); ctx.translate(1450, 1052); ctx.rotate(.35);
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 23, 0, TAU); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const a = i * 1.1 + .2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 23, Math.sin(a) * 23); ctx.stroke();
      }
      ctx.restore();
    });

    // --- foreground duel: the eye is drawn to the nearest fight ---------
    addDefender({ x: 2012, y: 978, s: 1.85, dir: -1, side: 'chi', role: 'dao', stance: 'fight', phase: 1.2, seed: 700, period: 2.6, offset: 1.2, arrow: true });
    addAttacker({ x: 1896, y: 968, s: 1.9, dir: 1, side: 'jin', role: 'halberd', stance: 'thrust', phase: .3, seed: 701, shield: false, period: 2.6, offset: 1.2, officer: true });
    addCorpse({ x: 1948, y: 1044, s: 1.85, dir: -1, side: 'chi', seed: 70, arrows: 1 });
    addSwordInGround({ x: 1848, y: 1050, s: 1.6, angle: .9 });
    addReeds({ x: 2000, y: 1090, s: 1.25, seed: 33 });

    actors.sort((a, b) => a.y - b.y);
  }

  /* ---------------------------------- effects ------------------------- */

  function drawArrowStorm(t) {
    const flights = [
      { x0: 2410, x1: 1620, y0: 716, y1: 850, h: 205, n: 9, period: 2.9, seed: 3 },
      { x0: 1030, x1: 1740, y0: 730, y1: 872, h: 165, n: 7, period: 3.4, seed: 8 },
    ];
    for (const f of flights) {
      for (let i = 0; i < f.n; i++) {
        const u = mod(t + i * f.period / f.n + f.seed, f.period);
        const flight = 1.45;
        if (u > flight) continue;
        const p = u / flight;
        const spread = (i - (f.n - 1) / 2) * 23;
        const x0 = f.x0 + spread * .18;
        const x1 = f.x1 + spread;
        const y0 = f.y0 + (i % 3) * 8;
        const y1 = f.y1 + (i % 4) * 7;
        const cx = (x0 + x1) * .5;
        const cy = Math.min(y0, y1) - f.h - (i % 3) * 14;
        const inv = 1 - p;
        const px = inv * inv * x0 + 2 * inv * p * cx + p * p * x1;
        const py = inv * inv * y0 + 2 * inv * p * cy + p * p * y1;
        const dx = 2 * inv * (cx - x0) + 2 * p * (x1 - cx);
        const dy = 2 * inv * (cy - y0) + 2 * p * (y1 - cy);
        drawArrow(px, py, Math.atan2(dy, dx), 1.0, PAL.ink);
      }
    }
  }

  function drawBattleEffects(t) {
    drawArrowStorm(t);
    // red archers loose across the line
    drawVolley({ x: 2370, y: 694, tx: 1560, ty: 842, period: 5.6, offset: 1.2, count: 12, spread: 210, height: 185 });
    drawVolley({ x: 2418, y: 700, tx: 1680, ty: 872, period: 4.9, offset: 3.6, count: 10, spread: 170, height: 160 });
    drawVolley({ x: 2500, y: 720, tx: 1810, ty: 900, period: 6.8, offset: 4.2, count: 8, spread: 150, height: 130 });

    // indigo archers answer
    drawVolley({ x: 900, y: 688, tx: 1290, ty: 804, period: 6.6, offset: 2.5, count: 8, spread: 130, height: 130 });
    drawVolley({ x: 970, y: 700, tx: 1450, ty: 870, period: 5.9, offset: 5.1, count: 7, spread: 110, height: 115 });
    // a nearly continuous exchange overhead, so arrows are always in the air
    drawVolley({ x: 2336, y: 714, tx: 1740, ty: 858, period: 3.2, offset: .5, count: 8, spread: 180, height: 170 });
    drawVolley({ x: 1020, y: 728, tx: 1620, ty: 868, period: 3.6, offset: 2.1, count: 7, spread: 150, height: 145 });

    // permanent wounds keep the front line visibly bloodied in every frame
    drawBloodSpray(2018, 856, 3.0, 1201, .62);
    drawBloodSpray(1520, 824, 2.25, 1202, .38);
    drawBloodSpray(1432, 808, 2.1, 1203, .3);

    // continuous bleeding at the closest fights, so the eye always catches it
    const b1 = mod(t, 1.7);
    if (b1 < .9) drawBloodSpray(2018, 860, 3.0, 500 + Math.floor(t / 1.7), Math.sin(b1 / .9 * Math.PI));
    const b2 = mod(t + .7, 2.1);
    if (b2 < .95) drawBloodSpray(1430, 810, 2.2, 600 + Math.floor(t / 2.1), Math.sin(b2 / .95 * Math.PI));
    const b3 = mod(t + .35, 2.4);
    if (b3 < 1.05) drawBloodSpray(1520, 828, 2.05, 650 + Math.floor(t / 2.4), Math.sin(b3 / 1.05 * Math.PI));
    const b4 = mod(t + 1.1, 2.2);
    if (b4 < .9) drawBloodSpray(2216, 842, 2.1, 680 + Math.floor(t / 2.2), Math.sin(b4 / .9 * Math.PI));

    // timed blood bursts at the other points of contact
    const hit1 = mod(t + .0, 3.8);
    if (hit1 < .45) drawBloodSpray(1430, 817, 2.0, 12 + Math.floor(t / 3.8), Math.sin(hit1 / .45 * Math.PI));
    const hit2 = mod(t + 1.1, 4.4);
    if (hit2 < .5) drawBloodSpray(1414, 852, 2.0, 41 + Math.floor(t / 4.4), Math.sin(hit2 / .5 * Math.PI));
    const hit3 = mod(t + .7, 4.1);
    if (hit3 < .42) drawBloodSpray(1522, 839, 1.9, 73 + Math.floor(t / 4.1), Math.sin(hit3 / .42 * Math.PI));
    const hit4 = mod(t + 1.9, 3.5);
    if (hit4 < .36) drawBloodSpray(1650, 802, 1.9, 91 + Math.floor(t / 3.5), Math.sin(hit4 / .36 * Math.PI));
    const hit5 = mod(t + 2.6, 4.6);
    if (hit5 < .42) drawBloodSpray(1882, 814, 1.8, 111 + Math.floor(t / 4.6), Math.sin(hit5 / .42 * Math.PI));
    const hit6 = mod(t + 1.4, 3.9);
    if (hit6 < .38) drawBloodSpray(2214, 850, 2.0, 131 + Math.floor(t / 3.9), Math.sin(hit6 / .38 * Math.PI));
    const hit7 = mod(t + 1.6, 3.2);
    if (hit7 < .5) drawBloodSpray(2018, 924, 2.6, 171 + Math.floor(t / 3.2), Math.sin(hit7 / .5 * Math.PI));

    // visible cuts on the men at the front
    drawWoundMark(1436, 808, 1.15, -.45, .8, 3);
    drawWoundMark(1518, 832, 1.1, .38, .75, 7);
    drawWoundMark(1648, 794, 1.0, -.3, .7, 11);
    drawWoundMark(1882, 804, 1.0, .5, .7, 15);
    drawWoundMark(2018, 860, 2.2, -.42, 1, 21);
    drawWoundMark(1998, 918, 1.25, .5, .8, 22);
    drawWoundMark(1988, 934, 1.05, -.15, .7, 23);
    drawWoundMark(2220, 842, 1.2, .3, .7, 27);

    // dark pools spreading from the wounded
    ctx.save();
    ctx.fillStyle = PAL.blood;
    const pools = [
      [2008, 976, 40, .34], [1434, 872, 23, .24], [1522, 890, 22, .22],
      [1650, 852, 18, .2], [1880, 866, 19, .2], [2218, 902, 22, .22],
    ];
    for (const [px, py, pr, pa] of pools) {
      ctx.globalAlpha = pa;
      ctx.beginPath(); ctx.ellipse(px, py, pr, 4.2, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = pa * .55;
      ctx.beginPath(); ctx.ellipse(px - 9, py + 1, pr * .45, 2.2, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // a few fixed cuts and stains, so the field never looks bloodless
    ctx.save();
    ctx.globalAlpha = .32;
    ctx.strokeStyle = PAL.blood;
    ctx.lineWidth = 1;
    for (const p of [[1446, 864, 15, -.5], [1512, 894, 12, .4], [1680, 884, 14, -.3], [1860, 900, 18, .6], [2096, 946, 19, -.4]]) {
      ctx.beginPath(); ctx.moveTo(p[0] - p[2] * .5, p[1]); ctx.lineTo(p[0] + p[2] * .5, p[1] + p[3] * p[2]); ctx.stroke();
    }
    ctx.restore();

    // dust drifting across the middle distance
    ctx.save();
    ctx.globalAlpha = .09;
    for (let i = 0; i < 8; i++) {
      const x = 900 + mod(t * 7 + i * 430, 2800);
      const y = 860 + (i % 3) * 40;
      ctx.strokeStyle = PAL.inkSoft;
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(x, y, 48 + i * 5, 5 + i, 0, .2, 2.9); ctx.stroke();
    }
    ctx.restore();
  }

  function drawFallingLeaves(t) {
    ctx.save();
    ctx.globalAlpha = .28;
    ctx.strokeStyle = PAL.ochre;
    ctx.lineWidth = .7;
    for (let i = 0; i < 20; i++) {
      const R = rng(1200 + i);
      const x = mod(R() * WORLD_W + t * (2 + R() * 3), WORLD_W);
      const y = 160 + R() * 760 + Math.sin(t * .5 + i) * 12;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 4, y - 2, x + 8, y + 1);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------------------------- render -------------------------- */

  function cameraAt(t) {
    const u = .10 + .86 * (.5 - .5 * Math.cos(TAU * t / 160));
    return u * state.camMax;
  }

  const bgCanvas = document.createElement('canvas');
  function buildBackground() {
    bgCanvas.width = Math.round(WORLD_W * BG_SCALE);
    bgCanvas.height = Math.round(DESIGN_H * BG_SCALE);
    const bg = bgCanvas.getContext('2d', { alpha: false });
    const prev = ctx;
    ctx = bg;
    ctx.setTransform(BG_SCALE, 0, 0, BG_SCALE, 0, 0);
    drawSkyStatic();
    drawMountains(0);
    drawDistantTrees();
    drawGround(0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx = prev;
  }

  function drawScene(t) {
    const sx = clamp(state.camX, 0, WORLD_W) * BG_SCALE;
    const sy = clamp(state.offY, 0, DESIGN_H) * BG_SCALE;
    const sw = Math.min(state.visW, WORLD_W) * BG_SCALE;
    const sh = Math.min(state.visH, DESIGN_H) * BG_SCALE;
    if (sx + sw > bgCanvas.width) {
      ctx.drawImage(bgCanvas, sx, sy, bgCanvas.width - sx, sh, state.camX, state.offY, (bgCanvas.width - sx) / BG_SCALE, sh / BG_SCALE);
    } else {
      ctx.drawImage(bgCanvas, sx, sy, sw, sh, state.camX, state.offY, sw / BG_SCALE, sh / BG_SCALE);
    }
    drawSkyDynamic(t);
    drawSmokeColumn(654, 708, 380, .12, .18, 1.2);
    drawSmokeColumn(1420, 880, 560, .36, .16, 1.65);
    drawSmokeColumn(2020, 900, 600, .58, .18, 1.7);
    drawSmokeColumn(2580, 820, 450, .72, .12, 1.3);
    drawSmokeColumn(3810, 870, 520, .28, .08, 1.3);
    for (const a of actors) a.fn(t);
    drawBattleEffects(t);
    drawFallingLeaves(t);
  }

  let last = performance.now();
  function frame(now) {
    const elapsed = Math.max(0, (now - state.start) / 1000);
    const still = state.poster && state.poster.t != null;
    const t = still ? state.poster.t : elapsed + (state.reduced ? 6 : 0);
    state.sceneTime = still ? state.poster.t : elapsed + 32;
    const cam = still
      ? (state.poster.cam != null ? clamp(state.poster.cam, 0, state.camMax) : cameraAt(t))
      : cameraAt(elapsed);
    state.camX = cam;

    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    ctx.fillStyle = PAL.paper;
    ctx.fillRect(0, 0, state.W, state.H);

    ctx.setTransform(
      state.dpr * state.scale, 0, 0, state.dpr * state.scale,
      -state.camX * state.dpr * state.scale,
      -state.offY * state.dpr * state.scale
    );
    drawScene(t);

    if (!still && !state.reduced) requestAnimationFrame(frame);
    else if (!still && state.reduced) requestAnimationFrame(frame);
  }

  /* ---------------------------------- boot ---------------------------- */

  buildRidges();
  buildScene();
  resize();
  buildBackground();
  state.grain = makeGrain();
  const grainEl = document.getElementById('grain');
  if (grainEl) grainEl.style.backgroundImage = `url(${state.grain.toDataURL()})`;
  state.start = performance.now();
  if (state.clean) document.body.classList.add('clean');
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  document.body.classList.add('ready');
  requestAnimationFrame(frame);

  // Expose a tiny, read-only debug hook for local previews / screenshots.
  window.__BATTLE_SCROLL__ = {
    get info() { return { camX: state.camX, camMax: state.camMax, scale: state.scale, time: state.sceneTime, actors: actors.length }; },
    seek(value) {
      state.start = performance.now() - Math.max(0, Number(value) || 0) * 1000;
    },
    renderStill(t, cam) {
      state.poster = { t: Number(t) || 0, cam: cam == null ? null : Number(cam) };
      state.sceneTime = state.poster.t;
      state.camX = state.poster.cam == null ? cameraAt(state.poster.t) : clamp(state.poster.cam, 0, state.camMax);
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      ctx.fillStyle = PAL.paper;
      ctx.fillRect(0, 0, state.W, state.H);
      ctx.setTransform(
        state.dpr * state.scale, 0, 0, state.dpr * state.scale,
        -state.camX * state.dpr * state.scale,
        -state.offY * state.dpr * state.scale
      );
      drawScene(state.sceneTime);
    },
  };
})();

</script>
</body>
