<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050909" />
<title>门格海绵 · Menger Sponge</title>
<style>
  :root {
    --ink: #e7f1ec;
    --ink-dim: rgba(231, 241, 236, 0.48);
    --ink-faint: rgba(231, 241, 236, 0.22);
    --accent: #8fffd8;
    --line: rgba(198, 235, 222, 0.16);
    --pad: clamp(22px, 3.4vw, 54px);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #050909;
  }

  body {
    color: var(--ink);
    font-family: "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    opacity: 0;
    transition: opacity 1.5s cubic-bezier(.22, 1, .36, 1);
  }

  body.ready #scene { opacity: 1; }
  #scene.dragging { cursor: grabbing; }

  /* ---------- interface ---------- */

  .ui {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    padding: var(--pad);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto 1fr auto;
    gap: 24px;
  }

  .top-left { grid-column: 1; grid-row: 1; }
  .top-right {
    grid-column: 2;
    grid-row: 1;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding-top: 6px;
    color: var(--ink-dim);
    font-size: 10px;
    line-height: 1.65;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-align: right;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    margin-top: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(143, 255, 216, .9);
    animation: pulse 3.4s ease-in-out infinite;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    color: var(--ink-dim);
    font-size: 9px;
    line-height: 1;
    letter-spacing: .24em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .eyebrow::before {
    content: "";
    width: 28px;
    height: 1px;
    background: var(--accent);
    opacity: .7;
  }

  h1 {
    margin: 0;
    font-size: clamp(38px, 5.1vw, 82px);
    font-weight: 300;
    line-height: .98;
    letter-spacing: .045em;
    text-shadow: 0 0 28px rgba(110, 255, 205, .06);
  }

  .title-en {
    display: block;
    margin-top: 12px;
    color: var(--ink-dim);
    font-size: clamp(9px, .82vw, 12px);
    font-weight: 400;
    letter-spacing: .48em;
    line-height: 1.4;
    text-transform: uppercase;
  }

  .note {
    grid-column: 1;
    grid-row: 3;
    align-self: end;
    max-width: 305px;
    margin: 0;
    color: var(--ink-dim);
    font-size: 11px;
    font-weight: 300;
    line-height: 2.05;
    letter-spacing: .08em;
  }

  .note strong {
    color: var(--ink);
    font-weight: 400;
  }

  .note-rule {
    width: 46px;
    height: 1px;
    margin-bottom: 17px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: .6;
  }

  .stats {
    display: flex;
    gap: 26px;
    margin-top: 22px;
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }

  .stat {
    color: var(--ink-dim);
    font-size: 8px;
    line-height: 1.7;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .stat b {
    display: block;
    color: rgba(231, 241, 236, .84);
    font-size: 15px;
    font-weight: 300;
    letter-spacing: .06em;
  }

  .bottom-right {
    grid-column: 2;
    grid-row: 3;
    align-self: end;
    text-align: right;
  }

  .hint {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    color: var(--ink-dim);
    font-size: 9px;
    line-height: 1.8;
    letter-spacing: .13em;
    text-transform: uppercase;
  }

  .hint + .hint { margin-top: 4px; }

  .key {
    display: inline-grid;
    min-width: 20px;
    height: 20px;
    place-items: center;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: rgba(231, 241, 236, .62);
    font-size: 8px;
    letter-spacing: .06em;
  }

  .level {
    position: fixed;
    top: 50%;
    right: calc(var(--pad) + 1px);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
    transform: translateY(-50%);
    color: var(--ink-faint);
    font-size: 8px;
    letter-spacing: .3em;
    writing-mode: vertical-rl;
  }

  .level::before,
  .level::after {
    content: "";
    width: 1px;
    height: 38px;
    background: linear-gradient(180deg, transparent, var(--ink-faint));
  }

  .level::after { background: linear-gradient(180deg, var(--ink-faint), transparent); }

  .corner {
    position: fixed;
    z-index: 2;
    width: 13px;
    height: 13px;
    border-color: var(--line);
    border-style: solid;
    pointer-events: none;
  }

  .corner.tl { top: calc(var(--pad) - 8px); left: calc(var(--pad) - 8px); border-width: 1px 0 0 1px; }
  .corner.tr { top: calc(var(--pad) - 8px); right: calc(var(--pad) - 8px); border-width: 1px 1px 0 0; }
  .corner.bl { bottom: calc(var(--pad) - 8px); left: calc(var(--pad) - 8px); border-width: 0 0 1px 1px; }
  .corner.br { bottom: calc(var(--pad) - 8px); right: calc(var(--pad) - 8px); border-width: 0 1px 1px 0; }

  .edge-label {
    position: fixed;
    left: 50%;
    bottom: calc(var(--pad) + 2px);
    z-index: 2;
    transform: translateX(-50%);
    color: rgba(231, 241, 236, .2);
    font-size: 8px;
    letter-spacing: .35em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ---------- reveal ---------- */

  .veil {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: #050909;
    transition: opacity 1s ease .18s, visibility 1s ease .18s;
  }

  body.ready .veil { opacity: 0; visibility: hidden; }

  .veil-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    color: var(--ink-dim);
    font-size: 9px;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  .loader {
    position: relative;
    width: 122px;
    height: 1px;
    overflow: hidden;
    background: var(--line);
  }

  .loader::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: translateX(-100%);
    animation: sweep 1.8s cubic-bezier(.65, 0, .35, 1) infinite;
  }

  .veil-error {
    max-width: 520px;
    padding: 26px;
    color: #ffb4a2;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    letter-spacing: 0;
    text-align: left;
    white-space: pre-wrap;
  }

  .ui > *,
  .level,
  .edge-label,
  .corner {
    opacity: 0;
    transform: translateY(9px);
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.22, 1, .36, 1);
  }

  body.ready .ui > *,
  body.ready .level,
  body.ready .edge-label,
  body.ready .corner {
    opacity: 1;
    transform: translateY(0);
  }

  body.ready .top-left { transition-delay: .35s; }
  body.ready .top-right { transition-delay: .55s; }
  body.ready .note { transition-delay: .65s; }
  body.ready .bottom-right { transition-delay: .8s; }
  body.ready .level { transition-delay: .9s; }
  body.ready .edge-label { transition-delay: 1s; }
  body.ready .corner { transition-delay: .3s; }

  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1); }
  }

  @keyframes sweep {
    0% { transform: translateX(-100%); }
    60%, 100% { transform: translateX(100%); }
  }

  @media (max-width: 760px) {
    .ui { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .top-right { display: none; }
    .note { max-width: 245px; font-size: 10px; line-height: 1.9; }
    .stats { gap: 18px; margin-top: 16px; }
    .bottom-right { display: none; }
    .level { display: none; }
    .edge-label { display: none; }
    h1 { font-size: clamp(38px, 13vw, 58px); }
    .title-en { letter-spacing: .34em; }
    .note .desktop-only { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #scene { transition-duration: .01s; }
    .status-dot, .loader::after { animation: none; }
    .ui > *, .level, .edge-label, .corner { transition-duration: .01s; }
  }
</style>
</head>
<body>
  <canvas id="scene" aria-label="由着色器实时绘制的三维门格海绵" role="img"></canvas>

  <div class="ui">
    <header class="top-left">
      <div class="eyebrow">Fractal field notes — 001</div>
      <h1>门格海绵</h1>
      <span class="title-en">Menger sponge / 3D</span>
    </header>

    <div class="top-right">
      <span class="status-dot"></span>
      <span>WebGL2 · SDF raymarch<br>实时生成 / 无模型</span>
    </div>

    <div class="note">
      <div class="note-rule"></div>
      <p style="margin:0">将立方体切成 <strong>3 × 3 × 3</strong>，<br>
      挖去每一面的中心与正中心。<br>
      <span class="desktop-only">循环往复，体积趋于零，<br>表面积却趋于无穷。</span></p>
      <div class="stats">
        <div class="stat">递归层数<b>04</b></div>
        <div class="stat">每边网格<b>81</b></div>
        <div class="stat">绘制方式<b>SDF</b></div>
      </div>
    </div>

    <div class="bottom-right">
      <div class="hint"><span class="key">拖拽</span> 旋转视角</div>
      <div class="hint"><span class="key">滚轮</span> 推近 / 拉远</div>
      <div class="hint"><span class="key">空格</span> 暂停自转</div>
    </div>
  </div>

  <div class="level">MENGER · DIMENSION 2.7268</div>
  <div class="edge-label">结构与虚空之间的第三种形态</div>

  <i class="corner tl"></i>
  <i class="corner tr"></i>
  <i class="corner bl"></i>
  <i class="corner br"></i>

  <div class="veil" id="veil">
    <div class="veil-inner" id="veil-inner">
      <span>正在生成分形几何</span>
      <div class="loader"></div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("scene");
  const veilInner = document.getElementById("veil-inner");
  const gl = canvas.getContext("webgl2", {
    antialias: false,
    alpha: false,
    depth: false,
    stencil: false,
    powerPreference: "high-performance",
    preserveDrawingBuffer: false
  });

  const fail = (message) => {
    console.error(message);
    veilInner.innerHTML = "";
    const pre = document.createElement("div");
    pre.className = "veil-error";
    pre.textContent = String(message);
    veilInner.appendChild(pre);
    veilInner.style.gap = "0";
  };

  if (!gl) {
    fail("无法创建 WebGL2 上下文。\n请使用支持 WebGL2 的现代浏览器打开这个页面。");
    return;
  }

  const VERT = `#version 300 es
  precision highp float;
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const SCENE_FRAG = `#version 300 es
  precision highp float;

  uniform vec2  uRes;
  uniform mat3  uWorldToLocal;
  uniform float uTime;
  uniform float uZoom;
  uniform float uReveal;

  out vec4 outColor;

  const float PI = 3.14159265359;

  // ------------------------------------------------------------
  // SDF
  // ------------------------------------------------------------
  float sdBox(vec3 p, vec3 b) {
    vec3 q = abs(p) - b;
    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
  }

  float sdMenger(vec3 p) {
    float d = sdBox(p, vec3(1.0));
    float s = 1.0;

    for (int i = 0; i < 4; i++) {
      vec3 a = mod(p * s, 2.0) - 1.0;
      s *= 3.0;

      vec3 r = abs(1.0 - 3.0 * abs(a));

      float da = max(r.x, r.y);
      float db = max(r.y, r.z);
      float dc = max(r.z, r.x);
      float c = (min(da, min(db, dc)) - 1.0) / s;

      d = max(d, c);
    }

    return d;
  }

  float map(vec3 p) {
    return sdMenger(uWorldToLocal * p);
  }

  // ------------------------------------------------------------
  // helpers
  // ------------------------------------------------------------
  vec2 sphereIntersect(vec3 ro, vec3 rd, float radius) {
    float b = dot(ro, rd);
    float c = dot(ro, ro) - radius * radius;
    float h = b * b - c;
    if (h < 0.0) return vec2(-1.0);
    h = sqrt(h);
    return vec2(-b - h, -b + h);
  }

  vec3 calcNormal(vec3 p) {
    const vec2 e = vec2(1.0, -1.0) * 0.5773;
    const float h = 0.0022;
    return normalize(
      e.xyy * map(p + e.xyy * h) +
      e.yyx * map(p + e.yyx * h) +
      e.yxy * map(p + e.yxy * h) +
      e.xxx * map(p + e.xxx * h)
    );
  }

  float calcAO(vec3 p, vec3 n) {
    float occ = 0.0;
    float sca = 1.0;

    for (int i = 0; i < 5; i++) {
      float h = 0.014 + 0.115 * float(i) / 4.0;
      float d = map(p + n * h);
      occ += (h - d) * sca;
      sca *= 0.82;
    }

    return clamp(1.0 - 2.35 * occ, 0.0, 1.0);
  }

  float softShadow(vec3 ro, vec3 rd, float mint, float maxt) {
    float res = 1.0;
    float t = mint;

    for (int i = 0; i < 28; i++) {
      float h = map(ro + rd * t);
      res = min(res, 9.0 * h / t);
      t += clamp(h, 0.012, 0.13);
      if (res < 0.004 || t > maxt) break;
    }

    return clamp(res, 0.0, 1.0);
  }

  // ------------------------------------------------------------
  // palette / light
  // ------------------------------------------------------------
  vec3 background(vec2 uv, vec3 rd) {
    vec3 top = vec3(0.0055, 0.0135, 0.0145);
    vec3 bottom = vec3(0.0020, 0.0040, 0.0045);
    vec3 col = mix(bottom, top, smoothstep(-0.75, 0.85, rd.y));

    float r = length(uv * vec2(0.88, 1.0));
    col += vec3(0.030, 0.090, 0.078) * exp(-r * 3.0) * 0.78;

    // a barely-there horizontal trace, like a distant horizon
    float horizon = exp(-abs(rd.y + 0.13) * 65.0);
    col += vec3(0.012, 0.030, 0.026) * horizon * 0.5;

    // a very quiet orbital trace, far behind the object
    float ring = smoothstep(0.0022, 0.0, abs(length(uv) - 0.435));
    float ang = atan(uv.y, uv.x);
    ring *= 0.45 + 0.55 * smoothstep(-0.2, 0.8, sin(ang * 7.0 + 1.2));
    col += vec3(0.12, 0.42, 0.34) * ring * 0.035;

    return col;
  }

  vec3 envMap(vec3 r, vec3 keyDir, vec3 fillDir) {
    float up = smoothstep(-0.35, 0.95, r.y);
    vec3 col = mix(vec3(0.001, 0.003, 0.004), vec3(0.035, 0.085, 0.074), up);

    float keyCard = pow(max(dot(r, keyDir), 0.0), 24.0);
    col += vec3(0.65, 0.45, 0.27) * keyCard * 0.55;

    float coolCard = pow(max(dot(r, fillDir), 0.0), 9.0);
    col += vec3(0.07, 0.34, 0.31) * coolCard * 0.18;

    return col;
  }

  vec3 shade(vec3 p, vec3 n, vec3 rd, float t) {
    vec3 keyDir = normalize(vec3(-0.58, 0.66, 0.72));
    vec3 fillDir = normalize(vec3(0.90, -0.10, 0.30));
    vec3 backDir = normalize(vec3(0.08, 0.40, -0.92));

    float ao = calcAO(p, n);
    float keyShadow = softShadow(p + n * 0.016, keyDir, 0.02, 2.6);

    float ndv = clamp(dot(n, -rd), 0.0, 1.0);
    float ndl = clamp(dot(n, keyDir), 0.0, 1.0);
    float fill = clamp(dot(n, fillDir), 0.0, 1.0);
    float back = clamp(dot(n, backDir), 0.0, 1.0);

    // low-frequency patina keeps the large planes from reading as plastic
    float patina = sin(p.x * 4.3 + sin(p.y * 3.1) * 1.7)
                 * sin(p.z * 3.7 + p.y * 2.3 + 0.8);
    vec3 base = mix(
      vec3(0.009, 0.015, 0.015),
      vec3(0.038, 0.057, 0.053),
      smoothstep(-0.95, 0.95, p.y)
    );
    base *= 0.91 + 0.13 * patina;

    // broad daylight from the key, cool bounce from below-right
    vec3 col = base * (0.07 + 1.95 * ndl * keyShadow) * vec3(1.0, 0.72, 0.43);
    col += base * fill * vec3(0.14, 0.52, 0.50) * 0.20 * ao;
    col += base * back * vec3(0.10, 0.42, 0.32) * 0.15 * ao;

    // an ember of light caught inside the lattice
    vec3 toCore = -p;
    float coreDist = length(toCore);
    vec3 coreDir = toCore / max(coreDist, 0.0001);
    float coreLight = max(dot(n, coreDir), 0.0) / (1.0 + 3.2 * coreDist * coreDist);
    col += base * coreLight * vec3(0.28, 1.00, 0.78) * 2.0;

    vec3 h1 = normalize(keyDir - rd);
    float spec1 = pow(max(dot(n, h1), 0.0), 18.0) * 0.22
                + pow(max(dot(n, h1), 0.0), 110.0) * 2.2;
    col += vec3(1.0, 0.68, 0.40) * spec1 * keyShadow;

    vec3 h2 = normalize(fillDir - rd);
    float spec2 = pow(max(dot(n, h2), 0.0), 34.0);
    col += vec3(0.24, 0.92, 0.82) * spec2 * 0.32 * ao;

    float fres = pow(1.0 - ndv, 5.0);
    vec3 env = envMap(reflect(rd, n), keyDir, fillDir);
    col += env * (0.04 + 0.96 * fres) * 0.62 * ao;

    // moonlit edge
    col += vec3(0.24, 0.90, 0.68) * pow(1.0 - ndv, 3.0) * 0.30 * ao;

    // interiors go quiet
    col *= mix(0.10, 1.0, ao);

    // gentle depth fade into the void
    float fog = smoothstep(2.3, 4.4, t);
    col = mix(col, vec3(0.0035, 0.0065, 0.0068), fog * 0.32);

    return col;
  }

  vec3 aces(vec3 x) {
    return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
  }

  void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;

    // portrait screens need a wider cone so the sponge never clips sideways
    float aspect = uRes.x / uRes.y;
    float fit = clamp(0.68 / aspect, 1.0, 1.48);

    float dist = 3.1 / uZoom;
    vec3 ro = vec3(0.0, 0.12, dist);
    vec3 rd = normalize(vec3(uv * 1.06 * fit, -1.0));

    vec3 col = background(uv, rd);
    vec2 bounds = sphereIntersect(ro, rd, 1.78);

    if (bounds.y > 0.0) {
      float t = max(bounds.x, 0.0);
      float d = 0.0;
      bool hit = false;

      for (int i = 0; i < 154; i++) {
        vec3 p = ro + rd * t;
        d = map(p);

        if (d < 0.00055 + 0.00055 * t) {
          hit = true;
          break;
        }

        t += max(d * 0.88, 0.00045);
        if (t > bounds.y) break;
      }

      if (hit) {
        vec3 p = ro + rd * t;
        vec3 n = calcNormal(p);
        col = shade(p, n, rd, t);
      }
    }

    col *= uReveal;
    col = aces(col * 1.28);
    col = pow(col, vec3(1.0 / 2.2));

    outColor = vec4(col, 1.0);
  }`;

  const POST_FRAG = `#version 300 es
  precision highp float;

  uniform sampler2D uScene;
  uniform vec2  uRes;
  uniform float uTime;

  out vec4 outColor;

  float luma(vec3 c) {
    return dot(c, vec3(0.299, 0.587, 0.114));
  }

  float hash(vec2 p) {
    p = fract(p * vec2(123.34, 345.45));
    p += dot(p, p + 34.345);
    return fract(p.x * p.y);
  }

  vec3 fxaa(vec2 uv) {
    vec2 texel = 1.0 / uRes;

    vec3 nw = texture(uScene, uv + texel * vec2(-1.0, -1.0)).rgb;
    vec3 ne = texture(uScene, uv + texel * vec2( 1.0, -1.0)).rgb;
    vec3 sw = texture(uScene, uv + texel * vec2(-1.0,  1.0)).rgb;
    vec3 se = texture(uScene, uv + texel * vec2( 1.0,  1.0)).rgb;
    vec3 m  = texture(uScene, uv).rgb;

    float lNW = luma(nw);
    float lNE = luma(ne);
    float lSW = luma(sw);
    float lSE = luma(se);
    float lM  = luma(m);

    float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
    float lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));

    vec2 dir;
    dir.x = -((lNW + lNE) - (lSW + lSE));
    dir.y =  ((lNW + lSW) - (lNE + lSE));

    float dirReduce = max((lNW + lNE + lSW + lSE) * 0.25 * 0.0625, 1.0 / 128.0);
    float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
    dir = clamp(dir * rcpDirMin, vec2(-8.0), vec2(8.0)) * texel;

    vec3 a = 0.5 * (
      texture(uScene, uv + dir * (1.0 / 3.0 - 0.5)).rgb +
      texture(uScene, uv + dir * (2.0 / 3.0 - 0.5)).rgb
    );

    vec3 b = a * 0.5 + 0.25 * (
      texture(uScene, uv - dir * 0.5).rgb +
      texture(uScene, uv + dir * 0.5).rgb
    );

    if (luma(b) < lMin || luma(b) > lMax) return a;
    return b;
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec3 col = fxaa(uv);

    // compose: vignette, subtle grade, film grain
    vec2 q = uv - 0.5;
    q.x *= uRes.x / uRes.y;
    float vig = smoothstep(1.02, 0.24, length(q));
    col *= mix(0.58, 1.0, vig);

    float g = hash(gl_FragCoord.xy + fract(uTime) * 431.0) - 0.5;
    col += g * 0.017;

    col = mix(col, col * vec3(1.015, 0.995, 0.975), 0.35);

    outColor = vec4(col, 1.0);
  }`;

  // ------------------------------------------------------------
  // shader plumbing
  // ------------------------------------------------------------
  const compile = (type, source, label) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(label + " shader 编译失败：\n" + log);
    }
    return shader;
  };

  const createProgram = (fragSource, label) => {
    const program = gl.createProgram();
    const vs = compile(gl.VERTEX_SHADER, VERT, label + " vertex");
    const fs = compile(gl.FRAGMENT_SHADER, fragSource, label + " fragment");
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(program);
      gl.deleteProgram(program);
      throw new Error(label + " program 链接失败：\n" + log);
    }
    return program;
  };

  let sceneProgram;
  let postProgram;
  try {
    sceneProgram = createProgram(SCENE_FRAG, "scene");
    postProgram = createProgram(POST_FRAG, "post");
  } catch (err) {
    fail(err.message);
    return;
  }

  const sceneU = {
    res: gl.getUniformLocation(sceneProgram, "uRes"),
    matrix: gl.getUniformLocation(sceneProgram, "uWorldToLocal"),
    time: gl.getUniformLocation(sceneProgram, "uTime"),
    zoom: gl.getUniformLocation(sceneProgram, "uZoom"),
    reveal: gl.getUniformLocation(sceneProgram, "uReveal")
  };

  const postU = {
    scene: gl.getUniformLocation(postProgram, "uScene"),
    res: gl.getUniformLocation(postProgram, "uRes"),
    time: gl.getUniformLocation(postProgram, "uTime")
  };

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const renderTexture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, renderTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, renderTexture, 0);

  const size = { width: 0, height: 0 };

  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    const width = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const height = Math.max(1, Math.round(canvas.clientHeight * dpr));

    if (width === size.width && height === size.height) return;

    size.width = width;
    size.height = height;
    canvas.width = width;
    canvas.height = height;

    gl.bindTexture(gl.TEXTURE_2D, renderTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, renderTexture, 0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  };

  // ------------------------------------------------------------
  // camera / interaction
  // ------------------------------------------------------------
  const state = {
    yaw: -0.92,
    pitch: 0.32,
    targetYaw: -0.92,
    targetPitch: 0.32,
    zoom: 1.0,
    targetZoom: 1.0,
    autoRotate: !window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    dragging: false,
    pointerId: null,
    lastX: 0,
    lastY: 0,
    startTime: performance.now(),
    pausedAt: 0
  };

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  canvas.addEventListener("pointerdown", (event) => {
    state.dragging = true;
    state.pointerId = event.pointerId;
    state.lastX = event.clientX;
    state.lastY = event.clientY;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(event.pointerId);
  });

  canvas.addEventListener("pointermove", (event) => {
    if (!state.dragging || event.pointerId !== state.pointerId) return;

    const dx = event.clientX - state.lastX;
    const dy = event.clientY - state.lastY;
    state.lastX = event.clientX;
    state.lastY = event.clientY;

    state.targetYaw += dx * 0.0072;
    state.targetPitch = clamp(state.targetPitch + dy * 0.0062, -1.25, 1.25);
  });

  const endDrag = (event) => {
    if (!state.dragging) return;
    if (event && event.pointerId !== state.pointerId) return;
    state.dragging = false;
    state.pointerId = null;
    canvas.classList.remove("dragging");
  };

  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("lostpointercapture", endDrag);

  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    const delta = Math.sign(event.deltaY) * 0.075;
    state.targetZoom = clamp(state.targetZoom - delta, 0.78, 1.32);
  }, { passive: false });

  const resetView = () => {
    state.targetYaw = -0.92;
    state.targetPitch = 0.32;
    state.targetZoom = 1.0;
  };

  canvas.addEventListener("dblclick", resetView);

  window.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
      event.preventDefault();
      state.autoRotate = !state.autoRotate;
      return;
    }
    if (event.code === "KeyR") {
      resetView();
    }
  });

  // A little breathing room around the chosen angle.
  const angles = (t) => {
    if (!state.autoRotate) {
      return { yaw: state.targetYaw, pitch: state.targetPitch };
    }
    return {
      yaw: state.targetYaw + Math.sin(t * 0.11) * 0.018,
      pitch: state.targetPitch + Math.cos(t * 0.09) * 0.012
    };
  };

  // ------------------------------------------------------------
  // matrix
  // ------------------------------------------------------------
  const mat3 = {
    identity: () => [1, 0, 0, 0, 1, 0, 0, 0, 1],

    multiply(a, b) {
      // row-major 3x3 multiply
      const out = new Array(9).fill(0);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          out[r * 3 + c] =
            a[r * 3] * b[c] +
            a[r * 3 + 1] * b[3 + c] +
            a[r * 3 + 2] * b[6 + c];
        }
      }
      return out;
    },

    rotationY(a) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      return [c, 0, s, 0, 1, 0, -s, 0, c];
    },

    rotationX(a) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      return [1, 0, 0, 0, c, -s, 0, s, c];
    },

    transpose(m) {
      return [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
    },

    // WebGL wants column-major data; `m` is row-major.
    toColumnMajor(m) {
      return new Float32Array([m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]);
    }
  };

  const localMatrix = new Float32Array(9);

  // ------------------------------------------------------------
  // render loop
  // ------------------------------------------------------------
  let lastFrame = performance.now();
  let firstFrame = true;
  let paused = false;

  const render = (now) => {
    requestAnimationFrame(render);

    if (paused) return;

    const elapsed = (now - state.startTime) / 1000;
    const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;

    resize();

    if (state.autoRotate && !state.dragging) {
      state.targetYaw += dt * 0.085;
    }

    const drift = angles(elapsed);
    const ease = 1.0 - Math.pow(0.0012, dt);
    state.yaw += (drift.yaw - state.yaw) * ease;
    state.pitch += (drift.pitch - state.pitch) * ease;
    state.zoom += (state.targetZoom - state.zoom) * ease;

    // Build world -> object rotation: transpose(Ry(yaw) * Rx(pitch)).
    const ry = mat3.rotationY(state.yaw);
    const rx = mat3.rotationX(state.pitch);
    const worldToLocal = mat3.transpose(mat3.multiply(ry, rx));
    localMatrix.set(mat3.toColumnMajor(worldToLocal));

    const reveal = clamp((now - state.startTime) / 1000, 0, 1);
    const smoothReveal = reveal * reveal * (3 - 2 * reveal);

    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.viewport(0, 0, size.width, size.height);
    gl.useProgram(sceneProgram);
    gl.uniform2f(sceneU.res, size.width, size.height);
    gl.uniformMatrix3fv(sceneU.matrix, false, localMatrix);
    gl.uniform1f(sceneU.time, elapsed);
    gl.uniform1f(sceneU.zoom, state.zoom);
    gl.uniform1f(sceneU.reveal, smoothReveal);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, size.width, size.height);
    gl.useProgram(postProgram);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, renderTexture);
    gl.uniform1i(postU.scene, 0);
    gl.uniform2f(postU.res, size.width, size.height);
    gl.uniform1f(postU.time, elapsed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (firstFrame) {
      firstFrame = false;
      requestAnimationFrame(() => document.body.classList.add("ready"));
    }
  };

  window.addEventListener("resize", resize, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      paused = true;
    } else {
      paused = false;
      lastFrame = performance.now();
    }
  });

  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
