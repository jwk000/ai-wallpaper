    const ab = c.createRadialGradient(-L * 0.34, -L * 0.06, 0, -L * 0.32, 0, L * 0.36);
    ab.addColorStop(0, '#9a622f');
    ab.addColorStop(1, '#4a2a15');
    c.fillStyle = ab;
    c.beginPath(); c.ellipse(-L * 0.32, 0, L * 0.37 * (1 + pulse * 0.012), L * 0.185, -0.08, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(216, 154, 92, .50)'; c.lineWidth = Math.max(0.7, L * 0.022);
    c.beginPath(); c.ellipse(-L * 0.32, 0, L * 0.37, L * 0.185, -0.08, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(82, 45, 20, .5)'; c.lineWidth = Math.max(0.5, L * 0.016);
    for (let s = 1; s <= 3; s++) {
      c.beginPath();
      c.ellipse(-L * 0.32, 0, L * (0.11 + s * 0.065), L * (0.165 - s * 0.03), -0.08, Math.PI * 1.05, Math.PI * 1.68);
      c.stroke();
    }
    // petiole, thorax and head
    c.fillStyle = '#502a14';
    c.beginPath(); c.ellipse(-L * 0.09, 0, L * 0.065, L * 0.07, 0, 0, TAU); c.fill();
    c.fillStyle = '#6a3a1e';
    c.beginPath(); c.ellipse(L * 0.02, 0, L * 0.15, L * 0.105, 0, 0, TAU); c.fill();
    c.fillStyle = '#5b3117';
    c.beginPath(); c.ellipse(L * 0.235, 0, L * 0.122, L * 0.098, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(214, 150, 88, .55)'; c.lineWidth = Math.max(0.6, L * 0.018);
    c.beginPath(); c.ellipse(L * 0.235, 0, L * 0.122, L * 0.098, 0, 0, TAU); c.stroke();
    // antennae
    c.strokeStyle = 'rgba(96, 56, 27, .92)'; c.lineWidth = Math.max(0.6, L * 0.018);
    for (const side of [-1, 1]) {
      c.beginPath();
      c.moveTo(L * 0.32, side * L * 0.03);
      c.quadraticCurveTo(L * 0.45, side * L * 0.11, L * 0.50, side * L * 0.24);
      c.stroke();
    }
    c.restore();

    // Attendants.
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * TAU + 0.8;
      const x = cx + Math.cos(a) * rx * 0.55;
      const y = cy + Math.sin(a) * ry * 0.45 + ry * 0.1;
      drawAnt(c, x, y, a + Math.PI / 2, clamp(rx * 0.30, 12, 20), time * 5 + i * 2, null, 0.94);
    }
    // Eggs by the queen.
    for (let i = 0; i < 4; i++) {
      c.fillStyle = 'rgba(238, 226, 198, .6)';
      c.beginPath();
      c.ellipse(cx - rx * 0.55 + i * 4.2, cy + ry * 0.54, 2.1, 1.3, 0.3, 0, TAU);
      c.fill();
    }
  }

  function drawGarden(c, cx, cy, rx, ry, pulse) {
    for (let i = 0; i < 7; i++) {
      const x = cx + (hash1(i + 3) - 0.5) * rx * 1.1;
      const y = cy + ry * (0.50 - hash1(i + 8) * 0.55);
      const s = 4.2 + hash1(i + 20) * 3.0;
      c.strokeStyle = 'rgba(222, 213, 181, .55)';
      c.lineWidth = 1 + s * 0.12;
      c.beginPath(); c.moveTo(x, y + s * 0.8); c.lineTo(x + s * 0.08, y); c.stroke();
      const cap = c.createRadialGradient(x, y - s * 0.35, 0, x, y - s * 0.2, s * 1.4);
      cap.addColorStop(0, `rgba(246, 239, 211, ${0.72 + pulse * 0.06})`);
      cap.addColorStop(1, 'rgba(206, 196, 158, .18)');
      c.fillStyle = cap;
      c.beginPath(); c.ellipse(x + s * 0.08, y - s * 0.06, s, s * 0.5, 0, Math.PI, TAU); c.fill();
      c.fillStyle = 'rgba(255, 250, 229, .5)';
      c.beginPath(); c.ellipse(x + s * 0.08, y - s * 0.06, s * 0.84, s * 0.38, 0, Math.PI, TAU); c.fill();
    }
  }

  function drawSpring(c, cx, cy, rx, ry) {
    c.strokeStyle = 'rgba(26, 17, 10, .7)';
    c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(cx - rx * 0.6, cy - ry * 0.2); c.quadraticCurveTo(cx, cy - ry * 0.9, cx + rx * 0.6, cy - ry * 0.15); c.stroke();
    const dropY = cy + ry * 0.05;
    const grad = c.createRadialGradient(cx - rx * 0.1, dropY - ry * 0.15, 0, cx, dropY, rx * 0.28);
    grad.addColorStop(0, 'rgba(220, 240, 232, .8)');
    grad.addColorStop(0.5, 'rgba(144, 188, 182, .5)');
    grad.addColorStop(1, 'rgba(63, 96, 92, .22)');
    c.fillStyle = grad;
    c.beginPath(); c.ellipse(cx, dropY, rx * 0.18, ry * 0.28, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255, 255, 255, .6)';
    c.beginPath(); c.ellipse(cx - rx * 0.06, dropY - ry * 0.10, rx * 0.045, ry * 0.07, 0, 0, TAU); c.fill();
    // Pool at the bottom.
    c.fillStyle = 'rgba(84, 131, 128, .10)';
    c.beginPath(); c.ellipse(cx, cy + ry * 0.55, rx * 0.6, ry * 0.18, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(190, 225, 216, .14)'; c.lineWidth = 0.9;
    c.beginPath(); c.ellipse(cx, cy + ry * 0.55, rx * 0.46, ry * 0.11, 0, 0, TAU); c.stroke();
  }

  function drawUndergroundAnts(c) {
    for (const a of ants) {
      if (a.mode !== 'underground') continue;
      const x = a.x * w, y = a.y * h;
      const alpha = (a.fade || 1) * 0.95;
      // A little warm bounce light separates the body from the dark cavity.
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.15 * (a.fade || 1);
      c.drawImage(glowSprite, x - a.size * 1.9, y - a.size * 1.5, a.size * 3.8, a.size * 3.0);
      c.restore();
      drawAnt(c, x, y, a.face, a.size, a.walk + time * 6, a.carrying ? a.carrying.type : null, alpha);
    }
  }

  function drawSurfaceAnts(c) {
    for (const a of ants) {
      if (a.mode !== 'surface') continue;
      const x = a.x * w;
      const y = groundAt(a.x) * h - a.size * 0.26;
      c.fillStyle = 'rgba(8, 4, 2, .28)';
      c.beginPath(); c.ellipse(x, groundAt(a.x) * h + 0.8, a.size * 0.48, a.size * 0.14, 0, 0, TAU); c.fill();
      drawAnt(c, x, y, a.face, a.size, a.walk + time * 7.5 + a.phase * 0.2, a.carrying ? a.carrying.type : null, (a.fade || 1));
    }
  }

  function drawAnt(c, x, y, face, L, walk, carry, alpha) {
    c.save();
    c.globalAlpha = clamp(alpha, 0, 1);
    c.translate(x, y);
    c.rotate(face);
    c.lineCap = 'round';
    c.lineJoin = 'round';

    const bodyColor = '#6b3a1c';
    const thoraxColor = '#74401f';
    const headColor = '#5d3117';
    const rimColor = 'rgba(255, 196, 128, .55)';
    const legColor = 'rgba(126, 78, 40, .92)';

    // Six long, bent legs, alternating tripod gait.
    for (const side of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const bx = (i - 1) * L * 0.135 - L * 0.01;
        const ph = walk + i * 2.2 + (side > 0 ? Math.PI : 0);
        const lift = Math.max(0, Math.sin(ph + 1.2));
        const kneeX = bx + L * 0.07 + Math.sin(ph) * L * 0.045;
        const kneeY = side * (L * 0.13 + L * 0.025 * lift);
        const footX = kneeX + L * 0.09 + (i - 1) * L * 0.025 + Math.sin(ph + 0.9) * L * 0.025;
        const footY = side * (L * 0.235 - L * 0.04 * lift);
        c.strokeStyle = legColor;
        c.lineWidth = Math.max(0.6, L * 0.027);
        c.beginPath();
        c.moveTo(bx, side * L * 0.06);
        c.lineTo(kneeX, kneeY);
        c.lineTo(footX, footY);
        c.stroke();
        c.fillStyle = 'rgba(74, 43, 20, .7)';
        c.beginPath(); c.arc(kneeX, kneeY, Math.max(0.45, L * 0.014), 0, TAU); c.fill();
      }
    }

    // A dark underpainting gives the silhouette an edge on light soil.
    c.fillStyle = 'rgba(28, 14, 7, .48)';
    c.beginPath(); c.ellipse(-L * 0.33, L * 0.012, L * 0.24, L * 0.165, -0.08, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(L * 0.225, L * 0.008, L * 0.13, L * 0.112, 0, 0, TAU); c.fill();

    // Abdomen, waist, thorax, neck, head.
    c.fillStyle = bodyColor;
    c.beginPath(); c.ellipse(-L * 0.33, 0, L * 0.235, L * 0.150, -0.08, 0, TAU); c.fill();
    c.strokeStyle = rimColor;
    c.lineWidth = Math.max(0.55, L * 0.020);
    c.beginPath(); c.ellipse(-L * 0.33, 0, L * 0.235, L * 0.150, -0.08, 0, TAU); c.stroke();

    c.fillStyle = '#502a14';
    c.beginPath(); c.ellipse(-L * 0.125, 0, L * 0.060, L * 0.064, 0, 0, TAU); c.fill();

    c.fillStyle = thoraxColor;
    c.beginPath(); c.ellipse(-L * 0.005, 0, L * 0.140, L * 0.092, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255, 204, 143, .34)';
    c.lineWidth = Math.max(0.4, L * 0.015);
    c.beginPath(); c.ellipse(-L * 0.005, 0, L * 0.140, L * 0.092, 0, 0, TAU); c.stroke();

    c.fillStyle = 'rgba(74, 39, 18, .9)';
    c.beginPath(); c.ellipse(L * 0.122, 0, L * 0.034, L * 0.048, 0, 0, TAU); c.fill();

    c.fillStyle = headColor;
    c.beginPath(); c.ellipse(L * 0.232, 0, L * 0.122, L * 0.098, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255, 204, 143, .40)';
    c.lineWidth = Math.max(0.45, L * 0.016);
    c.beginPath(); c.ellipse(L * 0.232, 0, L * 0.122, L * 0.098, 0, 0, TAU); c.stroke();

    // Gloss on the abdomen and head.
    c.fillStyle = 'rgba(255, 216, 161, .26)';
    c.beginPath(); c.ellipse(-L * 0.37, -L * 0.078, L * 0.095, L * 0.028, -0.18, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(L * 0.207, -L * 0.050, L * 0.050, L * 0.021, 0.1, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(80, 44, 20, .5)';
    c.lineWidth = Math.max(0.35, L * 0.013);
    for (let s = 1; s <= 2; s++) {
      c.beginPath();
      c.ellipse(-L * 0.33, 0, L * (0.085 + s * 0.055), L * (0.125 - s * 0.024), -0.08, Math.PI * 1.06, Math.PI * 1.70);
      c.stroke();
    }

    // Antennae: two thin, bent segments.
    c.strokeStyle = 'rgba(174, 116, 63, .78)';
    c.lineWidth = Math.max(0.5, L * 0.018);
    for (const side of [-1, 1]) {
      const bend = Math.sin(walk * 0.65 + side) * L * 0.022;
      c.beginPath();
      c.moveTo(L * 0.305, side * L * 0.035);
      c.quadraticCurveTo(L * 0.39, side * (L * 0.12 + bend), L * 0.46, side * (L * 0.25 + bend));
      c.stroke();
      c.fillStyle = 'rgba(245, 208, 160, .5)';
      c.beginPath(); c.arc(L * 0.46, side * (L * 0.25 + bend), Math.max(0.4, L * 0.012), 0, TAU); c.fill();
    }

    // Mandibles and eye.
    c.strokeStyle = 'rgba(232, 170, 103, .60)';
    c.lineWidth = Math.max(0.45, L * 0.016);
    c.beginPath(); c.moveTo(L * 0.335, -L * 0.02); c.quadraticCurveTo(L * 0.39, -L * 0.06, L * 0.41, -L * 0.01); c.stroke();
    c.beginPath(); c.moveTo(L * 0.335, L * 0.02); c.quadraticCurveTo(L * 0.39, L * 0.06, L * 0.41, L * 0.01); c.stroke();
    c.fillStyle = 'rgba(20, 10, 4, .85)';
    c.beginPath(); c.arc(L * 0.275, -L * 0.028, Math.max(0.5, L * 0.018), 0, TAU); c.fill();

    if (carry) {
      c.strokeStyle = 'rgba(60, 32, 14, .45)';
      c.lineWidth = Math.max(0.4, L * 0.018);
      c.beginPath(); c.moveTo(L * 0.28, -L * 0.03); c.lineTo(L * 0.35, -L * 0.10); c.stroke();
      drawFoodShape(c, carry, L * 0.27, L * 0.24, L * 0.44, -L * 0.12, -0.3);
    }
    c.restore();
  }
  function drawPheromone(c) {
    if (!showPhero) return;
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < SCENT_BINS; i++) {
      const s = scent[i];
      if (s < 0.045) continue;
      const x = ((i + 0.5) / SCENT_BINS) * w;
      const y = groundAt(x / w) * h - 1.2;
      if ((i & 1) && s < 0.62) continue;
      const r = 3.5 + Math.min(5.8, s * 5.5);
      c.globalAlpha = Math.min(0.24, 0.04 + s * 0.21);
      c.drawImage(glowSprite, x - r, y - r * 0.54, r * 2, r * 1.08);
      if (s > 0.74) {
        c.globalAlpha = Math.min(0.40, (s - 0.68) * 0.85);
        c.fillStyle = 'rgba(255, 226, 174, .85)';
        c.fillRect(x - 0.45, y - 0.6, 0.9, 0.9);
      }
    }
    c.restore();
  }

  function drawFoods(c) {
    for (const f of foods) {
      if (f.dead) continue;
      const x = f.x * w;
      const gy = groundAt(f.x) * h;
      const y = f.landed ? gy : f.y * h;
      if (f.landed) {
        c.fillStyle = `rgba(6, 3, 2, ${0.24 * (f.fade || 1)})`;
        c.beginPath(); c.ellipse(x, gy + 2, 8 + f.amount * 0.3, 2.6, 0, 0, TAU); c.fill();
      }
      const scale = 0.55 + 0.45 * Math.sqrt(clamp(f.amount / f.max, 0, 1));
      c.save();
      c.globalAlpha = f.fade || 1;
      drawFoodShape(c, f.type, 10 * scale, 10 * scale, x, y, f.rot);
      c.restore();
      if (f.active > 0) {
        c.fillStyle = `rgba(255, 214, 150, ${0.18 * f.active})`;
        c.beginPath(); c.arc(x, y - 4, 12, 0, TAU); c.fill();
      }
    }
  }

  function drawFoodShape(c, type, sx, sy, x, y, rot = 0) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    if (type === 'crumb') {
      c.fillStyle = '#b88752';
      c.beginPath();
      const n = 7;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU;
        const r = sx * (0.62 + hash1(i + 4) * 0.34);
        const px = Math.cos(a) * r, py = Math.sin(a) * r * 0.72;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.fill();
      c.fillStyle = 'rgba(236, 204, 155, .55)';
      c.beginPath(); c.ellipse(-sx * 0.16, -sy * 0.22, sx * 0.30, sy * 0.17, -0.3, 0, TAU); c.fill();
      c.fillStyle = 'rgba(83, 53, 28, .5)';
      c.beginPath(); c.arc(sx * 0.18, sy * 0.08, 0.8, 0, TAU); c.fill();
      c.beginPath(); c.arc(-sx * 0.08, sy * 0.26, 0.6, 0, TAU); c.fill();
    } else if (type === 'seed') {
      c.fillStyle = '#3f2a17';
      c.beginPath(); c.ellipse(0, 0, sx * 0.55, sy * 0.92, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(211, 179, 128, .62)';
      c.lineWidth = Math.max(0.5, sx * 0.12);
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        c.ellipse(0, 0, sx * (0.30 + Math.abs(i) * 0.07), sy * 0.90, 0, Math.PI * 0.1, Math.PI * 0.9);
        c.stroke();
      }
      c.fillStyle = 'rgba(244, 220, 175, .35)';
      c.beginPath(); c.ellipse(-sx * 0.22, -sy * 0.32, sx * 0.13, sy * 0.3, -0.2, 0, TAU); c.fill();
    } else if (type === 'leaf') {
      c.fillStyle = '#637b38';
      c.beginPath();
      c.moveTo(-sx * 0.8, 0);
      c.quadraticCurveTo(-sx * 0.2, -sy * 0.8, sx * 0.7, -sy * 0.18);
      c.quadraticCurveTo(sx * 0.2, sy * 0.66, -sx * 0.8, 0);
      c.fill();
      c.strokeStyle = 'rgba(183, 192, 112, .55)'; c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(-sx * 0.7, 0); c.lineTo(sx * 0.55, -sy * 0.12); c.stroke();
      c.strokeStyle = 'rgba(48, 66, 29, .4)'; c.lineWidth = 0.5;
      for (let i = -2; i <= 2; i++) {
        c.beginPath(); c.moveTo(i * sx * 0.22, 0); c.lineTo(i * sx * 0.22 + sx * 0.20, -sy * 0.26); c.stroke();
      }
    } else {
      const grad = c.createRadialGradient(-sx * 0.2, -sy * 0.25, 0, 0, 0, sx * 0.8);
      grad.addColorStop(0, 'rgba(255, 218, 143, .95)');
      grad.addColorStop(0.5, 'rgba(224, 158, 69, .88)');
      grad.addColorStop(1, 'rgba(154, 87, 31, .8)');
      c.fillStyle = grad;
      c.beginPath(); c.ellipse(0, 0, sx * 0.62, sy * 0.72, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255, 252, 235, .72)';
      c.beginPath(); c.ellipse(-sx * 0.18, -sy * 0.30, sx * 0.13, sy * 0.10, -0.4, 0, TAU); c.fill();
    }
    c.restore();
  }

  function drawForeground(c) {
    // Tufts of grass in front of the ants: filled, tapered blades.
    for (const tuft of blades) {
      const baseX = tuft.x * w;
      const baseY = groundAt(tuft.x) * h + 1;
      c.fillStyle = 'rgba(24, 31, 17, .35)';
      c.beginPath(); c.ellipse(baseX, baseY + 1, 12, 2.4, 0, 0, TAU); c.fill();
      for (const b of tuft.cluster) {
        const sway = Math.sin(time * b.speed + b.phase) * b.h * 0.11 + b.lean;
        const bx = baseX + b.offset;
        const tipX = bx + sway;
        const tipY = baseY - b.h;
        const ctrlX = bx + sway * 0.52;
        const ctrlY = baseY - b.h * 0.56;
        const half = b.width * 0.62;
        c.fillStyle = b.tone > 0.66 ? 'rgba(112, 127, 62, .60)'
          : b.tone > 0.34 ? 'rgba(81, 101, 49, .66)' : 'rgba(55, 74, 39, .70)';
        c.beginPath();
        c.moveTo(bx - half, baseY);
        c.quadraticCurveTo(ctrlX - half * 0.4, ctrlY, tipX, tipY);
        c.quadraticCurveTo(ctrlX + half * 0.7, ctrlY, bx + half, baseY);
        c.closePath();
        c.fill();
        c.strokeStyle = 'rgba(184, 184, 106, .16)';
        c.lineWidth = Math.max(0.4, b.width * 0.34);
        c.beginPath();
        c.moveTo(bx + half * 0.35, baseY - 1);
        c.quadraticCurveTo(ctrlX + half * 0.5, ctrlY, tipX + half * 0.3, tipY + 1.5);
        c.stroke();
      }
    }

    for (const f of foreground) {
      const x = f.x * w;
      const y = groundAt(f.x) * h;
      if (f.kind === 'mushroom') {
        const s = clamp(w * 0.005, 2.6, 6.5) * f.scale;
        const sway = Math.sin(time * 0.6 + f.x * 12) * 0.6;
        c.strokeStyle = 'rgba(222, 206, 174, .55)';
        c.lineWidth = 1.2 + s * 0.24;
        c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + sway, y - s * 2.4, x + sway * 1.4, y - s * 4.4); c.stroke();
        const cap = c.createRadialGradient(x + sway * 1.2 - s * 0.8, y - s * 5.2, 0, x + sway * 1.2, y - s * 4.5, s * 2.2);
        cap.addColorStop(0, 'rgba(233, 209, 164, .72)');
        cap.addColorStop(0.7, 'rgba(160, 121, 74, .55)');
        cap.addColorStop(1, 'rgba(95, 67, 37, .28)');
        c.fillStyle = cap;
        c.beginPath();
        c.ellipse(x + sway * 1.4, y - s * 4.6, s * 1.9, s * 0.8, 0, Math.PI, TAU);
        c.fill();
        c.fillStyle = 'rgba(250, 237, 206, .32)';
        c.beginPath(); c.ellipse(x + sway * 1.4 - s * 0.5, y - s * 4.9, s * 0.7, s * 0.2, -0.2, 0, TAU); c.fill();
      } else if (f.kind === 'fern') {
        const s = clamp(w * 0.010, 4, 11) * f.scale;
        const sway = Math.sin(time * 0.48 + 2) * 2.2;
        c.save();
        c.translate(x, y);
        c.strokeStyle = 'rgba(61, 84, 42, .78)';
        c.lineWidth = 1.2;
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(s * 3.5 + sway, -s * 6, s * 1.6 + sway, -s * 13);
        c.stroke();
        for (let i = 1; i <= 7; i++) {
          const t = i / 8;
          const px = s * (3.5 * t) * (1 - t) * 2 + s * 1.6 * t * t + sway * t;
          const py = -s * 13 * t;
          const len = s * (1.5 - t * 0.8);
          c.strokeStyle = 'rgba(77, 101, 48, .62)';
          c.lineWidth = 0.9;
          c.beginPath(); c.moveTo(px, py); c.lineTo(px - len, py - len * 0.35); c.stroke();
          c.beginPath(); c.moveTo(px, py); c.lineTo(px + len * 0.7, py - len * 0.55); c.stroke();
        }
        c.restore();
      } else if (f.kind === 'twig') {
        const s = clamp(w * 0.010, 4, 12) * f.scale;
        c.strokeStyle = 'rgba(54, 36, 21, .8)';
        c.lineWidth = 1.3;
        c.beginPath(); c.moveTo(x - s * 4, y + 1); c.quadraticCurveTo(x, y - s * 0.7, x + s * 4.5, y - s * 0.15); c.stroke();
        c.beginPath(); c.moveTo(x - s * 0.8, y - s * 0.2); c.lineTo(x - s * 2.2, y - s * 2.6); c.stroke();
        c.beginPath(); c.moveTo(x + s * 1.8, y - s * 0.2); c.lineTo(x + s * 3.0, y - s * 2.2); c.stroke();
      }
    }
  }

  function drawEntranceGlow(c) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const n of nodes) {
      if (n.chamber || !n.id.startsWith('gate')) continue;
      const x = n.x * w, y = n.y * h - 4;
      const r = Math.min(w, h) * (n.id === 'gate' ? 0.085 : 0.045);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      const a = n.id === 'gate' ? 0.11 : 0.045;
      g.addColorStop(0, `rgba(255, 204, 140, ${a})`);
      g.addColorStop(0.55, `rgba(255, 178, 102, ${a * 0.4})`);
      g.addColorStop(1, 'rgba(255, 170, 90, 0)');
      c.fillStyle = g;
      c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    c.restore();
  }

  function drawEntranceLip(c) {
    for (const n of nodes) {
      if (n.chamber || !n.id.startsWith('gate')) continue;
      const x = n.x * w, y = n.y * h;
      const rx = n.id === 'gate' ? 18.5 : 13.5;
      const ry = n.id === 'gate' ? 6.2 : 4.7;
      c.fillStyle = 'rgba(7, 4, 2, .55)';
      c.beginPath(); c.ellipse(x, y + 1, rx, ry, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(146, 97, 53, .24)';
      c.lineWidth = 1.1;
      c.beginPath(); c.ellipse(x, y + 0.5, rx + 1, ry + 0.6, 0, Math.PI * 0.1, Math.PI * 0.9); c.stroke();
    }
  }

  function drawMotes(c) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const m of motes) {
      const y = m.y * h;
      if (y > groundAt(m.x) * h - 2) continue;
      const a = m.alpha * (0.6 + 0.4 * Math.sin(time * 0.5 + m.phase));
      c.fillStyle = `rgba(255, 214, 158, ${a})`;
      c.beginPath(); c.arc(m.x * w, y, m.r, 0, TAU); c.fill();
    }
    c.restore();
  }

  function drawPointer(c) {
    if (!pointer.active) return;
    const gx = pointer.x;
    if (pointer.y * h > groundAt(gx) * h + 44) return;
    const x = gx * w;
    const y = groundAt(gx) * h - 26;
    c.save();
    c.strokeStyle = 'rgba(255, 216, 164, .34)';
    c.lineWidth = 1;
    c.setLineDash([3, 5]);
    c.beginPath(); c.arc(x, y, 12, 0, TAU); c.stroke();
    c.setLineDash([]);
    c.fillStyle = 'rgba(255, 216, 164, .45)';
    c.beginPath(); c.ellipse(x, y, 2.4, 3.4, 0.4, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255, 216, 164, .18)';
    c.beginPath(); c.moveTo(x, y + 13); c.lineTo(x, groundAt(gx) * h - 1); c.stroke();
    c.restore();
  }

  /* -------------------------------- HUD / persistence -------------------------------- */

  function pad3(n) { return String(Math.max(0, Math.round(n))).padStart(3, '0'); }
  function pad2(n) { return String(Math.max(0, Math.round(n))).padStart(2, '0'); }
  function roomCount() { return nodes.filter((n) => n.chamber && n.stage <= stage).length; }

  function refreshReadout() {
    if (!el.ants) return;
    if (document.body.classList.contains('hud-off')) return;
    el.ants.textContent = pad3(population);
    el.stored.textContent = pad3(stored);
    el.rooms.innerHTML = pad2(roomCount()) + '<em>/08</em>';
    el.stage.innerHTML = pad2(stage) + '<em>/06</em>';
    el.live.textContent = STAGE_NAMES[stage];
    el.panelStats.textContent = `工蚁 ${population} · 储粮 ${stored} · 阶段 ${stage}/6`;
    el.nextStage.textContent = stage < 6
      ? `距「${STAGE_NAMES[stage + 1]}」还需 ${Math.max(0, NEED[stage + 1] - delivered)}`
      : '蚁园已发展至最深一层';
  }

  function showToast(text) {
    if (!el.toast) return;
    el.toast.textContent = text;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 3600);
  }

  function serialize() {
    return {
      v: 1, seed, stage, delivered, stored, population, born,
      savedAt: Date.now(),
    };
  }

  function saveState() {
    if (demo) return false;
    try {
      localStorage.setItem(KEY, JSON.stringify(serialize()));
      return true;
    } catch { return false; }
  }

  function resetGarden() {
    try { localStorage.removeItem(KEY); } catch { /* storage may be unavailable */ }
    demo = false;
    seed = 1 + Math.floor(Math.random() * 2147483645);
    simState = (seed ^ 0x9E3779B9) >>> 0;
    stage = 1;
    delivered = 0;
    stored = 0;
    population = 8;
    born = 0;
    digActive = false;
    digTime = 0;
    ants = [];
    foods = [];
    colonyReady = false;
    buildWorld();
    buildCaches();
    initColony();
    colonyReady = true;
    render();
    showToast('新的蚁园 · 第 1 层');
    saveState();
    refreshReadout();
  }

  function togglePause() {
    paused = !paused;
    syncPlayback();
  }

  function syncPlayback() {
    cancelAnimationFrame(raf);
    raf = 0;
    last = 0;
    accumulator = 0;
    if (el.pause) el.pause.textContent = paused ? '继续' : '暂停';
    if (!paused && !document.hidden) raf = requestAnimationFrame(frame);
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* some hosts do not expose fullscreen */ }
  }

  /* -------------------------------- loop & input -------------------------------- */

  function frame(now) {
    raf = 0;
    if (paused || document.hidden) { last = 0; return; }
    if (!last) last = now;
    accumulator += Math.min((now - last) / 1000, 0.1);
    last = now;
    if (accumulator >= 1 / 30) {
      const dt = Math.min(accumulator, 0.1);
      accumulator = 0;
      const steps = Math.ceil(dt / (1 / 60));
      for (let i = 0; i < steps; i++) update(dt / steps);
      render();
    }
    raf = requestAnimationFrame(frame);
  }

  function resize() {
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 1.5, Math.max(0.5, Math.sqrt(2600000 / (w * h))));
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildWorld();
    buildCaches();

    if (!colonyReady) {
      initColony();
      colonyReady = true;
    } else {
      // Moving an ant between tunnel graphs mid-walk is more jarring than a
      // brief return to the surface.
      const baseSize = clamp(Math.min(w * 0.030, h * 0.028), 14, 44);
      for (const a of ants) {
        a.size = baseSize * (a.sizeFactor || 1);
        if (a.mode === 'underground') {
          a.mode = 'surface';
          a.node = 'gate';
          a.path = null;
          a.pathIndex = 0;
          a.x = clamp(gate.x + (simRandom() - 0.5) * 0.07, 0.03, 0.97);
          a.y = groundAt(a.x);
          a.state = a.carrying ? 'carry' : 'forage';
          a.moveDir = simRandom() < 0.5 ? -1 : 1;
          a.face = a.moveDir > 0 ? 0 : Math.PI;
        } else {
          a.x = clamp(a.x, 0.018, 0.982);
          a.y = groundAt(a.x);
        }
      }
      for (const f of foods) {
        if (f.landed) f.y = groundAt(f.x);
      }
    }
    refreshReadout();
    render();
  }

  function onPointerMove(e) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    pointer.y = clamp((e.clientY - rect.top) / rect.height, 0, 1);
    pointer.active = true;
    const above = pointer.y * h < groundAt(pointer.x) * h + 46;
    canvas.style.cursor = above ? 'crosshair' : 'default';
    if (paused) render();
  }

  function onPointerLeave() {
    pointer.active = false;
    canvas.style.cursor = 'default';
    if (paused) render();
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const rect = canvas.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0.05, 0.95);
    const y = (e.clientY - rect.top) / rect.height;
    if (y > groundAt(x) + 0.055) return;
    const food = dropFood(x);
    if (!food) showToast('地表已经有足够的食物');
    if (paused) render();
  }

  function toggleHud() {
    const off = document.body.classList.toggle('hud-off');
    if (!off) {
      document.body.classList.remove('quiet');
      scheduleQuiet();
      refreshReadout();
    }
    el.settings.setAttribute('aria-expanded', String(!el.panel.hidden));
  }

  function scheduleQuiet() {
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => {
      if (!document.body.classList.contains('hud-off')) document.body.classList.add('quiet');
    }, 16000);
  }

  function armReset() {
    if (!el.reset.classList.contains('armed')) {
      el.reset.classList.add('armed');
      el.reset.textContent = '确认重来？';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        el.reset.classList.remove('armed');
        el.reset.textContent = '重新开始';
      }, 3200);
      return;
    }
    clearTimeout(resetTimer);
    el.reset.classList.remove('armed');
    el.reset.textContent = '重新开始';
    resetGarden();
  }

  /* -------------------------------- boot -------------------------------- */

  function installEvents() {
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerleave', onPointerLeave);
    canvas.addEventListener('pointerdown', onPointerDown);

    el.settings.addEventListener('click', () => {
      const open = el.panel.hidden;
      el.panel.hidden = !open;
      el.settings.setAttribute('aria-expanded', String(open));
    });
    el.pause.addEventListener('click', togglePause);
    document.getElementById('feed').addEventListener('click', () => {
      const food = dropFood(0.14 + simRandom() * 0.72);
      if (paused) render();
      showToast(food ? '投下了一份食物' : '地表已经有足够的食物');
    });
    document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
    el.reset.addEventListener('click', armReset);
    el.auto.checked = autoFeed;
    el.auto.addEventListener('change', () => {
      autoFeed = el.auto.checked;
      if (autoFeed) autoTimer = Math.min(autoTimer, 6);
    });
    el.phero.checked = showPhero;
    el.phero.addEventListener('change', () => {
      showPhero = el.phero.checked;
      if (paused) render();
    });

    addEventListener('keydown', (e) => {
      if (e.target && e.target.matches && e.target.matches('input, select, button')) return;
      if (e.repeat) return;
      if (e.code === 'Space') { e.preventDefault(); togglePause(); }
      else if (e.key && e.key.toLowerCase() === 'h') toggleHud();
      else if (e.key && e.key.toLowerCase() === 'f') toggleFullscreen();
    });

    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        saveState();
        syncPlayback();
      } else {
        last = 0;
        syncPlayback();
        if (paused) render();
      }
    });
    addEventListener('pagehide', saveState);
    reducedMotion.addEventListener('change', (e) => {
      if (stillParam === null) {
        paused = e.matches;
        syncPlayback();
        render();
      }
    });
    if (q.get('hud') === '0') document.body.classList.add('hud-off');
    scheduleQuiet();
  }

  function installDebugApi() {
    window.__lumenAnt = {
      snapshot: () => ({
        seed, stage, delivered, stored, population, born,
        ants: ants.length,
        surface: ants.filter((a) => a.mode === 'surface').length,
        underground: ants.filter((a) => a.mode === 'underground').length,
        foods: foods.filter((f) => f.amount > 0 && !f.dead).length,
        carrying: ants.filter((a) => !!a.carrying).length,
        scentPeak: scent.reduce((m, v) => Math.max(m, v), 0),
        digActive, digTime, paused, rooms: roomCount(), w, h, dpr, demo, frames,
        autoFeed, showPhero,
        stageName: STAGE_NAMES[stage],
        sample: ants.slice(0, 3).map((a) => ({
          size: Math.round(a.size * 10) / 10,
          x: Math.round(a.x * 1000) / 1000,
          y: Math.round(a.y * 1000) / 1000,
          mode: a.mode, fade: Math.round((a.fade || 0) * 100) / 100,
        })),
      }),
      feed: (x, kind) => { const f = dropFood(clamp(x, 0.05, 0.95), kind); return f ? f.id : 0; },
      advance: (seconds) => {
        const n = Math.max(1, Math.round(seconds * 30));
        for (let i = 0; i < n; i++) update(1 / 30);
        render();
        return window.__lumenAnt.snapshot();
      },
      render,
      save: saveState,
      reset: resetGarden,
      groundAt: (x) => groundAt(clamp(x, 0, 1)),
      setAuto: (v) => { autoFeed = !!v; el.auto.checked = autoFeed; },
      setPhero: (v) => { showPhero = !!v; el.phero.checked = showPhero; render(); },
      audit: () => ({
        population, ants: ants.length, foods: foods.length,
        delivered, stored, stage, digActive, digTime, paused, frames,
        rooms: roomCount(), populationCap: POP_CAP[stage],
        badAnts: ants.reduce((n, a) => n + (
          !Number.isFinite(a.x + a.y + a.size + a.face) || a.x < 0 || a.x > 1 || a.y < 0 || a.y > 1 ? 1 : 0
        ), 0),
        badFoods: foods.reduce((n, f) => n + (
          !Number.isFinite(f.x + f.y + f.amount) || f.x < 0 || f.x > 1 || f.y < -0.2 || f.y > 1 || f.amount < 0 ? 1 : 0
        ), 0),
        scentPeak: scent.reduce((m, v) => Math.max(m, v), 0),
        scentMin: scent.reduce((m, v) => Math.min(m, v), 0),
        maxAntSize: ants.reduce((m, a) => Math.max(m, a.size), 0),
      }),
      togglePause,
    };
  }

  installEvents();
  resize();
  if (warm > 0) {
    const steps = Math.round(warm * 30);
    for (let i = 0; i < steps; i++) update(1 / 30);
    booting = false;
    render();
  } else {
    booting = false;
  }
  refreshReadout();
  syncPlayback();
  installDebugApi();
})();
</script>
</body>
</html>
