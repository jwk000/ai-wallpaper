<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="theme-color" content="#d8cbb8">
<title>午后 · 与真实太阳同步</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #c9a15b;
    --pad: clamp(20px, 3.2vw, 54px);
    --sans: "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --serif: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --ink: #2a2118;
    --muted: rgba(42, 33, 24, .76);
    --faint: rgba(42, 33, 24, .64);
    --line: rgba(201, 161, 91, .55);
    --halo: rgba(255, 252, 244, .42);
    --panel: rgba(249, 244, 234, .93);
    --panel-border: rgba(80, 66, 50, .16);
    --panel-ink: #3a3128;
    --panel-muted: rgba(58, 49, 40, .66);
  }
  body.dim {
    --ink: #eee5d6;
    --muted: rgba(238, 229, 214, .68);
    --faint: rgba(238, 229, 214, .38);
    --halo: rgba(6, 9, 16, .55);
    --panel: rgba(18, 22, 34, .94);
    --panel-border: rgba(201, 161, 91, .22);
    --panel-ink: #efe6d6;
    --panel-muted: rgba(239, 230, 214, .58);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d1018; }
  body {
    position: fixed; inset: 0; font-family: var(--sans); color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
    cursor: default;
  }
  #scene { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .hud button, .hud input, .hud label, .hud .controls, .hud #panel { pointer-events: auto; }

  .masthead {
    position: absolute; left: var(--pad); top: calc(var(--pad) - 6px);
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .28em; color: var(--muted);
    text-shadow: 0 1px 0 var(--halo); transition: opacity 1.2s;
  }
  .mark { width: 12px; height: 12px; border: 1px solid var(--line); border-radius: 50%; position: relative; flex: none; }
  .mark::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--accent); opacity: .85; }
  .brand { color: var(--ink); letter-spacing: .34em; }
  .rule { width: 26px; height: 1px; background: var(--line); }
  .collection { color: var(--muted); letter-spacing: .22em; }
  .index { color: var(--ink); opacity: .55; border: 1px solid var(--line); border-radius: 3px; padding: 2px 5px; letter-spacing: .10em; }

  .live {
    position: absolute; right: var(--pad); top: calc(var(--pad) - 6px); text-align: right;
    font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--faint);
    display: flex; align-items: center; gap: 8px; transition: opacity 1.6s;
    text-shadow: 0 1px 0 var(--halo);
  }
  .live .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 9px rgba(201, 161, 91, .8); animation: breathe 6.4s ease-in-out infinite; }
  .live b { color: var(--ink); font-weight: 400; letter-spacing: .12em; opacity: .82; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .caption { position: absolute; left: 33%; top: 13%; width: min(360px, 26vw); transition: opacity 2.2s ease; }
  .kicker { margin: 0; font-family: var(--mono); font-size: 9px; letter-spacing: .26em; color: var(--muted); }
  h1 {
    margin: 13px 0 10px; font-family: var(--serif); font-weight: 400;
    font-size: clamp(30px, 3.3vw, 50px); line-height: 1.1; letter-spacing: .30em;
    color: var(--ink); text-shadow: 0 1px 0 var(--halo);
  }
  .caption .sub { margin: 0; font-size: 12px; line-height: 1.95; letter-spacing: .08em; color: var(--muted); }
  .measure { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
  .measure .line { width: 34px; height: 1px; background: var(--line); flex: none; }
  .measure span { font-family: var(--mono); font-size: 9px; letter-spacing: .10em; color: var(--faint); }

  .readout {
    position: absolute; left: var(--pad); bottom: var(--pad);
    display: flex; gap: clamp(16px, 2.3vw, 38px); transition: opacity 1.6s;
    text-shadow: 0 1px 0 var(--halo);
  }
  .readout div { display: flex; flex-direction: column; gap: 6px; }
  .readout span { font-family: var(--mono); font-size: 8px; letter-spacing: .15em; color: var(--faint); }
  .readout b { font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: .06em; color: var(--ink); opacity: .92; }

  .controls {
    position: absolute; right: var(--pad); bottom: var(--pad);
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    opacity: .34; transition: opacity .35s;
  }
  .controls:hover, .controls:focus-within, .controls:has([aria-expanded="true"]) { opacity: 1; }
  button {
    font: inherit; cursor: pointer; color: var(--panel-ink);
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 7px; padding: 9px 13px; font-size: 10.5px; letter-spacing: .14em;
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    transition: border-color .25s, background .25s, color .25s;
  }
  button:hover { border-color: rgba(201, 161, 91, .72); }
  button:focus-visible, input:focus-visible { outline: 2px solid rgba(201, 161, 91, .9); outline-offset: 4px; }
  #panel {
    width: 272px; max-height: calc(100vh - 100px); overflow: auto; padding: 17px; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 11px;
    border: 1px solid var(--panel-border); border-radius: 11px;
    background: var(--panel); box-shadow: 0 20px 60px rgba(30, 22, 12, .30);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: var(--panel-ink);
  }
  #panel[hidden] { display: none; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 1px; }
  .panel-head b { font-family: var(--serif); font-weight: 400; font-size: 13px; letter-spacing: .18em; }
  .panel-head span { font-family: var(--mono); font-size: 7px; letter-spacing: .10em; color: var(--panel-muted); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 11px; letter-spacing: .07em; color: var(--panel-muted); }
  .switch input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
  .panel .tips { margin: 1px 0 0; font-size: 8.5px; line-height: 1.95; letter-spacing: .05em; color: var(--panel-muted); }
  .panel .tips b { color: var(--panel-ink); font-weight: 400; }
  .sky-table { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-family: var(--mono); font-size: 8px; letter-spacing: .06em; color: var(--panel-muted); }
  .sky-table b { color: var(--panel-ink); font-weight: 400; text-align: right; }

  .toast {
    position: absolute; left: 50%; bottom: 11%; transform: translate(-50%, 12px);
    padding: 8px 15px; border: 1px solid var(--panel-border); border-radius: 999px;
    background: var(--panel); color: var(--panel-ink);
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .14em;
    opacity: 0; transition: opacity .7s, transform .7s; pointer-events: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  body.quiet .caption, body.quiet .masthead, body.quiet .readout { opacity: 0; }
  body.quiet .live { opacity: .2; }
  body.hud-off .masthead, body.hud-off .caption, body.hud-off .readout,
  body.hud-off .live, body.hud-off .toast, body.hud-off .controls { display: none; }

  @media (max-width: 900px) {
    .caption { left: auto; right: var(--pad); top: 20%; width: min(330px, 42vw); text-align: right; }
  }
  @media (max-width: 760px), (max-height: 620px) {
    .readout, .live { display: none; }
    .caption { left: var(--pad); right: var(--pad); top: auto; bottom: 17%; width: auto; text-align: left; }
    h1 { font-size: clamp(25px, 7.6vw, 38px); letter-spacing: .22em; }
    .caption .sub { font-size: 10px; line-height: 1.9; }
    .measure { margin-top: 12px; }
    .collection, .masthead .rule, .index { display: none; }
    .controls { right: 16px; bottom: 16px; }
    .toast { bottom: 15%; }
  }
  @media (max-width: 420px) {
    .measure { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hud *, .toast { transition-duration: .01s !important; }
    .live .dot { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="一间极简的房间：一束带窗格形状的阳光落在木地板上，随窗外的真实太阳缓缓移动；尘埃在光里翻飞，日落后房间转蓝，台灯亮起"></canvas>

<div class="hud" id="hud">
  <header class="masthead">
    <span class="mark"></span>
    <span class="brand">LUMEN</span>
    <span class="rule"></span>
    <span class="collection">日光线</span>
    <span class="index">10</span>
  </header>

  <div class="live">
    <span class="dot"></span>
    <span id="livePhase">午后</span>
    <b id="liveClock">--:--</b>
  </div>

  <div class="caption">
    <p class="kicker">DAYLIGHT STUDY / SYNCHRONISED TO THE SUN</p>
    <h1>午后</h1>
    <p class="sub">一束光随窗外的真实太阳，在木地板上慢慢爬。<br>它知道现在几点。</p>
    <div class="measure"><span class="line"></span><span id="measureText">31.2°N · 本地时间</span></div>
  </div>

  <div class="readout">
    <div><span>本地时间</span><b id="statClock">--:--</b></div>
    <div><span>太阳高度</span><b id="statAlt">--</b></div>
    <div><span>方位角</span><b id="statAz">--</b></div>
    <div><span>光斑强度</span><b id="statPatch">--</b></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="controls">
    <div id="panel" hidden>
      <div class="panel-head"><b>日光设置</b><span id="panelDate">2026-11-11</span></div>
      <div class="row"><button id="pause">暂停</button><button id="fullscreen">全屏</button></div>
      <label class="switch"><span>台灯（自动 / 手动）</span><input id="lamp" type="checkbox"></label>
      <label class="switch"><span>指针拨动窗帘</span><input id="curtain" type="checkbox" checked></label>
      <p class="sky-table">
        <span>日出</span><b id="skyRise">--:--</b>
        <span>日落</span><b id="skySet">--:--</b>
        <span>日照</span><b id="skyLen">--</b>
        <span>相位</span><b id="skyPhase">--</b>
      </p>
      <p class="tips">指针划过拨动窗帘 · 点击开关台灯<br><b>Space</b> 暂停 · <b>H</b> 隐藏界面 · <b>F</b> 全屏<br>无输入时完全跟随真实时间，不做人工加速</p>
    </div>
    <button id="settings" aria-expanded="false" aria-controls="panel">日光设置</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  A room that keeps solar time.
   *
   *  Sun      NOAA-style solar position from the local clock, the time
   *           zone, the longitude and a latitude (31.2 N by default).
   *  Light    a window grid is projected through a fixed pinhole camera
   *           onto the floor plane; the resulting quads are the sun
   *           patch. No 3D, just a 2D shadow projection.
   *  Curtain  eight sine bands; the pointer bends them, which changes how
   *           much of the window is open, which changes the patch shape.
   *  Dust     two hundred motes, lit only where they cross the patch.
   *  Lamp     follows the sun unless someone clicks it.
   *
   *  One file, Canvas 2D, no images, fonts, audio or network.
   * ------------------------------------------------------------------ */

  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const DEFAULT_SEED = 20261111;

  const MAX_PIXELS = 2600000;
  const TARGET_FPS = 30;
  const FRAME_MS = 1000 / TARGET_FPS;

  const DUST_COUNT = 200;
  const BOKEH_COUNT = 5;
  const CURTAIN_BANDS = 8;
  const PANE_COLS = 3;
  const PANE_ROWS = 4;
  const PATCH_QUADS = PANE_COLS * PANE_ROWS;
  const PATCH_VERTS = (PANE_COLS + 1) * (PANE_ROWS + 1);

  const REACH_GAIN = 0.600;
  const WINDOW_AZ = 194.0 * DEG;
  const PATCH_ZMIN = 1.05;

  const DEFAULT_LAT = 31.2;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const fract = (v) => v - Math.floor(v);
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a || 1e-6), 0, 1);
    return t * t * (3 - 2 * t);
  };

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const hexToRgb = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const rgbCss = (c, a) => (a === undefined
    ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'
    : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + Math.max(0, Math.min(1, a)) + ')');
  const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const mixRgb = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

  /* -------------------------------- parameters -------------------------------- */

  const q = new URLSearchParams(location.search);
  const numberParam = (key, fallback, min, max) => {
    if (!q.has(key)) return fallback;
    const value = Number(q.get(key));
    return Number.isFinite(value) ? clamp(value, min, max) : fallback;
  };

  let seed = q.has('seed')
    ? Math.floor(numberParam('seed', DEFAULT_SEED, 1, 2147483646))
    : DEFAULT_SEED;
  const seedPinned = q.has('seed');

  const dateNow = new Date();
  const localYmd = (d) => (
    d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0')
  );
  const localSeconds = (d) => d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();

  let dayKey = q.has('day') && /^\d{4}-\d{2}-\d{2}$/.test(q.get('day')) ? q.get('day') : localYmd(dateNow);
  const dayPinned = q.has('day');
  let tOfDay = q.has('t')
    ? clamp(Number(q.get('t')) || 0, 0, 86399.9)
    : localSeconds(dateNow);
  const tPinned = q.has('t');

  const latDeg = numberParam('lat', DEFAULT_LAT, -66, 66);
  const tzEast = -dateNow.getTimezoneOffset() / 60;
  const lonDeg = numberParam('lon', tzEast * 15, -180, 180);

  const detail = numberParam('detail', 1, 0.5, 1);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const stillParam = q.has('still') ? q.get('still') !== '0' : null;
  let paused = stillParam !== null ? stillParam : reducedMotion.matches;
  let curtainEnabled = q.get('curtain') !== '0';
  const lampParam = q.get('lamp');

  /* -------------------------------- grade table -------------------------------- */

  const STOPS = [
    { h: -0.60, wall: '#161b28', floor: '#101219', light: '#2b3550', skyTop: '#05080f', skyBottom: '#0e1730', amb: 0.04 },
    { h: -0.20, wall: '#1c2333', floor: '#171a23', light: '#39476a', skyTop: '#070c18', skyBottom: '#16203a', amb: 0.09 },
    { h: -0.07, wall: '#3f4455', floor: '#2f2c33', light: '#7c6c86', skyTop: '#1b2742', skyBottom: '#4a4a70', amb: 0.22 },
    { h: -0.01, wall: '#8a7b74', floor: '#56402f', light: '#c98a5e', skyTop: '#3f5578', skyBottom: '#c98a66', amb: 0.40 },
    { h: 0.04, wall: '#b39781', floor: '#6e4c31', light: '#e8a860', skyTop: '#7d97b4', skyBottom: '#f0b070', amb: 0.58 },
    { h: 0.14, wall: '#cdb9a2', floor: '#7f5737', light: '#f0cf9e', skyTop: '#a8c1d4', skyBottom: '#f2dcb8', amb: 0.78 },
    { h: 0.32, wall: '#d8cbb8', floor: '#8a5f3c', light: '#f0dcc0', skyTop: '#c6dbe6', skyBottom: '#f0e8d6', amb: 0.92 },
    { h: 0.58, wall: '#d8cbb8', floor: '#8a5f3c', light: '#f2e6d0', skyTop: '#cfe4ef', skyBottom: '#f4f2ec', amb: 1.00 },
    { h: 1.00, wall: '#dbcfbd', floor: '#8d6340', light: '#f4ead8', skyTop: '#d2e6f2', skyBottom: '#f6f6f2', amb: 1.03 },
  ].map((s) => ({
    h: s.h,
    wall: hexToRgb(s.wall),
    floor: hexToRgb(s.floor),
    light: hexToRgb(s.light),
    skyTop: hexToRgb(s.skyTop),
    skyBottom: hexToRgb(s.skyBottom),
    amb: s.amb,
  }));

  const grade = {
    wall: [216, 203, 184],
    floor: [138, 95, 60],
    light: [242, 230, 208],
    skyTop: [207, 228, 239],
    skyBottom: [244, 242, 236],
    amb: 1,
    warmth: 0,
    dim: false,
  };

  function gradeAt(sinAlt) {
    let i = 0;
    while (i < STOPS.length - 2 && sinAlt > STOPS[i + 1].h) i++;
    const a = STOPS[i];
    const b = STOPS[i + 1];
    const raw = clamp((sinAlt - a.h) / (b.h - a.h || 1e-6), 0, 1);
    const t = raw * raw * (3 - 2 * raw);
    grade.wall = mixRgb(a.wall, b.wall, t);
    grade.floor = mixRgb(a.floor, b.floor, t);
    grade.light = mixRgb(a.light, b.light, t);
    grade.skyTop = mixRgb(a.skyTop, b.skyTop, t);
    grade.skyBottom = mixRgb(a.skyBottom, b.skyBottom, t);
    grade.amb = lerp(a.amb, b.amb, t);
    grade.warmth = smoothstep(-0.02, 0.05, sinAlt) * (1 - smoothstep(0.05, 0.34, sinAlt));
    grade.dim = grade.amb < 0.5;
  }

  /* -------------------------------- solar geometry -------------------------------- */

  function computeDoy(key) {
    const [y, m, d] = key.split('-').map(Number);
    return (Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 86400000 + 1;
  }
  let dayOfYear = computeDoy(dayKey);

  const solar = { alt: 0, az: 0, decl: 0, sinAlt: 0, rise: 6, set: 18, length: 12, ha: 0, eqtime: 0 };

  function solarAt(seconds) {
    const hour = seconds / 3600;
    const g = (TAU / 365) * (dayOfYear - 1 + (hour - 12) / 24);
    const cg = Math.cos(g);
    const sg = Math.sin(g);
    const c2 = Math.cos(2 * g);
    const s2 = Math.sin(2 * g);
    const c3 = Math.cos(3 * g);
    const s3 = Math.sin(3 * g);

    const eqtime = 229.18 * (0.000075 + 0.001868 * cg - 0.032077 * sg - 0.014615 * c2 - 0.040849 * s2);
    const decl = 0.006918 - 0.399912 * cg + 0.070257 * sg - 0.006758 * c2 +
      0.000907 * s2 - 0.002697 * c3 + 0.00148 * s3;

    const tst = hour * 60 + eqtime + 4 * (lonDeg - 15 * tzEast);
    const ha = (tst / 4 - 180) * DEG;
    const latR = latDeg * DEG;
    const sinAlt = Math.sin(latR) * Math.sin(decl) + Math.cos(latR) * Math.cos(decl) * Math.cos(ha);
    solar.sinAlt = clamp(sinAlt, -1, 1);
    solar.alt = Math.asin(solar.sinAlt);
    solar.decl = decl;
    solar.ha = ha;
    solar.eqtime = eqtime;

    const cosAlt = Math.max(1e-4, Math.cos(solar.alt));
    let az = Math.acos(clamp(
      (Math.sin(decl) - Math.sin(latR) * solar.sinAlt) / (Math.cos(latR) * cosAlt),
      -1, 1,
    ));
    if (ha > 0) az = TAU - az;
    solar.az = az;

    const cosH0 = -Math.tan(latR) * Math.tan(decl);
    if (cosH0 <= -1) {
      solar.rise = 0;
      solar.set = 24;
      solar.length = 24;
    } else if (cosH0 >= 1) {
      solar.rise = 12;
      solar.set = 12;
      solar.length = 0;
    } else {
      const h0 = Math.acos(cosH0) / DEG;
      const noon = 720 - (eqtime + 4 * (lonDeg - 15 * tzEast));
      solar.rise = (noon - h0 * 4) / 60;
      solar.set = (noon + h0 * 4) / 60;
      solar.length = (h0 * 8) / 60;
    }
    return solar;
  }

  function phaseName() {
    const a = solar.alt / DEG;
    if (a < -8) return '夜';
    if (a < -1) return '蓝调';
    if (a < 7) return solar.ha < 0 ? '日出' : '日落';
    if (a < 18) return solar.ha < 0 ? '晨光' : '傍晚';
    if (a < 32) return solar.ha < 0 ? '上午' : '午后';
    return '正午';
  }

  /* -------------------------------- runtime state -------------------------------- */

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const tex = document.createElement('canvas');
  const texCtx = tex.getContext('2d');
  const vig = document.createElement('canvas');
  const vigCtx = vig.getContext('2d');
  const pbuf = document.createElement('canvas');
  const pbx = pbuf.getContext('2d');
  const psoft = document.createElement('canvas');
  const psx = psoft.getContext('2d');
  const bokehSprite = document.createElement('canvas');

  const el = {
    body: document.body,
    settings: document.getElementById('settings'),
    panel: document.getElementById('panel'),
    pause: document.getElementById('pause'),
    lamp: document.getElementById('lamp'),
    curtain: document.getElementById('curtain'),
    toast: document.getElementById('toast'),
    statClock: document.getElementById('statClock'),
    statAlt: document.getElementById('statAlt'),
    statAz: document.getElementById('statAz'),
    statPatch: document.getElementById('statPatch'),
    liveClock: document.getElementById('liveClock'),
    livePhase: document.getElementById('livePhase'),
    measureText: document.getElementById('measureText'),
    panelDate: document.getElementById('panelDate'),
    skyRise: document.getElementById('skyRise'),
    skySet: document.getElementById('skySet'),
    skyLen: document.getElementById('skyLen'),
    skyPhase: document.getElementById('skyPhase'),
  };

  let w = 0, h = 0, dpr = 1, frames = 0;
  let raf = 0, last = 0, hudClock = 0, quietTimer = 0, toastTimer = 0, armedTimer = 0;

  let lampAuto = lampParam === null || lampParam === 'auto';
  let lampOn = lampParam === '1' || lampParam === 'on';
  let lampLevel = lampOn ? 1 : 0;

  let curtainPush = 0;
  let curtainPushX = 0.12;

  const cam = {
    mode: 'landscape', cx: 0, cy: 0, f: 1200, E: 0.95, Zw: 4.6, pitch: 0,
    sinT: 0, cosT: 1, panX: 0, wallBaseY: 0, horizonY: 0, zcWall: 4.6,
  };
  const WIN = { cx: -1.62, w: 1.0, h0: 0.55, h1: 1.43, Z: 4.6 };
  const win = { x0: 0, y0: 0, x1: 0, y1: 0, cx: 0, cy: 0, w: 0, h: 0 };
  const cur = { x0: 0, x1: 0, y0: 0, y1: 0, top: 0, bottom: 0 };
  const furnish = { c: null };

  const verts = Array.from({ length: PATCH_VERTS }, () => ({ x: 0, y: 0 }));
  const patch = {
    intensity: 0, x0: 0, y0: 0, x1: 0, y1: 0, cx: 0, cy: 0,
    phi: 0, reach: 0, zMid: 0, onFloor: false, lit: 0,
  };

  const dust = [];
  const bokeh = [];
  const bands = [];

  /* -------------------------------- camera & layout -------------------------------- */

  function makeCamera(width, height) {
    const ratio = width / height;
    if (ratio <= 0.85) {
      // Portrait: the camera turns towards the window, takes in a taller
      // slice and a wider angle, so the opening sits along the top and the
      // patch still crosses the floor below it.
      const pitch = 12.0 * DEG;
      return {
        mode: 'portrait',
        cx: width * 0.5,
        cy: height * 0.5,
        f: height * 0.98,
        E: 0.95,
        Zw: WIN.Z,
        pitch,
        sinT: Math.sin(pitch),
        cosT: Math.cos(pitch),
        panX: -0.86,
      };
    }
    const pitch = 8.3 * DEG;
    return {
      mode: ratio >= 1.9 ? 'ultrawide' : 'landscape',
      cx: width * 0.5,
      cy: height * 0.5,
      f: height * 1.6880,
      E: 0.95,
      Zw: WIN.Z,
      pitch,
      sinT: Math.sin(pitch),
      cosT: Math.cos(pitch),
      panX: 0,
    };
  }

  function project(X, Yw, Z, out) {
    out = out || {};
    const yr = Yw - cam.E;
    const zc = Z * cam.cosT - yr * cam.sinT;
    const yc = yr * cam.cosT + Z * cam.sinT;
    out.x = cam.cx + (cam.f * (X - cam.panX)) / zc;
    out.y = cam.cy - (cam.f * yc) / zc;
    return out;
  }

  const tmpP = { x: 0, y: 0 };

  function unprojectFloor(sx, sy) {
    const u = (sx - cam.cx) / cam.f;
    const v = (cam.cy - sy) / cam.f;
    const den = cam.sinT - v * cam.cosT;
    if (den <= 0.0015) return null;
    const s = cam.E / den;
    return {
      X: cam.panX + u * s,
      Z: s * (v * cam.sinT + cam.cosT),
    };
  }

  function applyLayout() {
    Object.assign(cam, makeCamera(w, h));
    cam.zcWall = WIN.Z * cam.cosT + cam.E * cam.sinT;

    const tl = project(WIN.cx - WIN.w / 2, WIN.h1, WIN.Z, {});
    const br = project(WIN.cx + WIN.w / 2, WIN.h0, WIN.Z, {});
    win.x0 = Math.min(tl.x, br.x);
    win.y0 = Math.min(tl.y, br.y);
    win.x1 = Math.max(tl.x, br.x);
    win.y1 = Math.max(tl.y, br.y);
    win.w = win.x1 - win.x0;
    win.h = win.y1 - win.y0;
    win.cx = (win.x0 + win.x1) / 2;
    win.cy = (win.y0 + win.y1) / 2;

    const base = project(0, 0, WIN.Z, {});
    cam.wallBaseY = base.y;
    cam.horizonY = cam.cy - cam.f * Math.tan(cam.pitch);

    const cw = clamp(w * (cam.mode === 'portrait' ? 0.20 : 0.155), 34, w * 0.42);
    cur.x0 = -w * 0.05;
    cur.x1 = cur.x0 + cw;
    cur.top = -h * 0.02;
    cur.bottom = Math.min(h * 1.02, cam.wallBaseY + h * 0.30);
    cur.y0 = cur.top;
    cur.y1 = cur.bottom;

    // A low console and a lamp, placed in world space so their perspective
    // matches the room instead of being pasted onto the frame.
    const bX0 = 0.58, bX1 = 1.42, bZn = 3.62, bZf = 4.42, bH = 0.46;
    furnish.c = {
      nearL: project(bX0, bH, bZn, {}),
      nearR: project(bX1, bH, bZn, {}),
      farR: project(bX1, bH, bZf, {}),
      farL: project(bX0, bH, bZf, {}),
      footL: project(bX0, 0, bZn, {}),
      footR: project(bX1, 0, bZn, {}),
      farFootL: project(bX0, 0, bZf, {}),
      farFootR: project(bX1, 0, bZf, {}),
      lampBase: project(0.86, bH, 3.95, {}),
      lampWL: project(0.76, 0.92, 3.95, {}),
      lampWR: project(0.96, 0.92, 3.95, {}),
      lampBL: project(0.71, 0.62, 3.95, {}),
      lampBR: project(1.01, 0.62, 3.95, {}),
      lampMid: project(0.86, 0.78, 3.95, {}),
    };
  }

  /* -------------------------------- dust -------------------------------- */

  // Seed the motes by walking the patch's own path across the day: each one
  // picks an hour, the patch is computed for that hour, and the mote lands
  // inside it. The density therefore follows the light instead of the room.
  function buildDust() {
    const r = mulberry32((seed ^ 0x3a17c9e1) >>> 0);
    const savedT = tOfDay;
    dust.length = 0;
    for (let i = 0; i < DUST_COUNT; i++) {
      const inBeam = i < Math.round(DUST_COUNT * 0.82);
      let u = r();
      let v = 0.04 + r() * 0.93;
      if (inBeam) {
        const hh = 7.2 + r() * 10.4;
        tOfDay = hh * 3600;
        solarAt(tOfDay);
        gradeAt(solar.sinAlt);
        computePatch();
        if (patch.onFloor && patch.intensity > 0.06) {
          const padX = (patch.x1 - patch.x0) * 0.22;
          const padY = (patch.y1 - patch.y0) * 0.35;
          u = clamp((patch.x0 - padX + r() * (patch.x1 - patch.x0 + padX * 2)) / Math.max(1, w), 0.02, 0.98);
          v = clamp((patch.y0 - padY + r() * (patch.y1 - patch.y0 + padY * 2)) / Math.max(1, h), 0.03, 0.97);
        }
      }
      dust.push({
        u,
        v,
        r0: 0.62 + r() * 1.25,
        ax: 0.006 + r() * 0.020,
        ay: 0.004 + r() * 0.014,
        wx: 0.9 + r() * 2.2,
        wy: 0.7 + r() * 1.9,
        px: r() * TAU,
        py: r() * TAU,
        pw: r() * TAU,
        gain: 0.35 + r() * 0.65,
        x: 0,
        y: 0,
        lit: 0,
        alpha: 0,
      });
    }
    tOfDay = savedT;
    bokeh.length = 0;
    for (let i = 0; i < BOKEH_COUNT; i++) {
      bokeh.push({
        u: r(),
        v: 0.42 + r() * 0.58,
        r: 34 + r() * 84,
        gain: 0.26 + r() * 0.42,
        px: r() * TAU,
        py: r() * TAU,
        wx: 0.10 + r() * 0.20,
        wy: 0.08 + r() * 0.16,
        x: 0,
        y: 0,
      });
    }
  }

  function buildBands() {
    const r = mulberry32((seed ^ 0x77c1a3) >>> 0);
    bands.length = 0;
    for (let i = 0; i < CURTAIN_BANDS; i++) {
      bands.push({
        amp: 0.35 + r() * 0.75,
        k: 1.6 + r() * 2.4,
        phase: r() * TAU,
        w: 0.05 + r() * 0.11,
        drift: 0.25 + r() * 0.6,
        shade: 0.74 + r() * 0.34,
      });
    }
  }

  /* -------------------------------- texture bakes -------------------------------- */

  function bakeTexture() {
    const cw = canvas.width;
    const ch = canvas.height;
    tex.width = Math.max(1, cw);
    tex.height = Math.max(1, ch);
    texCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    texCtx.clearRect(0, 0, w, h);

    const rnd = mulberry32((seed ^ 0x5eed1a77) >>> 0);
    const baseY = cam.wallBaseY;

    // Plaster: a matte, slightly uneven wall.
    const plaster = Math.round(1500 * detail);
    for (let i = 0; i < plaster; i++) {
      const x = rnd() * w;
      const y = rnd() * Math.max(1, baseY);
      const rad = 0.5 + rnd() * 2.8;
      texCtx.fillStyle = rnd() < 0.52 ? 'rgba(96,80,62,0.030)' : 'rgba(255,250,240,0.034)';
      texCtx.beginPath();
      texCtx.arc(x, y, rad, 0, TAU);
      texCtx.fill();
    }
    // Large, slow mottling: limewash rather than a flat plane.
    for (let i = 0; i < 16; i++) {
      const x = rnd() * w;
      const y = rnd() * baseY;
      const rad = (0.08 + rnd() * 0.24) * w;
      const a = 0.010 + rnd() * 0.016;
      const g = texCtx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, rnd() < 0.5
        ? 'rgba(255,248,234,' + a.toFixed(3) + ')'
        : 'rgba(96,80,60,' + a.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      texCtx.fillStyle = g;
      texCtx.fillRect(0, 0, w, baseY);
    }



    // Floor: planks converge on the vanishing point.
    texCtx.save();
    texCtx.beginPath();
    texCtx.rect(0, baseY, w, h - baseY);
    texCtx.clip();

    const V = { x: cam.cx, y: cam.horizonY };
    const plankM = 0.235;
    const dxWall = (cam.f * plankM) / cam.zcWall;
    const span = Math.ceil(w / dxWall) + 3;
    const y0 = baseY;

    for (let k = -span; k <= span; k++) {
      const xWall = cam.cx + cam.f * ((k * plankM) - cam.panX) / cam.zcWall;
      const xBottom = V.x + (xWall - V.x) * ((h - V.y) / Math.max(1, y0 - V.y));
      const tone = rnd();

      // Each board keeps its own tone.
      const nWall = cam.cx + cam.f * (((k + 1) * plankM) - cam.panX) / cam.zcWall;
      const nBottom = V.x + (nWall - V.x) * ((h - V.y) / Math.max(1, y0 - V.y));
      const tint = rnd();
      texCtx.fillStyle = tint < 0.42
        ? 'rgba(255,232,196,' + (0.010 + tint * 0.048).toFixed(3) + ')'
        : 'rgba(56,32,16,' + (0.008 + (tint - 0.42) * 0.052).toFixed(3) + ')';
      texCtx.beginPath();
      texCtx.moveTo(xWall, y0);
      texCtx.lineTo(nWall, y0);
      texCtx.lineTo(nBottom, h);
      texCtx.lineTo(xBottom, h);
      texCtx.closePath();
      texCtx.fill();
      texCtx.strokeStyle = tone < 0.5 ? 'rgba(42,25,14,0.48)' : 'rgba(36,21,12,0.32)';
      texCtx.lineWidth = 0.9 + rnd() * 0.9;
      texCtx.beginPath();
      texCtx.moveTo(V.x, V.y);
      texCtx.lineTo(xBottom, h);
      texCtx.stroke();

      for (let s = 0; s < 5; s++) {
        const off = (rnd() - 0.5) * 0.72;
        const xw2 = cam.cx + cam.f * ((k + off) * plankM - cam.panX) / cam.zcWall;
        const xb2 = V.x + (xw2 - V.x) * ((h - V.y) / Math.max(1, y0 - V.y));
        texCtx.strokeStyle = rnd() < 0.5
          ? 'rgba(58,36,20,0.085)' : 'rgba(236,206,168,0.055)';
        texCtx.lineWidth = 0.6 + rnd() * 1.6;
        texCtx.beginPath();
        texCtx.moveTo(V.x + (xw2 - V.x) * 0.55, V.y + (y0 - V.y) * 0.55);
        texCtx.lineTo(xb2, h);
        texCtx.stroke();
      }
    }

    // Plank ends, a couple of joints deep in the floor.
    for (let i = 0; i < 4; i++) {
      const Zm = WIN.Z - 0.85 - i * 0.95;
      const yLine = project(0, 0, Zm, tmpP).y;
      if (yLine < baseY + 6 || yLine > h) continue;
      texCtx.strokeStyle = 'rgba(40,24,12,0.22)';
      texCtx.lineWidth = 0.9;
      texCtx.beginPath();
      texCtx.moveTo(0, yLine);
      texCtx.lineTo(w, yLine);
      texCtx.stroke();
    }
    texCtx.restore();

    // Baseboard: the wall/floor junction needs a line to read as architecture.
    const bb = Math.max(9, h * 0.019);
    const gb = texCtx.createLinearGradient(0, baseY - bb, 0, baseY);
    gb.addColorStop(0, 'rgba(255,248,236,0.055)');
    gb.addColorStop(0.35, 'rgba(58,42,26,0.10)');
    gb.addColorStop(1, 'rgba(30,20,12,0.20)');
    texCtx.fillStyle = gb;
    texCtx.fillRect(0, baseY - bb, w, bb);
    texCtx.fillStyle = 'rgba(24,16,9,0.26)';
    texCtx.fillRect(0, baseY - 1, w, 1.4);
    const gsh = texCtx.createLinearGradient(0, baseY + 1, 0, baseY + bb * 2.4);
    gsh.addColorStop(0, 'rgba(20,12,6,0.20)');
    gsh.addColorStop(1, 'rgba(20,12,6,0)');
    texCtx.fillStyle = gsh;
    texCtx.fillRect(0, baseY + 1, w, bb * 2.4);
  }

  function bakeVignette() {
    vig.width = Math.max(1, canvas.width);
    vig.height = Math.max(1, canvas.height);
    vigCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    vigCtx.clearRect(0, 0, w, h);
    const r = Math.hypot(w, h) * 0.62;
    const g = vigCtx.createRadialGradient(w * 0.46, h * 0.44, r * 0.36, w * 0.46, h * 0.44, r);
    g.addColorStop(0, 'rgba(18,12,6,0)');
    g.addColorStop(0.62, 'rgba(18,12,6,0.07)');
    g.addColorStop(1, 'rgba(14,9,4,0.30)');
    vigCtx.fillStyle = g;
    vigCtx.fillRect(0, 0, w, h);

    const g2 = vigCtx.createLinearGradient(0, 0, 0, h * 0.24);
    g2.addColorStop(0, 'rgba(10,8,6,0.16)');
    g2.addColorStop(1, 'rgba(10,8,6,0)');
    vigCtx.fillStyle = g2;
    vigCtx.fillRect(0, 0, w, h * 0.24);

    // Grain: the difference between a gradient and a photograph.
    const gr = mulberry32((seed ^ 0x6b21f5) >>> 0);
    const dots = Math.round(16000 * detail);
    for (let i = 0; i < dots; i++) {
      const x = gr() * w;
      const y = gr() * h;
      const s = 0.6 + gr() * 1.1;
      vigCtx.fillStyle = gr() < 0.5
        ? 'rgba(255,250,238,' + (0.012 + gr() * 0.020).toFixed(3) + ')'
        : 'rgba(28,20,12,' + (0.010 + gr() * 0.018).toFixed(3) + ')';
      vigCtx.fillRect(x, y, s, s);
    }
  }

  function bakeBokeh() {
    const size = 128;
    bokehSprite.width = size;
    bokehSprite.height = size;
    const b = bokehSprite.getContext('2d');
    b.clearRect(0, 0, size, size);
    const g = b.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, 'rgba(255,248,226,0.55)');
    g.addColorStop(0.45, 'rgba(255,238,198,0.22)');
    g.addColorStop(0.78, 'rgba(238,206,160,0.08)');
    g.addColorStop(1, 'rgba(220,180,130,0)');
    b.fillStyle = g;
    b.fillRect(0, 0, size, size);
  }

  /* -------------------------------- sun patch -------------------------------- */

  function computePatch() {
    const alt = solar.alt;
    const phi = clamp(solar.az - WINDOW_AZ, -1.32, 1.32);
    const tanA = Math.max(Math.tan(alt), 0.085);
    const cosPhi = Math.cos(phi);
    const sinPhi = Math.sin(phi);
    patch.phi = phi;

    const lit = alt > 0.014 && cosPhi > 0.10;
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;

    for (let j = 0; j <= PANE_ROWS; j++) {
      const fv = j / PANE_ROWS;
      const hgt = WIN.h0 + fv * (WIN.h1 - WIN.h0);
      const reach = (hgt / tanA) * REACH_GAIN;
      const Z = clamp(WIN.Z - reach * cosPhi, PATCH_ZMIN, WIN.Z - 0.28);
      for (let i = 0; i <= PANE_COLS; i++) {
        const fu = i / PANE_COLS;
        const X = WIN.cx + (fu - 0.5) * WIN.w + reach * sinPhi;
        const p = project(X, 0, Z, tmpP);
        const idx = j * (PANE_COLS + 1) + i;
        const v = verts[idx];
        v.x = Number.isFinite(p.x) ? p.x : 0;
        v.y = Number.isFinite(p.y) ? p.y : 0;
        if (v.x < minX) minX = v.x;
        if (v.y < minY) minY = v.y;
        if (v.x > maxX) maxX = v.x;
        if (v.y > maxY) maxY = v.y;
      }
    }

    patch.onFloor = lit;
    patch.x0 = minX;
    patch.y0 = minY;
    patch.x1 = maxX;
    patch.y1 = maxY;
    patch.cx = (minX + maxX) / 2;
    patch.cy = (minY + maxY) / 2;

    let intensity = 0;
    if (lit) {
      const base = smoothstep(0.014, 0.16, alt);
      const fade = 0.55 + 0.45 * smoothstep(0.20, 0.85, solar.sinAlt);
      const area = Math.max(1, (maxX - minX) * (maxY - minY));
      const inside = Math.max(0, Math.min(maxX, w) - Math.max(minX, 0)) *
        Math.max(0, Math.min(maxY, h) - Math.max(minY, 0));
      const vis = clamp(inside / area, 0, 1);
      intensity = base * fade * (0.22 + 0.78 * vis);
    }
    if (!Number.isFinite(intensity)) intensity = 0;
    patch.intensity = clamp(intensity, 0, 1.15);
    patch.lit = lit ? 1 : 0;

    const midH = (WIN.h0 + WIN.h1) / 2;
    patch.reach = (midH / tanA) * REACH_GAIN;
    patch.zMid = clamp(WIN.Z - patch.reach * cosPhi, PATCH_ZMIN, WIN.Z - 0.28);
  }

  // How strongly a screen point is lit by the patch (0-1, soft edges).
  function patchLightAt(sx, sy) {
    if (patch.intensity <= 0.004) return 0;
    const cosPhi = Math.cos(patch.phi);
    if (cosPhi <= 0.02) return 0;
    const p = unprojectFloor(sx, sy);
    if (!p) return 0;
    const reach = (WIN.Z - p.Z) / cosPhi;
    if (!(reach > 0)) return 0;
    const hgt = (reach * Math.max(Math.tan(solar.alt), 0.085)) / REACH_GAIN;
    const fv = (hgt - WIN.h0) / (WIN.h1 - WIN.h0);
    const fu = (p.X - WIN.cx - reach * Math.sin(patch.phi)) / WIN.w + 0.5;
    if (!(fu > -0.2 && fu < 1.2 && fv > -0.2 && fv < 1.2)) return 0;
    const inset = Math.min(fu, 1 - fu, fv, 1 - fv);
    return smoothstep(0, 0.12, inset);
  }

  /* -------------------------------- curtain -------------------------------- */

  function bandSway(i, tNorm, tau) {
    const b = bands[i];
    const edgeFade = 0.32 + 0.68 * tNorm;
    return b.amp * Math.sin(tNorm * b.k * 2.4 + b.phase + tau * b.w) * edgeFade * b.drift;
  }

  function curtainProfile(tNorm) {
    let sum = 0;
    for (let i = 0; i < CURTAIN_BANDS; i++) sum += bandSway(i, tNorm, tOfDay);
    const push = curtainPush * (curtainEnabled ? 1 : 0);
    const base = cur.x0 + (cur.x1 - cur.x0);
    const unit = Math.max(6, (cur.x1 - cur.x0) * 0.16);
    return base + sum * unit * 0.42 + push * w * 0.085;
  }

  function curtainCoverAt(px, py) {
    const tNorm = clamp((py - cur.y0) / Math.max(1, cur.y1 - cur.y0), 0, 1);
    const edge = curtainProfile(tNorm);
    const soft = Math.max(6, w * 0.012);
    return 1 - smoothstep(edge - soft, edge + soft, px);
  }

  // A pane's position inside the opening: the curtain hangs there, not on
  // the floor, so that is where it has to be sampled from.
  function paneWinX(i) { return win.x0 + (win.w * (i + 0.5)) / PANE_COLS; }
  function paneWinY(j) { return win.y0 + win.h * (1 - (j + 0.5) / PANE_ROWS); }

  /* -------------------------------- scene step -------------------------------- */

  function computeScene() {
    solarAt(tOfDay);
    gradeAt(solar.sinAlt);
    computePatch();

    const target = lampAuto
      ? (grade.amb < 0.42 ? 1 : 0)
      : (lampOn ? 1 : 0);
    lampOn = target > 0.5;
    if (paused) lampLevel = lampOn ? 1 : 0;

    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      const tau = tOfDay;
      d.x = d.u * w + Math.sin(tau / 41 + d.px) * d.ax * w + Math.sin(tau / 17 + d.px * 1.7) * d.ax * w * 0.35;
      d.y = d.v * h + Math.sin(tau / 33 + d.py) * d.ay * h + Math.sin(tau / 13 + d.py * 1.3) * d.ay * h * 0.3;
      d.lit = patchLightAt(d.x, d.y);
      const tw = 0.55 + 0.45 * Math.sin(tau / (11 + (i % 7) * 3) + d.pw);
      d.alpha = (0.055 + 0.945 * d.lit) * d.gain * tw;
      if (!Number.isFinite(d.alpha)) d.alpha = 0;
    }

    for (let i = 0; i < bokeh.length; i++) {
      const b = bokeh[i];
      b.x = b.u * w + Math.sin(tOfDay / (34 + i * 6) + b.px) * w * 0.010;
      b.y = b.v * h + Math.sin(tOfDay / (27 + i * 5) + b.py) * h * 0.008;
    }
  }

  /* -------------------------------- drawing -------------------------------- */

  function drawWall() {
    const baseY = cam.wallBaseY;
    const g = ctx.createLinearGradient(0, 0, 0, baseY);
    g.addColorStop(0, rgbCss(shade(grade.wall, 0.70)));
    g.addColorStop(0.46, rgbCss(shade(grade.wall, 0.88)));
    g.addColorStop(1, rgbCss(shade(grade.wall, 0.80)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, baseY + 2);

    // The opening washes the wall with light.
    const spill = (0.22 + 0.78 * clamp(grade.amb, 0, 1)) * (0.38 + 0.62 * clamp(Math.cos(patch.phi), 0, 1));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g2 = ctx.createRadialGradient(win.cx, win.cy, win.w * 0.10, win.cx, win.cy, Math.max(w, h) * 0.90);
    g2.addColorStop(0, rgbCss(grade.light, 0.46 * spill));
    g2.addColorStop(0.26, rgbCss(grade.light, 0.17 * spill));
    g2.addColorStop(1, rgbCss(grade.light, 0));
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, w, baseY + 2);
    ctx.restore();

    // Light leaves the window and dies away towards the far corner.
    const g3 = ctx.createLinearGradient(win.cx, win.cy, w * 1.04, baseY * 1.30);
    g3.addColorStop(0, 'rgba(26,21,30,0)');
    g3.addColorStop(0.38, 'rgba(26,21,30,0.10)');
    g3.addColorStop(0.72, 'rgba(22,18,26,0.20)');
    g3.addColorStop(1, 'rgba(18,14,22,0.30)');
    ctx.fillStyle = g3;
    ctx.fillRect(0, 0, w, baseY + 2);


  }

  function drawFloor() {
    const baseY = cam.wallBaseY;
    const g = ctx.createLinearGradient(0, baseY, 0, h);
    g.addColorStop(0, rgbCss(shade(grade.floor, 0.46)));
    g.addColorStop(0.26, rgbCss(shade(grade.floor, 0.74)));
    g.addColorStop(0.68, rgbCss(shade(grade.floor, 1.0)));
    g.addColorStop(1, rgbCss(shade(grade.floor, 1.10)));
    ctx.fillStyle = g;
    ctx.fillRect(0, baseY, w, h - baseY + 1);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const near = ctx.createLinearGradient(0, baseY, 0, baseY + h * 0.09);
    near.addColorStop(0, rgbCss(grade.light, 0.12 * grade.amb));
    near.addColorStop(1, rgbCss(grade.light, 0));
    ctx.fillStyle = near;
    ctx.fillRect(0, baseY, w, h * 0.09);
    ctx.restore();

    const gf = ctx.createLinearGradient(w * 0.45, 0, w * 1.04, 0);
    gf.addColorStop(0, 'rgba(22,16,26,0)');
    gf.addColorStop(0.60, 'rgba(22,16,26,0.10)');
    gf.addColorStop(1, 'rgba(16,11,18,0.26)');
    ctx.fillStyle = gf;
    ctx.fillRect(w * 0.40, baseY, w * 0.62, h - baseY);
  }

  function drawWindow() {
    const x0 = win.x0, y0 = win.y0, ww = win.w, hh = win.h;
    if (ww < 4 || hh < 4) return;

    const reveal = Math.max(6, Math.min(ww, hh) * 0.052);
    const rx = x0 - reveal, ry = y0 - reveal;
    const rw = ww + reveal * 2, rh = hh + reveal * 2;

    // Wall shadow just outside the opening.
    const sh = Math.max(16, Math.min(w, h) * 0.055);
    shadowRect(rx, ry - sh, rw, sh, 0, -sh);
    shadowRect(rx - sh, ry, sh, rh, -sh, 0);
    shadowRect(rx + rw, ry, sh, rh, sh, 0);
    shadowRect(rx, ry + rh, rw, sh, 0, sh);

    // Reveal: four bands, never a filled slab over the glass.
    const frameDark = mixRgb(shade(grade.wall, 0.52), [48, 40, 32], 0.45);
    ctx.fillStyle = rgbCss(shade(grade.wall, 0.56));
    ctx.fillRect(rx, ry, rw, reveal);
    ctx.fillRect(rx, ry + rh - reveal, rw, reveal);
    ctx.fillRect(rx, ry, reveal, rh);
    ctx.fillRect(rx + rw - reveal, ry, reveal, rh);

    // Glass.
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, y0, ww, hh);
    ctx.clip();

    const sky = ctx.createLinearGradient(0, y0, 0, y0 + hh);
    sky.addColorStop(0, rgbCss(grade.skyTop));
    sky.addColorStop(0.55, rgbCss(grade.skyBottom));
    sky.addColorStop(1, rgbCss(mixRgb(grade.skyBottom, [255, 247, 228], 0.40)));
    ctx.fillStyle = sky;
    ctx.fillRect(x0, y0, ww, hh);

    // Haze near the horizon line of the glass.
    const haze = ctx.createLinearGradient(0, y0 + hh * 0.62, 0, y0 + hh);
    haze.addColorStop(0, 'rgba(255,250,238,0)');
    haze.addColorStop(1, 'rgba(255,250,238,' + (0.30 + 0.24 * clamp(grade.amb, 0, 1)).toFixed(3) + ')');
    ctx.fillStyle = haze;
    ctx.fillRect(x0, y0 + hh * 0.62, ww, hh * 0.38);

    // The sun, only while it actually faces this opening.
    const phiDeg = Math.abs(patch.phi) / DEG;
    const altDeg = solar.alt / DEG;
    const sunVis = smoothstep(48, 12, phiDeg) * smoothstep(0.4, 4.0, altDeg);
    if (sunVis > 0.01) {
      const su = clamp(0.5 + (patch.phi / (56 * DEG)) * 0.46, -0.4, 1.4);
      const sv = clamp(1.05 - (altDeg / 70) * 0.98, -0.35, 1.25);
      const sx = x0 + ww * su;
      const sy = y0 + hh * sv;
      const rad = ww * 0.85;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad);
      g.addColorStop(0, 'rgba(255,255,250,' + (0.98 * sunVis).toFixed(3) + ')');
      g.addColorStop(0.09, 'rgba(255,250,232,' + (0.85 * sunVis).toFixed(3) + ')');
      g.addColorStop(0.30, 'rgba(255,234,190,' + (0.34 * sunVis).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,220,164,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.fillRect(x0, y0, ww, hh);
      ctx.restore();
    }
    ctx.restore();

    // Mullions over the glass.
    ctx.fillStyle = rgbCss(frameDark);
    const mw = Math.max(2.2, ww * 0.022);
    const mh = Math.max(2.2, hh * 0.026);
    for (let i = 1; i < PANE_COLS; i++) {
      ctx.fillRect(x0 + (ww * i) / PANE_COLS - mw / 2, y0, mw, hh);
    }
    for (let j = 1; j < PANE_ROWS; j++) {
      ctx.fillRect(x0, y0 + (hh * j) / PANE_ROWS - mh / 2, ww, mh);
    }
    ctx.fillRect(x0, y0, ww, mh * 0.5);
    ctx.fillRect(x0, y0 + hh - mh * 0.5, ww, mh * 0.5);
    ctx.fillRect(x0, y0, mw * 0.5, hh);
    ctx.fillRect(x0 + ww - mw * 0.5, y0, mw * 0.5, hh);

    // Light catching the reveal.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rl = 0.22 * clamp(grade.amb, 0, 1);
    ctx.fillStyle = rgbCss(grade.light, rl * 0.5);
    ctx.fillRect(rx, ry + rh, rw, Math.max(2, reveal * 0.6));
    ctx.restore();
  }

  // A short linear shade just outside the opening.
  function shadowRect(x, y, sw, shh, dx, dy) {
    const g = ctx.createLinearGradient(x, y, x + (dx || sw), y + (dy || shh));
    g.addColorStop(0, 'rgba(18,12,6,0)');
    g.addColorStop(1, 'rgba(18,12,6,0.22)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, sw, shh);
  }

  function drawBeam() {
    if (patch.intensity < 0.10) return;
    const nearA = verts[PANE_ROWS * (PANE_COLS + 1)];
    const nearB = verts[PANE_ROWS * (PANE_COLS + 1) + PANE_COLS];
    const farA = verts[0];
    const farB = verts[PANE_COLS];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(win.cx, win.y1, (nearA.x + farA.x) / 2, (nearA.y + farA.y) / 2);
    g.addColorStop(0, rgbCss(grade.light, 0.014 * patch.intensity));
    g.addColorStop(0.5, rgbCss(grade.light, 0.006 * patch.intensity));
    g.addColorStop(1, rgbCss(grade.light, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(win.x0, win.y1);
    ctx.lineTo(win.x1, win.y1);
    ctx.lineTo(farB.x, farB.y);
    ctx.lineTo(farA.x, farA.y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPatch() {
    if (patch.intensity < 0.006) return;
    const bw = pbuf.width;
    const bh = pbuf.height;
    if (!bw || !bh) return;
    const s = bw / Math.max(1, w);

    pbx.setTransform(1, 0, 0, 1, 0, 0);
    pbx.clearRect(0, 0, bw, bh);
    pbx.setTransform(s, 0, 0, s, 0, 0);

    for (let j = 0; j < PANE_ROWS; j++) {
      for (let i = 0; i < PANE_COLS; i++) {
        const a = verts[j * (PANE_COLS + 1) + i];
        const b = verts[j * (PANE_COLS + 1) + i + 1];
        const c = verts[(j + 1) * (PANE_COLS + 1) + i + 1];
        const d = verts[(j + 1) * (PANE_COLS + 1) + i];
        const mx = (a.x + b.x + c.x + d.x) / 4;
        const my = (a.y + b.y + c.y + d.y) / 4;
        const kx = 0.93, ky = 0.90;
        const cover = curtainCoverAt(paneWinX(i), paneWinY(j));
        if (cover < 0.02) continue;
        pbx.fillStyle = 'rgba(255,255,255,' + cover.toFixed(3) + ')';
        pbx.beginPath();
        pbx.moveTo(mx + (a.x - mx) * kx, my + (a.y - my) * ky);
        pbx.lineTo(mx + (b.x - mx) * kx, my + (b.y - my) * ky);
        pbx.lineTo(mx + (c.x - mx) * kx, my + (c.y - my) * ky);
        pbx.lineTo(mx + (d.x - mx) * kx, my + (d.y - my) * ky);
        pbx.closePath();
        pbx.fill();
      }
    }

    pbx.setTransform(1, 0, 0, 1, 0, 0);
    pbx.globalCompositeOperation = 'source-in';
    pbx.fillStyle = rgbCss(mixRgb(grade.light, [255, 252, 240], 0.45));
    pbx.fillRect(0, 0, bw, bh);
    pbx.globalCompositeOperation = 'source-over';

    psx.setTransform(1, 0, 0, 1, 0, 0);
    psx.clearRect(0, 0, bw, bh);
    psx.filter = 'blur(' + Math.max(0.9, bw * 0.0034).toFixed(2) + 'px)';
    psx.drawImage(pbuf, 0, 0);
    psx.filter = 'none';

    ctx.save();
    const spread = Math.max(patch.x1 - patch.x0, patch.y1 - patch.y0) * 1.25;
    const bloom = ctx.createRadialGradient(patch.cx, patch.cy, spread * 0.10, patch.cx, patch.cy, spread);
    bloom.addColorStop(0, rgbCss(grade.light, 0.16 * patch.intensity));
    bloom.addColorStop(0.55, rgbCss(grade.light, 0.05 * patch.intensity));
    bloom.addColorStop(1, rgbCss(grade.light, 0));
    ctx.fillStyle = bloom;
    ctx.fillRect(patch.cx - spread, patch.cy - spread, spread * 2, spread * 2);

    // A sunlit floor reads as a brighter surface, not just a glow on top of
    // one: lay the warm light down first, then add the hot core.
    ctx.globalAlpha = clamp(0.62 * patch.intensity, 0, 0.92);
    ctx.drawImage(psoft, 0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.50 * patch.intensity;
    ctx.drawImage(pbuf, 0, 0, w, h);
    ctx.restore();
  }

  function drawFurniture() {
    const c = furnish.c;
    if (!c) return;
    const lvl = lampLevel;
    const body = mixRgb(shade(grade.floor, 0.46), grade.wall, 0.10);
    const topC = mixRgb(shade(grade.floor, 0.78), grade.light, 0.14 + 0.30 * grade.amb);
    const cx0 = (c.nearL.x + c.nearR.x) / 2;
    const cy0 = (c.footL.y + c.footR.y) / 2;
    const spread = Math.max(90, Math.abs(c.nearR.x - c.nearL.x) * 0.80);

    // Contact shadow under the console.
    const shg = ctx.createRadialGradient(cx0, cy0 - 10, spread * 0.08, cx0, cy0 - 10, spread);
    shg.addColorStop(0, 'rgba(14,9,5,0.40)');
    shg.addColorStop(0.55, 'rgba(14,9,5,0.15)');
    shg.addColorStop(1, 'rgba(14,9,5,0)');
    ctx.fillStyle = shg;
    ctx.fillRect(cx0 - spread, cy0 - spread * 0.62, spread * 2, spread * 1.24);

    // Legs.
    const legW = Math.max(3, Math.abs(c.nearR.x - c.nearL.x) * 0.030);
    ctx.fillStyle = rgbCss(shade(body, 0.70));
    ctx.fillRect(c.nearL.x + legW * 0.5, c.nearL.y, legW, c.footL.y - c.nearL.y);
    ctx.fillRect(c.nearR.x - legW * 1.5, c.nearR.y, legW, c.footR.y - c.nearR.y);

    // Top slab.
    ctx.beginPath();
    ctx.moveTo(c.farL.x, c.farL.y);
    ctx.lineTo(c.farR.x, c.farR.y);
    ctx.lineTo(c.nearR.x, c.nearR.y);
    ctx.lineTo(c.nearL.x, c.nearL.y);
    ctx.closePath();
    ctx.fillStyle = rgbCss(topC);
    ctx.fill();

    const edgeH = Math.max(4, (c.nearL.y - c.farL.y) * 0.16);
    ctx.beginPath();
    ctx.moveTo(c.nearL.x, c.nearL.y);
    ctx.lineTo(c.nearR.x, c.nearR.y);
    ctx.lineTo(c.nearR.x, c.nearR.y + edgeH);
    ctx.lineTo(c.nearL.x, c.nearL.y + edgeH);
    ctx.closePath();
    ctx.fillStyle = rgbCss(shade(body, 0.90));
    ctx.fill();

    // The far edge catches the window.
    ctx.strokeStyle = rgbCss(grade.light, 0.08 + 0.26 * grade.amb);
    ctx.lineWidth = Math.max(1, h * 0.0016);
    ctx.beginPath();
    ctx.moveTo(c.farL.x, c.farL.y);
    ctx.lineTo(c.farR.x, c.farR.y);
    ctx.stroke();

    // Lamp: a stem, a paper shade, and at dusk the only warm light indoors.
    const shadeC = mixRgb(mixRgb(grade.wall, [252, 246, 232], 0.55), [216, 164, 94], 0.10 + lvl * 0.88);
    ctx.strokeStyle = rgbCss(shade(body, 0.66));
    ctx.lineWidth = Math.max(2, Math.abs(c.lampWR.x - c.lampWL.x) * 0.11);
    ctx.beginPath();
    ctx.moveTo(c.lampBase.x, c.lampBase.y);
    ctx.lineTo(c.lampBase.x, c.lampBL.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(c.lampWL.x, c.lampWL.y);
    ctx.lineTo(c.lampWR.x, c.lampWR.y);
    ctx.lineTo(c.lampBR.x, c.lampBR.y);
    ctx.lineTo(c.lampBL.x, c.lampBL.y);
    ctx.closePath();
    ctx.fillStyle = rgbCss(shadeC, 0.97);
    ctx.fill();

    if (lvl > 0.01) {
      const mx = c.lampMid.x;
      const my = c.lampMid.y;
      const rad = Math.max(w, h) * 0.55;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(mx, my, 0, mx, my, rad);
      g.addColorStop(0, 'rgba(255,226,170,' + (0.46 * lvl).toFixed(3) + ')');
      g.addColorStop(0.10, 'rgba(250,210,150,' + (0.24 * lvl).toFixed(3) + ')');
      g.addColorStop(0.34, 'rgba(238,186,124,' + (0.10 * lvl).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(226,168,102,0)');
      ctx.fillStyle = g;
      ctx.fillRect(mx - rad, my - rad, rad * 2, rad * 2);
      ctx.restore();
    }
  }

  function drawDust() {
    const buckets = [[], [], []];
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      if (d.alpha < 0.012) continue;
      const idx = d.lit > 0.55 ? 2 : d.lit > 0.16 ? 1 : 0;
      buckets[idx].push(d);
    }
    const tints = [
      rgbCss(mixRgb(grade.light, grade.wall, 0.4), 0.14),
      rgbCss(grade.light, 0.30),
      rgbCss(mixRgb(grade.light, [255, 252, 240], 0.55), 0.62),
    ];
    const scales = [0.7, 1.0, 1.35];
    for (let b = 0; b < 3; b++) {
      const list = buckets[b];
      if (!list.length) continue;
      ctx.fillStyle = tints[b];
      ctx.beginPath();
      for (let i = 0; i < list.length; i++) {
        const d = list[i];
        const rad = d.r0 * scales[b];
        ctx.moveTo(d.x + rad, d.y);
        ctx.arc(d.x, d.y, rad, 0, TAU);
      }
      ctx.fill();
    }
  }

  function drawCurtain() {
    const top = cur.y0;
    const bottom = cur.y1;
    const steps = 10;
    const bw = (cur.x1 - cur.x0) / CURTAIN_BANDS;
    const amb = clamp(grade.amb, 0, 1);
    const linen = mixRgb(grade.wall, [248, 240, 224], 0.16 + 0.40 * amb);
    const lit = mixRgb(linen, grade.light, 0.32 * amb);
    const dark = mixRgb(shade(grade.wall, 0.38), [30, 24, 18], 0.35);
    const edge = (t) => curtainProfile(t);

    // Base cloth: three offset passes stand in for a shallow depth of field.
    for (let pass = 0; pass < 3; pass++) {
      const jit = (pass - 1) * Math.max(0.6, w * 0.0014);
      const alpha = pass === 1 ? 0.84 : 0.16;
      ctx.beginPath();
      ctx.moveTo(cur.x0 - w * 0.02, top);
      ctx.lineTo(edge(0) + jit, top);
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        ctx.lineTo(edge(t) + jit, lerp(top, bottom, t));
      }
      ctx.lineTo(cur.x0 - w * 0.02, bottom);
      ctx.closePath();
      const g = ctx.createLinearGradient(cur.x0 - w * 0.02, 0, edge(0.55) + w * 0.03, 0);
      g.addColorStop(0, rgbCss(dark, 0.92 * alpha));
      g.addColorStop(0.30, rgbCss(mixRgb(dark, lit, 0.55), 0.94 * alpha));
      g.addColorStop(0.70, rgbCss(lit, 0.95 * alpha));
      g.addColorStop(1, rgbCss(mixRgb(lit, grade.wall, 0.30), 0.96 * alpha));
      ctx.fillStyle = g;
      ctx.fill();
    }

    // Folds: each band is a rounded tube of light and shade.
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cur.x0 - w * 0.03, top);
    ctx.lineTo(edge(0), top);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      ctx.lineTo(edge(t), lerp(top, bottom, t));
    }
    ctx.lineTo(cur.x0 - w * 0.03, bottom);
    ctx.closePath();
    ctx.clip();

    for (let i = 0; i < CURTAIN_BANDS; i++) {
      const b = bands[i];
      const x0 = cur.x0 + i * bw - bw * 0.22;
      const x1 = x0 + bw * 1.44;
      const peak = 0.17 * b.shade;
      const g = ctx.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, 'rgba(26,19,12,0.10)');
      g.addColorStop(0.26, 'rgba(255,248,232,' + (peak * 0.45).toFixed(3) + ')');
      g.addColorStop(0.52, 'rgba(255,251,240,' + peak.toFixed(3) + ')');
      g.addColorStop(0.78, 'rgba(255,246,228,' + (peak * 0.30).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(28,20,13,0.12)');
      ctx.fillStyle = g;
      ctx.fillRect(x0, top, x1 - x0, bottom - top);
    }

    const gb = ctx.createLinearGradient(0, bottom - (bottom - top) * 0.30, 0, bottom);
    gb.addColorStop(0, 'rgba(22,16,10,0)');
    gb.addColorStop(1, 'rgba(22,16,10,0.44)');
    ctx.fillStyle = gb;
    ctx.fillRect(cur.x0 - w * 0.05, bottom - (bottom - top) * 0.30, cur.x1 + w * 0.12, (bottom - top) * 0.30);
    ctx.restore();

    // Crisp edge shadow so the cloth sits in front of the room.
    const ex = edge(0.55);
    const ge = ctx.createLinearGradient(ex - w * 0.006, 0, ex + w * 0.030, 0);
    ge.addColorStop(0, 'rgba(20,14,8,0.36)');
    ge.addColorStop(1, 'rgba(20,14,8,0)');
    ctx.fillStyle = ge;
    ctx.fillRect(ex - w * 0.006, top, w * 0.036, bottom - top);
  }

  function drawBokeh() {
    const lit = 0.25 + 0.75 * clamp(grade.amb, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < bokeh.length; i++) {
      const b = bokeh[i];
      const r = b.r;
      ctx.globalAlpha = b.gain * lit * 0.85;
      ctx.drawImage(bokehSprite, b.x - r, b.y - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  function render() {
    if (!w || !h) return;
    frames++;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    drawWall();
    drawFloor();
    if (tex.width > 1) ctx.drawImage(tex, 0, 0, w, h);
    drawWindow();
    drawBeam();
    drawPatch();
    drawFurniture();
    drawDust();
    drawCurtain();
    drawBokeh();
    if (vig.width > 1) ctx.drawImage(vig, 0, 0, w, h);
  }

  /* -------------------------------- HUD -------------------------------- */

  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  function clockString(seconds) {
    const t = ((seconds % 86400) + 86400) % 86400;
    return pad2(Math.floor(t / 3600)) + ':' + pad2(Math.floor((t % 3600) / 60));
  }

  function refreshHud(force) {
    if (!force && el.body.classList.contains('hud-off')) return;
    const c = clockString(tOfDay);
    if (el.statClock) el.statClock.textContent = c;
    if (el.liveClock) el.liveClock.textContent = c;
    const phase = phaseName();
    if (el.livePhase) el.livePhase.textContent = phase;
    if (el.statAlt) el.statAlt.textContent = (solar.alt / DEG).toFixed(1) + '°';
    if (el.statAz) el.statAz.textContent = Math.round(solar.az / DEG) + '°';
    if (el.statPatch) el.statPatch.textContent = patch.intensity.toFixed(2);
    if (el.skyPhase) el.skyPhase.textContent = phase;
    if (el.skyRise) el.skyRise.textContent = clockString(solar.rise * 3600);
    if (el.skySet) el.skySet.textContent = clockString(solar.set * 3600);
    if (el.skyLen) {
      const mins = Math.max(0, solar.length * 60);
      el.skyLen.textContent = Math.floor(mins / 60) + ' 小时 ' + pad2(Math.round(mins % 60)) + ' 分';
    }
    if (el.panelDate) el.panelDate.textContent = dayKey;
    if (el.measureText) {
      el.measureText.textContent = latDeg.toFixed(1) + '°N · 本地 ' + c + ' · 高度 ' + (solar.alt / DEG).toFixed(0) + '°';
    }
  }

  function showToast(message) {
    if (!el.toast) return;
    el.toast.textContent = message;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2400);
  }

  function togglePause() {
    paused = !paused;
    computeScene();
    syncPlayback();
    render();
    refreshHud(true);
  }

  function syncPlayback() {
    cancelAnimationFrame(raf);
    raf = 0;
    last = 0;
    if (el.pause) el.pause.textContent = paused ? '继续' : '暂停';
    if (!paused && !document.hidden) raf = requestAnimationFrame(frame);
  }

  function toggleHud() {
    const off = el.body.classList.toggle('hud-off');
    el.body.classList.remove('quiet');
    if (!off) {
      scheduleQuiet();
      refreshHud(true);
    }
    if (el.settings) el.settings.setAttribute('aria-expanded', String(el.panel && !el.panel.hidden));
  }

  function scheduleQuiet() {
    clearTimeout(quietTimer);
    quietTimer = setTimeout(() => {
      if (!el.body.classList.contains('hud-off')) el.body.classList.add('quiet');
    }, 12000);
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (err) { /* some wallpaper hosts do not expose fullscreen */ }
  }

  function syncLampUi() {
    if (el.lamp) el.lamp.checked = lampOn;
    el.body.classList.toggle('dim', grade.dim);
  }

  function toggleLamp() {
    lampAuto = false;
    lampOn = !lampOn;
    computeScene();
    lampLevel = lampOn ? 1 : 0;
    syncLampUi();
    if (paused) render();
    showToast(lampOn ? '台灯已打开' : '台灯已关闭');
  }

  /* -------------------------------- loop -------------------------------- */

  function frame(now) {
    raf = 0;
    if (paused || document.hidden) {
      last = 0;
      return;
    }
    if (!last) last = now;
    const elapsed = now - last;
    if (elapsed < FRAME_MS - 1) {
      raf = requestAnimationFrame(frame);
      return;
    }
    last = now - (elapsed % FRAME_MS);
    const dt = clamp(elapsed / 1000, 0.001, 0.12);
    update(dt);
    render();
    raf = requestAnimationFrame(frame);
  }

  function update(dt) {
    dt = clamp(dt, 0.001, 0.12);
    tOfDay += dt;
    if (tOfDay >= 86400) {
      tOfDay -= 86400;
      if (!dayPinned) {
        const d = new Date(dayKey + 'T00:00:00');
        d.setDate(d.getDate() + 1);
        dayKey = localYmd(d);
        dayOfYear = computeDoy(dayKey);
      }
    }
    computeScene();
    lampLevel += ((lampOn ? 1 : 0) - lampLevel) * (1 - Math.exp(-dt / 0.45));
    if (lampLevel < 0.002) lampLevel = 0;
    if (curtainPush !== 0) {
      curtainPush *= Math.exp(-dt / 3.4);
      if (Math.abs(curtainPush) < 0.002) curtainPush = 0;
    }
    if (el.body.classList.contains('dim') !== grade.dim) el.body.classList.toggle('dim', grade.dim);
    hudClock += dt;
    if (hudClock > 0.4) {
      hudClock = 0;
      refreshHud();
    }
  }

  /* -------------------------------- input -------------------------------- */

  function pointerNorm(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: clamp((e.clientX - rect.left) / Math.max(1, rect.width), 0, 1),
      y: clamp((e.clientY - rect.top) / Math.max(1, rect.height), 0, 1),
    };
  }

  function onPointerMove(e) {
    const p = pointerNorm(e);
    if (!curtainEnabled) return;
    const dx = p.x - curtainPushX;
    curtainPushX = p.x;
    if (dx !== 0) {
      const near = p.x < (cur.x1 + w * 0.10) / Math.max(1, w) ? 1 : 0.28;
      const kick = clamp(Math.abs(dx) * 2.6, 0, 0.34) * near;
      curtainPush = clamp(curtainPush + (dx > 0 ? kick : -kick), -1, 1);
    }
    if (paused) {
      computeScene();
      render();
    }
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const p = pointerNorm(e);
    curtainPushX = p.x;
    if (curtainEnabled) {
      curtainPush = clamp(curtainPush + (p.x < 0.4 ? 0.42 : -0.42), -1, 1);
      if (paused) {
        computeScene();
        render();
      }
    }
  }

  function onPointerLeave() {
    curtainPushX = 0.12;
  }

  function installEvents() {
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerup', onPointerLeave);
    canvas.addEventListener('pointercancel', onPointerLeave);
    canvas.addEventListener('pointerleave', onPointerLeave);
    canvas.addEventListener('click', () => toggleLamp());

    if (el.settings) {
      el.settings.addEventListener('click', () => {
        const open = el.panel.hidden;
        el.panel.hidden = !open;
        el.settings.setAttribute('aria-expanded', String(open));
        if (open) scheduleQuiet();
      });
    }
    if (el.pause) el.pause.addEventListener('click', () => { togglePause(); scheduleQuiet(); });
    const fs = document.getElementById('fullscreen');
    if (fs) fs.addEventListener('click', toggleFullscreen);

    if (el.lamp) {
      el.lamp.addEventListener('change', () => {
        lampAuto = false;
        lampOn = el.lamp.checked;
        lampLevel = lampOn ? 1 : 0;
        computeScene();
        lampLevel = lampOn ? 1 : 0;
        if (paused) render();
      });
    }
    if (el.curtain) {
      el.curtain.checked = curtainEnabled;
      el.curtain.addEventListener('change', () => {
        curtainEnabled = el.curtain.checked;
        if (!curtainEnabled) curtainPush = 0;
        if (paused) {
          computeScene();
          render();
        }
      });
    }

    addEventListener('keydown', (e) => {
      if (e.target && e.target.matches && e.target.matches('input, select, button')) return;
      if (e.repeat) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePause();
      } else if (e.key && e.key.toLowerCase() === 'h') toggleHud();
      else if (e.key && e.key.toLowerCase() === 'f') toggleFullscreen();
    });

    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        syncPlayback();
      } else {
        last = 0;
        syncPlayback();
        if (paused) {
          computeScene();
          render();
        }
      }
    });
    reducedMotion.addEventListener('change', (e) => {
      if (stillParam === null) {
        paused = e.matches;
        syncPlayback();
        computeScene();
        render();
      }
    });
    if (q.get('hud') === '0') el.body.classList.add('hud-off');
  }

  /* -------------------------------- resize & boot -------------------------------- */

  function resize() {
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 1.5, Math.max(0.4, Math.sqrt(MAX_PIXELS / (w * h))));
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    pbuf.width = Math.max(8, Math.round(w * 0.22));
    pbuf.height = Math.max(8, Math.round(h * 0.22));

    applyLayout();
    buildDust();
    bakeTexture();
    bakeVignette();
    computeScene();
    render();
    refreshHud(true);
    syncLampUi();
  }

  /* -------------------------------- debug api -------------------------------- */

  const api = {
    snapshot: () => ({
      seed,
      tOfDay,
      clock: clockString(tOfDay),
      dayKey,
      latDeg,
      lonDeg,
      paused,
      frames,
      w,
      h,
      dpr,
      aspect: w / h,
      budgetPx: Math.round(w * h * dpr * dpr),
      mode: cam.mode,
      alt: solar.alt,
      az: solar.az,
      altDeg: solar.alt / DEG,
      azDeg: solar.az / DEG,
      sinAlt: solar.sinAlt,
      haDeg: solar.ha / DEG,
      phase: phaseName(),
      rise: solar.rise,
      set: solar.set,
      dayLength: solar.length,
      phiDeg: patch.phi / DEG,
      patch: {
        intensity: patch.intensity,
        cx: patch.cx,
        cy: patch.cy,
        width: patch.x1 - patch.x0,
        height: patch.y1 - patch.y0,
        quads: PATCH_QUADS,
        verts: PATCH_VERTS,
        onFloor: patch.onFloor,
        zMid: patch.zMid,
      },
      dust: dust.length,
      dustLit: dust.reduce((n, d) => n + (d.lit > 0.4 ? 1 : 0), 0),
      bokeh: bokeh.length,
      bands: bands.length,
      curtainEdge: curtainProfile(0.55),
      curtainPush,
      lamp: lampOn,
      lampAuto,
      lampLevel,
      amb: grade.amb,
      winRect: { x0: win.x0, y0: win.y0, x1: win.x1, y1: win.y1 },
      paneCover: (() => {
        const out = [];
        for (let j = 0; j < PANE_ROWS; j++) {
          for (let i = 0; i < PANE_COLS; i++) {
            out.push(Math.round(curtainCoverAt(paneWinX(i), paneWinY(j)) * 1000) / 1000);
          }
        }
        return out;
      })(),
      wallBaseY: cam.wallBaseY,
      horizonY: cam.horizonY,
      sample: dust.slice(0, 6).map((d) => ({
        x: Math.round(d.x * 100) / 100,
        y: Math.round(d.y * 100) / 100,
        lit: Math.round(d.lit * 1000) / 1000,
        a: Math.round(d.alpha * 1000) / 1000,
      })),
    }),
    audit: () => {
      let bad = 0;
      let badDust = 0;
      let badPatch = 0;
      let maxX = 0;
      let maxY = 0;
      for (const v of verts) {
        if (!Number.isFinite(v.x) || !Number.isFinite(v.y)) badPatch++;
        maxX = Math.max(maxX, Math.abs(v.x));
        maxY = Math.max(maxY, Math.abs(v.y));
      }
      for (const d of dust) {
        if (!Number.isFinite(d.x + d.y + d.alpha + d.lit)) badDust++;
      }
      if (!Number.isFinite(patch.intensity)) badPatch++;
      if (!Number.isFinite(patch.cx + patch.cy)) badPatch++;
      return {
        bad,
        badDust,
        badPatch,
        dust: dust.length,
        bokeh: bokeh.length,
        bands: bands.length,
        quads: PATCH_QUADS,
        verts: PATCH_VERTS,
        maxPatchCoord: Math.max(maxX, maxY),
        patchIntensity: patch.intensity,
        dustLit: dust.reduce((n, d) => n + (d.lit > 0.4 ? 1 : 0), 0),
        frames,
        paused,
        tOfDay,
      };
    },
    advance: (seconds) => {
      const n = Math.max(1, Math.round(clamp(seconds, 0, 7200) * TARGET_FPS));
      for (let i = 0; i < n; i++) update(1 / TARGET_FPS);
      render();
      refreshHud(true);
      return api.snapshot();
    },
    setClock: (seconds) => {
      tOfDay = ((Number(seconds) || 0) % 86400 + 86400) % 86400;
      computeScene();
      if (paused) render();
      refreshHud(true);
      return api.snapshot();
    },
    togglePause,
    setLamp: (v) => {
      if (v === null || v === undefined) {
        lampAuto = true;
      } else {
        lampAuto = false;
        lampOn = !!v;
      }
      computeScene();
      lampLevel = lampOn ? 1 : 0;
      syncLampUi();
      if (paused) render();
      return lampOn;
    },
    toggleLamp,
    stirCurtain: (strength) => {
      if (!curtainEnabled) {
        curtainPush = 0;
        return 0;
      }
      curtainPush = clamp(Number(strength) || 0, -1, 1);
      computeScene();
      if (paused) render();
      return curtainPush;
    },
    releaseCurtain: () => {
      curtainPush = 0;
      computeScene();
      if (paused) render();
      return curtainPush;
    },
    sampleIllum: (nx, ny) => patchLightAt(clamp(nx, 0, 1) * w, clamp(ny, 0, 1) * h),
    toggleHud,
    render: () => { computeScene(); render(); },
  };
  window.__lumenSun = api;

  function boot() {
    buildBands();
    installEvents();
    resize();
    syncPlayback();
    scheduleQuiet();
  }

  boot();
})();
</script>
</body>
</html>
