    const data = img.data;
    const rnd = mulberry32(seed);
    for (let i = 0; i < size * size; i++) {
      const v = rnd() * 255;
      data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = v;
      data[i * 4 + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  const cloudNoise = makeNoiseTexture(256, 7301);

  /**
   * A soft, matte-painted cumulus bank.
   *
   * Puffs are grouped into a wide dome so the silhouette reads as a bank
   * rather than a ball. Shading is baked once; lightning illumination is
   * applied at scene level, so the texture itself stays cheap to draw.
   */
  // A seamless, full-sky cloud field. Two of these, drifting at different
  // speeds, give the deck depth and a slow, boiling motion without any
  // sprite edges or rectangular cut-outs.
  function makeCloudField(w, h, seed, opts) {
    opts = opts || {};
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    const img = x.createImageData(w, h);
    const data = img.data;
    const n1 = makeValueNoise(seed);
    const n2 = makeValueNoise(seed + 31);
    const n3 = makeValueNoise(seed + 67);
    const th = opts.th || .44;

    for (let y = 0; y < h; y++) {
      const v = y / h;
      const topFade = smoothstep(0, .035, v);
      const botFade = 1 - smoothstep(.88, 1, v);
      const prof = .55 + .45 * (smoothstep(0, .14, v) * (1 - smoothstep(.74, .98, v)));

      for (let xx = 0; xx < w; xx++) {
        const u = xx / w;
        const q1 = fbm(n1, u * 4, v * 2.1, 4) - .5;
        const q2 = fbm(n2, u * 4 + 7.7, v * 2.1 + 3.3, 4) - .5;
        const mass = fbm(n2, u * 2, v * 1.35, 3);
        const base = fbm(n1, u * 4 + q1 * 2.4, v * 2.8 + q2 * 1.8, 6);
        const billow = 1 - Math.abs(2 * fbm(n3, u * 5 + q2 * 1.6, v * 3 + q1 * 1.4, 4) - 1);
        const detail = fbm(n3, u * 11 + q1 * 3, v * 7 + q2 * 2, 3) - .5;
        const fine = fbm(n2, u * 21 + q2 * 4, v * 13 + q1 * 3, 2) - .5;
        let shape = base * .58 + billow * .34 + detail * .085 + fine * .035;
        shape *= prof;
        shape *= .62 + .72 * smoothstep(.28, .72, mass);
        const a = smoothstep(th, th + .055, shape) * topFade * botFade * (opts.alpha || 1);
        if (a < .004) continue;

        const lit = smoothstep(th + .005, th + .24, shape);
        const topLight = Math.max(0, 1 - v * 1.15);
        const bright = opts.bright || 1;
        let r = (2 + 30 * lit + 5 * topLight) * bright;
        let g = (4 + 36 * lit + 7 * topLight) * bright;
        let b = (6 + 46 * lit + 9 * topLight) * bright;

        // A cold, greenish lift where the cloud base meets the plain.
        const baseLift = smoothstep(.52, .78, v) * (1 - smoothstep(.82, .96, v)) * .5;
        r += 10 * baseLift;
        g += 16 * baseLift;
        b += 12 * baseLift;

        // Faint darker crevices.
        const crev = smoothstep(.37, .47, shape) * (1 - smoothstep(.48, .56, shape));
        r -= 5 * crev; g -= 6 * crev; b -= 7 * crev;

        const idx = (y * w + xx) * 4;
        data[idx] = r;
        data[idx + 1] = g;
        data[idx + 2] = b;
        data[idx + 3] = a * 255;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  function ridgeNoise(x, seed) {
    return Math.sin(x * .0042 + seed) * .5 +
           Math.sin(x * .0097 + seed * 2.1) * .28 +
           Math.sin(x * .021 + seed * 4.3) * .13;
  }

  function buildSkyCache() {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    const x = c.getContext('2d');
    x.setTransform(DPR, 0, 0, DPR, 0, 0);

    const sky = x.createLinearGradient(0, 0, 0, HORIZON);
    sky.addColorStop(0, '#010308');
    sky.addColorStop(.27, '#040a11');
    sky.addColorStop(.52, '#07121a');
    sky.addColorStop(.72, '#0d1a1e');
    sky.addColorStop(.88, '#192621');
    sky.addColorStop(1, '#1a2822');
    x.fillStyle = sky;
    x.fillRect(0, 0, W, HORIZON + 2);

    // A cold, wet glow that the storm never quite releases. A horizontal
    // band avoids the circular contour a radial gradient would leave in a
    // sky this dark.
    let g = x.createLinearGradient(0, HORIZON - H * .30, 0, HORIZON + 2);
    g.addColorStop(0, 'rgba(120, 146, 133, 0)');
    g.addColorStop(.48, 'rgba(132, 155, 137, .055)');
    g.addColorStop(.78, 'rgba(150, 169, 145, .085)');
    g.addColorStop(1, 'rgba(166, 182, 152, .13)');
    x.fillStyle = g;
    x.fillRect(0, HORIZON - H * .30, W, H * .31);

    g = x.createLinearGradient(0, 0, W * .55, 0);
    g.addColorStop(0, 'rgba(21, 33, 42, .22)');
    g.addColorStop(1, 'rgba(21, 33, 42, 0)');
    x.fillStyle = g;
    x.fillRect(0, 0, W * .55, HORIZON + 2);

    skyCache = c;
  }

  function buildLandCache() {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    const x = c.getContext('2d');
    x.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Field wash.
    const ground = x.createLinearGradient(0, HORIZON - 2, 0, H);
    ground.addColorStop(0, '#1a2822');
    ground.addColorStop(.18, '#122019');
    ground.addColorStop(.55, '#08140e');
    ground.addColorStop(1, '#030805');
    x.fillStyle = ground;
    x.fillRect(0, HORIZON - 2, W, H - HORIZON + 2);

    // Distant ridges, each a little darker and sharper.
    const ridges = [
      { base: HORIZON + 1.0, amp: H * .016, color: '#1d2c25', alpha: .85, seed: 1.2 },
      { base: HORIZON + 4.5, amp: H * .022, color: '#15231d', alpha: .9, seed: 3.7 },
      { base: HORIZON + 9.0, amp: H * .030, color: '#101c16', alpha: .94, seed: 6.1 }
    ];

    for (const r of ridges) {
      x.beginPath();
      x.moveTo(-20, H + 20);
      for (let px = -20; px <= W + 20; px += 14) {
        const n = ridgeNoise(px, r.seed);
        const y = r.base + n * r.amp * 1.6;
        x.lineTo(px, y);
      }
      x.lineTo(W + 20, H + 20);
      x.closePath();
      x.globalAlpha = r.alpha;
      x.fillStyle = r.color;
      x.fill();
    }
    x.globalAlpha = 1;

    // A broken line of distant scrub keeps the horizon from reading as a
    // ruler-straight seam.
    // A distant tree line; little more than pins on the ridge.
    const farR = mulberry32(9187);
    x.strokeStyle = 'rgba(7, 14, 10, .55)';
    x.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      const tx = farR() * W;
      const ty = HORIZON + 1 + farR() * H * .012;
      const th = 3 + farR() * 10;
      x.beginPath();
      x.moveTo(tx, ty);
      x.lineTo(tx + (farR() - .5) * 1.2, ty - th);
      x.stroke();
      x.beginPath();
      x.arc(tx, ty - th, Math.max(.8, th * .14), 0, TAU);
      x.fillStyle = 'rgba(7, 14, 10, .45)';
      x.fill();
    }


    // A faint water sheen where the plain meets the storm.
    let g = x.createLinearGradient(0, HORIZON + H * .01, 0, HORIZON + H * .08);
    g.addColorStop(0, 'rgba(115, 141, 127, .055)');
    g.addColorStop(1, 'rgba(115, 141, 127, 0)');
    x.fillStyle = g;
    x.fillRect(0, HORIZON, W, H * .09);

    landCache = c;
  }

  function makeBlade(x, y, len, w, lean, phase, color, flex) {
    return { x, y, len, w, lean, phase, color, flex };
  }

  function buildGrass() {
    grassLayers = [];
    const rnd = mulberry32(41417);
    const quality = settings.quality === 'smooth' ? .62 : settings.quality === 'high' ? 1.25 : 1;
    const compact = Math.min(W, H) < 700;

    const layers = [
      {
        count: (compact ? 900 : 1500) * quality,
        y0: HORIZON - 2, y1: HORIZON + H * .075,
        len0: 3, len1: 16,
        colors: ['#22342a', '#2a3f31', '#324936', '#3a523c', '#1d2e24'],
        alpha: .78, flex: .42, lean: .1
      },
      {
        count: (compact ? 1100 : 2100) * quality,
        y0: HORIZON + H * .03, y1: HORIZON + H * .20,
        len0: 8, len1: 42,
        colors: ['#16281e', '#1c3124', '#23392a', '#2a4331', '#101f17'],
        alpha: .94, flex: .62, lean: .16
      },
      {
        count: (compact ? 560 : 1080) * quality,
        y0: HORIZON + H * .14, y1: HORIZON + H * .50,
        len0: 20, len1: 108,
        colors: ['#0b1811', '#0f1f16', '#14281b', '#192f20', '#08110c'],
        alpha: 1, flex: .84, lean: .2
      },
      {
        count: (compact ? 240 : 520) * quality,
        y0: H * .78, y1: H * 1.04,
        len0: 46, len1: 190,
        colors: ['#050b07', '#07100a', '#09130d', '#0c1810'],
        alpha: 1, flex: 1.05, lean: .26
      },
      {
        count: (compact ? 210 : 460) * quality,
        y0: H * .92, y1: H * 1.05,
        len0: 24, len1: 96,
        colors: ['#040906', '#061009', '#08140d'],
        alpha: 1, flex: 1.2, lean: .3
      }
    ];

    for (const layer of layers) {
      const groups = layer.colors.map(() => []);
      for (let i = 0; i < layer.count; i++) {
        const y = lerp(layer.y0, layer.y1, Math.pow(rnd(), .72));
        const depth = clamp((y - HORIZON) / (H - HORIZON), 0, 1);
        const len = lerp(layer.len0, layer.len1, Math.pow(depth, 1.25) * (.55 + rnd() * .65));
        const x = rnd() * (W + 20) - 10;
        const w = Math.max(.5, len * (.018 + rnd() * .026));
        const lean = (rnd() - .42) * layer.lean;
        const phase = rnd() * TAU;
        const colorIndex = (rnd() * layer.colors.length) | 0;
        groups[colorIndex].push(makeBlade(x, y, len, w, lean, phase, layer.colors[colorIndex], layer.flex * (.7 + rnd() * .6)));
      }
      grassLayers.push({ alpha: layer.alpha, groups, colors: layer.colors });
    }
  }

  function buildTree(seed, count, size) {
    const R = mulberry32(seed);
    const segs = [];
    const leaves = [];
    function branch(x0, y0, angle, len, width, depth) {
      const x1 = x0 + Math.cos(angle) * len;
      const y1 = y0 + Math.sin(angle) * len;
      segs.push({ x0, y0, x1, y1, w: width });
      if (depth <= 0) return;
      if (depth < 4 && R() > .08) {
        const n = 3 + ((R() * 4) | 0);
        for (let j = 0; j < n; j++) {
          const a = R() * TAU;
          const rr = len * (.035 + R() * .075);
          leaves.push({
            x: x1 + (R() - .5) * len * .5,
            y: y1 + (R() - .5) * len * .35,
            rx: rr * (1 + R() * .7),
            ry: rr * (.5 + R() * .45),
            rot: a,
            alpha: .55 + R() * .4
          });
        }
      }
      for (let i = 0; i < 2; i++) {
        const spread = (.34 + R() * .5) * (i === 0 ? -1 : 1);
        const nextAngle = angle + spread + (R() - .5) * .34;
        const nextLen = len * (.62 + R() * .18);
        branch(x1, y1, nextAngle, nextLen, Math.max(.7, width * .62), depth - 1);
      }
      if (depth > 1 && R() > .54) {
        branch(x1, y1, angle + (R() - .5) * .7, len * .45, Math.max(.6, width * .42), depth - 1);
      }
    }
    branch(0, 0, -Math.PI * .5, size * .32, Math.max(2, size * .035), count);
    return { segs, leaves };
  }

  function buildLandDetails() {
    const big = buildTree(8023, 5, Math.min(H * .27, W * .18));
    treeSegments = big.segs;
    treeLeaves = big.leaves;
    const small = buildTree(9211, 4, Math.min(H * .14, W * .09));
    treeSegmentsSmall = small.segs;
    treeLeavesSmall = small.leaves;
    const right = buildTree(3317, 4, Math.min(H * .16, W * .10));
    treeSegmentsRight = right.segs;
    treeLeavesRight = right.leaves;
  }

  // ---------------------------------------------------------------------------
  // Rain, mist, and wind
  // ---------------------------------------------------------------------------
  function buildFlowers() {
    const R = mulberry32(6203);
    flowers = [];
    for (let i = 0; i < 72; i++) {
      flowers.push({
        x: R() * W,
        y: H * (.82 + R() * .20),
        h: 5 + R() * 17,
        r: .7 + R() * 1.5,
        phase: R() * TAU,
        n: 1 + ((R() * 3) | 0)
      });
    }
  }

  function drawFlowers(ctx, t, lf) {
    if (!flowers.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = 'rgba(168, 188, 164, ' + (.07 + lf * .10) + ')';
    ctx.fillStyle = 'rgba(198, 214, 188, ' + (.10 + lf * .14) + ')';
    ctx.lineWidth = .65;
    for (const f of flowers) {
      const sway = Math.sin(t * 1.3 + f.phase) * f.h * .12;
      const tipX = f.x + sway;
      const tipY = f.y - f.h;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.quadraticCurveTo(f.x + sway * .4, f.y - f.h * .6, tipX, tipY);
      ctx.stroke();
      for (let j = 0; j < f.n; j++) {
        ctx.beginPath();
        ctx.arc(tipX + (j - (f.n - 1) * .5) * 2.1, tipY - (j % 2) * 1.4, f.r, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function buildRain() {
    rainDrops = [];
    const rnd = mulberry32(5150);
    const count = settings.quality === 'smooth' ? 360 : 660;
    for (let i = 0; i < count; i++) {
      const near = rnd() > .62;
      rainDrops.push({
        x: rnd() * (W + 200) - 100,
        y: rnd() * H,
        len: near ? 12 + rnd() * 28 : 6 + rnd() * 15,
        speed: near ? 620 + rnd() * 440 : 340 + rnd() * 300,
        alpha: near ? .10 + rnd() * .18 : .04 + rnd() * .09,
        width: near ? .8 + rnd() * .7 : .35 + rnd() * .4,
        near
      });
    }
  }

  function windAt(x, y, t) {
    const s = WIND_STRENGTH[settings.wind];
    const wave1 = Math.sin(t * 1.12 + x * .006 + y * .012);
    const wave2 = Math.sin(t * .48 - x * .0031 + 1.7);
    const gust = Math.pow(.5 + .5 * Math.sin(t * .27 - x * .0011 + 2.4), 3);
    return (wave1 * .34 + wave2 * .19 + gust * .33) * s;
  }

  function drawGrass(ctx, t, lf) {
    const flashTint = clamp(lf, 0, 1);
    for (let li = 0; li < grassLayers.length; li++) {
      const layer = grassLayers[li];
      ctx.globalAlpha = layer.alpha;
      for (let gi = 0; gi < layer.groups.length; gi++) {
        const group = layer.groups[gi];
        if (!group.length) continue;
        const path = new Path2D();
        for (let i = 0; i < group.length; i++) {
          const b = group[i];
          const w = windAt(b.x, b.y, t);
          const sway = b.lean + w * (.55 + b.flex * .75) +
            Math.sin(t * 1.8 + b.phase + b.x * .013) * .08;
          const bend = sway * b.len;
          const tipX = b.x + bend;
          const tipY = b.y - b.len * (1 - Math.min(.34, Math.abs(sway) * .4));
          const c1x = b.x + bend * .22 + b.w * .3;
          const c1y = b.y - b.len * .58;
          const c2x = b.x + bend * .64 - b.w * .2;
          const c2y = b.y - b.len * .88;
          path.moveTo(b.x - b.w * .5, b.y);
          path.quadraticCurveTo(c1x, c1y, tipX, tipY);
          path.lineTo(tipX + b.w * .12, tipY + b.len * .014);
          path.quadraticCurveTo(c2x, c2y, b.x + b.w * .5, b.y);
          path.closePath();
        }
        ctx.fillStyle = layer.colors[gi];
        ctx.fill(path);
      }
    }
    ctx.globalAlpha = 1;

    // A cold sheen catches the seed heads when the lightning fires.
    if (flashTint > .02) {
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = .28 * flashTint;
      ctx.strokeStyle = 'rgba(185, 210, 205, 1)';
      const sheen = new Path2D();
      const layer = grassLayers[2];
      for (let gi = 0; gi < layer.groups.length; gi++) {
        const group = layer.groups[gi];
        for (let i = 0; i < group.length; i += 9) {
          const b = group[i];
          const w = windAt(b.x, b.y, t);
          const sway = b.lean + w * (.55 + b.flex * .75) +
            Math.sin(t * 1.8 + b.phase + b.x * .013) * .08;
          const bend = sway * b.len;
          const tipX = b.x + bend;
          const tipY = b.y - b.len * (1 - Math.min(.34, Math.abs(sway) * .4));
          sheen.moveTo(b.x + bend * .52, b.y - b.len * .74);
          sheen.lineTo(tipX, tipY);
        }
      }
      ctx.lineWidth = Math.max(.5, 1.1 * (W / 1600));
      ctx.stroke(sheen);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawFieldSheen(ctx, t, lf) {
    // Broad waves of lighter grass, like wind moving through a dark field.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HORIZON - 4, W, H - HORIZON + 4);
    ctx.clip();
    ctx.globalCompositeOperation = 'screen';
    ctx.lineCap = 'round';

    for (let i = 0; i < 4; i++) {
      const period = 11 + i * 4.2;
      const phase = (t * (.030 + i * .009) + i * .31) % 1;
      const baseX = -W * .35 + phase * W * 1.8;
      const alpha = (.045 + .012 * i) * (.7 + .3 * Math.sin(t * .37 + i * 2));
      for (let j = 0; j < 2; j++) {
        const x0 = baseX + j * W * .8;
        ctx.beginPath();
        ctx.moveTo(x0 - W * .18, H + 30);
        for (let yy = H; yy >= HORIZON - 4; yy -= H * .028) {
          const k = (H - yy) / (H - HORIZON);
          ctx.lineTo(
            x0 + Math.sin(yy * .017 + t * .7 + i * 2.2) * W * .035 + (1 - k) * W * .05,
            yy
          );
        }
        ctx.strokeStyle = 'rgba(132, 162, 140, ' + alpha + ')';
        ctx.lineWidth = H * (.055 + .025 * i);
        ctx.stroke();
      }
    }


    if (lf > .02) {
      ctx.globalAlpha = .12 * lf;
      const g = ctx.createLinearGradient(0, HORIZON, 0, H);
      g.addColorStop(0, 'rgba(173, 199, 190, .8)');
      g.addColorStop(.35, 'rgba(173, 199, 190, .12)');
      g.addColorStop(1, 'rgba(173, 199, 190, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, HORIZON, W, H - HORIZON);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function drawTree(ctx, cx, baseY, segs, leaves, scale, t, lf) {
    if (!segs.length) return;
    const sway = Math.sin(t * .9 + 1.2) * .006 + windAt(cx, baseY, t) * .012;
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.rotate(sway);
    ctx.scale(scale, scale);

    ctx.lineCap = 'round';

    if (leaves && leaves.length) {
      ctx.fillStyle = 'rgba(3, 8, 6, .88)';
      for (const l of leaves) {
        ctx.beginPath();
        ctx.ellipse(l.x, l.y, l.rx, l.ry, l.rot, 0, TAU);
        ctx.fill();
      }
      if (lf > .05) {
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = .16 * lf;
        ctx.fillStyle = 'rgba(146, 177, 172, 1)';
        for (const l of leaves) {
          ctx.beginPath();
          ctx.ellipse(l.x, l.y, l.rx * .8, l.ry * .7, l.rot, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    ctx.strokeStyle = 'rgba(4, 9, 8, .98)';
    for (const s of segs) {
      ctx.lineWidth = s.w;
      ctx.beginPath();
      ctx.moveTo(s.x0, s.y0);
      ctx.lineTo(s.x1, s.y1);
      ctx.stroke();
    }

    if (lf > .03) {
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = .30 * lf;
      ctx.strokeStyle = 'rgba(156, 183, 183, 1)';
      for (const s of segs) {
        ctx.lineWidth = Math.max(.45, s.w * .28);
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Lightning
  // ---------------------------------------------------------------------------
  function jaggedPath(x0, y0, x1, y1, R, depth, jitter) {
    let pts = [{ x: x0, y: y0 }, { x: x1, y: y1 }];
    let rough = jitter;
    for (let d = 0; d < depth; d++) {
      const next = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const off = (R() - .5) * len * rough;
        const mid = {
          x: (a.x + b.x) * .5 + nx * off,
          y: (a.y + b.y) * .5 + ny * off
        };
        next.push(mid, b);
      }
      pts = next;
      rough *= .58;
    }
    return pts;
  }

  function makeBolt(x0, y0, x1, y1, seed, opts) {
    opts = opts || {};
    const R = mulberry32(seed);
    const main = jaggedPath(x0, y0, x1, y1, R, 7, .34);
    const paths = [{ pts: main, width: opts.width || 1.8, alpha: 1 }];

    const branchCount = opts.branches != null ? opts.branches : 5;
    for (let b = 0; b < branchCount; b++) {
      const idx = 6 + ((R() * (main.length - 18)) | 0);
      const p = main[idx];
      const q = main[Math.min(main.length - 1, idx + 2)];
      const baseAngle = Math.atan2(q.y - p.y, q.x - p.x);
      const dir = baseAngle + (R() > .5 ? 1 : -1) * (.28 + R() * .9);
      const len = Math.min(
        opts.branchMax || H * .23,
        (H * .055 + R() * H * .13) * (1 - idx / main.length * .35)
      );
      const ex = p.x + Math.cos(dir) * len;
      const ey = p.y + Math.sin(dir) * len;
      const bp = jaggedPath(p.x, p.y, ex, ey, R, 5, .38);
      paths.push({ pts: bp, width: .55 + R() * .7, alpha: .62 + R() * .28 });

      if (R() > .48 && bp.length > 12) {
        const k = 5 + ((R() * (bp.length - 12)) | 0);
        const bp2 = bp[k];
        const dir2 = Math.atan2(bp[bp.length - 1].y - bp2.y, bp[bp.length - 1].x - bp2.x) + (R() - .5) * 1.1;
        const l2 = len * (.25 + R() * .35);
        const sp = jaggedPath(bp2.x, bp2.y, bp2.x + Math.cos(dir2) * l2, bp2.y + Math.sin(dir2) * l2, R, 4, .45);
        paths.push({ pts: sp, width: .35 + R() * .4, alpha: .32 + R() * .28 });
      }
    }

    return {
      paths,
      start: time,
      x: x0,
      y: y0,
      endX: x1,
      endY: y1,
      ground: !!opts.ground,
      energy: 0,
      pulses: opts.pulses || [0, .055, .145, .29],
      seed
    };
  }

  function triggerStrike(px, opts) {
    opts = opts || {};
    if (PREVIEW && !opts.preview) return;

    if (PHOTO_MODE) {
      photoPulse = time;
      flashX = W * .555;
      flashY = H * .47;
      nextStrikeAt = time + rand(
        opts.minInterval || RATE_INTERVALS[settings.rate][0],
        opts.maxInterval || RATE_INTERVALS[settings.rate][1]
      );
      if (strikeBtn) {
        strikeBtn.classList.remove('flash');
        void strikeBtn.offsetWidth;
        strikeBtn.classList.add('flash');
      }
      return;
    }

    const x = clamp(px != null ? px : rand(W * .43, W * .69), W * .2, W * .8);
    const topY = rand(H * .10, H * .28);
    const groundY = HORIZON + rand(H * .008, H * .045);
    const endX = x + rand(-W * .055, W * .055);

    // A close strike: main channel, crown crawler, and branches.
    const bolt = makeBolt(x, topY, endX, groundY, (Math.random() * 1e9) | 0, {
      branches: 5 + ((Math.random() * 3) | 0),
      width: 2.0,
      branchMax: H * .26,
      ground: true
    });
    bolt.pulses = [0, .052, .118, .22, .35];
    bolts.push(bolt);

    // Sometimes a second channel answers a heartbeat later.
    if (!opts.single && Math.random() > .45) {
      const x2 = clamp(x + rand(-W * .11, W * .11), W * .18, W * .82);
      const bolt2 = makeBolt(x2, topY + rand(-H * .02, H * .06), x2 + rand(-W * .04, W * .04), groundY, (Math.random() * 1e9) | 0, {
        branches: 2 + ((Math.random() * 2) | 0),
        width: 1.25,
        branchMax: H * .14,
        ground: true
      });
      bolt2.start += .09;
      bolt2.pulses = [0, .07, .18];
      bolts.push(bolt2);
    }

    flashX = x;
    flashY = topY;
    nextStrikeAt = time + rand(
      opts.minInterval || RATE_INTERVALS[settings.rate][0],
      opts.maxInterval || RATE_INTERVALS[settings.rate][1]
    );

    if (strikeBtn) {
      strikeBtn.classList.remove('flash');
      void strikeBtn.offsetWidth;
      strikeBtn.classList.add('flash');
    }
  }

  function triggerSheetLightning() {
    if (PREVIEW) return;
    if (PHOTO_MODE) {
      triggerStrike(null, { single: true });
      return;
    }
    const x = rand(W * .28, W * .82);
    const y = rand(H * .16, H * .34);
    const bolt = makeBolt(x, y, x + rand(-W * .18, W * .18), y + rand(-H * .04, H * .07), (Math.random() * 1e9) | 0, {
      branches: 4,
      width: 1.05,
      branchMax: H * .10,
      ground: false
    });
    bolt.pulses = [0, .06, .16];
    bolt.sheet = true;
    bolts.push(bolt);
    flashX = x;
    flashY = y;
    nextStrikeAt = time + rand(
      RATE_INTERVALS[settings.rate][0] * .8,
      RATE_INTERVALS[settings.rate][1] * .9
    );
  }

  function boltEnergy(bolt, t) {
    const dt = t - bolt.start;
    if (dt < -0.02) return 0;
    if (dt > 1.1) return 0;
    let e = 0;
    for (const p of bolt.pulses) {
      if (dt >= p) e += Math.exp(-(dt - p) * 12.5);
    }
    // Keep the channel faintly visible between return strokes.
    const afterglow = Math.exp(-Math.max(0, dt) * 4.2) * .18;
    return clamp(e * .92 + afterglow, 0, 1.4);
  }

  function updateFlash(t) {
    if (PHOTO_MODE) {
      const dt = t - photoPulse;
      let f = 0;
      if (dt >= 0) {
        for (const p of [0, .052, .118, .22, .35]) {
          if (dt >= p) f += Math.exp(-(dt - p) * 11.5);
        }
      }
      flash = Math.min(.68, f * .68);
      for (const bolt of bolts) bolt.energy = boltEnergy(bolt, t);
      return;
    }

    let f = 0;
    for (const bolt of bolts) {
      const e = boltEnergy(bolt, t);
      bolt.energy = e;
      if (!bolt.sheet) f = Math.max(f, e);
      else f = Math.max(f, e * .55);
    }
    flash = Math.min(1, f);
  }

  // ---------------------------------------------------------------------------
  // Draw scene
  // ---------------------------------------------------------------------------
  function drawSky(t, lf) {
    if (skyCache) sceneCtx.drawImage(skyCache, 0, 0, W, H);

    // Lightning sits behind the cloud deck. A broad vertical band of light
    // is used instead of a radial disc so no circular gradient contour shows
    // against the very dark sky.
    if (lf > .003) {
      let g = sceneCtx.createLinearGradient(flashX - W * .34, 0, flashX + W * .34, 0);
      g.addColorStop(0, 'rgba(120, 155, 185, 0)');
      g.addColorStop(.34, 'rgba(140, 174, 202, ' + (.07 * lf) + ')');
      g.addColorStop(.5, 'rgba(190, 213, 233, ' + (.16 * lf) + ')');
      g.addColorStop(.66, 'rgba(140, 174, 202, ' + (.07 * lf) + ')');
      g.addColorStop(1, 'rgba(120, 155, 185, 0)');
      sceneCtx.fillStyle = g;
      sceneCtx.fillRect(0, 0, W, HORIZON + 2);

      g = sceneCtx.createLinearGradient(0, H * .18, 0, HORIZON);
      g.addColorStop(0, 'rgba(170, 196, 218, 0)');
      g.addColorStop(.55, 'rgba(170, 196, 218, ' + (.045 * lf) + ')');
      g.addColorStop(1, 'rgba(183, 205, 219, ' + (.075 * lf) + ')');
      sceneCtx.fillStyle = g;
      sceneCtx.fillRect(0, H * .18, W, HORIZON - H * .18);
    }

    // A pale tear in the clouds above the horizon gap.
    let g = sceneCtx.createLinearGradient(0, H * .29, 0, HORIZON + 2);
    g.addColorStop(0, 'rgba(172, 193, 194, 0)');
    g.addColorStop(.6, 'rgba(168, 187, 178, ' + (.035 + .10 * lf) + ')');
    g.addColorStop(1, 'rgba(190, 203, 183, ' + (.05 + .08 * lf) + ')');
    sceneCtx.fillStyle = g;
    sceneCtx.beginPath();
    sceneCtx.ellipse(W * .56, H * .60, W * .13, H * .28, -.16, 0, TAU);
    sceneCtx.fill();
  }

  function drawCloudLayer(ctx, layer, t, lf) {
    const drift = layer.kind === 'field'
      ? Math.sin(t * (layer.driftSpeed || .02) + (layer.phase || 0)) * (layer.driftAmp || 0)
      : (layer.speed || 0) * t;
    let x = layer.x + drift;
    const bob = Math.sin(t * (layer.bobSpeed || .13) + (layer.phase || 0)) * (layer.bob || 2);
    const y = layer.y + bob;

    if (layer.kind === 'field') {
      const w = layer.w;
      const h = layer.h;
      ctx.globalAlpha = layer.alpha;
      ctx.drawImage(layer.tex, x, y, w, h);
      ctx.globalAlpha = 1;
      return;
    }

    if (layer.kind === 'veil') {
      const vw = W * 1.45;
      const vh = H * .74;
      const px = ((x % vw) + vw) % vw - vw * .2;
      ctx.globalAlpha = layer.alpha;
      ctx.drawImage(layer.tex, px, y, vw, vh);
      ctx.drawImage(layer.tex, px - vw, y, vw, vh);
      ctx.drawImage(layer.tex, px + vw, y, vw, vh);
      ctx.globalAlpha = 1;
      return;
    }

    const tex = layer.tex;
    const w = layer.w;
    const h = w * (tex.height / tex.width);
    const drawX = x;
    const drawY = y;

    ctx.globalAlpha = layer.alpha;
    if (layer.rotation) {
      ctx.save();
      ctx.translate(drawX + w * .5, drawY + h * .5);
      ctx.rotate(layer.rotation);
      ctx.drawImage(tex, -w * .5, -h * .5, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(tex, drawX, drawY, w, h);
    }

    // Lightning kisses the nearest edge of a bank. The baked rim means the
    // highlight follows every billow without any per-frame edge detection.
    if (lf > .02 && layer.reactive && tex.rim) {
      const dx = (flashX - (drawX + w * .5)) / (w * .6);
      const dy = (flashY - (drawY + h * .5)) / (h * .7);
      const prox = clamp(1 - Math.sqrt(dx * dx + dy * dy), 0, 1);
      if (prox > .01) {
        ctx.globalCompositeOperation = 'screen';
        ctx.save();
        ctx.shadowColor = 'rgba(154, 190, 228, .9)';
        ctx.shadowBlur = 22 * (W / 1600);
        ctx.globalAlpha = .52 * lf * (0.35 + prox * .65);
        ctx.drawImage(tex.rim, drawX, drawY, w, h);
        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawClouds(t, lf) {
    for (const layer of cloudLayers) {
      drawCloudLayer(sceneCtx, layer, t, lf);
    }

    // Drifting soft masses. No edges, only volume.
    sceneCtx.save();
    for (const w of cloudWisps) {
      const x = ((w.x + t * w.speed) % (W + w.w * 2)) - w.w;
      const y = w.y + Math.sin(t * .11 + w.phase) * H * .012;
      const a = w.alpha * (0.8 + 0.2 * Math.sin(t * .08 + w.phase));
      sceneCtx.save();
      sceneCtx.translate(x, y);
      sceneCtx.scale(1, w.h / w.w);
      const g = sceneCtx.createRadialGradient(0, 0, 0, 0, 0, w.w);
      g.addColorStop(0, rgba(w.tint[0], w.tint[1], w.tint[2], a));
      g.addColorStop(.55, rgba(w.tint[0], w.tint[1], w.tint[2], a * .55));
      g.addColorStop(1, rgba(w.tint[0], w.tint[1], w.tint[2], 0));
      sceneCtx.fillStyle = g;
      sceneCtx.fillRect(-w.w, -w.w, w.w * 2, w.w * 2);
      sceneCtx.restore();
    }
    sceneCtx.restore();
  }

  function drawRain(ctx, dt) {
    if (dt <= 0) return;
    const s = WIND_STRENGTH[settings.wind];
    const slant = .20 * s;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Two passes of rain, far and near.
    for (let pass = 0; pass < 2; pass++) {
      const near = pass === 1;
      ctx.beginPath();
      for (const d of rainDrops) {
        if (d.near !== near) continue;
        const x = d.x;
        const y = d.y;
        ctx.moveTo(x, y);
        ctx.lineTo(x + d.len * slant, y + d.len);
      }
      ctx.strokeStyle = near ? 'rgba(174, 197, 209, .19)' : 'rgba(148, 173, 188, .08)';
      ctx.lineWidth = near ? 1.1 : .55;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBolts(t, lf) {
    if (!bolts.length) return;
    const bw = bloomCanvas.width;
    const bh = bloomCanvas.height;
    const scale = bw / W;

    fxCtx.globalCompositeOperation = 'lighter';
    bloomCtx.globalCompositeOperation = 'lighter';

    for (const bolt of bolts) {
      const e = bolt.energy;
      if (e <= .01) continue;
      const alpha = clamp(e, 0, 1);
      const pulse = .82 + .18 * Math.sin((t - bolt.start) * 70 + bolt.seed * .01);
      const a = alpha * pulse;

      for (const path of bolt.paths) {
        const pts = path.pts;
        const isMain = path === bolt.paths[0];
        const photo = !!bolt.photo;
        const w = path.width * (isMain ? 1 : .72);

        // Wide atmospheric glow.
        fxCtx.beginPath();
        fxCtx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) fxCtx.lineTo(pts[i].x, pts[i].y);
        fxCtx.strokeStyle = 'rgba(122, 166, 236, ' + (.11 * a * path.alpha) + ')';
        fxCtx.lineWidth = w * (isMain ? (photo ? 7.5 : 14) : (photo ? 4 : 8));
        fxCtx.stroke();

        // Blue-white halo.
        fxCtx.beginPath();
        fxCtx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) fxCtx.lineTo(pts[i].x, pts[i].y);
        fxCtx.strokeStyle = 'rgba(187, 214, 255, ' + (.40 * a * path.alpha) + ')';
        fxCtx.lineWidth = w * (isMain ? (photo ? 2.1 : 3.8) : (photo ? 1.25 : 2.2));
        fxCtx.stroke();

        // Core.
        fxCtx.beginPath();
        fxCtx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) fxCtx.lineTo(pts[i].x, pts[i].y);
        fxCtx.strokeStyle = 'rgba(244, 249, 255, ' + (.96 * a * path.alpha) + ')';
        fxCtx.lineWidth = w * (isMain ? (photo ? .86 : 1.12) : (photo ? .52 : .7));
        fxCtx.stroke();

        // Bloom pass.
        bloomCtx.beginPath();
        bloomCtx.moveTo(pts[0].x * scale, pts[0].y * scale);
        for (let i = 1; i < pts.length; i++) {
          bloomCtx.lineTo(pts[i].x * scale, pts[i].y * scale);
        }
        bloomCtx.strokeStyle = 'rgba(168, 202, 255, ' + (.32 * a * path.alpha) + ')';
        bloomCtx.lineWidth = Math.max(2, w * (isMain ? (photo ? 5 : 9) : (photo ? 3 : 5)) * scale);
        bloomCtx.stroke();
      }
    }

    fxCtx.globalCompositeOperation = 'source-over';
    bloomCtx.globalCompositeOperation = 'source-over';
  }

  function drawFlash(t) {
    const lf = flash;
    if (lf <= .004) return;

    fxCtx.save();
    fxCtx.globalCompositeOperation = 'screen';

    // Screen-wide lift.
    fxCtx.fillStyle = 'rgba(123, 154, 199, ' + (.06 * lf) + ')';
    fxCtx.fillRect(0, 0, W, H);

    if (PHOTO_MODE) {
      // Local lift for the photograph: a wide vertical band, no circular
      // gradient contour in the dark cloud deck.
      const band = fxCtx.createLinearGradient(flashX - W * .28, 0, flashX + W * .28, 0);
      band.addColorStop(0, 'rgba(160, 188, 218, 0)');
      band.addColorStop(.36, 'rgba(174, 200, 226, ' + (.06 * lf) + ')');
      band.addColorStop(.5, 'rgba(206, 224, 242, ' + (.17 * lf) + ')');
      band.addColorStop(.64, 'rgba(174, 200, 226, ' + (.06 * lf) + ')');
      band.addColorStop(1, 'rgba(160, 188, 218, 0)');
      fxCtx.fillStyle = band;
      fxCtx.fillRect(0, 0, W, H * .72);
    }

    // The horizon answers with a thin band of reflected light.
    let g = fxCtx.createLinearGradient(0, HORIZON - H * .06, 0, HORIZON + H * .15);
    g.addColorStop(0, 'rgba(163, 186, 192, 0)');
    g.addColorStop(.5, 'rgba(163, 186, 192, ' + (.09 * lf) + ')');
    g.addColorStop(1, 'rgba(163, 186, 192, 0)');
    fxCtx.fillStyle = g;
    fxCtx.fillRect(0, HORIZON - H * .06, W, H * .22);

    // The cloud base glows around the channel root.
    for (const bolt of bolts) {
      if (bolt.energy <= .02) continue;
      const a = clamp(bolt.energy, 0, 1);
      const gx = bolt.x;
      const gy = bolt.y;
      const g2 = fxCtx.createRadialGradient(gx, gy, 0, gx, gy, W * .16);
      g2.addColorStop(0, 'rgba(188, 212, 245, ' + (.12 * a) + ')');
      g2.addColorStop(.45, 'rgba(130, 166, 215, ' + (.05 * a) + ')');
      g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
      fxCtx.fillStyle = g2;
      fxCtx.fillRect(0, 0, W, H);
    }

    // Ground contact bloom and a few flying sparks.
    for (const bolt of bolts) {
      if (!bolt.ground || bolt.energy <= .02) continue;
      const ex = bolt.endX;
      const ey = bolt.endY;
      const a = clamp(bolt.energy, 0, 1);
      const g2 = fxCtx.createRadialGradient(ex, ey, 0, ex, ey, W * .055);
      g2.addColorStop(0, 'rgba(225, 240, 255, ' + (.42 * a) + ')');
      g2.addColorStop(.18, 'rgba(170, 205, 255, ' + (.20 * a) + ')');
      g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
      fxCtx.fillStyle = g2;
      fxCtx.fillRect(0, 0, W, H);

      fxCtx.strokeStyle = 'rgba(205, 228, 255, ' + (.55 * a) + ')';
      fxCtx.lineWidth = 1;
      for (let i = 0; i < 7; i++) {
        const ang = -Math.PI * .5 + (Math.random() - .5) * 2.2;
        const len = W * (.008 + Math.random() * .026);
        fxCtx.beginPath();
        fxCtx.moveTo(ex, ey);
        fxCtx.lineTo(ex + Math.cos(ang) * len, ey + Math.sin(ang) * len * .55);
        fxCtx.stroke();
      }
    }

    fxCtx.restore();
  }


  // ---------------------------------------------------------------------------
  // Photographic storm (default)
  // ---------------------------------------------------------------------------

  function makeCloudVeilTexture(w, h, seed, light) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    const img = x.createImageData(w, h);
    const data = img.data;
    const n1 = makeValueNoise(seed);
    const n2 = makeValueNoise(seed + 37);
    for (let y = 0; y < h; y++) {
      const v = y / h;
      for (let xx = 0; xx < w; xx++) {
        const u = xx / w;
        const q = fbm(n1, u * 4, v * 2.2, 4) - .5;
        const d = fbm(n1, u * 3.4 + q * 2.4, v * 2.6 + q * 1.5, 5);
        const edge = smoothstep(0, .16, v) * (1 - smoothstep(.72, 1, v)) *
                     smoothstep(0, .10, u) * (1 - smoothstep(.90, 1, u));
        const a = smoothstep(.42, .61, d) * edge;
        if (a < .004) continue;
        const idx = (y * w + xx) * 4;
        data[idx] = light ? 118 : 54;
        data[idx + 1] = light ? 138 : 68;
        data[idx + 2] = light ? 158 : 86;
        data[idx + 3] = a * 255;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  function buildCloudVeils() {
    cloudVeils = [];
    const darkA = makeCloudVeilTexture(640, 320, 9101, false);
    const darkB = makeCloudVeilTexture(640, 320, 4403, false);
    const lit = makeCloudVeilTexture(512, 256, 6607, true);
    cloudVeils = [
      { tex: darkA, x: -W * .20, y: -H * .02, w: W * .92, h: H * .46,
        alpha: .32, speed: 19.0, phase: .3, rot: -.025, light: false },
      { tex: darkB, x: W * .24, y: H * .01, w: W * .86, h: H * .43,
        alpha: .27, speed: -14.0, phase: 2.1, rot: .018, light: false },
      { tex: lit, x: W * .10, y: H * .06, w: W * .66, h: H * .33,
        alpha: .18, speed: 25.0, phase: 4.4, rot: -.012, light: true },
      { tex: darkA, x: W * .55, y: H * .36, w: W * .52, h: H * .22,
        alpha: .24, speed: 34.0, phase: 1.4, rot: .015, light: false }
    ];
  }

  function drawCloudVeils(t) {
    for (const v of cloudVeils) {
      const x = ((v.x + t * v.speed) % (W + v.w * 1.6)) - v.w * .8;
      const y = v.y + Math.sin(t * .09 + v.phase) * H * .012;
      const a = v.alpha * (.82 + .18 * Math.sin(t * .13 + v.phase));
      sceneCtx.save();
      sceneCtx.globalAlpha = a;
      sceneCtx.globalCompositeOperation = v.light ? 'screen' : 'multiply';
      sceneCtx.translate(x + v.w * .5, y + v.h * .5);
      sceneCtx.rotate(v.rot + Math.sin(t * .021 + v.phase) * .012);
      sceneCtx.drawImage(v.tex, -v.w * .5, -v.h * .5, v.w, v.h);
      sceneCtx.restore();
    }
    sceneCtx.globalAlpha = 1;
    sceneCtx.globalCompositeOperation = 'source-over';
  }


  function buildBoltMask() {
    if (!bgReady) return;
    const MW = 1920, MH = 1080;
    const src = document.createElement('canvas');
    src.width = MW;
    src.height = MH;
    const sx = src.getContext('2d');
    sx.drawImage(bgImage, 0, 0, MW, MH);
    const srcData = sx.getImageData(0, 0, MW, MH).data;

    // A very cheap low-frequency luminance field. Subtracting it leaves the
    // thin, high-contrast strokes of the existing lightning.
    const sw = 240, sh = 135;
    const small = document.createElement('canvas');
    small.width = sw;
    small.height = sh;
    const smx = small.getContext('2d');
    smx.drawImage(src, 0, 0, sw, sh);
    const smData = smx.getImageData(0, 0, sw, sh).data;
    const blurLum = new Float32Array(sw * sh);
    for (let i = 0; i < sw * sh; i++) {
      blurLum[i] = .2126 * smData[i * 4] + .7152 * smData[i * 4 + 1] + .0722 * smData[i * 4 + 2];
    }

    const mask = document.createElement('canvas');
    mask.width = MW;
    mask.height = MH;
    const mx = mask.getContext('2d');
    const out = mx.createImageData(MW, MH);
    const data = out.data;
    const yLimit = Math.floor(MH * .52);

    for (let y = 0; y < yLimit; y++) {
      const by = Math.min(sh - 1, (y * sh / MH) | 0);
      for (let x = 0; x < MW; x++) {
        const idx = (y * MW + x) * 4;
        const r = srcData[idx], g = srcData[idx + 1], b = srcData[idx + 2];
        const lum = .2126 * r + .7152 * g + .0722 * b;
        const bx = Math.min(sw - 1, (x * sw / MW) | 0);
        const detail = lum - blurLum[by * sw + bx];
        if (lum < 165 || detail < 14) continue;
        const a = clamp((detail - 14) * 8 + (lum - 165) * 2.0, 0, 255);
        if (a < 16) continue;
        data[idx] = 222;
        data[idx + 1] = 234;
        data[idx + 2] = 255;
        data[idx + 3] = a;
      }
    }
    mx.putImageData(out, 0, 0);

    // A soft halo plus the sharp channel.
    const glowSmall = document.createElement('canvas');
    glowSmall.width = 240;
    glowSmall.height = 135;
    const gs = glowSmall.getContext('2d');
    gs.drawImage(mask, 0, 0, 240, 135);

    const glow = document.createElement('canvas');
    glow.width = MW;
    glow.height = MH;
    const gx = glow.getContext('2d');
    gx.imageSmoothingEnabled = true;
    gx.imageSmoothingQuality = 'high';
    gx.drawImage(glowSmall, 0, 0, MW, MH);
    gx.globalCompositeOperation = 'lighter';
    gx.globalAlpha = .92;
    gx.drawImage(mask, 0, 0);
    gx.globalAlpha = 1;
    gx.globalCompositeOperation = 'source-over';
    boltMaskSprite = glow;
  }

  function buildPhotoGrass() {
    grassLayers = [];
    const rnd = mulberry32(7721);
    const layers = [
      {
        count: Math.round((Math.min(W, 1920) / 1920) * 300),
        y0: H * .76, y1: H * .87,
        len0: 18, len1: 64,
        colors: ['#0d1a12', '#111f16', '#15251a'],
        alpha: .48, flex: .8, lean: .2
      },
      {
        count: Math.round((Math.min(W, 1920) / 1920) * 220),
        y0: H * .84, y1: H * .97,
        len0: 35, len1: 135,
        colors: ['#08110c', '#0b1710', '#0f1d14'],
        alpha: .72, flex: 1, lean: .26
      },
      {
        count: Math.round((Math.min(W, 1920) / 1920) * 90),
        y0: H * .93, y1: H * 1.05,
        len0: 60, len1: 230,
        colors: ['#040906', '#061009', '#08140d'],
        alpha: .96, flex: 1.2, lean: .3
      }
    ];

    for (const layer of layers) {
      const groups = layer.colors.map(() => []);
      for (let i = 0; i < layer.count; i++) {
        const y = lerp(layer.y0, layer.y1, Math.pow(rnd(), .8));
        const len = lerp(layer.len0, layer.len1, .3 + Math.pow(rnd(), .8) * .7);
        const x = rnd() * (W + 40) - 20;
        const w = Math.max(.55, len * (.018 + rnd() * .024));
        const lean = (rnd() - .4) * layer.lean;
        const phase = rnd() * TAU;
        const colorIndex = (rnd() * layer.colors.length) | 0;
        groups[colorIndex].push(makeBlade(x, y, len, w, lean, phase, layer.colors[colorIndex], layer.flex * (.7 + rnd() * .6)));
      }
      grassLayers.push({ alpha: layer.alpha, groups, colors: layer.colors });
    }
  }

  function preparePhotoFrame(t) {
    if (!photoFrameCtx || !bgReady) return;
    const x = photoFrameCtx;
    x.clearRect(0, 0, W, H);
    const zoom = 1.045 + Math.sin(t * .013) * .012;
    const panX = Math.sin(t * .021) * W * .012;
    const panY = Math.cos(t * .017) * H * .008;
    const scale = Math.max(W / bgImage.width, H / bgImage.height) * zoom;
    const dw = bgImage.width * scale;
    const dh = bgImage.height * scale;
    x.drawImage(bgImage, W * .5 + panX - dw * .5, H * .5 + panY - dh * .5, dw, dh);

    if (maskFrameCtx && boltMaskSprite) {
      const m = maskFrameCtx;
      m.clearRect(0, 0, W, H);
      const mScale = Math.max(W / 1920, H / 1080) * zoom;
      const mw = 1920 * mScale;
      const mh = 1080 * mScale;
      m.drawImage(boltMaskSprite, W * .5 + panX - mw * .5, H * .5 + panY - mh * .5, mw, mh);
    }
  }

  function drawPhotoScene(t) {
    if (!bgReady) {
      sceneCtx.fillStyle = '#020508';
      sceneCtx.fillRect(0, 0, W, H);
      return;
    }

    preparePhotoFrame(t);
    sceneCtx.drawImage(photoFrame, 0, 0, W, H);

    // A very slow horizontal ripple through the upper sky. The ground stays
    // still, so the cloud deck appears to breathe without the horizon drifting.
    const strip = 8;
    const warpH = H * .56;
    for (let y = 0; y < warpH; y += strip) {
      const fade = 1 - smoothstep(warpH * .56, warpH, y);
      const off = (Math.sin(t * .14 + y * .017) * 8.4 +
                   Math.sin(t * .061 + y * .006) * 3.4) * fade;
      const oy = Math.sin(t * .11 + y * .021) * 1.6 * fade;
      const sh = Math.min(strip + .5, warpH - y + .5);
      sceneCtx.drawImage(photoFrame, 0, y, W, sh, off, y + oy, W, sh + 1.6);
    }

    drawCloudVeils(t);

    // Animate the lightning already in the photograph: its own channel and
    // the cold cloud edges around it flare in return strokes.
    if (boltMaskSprite && maskFrame && flash > .008) {
      const spark = .56 + .44 * Math.sin((t - photoPulse) * 92);
      const a = clamp(flash * 2.45, 0, 1) * spark;
      sceneCtx.save();
      sceneCtx.globalCompositeOperation = 'screen';
      sceneCtx.globalAlpha = a;
      const strip2 = 8;
      const warpH2 = H * .56;
      for (let y = 0; y < warpH2; y += strip2) {
        const fade = 1 - smoothstep(warpH2 * .56, warpH2, y);
        const off = (Math.sin(t * .14 + y * .017) * 8.4 +
                     Math.sin(t * .061 + y * .006) * 3.4) * fade;
        const oy = Math.sin(t * .11 + y * .021) * 1.6 * fade;
        const sh = Math.min(strip2 + .5, warpH2 - y + .5);
        sceneCtx.drawImage(maskFrame, 0, y, W, sh, off, y + oy, W, sh + 1.6);
      }
      sceneCtx.drawImage(maskFrame, 0, warpH2, W, H - warpH2);
      sceneCtx.restore();
    }

    // Heavy top, wet bottom. Keeps the HUD legible and the grass anchored.
    let g = sceneCtx.createLinearGradient(0, 0, 0, H * .48);
    g.addColorStop(0, 'rgba(0, 3, 7, .42)');
    g.addColorStop(.55, 'rgba(0, 3, 7, .12)');
    g.addColorStop(1, 'rgba(0, 3, 7, 0)');
    sceneCtx.fillStyle = g;
    sceneCtx.fillRect(0, 0, W, H * .5);

    g = sceneCtx.createLinearGradient(0, H * .76, 0, H);
    g.addColorStop(0, 'rgba(0, 4, 3, 0)');
    g.addColorStop(.62, 'rgba(0, 4, 3, .20)');
    g.addColorStop(1, 'rgba(0, 4, 3, .66)');
    sceneCtx.fillStyle = g;
    sceneCtx.fillRect(0, H * .76, W, H * .24);

    // Cloud shadows sliding over the plain.
    sceneCtx.save();
    sceneCtx.beginPath();
    sceneCtx.rect(0, H * .56, W, H * .44);
    sceneCtx.clip();
    for (let i = 0; i < 2; i++) {
      const cx = ((t * 13 + i * W * .46) % (W + W * .9)) - W * .45;
      const cy = H * (.72 + i * .035);
      const rx = W * .38;
      const ry = H * .075;
      const sg = sceneCtx.createRadialGradient(cx, cy, 0, cx, cy, rx);
      sg.addColorStop(0, 'rgba(0, 6, 4, .15)');
      sg.addColorStop(.6, 'rgba(0, 6, 4, .06)');
      sg.addColorStop(1, 'rgba(0, 6, 4, 0)');
      sceneCtx.save();
      sceneCtx.translate(cx, cy);
      sceneCtx.scale(1, ry / rx);
      sceneCtx.translate(-cx, -cy);
      sceneCtx.fillStyle = sg;
      sceneCtx.fillRect(cx - rx, cy - rx, rx * 2, rx * 2);
      sceneCtx.restore();
    }
    sceneCtx.restore();

    // Low mist drifting across the middle distance.
    sceneCtx.save();
    sceneCtx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 2; i++) {
      const mx = ((t * 8 + i * W * .55) % (W + W * .8)) - W * .4;
      const mg = sceneCtx.createLinearGradient(mx, 0, mx + W * .62, 0);
      mg.addColorStop(0, 'rgba(150, 174, 178, 0)');
      mg.addColorStop(.38, 'rgba(158, 180, 182, ' + (.026 + i * .008) + ')');
      mg.addColorStop(.62, 'rgba(140, 162, 166, ' + (.018 + i * .006) + ')');
      mg.addColorStop(1, 'rgba(150, 174, 178, 0)');
      sceneCtx.fillStyle = mg;
      sceneCtx.fillRect(mx, H * .50, W * .62, H * .22);
    }
    sceneCtx.restore();

    drawGrass(sceneCtx, t, flash);
  }

  function drawScene(t) {
    if (PHOTO_MODE) {
      drawPhotoScene(t);
      return;
    }
    if (!skyCache) return;
    sceneCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sceneCtx.clearRect(0, 0, W, H);

    drawSky(t, flash);
    drawClouds(t, flash);

    // A last veil of light in front of the cloud deck, confined to a soft
    // vertical band so no circular gradient contour is visible.
    if (flash > .01) {
      sceneCtx.save();
      sceneCtx.globalCompositeOperation = 'screen';
      const band = sceneCtx.createLinearGradient(flashX - W * .27, 0, flashX + W * .27, 0);
      band.addColorStop(0, 'rgba(150, 180, 210, 0)');
      band.addColorStop(.38, 'rgba(165, 193, 220, ' + (.035 * flash) + ')');
      band.addColorStop(.5, 'rgba(192, 214, 238, ' + (.075 * flash) + ')');
      band.addColorStop(.62, 'rgba(165, 193, 220, ' + (.035 * flash) + ')');
      band.addColorStop(1, 'rgba(150, 180, 210, 0)');
      sceneCtx.fillStyle = band;
      sceneCtx.fillRect(0, 0, W, H * .76);
      sceneCtx.restore();
    }

    // A heavy, cold ceiling. The field texture provides the structure; this
    // gradient gives the top of the sky its oppressive weight.
    let ceiling = sceneCtx.createLinearGradient(0, 0, 0, H * .58);
    ceiling.addColorStop(0, 'rgba(0, 3, 7, .36)');
    ceiling.addColorStop(.45, 'rgba(0, 3, 7, .18)');
    ceiling.addColorStop(1, 'rgba(0, 3, 7, 0)');
    sceneCtx.fillStyle = ceiling;
    sceneCtx.fillRect(0, 0, W, H * .58);

    // The land is opaque; draw it after the sky so the clouds never leak below
    // the horizon line.
    if (landCache) sceneCtx.drawImage(landCache, 0, 0, W, H);

    // Broad, soft undulations give the plain some depth.
    sceneCtx.save();
    sceneCtx.beginPath();
    sceneCtx.rect(0, HORIZON - 2, W, H - HORIZON + 2);
    sceneCtx.clip();
    for (let i = 0; i < 3; i++) {
      const cx = W * (.18 + i * .33);
      const cy = H * (.84 + i * .045);
      const rx = W * (.38 + i * .08);
      const ry = H * (.11 + i * .025);
      const g = sceneCtx.createRadialGradient(cx, cy, 0, cx, cy, rx);
      g.addColorStop(0, 'rgba(2, 7, 4, ' + (.15 + i * .03) + ')');
      g.addColorStop(.55, 'rgba(2, 7, 4, ' + (.07 + i * .02) + ')');
      g.addColorStop(1, 'rgba(2, 7, 4, 0)');
      sceneCtx.save();
      sceneCtx.translate(cx, cy);
      sceneCtx.scale(1, ry / rx);
      sceneCtx.translate(-cx, -cy);
      sceneCtx.fillStyle = g;
      sceneCtx.fillRect(cx - rx, cy - rx, rx * 2, rx * 2);
      sceneCtx.restore();
    }
    sceneCtx.restore();

    // A lone tree anchors the scale of the plain.
    drawTree(sceneCtx, W * .155, HORIZON + H * .013, treeSegments, treeLeaves, 1, t, flash);
    drawTree(sceneCtx, W * .235, HORIZON + H * .009, treeSegmentsSmall, treeLeavesSmall, 1, t * 1.1, flash);
    drawTree(sceneCtx, W * .885, HORIZON + H * .007, treeSegmentsRight, treeLeavesRight, 1, t * .9 + 2, flash);

    drawGrass(sceneCtx, t, flash);
    drawFlowers(sceneCtx, t, flash);
    drawFieldSheen(sceneCtx, t, flash);
  }

  function render(t, dt, options) {
    options = options || {};
    sceneCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxCtx.clearRect(0, 0, W, H);
    bloomCtx.clearRect(0, 0, bloomCanvas.width, bloomCanvas.height);

    drawScene(t);
    drawRain(fxCtx, options.rainDt != null ? options.rainDt : dt);
    drawBolts(t, flash);
    drawFlash(t);
    bloomCanvas.style.visibility = flash > .008 ? 'visible' : 'hidden';

    // A whisper of fine grain breaks up gradient banding in the flash.
    if (flash > .01) {
      const pat = fxCtx.createPattern(cloudNoise, 'repeat');
      fxCtx.save();
      fxCtx.globalAlpha = .035;
      fxCtx.globalCompositeOperation = 'overlay';
      fxCtx.fillStyle = pat;
      fxCtx.fillRect(0, 0, W, H);
      fxCtx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  // Resize and build
  // ---------------------------------------------------------------------------
  function computeDPR() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (settings.quality === 'smooth') return Math.min(dpr, 1);
    if (settings.quality === 'high') return dpr;
    const budget = 6.1e6;
    let s = dpr;
    if (W * H * s * s > budget) s = Math.sqrt(budget / (W * H));
    return clamp(s, .75, 2);
  }

  function setCanvas(canvas, ctx, w, h, scale) {
    canvas.width = Math.max(1, Math.round(w * scale));
    canvas.height = Math.max(1, Math.round(h * scale));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  function buildClouds() {
    // Two seamless fields, one sharp, one soft, plus a high wisp.
    const fieldMain = makeCloudField(1120, 560, 1201, { th: .512, alpha: .98 });
    const fieldSoft = makeCloudField(800, 400, 8803, { th: .535, alpha: .92 });
    const fieldWisp = makeCloudField(560, 280, 4507, { th: .545, alpha: .82 });
    const fieldLit = makeCloudField(960, 480, 3141, { th: .505, alpha: .9, bright: 1.8 });

    cloudLayers = [
      {
        kind: 'field', tex: fieldLit, x: -W * .18, y: -H * .13,
        w: W * 1.4, h: H * 1.0, alpha: .34, speed: 0, bob: 3, bobSpeed: .07,
        driftAmp: W * .045, driftSpeed: .009, phase: .6
      },
      {
        kind: 'field', tex: fieldWisp, x: -W * .20, y: -H * .18,
        w: W * 1.46, h: H * .82, alpha: .16, speed: 0, bob: 2, bobSpeed: .08,
        driftAmp: W * .030, driftSpeed: .026, phase: 1.2
      },
      {
        kind: 'field', tex: fieldSoft, x: -W * .17, y: -H * .11,
        w: W * 1.38, h: H * .96, alpha: .32, speed: 0, bob: 2.4, bobSpeed: .11,
        driftAmp: W * .048, driftSpeed: .018, phase: 3.1
      },
      {
        kind: 'field', tex: fieldMain, x: -W * .16, y: -H * .08,
        w: W * 1.34, h: H * 1.03, alpha: .92, speed: 0, bob: 1.8, bobSpeed: .09,
        driftAmp: W * .058, driftSpeed: .011, phase: 5.4
      }
    ];

    // Soft, borderless wisps. They give the deck a slow, rolling churn and
    // break up the uniform haze of the noise field.
    const R = mulberry32(20481);
    cloudWisps = [];
    for (let i = 0; i < 9; i++) {
      const dark = i < 6;
      cloudWisps.push({
        x: R() * W,
        y: H * (-.08 + R() * .52),
        w: W * (.18 + R() * .30),
        h: H * (.10 + R() * .16),
        speed: 2 + R() * 7,
        phase: R() * TAU,
        alpha: dark ? .10 + R() * .16 : .035 + R() * .065,
        dark,
        tint: dark ? [3, 7, 11] : [76, 96, 116]
      });
    }
    // A heavy shelf of cloud hanging over the top of the frame.
    for (let i = 0; i < 4; i++) {
      cloudWisps.unshift({
        x: W * (-.05 + R() * 1.1),
        y: -H * (.02 + R() * .10),
        w: W * (.38 + R() * .25),
        h: H * (.16 + R() * .12),
        speed: 1 + R() * 2,
        phase: R() * TAU,
        alpha: .20 + R() * .14,
        dark: true,
        tint: [2, 5, 9]
      });
    }
    // A dark mass right above the channel, so the bolt emerges from cloud.
    cloudWisps.unshift({
      x: W * .57, y: H * .06, w: W * .34, h: H * .17,
      speed: 1.2, phase: 2.2, alpha: .30, dark: true, tint: [2, 5, 8]
    });
    // A breath of lit vapour on the near side of the gap.
    cloudWisps.push({
      x: W * .53, y: H * .30, w: W * .22, h: H * .13,
      speed: 2.4, phase: 4.4, alpha: .055, dark: false, tint: [96, 118, 136]
    });
    cloudWisps.sort((a, b) => a.alpha - b.alpha);
  }

  function build() {
    W = Math.max(320, window.innerWidth);
    H = Math.max(240, window.innerHeight);
    HORIZON = PHOTO_MODE ? H * .64 : H * .716;
    DPR = computeDPR();

    setCanvas(sceneCanvas, sceneCtx, W, H, DPR);
    setCanvas(fxCanvas, fxCtx, W, H, DPR);

    const bloomScale = Math.min(.36, Math.sqrt(2.2e5 / (W * H)));
    bloomCanvas.width = Math.max(1, Math.round(W * bloomScale));
    bloomCanvas.height = Math.max(1, Math.round(H * bloomScale));
    bloomCanvas.style.width = W + 'px';
    bloomCanvas.style.height = H + 'px';
    bloomCtx.setTransform(1, 0, 0, 1, 0, 0);

    // Re-seat the active bolts so their coordinates follow the new viewport.
    bolts = [];

    if (PHOTO_MODE) {
      photoFrame = document.createElement('canvas');
      photoFrame.width = W;
      photoFrame.height = H;
      photoFrameCtx = photoFrame.getContext('2d');
      maskFrame = document.createElement('canvas');
      maskFrame.width = W;
      maskFrame.height = H;
      maskFrameCtx = maskFrame.getContext('2d');
      if (bgReady && !boltMaskSprite) buildBoltMask();
      buildPhotoGrass();
      buildCloudVeils();
      buildRain();
      flashX = W * .555;
      flashY = H * .47;
      if (PREVIEW && bgReady) {
        setupPreview();
      } else if (!PREVIEW) {
        nextStrikeAt = time + 1.4;
      }
    } else {
      buildSkyCache();
      buildLandCache();
      buildGrass();
      buildLandDetails();
      buildFlowers();
      buildRain();
      buildClouds();
      flashX = W * .56;
      flashY = H * .2;
      if (PREVIEW) {
        setupPreview();
      } else {
        nextStrikeAt = time + 1.4;
      }
    }
  }

  function setupPreview() {
    if (PHOTO_MODE) {
      if (!bgReady || previewDone) return;
      previewDone = true;
      time = 20;
      flashX = W * .555;
      flashY = H * .47;
      photoPulse = time - .06;
      bolts = [];
      updateFlash(time);
      flash = Math.max(flash, .62);
      render(time, 0, { rainDt: .016 });
      return;
    }
    time = 26.4;
    flashX = W * .575;
    flashY = H * .19;
    bolts = [];
    const bolt = makeBolt(W * .575, H * .155, W * .545, HORIZON + H * .028, 918273, {
      branches: 7, width: 2.4, branchMax: H * .27, ground: true
    });
    bolt.start = time - .085;
    bolt.pulses = [0, .05, .12, .21];
    bolts.push(bolt);
    updateFlash(time);
    // A brighter, more legible flash for the library still.
    flash = .42;
    flashX = W * .575;
    flashY = H * .19;
    render(time, 0, { rainDt: .016 });
  }

  // ---------------------------------------------------------------------------
  // Timer and interactions
  // ---------------------------------------------------------------------------
  function update(dt) {
    time += dt;

    for (const d of rainDrops) {
      const s = WIND_STRENGTH[settings.wind];
      d.y += d.speed * dt;
      d.x += d.speed * .20 * s * dt;
      if (d.y > H + 20) {
        d.y = -20;
        d.x = Math.random() * (W + 200) - 100;
      }
      if (d.x > W + 60) d.x -= W + 120;
    }

    updateFlash(time);

    if (!PREVIEW && time > nextStrikeAt) {
      if (Math.random() < .26) triggerSheetLightning();
      else triggerStrike();
    }

    // Trim dead channels.
    if (bolts.length > 8) bolts = bolts.filter((b) => time - b.start < 1.6).slice(-8);
  }

  function loop(now) {
    if (!started) return;
    if (!lastFrame) lastFrame = now;
    const dt = Math.min(.05, (now - lastFrame) / 1000) || 0;
    const prevTime = time;
    lastFrame = now;

    if (!PREVIEW) {
      update(dt);
    }

    render(time, time - prevTime);
    requestAnimationFrame(loop);
  }

  function applySettingsToUI() {
    for (const b of rateSeg.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.rate === settings.rate);
    }
    for (const b of windSeg.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.wind === settings.wind);
    }
    for (const b of qualitySeg.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.quality === settings.quality);
    }
  }

  function saveSettings() {
    safeStore.set(SETTINGS_KEY, JSON.stringify(settings));
  }

  function setQuality(q) {
    if (settings.quality === q) return;
    settings.quality = q;
    saveSettings();
    applySettingsToUI();
    build();
    if (!PREVIEW) {
      // Keep the scene breathing after a quality switch.
      flash = 0;
    }
  }

  rateSeg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-rate]');
    if (!b) return;
    settings.rate = b.dataset.rate;
    saveSettings();
    applySettingsToUI();
    nextStrikeAt = Math.min(nextStrikeAt, time + 1.1);
  });

  windSeg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-wind]');
    if (!b) return;
    settings.wind = b.dataset.wind;
    saveSettings();
    applySettingsToUI();
  });

  qualitySeg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-quality]');
    if (!b) return;
    setQuality(b.dataset.quality);
  });

  settingsReset.addEventListener('click', () => {
    settings = Object.assign({}, DEFAULTS);
    saveSettings();
    applySettingsToUI();
    build();
    nextStrikeAt = time + 1.2;
  });

  function toggleSettings(force) {
    const open = force != null ? force : !settingsPanel.classList.contains('open');
    settingsPanel.classList.toggle('open', open);
    settingsPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleSettings();
  });
  settingsClose.addEventListener('click', () => toggleSettings(false));

  strikeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    triggerStrike(null, { single: true, minInterval: 2.4, maxInterval: 4.2 });
  });

  fsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });

  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest && (e.target.closest('#toolbar') || e.target.closest('#settings'))) return;
    if (settingsPanel.classList.contains('open')) {
      toggleSettings(false);
      return;
    }
    const px = e.clientX / Math.max(W, 1) * W;
    triggerStrike(px, { single: false });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      triggerStrike(null, { single: true, minInterval: 2.4, maxInterval: 4.2 });
    } else if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen && document.exitFullscreen();
    } else if (e.key === 'h' || e.key === 'H') {
      ui.classList.toggle('hidden');
    } else if (e.key === 'Escape') {
      toggleSettings(false);
    }
  });

  window.addEventListener('pointermove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2600);
  }, { passive: true });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      build();
      if (!PREVIEW) nextStrikeAt = Math.max(nextStrikeAt, time + 1.2);
    }, 120);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      lastFrame = 0;
    } else {
      lastFrame = 0;
    }
  });

  // ---------------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------------
  applySettingsToUI();
  build();

  if (PREVIEW) {
    started = true;
    render(time, 0, { rainDt: 0 });
    requestAnimationFrame(() => {
      curtain.classList.add('ready');
      render(time, 0, { rainDt: .016 });
    });
  } else {
    nextStrikeAt = time + 1.6;
    requestAnimationFrame((now) => {
      started = true;
      lastFrame = now;
      render(time, 0);
      requestAnimationFrame(loop);
      setTimeout(() => curtain.classList.add('ready'), 180);
      hintTimer = setTimeout(() => hint.classList.add('gone'), 7600);
    });
  }
})();
</script>
</body>
</html>
