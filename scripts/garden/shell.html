<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聽雨園 · 掌上江南</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#d5d9cc;color:#34463c;font-family:"Microsoft YaHei",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.title{position:fixed;left:5%;top:7%;pointer-events:none;transition:opacity 2s}.title .eyebrow{font:10px/2 Georgia,serif;letter-spacing:4px;opacity:.6}.title h1{font:38px/1.5 KaiTi,STKaiti,serif;letter-spacing:10px;margin:7px 0 12px}.title p{font:12px/2 SimSun,serif;letter-spacing:4px;margin:0}.seal{display:inline-block;color:#a4533f;border:1px solid #a4533f;padding:3px 5px;font:11px SimSun,serif;letter-spacing:2px;margin-top:16px}.title.dim{opacity:0}.controls{position:fixed;right:28px;bottom:25px}button,select,input{font:inherit}button,select{border:1px solid #82918066;background:#f0efdfde;color:#344b3d;border-radius:5px;padding:9px 14px}button{cursor:pointer}button:hover,button:focus-visible{background:#fff9e6;outline:1px solid #7d9179}#settings{opacity:.5}.controls:hover #settings,#settings:focus-visible{opacity:1}#panel{position:absolute;right:0;bottom:48px;width:264px;background:#f0efdfef;border:1px solid #91a18c66;padding:20px;border-radius:9px;box-shadow:0 8px 40px #293d3122}#panel[hidden]{display:none}#panel header{font:20px KaiTi,serif;letter-spacing:4px;margin-bottom:20px}label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;margin:18px 0}input[type=range]{width:120px;accent-color:#607e60}input[type=checkbox]{accent-color:#607e60}select{padding:5px;font-size:12px}footer{display:flex;gap:7px}footer button{font-size:12px;flex:1;padding:8px 6px}.hint{font-size:10px;line-height:1.9;opacity:.65;margin-bottom:0}.hud-off .title,.hud-off .controls{display:none}#error{position:fixed;inset:30% 15%;padding:30px;background:#eee9d7;text-align:center;line-height:2}#error[hidden]{display:none}@media(max-width:600px){.title{top:4%;left:7%}.title h1{font-size:28px}.title .eyebrow{font-size:8px}.controls{right:16px;bottom:18px}}
</style></head><body>
<style>#panel{max-height:calc(100vh - 100px);overflow-y:auto}</style>
<canvas id="view" aria-label="可旋轉縮放的中式園林三維微縮沙盤"></canvas>
<div class="title" id="title"><div class="eyebrow">A GARDEN IN MINIATURE</div><h1>聽雨園</h1><p>咫尺山水 · 掌上江南</p><span class="seal">園 林 小 築</span></div>
<div class="controls"><button id="settings" aria-expanded="false" aria-controls="panel">觀園</button><section id="panel" hidden><header>園中小憩</header>
<label>細看園景<select id="viewpoint"><option value="garden">全園沙盤</option><option value="architecture">檐下木構</option><option value="trees">松風花徑</option><option value="rock">太湖疊石</option><option value="fishing">臨池垂釣</option><option value="chess">亭中對弈</option><option value="residents">漢服遊園</option><option value="sunflowers">葵田聽風</option><option value="nest">簷下歸燕</option><option value="water">水榭倒影</option><option value="courtyard">庭犬嬉遊</option><option value="cat">瓦上眠貓</option><option value="lotus">荷塘蜻蜓</option></select></label>
<label>顯示亭頂<input id="roof" type="checkbox" checked></label>
<label>天光<select id="weather"><option value="clear">清晨暖光</option><option value="mist">煙水薄霧</option><option value="rain">江南細雨</option></select></label><label>緩慢環繞<input id="orbit" type="checkbox"></label><label>草木風動<input id="wind" type="range" min="0" max="2" value="1" step="0.1"></label><label>時間流速<input id="speed" type="range" min="0.25" max="2" value="1" step="0.05"></label><footer><button id="pause">暫停</button><button id="reset">復位</button><button id="fullscreen">全屏</button></footer><p class="hint">拖動旋轉 · 滾輪縮放 · 雙指縮放<br>Space 暫停 · H 隱藏界面 · F 全屏<br>方向鍵轉動視角 · ＋ / － 縮放</p></section></div>
