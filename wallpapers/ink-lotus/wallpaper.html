  function createFishes() {
    fishes = [];
    const baseAngle = simRnd() * TAU;
    for (let i = 0; i < FISH_COUNT; i++) {
      const a = baseAngle + i * 2.399963;
      const ring = Math.floor(i / 5);
      const radius = i === 0 ? 0 : (52 + (i % 5) * 34 + ring * 46) * S;
      let x = W * .5 + Math.cos(a) * radius;
      let y = H * .47 + Math.sin(a) * radius;
      x = clamp(x, 90 * S, W - 90 * S);
      y = clamp(y, 90 * S, H - 90 * S);
      // A spectrum from small, quick fish to a couple of broad, slower ones.
      const sizeFactor = .68 + .62 * Math.pow(simRnd(), 1.35);
      const len = FISH_LENGTH_BASE * S * sizeFactor;
      const pace = clamp(1.16 - sizeFactor * .28 + (simRnd() - .5) * .26, .70, 1.26);
      const palette = PALETTES[i % PALETTES.length];
      const fish = {
        id: i,
        x,
        y,
        angle: -.42 + (simRnd() - .5) * .7,
        speed: 68 * S * pace,
        len,
        pace,
        palette,
        phase: simRnd() * TAU,
        tailPhase: simRnd() * TAU,
        turn: 0,
        depth: .2 + simRnd() * .7,
        affinity: .82 + simRnd() * .34,
        alpha: .84 + simRnd() * .16,
        rippleTimer: 1 + simRnd() * 2.5,
        bubbleTimer: 2.5 + simRnd() * 7,
        bubbleBurst: 0,
        bubbleBurstTimer: 0,
        eyeBubble: .90 + simRnd() * .24,
        wanderSeed: Math.floor(simRnd() * 10000),
        waypoint: { x: W * .5, y: H * .5 },
        waypointTimer: 4 + simRnd() * 4,
        turnVel: 0,
        avoidUrgency: 0,
        avoidObs: null,
        avoidSide: 0,
        avoidTimer: 0,
        stuckTime: 0,
        escapeTimer: 0,
        escapeAngle: 0,
        offscreenTime: 0,
        blobs: []
      };

      // If the spiral lands on a leaf, start this fish at the nearest open
      // patch instead of letting it begin inside an obstacle.
      let valid = true;
      for (const obs of obstacles) {
        if (Math.hypot(x - obs.x, y - obs.y) < obs.solid + U * .055) {
          valid = false;
          break;
        }
      }
      if (!valid) {
        const p = findOpenPoint(U * .17, fish);
        fish.x = p.x;
        fish.y = p.y;
      }

      for (let j = 0; j < 4; j++) {
        fish.blobs.push({
          x: (simRnd() - .5) * len * .45,
          y: (simRnd() - .5) * len * .18,
          r: len * (.09 + simRnd() * .17),
          a: .035 + simRnd() * .07,
          pale: simRnd() > .55
        });
      }
      fish.waypoint = findOpenPoint(U * .18, fish);
      fishes.push(fish);
    }

    // Scale the group's speed to the individual fish.
    group.speed = 62 * S;
  }

  function findOpenPoint(minClear = U * .12, ignoreFish = null, awayFrom = null) {
    const margin = Math.max(56, U * .075);
    let best = { x: W * .5, y: H * .5 };
    let bestScore = -Infinity;
    for (let attempt = 0; attempt < 70; attempt++) {
      const x = lerp(margin, W - margin, simRnd());
      const y = lerp(margin, H - margin, simRnd());
      let ok = true;
      for (const obs of obstacles) {
        if (dist2(x, y, obs.x, obs.y) < Math.pow(obs.solid + minClear, 2)) { ok = false; break; }
      }
      if (!ok) continue;
      if (ignoreFish && !segmentClear(ignoreFish.x, ignoreFish.y, x, y, Math.max(U * .06, 60 * S))) continue;
      let score = simRnd() * 40;
      if (awayFrom) score += Math.sqrt(dist2(x, y, awayFrom.x, awayFrom.y));
      for (const f of fishes) {
        if (f === ignoreFish) continue;
        score += Math.min(250, Math.sqrt(dist2(x, y, f.x, f.y))) * .45;
      }
      if (score > bestScore) {
        bestScore = score;
        best = { x, y };
      }
    }
    return best;
  }

  function pickOutsidePoint(f) {
    let best = null;
    let bestScore = -Infinity;
    for (let attempt = 0; attempt < 90; attempt++) {
      const edge = Math.floor(simRnd() * 4);
      const depth = (55 + simRnd() * 230) * S;
      const along = .16 + simRnd() * .68;
      let x, y;
      if (edge === 0) { x = -depth; y = lerp(H * .12, H * .88, along); }
      else if (edge === 1) { x = W + depth; y = lerp(H * .12, H * .88, along); }
      else if (edge === 2) { y = -depth; x = lerp(W * .12, W * .88, along); }
      else { y = H + depth; x = lerp(W * .12, W * .88, along); }

      if (x < WORLD.left + 24 * S || x > WORLD.right - 24 * S
        || y < WORLD.top + 24 * S || y > WORLD.bottom - 24 * S) continue;

      let ok = true;
      for (const obs of obstacles) {
        if (dist2(x, y, obs.x, obs.y) < Math.pow(obs.solid + Math.max(U * .065, 64 * S), 2)) {
          ok = false;
          break;
        }
      }
      if (!ok) continue;
      if (!segmentClear(f.x, f.y, x, y, Math.max(U * .045, 42 * S))) continue;

      // Prefer a nearby edge so the fish can actually cross the frame during
      // this scatter phase, and avoid stacking every exit on one side.
      let score = -Math.hypot(x - f.x, y - f.y) * .35 + simRnd() * 120 * S;
      for (const other of fishes) {
        if (other === f) continue;
        if (other.waypoint) {
          score += Math.min(240, Math.hypot(x - other.waypoint.x, y - other.waypoint.y)) * .12;
        }
      }
      if (score > bestScore) {
        bestScore = score;
        best = { x, y };
      }
    }
    return best;
  }

  function assignScatterWaypoints() {
    const cx = W * .5, cy = H * .47;
    const baseAngle = simRnd() * TAU;
    const outsideCount = Math.min(2, Math.max(1, Math.floor(FISH_COUNT / 4)));
    const order = fishes.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(simRnd() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const outsideSet = new Set(order.slice(0, outsideCount));

    fishes.forEach((f, i) => {
      if (outsideSet.has(i)) {
        const outside = pickOutsidePoint(f);
        if (outside) {
          f.waypoint = outside;
          f.waypointTimer = 4.5 + simRnd() * 4;
          return;
        }
      }

      let chosen = null;
      let bestScore = -Infinity;
      const wantAngle = baseAngle + (i / fishes.length) * TAU + (simRnd() - .5) * .55;
      const wantDist = U * (.24 + simRnd() * .16);
      const wx = cx + Math.cos(wantAngle) * wantDist;
      const wy = cy + Math.sin(wantAngle) * wantDist;

      for (let attempt = 0; attempt < 68; attempt++) {
        let x, y;
        if (attempt < 30) {
          const jitter = attempt < 12 ? .07 : .22;
          x = wx + (simRnd() - .5) * W * jitter;
          y = wy + (simRnd() - .5) * H * jitter;
        } else {
          x = lerp(W * .10, W * .90, simRnd());
          y = lerp(H * .12, H * .88, simRnd());
        }
        x = clamp(x, W * .13, W * .87);
        y = clamp(y, H * .16, H * .84);
        let ok = true;
        for (const obs of obstacles) {
          if (dist2(x, y, obs.x, obs.y) < Math.pow(obs.solid + U * .12, 2)) { ok = false; break; }
        }
        if (!ok) continue;
        if (!segmentClear(f.x, f.y, x, y, Math.max(U * .055, 52 * S))) continue;
        let score = simRnd() * 30;
        for (const other of fishes) {
          if (other === f) continue;
          score += Math.min(320, Math.sqrt(dist2(x, y, other.x, other.y))) * .55;
          if (other.waypoint) score += Math.min(300, Math.sqrt(dist2(x, y, other.waypoint.x, other.waypoint.y))) * .18;
        }
        score -= Math.sqrt(dist2(x, y, f.x, f.y)) * .11;
        if (score > bestScore) {
          bestScore = score;
          chosen = { x, y };
        }
      }
      f.waypoint = chosen || { x: clamp(wx, W * .16, W * .84), y: clamp(wy, H * .18, H * .82) };
      f.waypointTimer = 5 + simRnd() * 5;
    });
  }

  function respawnOffscreenFish(f) {
    let best = null;
    for (let attempt = 0; attempt < 16; attempt++) {
      const edge = Math.floor(simRnd() * 4);
      const d = Math.max(f.len * 1.2, 46 * S) + simRnd() * 32 * S;
      const along = .14 + simRnd() * .72;
      let x, y, angle;
      if (edge === 0) {
        x = -d; y = lerp(H * .12, H * .88, along); angle = 0;
      } else if (edge === 1) {
        x = W + d; y = lerp(H * .12, H * .88, along); angle = Math.PI;
      } else if (edge === 2) {
        y = -d; x = lerp(W * .12, W * .88, along); angle = Math.PI * .5;
      } else {
        y = H + d; x = lerp(W * .12, W * .88, along); angle = -Math.PI * .5;
      }
      let ok = true;
      for (const obs of obstacles) {
        if (dist2(x, y, obs.x, obs.y) < Math.pow(obs.solid + f.len * .55, 2)) { ok = false; break; }
      }
      if (ok) {
        best = { x, y, angle };
        break;
      }
    }
    if (!best) {
      const edge = Math.floor(simRnd() * 4);
      if (edge === 0) best = { x: -f.len, y: H * .5, angle: 0 };
      else if (edge === 1) best = { x: W + f.len, y: H * .5, angle: Math.PI };
      else if (edge === 2) best = { x: W * .5, y: -f.len, angle: Math.PI * .5 };
      else best = { x: W * .5, y: H + f.len, angle: -Math.PI * .5 };
    }
    f.x = best.x;
    f.y = best.y;
    f.angle = angleWrap(best.angle + (simRnd() - .5) * .55);
    f.speed = 72 * S;
    f.turnVel = 0;
    f.offscreenTime = 0;
    f.stuckTime = 0;
    f.escapeTimer = 0;
    f.avoidObs = null;
    f.avoidTimer = 0;
    f.avoidUrgency = 0;
    f.waypoint = findOpenPoint(U * .16, f);
    f.waypointTimer = 5 + simRnd() * 4;
  }

  function updateWind(dt) {
    wind.phase += dt;
    const t = wind.phase;
    const targetAngle = -.5
      + Math.sin(t * .041) * .88
      + Math.sin(t * .017 + 1.7) * .26;
    const gust = Math.pow(Math.max(0, Math.sin(t * .15 + 1.1)), 6);
    const targetStrength = clamp(
      .19 + .09 * Math.sin(t * .083 + 2.1) + .06 * Math.sin(t * .034 + .4) + gust * .20,
      .05, .58
    );
    wind.angle += angleWrap(targetAngle - wind.angle) * (1 - Math.exp(-dt * .34));
    wind.strength += (targetStrength - wind.strength) * (1 - Math.exp(-dt * .55));
    wind.x = Math.cos(wind.angle) * wind.strength;
    wind.y = Math.sin(wind.angle) * wind.strength;
  }

  function updateMood(dt) {
    mood.timer -= dt;
    if (mood.timer <= 0) {
      if (mood.mode === 'school') {
        mood.mode = 'scatter';
        mood.target = 0;
        mood.timer = 8 + simRnd() * 5;
        assignScatterWaypoints();
      } else {
        mood.mode = 'school';
        mood.target = 1;
        mood.timer = 10 + simRnd() * 6;
      }
    }
    mood.intensity += (mood.target - mood.intensity) * (1 - Math.exp(-dt * .52));
  }

  function segmentClear(x0, y0, x1, y1, pad) {
    const dx = x1 - x0, dy = y1 - y0;
    const len2 = dx * dx + dy * dy || 1;
    for (const obs of obstacles) {
      const t = clamp(((obs.x - x0) * dx + (obs.y - y0) * dy) / len2, 0, 1);
      const px = x0 + dx * t;
      const py = y0 + dy * t;
      if (dist2(px, py, obs.x, obs.y) < Math.pow(obs.solid + pad, 2)) return false;
    }
    return true;
  }

  function updateGroup(dt) {
    group.phase += dt;

    // The invisible shoal anchor travels an exact, smooth, wandering ellipse
    // through the open middle of the pond. Setting the path directly (rather
    // than chasing a moving waypoint) removes the feedback loop that used to
    // make the school mill around a fixed patch of water.
    const t = group.phase * .30;
    const cx = W * .46 + Math.sin(group.phase * .031) * W * .022;
    const cy = H * .47 + Math.cos(group.phase * .037) * H * .018;
    const rx = W * .155;
    const ry = H * .125;
    const wobX = W * .011 * Math.sin(t * 1.7);
    const wobY = H * .012 * Math.cos(t * 2.3);

    const x = cx + Math.cos(t) * rx + wobX;
    const y = cy + Math.sin(t) * ry + wobY;

    // Analytic derivative: the fish inherit a genuinely silky heading.
    const dx = -Math.sin(t) * rx * .30
      + Math.cos(t * 1.7) * W * .011 * 1.7 * .30
      + Math.cos(group.phase * .031) * W * .022 * .031;
    const dy = Math.cos(t) * ry * .30
      - Math.sin(t * 2.3) * H * .012 * 2.3 * .30
      - Math.sin(group.phase * .037) * H * .018 * .037;

    group.x = x;
    group.y = y;
    group.angle = Math.atan2(dy, dx);
    group.speed = Math.hypot(dx, dy);
  }

  function fishBodyPoints(f, x, y, angle) {
    const ca = Math.cos(angle), sa = Math.sin(angle);
    const offs = [.56, .25, -.08, -.38, -.64, -.85];
    return offs.map(off => ({
      x: x + ca * off * f.len,
      y: y + sa * off * f.len
    }));
  }

  // The fish is longer behind than in front: these extents keep tails from
  // sweeping through a neighbour's head.
  function fishExtentAlong(f, phi) {
    const rel = angleWrap(phi - f.angle);
    const c = Math.cos(rel), s = Math.sin(rel);
    const along = c >= 0 ? f.len * .55 : f.len * .98;
    const lateral = f.len * .36;
    return Math.hypot(along * c, lateral * s);
  }

  function pairClearance(a, b) {
    const phi = Math.atan2(b.y - a.y, b.x - a.x);
    return fishExtentAlong(a, phi) + fishExtentAlong(b, phi + Math.PI) - 3 * S;
  }

  // Find the nearest obstacle that the fish is about to meet, commit to one
  // side of it, and aim for a point further around its rim. Committing to the
  // side is what stops the old left/right steering flicker near a leaf.
  function findEscapeDirection(f) {
    const margin = f.len * 1.55 + 52 * S;
    const centerAngle = Math.atan2(H * .5 - f.y, W * .5 - f.x);
    let bestAngle = centerAngle;
    let bestScore = -Infinity;
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * TAU + .07;
      const ca = Math.cos(a), sa = Math.sin(a);
      let clear = 560 * S;
      for (const obs of obstacles) {
        const dx = obs.x - f.x, dy = obs.y - f.y;
        const proj = dx * ca + dy * sa;
        if (proj <= 0) continue;
        const rr = obs.solid + f.len * .54 + 18 * S;
        const perp2 = dx * dx + dy * dy - proj * proj;
        if (perp2 < rr * rr) {
          const hit = proj - Math.sqrt(rr * rr - perp2);
          if (hit > 0) clear = Math.min(clear, hit);
        }
      }
      let edge = Infinity;
      if (ca > .001) edge = Math.min(edge, (WORLD.right - margin - f.x) / ca);
      else if (ca < -.001) edge = Math.min(edge, (f.x - WORLD.left - margin) / -ca);
      if (sa > .001) edge = Math.min(edge, (WORLD.bottom - margin - f.y) / sa);
      else if (sa < -.001) edge = Math.min(edge, (f.y - WORLD.top - margin) / -sa);
      clear = Math.min(clear, Math.max(0, edge));
      // Prefer open water toward the middle, but let a clear corridor win.
      let inward = 0;
      if (f.x < margin * 1.5) inward += ca;
      if (f.x > W - margin * 1.5) inward -= ca;
      if (f.y < margin * 1.5) inward += sa;
      if (f.y > H - margin * 1.5) inward -= sa;
      const score = clear + 46 * S * Math.cos(a - centerAngle)
        + inward * 150 * S
        + 12 * S * Math.sin(a * 3.7 + f.phase);
      if (score > bestScore) {
        bestScore = score;
        bestAngle = a;
      }
    }
    return bestAngle;
  }

  function computeAvoidance(f, dt, prefX = 0, prefY = 0) {
    const headX = Math.cos(f.angle);
    const headY = Math.sin(f.angle);
    const navPad = f.len * .52 + 24 * S;
    const lookDist = Math.max(f.len * .95, f.speed * .5);
    const px = f.x + headX * lookDist;
    const py = f.y + headY * lookDist;
    let best = null;
    let bestUrgency = 0;

    for (const obs of obstacles) {
      const dx = f.x - obs.x, dy = f.y - obs.y;
      const d = Math.hypot(dx, dy) || .001;
      const clearance = obs.solid + navPad;
      if (d > clearance + 260 * S) continue;
      const pdx = px - obs.x, pdy = py - obs.y;
      const pd = Math.hypot(pdx, pdy) || .001;
      const horizon = clearance + Math.max(110 * S, f.speed * .95);
      let urgency = Math.max(
        smoothstep(horizon, clearance, d),
        smoothstep(horizon, clearance, pd) * .92
      );
      // An obstacle already well behind the fish should not pull it back.
      const forwardDot = ((obs.x - f.x) * headX + (obs.y - f.y) * headY) / d;
      if (forwardDot < -.2 && d > clearance * 1.01) urgency *= .14;
      if (urgency > bestUrgency) {
        bestUrgency = urgency;
        best = { obs, urgency, clearance, dx, dy, d };
      }
    }

    if (!best || bestUrgency < .025) {
      f.avoidUrgency += (0 - f.avoidUrgency) * (1 - Math.exp(-dt * 3.6));
      f.avoidTimer = Math.max(0, f.avoidTimer - dt);
      if (f.avoidTimer <= 0) f.avoidObs = null;
      return null;
    }

    const obs = best.obs;
    const d = best.d;
    const dx = best.dx, dy = best.dy;
    const baseLen = Math.hypot(prefX, prefY);
    const baseX = baseLen > .01 ? prefX / baseLen : headX;
    const baseY = baseLen > .01 ? prefY / baseLen : headY;
    const nx = dx / d, ny = dy / d;
    const tangX = -ny, tangY = nx;
    const R = best.clearance + 2 * S;
    const inside = 1 - smoothstep(best.clearance * .9, best.clearance * 1.05, d);
    let ax, ay;

    if (d > R * 1.02) {
      // The two tangent points from the fish to the safety circle. Pick the
      // one that points more nearly toward where the fish wants to go.
      const alpha = Math.atan2(dy, dx);
      const beta = Math.acos(clamp(R / d, -1, 1));
      if (f.avoidObs !== obs || f.avoidTimer <= 0) {
        let bestDot = -Infinity;
        let bestSide = f.avoidSide || (f.id % 2 === 0 ? 1 : -1);
        for (const side of [-1, 1]) {
          const ta = alpha + side * beta;
          const tx = obs.x + Math.cos(ta) * R;
          const ty = obs.y + Math.sin(ta) * R;
          const ux = tx - f.x, uy = ty - f.y;
          const ul = Math.hypot(ux, uy) || .001;
          const dot = (ux / ul) * baseX + (uy / ul) * baseY;
          if (dot > bestDot) {
            bestDot = dot;
            bestSide = side;
          }
        }
        f.avoidObs = obs;
        f.avoidSide = bestSide;
      }
      const side = f.avoidSide || 1;
      const ta = alpha + side * beta;
      const tpx = obs.x + Math.cos(ta) * R;
      const tpy = obs.y + Math.sin(ta) * R;
      let ux = tpx - f.x, uy = tpy - f.y;
      let ul = Math.hypot(ux, uy) || .001;
      // Aim past the tangent point, so the fish rounds the leaf rather than
      // orbiting the same spot forever.
      const ext = f.len * 1.7 + 26 * S;
      let bx = tpx + (ux / ul) * ext;
      let by = tpy + (uy / ul) * ext;
      bx = clamp(bx, 38 * S, W - 38 * S);
      by = clamp(by, 38 * S, H - 38 * S);
      ax = (bx - f.x) / (Math.hypot(bx - f.x, by - f.y) || .001);
      ay = (by - f.y) / (Math.hypot(bx - f.x, by - f.y) || .001);
      ax += nx * inside * .55 + baseX * .10;
      ay += ny * inside * .55 + baseY * .10;
    } else {
      // We are already inside the ring; use persistent outward + tangent.
      if (f.avoidObs !== obs || f.avoidTimer <= 0) {
        const turnDot = tangX * baseX + tangY * baseY;
        f.avoidObs = obs;
        f.avoidSide = Math.abs(turnDot) < .06
          ? (f.avoidSide || (f.id % 2 === 0 ? 1 : -1))
          : (turnDot > 0 ? 1 : -1);
      }
      const side = f.avoidSide || 1;
      ax = nx * 1.4 + tangX * side * 1.1 + baseX * .25;
      ay = ny * 1.4 + tangY * side * 1.1 + baseY * .25;
    }

    const al = Math.hypot(ax, ay) || .001;
    ax /= al;
    ay /= al;

    f.avoidTimer = .95;
    f.avoidUrgency += (bestUrgency - f.avoidUrgency) * (1 - Math.exp(-dt * 5.5));
    return {
      x: ax,
      y: ay,
      urgency: f.avoidUrgency,
      obs
    };
  }

  function updateFish(f, dt) {
    const school = mood.intensity * f.affinity;
    const scatter = 1 - mood.intensity;

    // Fish are free to leave the visible frame. If one has been completely
    // outside for too long, quietly re-seed it just beyond an edge so it can
    // swim back into the picture.
    const visible = f.x > -f.len && f.x < W + f.len
      && f.y > -f.len && f.y < H + f.len;
    if (!visible) f.offscreenTime += dt;
    else f.offscreenTime = 0;
    if (f.offscreenTime > 7) respawnOffscreenFish(f);

    let baseX = 0, baseY = 0;

    // Wander, always present but quieter when schooling.
    const ws = f.wanderSeed;
    const wa = noise2(time * .18 + f.phase, ws * .017, 31) * TAU;
    const wanderWeight = .26 + scatter * .58;
    baseX += Math.cos(wa) * wanderWeight;
    baseY += Math.sin(wa) * wanderWeight;

    // Boid schooling: each fish reads the heading, centre and spacing of its
    // neighbours. Alignment keeps them travelling together, cohesion pulls a
    // straggler back toward the local shoal, and the separation force below
    // keeps bodies apart. The slow elliptic anchor is only a weak migration
    // cue; the shoal itself is a real boid flock.
    const perception = (440 + mood.intensity * 150) * S + f.len * .5;
    let avx = 0, avy = 0, cohX = 0, cohY = 0, weightSum = 0;
    for (const other of fishes) {
      if (other === f) continue;
      const dx = other.x - f.x, dy = other.y - f.y;
      const d = Math.hypot(dx, dy);
      if (d < perception) {
        const w = 1 - (d / perception) * .55;
        avx += Math.cos(other.angle) * w;
        avy += Math.sin(other.angle) * w;
        cohX += other.x * w;
        cohY += other.y * w;
        weightSum += w;
      }
    }

    if (school > .02) {
      const schoolW = mood.intensity * f.affinity;
      if (weightSum > 0) {
        // Alignment.
        const al = Math.hypot(avx, avy) || .001;
        baseX += (avx / al) * 1.15 * schoolW;
        baseY += (avy / al) * 1.15 * schoolW;

        // Cohesion.
        const cx = cohX / weightSum - f.x;
        const cy = cohY / weightSum - f.y;
        const cd = Math.hypot(cx, cy) || .001;
        const pull = .85 + .45 * smoothstep(80 * S, 320 * S, cd);
        baseX += (cx / cd) * pull * schoolW;
        baseY += (cy / cd) * pull * schoolW;
      }

      // A weak migrating current, so a lonely fish or the whole flock keeps
      // moving through the pond instead of settling into a stationary ball.
      let gx = group.x - f.x, gy = group.y - f.y;
      const gd = Math.hypot(gx, gy) || .001;
      const lonely = weightSum > 0 ? 1 : 1.55;
      baseX += (gx / gd) * .50 * schoolW * lonely;
      baseY += (gy / gd) * .50 * schoolW * lonely;
      baseX += Math.cos(group.angle) * .28 * schoolW;
      baseY += Math.sin(group.angle) * .28 * schoolW;
    }

    // Scattering: seek a private patch of open water.
    if (scatter > .02) {
      const tx = f.waypoint.x - f.x;
      const ty = f.waypoint.y - f.y;
      const d = Math.hypot(tx, ty) || 1;
      const near = smoothstep(30 * S, 160 * S, d);
      baseX += (tx / d) * (1.45 * scatter) * (.35 + near * .8);
      baseY += (ty / d) * (1.45 * scatter) * (.35 + near * .8);
    }

    // Separation from the other four fish, measured against each fish's
    // long axis so that a tail never sweeps through a neighbour's head.
    let sepUrgency = 0;
    let sepX = 0, sepY = 0;
    for (const other of fishes) {
      if (other === f) continue;
      const ox = f.x - other.x, oy = f.y - other.y;
      const d = Math.hypot(ox, oy) || .001;
      const required = pairClearance(f, other);
      const comfort = required * 1.42;
      if (d < comfort) {
        const w = smoothstep(comfort, required * .96, d);
        sepX += (ox / d) * w * 3.5;
        sepY += (oy / d) * w * 3.5;
        // Slight sideways component stops head-on deadlocks.
        const side = Math.sign(ox * Math.sin(f.angle) - oy * Math.cos(f.angle)) || 1;
        sepX += (-oy / d) * side * w * .62;
        sepY += (ox / d) * side * w * .62;
        sepUrgency = Math.max(sepUrgency, w);
      }
    }

    // Obstacle avoidance is a committed detour, not a left/right vibration.
    const avoid = computeAvoidance(f, dt, baseX, baseY);
    const avoidW = clamp(f.avoidUrgency, 0, 1);

    // If geometry pins a fish in a corner, stop asking it to follow the shoal
    // and let it swim out along the clearest ray it can find.
    if (f.escapeTimer > 0) f.escapeTimer -= dt;
    if (f.speed < 24 * S) f.stuckTime += dt;
    else f.stuckTime = Math.max(0, f.stuckTime - dt * 2.4);
    if (f.stuckTime > .50 && f.escapeTimer <= 0) {
      f.escapeAngle = findEscapeDirection(f);
      f.escapeTimer = 2.0;
      f.stuckTime = 0;
    }
    const escaping = f.escapeTimer > 0;

    let dx, dy;
    if (escaping) {
      const centerAngle = Math.atan2(H * .5 - f.y, W * .5 - f.x);
      dx = Math.cos(f.escapeAngle) * 4.0 + Math.cos(centerAngle) * 1.15 + sepX * .8;
      dy = Math.sin(f.escapeAngle) * 4.0 + Math.sin(centerAngle) * 1.15 + sepY * .8;
      // A plain outward nudge from anything we are touching; no orbit target.
      for (const obs of obstacles) {
        const ox = f.x - obs.x, oy = f.y - obs.y;
        const d = Math.hypot(ox, oy) || .001;
        const safe = obs.solid + f.len * .52 + 22 * S;
        if (d < safe) {
          const w = smoothstep(safe, obs.solid + f.len * .35, d);
          dx += (ox / d) * w * 3.2;
          dy += (oy / d) * w * 3.2;
        }
      }
    } else {
      dx = baseX * (1 - .82 * avoidW) + sepX;
      dy = baseY * (1 - .82 * avoidW) + sepY;
      if (avoid) {
        const push = 2.6 + 4.2 * avoidW;
        dx += avoid.x * push;
        dy += avoid.y * push;
      }
    }

    // Only the far-off outer world has a soft boundary. The visible screen
    // edge is deliberately open, so fish can swim out and later return.
    const m = f.len * 1.4 + 58 * S;
    if (f.x < WORLD.left + m) dx += (1 - (f.x - WORLD.left) / m) * 8.5;
    if (f.x > WORLD.right - m) dx -= (1 - (WORLD.right - f.x) / m) * 8.5;
    if (f.y < WORLD.top + m) dy += (1 - (f.y - WORLD.top) / m) * 8.5;
    if (f.y > WORLD.bottom - m) dy -= (1 - (WORLD.bottom - f.y) / m) * 8.5;

    // Steering. Angular inertia keeps the path fluid instead of snapping
    // toward every new desired direction.
    const desiredAngle = Math.atan2(dy, dx);
    const diff = angleWrap(desiredAngle - f.angle);
    const maxTurnRate = (escaping ? 3.4 : 2.35 + avoidW * 1.35);
    const targetTurnRate = clamp(diff * 3.0, -maxTurnRate, maxTurnRate);
    f.turnVel += (targetTurnRate - f.turnVel) * (1 - Math.exp(-dt * 7.2));
    f.angle += f.turnVel * dt;
    f.angle = angleWrap(f.angle);
    f.turn = clamp(f.turnVel / 2.8, -.7, .7);

    // Speed. Obstacles only trim the pace; they never bring the fish to a
    // stuttering halt.
    // Each fish has its own preferred pace. Small fish tend to be quicker;
    // large fish cruise more slowly, and the Boid flock accommodates both.
    let cruise = 70 * S * f.pace;
    let desiredSpeed;
    if (escaping) {
      desiredSpeed = Math.max(cruise, 96 * S);
    } else if (mood.intensity > .55) {
      const gd = Math.hypot(group.x - f.x, group.y - f.y);
      desiredSpeed = Math.max(group.speed * (.79 + .37 * f.pace), cruise * .72)
        + 4 * S
        + clamp((gd - 280 * S) / (220 * S), 0, 1.4) * 18 * S;
    } else {
      desiredSpeed = cruise * (.76 + (1 - mood.intensity) * .15);
    }
    if (!escaping) {
      desiredSpeed *= 1 - clamp(avoidW * .24 + sepUrgency * .16, 0, .34);
      desiredSpeed *= 1 - clamp(Math.abs(diff) / Math.PI, 0, 1) * .18;
    } else {
      desiredSpeed *= 1 - sepUrgency * .10;
    }
    desiredSpeed = clamp(desiredSpeed, 24 * S, 152 * S);
    f.speed += (desiredSpeed - f.speed) * (1 - Math.exp(-dt * 2.0));

    f.x += Math.cos(f.angle) * f.speed * dt;
    f.y += Math.sin(f.angle) * f.speed * dt;

    // Tail-beat frequency follows effort.
    f.tailPhase += dt * (5.6 + f.speed * .085 + (1 - mood.intensity) * .8);

    // A new private destination now and then while scattered.
    if (mood.intensity < .35) {
      f.waypointTimer -= dt;
      if (f.waypointTimer <= 0 || dist2(f.x, f.y, f.waypoint.x, f.waypoint.y) < Math.pow(56 * S, 2)) {
        f.waypoint = findOpenPoint(U * .16, f, f);
        f.waypointTimer = 5 + simRnd() * 5;
      }
    }
  }

  function separateFishes() {
    const iterations = 3;
    for (let it = 0; it < iterations; it++) {
      for (let i = 0; i < fishes.length; i++) {
        for (let j = i + 1; j < fishes.length; j++) {
          const a = fishes[i], b = fishes[j];
          const min = pairClearance(a, b) + 1.5 * S;
          const dx = b.x - a.x, dy = b.y - a.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < min * min) {
            const d = Math.sqrt(d2) || .001;
            const nx = dx / d, ny = dy / d;
            const push = (min - d) * .62 + .1;
            a.x -= nx * push;
            a.y -= ny * push;
            b.x += nx * push;
            b.y += ny * push;
            a.speed *= .995;
            b.speed *= .995;
          }
        }
      }
    }
  }

  function pushFishOutOfObstacles() {
    for (let iter = 0; iter < 2; iter++) {
      for (const f of fishes) {
        for (const obs of obstacles) {
          const pts = fishBodyPoints(f, f.x, f.y, f.angle);
          let bestPen = 0, pushX = 0, pushY = 0;
          for (const p of pts) {
            const dx = p.x - obs.x, dy = p.y - obs.y;
            const d = Math.hypot(dx, dy) || .001;
            const clear = obs.solid + 6 * S;
            if (d < clear) {
              const pen = clear - d;
              if (pen > bestPen) {
                bestPen = pen;
                pushX = dx / d;
                pushY = dy / d;
              }
            }
          }
          if (bestPen > 0) {
            f.x += pushX * bestPen;
            f.y += pushY * bestPen;
            f.speed *= .992;
          }
        }
      }
    }
  }

  function containFishes() {
    for (const f of fishes) {
      if (f.x < WORLD.left + 6 * S) { f.x = WORLD.left + 6 * S; f.speed *= .99; }
      if (f.x > WORLD.right - 6 * S) { f.x = WORLD.right - 6 * S; f.speed *= .99; }
      if (f.y < WORLD.top + 6 * S) { f.y = WORLD.top + 6 * S; f.speed *= .99; }
      if (f.y > WORLD.bottom - 6 * S) { f.y = WORLD.bottom - 6 * S; f.speed *= .99; }
    }
  }

  /* ------------------------------------------------------------------ *
   *  Fish drawing
   * ------------------------------------------------------------------ */
  const WIDTH_PROFILE = [
    [-.40, .012], [-.33, .038], [-.25, .072], [-.16, .110],
    [-.06, .148], [.05, .180], [.15, .198], [.25, .200],
    [.34, .189], [.42, .166], [.48, .134], [.525, .092],
    [.55, .045], [.562, .012]
  ];

  function bodyWidth(u) {
    const P = WIDTH_PROFILE;
    if (u <= P[0][0]) return P[0][1];
    if (u >= P[P.length - 1][0]) return P[P.length - 1][1];
    for (let i = 0; i < P.length - 1; i++) {
      if (u <= P[i + 1][0]) {
        const t = (u - P[i][0]) / (P[i + 1][0] - P[i][0]);
        const st = t * t * (3 - 2 * t);
        return lerp(P[i][1], P[i + 1][1], st);
      }
    }
    return P[P.length - 1][1];
  }

  function bodyBend(u, phase, L, turn) {
    const q = clamp((u + .40) / .962, 0, 1);
    const envelope = .14 + .86 * Math.pow(1 - q, 1.45);
    const wave = Math.sin(phase - q * 3.15) * .036 * envelope;
    const curve = turn * .052 * Math.pow(1 - q, 1.3);
    return (wave + curve) * L;
  }

  function makeBodyPath(L, phase, turn) {
    const N = 54;
    const top = [], bottom = [];
    for (let i = 0; i <= N; i++) {
      const u = lerp(-.40, .562, i / N);
      const w = bodyWidth(u) * L;
      const b = bodyBend(u, phase, L, turn);
      top.push([u * L, b - w]);
      bottom.push([u * L, b + w]);
    }
    const p = new Path2D();
    p.moveTo(top[0][0], top[0][1]);
    for (let i = 1; i <= N; i++) p.lineTo(top[i][0], top[i][1]);
    for (let i = N; i >= 0; i--) p.lineTo(bottom[i][0], bottom[i][1]);
    p.closePath();
    return p;
  }

  function drawTail(f, L, rootY, phase, turn) {
    const pal = f.palette;
    const swing = Math.sin(phase) * .24 + Math.sin(phase * .5 + 1.7) * .07 + turn * .35;
    const wob = Math.sin(phase + .8) * .022 * L;

    ctx.save();
    ctx.translate(-.40 * L, rootY);
    ctx.rotate(swing);

    // A long, tattered central veil behind both lobes.
    const veil = new Path2D();
    veil.moveTo(-.01 * L, 0);
    veil.bezierCurveTo(-.20 * L, -.035 * L, -.48 * L, wob * 1.2 - .012 * L, -.71 * L, wob * 2.6);
    veil.bezierCurveTo(-.64 * L, .035 * L + wob, -.55 * L, .075 * L + wob, -.48 * L, .055 * L);
    veil.bezierCurveTo(-.30 * L, .04 * L, -.12 * L, .02 * L, -.01 * L, 0);
    veil.closePath();
    let cg = ctx.createLinearGradient(0, 0, -.75 * L, 0);
    cg.addColorStop(0, pal.finRoot);
    cg.addColorStop(.48, pal.finMid);
    cg.addColorStop(1, pal.finTip);
    ctx.fillStyle = cg;
    ctx.fill(veil);
    ctx.strokeStyle = pal.finLine;
    ctx.globalAlpha = .24;
    ctx.lineWidth = .6;
    ctx.stroke(veil);
    ctx.globalAlpha = 1;

    // Each half of the double tail is two overlapping ribbons: a long, pale
    // one behind, a shorter, richer one in front.
    for (const dir of [-1, 1]) {
      const lobeWob = wob * dir;
      const back = new Path2D();
      back.moveTo(0, -dir * .015 * L);
      back.bezierCurveTo(
        -.16 * L, -dir * .04 * L,
        -.37 * L, -dir * (.19 * L + lobeWob * 1.2),
        -.57 * L, -dir * (.355 * L + lobeWob * 2.4)
      );
      back.bezierCurveTo(
        -.67 * L, -dir * (.31 * L + lobeWob * 2.8),
        -.66 * L, -dir * (.16 * L),
        -.56 * L, -dir * (.065 * L)
      );
      back.quadraticCurveTo(-.26 * L, -dir * .005 * L, 0, -dir * .015 * L);
      back.closePath();

      ctx.save();
      ctx.rotate(-dir * .055 + Math.sin(phase * .74 + 2.1) * .045);
      cg = ctx.createLinearGradient(0, 0, -.66 * L, 0);
      cg.addColorStop(0, pal.finRoot);
      cg.addColorStop(.45, pal.finMid);
      cg.addColorStop(.86, pal.finMid);
      cg.addColorStop(1, pal.finTip);
      ctx.fillStyle = cg;
      ctx.globalAlpha = .72;
      ctx.fill(back);
      ctx.strokeStyle = pal.finLine;
      ctx.globalAlpha = .36;
      ctx.lineWidth = .8;
      ctx.stroke(back);
      ctx.globalAlpha = .2;
      for (let r = 0; r < 4; r++) {
        const t = .2 + r * .16;
        ctx.beginPath();
        ctx.moveTo(-.02 * L, -dir * .015 * L);
        ctx.bezierCurveTo(
          -.20 * L, -dir * (.055 + t * .1) * L,
          -.42 * L, -dir * (.17 + t * .18) * L,
          (-.54 - t * .08) * L, -dir * (.27 + t * .08) * L
        );
        ctx.strokeStyle = pal.finLine;
        ctx.lineWidth = .6;
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;

      const lobe = new Path2D();
      lobe.moveTo(0, -dir * .024 * L);
      lobe.bezierCurveTo(
        -.10 * L, -dir * .055 * L,
        -.27 * L, -dir * (.17 * L + lobeWob),
        -.45 * L, -dir * (.29 * L + lobeWob * 1.7)
      );
      lobe.bezierCurveTo(
        -.55 * L, -dir * (.31 * L + lobeWob * 2.0),
        -.57 * L, -dir * (.17 * L),
        -.48 * L, -dir * (.095 * L)
      );
      lobe.bezierCurveTo(
        -.37 * L, -dir * (.03 * L),
        -.17 * L, -dir * (.005 * L),
        0, -dir * .024 * L
      );
      lobe.closePath();

      cg = ctx.createLinearGradient(0, 0, -.60 * L, 0);
      cg.addColorStop(0, pal.finRoot);
      cg.addColorStop(.38, pal.finMid);
      cg.addColorStop(.78, pal.finMid);
      cg.addColorStop(1, pal.finTip);
      ctx.fillStyle = cg;
      ctx.fill(lobe);

      // Ink gathers where the fin meets the body.
      ctx.save();
      ctx.clip(lobe);
      const rootWash = ctx.createRadialGradient(-.055 * L, 0, 0, -.055 * L, 0, .32 * L);
      rootWash.addColorStop(0, pal.finRoot);
      rootWash.addColorStop(.52, pal.finMid);
      rootWash.addColorStop(1, pal.finTip);
      ctx.fillStyle = rootWash;
      ctx.fillRect(-.7 * L, -.42 * L, .7 * L, .84 * L);
      ctx.restore();

      ctx.strokeStyle = pal.finLine;
      ctx.globalAlpha = .62;
      ctx.lineWidth = 1.15;
      ctx.stroke(lobe);
      ctx.globalAlpha = 1;

      // Fin rays.
      for (let r = 0; r < 6; r++) {
        const t = .13 + r * .13;
        ctx.beginPath();
        ctx.moveTo(-.03 * L, -dir * .022 * L);
        ctx.bezierCurveTo(
          -.16 * L, -dir * (.055 + t * .08) * L,
          -.33 * L, -dir * (.13 + t * .2) * L,
          (-.43 - t * .10) * L, -dir * (.20 + t * .13) * L
        );
        ctx.strokeStyle = pal.finLine;
        ctx.globalAlpha = .30 + r * .022;
        ctx.lineWidth = .7;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // A darker ink flourish at the root of the tail.
      ctx.beginPath();
      ctx.moveTo(-.005 * L, -dir * .02 * L);
      ctx.quadraticCurveTo(-.09 * L, -dir * .09 * L, -.16 * L, -dir * .035 * L);
      ctx.strokeStyle = pal.edge;
      ctx.globalAlpha = .22;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function drawPectoralFin(f, L, dir, phase, rootY) {
    const pal = f.palette;
    const flap = Math.sin(phase * 1.13 + (dir > 0 ? .9 : 2.2)) * .045;
    ctx.save();
    ctx.translate(.22 * L, rootY);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(
      -.02 * L, dir * .045 * L,
      -.10 * L, dir * (.136 + flap) * L,
      -.235 * L, dir * (.185 + flap * 1.6) * L
    );
    ctx.bezierCurveTo(
      -.285 * L, dir * (.105 + flap) * L,
      -.19 * L, dir * .022 * L,
      0, 0
    );
    ctx.closePath();
    const gr = ctx.createLinearGradient(0, 0, -.28 * L, dir * .16 * L);
    gr.addColorStop(0, pal.finRoot);
    gr.addColorStop(1, pal.finTip);
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.strokeStyle = pal.finLine;
    ctx.globalAlpha = .33;
    ctx.lineWidth = .75;
    ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-.02 * L, 0);
      ctx.quadraticCurveTo(-.13 * L, dir * (.07 + i * .03) * L, -.22 * L, dir * (.12 + i * .045 + flap) * L);
      ctx.strokeStyle = pal.finLine;
      ctx.globalAlpha = .15;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawFish(f) {
    const L = f.len;
    const pal = f.palette;
    const phase = f.tailPhase;
    const turn = clamp(f.turn, -.65, .65);
    const body = makeBodyPath(L, phase, turn);
    const rootY = bodyBend(-.40, phase, L, turn);

    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.angle);
    ctx.globalAlpha = f.alpha;

    // Diffuse shadow on the pond floor.
    const sh = ctx.createRadialGradient(L * .04, L * .12, L * .02, L * .04, L * .12, L * .62);
    sh.addColorStop(0, 'rgba(47,49,40,0.20)');
    sh.addColorStop(.55, 'rgba(47,49,40,0.085)');
    sh.addColorStop(1, 'rgba(47,49,40,0)');
    ctx.fillStyle = sh;
    ctx.beginPath();
    ctx.ellipse(L * .02, L * .12, L * .58, L * .35, -.12, 0, TAU);
    ctx.fill();

    drawTail(f, L, rootY, phase, turn);
    drawPectoralFin(f, L, 1, phase, bodyBend(.2, phase, L, turn) + bodyWidth(.2) * L * .78);
    drawPectoralFin(f, L, -1, phase, bodyBend(.2, phase, L, turn) - bodyWidth(.2) * L * .78);

    // Body wash.
    const bodyGrad = ctx.createLinearGradient(0, -.22 * L, 0, .22 * L);
    bodyGrad.addColorStop(0, pal.top);
    bodyGrad.addColorStop(.52, pal.wash);
    bodyGrad.addColorStop(1, pal.bottom);
    ctx.fillStyle = bodyGrad;
    ctx.fill(body);

    ctx.save();
    ctx.clip(body);

    // Colour patches for the white/red fish.
    for (const pt of pal.patches) {
      const gr = ctx.createRadialGradient(pt.x * L, pt.y * L, 0, pt.x * L, pt.y * L, pt.rx * L);
      gr.addColorStop(0, `rgba(185,67,43,${pt.a})`);
      gr.addColorStop(.62, `rgba(186,79,53,${pt.a * .62})`);
      gr.addColorStop(1, 'rgba(186,80,54,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.ellipse(pt.x * L, pt.y * L, pt.rx * L, pt.ry * L, -.25, 0, TAU);
      ctx.fill();
    }

    // Watery blooms within the body.
    for (const b of f.blobs) {
      const gr = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      if (b.pale) {
        gr.addColorStop(0, `rgba(247,233,205,${b.a * .72})`);
        gr.addColorStop(1, 'rgba(247,233,205,0)');
      } else {
        gr.addColorStop(0, `rgba(103,48,32,${b.a})`);
        gr.addColorStop(1, 'rgba(103,48,32,0)');
      }
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
    }

    // Dark head-cap, a brush-load of ink.
    const capR = .24 * L;
    const capGrad = ctx.createRadialGradient(.42 * L, 0, .01 * L, .42 * L, 0, capR);
    capGrad.addColorStop(0, pal.cap);
    capGrad.addColorStop(.5, pal.cap);
    capGrad.addColorStop(1, 'rgba(60,45,34,0)');
    ctx.fillStyle = capGrad;
    ctx.beginPath();
    ctx.ellipse(.43 * L, 0, .22 * L, .19 * L, 0, 0, TAU);
    ctx.fill();

    // Pale sheen along the upper flank.
    ctx.beginPath();
    ctx.ellipse(-.02 * L, -.075 * L, .31 * L, .075 * L, -.06, 0, TAU);
    ctx.fillStyle = pal.belly;
    ctx.fill();

    // A few dry-brush scale strokes.
    for (let i = 0; i < 4; i++) {
      const x = (-.16 + i * .08) * L;
      const y = (-.11 + i * .013) * L;
      ctx.beginPath();
      ctx.arc(x, y, .055 * L, .25, 1.6);
      ctx.strokeStyle = pal.edge;
      ctx.globalAlpha = .065;
      ctx.lineWidth = .7;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // A wet-paper grain caught in the wash.
    if (inkPattern) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = .52;
      ctx.fillStyle = inkPattern;
      ctx.fillRect(-L, -.42 * L, 2 * L, .85 * L);
      ctx.restore();
    }

    // Darker pigment where the wash dried at the body's edge.
    ctx.save();
    ctx.strokeStyle = pal.edge;
    ctx.globalAlpha = f.alpha * .18;
    ctx.lineWidth = L * .075;
    ctx.stroke(body);
    ctx.restore();
    ctx.globalAlpha = f.alpha;

    ctx.restore();

    // Ink edge: a soft bleed, a fine contour, then darker brush accents.
    ctx.save();
    ctx.strokeStyle = pal.edge;
    ctx.globalAlpha = f.alpha * .09;
    ctx.lineWidth = Math.max(4.5, L * .07);
    ctx.stroke(body);
    ctx.globalAlpha = f.alpha * .30;
    ctx.lineWidth = Math.max(.8, L * .010);
    ctx.stroke(body);
    ctx.globalAlpha = f.alpha * .62;
    ctx.lineWidth = Math.max(1.2, L * .017);
    ctx.setLineDash([L * .22, L * .42, L * .07, L * .55, L * .16, L * .33]);
    ctx.lineDashOffset = f.id * 17 + f.phase * 9;
    ctx.stroke(body);
    ctx.setLineDash([]);
    ctx.restore();
    ctx.globalAlpha = f.alpha;

    // Gill line.
    const gillY = bodyBend(.235, phase, L, turn);
    ctx.beginPath();
    ctx.moveTo(.255 * L, gillY - bodyWidth(.255) * L * .66);
    ctx.quadraticCurveTo(.195 * L, gillY, .255 * L, gillY + bodyWidth(.255) * L * .66);
    ctx.strokeStyle = pal.edge;
    ctx.globalAlpha = f.alpha * .22;
    ctx.lineWidth = .8;
    ctx.stroke();
    ctx.globalAlpha = f.alpha;

    // Dorsal ridge.
    ctx.beginPath();
    ctx.moveTo(.17 * L, bodyBend(.17, phase, L, turn) - .02 * L);
    ctx.bezierCurveTo(
      .05 * L, bodyBend(.05, phase, L, turn) - .055 * L,
      -.12 * L, bodyBend(-.12, phase, L, turn) - .035 * L,
      -.27 * L, rootY + .01 * L
    );
    ctx.strokeStyle = pal.edge;
    ctx.globalAlpha = f.alpha * .15;
    ctx.lineWidth = L * .028;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = f.alpha;

    // Bubble eyes. A translucent sac swells out from each side of the head,
    // with the eye resting against its inner edge.
    const eyeU = .33;
    const eyeY = bodyWidth(eyeU) * L * .58;
    const eyeBend = bodyBend(eyeU, phase, L, turn);
    const bubbleR = L * .074 * f.eyeBubble;

    for (const dir of [-1, 1]) {
      const ex = eyeU * L;
      const ey = eyeBend + dir * eyeY;
      const bubbleBob = Math.sin(phase * .72 + f.phase + dir * 1.8) * L * .004;
      const bx = ex - L * .016;
      const by = ey + dir * bubbleR * .55 + bubbleBob;

      // Shadow under the sac, then the wet glassy body of the bubble.
      ctx.beginPath();
      ctx.ellipse(bx + L * .007, by + L * .016, bubbleR * 1.03, bubbleR * .82, -.22, 0, TAU);
      ctx.fillStyle = 'rgba(45,54,44,0.16)';
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(bx, by, bubbleR * 1.02, bubbleR * .90, dir * .08, 0, TAU);
      const bg = ctx.createRadialGradient(
        bx - bubbleR * .34, by - bubbleR * .38, bubbleR * .05,
        bx, by, bubbleR * 1.08
      );
      bg.addColorStop(0, 'rgba(254,251,240,0.68)');
      bg.addColorStop(.48, 'rgba(233,237,223,0.30)');
      bg.addColorStop(.86, 'rgba(177,193,173,0.11)');
      bg.addColorStop(1, 'rgba(177,193,173,0)');
      ctx.fillStyle = bg;
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(bx, by, bubbleR * .98, bubbleR * .87, dir * .08, -.55 + dir * .35, 1.75 + dir * .35);
      ctx.strokeStyle = 'rgba(49,62,49,0.52)';
      ctx.lineWidth = .95;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(bx - bubbleR * .28, by - bubbleR * .34, bubbleR * .44, bubbleR * .25, -.7, 0, TAU);
      ctx.fillStyle = 'rgba(255,252,240,0.60)';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bx + bubbleR * .34, by + bubbleR * .30, bubbleR * .16, bubbleR * .10, -.4, 0, TAU);
      ctx.fillStyle = 'rgba(250,247,232,0.24)';
      ctx.fill();

      // The eye itself.
      ctx.beginPath();
      ctx.arc(ex, ey, L * .028, 0, TAU);
      ctx.fillStyle = pal.edge;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + L * .002, ey, L * .019, 0, TAU);
      ctx.fillStyle = pal.eye;
      ctx.fill();
      // Keep just a sliver of amber at the eye's rim.
      ctx.beginPath();
      ctx.arc(ex - L * .004, ey + dir * .003, L * .0195, -.9, .55);
      ctx.strokeStyle = pal.iris;
      ctx.globalAlpha = f.alpha * .44;
      ctx.lineWidth = .8;
      ctx.stroke();
      ctx.globalAlpha = f.alpha;
      ctx.beginPath();
      ctx.arc(ex - L * .004, ey - L * .005, L * .0042, 0, TAU);
      ctx.fillStyle = pal.glint;
      ctx.fill();
      // The soft lid blends the eye into the painted head.
      ctx.beginPath();
      ctx.arc(ex, ey, L * .032, -.9, .9);
      ctx.strokeStyle = pal.edge;
      ctx.globalAlpha = f.alpha * .16;
      ctx.lineWidth = .65;
      ctx.stroke();
      ctx.globalAlpha = f.alpha;
    }

    // A darker wash over the crown of the head.
    ctx.beginPath();
    ctx.moveTo(.552 * L, eyeBend - .03 * L);
    ctx.bezierCurveTo(.51 * L, eyeBend - .095 * L, .43 * L, eyeBend - .085 * L, .395 * L, eyeBend);
    ctx.bezierCurveTo(.43 * L, eyeBend + .085 * L, .51 * L, eyeBend + .095 * L, .552 * L, eyeBend + .03 * L);
    ctx.fillStyle = pal.cap;
    ctx.globalAlpha = f.alpha * .16;
    ctx.fill();
    ctx.globalAlpha = f.alpha;

    // Mouth.
    ctx.beginPath();
    ctx.moveTo(.548 * L, eyeBend - L * .011);
    ctx.quadraticCurveTo(.562 * L, eyeBend, .548 * L, eyeBend + L * .011);
    ctx.strokeStyle = pal.edge;
    ctx.globalAlpha = f.alpha * .55;
    ctx.lineWidth = .8;
    ctx.stroke();

    // A few dry-brush strokes along the flank.
    for (let i = 0; i < 3; i++) {
      const u0 = .1 - i * .095;
      const yy = bodyBend(u0, phase, L, turn) + bodyWidth(u0) * L * .36;
      ctx.beginPath();
      ctx.moveTo((u0 + .09) * L, yy);
      ctx.quadraticCurveTo(
        (u0 + .01) * L, yy + L * .015,
        (u0 - .09) * L, yy - L * .003
      );
      ctx.strokeStyle = pal.edge;
      ctx.globalAlpha = f.alpha * .085;
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
    ctx.globalAlpha = f.alpha;

    ctx.restore();
  }

  /* ------------------------------------------------------------------ *
   *  Ripples
   * ------------------------------------------------------------------ */
  function addRipple(x, y, maxR, life, alpha, seed) {
    ripples.push({
      x, y,
      t: 0,
      life,
      maxR,
      alpha,
      seed: seed === undefined ? simRnd() * 100 : seed
    });
    if (ripples.length > 26) ripples.splice(0, ripples.length - 26);
  }

  function spawnBubble(f) {
    const u = .545;
    const bend = bodyBend(u, f.tailPhase, f.len, f.turn);
    const ca = Math.cos(f.angle), sa = Math.sin(f.angle);
    const localX = u * f.len;
    const localY = bend + (simRnd() - .5) * f.len * .018;
    const x = f.x + ca * localX - sa * localY;
    const y = f.y + sa * localX + ca * localY;
    const r = (2.0 + simRnd() * 3.0) * S * (f.eyeBubble * .8 + .2);
    bubbles.push({
      x, y,
      vx: ca * (10 + simRnd() * 20) * S + (simRnd() - .5) * 14 * S,
      vy: sa * (10 + simRnd() * 20) * S - (7 + simRnd() * 14) * S,
      r,
      age: 0,
      life: 1.9 + simRnd() * 1.8,
      phase: simRnd() * TAU,
      seed: simRnd() * 100,
      alpha: .60 + simRnd() * .26
    });
    if (bubbles.length > 48) bubbles.splice(0, bubbles.length - 48);
  }

  function updateBubbles(dt) {
    for (const f of fishes) {
      if (f.bubbleBurst > 0) {
        f.bubbleBurstTimer -= dt;
        if (f.bubbleBurstTimer <= 0) {
          spawnBubble(f);
          f.bubbleBurst--;
          f.bubbleBurstTimer = .13 + simRnd() * .16;
        }
      } else {
        f.bubbleTimer -= dt;
        if (f.bubbleTimer <= 0) {
          f.bubbleBurst = 3 + Math.floor(simRnd() * 4);
          f.bubbleBurstTimer = .04 + simRnd() * .10;
          f.bubbleTimer = 4.6 + simRnd() * 8;
        }
      }
    }

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.age += dt;
      if (b.age >= b.life) {
        bubbles.splice(i, 1);
        continue;
      }
      const drift = (noise2(time * .5 + b.seed, b.phase, 61) - .5) * 10 * S;
      b.vx += drift * dt;
      b.vy -= 7 * S * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.r += dt * .35 * S;
    }
  }

  function drawBubbles() {
    for (const b of bubbles) {
      const p = b.age / b.life;
      const growIn = smoothstep(0, .15, p);
      const fadeOut = 1 - smoothstep(.66, 1, p);
      const a = b.alpha * growIn * fadeOut;
      if (a < .01) continue;
      const wobble = Math.sin(time * 2.4 + b.phase) * .8 * S;
      const x = b.x + wobble;
      const y = b.y;
      const r = b.r;

      // The faint shadow of a bubble just under the surface.
      ctx.beginPath();
      ctx.ellipse(x + .7 * S, y + 1.1 * S, r * 1.06, r * .92, 0, 0, TAU);
      ctx.fillStyle = `rgba(67,73,62,${a * .11})`;
      ctx.fill();

      const gr = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r * 1.08);
      gr.addColorStop(0, `rgba(253,250,238,${a * .55})`);
      gr.addColorStop(.55, `rgba(226,231,216,${a * .20})`);
      gr.addColorStop(.92, `rgba(180,192,172,${a * .07})`);
      gr.addColorStop(1, 'rgba(180,192,172,0)');
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = gr;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, r * .97, -.2 + b.phase, 1.5 + b.phase);
      ctx.strokeStyle = `rgba(53,64,51,${a * .45})`;
      ctx.lineWidth = .85;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x - r * .26, y - r * .28, r * .38, 3.5, 5.4);
      ctx.strokeStyle = `rgba(255,251,237,${a * .65})`;
      ctx.lineWidth = Math.max(.65, r * .16);
      ctx.lineCap = 'round';
      ctx.stroke();

      if (r > 2.5 * S) {
        ctx.beginPath();
        ctx.arc(x + r * .24, y + r * .20, r * .16, 0, TAU);
        ctx.fillStyle = `rgba(250,247,230,${a * .22})`;
        ctx.fill();
      }
    }
  }

  function spawnFishRipple(f) {
    const back = f.len * .26;
    addRipple(
      f.x - Math.cos(f.angle) * back,
      f.y - Math.sin(f.angle) * back,
      (22 + f.speed * .40) * S,
      3.8 + simRnd() * 2.4,
      .66 + simRnd() * .18,
      simRnd() * 100
    );
  }

  function updateRipples(dt) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.t += dt;
      // The wind carries the surface rings gently downwind.
      r.x += wind.x * (1.6 + 3.2 * wind.strength) * S * dt;
      r.y += wind.y * (1.6 + 3.2 * wind.strength) * S * dt;
      if (r.t >= r.life) ripples.splice(i, 1);
    }

    ambientTimer -= dt;
    if (ambientTimer <= 0) {
      ambientTimer = (3.6 + simRnd() * 5.4) * (1 - .34 * wind.strength);
      let x = 0, y = 0, ok = false;
      for (let i = 0; i < 30; i++) {
        x = lerp(W * .05, W * .95, simRnd());
        y = lerp(H * .06, H * .94, simRnd());
        ok = true;
        for (const obs of obstacles) {
          if (dist2(x, y, obs.x, obs.y) < Math.pow(obs.solid + 12 * S, 2)) { ok = false; break; }
        }
        if (ok) break;
      }
      if (ok) {
        addRipple(
          x, y,
          (16 + simRnd() * 36) * S,
          4.2 + simRnd() * 3.8,
          .32 + simRnd() * .18,
          simRnd() * 100
        );
      }
    }

    for (const f of fishes) {
      f.rippleTimer -= dt;
      if (f.rippleTimer <= 0) {
        if (mood.intensity > .3 || simRnd() > .4) spawnFishRipple(f);
        f.rippleTimer = (mood.intensity > .5 ? 1.8 : 2.3) + simRnd() * 2.3;
      }
    }

    // Now and then the water shivers at the rim of a leaf.
    for (const leaf of leaves) {
      leaf.rippleTimer -= dt;
      if (leaf.rippleTimer <= 0) {
        const a = simRnd() * TAU;
        const rr = leaf.radius * (.96 + simRnd() * .16);
        addRipple(
          leaf.x + Math.cos(a) * rr,
          leaf.y + Math.sin(a) * rr,
          (14 + simRnd() * 22) * S,
          4.5 + simRnd() * 3,
          .19 + simRnd() * .12,
          simRnd() * 100
        );
        leaf.rippleTimer = (7 + simRnd() * 11) * (1 - .42 * wind.strength);
      }
    }
  }

  function drawRippleArc(x, y, radius, start, length, seed, alpha, width) {
    const steps = Math.max(8, Math.ceil(length / .11));
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const a = start + length * (i / steps);
      const wobble = 1
        + .023 * Math.sin(a * 3 + seed)
        + .014 * Math.sin(a * 5 - seed * 1.7)
        + .007 * Math.sin(a * 9 + seed * .8);
      const px = x + Math.cos(a) * radius * wobble;
      const py = y + Math.sin(a) * radius * wobble * (1 + .012 * Math.sin(a * 2 + seed));
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = `rgba(43,51,44,${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawRipples() {
    // Broken, brushy arcs. Ink ripples are never perfect circles; they appear
    // where the brush caught the water, then dissolve back into the paper.
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    for (const r of ripples) {
      const p = clamp(r.t / r.life, 0, 1);
      const radius = r.maxR * (.08 + .92 * easeOutCubic(p));
      const alpha = r.alpha * Math.pow(1 - p, .92);
      if (alpha < .001) continue;

      // All rings are stretched along the same wind direction and compressed
      // across it, making the whole water surface feel wind-driven.
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(wind.angle);
      ctx.scale(1 + wind.strength * .22, 1 - wind.strength * .06);

      // A barely-there wash that holds the arcs together.
      if (p < .5) {
        const halo = ctx.createRadialGradient(0, 0, radius * .2, 0, 0, radius * 1.25);
        halo.addColorStop(0, `rgba(66,77,66,${alpha * .035})`);
        halo.addColorStop(.7, `rgba(66,77,66,${alpha * .016})`);
        halo.addColorStop(1, 'rgba(66,77,66,0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.25, 0, TAU);
        ctx.fill();
      }

      const rings = radius > 28 * S ? 3 : 2;
      for (let k = 0; k < rings; k++) {
        const rr = radius * (1 - k * .19);
        if (rr < 1.5) continue;
        const ringAlpha = alpha * (k === 0 ? .82 : k === 1 ? .40 : .20);
        const seed = r.seed + k * 2.3 + p;

        // A continuous, wobbling ring keeps the ripple readable at a glance.
        drawRippleArc(
          0, 0, rr, seed * 1.7, TAU, seed,
          ringAlpha * .40, (1.5 - p * .35) * (1 + k * .22)
        );

        // Broken darker strokes break up the circle so it feels brushed.
        const segments = 3 + (k % 2);
        let cursor = seed * 2.1;
        for (let s = 0; s < segments; s++) {
          const len = .27 + ((Math.sin(seed * 3.1 + s * 2.4 + k) + 1) * .5) * .62;
          const gap = .18 + ((Math.cos(seed * 1.7 + s * 4.1) + 1) * .5) * .45;
          drawRippleArc(
            0, 0, rr, cursor, len, seed + s * 1.3,
            ringAlpha * (.58 + .32 * Math.sin(seed + s * 3.7 + 1.4)),
            (1.6 - p * .35) * (1 + k * .22)
          );
          cursor += len + gap;
        }

        // One darker stroke, as if the brush pressed harder on one side.
        const darkStart = seed * 1.4 + k * 2.1 + p * 1.6;
        drawRippleArc(
          0, 0, rr * .998, darkStart, .22 + (r.seed % .25),
          seed + 4.2, ringAlpha * .48, .9 + (1 - p) * .8
        );
      }

      // The little disturbance at the centre, while the ripple is young.
      if (p < .26) {
        const k = 1 - p / .26;
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(.8, 1.2 * S + (1 - k) * 2.2), 0, TAU);
        ctx.fillStyle = `rgba(43,51,44,${alpha * .5})`;
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------------ *
   *  Drawing the pond
   * ------------------------------------------------------------------ */
  function drawLeaves() {
    const sorted = leaves.slice().sort((a, b) => a.y - b.y);
    for (const leaf of sorted) {
      // A single coherent gust front travels across the pond; every leaf
      // answers the same wind, with only a slight positional lag.
      const phasePos = (leaf.x * wind.x + leaf.y * wind.y) / (U * .82);
      const gustWave = Math.sin(wind.phase * 1.28 - phasePos + leaf.phase * .08);
      const sway = (14 + 28 * wind.strength) * S * (.55 + .45 * (.5 + .5 * gustWave));
      const dx = wind.x * sway;
      const dy = wind.y * sway;
      const rot = leaf.rot + wind.x * .12 + gustWave * .014 * wind.strength;
      const sc = 1 + wind.strength * .0045 * gustWave;
      ctx.save();
      ctx.translate(leaf.x + dx, leaf.y + dy);
      ctx.rotate(rot);
      ctx.scale(sc, sc);
      ctx.globalAlpha = leaf.alpha;
      ctx.drawImage(leaf.sprite.canvas, -leaf.sprite.size / 2, -leaf.sprite.size / 2, leaf.sprite.size, leaf.sprite.size);
      ctx.restore();
    }
  }

  function drawFlowers() {
    const sorted = flowers.slice().sort((a, b) => a.y - b.y);
    for (const flower of sorted) {
      const phasePos = (flower.x * wind.x + flower.y * wind.y) / (U * .72);
      const gustWave = Math.sin(wind.phase * 1.32 - phasePos + flower.phase * .07);
      const sway = (24 + 46 * wind.strength) * S * (.5 + .5 * (.5 + .5 * gustWave));
      const dx = wind.x * sway;
      const dy = wind.y * sway;
      const rot = flower.rot + wind.x * .18 + gustWave * .02 * wind.strength;
      const sc = 1 + wind.strength * .005 * gustWave;
      ctx.save();
      ctx.translate(flower.x + dx, flower.y + dy);
      ctx.rotate(rot);
      ctx.scale(sc, sc);
      ctx.globalAlpha = flower.alpha;
      ctx.drawImage(flower.sprite.canvas, -flower.sprite.size / 2, -flower.sprite.size / 2, flower.sprite.size, flower.sprite.size);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(bgLayer.canvas, 0, 0, W, H);

    // Fish, far ones first.
    const sortedFish = fishes.slice().sort((a, b) => a.depth - b.depth);
    for (const f of sortedFish) drawFish(f);

    drawBubbles();
    drawRipples();
    drawFloaters();
    drawLeaves();
    drawFlowers();

    if (overlayLayer) ctx.drawImage(overlayLayer.canvas, 0, 0, W, H);
  }

  /* ------------------------------------------------------------------ *
   *  Update loop
   * ------------------------------------------------------------------ */
  function update(dt) {
    time += dt;
    updateWind(dt);
    updateMood(dt);
    updateGroup(dt);
    for (const f of fishes) updateFish(f, dt);
    // A few relaxation passes settle both fish-fish and fish-leaf crowding.
    for (let pass = 0; pass < 5; pass++) {
      separateFishes();
      pushFishOutOfObstacles();
      containFishes();
    }
    separateFishes();
    updateBubbles(dt);
    updateRipples(dt);
    updateFloaters(dt);
  }

  function warmup(seconds) {
    const step = 1 / 60;
    const n = Math.min(2400, Math.floor(seconds / step));
    for (let i = 0; i < n; i++) update(step);
  }

  function runSelfTest(seconds = 300) {
    const step = 1 / 60;
    const steps = Math.floor(seconds / step);
    let minPair = Infinity;
    let minObstacle = Infinity;
    let minSpeed = Infinity;
    let maxSpeed = 0;
    let nan = false;
    let outOfWorld = 0;
    let visibleMin = fishes.length;
    let visibleMax = 0;
    let transitions = 0;
    let lastMode = mood.mode;
    const start = fishes.map(f => ({ x: f.x, y: f.y }));
    const path = fishes.map(() => 0);
    let prev = fishes.map(f => ({ x: f.x, y: f.y }));

    for (let s = 0; s < steps; s++) {
      update(step);
      minSpeed = Math.min(minSpeed, ...fishes.map(f => f.speed));
      maxSpeed = Math.max(maxSpeed, ...fishes.map(f => f.speed));
      if (mood.mode !== lastMode) {
        transitions++;
        lastMode = mood.mode;
      }
      let visible = 0;
      for (const f of fishes) {
        if (!Number.isFinite(f.x) || !Number.isFinite(f.y) || !Number.isFinite(f.angle) || !Number.isFinite(f.speed)) nan = true;
        if (f.x < WORLD.left || f.x > WORLD.right || f.y < WORLD.top || f.y > WORLD.bottom) outOfWorld++;
        if (f.x > -f.len && f.x < W + f.len && f.y > -f.len && f.y < H + f.len) visible++;
      }
      visibleMin = Math.min(visibleMin, visible);
      visibleMax = Math.max(visibleMax, visible);
      const now = fishes.map(f => ({ x: f.x, y: f.y }));
      for (let i = 0; i < fishes.length; i++) {
        path[i] += Math.hypot(now[i].x - prev[i].x, now[i].y - prev[i].y);
      }
      prev = now;
      for (let i = 0; i < fishes.length; i++) {
        for (let j = i + 1; j < fishes.length; j++) {
          const a = fishes[i], b = fishes[j];
          const d = Math.hypot(b.x - a.x, b.y - a.y);
          minPair = Math.min(minPair, d - pairClearance(a, b));
        }
        for (const obs of obstacles) {
          for (const p of fishBodyPoints(fishes[i], fishes[i].x, fishes[i].y, fishes[i].angle)) {
            minObstacle = Math.min(minObstacle, Math.hypot(p.x - obs.x, p.y - obs.y) - obs.solid);
          }
        }
      }
    }

    return {
      seconds,
      fish: fishes.length,
      transitions,
      minPairClearance: +minPair.toFixed(2),
      minObstacleClearance: +minObstacle.toFixed(2),
      minSpeed: +minSpeed.toFixed(2),
      maxSpeed: +maxSpeed.toFixed(2),
      nan,
      outOfWorld,
      visibleMin,
      visibleMax,
      path: path.map(v => Math.round(v)),
      netDisplacement: fishes.map((f, i) => Math.round(Math.hypot(f.x - start[i].x, f.y - start[i].y))),
      finalMood: mood.mode
    };
  }

  function frame(now) {
    if (destroyed) return;
    if (!lastFrame) lastFrame = now;
    let dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (!Number.isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 1 / 20);
    update(dt);
    const r0 = performance.now();
    render();
    lastRenderCost = performance.now() - r0;
    frameCount++;
    if (DEBUG && window.inkPond && frameCount % 20 === 0) {
      const c = window.inkPond.clearance();
      debugMinPair = Math.min(debugMinPair, c.pair);
      debugMinObstacle = Math.min(debugMinObstacle, c.obstacle);
      document.title = 'DBG ' + JSON.stringify({
        t: +time.toFixed(1),
        mode: mood.mode,
        mood: +mood.intensity.toFixed(2),
        pair: c.pair,
        obs: c.obstacle,
        minPair: +debugMinPair.toFixed(1),
        minObs: +debugMinObstacle.toFixed(1),
        ms: +lastRenderCost.toFixed(1),
        frames: frameCount
      });
    }
    requestAnimationFrame(frame);
  }

  function rebuild() {
    setupCanvas();
    buildScene();
    warmup(5.5);
    lastFrame = 0;
  }

  let resizeTimer = 0;
  function scheduleRebuild(delay = 160) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      rebuild();
    }, delay);
  }
  window.addEventListener('resize', () => scheduleRebuild(), { passive: true });
  window.addEventListener('orientationchange', () => scheduleRebuild(240), { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => scheduleRebuild(220), { passive: true });
  }
  document.addEventListener('fullscreenchange', () => scheduleRebuild(240));
  window.addEventListener('dblclick', () => {
    if (!document.fullscreenElement) {
      const target = document.documentElement;
      if (target.requestFullscreen) target.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  });

  document.addEventListener('visibilitychange', () => {
    lastFrame = 0;
  });

  // Expose a small, read-only-ish handle for curious wallpaper tinkerers.
  window.inkPond = {
    get fish() {
      return fishes.map(f => ({
        id: f.id,
        x: Math.round(f.x), y: Math.round(f.y), angle: +f.angle.toFixed(3),
        speed: +f.speed.toFixed(2), len: +f.len.toFixed(1), pace: +f.pace.toFixed(2)
      }));
    },
    get mood() { return { mode: mood.mode, intensity: +mood.intensity.toFixed(3) }; },
    get obstacles() {
      return obstacles.map(o => ({ kind: o.kind, x: Math.round(o.x), y: Math.round(o.y), solid: Math.round(o.solid) }));
    },
    get stats() {
      return {
        time: +time.toFixed(2),
        frames: frameCount,
        renderMs: +lastRenderCost.toFixed(2),
        dpr: DPR,
        size: [W, H],
        bubbles: bubbles.length,
        group: [Math.round(group.x), Math.round(group.y), +group.angle.toFixed(2)],
        wind: {
          angle: +wind.angle.toFixed(2),
          strength: +wind.strength.toFixed(2),
          x: +wind.x.toFixed(2),
          y: +wind.y.toFixed(2)
        }
      };
    },
    setMood(mode) {
      mood.mode = mode === 'scatter' ? 'scatter' : 'school';
      mood.target = mood.mode === 'school' ? 1 : 0;
      mood.intensity = mood.target;
      mood.timer = 60;
      if (mood.mode === 'scatter') assignScatterWaypoints();
    },
    clearance() {
      let minPair = Infinity;
      for (let i = 0; i < fishes.length; i++) {
        for (let j = i + 1; j < fishes.length; j++) {
          const a = fishes[i], b = fishes[j];
          const d = Math.hypot(b.x - a.x, b.y - a.y);
          minPair = Math.min(minPair, d - pairClearance(a, b));
        }
      }
      let minObstacle = Infinity;
      for (const f of fishes) {
        for (const obs of obstacles) {
          for (const p of fishBodyPoints(f, f.x, f.y, f.angle)) {
            minObstacle = Math.min(minObstacle, Math.hypot(p.x - obs.x, p.y - obs.y) - obs.solid);
          }
        }
      }
      return {
        pair: +minPair.toFixed(2),
        obstacle: +minObstacle.toFixed(2),
        inside: fishes.filter(f => f.x < 0 || f.x > W || f.y < 0 || f.y > H).length
      };
    }
  };

  // ------------------------------------------------------------------
  setupCanvas();
  buildScene();
  warmup(5.5);
  if (TEST) {
    const result = runSelfTest(300);
    document.title = 'SELFTEST ' + JSON.stringify(result);
    const pre = document.createElement('pre');
    pre.id = 'selftest';
    pre.textContent = JSON.stringify(result, null, 2);
    pre.style.cssText = 'position:fixed;left:12px;top:12px;font:11px monospace;color:#334;background:rgba(255,255,255,.7);padding:8px;z-index:9;';
    document.body.appendChild(pre);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
