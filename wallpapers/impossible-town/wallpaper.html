      const ey = y + len * (0.55 + 0.15 * b);
      c.strokeStyle = 'rgba(60,82,70,.52)';
      c.lineWidth = 0.8;
      c.beginPath();
      c.moveTo(x, y);
      c.quadraticCurveTo(x + dx * 0.5, y + len * 0.35, ex, ey);
      c.stroke();
      for (let i = 0; i < 4; i++) {
        const lx = ex + Math.cos(i * 1.8 + b) * 7;
        const ly = ey + Math.sin(i * 1.8 + b) * 5;
        c.fillStyle = i % 2 ? color : 'rgba(80,105,92,.62)';
        c.beginPath();
        c.ellipse(lx, ly, 4.6, 6.2, 0.5 + i, 0, TAU);
        c.fill();
        c.strokeStyle = 'rgba(43,42,38,.3)';
        c.lineWidth = 0.4;
        c.stroke();
      }
    }
    c.restore();
  }
  function drawCat(c, x, y, size, scale) {
    c.save();
    c.translate(x, y);
    c.scale(size / 26 * scale, size / 26 * scale);
    c.fillStyle = 'rgba(43,42,38,.92)';
    c.beginPath(); c.ellipse(0, -8, 8, 12, 0, 0, TAU); c.fill();
    c.beginPath(); c.arc(0, -22, 6.5, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(-6, -26); c.lineTo(-8, -34); c.lineTo(-2, -28); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(6, -26); c.lineTo(8, -34); c.lineTo(2, -28); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(43,42,38,.92)'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(6, -2); c.quadraticCurveTo(15, 0, 17, -12); c.stroke();
    c.fillStyle = PAL.brass;
    c.fillRect(-3.4, -23, 1.6, 1.6);
    c.fillRect(1.8, -23, 1.6, 1.6);
    c.strokeStyle = 'rgba(242,234,216,.28)'; c.lineWidth = 0.8;
    c.beginPath(); c.arc(0, -22, 6.5, Math.PI * 1.05, Math.PI * 1.7); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------------
  // 9. 会改写的路线
  // ---------------------------------------------------------------------------
  function routeGatesOffset(u) {
    let off = 0;
    for (let i = 0; i < buildings.length; i++) {
      const b = buildings[i];
      if (Math.abs(b.push) < 0.015) continue;
      let d = u - b.routeU;
      d -= Math.round(d);
      const bump = Math.exp(-(d * d) / (2 * 0.052 * 0.052));
      off += b.push * 0.55 * bump;
    }
    return clamp(off, -0.48, 0.48);
  }

  function buildRoute(base, strength = 1) {
    return base.map((p) => {
      const off = routeGatesOffset(p.u) * strength;
      return {
        x: p.x + p.nx * off,
        y: p.y + p.ny * off,
        nx: p.nx,
        ny: p.ny,
        u: p.u
      };
    });
  }

  function sampleRoute(route, u) {
    const n = route.length;
    const f = mod(u, 1) * n;
    const i = Math.floor(f) % n, j = (i + 1) % n;
    const t = f - Math.floor(f);
    const a = route[i], b = route[j];
    return {
      x: lerp(a.x, b.x, t),
      y: lerp(a.y, b.y, t),
      tx: b.x - a.x,
      ty: b.y - a.y,
      angle: Math.atan2(b.y - a.y, b.x - a.x),
      nx: a.nx,
      ny: a.ny
    };
  }

  function drawTrack(c, route) {
    c.save();
    c.lineJoin = 'round';
    c.lineCap = 'round';
    // 枕木
    c.strokeStyle = 'rgba(43,42,38,.32)';
    c.lineWidth = Math.max(1, TH * 0.035);
    for (let i = 0; i < route.length; i += 4) {
      const p = route[i];
      const a = iso(p.x - p.nx * 0.28, p.y - p.ny * 0.28, 0.015);
      const b = iso(p.x + p.nx * 0.28, p.y + p.ny * 0.28, 0.015);
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    }
    // 双轨
    for (const off of [-0.17, 0.17]) {
      c.beginPath();
      route.forEach((p, i) => {
        const q = iso(p.x + p.nx * off, p.y + p.ny * off, 0.03);
        if (i === 0) c.moveTo(q.x, q.y); else c.lineTo(q.x, q.y);
      });
      c.closePath();
      c.strokeStyle = 'rgba(43,42,38,.62)';
      c.lineWidth = Math.max(1.2, TH * 0.045);
      c.stroke();
      c.strokeStyle = 'rgba(201,161,91,.5)';
      c.lineWidth = Math.max(0.5, TH * 0.014);
      c.stroke();
    }
    c.restore();
  }

  function drawCanalFlow(c) {
    if (!WATER) return;
    c.save();
    c.beginPath();
    polyPath(c, WATER.outer, true, false);
    polyPath(c, WATER.inner, true, false);
    c.clip('evenodd');
    c.lineCap = 'round';
    for (let i = 0; i < 30; i++) {
      const u = mod(clock / 6 + i / 30, 1);
      const p = sampleRoute(canalPath, u);
      const q = iso(p.x, p.y, 0.015);
      const dx = Math.cos(p.angle), dy = Math.sin(p.angle);
      const nx = -dy, ny = dx;
      const len = Math.max(4, TH * 0.18);
      const alpha = 0.26 + 0.16 * Math.sin(i * 2.1 + clock * 0.8);
      c.strokeStyle = `rgba(242,234,216,${alpha.toFixed(3)})`;
      c.lineWidth = Math.max(0.7, TH * 0.022);
      c.beginPath();
      c.moveTo(q.x - dx * len * 0.5, q.y - dy * len * 0.5);
      c.lineTo(q.x + dx * len * 0.5, q.y + dy * len * 0.5);
      c.stroke();
      c.strokeStyle = `rgba(147,174,176,${(alpha * 0.75).toFixed(3)})`;
      c.lineWidth = 0.6;
      c.beginPath();
      c.moveTo(q.x + dx * len * 0.6, q.y + dy * len * 0.6);
      c.lineTo(q.x + dx * len * 0.9 + nx * 2, q.y + dy * len * 0.9 + ny * 2);
      c.stroke();
    }
    // 固定不动的几处泡沫与涟漪
    for (let i = 0; i < 5; i++) {
      const u = (i + 0.3) / 5;
      const p = sampleRoute(canalPath, u);
      const q = iso(p.x, p.y, 0.02);
      c.strokeStyle = 'rgba(242,234,216,.16)';
      c.lineWidth = 0.7;
      c.beginPath();
      c.ellipse(q.x, q.y, TW * (0.18 + i * 0.03), TH * (0.18 + i * 0.03), 0, 0, TAU);
      c.stroke();
    }
    c.restore();
  }

  function drawCanalStepFlow(c) {
    // 北侧水梯：水从低处一阶阶往高处（屏幕右下方）流
    c.save();
    c.lineCap = 'round';
    for (let s = 0; s < 4; s++) {
      const z = CANAL_STEPS[s].z + 0.14;
      const x0 = CANAL_STEPS[s].x;
      const y0 = CANAL_STEPS[s].y;
      for (let k = 0; k < 3; k++) {
        const p = fract(clock / 6 + s * 0.19 + k / 3);
        const y = y0 + 0.39 - p * 0.78;
        const q = iso(x0, y, z);
        const alpha = 0.25 + 0.45 * Math.sin(p * Math.PI);
        c.strokeStyle = `rgba(242,234,216,${alpha.toFixed(3)})`;
        c.lineWidth = Math.max(0.8, TH * 0.028);
        c.beginPath();
        c.moveTo(q.x - TW * 0.08, q.y - TH * 0.02);
        c.lineTo(q.x, q.y + TH * 0.06);
        c.lineTo(q.x + TW * 0.08, q.y - TH * 0.02);
        c.stroke();
      }
    }
    // 阶沿落水
    for (let s = 0; s < 4; s++) {
      const z = CANAL_STEPS[s].z + 0.05;
      const q = iso(CANAL_STEPS[s].x, CANAL_STEPS[s].y + 0.4, z);
      const p = fract(clock / 6 + s * 0.17);
      c.strokeStyle = 'rgba(242,234,216,.4)';
      c.lineWidth = 0.8;
      for (let k = 0; k < 2; k++) {
        const drop = (p + k * 0.5) % 1;
        c.beginPath();
        c.moveTo(q.x + k * 3 - 2, q.y);
        c.lineTo(q.x + k * 3 - 2, q.y + TH * 0.22 * drop);
        c.stroke();
      }
    }
    c.restore();
  }

  function roundRectPath(c, x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.lineTo(x + w - rr, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rr);
    c.lineTo(x + w, y + h - rr);
    c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    c.lineTo(x + rr, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rr);
    c.lineTo(x, y + rr);
    c.quadraticCurveTo(x, y, x + rr, y);
    c.closePath();
  }

  function drawTram(c, route, tram) {
    const phase = mod(clock + tram.offset, 90);
    const dwell = phase < 4;
    const baseU = dwell ? 0.5 : mod(0.5 + (phase - 4) / 86, 1);
    for (let car = 1; car >= 0; car--) {
      const u = mod(baseU - car * 0.019, 1);
      const p = sampleRoute(route, u);
      const tl = Math.hypot(p.tx, p.ty) || 1;
      const tx = p.tx / tl, ty = p.ty / tl;
      const nx = -ty, ny = tx;
      const hl = 0.82, hw = 0.38, H = 1.15;
      const corner = (a, b) => ({ x: p.x + tx * a + nx * b, y: p.y + ty * a + ny * b });
      const base = [corner(-hl, -hw), corner(hl, -hw), corner(hl, hw), corner(-hl, hw)];
      const top = base.map((q) => ({ x: q.x, y: q.y, z: H }));
      const screen = (q, z = 0) => iso(q.x, q.y, z);
      const baseS = base.map((q) => screen(q));
      const topS = top.map((q) => screen(q, H));
      // 投影
      c.fillStyle = 'rgba(43,42,38,.13)';
      c.beginPath();
      baseS.forEach((q, i) => (i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)));
      c.closePath(); c.fill();
      // 四个侧面，按朝向与深度排序
      const faces = [];
      for (let i = 0; i < 4; i++) {
        const a = base[i], b = base[(i + 1) % 4];
        const ex = b.x - a.x, ey = b.y - a.y;
        let fx = ey, fy = -ex;
        const fl = Math.hypot(fx, fy) || 1;
        fx /= fl; fy /= fl;
        const mx = (a.x + b.x) / 2 - p.x, my = (a.y + b.y) / 2 - p.y;
        if (fx * mx + fy * my < 0) { fx = -fx; fy = -fy; }
        const facing = fx + fy;
        if (facing <= 0.001) continue;
        const depth = (a.x + a.y + b.x + b.y) / 2;
        faces.push({ i, a, b, fx, fy, depth, long: i === 0 || i === 2 });
      }
      faces.sort((a, b) => a.depth - b.depth);
      for (const face of faces) {
        const bs0 = screen(face.a), bs1 = screen(face.b);
        const ts0 = screen(face.a, H), ts1 = screen(face.b, H);
        const isLong = face.long;
        const shade = face.i === 0 || face.i === 3 ? 1 : 0.82;
        // 车身下半截
        fillPoly(c, [bs0, bs1, ts1, ts0], mix(PAL.paperLight, tram.color, isLong ? 0.1 : 0.2));
        fillPoly(c, [bs0, bs1, { x: lerp(bs1.x, ts1.x, 0.28), y: lerp(bs1.y, ts1.y, 0.28) }, { x: lerp(bs0.x, ts0.x, 0.28), y: lerp(bs0.y, ts0.y, 0.28) }], tram.color);
        // 窗
        if (isLong) {
          for (let wI = 0; wI < 3; wI++) {
            const u0 = 0.12 + wI * 0.27, u1 = u0 + 0.18;
            const pt = (u, v) => ({
              x: lerp(lerp(bs0.x, bs1.x, u), lerp(ts0.x, ts1.x, u), v),
              y: lerp(lerp(bs0.y, bs1.y, u), lerp(ts0.y, ts1.y, u), v)
            });
            const q = [pt(u0, 0.32), pt(u1, 0.32), pt(u1, 0.76), pt(u0, 0.76)];
            fillPoly(c, q, wI === 1 ? PAL.brass : mix(PAL.blueDark, PAL.ink, 0.38));
            strokePoly(c, q, 'rgba(43,42,38,.6)', 0.55);
            if (wI === 1) {
              const hd = pt(u0 + 0.06, 0.56);
              c.fillStyle = 'rgba(43,42,38,.55)';
              c.beginPath(); c.arc(hd.x, hd.y, Math.max(1, TH * 0.03), 0, TAU); c.fill();
            }
          }
          // 门缝
          const d0 = { x: lerp(bs0.x, bs1.x, 0.82), y: lerp(bs0.y, bs1.y, 0.82) };
          const d1 = { x: lerp(ts0.x, ts1.x, 0.82), y: lerp(ts0.y, ts1.y, 0.82) };
          c.strokeStyle = 'rgba(43,42,38,.55)'; c.lineWidth = 0.6;
          c.beginPath(); c.moveTo(d0.x, d0.y); c.lineTo(d1.x, d1.y); c.stroke();
          if (dwell) {
            const o0 = { x: lerp(bs0.x, bs1.x, 0.84), y: lerp(bs0.y, bs1.y, 0.84) };
            const o1 = { x: lerp(ts0.x, ts1.x, 0.84), y: lerp(ts0.y, ts1.y, 0.84) };
            const o2 = { x: lerp(ts0.x, ts1.x, 0.72), y: lerp(ts0.y, ts1.y, 0.9) };
            const o3 = { x: lerp(bs0.x, bs1.x, 0.72), y: lerp(bs0.y, bs1.y, 0.42) };
            fillPoly(c, [o0, o1, o2, o3], 'rgba(43,42,38,.5)');
          }
        }
        // 轮廓
        c.strokeStyle = 'rgba(43,42,38,.85)'; c.lineWidth = 0.9;
        polyPath(c, [bs0, bs1, ts1, ts0]); c.stroke();
      }
      // 车顶
      fillPoly(c, topS, mix(PAL.paperLight, PAL.paper, 0.2));
      strokePoly(c, topS, 'rgba(43,42,38,.8)', 0.9);
      // 顶棚中线与受电杆
      const center = screen(p, H);
      c.strokeStyle = 'rgba(43,42,38,.6)'; c.lineWidth = 0.7;
      const roofA = screen(corner(-hl * 0.7, 0), H), roofB = screen(corner(hl * 0.7, 0), H);
      c.beginPath(); c.moveTo(roofA.x, roofA.y); c.lineTo(roofB.x, roofB.y); c.stroke();
      const pg0 = screen(corner(hl * 0.2, 0), H);
      c.strokeStyle = 'rgba(43,42,38,.7)'; c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(pg0.x, pg0.y); c.lineTo(pg0.x, pg0.y - TH * 0.55); c.stroke();
      c.beginPath(); c.moveTo(pg0.x - TH * 0.18, pg0.y - TH * 0.55); c.lineTo(pg0.x + TH * 0.18, pg0.y - TH * 0.55); c.stroke();
      // 车轮与车灯
      for (const side of [-hw * 0.8, hw * 0.8]) {
        const w0 = screen(corner(-hl * 0.55, side), 0.05);
        const w1 = screen(corner(hl * 0.55, side), 0.05);
        for (const q of [w0, w1]) {
          c.fillStyle = PAL.ink;
          c.beginPath(); c.arc(q.x, q.y, Math.max(1.5, TH * 0.08), 0, TAU); c.fill();
        }
      }
      const lamp = screen(corner(hl, -hw * 0.4), H * 0.55);
      c.fillStyle = PAL.brass;
      c.beginPath(); c.arc(lamp.x, lamp.y, Math.max(1, TH * 0.04), 0, TAU); c.fill();
      // 路线牌
      const board = screen(corner(hl * 0.82, 0), H * 0.8);
      c.fillStyle = PAL.paperLight;
      c.fillRect(board.x - 4, board.y - 3, 8, 5);
      c.fillStyle = PAL.ink;
      c.font = `600 ${Math.max(3.5, TH * 0.085)}px 'Segoe UI', sans-serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(tram.number, board.x, board.y);
    }
  }

  function drawPed(c, ped, p) {
    const s = iso(p.x, p.y, 0.015);
    const scale = TH / 42 * ped.scale;
    const hgt = 20 * scale;
    c.save();
    c.translate(s.x, s.y);
    c.fillStyle = 'rgba(43,42,38,.13)';
    c.beginPath(); c.ellipse(0, 1, hgt * 0.3, hgt * 0.09, 0, 0, TAU); c.fill();
    const step = Math.sin(ped.walk) * hgt * 0.14;
    c.strokeStyle = 'rgba(43,42,38,.85)';
    c.lineWidth = Math.max(0.8, hgt * 0.09);
    c.beginPath();
    c.moveTo(0, -hgt * 0.42);
    c.lineTo(-hgt * 0.13 + step, 0);
    c.moveTo(0, -hgt * 0.42);
    c.lineTo(hgt * 0.13 - step, 0);
    c.stroke();
    c.fillStyle = ped.color;
    c.beginPath();
    c.ellipse(0, -hgt * 0.62, hgt * 0.15, hgt * 0.24, 0, 0, TAU);
    c.fill();
    c.strokeStyle = 'rgba(43,42,38,.45)'; c.lineWidth = 0.4; c.stroke();
    c.fillStyle = PAL.paperLight;
    c.beginPath(); c.arc(0, -hgt * 0.9, hgt * 0.11, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(43,42,38,.7)'; c.lineWidth = 0.5; c.stroke();
    if (ped.umbrella) {
      c.fillStyle = ped.color;
      c.beginPath();
      c.arc(0, -hgt * 1.02, hgt * 0.34, Math.PI, TAU);
      c.fill();
      c.strokeStyle = 'rgba(43,42,38,.6)'; c.lineWidth = 0.6; c.stroke();
      c.strokeStyle = 'rgba(43,42,38,.75)'; c.lineWidth = 0.6;
      c.beginPath(); c.moveTo(0, -hgt * 1.02); c.lineTo(0, -hgt * 0.3); c.stroke();
    }
    // 手臂
    c.strokeStyle = ped.color; c.lineWidth = Math.max(0.6, hgt * 0.06);
    c.beginPath();
    c.moveTo(-hgt * 0.12, -hgt * 0.66);
    c.lineTo(-hgt * 0.2 - step * 0.4, -hgt * 0.48);
    c.stroke();
    c.restore();
  }

  function drawTree(c, tree) {
    const p = iso(tree.x, tree.y, 0.02);
    const h = TH * 1.5 * tree.s;
    const seed = tree.seed;
    c.save();
    c.fillStyle = 'rgba(43,42,38,.13)';
    c.beginPath(); c.ellipse(p.x + 2, p.y + 1, h * 0.22, h * 0.07, 0, 0, TAU); c.fill();
    c.strokeStyle = PAL.inkSoft; c.lineWidth = Math.max(1, h * 0.055);
    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x, p.y - h * 0.55); c.stroke();
    c.strokeStyle = 'rgba(43,42,38,.55)'; c.lineWidth = 0.7;
    c.beginPath(); c.moveTo(p.x, p.y - h * 0.3); c.lineTo(p.x - h * 0.12, p.y - h * 0.42); c.stroke();
    const blobs = [
      { dx: -h * 0.12, dy: -h * 0.62, r: h * 0.26 },
      { dx: h * 0.13, dy: -h * 0.7, r: h * 0.24 },
      { dx: 0, dy: -h * 0.86, r: h * 0.22 }
    ];
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i];
      c.fillStyle = i % 2 ? mix(PAL.blueDark, PAL.blue, 0.28) : mix(PAL.blue, PAL.blueLight, 0.18);
      c.beginPath();
      c.ellipse(p.x + b.dx, p.y + b.dy, b.r, b.r * 0.72, 0.1 * i, 0, TAU);
      c.fill();
      c.strokeStyle = 'rgba(43,42,38,.55)'; c.lineWidth = 0.7; c.stroke();
    }
    c.fillStyle = PAL.brass;
    for (let i = 0; i < 3; i++) {
      const a = i * 2.1 + seed;
      c.beginPath();
      c.arc(p.x + Math.cos(a) * h * 0.18, p.y - h * 0.75 + Math.sin(a) * h * 0.12, Math.max(0.8, h * 0.025), 0, TAU);
      c.fill();
    }
    c.restore();
  }
  function drawFlag(c, b) {
    if (b.turning) return;
    const cx = b.x + b.w / 2, cy = b.y + b.d / 2;
    let z = b.h + 0.75;
    if (b.kind === 'clock') z = b.h * 1.72 + 0.35;
    else if (b.kind === 'cathedral') z = b.h + 0.95;
    else if (b.kind === 'hall') z = b.h + 0.7;
    const base = iso(cx, cy, z);
    const top = iso(cx, cy, z + 0.55);
    c.strokeStyle = 'rgba(43,42,38,.72)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(base.x, base.y); c.lineTo(top.x, top.y); c.stroke();
    const phase = clock * 1.6 + (b.seed % 100) * 0.1;
    const wave = Math.sin(phase) * TH * 0.12;
    const w = TW * 0.24, h = TH * 0.22;
    c.fillStyle = b.kind === 'clock' ? PAL.brick : PAL.blue;
    c.beginPath();
    c.moveTo(top.x, top.y);
    c.lineTo(top.x + w, top.y + wave * 0.4);
    c.lineTo(top.x + w * 0.92, top.y + h + wave);
    c.lineTo(top.x + w * 0.34, top.y + h * 0.7 + wave * 0.6);
    c.lineTo(top.x, top.y + h * 0.9);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(43,42,38,.5)'; c.lineWidth = 0.5; c.stroke();
  }

  function drawSmoke(c, b) {
    if (!b.smoke || b.turning) return;
    const cx = b.x + b.w * 0.5 - b.w * 0.22;
    const cy = b.y + b.d * 0.5 - b.d * 0.18;
    const top = iso(cx, cy, b.h + 0.75);
    c.save();
    c.strokeStyle = 'rgba(70,84,92,.18)';
    c.lineWidth = 0.8;
    for (let i = 0; i < 3; i++) {
      const phase = fract(clock / 12 + i / 3 + (b.seed % 17) / 17);
      const x = top.x + Math.sin(phase * 5 + i) * TW * 0.12 + phase * TW * 0.3;
      const y = top.y - phase * TH * (1.1 + i * 0.2);
      c.beginPath();
      c.arc(x, y, 2 + phase * 4, 0, TAU);
      c.stroke();
    }
    c.restore();
  }

  function drawBirds(c) {
    c.save();
    c.strokeStyle = 'rgba(43,42,38,.5)';
    c.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const t = mod(clock / (26 + i * 4) + i / 3, 1);
      const x = -w * 0.06 + t * w * 1.12;
      const y = h * (0.12 + i * 0.035) + Math.sin(t * 9 + i * 2) * h * 0.035;
      const flap = Math.sin(clock * 5 + i * 2.1);
      c.beginPath();
      c.moveTo(x - 4, y + flap * 2);
      c.quadraticCurveTo(x, y - 2, x + 4, y + flap * 2);
      c.stroke();
      c.fillStyle = 'rgba(43,42,38,.4)';
      c.fillRect(x - 0.6, y - 0.6, 1.2, 1.2);
    }
    c.restore();
  }

  function drawDayTint(c) {
    const phase = mod(clock, 600) / 600;
    const dusk = 0.5 - 0.5 * Math.cos(TAU * phase);
    if (dusk > 0.01) {
      c.fillStyle = `rgba(166,96,52,${(0.062 * dusk).toFixed(3)})`;
      c.fillRect(0, 0, w, h);
    }
    if (dusk < 0.99) {
      c.fillStyle = `rgba(110,145,160,${(0.026 * (1 - dusk)).toFixed(3)})`;
      c.fillRect(0, 0, w, h);
    }
  }

  // ---------------------------------------------------------------------------
  // 10. 状态、更新与轮转
  // ---------------------------------------------------------------------------
  const CANAL_STEPS = [
    { x: 6.0, y: 10.8, z: 0.06 },
    { x: 6.0, y: 10.0, z: 0.2 },
    { x: 6.0, y: 9.2, z: 0.34 },
    { x: 6.0, y: 8.4, z: 0.48 }
  ];
  let WATER = null;

  const trams = [
    { offset: 0, color: PAL.brick, number: '7' },
    { offset: 45, color: PAL.blueDark, number: '2' }
  ];
  let peds = [];
  const TREES = [
    { x: 5.05, y: 7.2, s: 1.0, seed: 1 }, { x: 16.95, y: 7.2, s: 0.9, seed: 2 },
    { x: 5.05, y: 15.0, s: 0.85, seed: 3 }, { x: 16.95, y: 15.0, s: 1.0, seed: 4 },
    { x: 9.0, y: 16.85, s: 0.8, seed: 5 }, { x: 13.1, y: 16.85, s: 0.9, seed: 6 },
    { x: 1.6, y: 8.2, s: 1.05, seed: 7 }, { x: 20.4, y: 8.2, s: 0.85, seed: 8 }
  ];
  let hovered = null;
  let selected = -1;
  let drag = null;
  let turnK = 0;
  let nextTurnAt = Infinity;
  let lastReadout = -100;
  let wideMode = false;
  let initialZoom = zoom;
  let autoPool = [];
  let quietTimer = 0;

  const KIND_LABELS = {
    cathedral: '大教堂',
    clock: '钟塔',
    market: '市场',
    observatory: '天文台',
    mill: '水磨',
    hall: '市政厅',
    library: '图书馆',
    print: '印刷所',
    row: '排屋',
    small: '小屋',
    kiosk: '售货亭',
    station: '车站'
  };

  function labelFor(b) {
    if (KIND_LABELS[b.kind] && b.kind !== 'row' && b.kind !== 'small') return KIND_LABELS[b.kind];
    const n = buildings.filter((q) => q.kind === 'row' || q.kind === 'small').indexOf(b) + 1;
    return '街区 ' + String(Math.max(1, n)).padStart(2, '0');
  }

  function initState() {
    autoPool = buildings.filter((b) => b.kind !== 'station' && !b.landmark);
    peds = [];
    const colors = [PAL.brick, PAL.blueDark, PAL.inkSoft, PAL.brassDark, PAL.brickDark, PAL.blue];
    for (let i = 0; i < 12; i++) {
      const speed = 0.009 + hash1(seed + i * 3.17) * 0.007;
      const dir = hash1(seed + i * 5.7) > 0.5 ? 1 : -1;
      const path = i % 2;
      const phase = hash1(seed + i * 11.3);
      peds.push({
        id: i,
        path,
        speed,
        dir,
        u: mod(phase + clock * speed * dir, 1),
        walk: hash1(seed + i * 2.9) * TAU,
        umbrella: i % 4 === 0,
        color: colors[i % colors.length],
        scale: 0.82 + hash1(seed + i * 7.7) * 0.36
      });
    }
  }

  function turnTimeStep(k) {
    return 45 + 45 * hash1(seed * 0.317 + k * 1.771);
  }
  function turnBuildingAt(k) {
    if (!autoPool.length) return null;
    const i = Math.floor(hash1(seed * 0.573 + k * 2.137) * autoPool.length) % autoPool.length;
    return autoPool[i];
  }

  function initSchedule() {
    turnK = 0;
    nextTurnAt = Infinity;
    for (const b of buildings) {
      b.turning = false;
      b.angle = 0;
      b.push = 0;
      b.pushTarget = 0;
    }
    if (!autoTurns) return;
    let t = 8 + 34 * hash1(seed * 0.131 + 0.7);
    while (t <= clock && turnK < 4000) {
      const b = turnBuildingAt(turnK);
      if (b) {
        b.angle = 1 - b.angle;
        b.pushTarget = b.angle ? 0.7 : 0;
        b.push = b.pushTarget;
      }
      turnK++;
      t += turnTimeStep(turnK);
    }
    nextTurnAt = t;
  }

  function switchPedRoutes(b) {
    for (const ped of peds) {
      if (hash1(b.seed + ped.id * 13.7) < 0.42) ped.path = (ped.path + 1) % 2;
    }
  }

  function showToast(text) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
  }

  function startTurn(b) {
    if (!b || b.kind === 'station' || b.turning) return false;
    b.turning = true;
    b.turnStart = clock;
    b.turnFrom = b.angle;
    b.turnTo = 1 - b.angle;
    b.turnP = 0;
    if (paused) {
      b.turning = false;
      b.angle = b.turnTo;
      b.pushTarget = b.angle ? 0.7 : 0;
      b.push = b.pushTarget;
      switchPedRoutes(b);
      showToast(labelFor(b) + ' · 转身 90°');
      render();
    } else {
      showToast(labelFor(b) + ' · 正在转身');
    }
    return true;
  }

  function completeTurn(b) {
    b.turning = false;
    b.angle = b.turnTo;
    b.turnP = 0;
    b.pushTarget = b.angle ? 0.7 : 0;
    switchPedRoutes(b);
    showToast(labelFor(b) + ' · 转身 90°');
  }

  function update(dt) {
    clock += dt;
    cam.sway = Math.sin((clock * TAU) / 120) * 0.0096;
    cam.breath = 1 + Math.sin((clock * TAU) / 180) * 0.008;
    cam.floatY = Math.sin((clock * TAU) / 60) * 4.5;
    for (const b of buildings) {
      if (b.turning) {
        b.turnP = (clock - b.turnStart) / 0.62;
        if (b.turnP >= 1) completeTurn(b);
      }
      b.push += (b.pushTarget - b.push) * Math.min(1, dt * 3.0);
    }
    for (const ped of peds) {
      ped.u = mod(ped.u + ped.speed * dt * ped.dir, 1);
      ped.walk += dt * 6;
    }
    if (autoTurns && clock >= nextTurnAt) {
      const b = turnBuildingAt(turnK);
      if (b && !b.turning) startTurn(b);
      turnK++;
      nextTurnAt = clock + turnTimeStep(turnK);
    }
    if (clock - lastReadout > 0.2) {
      lastReadout = clock;
      updateReadout();
    }
  }

  function updateReadout() {
    const clockEl = document.getElementById('clockLabel');
    const phaseEl = document.getElementById('phaseLabel');
    const nextEl = document.getElementById('nextLabel');
    if (!clockEl || !phaseEl || !nextEl) return;
    const phase = mod(clock, 600) / 600;
    const total = 6 + phase * 12;
    const hh = Math.floor(total) % 24;
    const mm = Math.floor((total % 1) * 60);
    clockEl.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    if (phase < 0.16) phaseEl.textContent = 'DAWN · 晨';
    else if (phase < 0.4) phaseEl.textContent = 'MORNING · 上午';
    else if (phase < 0.58) phaseEl.textContent = 'NOON · 正午';
    else if (phase < 0.82) phaseEl.textContent = 'AFTERNOON · 午后';
    else phaseEl.textContent = 'DUSK · 黄昏';
    if (autoTurns && Number.isFinite(nextTurnAt)) {
      const left = Math.max(0, nextTurnAt - clock);
      const m = Math.floor(left / 60), s = Math.floor(left % 60);
      nextEl.textContent = 'NEXT TURN ' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    } else {
      nextEl.textContent = 'AUTO TURN OFF';
    }
  }

  function togglePause() {
    paused = !paused;
    if (!paused) lastFrame = 0;
    syncPlayback();
    render();
    updateReadout();
  }

  function frame(now) {
    raf = 0;
    if (paused || document.hidden) { lastFrame = 0; return; }
    if (!lastFrame) lastFrame = now;
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    accumulator += dt;
    if (accumulator >= 1 / 30) {
      update(Math.min(accumulator, 0.1));
      render();
      accumulator = 0;
    }
    raf = requestAnimationFrame(frame);
  }

  function syncPlayback() {
    cancelAnimationFrame(raf);
    raf = 0;
    lastFrame = 0;
    accumulator = 0;
    const btn = document.getElementById('pause');
    if (btn) btn.textContent = paused ? '继续' : '暂停';
    if (!paused && !document.hidden) raf = requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------------
  // 11. 绘制建筑、命中与高亮
  // ---------------------------------------------------------------------------
  function buildingDepth(b) {
    return b.x + b.w + b.y + b.d;
  }

  function effectiveFootprint(b) {
    const angle = b.turning ? (b.turnP >= 0.5 ? b.turnTo : b.turnFrom) : b.angle;
    const bw = angle ? b.d : b.w;
    const bd = angle ? b.w : b.d;
    const cx = b.x + b.w / 2, cy = b.y + b.d / 2;
    return { x0: cx - bw / 2, x1: cx + bw / 2, y0: cy - bd / 2, y1: cy + bd / 2, w: bw, d: bd, cx, cy };
  }

  function drawBuilding(c, b) {
    let angle = b.angle;
    let p = 0;
    if (b.turning) {
      p = clamp(b.turnP, 0, 1);
      angle = p >= 0.5 ? b.turnTo : b.turnFrom;
    }
    const s = getSprite(b, angle);
    const anchor = iso(b.x + b.w / 2, b.y + b.d / 2, 0);
    if (b.turning) {
      const sx = Math.max(0.012, Math.abs(Math.cos(Math.PI * p)));
      const sy = 1 - 0.035 * Math.sin(Math.PI * p);
      // 转身时的墨色弧线
      c.save();
      c.strokeStyle = 'rgba(180,85,60,.45)';
      c.lineWidth = 0.8;
      c.setLineDash([2, 4]);
      c.beginPath();
      c.ellipse(anchor.x, anchor.y + TH * 0.08, TW * 0.58, TH * 0.26, 0, 0, TAU);
      c.stroke();
      c.setLineDash([]);
      c.restore();
      c.save();
      c.translate(anchor.x, anchor.y);
      c.scale(sx, sy);
      c.drawImage(s.canvas, -s.ox, -s.oy, s.cw, s.ch);
      c.restore();
    } else {
      c.drawImage(s.canvas, anchor.x - s.ox, anchor.y - s.oy, s.cw, s.ch);
    }
    drawFlag(c, b);
    drawSmoke(c, b);
  }

  function pointInPoly(px, py, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > py) !== (yj > py)) && (px < ((xj - xi) * (py - yi)) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  function buildingAtNeutral(px, py) {
    const list = buildings.slice().sort((a, b) => buildingDepth(b) - buildingDepth(a));
    for (const b of list) {
      if (b.kind === 'station') continue;
      const eff = effectiveFootprint(b);
      const h = b.h;
      const top = [iso(eff.x0, eff.y0, h), iso(eff.x1, eff.y0, h), iso(eff.x1, eff.y1, h), iso(eff.x0, eff.y1, h)];
      if (pointInPoly(px, py, top)) return b;
      const f1 = [iso(eff.x0, eff.y1, 0), iso(eff.x1, eff.y1, 0), iso(eff.x1, eff.y1, h), iso(eff.x0, eff.y1, h)];
      const f2 = [iso(eff.x1, eff.y1, 0), iso(eff.x1, eff.y0, 0), iso(eff.x1, eff.y0, h), iso(eff.x1, eff.y1, h)];
      if (pointInPoly(px, py, f1) || pointInPoly(px, py, f2)) return b;

    }
    return null;
  }

  function buildingAtScreen(px, py) {
    const n = screenToNeutral(px, py);
    return buildingAtNeutral(n.x, n.y);
  }

  function drawHighlight(c, b) {
    if (!b || b.kind === 'station') return;
    const eff = effectiveFootprint(b);
    const h = b.h;
    const top = [iso(eff.x0, eff.y0, h), iso(eff.x1, eff.y0, h), iso(eff.x1, eff.y1, h), iso(eff.x0, eff.y1, h)];
    const foot = [iso(eff.x0, eff.y0, 0), iso(eff.x1, eff.y0, 0), iso(eff.x1, eff.y1, 0), iso(eff.x0, eff.y1, 0)];
    c.save();
    c.setLineDash([4, 4]);
    c.lineDashOffset = -(clock * 9) % 8;
    c.strokeStyle = 'rgba(201,161,91,.95)';
    c.lineWidth = 1.25;
    polyPath(c, top); c.stroke();
    c.strokeStyle = 'rgba(43,42,38,.35)';
    c.lineWidth = 0.8;
    polyPath(c, foot); c.stroke();
    c.setLineDash([]);
    const mark = iso(eff.cx, eff.cy, h + 0.55);
    c.strokeStyle = 'rgba(43,42,38,.55)';
    c.lineWidth = 1;
    c.beginPath(); c.arc(mark.x, mark.y, Math.max(5, TH * 0.2), 0, TAU); c.stroke();
    c.strokeStyle = PAL.brick;
    c.beginPath();
    c.arc(mark.x, mark.y, Math.max(5, TH * 0.2), -0.5, Math.PI * 1.1);
    c.stroke();
    c.beginPath();
    c.moveTo(mark.x + Math.max(5, TH * 0.2) * 0.55, mark.y - Math.max(5, TH * 0.2) * 0.75);
    c.lineTo(mark.x + Math.max(5, TH * 0.2) * 1.02, mark.y - Math.max(5, TH * 0.2) * 0.1);
    c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------------
  // 12. 渲染
  // ---------------------------------------------------------------------------
  function drawWorldBuilding(c, b) {
    drawBuilding(c, b);
  }

  function render() {
    if (!w || !h) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAL.paper;
    ctx.fillRect(0, 0, w, h);
    if (bakedPaper) ctx.drawImage(bakedPaper, 0, 0, w, h);

    ctx.save();
    const cx = focusX + cam.panX;
    const cy = focusY + cam.panY + cam.floatY;
    ctx.translate(cx, cy);
    ctx.rotate(cam.sway);
    ctx.scale(cam.zoom * cam.breath, cam.zoom * cam.breath);
    ctx.translate(-focusX, -focusY);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.imageSmoothingEnabled = true;

    if (bakedGround) {
      ctx.drawImage(bakedGround.canvas, bakedGround.x0, bakedGround.y0, bakedGround.cw, bakedGround.ch);
    }
    const tramPath = buildRoute(baseTramPath, 1);
    const pedRoutes = pedBasePaths.map((p) => buildRoute(p, 0.55));
    drawTrack(ctx, tramPath);
    drawCanalFlow(ctx);
    drawCanalStepFlow(ctx);

    const items = [];
    for (const b of buildings) items.push({ type: 'building', b, depth: buildingDepth(b) });
    items.push({ type: 'monument', depth: 22.58 });
    for (const tram of trams) {
      const phase = mod(clock + tram.offset, 90);
      const u = phase < 4 ? 0.5 : mod(0.5 + (phase - 4) / 86, 1);
      const p = sampleRoute(tramPath, u);
      items.push({ type: 'tram', tram, depth: p.x + p.y + 0.22 });
    }
    for (const ped of peds) {
      const p = sampleRoute(pedRoutes[ped.path], ped.u);
      items.push({ type: 'ped', ped, p, depth: p.x + p.y + 0.08 });
    }
    for (const tree of TREES) items.push({ type: 'tree', tree, depth: tree.x + tree.y + 0.1 });
    if (wideMode) for (const b of wideExtras) items.push({ type: 'extra', b, depth: buildingDepth(b) });
    items.sort((a, b) => a.depth - b.depth);

    for (const item of items) {
      if (item.type === 'building') drawWorldBuilding(ctx, item.b);
      else if (item.type === 'monument') drawMonument(ctx);
      else if (item.type === 'tram') drawTram(ctx, tramPath, item.tram);
      else if (item.type === 'ped') drawPed(ctx, item.ped, item.p);
      else if (item.type === 'tree') drawTree(ctx, item.tree);
      else if (item.type === 'extra') {
        const b = item.b;
        const eff = effectiveFootprint(b);
        fillPoly(ctx, [
          iso(eff.x0 - 0.2, eff.y0 - 0.2), iso(eff.x1 + 0.2, eff.y0 - 0.2),
          iso(eff.x1 + 0.2, eff.y1 + 0.2), iso(eff.x0 - 0.2, eff.y1 + 0.2)
        ], 'rgba(70,84,92,.08)');
        fillPoly(ctx, [
          iso(eff.x0 - 0.1, eff.y0 - 0.1), iso(eff.x1 + 0.1, eff.y0 - 0.1),
          iso(eff.x1 + 0.1, eff.y1 + 0.1), iso(eff.x0 - 0.1, eff.y1 + 0.1)
        ], mix(PAL.paper, PAL.paperLight, 0.3));
        drawBuilding(ctx, b);
      }
    }

    if (hovered) drawHighlight(ctx, hovered);
    else if (selected >= 0) {
      const b = autoPool[selected % Math.max(1, autoPool.length)];
      if (b) drawHighlight(ctx, b);
    }
    ctx.restore();

    drawDayTint(ctx);
    drawBirds(ctx);
    if (bakedFg) ctx.drawImage(bakedFg, 0, 0, w, h);
    frames++;
  }

  // ---------------------------------------------------------------------------
  // 13. 尺寸、水渠三角形、初始化
  // ---------------------------------------------------------------------------
  function rebuildWater() {
    const outer = [], inner = [];
    for (const p of canalPath) {
      outer.push(iso(p.x + p.nx * 0.34, p.y + p.ny * 0.34));
      inner.push(iso(p.x - p.nx * 0.34, p.y - p.ny * 0.34));
    }
    WATER = { outer, inner };
  }

  function resize() {
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 1.5, Math.sqrt(2600000 / (w * h)));
    dpr = Math.max(0.42, dpr);
    spriteDpr = clamp(devicePixelRatio || 1, 0.8, 1.3);
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;

    const aspect = w / h;
    wideMode = aspect > 2.05;
    if (aspect < 0.95) TW = w * 0.14;
    else if (aspect > 2.05) TW = Math.min((w * 0.86) / GRID, h * 0.070);
    else TW = Math.min((w * 0.86) / GRID, h * 0.076);
    TW = Math.max(8, TW);
    TH = TW * 0.5;
    focusX = w * 0.5;
    focusY = h * (aspect < 0.95 ? 0.585 : aspect > 2.05 ? 0.53 : 0.535);
    cam.zoom = zoom;
    cam.panX = clamp(cam.panX, -TW * 1.05, TW * 1.05);
    cam.panY = clamp(cam.panY, -TH * 1.6, TH * 1.6);

    spriteCache.clear();
    MON.sprite = null;
    makeGrain();
    bakePaper();
    rebuildWater();
    bakeGround();
    bakeForeground();
    bakeMonument();
    render();
  }

  // ---------------------------------------------------------------------------
  // 14. 输入
  // ---------------------------------------------------------------------------
  function updateHover(px, py) {
    const b = buildingAtScreen(px, py);
    const id = b ? b.id : null;
    if (id !== hovered) {
      hovered = id;
      canvas.classList.toggle('hot', !!b);
      render();
    }
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (w / r.width), y: (e.clientY - r.top) * (h / r.height) };
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const p = pointerPos(e);
    drag = { x: p.x, y: p.y, moved: 0, dragging: false, time: performance.now(), id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  }

  function onPointerMove(e) {
    const p = pointerPos(e);
    if (drag) {
      const dx = p.x - drag.x, dy = p.y - drag.y;
      drag.moved += Math.hypot(dx, dy);
      if (drag.moved > 5) {
        drag.dragging = true;
        canvas.classList.add('dragging');
        cam.panX = clamp(cam.panX + dx, -TW * 1.05, TW * 1.05);
        cam.panY = clamp(cam.panY + dy, -TH * 1.6, TH * 1.6);
        drag.x = p.x; drag.y = p.y;
        render();
      }
    } else {
      updateHover(p.x, p.y);
    }
  }

  function onPointerUp(e) {
    if (!drag) return;
    const wasDrag = drag.dragging;
    const elapsed = performance.now() - drag.time;
    drag = null;
    canvas.classList.remove('dragging');
    if (wasDrag || elapsed > 700) return;
    const p = pointerPos(e);
    const b = buildingAtScreen(p.x, p.y);
    if (b) {
      startTurn(b);
    } else {
      selected = -1;
      render();
    }
  }

  function onWheel(e) {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0011);
    zoom = clamp(zoom * factor, 0.8, 1.2);
    cam.zoom = zoom;
    render();
  }

  function onKeyDown(e) {
    if (e.target && e.target.matches && e.target.matches('input,select,button,textarea')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'h' || e.key === 'H') {
      document.body.classList.toggle('hud-off');
      document.body.classList.remove('quiet');
      clearTimeout(quietTimer);
    } else if (e.key === 'f' || e.key === 'F') {
      fullscreen();
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      if (!autoPool.length) return;
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      selected = mod(selected + dir, autoPool.length);
      hovered = autoPool[selected].id;
      canvas.classList.add('hot');
      render();
      showToast(labelFor(autoPool[selected]) + ' · Enter 转身');
    } else if (e.key === 'Enter' && selected >= 0) {
      const b = autoPool[selected % autoPool.length];
      if (b) startTurn(b);
    } else if (e.key === 'Escape') {
      selected = -1;
      hovered = null;
      canvas.classList.remove('hot');
      render();
    }
  }

  async function fullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* some hosts disable fullscreen */ }
  }

  function recenter() {
    cam.panX = 0;
    cam.panY = 0;
    zoom = initialZoom;
    cam.zoom = zoom;
    selected = -1;
    hovered = null;
    render();
    showToast('视角已复位');
  }

  // ---------------------------------------------------------------------------
  // 15. 启动
  // ---------------------------------------------------------------------------
  function bindUi() {
    const settings = document.getElementById('settings');
    const panel = document.getElementById('panel');
    if (settings && panel) {
      settings.addEventListener('click', () => {
        panel.hidden = !panel.hidden;
        settings.setAttribute('aria-expanded', String(!panel.hidden));
      });
    }
    const pauseBtn = document.getElementById('pause');
    if (pauseBtn) pauseBtn.addEventListener('click', togglePause);
    const fsBtn = document.getElementById('fullscreen');
    if (fsBtn) fsBtn.addEventListener('click', fullscreen);
    const recBtn = document.getElementById('recenter');
    if (recBtn) recBtn.addEventListener('click', recenter);
    const autoBox = document.getElementById('auto');
    if (autoBox) {
      autoBox.checked = autoTurns;
      autoBox.addEventListener('change', (e) => {
        autoTurns = e.target.checked;
        if (autoTurns) nextTurnAt = clock + 6;
        else nextTurnAt = Infinity;
        updateReadout();
      });
    }
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });
    canvas.addEventListener('pointerleave', () => {
      if (!drag && hovered) { hovered = null; canvas.classList.remove('hot'); render(); }
    });
    canvas.addEventListener('wheel', onWheel, { passive: false });
    addEventListener('keydown', onKeyDown);
    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', syncPlayback);
    reducedMotion.addEventListener('change', (e) => {
      if (!params.has('still')) {
        paused = e.matches;
        syncPlayback();
        render();
      }
    });
    if (!hud) document.body.classList.add('hud-off');
    quietTimer = setTimeout(() => document.body.classList.add('quiet'), 14000);
  }

  function exposeTestHooks() {
    globalThis.__lumenTown = {
      state() {
        return {
          seed, clock, paused, autoTurns, w, h, dpr, TW, TH, frames, focusX, focusY, camX: cam.panX, camY: cam.panY, camZoom: cam.zoom,
          buildings: buildings.length,
          wide: wideMode,
          extras: wideExtras.length,
          canalSteps: CANAL_STEPS.length,
          canalStepZ: CANAL_STEPS.map((s) => s.z),
          trams: trams.length,
          peds: peds.length,
          turnK,
          nextTurnAt,
          problems: layoutProblems,
          route: buildRoute(baseTramPath, 1).length,
          water: WATER ? WATER.outer.length : 0
        };
      },
      update,
      render,
      resize,
      setClock(v) { clock = v; },
      setPaused(v) { paused = !!v; syncPlayback(); },
      startTurnById(id) {
        const b = buildings.find((q) => q.id === id);
        return startTurn(b);
      },
      startTurnAt(i) { return startTurn(autoPool[i % autoPool.length]); },
      buildingAt(x, y) { return buildingAtNeutral(x, y); },
      screenOf(id) {
        const b = buildings.find((q) => q.id === id);
        if (!b) return null;
        return iso(b.x + b.w / 2, b.y + b.d / 2, 0);
      },
      renderedPoint(id) {
        const b = buildings.find((q) => q.id === id);
        if (!b) return null;
        const p = iso(b.x + b.w / 2, b.y + b.d / 2, 0);
        const s = cam.zoom * cam.breath;
        const dx = p.x - focusX, dy = p.y - focusY;
        const cs = Math.cos(cam.sway), sn = Math.sin(cam.sway);
        return {
          x: focusX + cam.panX + (dx * cs - dy * sn) * s,
          y: focusY + cam.panY + cam.floatY + (dx * sn + dy * cs) * s
        };
      },
      routes() {
        return {
          tram: buildRoute(baseTramPath, 1),
          ped: pedBasePaths.map((p) => buildRoute(p, 0.55)),
          canal: canalPath
        };
      },
      buildings,
      autoPool,
      peds,
      trams,
      layoutProblems,
      monument: MON
    };
  }

  function start() {
    makeGrain();
    initState();
    initSchedule();
    bindUi();
    resize();
    updateReadout();
    if (params.get('verify') === '1') exposeTestHooks();
    render();
    syncPlayback();
    if (paused) render();
  }

  start();


})();
</script>
</body>
</html>
