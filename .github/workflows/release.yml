name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build & publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "标签 $env:GITHUB_REF_NAME 与 package.json 版本 $expected 不一致。请先运行 npm version 更新版本。"
          }
          Write-Host "发布版本：$expected"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wallpaper-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

      # Publish once, after every artifact is complete. Concurrent electron-builder
      # publishers can create separate releases for the installer and blockmap.
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($existing) { throw "Release $tag already exists. Inspect it before retrying; existing assets will not be overwritten." }
          $names = @("Lumen Wallpaper Setup $version.exe", "Lumen Wallpaper $version.exe", "Lumen Wallpaper Setup $version.exe.blockmap", 'latest.yml')
          $staging = New-Item -ItemType Directory -Path 'dist/release-assets' -Force
          foreach ($name in $names) {
            $source = Get-Item -LiteralPath (Join-Path 'dist' $name)
            if ($source.Length -eq 0) { throw "Empty artifact: $name" }
            Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $staging.FullName ($name -replace ' ', '-'))
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Lumen Wallpaper $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create release draft' }
          $assets = @(Get-ChildItem -LiteralPath $staging.FullName -File | ForEach-Object FullName)
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft' }
          $publishedAssets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets' }
          foreach ($file in Get-ChildItem -LiteralPath $staging.FullName -File) {
            $uploaded = @($publishedAssets.assets | Where-Object { $_.name -eq $file.Name -and $_.size -eq $file.Length })
            if ($uploaded.Count -ne 1) { throw "Missing or incomplete asset: $($file.Name)" }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish complete release' }
