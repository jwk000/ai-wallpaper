<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece2cd">
<title>长平 · 战于野 · Battle of Changping</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ece2cd}
  body{font-family:"STKaiti","KaiTi","FangSong","Songti SC",serif;user-select:none;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;background:#ece2cd}
  .paper-grain,.vignette{position:fixed;inset:0;pointer-events:none;z-index:1}
  .paper-grain{mix-blend-mode:multiply;opacity:.52;background-repeat:repeat;background-size:320px 320px}
  .vignette{
    mix-blend-mode:multiply;
    background:radial-gradient(ellipse at 50% 46%,rgba(60,45,24,0) 42%,rgba(60,45,24,.035) 72%,rgba(60,45,24,.11) 100%);
  }
  .colophon{
    position:fixed;z-index:2;top:clamp(24px,5.2vh,68px);right:clamp(24px,4.2vw,78px);
    display:flex;align-items:flex-start;gap:clamp(10px,1.2vw,20px);
    color:#29322f;pointer-events:none;
    opacity:0;transform:translateY(-6px);
    transition:opacity 2.4s ease .7s,transform 2.4s ease .7s;
    mix-blend-mode:multiply;
  }
  body.ready .colophon{opacity:.96;transform:none}
  .vtitle{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:clamp(18px,1.7vw,32px);letter-spacing:.24em;line-height:1.18;
    font-weight:600;color:#1f2824;text-shadow:none;
  }
  .vtitle small{
    display:block;font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;
    font-size:clamp(6px,.47vw,9px);letter-spacing:.28em;font-weight:400;
    color:#55625b;margin-top:1.4em;
  }
  .vtitle small.names{
    font-family:"STKaiti","KaiTi","FangSong",serif;
    font-size:clamp(8px,.7vw,12px);letter-spacing:.18em;color:#7c2f26;
    margin-top:1.1em;
  }
  .seal{
    width:clamp(27px,2.05vw,38px);height:clamp(27px,2.05vw,38px);
    border:1.5px solid rgba(142,54,42,.8);color:#8e362a;
    display:grid;place-items:center;font-size:clamp(14px,1.15vw,21px);
    line-height:1;margin-top:2px;
    box-shadow:inset 0 0 0 2px rgba(142,54,42,.12);
    transform:rotate(1.2deg);
  }
  .seal span{transform:translateY(-.04em)}
  .clean .colophon{display:none}
  @media (max-width:720px),(max-aspect-ratio:1/1){
    .colophon{top:20px;right:18px;opacity:.6}
    .vtitle{font-size:15px}
    .vtitle small{display:none}
    .seal{width:24px;height:24px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="长平之战全景长卷：公元前260年，秦将白起与赵将赵括在长平旷野决战。玄色秦军与赤色赵军在壁垒、营帐、军旗之间以长矛、盾阵、弓弩、骑兵和双马战车厮杀；秦军骑兵从侧翼合围，箭雨落下，赵卒中刀溅血、倒地、被俘，伤兵在残车与断旗之间爬行。"></canvas>
<div class="paper-grain" id="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="colophon" aria-hidden="true">
  <div class="vtitle">長平 · 戰於野<small>BATTLE OF CHANGPING · 260 BCE</small><small class="names">秦 · 白起　趙 · 趙括</small></div>
  <div class="seal"><span>戰</span></div>
</div>

<script>

'use strict';
(() => {
  /* ---------------------------------------------------------------------
     Everything is vector line-work on canvas: no images, no network.
     --------------------------------------------------------------------- */

  const TAU = Math.PI * 2;
  const DESIGN_H = 1080;
  const WORLD_W = 4000;
  const VIEW_TOP = 250;
  const VIEW_H = 820;
  const FOCUS_Y = VIEW_TOP + VIEW_H * .5;
  const canvas = document.getElementById('stage');
  let ctx = canvas.getContext('2d', { alpha: false });
  const BG_SCALE = 1.5;

  const PAL = {
    paper: '#ece2cd',
    paperHigh: '#f4ecdd',
    paperLow: '#dfd2b8',
    haze: '#eee5d3',
    ink: '#26312e',
    inkSoft: '#46534e',
    inkFaint: '#6b746c',
    indigo: '#42606a',
    indigoMid: '#69878b',
    indigoPale: '#a5b7b4',
    indigoDark: '#263f49',
    rust: '#a24c39',
    rustMid: '#bd7258',
    rustPale: '#d6a58b',
    rustDark: '#743127',
    ochre: '#b0854d',
    ochrePale: '#cfb181',
    jade: '#7f9484',
    jadePale: '#b7c3b1',
    skin: '#dcc09d',
    bone: '#d4c4a3',
    blood: '#77201f',
    bloodPale: '#b34638',
  };

  const SIDE = {
    jin: {
      name: '秦军',
      cloth: PAL.indigo,
      clothMid: PAL.indigoMid,
      clothPale: PAL.indigoPale,
      dark: PAL.indigoDark,
      accent: PAL.jadePale,
      trousers: '#526a6f',
      plume: PAL.jadePale,
      flag: PAL.indigo,
    },
    chi: {
      name: '赵军',
      cloth: PAL.rust,
      clothMid: PAL.rustMid,
      clothPale: PAL.rustPale,
      dark: PAL.rustDark,
      accent: PAL.ochrePale,
      trousers: '#8d654d',
      plume: PAL.rustPale,
      flag: PAL.rust,
    },
  };

  const state = {
    W: 0, H: 0, dpr: 1, scale: 1, visW: 1920, visH: 1080,
    camX: 0, camMax: 0, offY: 0,
    start: performance.now(),
    sceneTime: 30,
    reduced: false,
    poster: null,
    clean: false,
    grain: null,
  };

  const qs = new URLSearchParams(location.search);
  if (qs.has('clean')) state.clean = true;
  if (qs.has('still')) {
    state.poster = {
      t: qs.has('t') ? Number(qs.get('t')) : null,
      cam: qs.has('cam') ? Number(qs.get('cam')) : null,
    };
  }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    state.reduced = true;
  }

  /* ---------------------------------- utils --------------------------- */

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function easeOut(t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) {
    t = clamp(t, 0, 1);
    return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function mod(a, n) { return ((a % n) + n) % n; }
  function hash(n) {
    n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
    return n >>> 0;
  }
  function rng(seed) {
    let a = hash(seed | 0);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pulse(t, period, offset, attack, hold, release) {
    const u = mod(t + offset, period);
    if (u < attack) return easeOut(u / attack);
    if (u < attack + hold) return 1;
    if (u < attack + hold + release) return 1 - smooth((u - attack - hold) / release);
    return 0;
  }
  function burst(q, seed, n) {
    if (q <= 0 || q >= 1) return [];
    const R = rng(seed);
    const out = [];
    for (let i = 0; i < n; i++) {
      out.push({
        x: (R() - .15) * 46 * q,
        y: -14 - R() * 30 * q,
        r: .5 + R() * 2.3,
        a: R() * .8 + .2,
        d: .3 + R() * .7,
      });
    }
    return out;
  }

  function inkLine(x1, y1, x2, y2, w = 1, a = 1, color = PAL.ink) {
    ctx.globalAlpha = a;
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function poly(points, fill, stroke = null, lw = 1, alpha = 1, close = true) {
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    if (close) ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function ellipse(x, y, rx, ry, fill, stroke = null, lw = 1, alpha = 1, rot = 0) {
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function ik(a, b, l1, l2, bend = 1) {
    let dx = b.x - a.x, dy = b.y - a.y;
    let d = Math.hypot(dx, dy) || .0001;
    const max = l1 + l2 - .05;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    const base = Math.atan2(dy, dx);
    const cosA = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
    const off = Math.acos(cosA);
    const ang = base - off * bend;
    return { x: a.x + Math.cos(ang) * l1, y: a.y + Math.sin(ang) * l1 };
  }
  function limb(a, b, c, width, fill, outline = PAL.ink, oa = 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = oa;
    ctx.strokeStyle = outline; ctx.lineWidth = width + 1.35;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.stroke();
    ctx.strokeStyle = fill; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function qcurve(p0, p1, p2, color, lw, alpha = 1) {
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function pointOn(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }

  /* ---------------------------------- paper --------------------------- */

  function makeGrain() {
    const c = document.createElement('canvas');
    c.width = c.height = 320;
    const g = c.getContext('2d');
    const R = rng(9921);
    g.clearRect(0, 0, 320, 320);
    for (let i = 0; i < 1400; i++) {
      const x = R() * 320, y = R() * 320;
      const a = R() * .055;
      g.fillStyle = R() > .5 ? `rgba(70,57,38,${a})` : `rgba(255,251,239,${a})`;
      g.fillRect(x, y, R() * 1.6 + .3, R() * 1.2 + .3);
    }
    g.strokeStyle = 'rgba(90,74,48,.045)';
    g.lineWidth = .6;
    for (let i = 0; i < 34; i++) {
      const x = R() * 320, y = R() * 320, len = 12 + R() * 54;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + len * .4, y + (R() - .5) * 8, x + len, y + (R() - .5) * 9);
      g.stroke();
    }
    for (let i = 0; i < 26; i++) {
      const x = R() * 320, y = R() * 320;
      g.strokeStyle = `rgba(66,55,36,${.018 + R() * .022})`;
      g.lineWidth = .55;
      g.beginPath(); g.arc(x, y, 4 + R() * 24, R() * TAU, R() * TAU + .8); g.stroke();
    }
    return c;
  }

  /* ---------------------------------- resize -------------------------- */

  function resize() {
    state.W = Math.max(1, window.innerWidth);
    state.H = Math.max(1, window.innerHeight);
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.scale = Math.max(state.H / VIEW_H, state.W / WORLD_W);
    state.visW = state.W / state.scale;
    state.visH = state.H / state.scale;
    state.offY = VIEW_TOP + (VIEW_H - state.visH) * .5;
    state.camMax = Math.max(0, WORLD_W - state.visW);
    canvas.width = Math.round(state.W * state.dpr);
    canvas.height = Math.round(state.H * state.dpr);
    canvas.style.width = state.W + 'px';
    canvas.style.height = state.H + 'px';
  }

  /* ---------------------------------- sky / land ---------------------- */

  const ridges = [];
  function buildRidges() {
    const specs = [
      { seed: 11, base: 410, amp: 96, step: 150, fill: '#748b88', fa: .17, la: .25, lw: .9 },
      { seed: 27, base: 455, amp: 74, step: 118, fill: '#58736f', fa: .13, la: .22, lw: 1.05 },
      { seed: 41, base: 494, amp: 44, step: 92, fill: '#3d5855', fa: .1, la: .17, lw: .9 },
    ];
    for (const spec of specs) {
      const R = rng(spec.seed);
      const pts = [];
      for (let x = -420; x <= WORLD_W + 420; x += spec.step) {
        const n = Math.sin(x * .0031 + spec.seed) * .45 + Math.sin(x * .0087 - spec.seed) * .3 + (R() - .5) * .5;
        pts.push({ x, y: spec.base - spec.amp * (.3 + n * .7) });
      }
      ridges.push({ ...spec, pts });
    }
  }

  function drawSkyStatic() {
    const grad = ctx.createLinearGradient(0, -40, 0, 560);
    grad.addColorStop(0, '#f7f0e1');
    grad.addColorStop(.58, '#efe5d0');
    grad.addColorStop(1, '#e8ddc5');
    ctx.fillStyle = grad;
    ctx.fillRect(-500, -120, WORLD_W + 1000, 700);

    // A low, pale sun behind the dust of the plain.
    ctx.save();
    ctx.globalAlpha = .13;
    ctx.fillStyle = PAL.rustMid;
    ctx.beginPath(); ctx.arc(990, 305, 55, 0, TAU); ctx.fill();
    ctx.globalAlpha = .18;
    ctx.strokeStyle = PAL.rust;
    ctx.lineWidth = .9;
    ctx.beginPath(); ctx.arc(990, 305, 56, 0, TAU); ctx.stroke();
    ctx.globalAlpha = .06;
    ctx.beginPath(); ctx.arc(990, 305, 82, 0, TAU); ctx.stroke();
    ctx.restore();

    // Long silk-like cloud bands, baked into the scroll paper.
    drawCloud(300, 294, 1.25, 0, .2);
    drawCloud(880, 242, .92, 8, .15);
    drawCloud(1500, 330, 1.45, 2, .18);
    drawCloud(2170, 276, 1.05, 12, .15);
    drawCloud(2810, 322, 1.5, 5, .17);
    drawCloud(3510, 258, 1.18, 18, .16);
    drawCloud(3860, 330, .8, 22, .13);

    // Fine, dry ink clouds near the ridge line.
    ctx.save();
    ctx.globalAlpha = .13;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .7;
    for (let i = 0; i < 18; i++) {
      const R = rng(240 + i);
      const x = R() * WORLD_W, y = 360 + R() * 70;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.bezierCurveTo(x + 30, y - 8, x + 72, y + 4, x + 110, y - 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSkyDynamic(t) {
    drawBirds(t);
  }

  function drawBirds(t) {
    const groups = [
      { x: 780, y: 320, n: 5, s: .85, p: 0.1 },
      { x: 1740, y: 286, n: 7, s: 1.05, p: 1.8 },
      { x: 3120, y: 338, n: 4, s: .8, p: 3.2 },
      { x: 3660, y: 296, n: 6, s: .9, p: 4.6 },
    ];
    ctx.save();
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .85;
    for (const g of groups) {
      const drift = mod(t * 2.2 + g.x, WORLD_W + 400) - 200;
      for (let i = 0; i < g.n; i++) {
        const R = rng(g.x + i * 17);
        const x = drift + (R() - .5) * 92;
        const y = g.y + (R() - .5) * 34 + Math.sin(t * .45 + i + g.p) * 6;
        const flap = Math.sin(t * 3.4 + i * 1.3 + g.p) * .55;
        const s = g.s * (0.75 + R() * .45);
        ctx.globalAlpha = .3 + R() * .22;
        ctx.beginPath();
        ctx.moveTo(x - 7 * s, y + 2 * s);
        ctx.quadraticCurveTo(x - 3 * s, y - 3 * s - flap * 3, x, y);
        ctx.quadraticCurveTo(x + 3 * s, y - 3 * s - flap * 3, x + 7 * s, y + 2 * s);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawCloud(x, y, s, t, a) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s * .62);
    const sway = Math.sin(t * .035 + x) * 6;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f8f2e5';
    ctx.beginPath();
    ctx.moveTo(-150 + sway, 8);
    ctx.bezierCurveTo(-110, -20, -74, -4, -46, -10);
    ctx.bezierCurveTo(-16, -34, 32, -26, 48, -6);
    ctx.bezierCurveTo(88, -22, 126, -4, 160, 4);
    ctx.bezierCurveTo(112, 24, 68, 14, 26, 22);
    ctx.bezierCurveTo(-28, 32, -92, 25, -150, 8);
    ctx.fill();
    ctx.globalAlpha = a * 1.9;
    ctx.strokeStyle = PAL.inkFaint;
    ctx.lineWidth = .65;
    ctx.beginPath();
    ctx.moveTo(-134 + sway, 8);
    ctx.bezierCurveTo(-78, 12, -34, 17, 12, 14);
    ctx.bezierCurveTo(62, 12, 104, 7, 144, 4);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawMountains(t) {
    for (let i = 0; i < ridges.length; i++) {
      const r = ridges[i];
      ctx.globalAlpha = r.fa;
      ctx.fillStyle = r.fill;
      ctx.beginPath();
      ctx.moveTo(r.pts[0].x, 620);
      for (const p of r.pts) ctx.lineTo(p.x, p.y);
      ctx.lineTo(r.pts[r.pts.length - 1].x, 620);
      ctx.closePath();
      ctx.fill();

      ctx.globalAlpha = r.la;
      ctx.strokeStyle = r.fill;
      ctx.lineWidth = r.lw;
      ctx.beginPath();
      ctx.moveTo(r.pts[0].x, r.pts[0].y);
      for (let j = 1; j < r.pts.length; j++) {
        const p = r.pts[j], q = r.pts[j - 1];
        ctx.quadraticCurveTo(q.x + (p.x - q.x) * .5, q.y, p.x, p.y);
      }
      ctx.stroke();
    }

    // Pale ridge texture: short dry-brush marks following the slopes.
    const R = rng(708);
    ctx.globalAlpha = .12;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .7;
    for (let i = 0; i < 520; i++) {
      const x = R() * WORLD_W;
      const base = 405 + R() * 120;
      const y = base - R() * 62;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 6 + R() * 16, y + (R() - .5) * 8, x + 14 + R() * 26, y + (R() - .5) * 11);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Mist settling at the foot of the hills.
    const mist = ctx.createLinearGradient(0, 455, 0, 585);
    mist.addColorStop(0, 'rgba(238,229,211,0)');
    mist.addColorStop(.55, 'rgba(238,229,211,.52)');
    mist.addColorStop(1, 'rgba(232,221,198,.82)');
    ctx.fillStyle = mist;
    ctx.fillRect(-400, 455, WORLD_W + 800, 150);
  }

  function drawSmokeColumn(x, y, height, phase, alpha = .12, w = 1) {
    const T = state.sceneTime;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const p = mod(T * .018 + i / 8 + phase, 1);
      const yy = y - p * height;
      const drift = Math.sin(p * 5.4 + phase * 3 + T * .22) * (5 + p * 30) * w;
      const sway = Math.sin(T * .38 + i + phase * 4) * (4 + p * 14) * w;
      ctx.lineWidth = (1.1 + p * 1.8) * w;
      ctx.beginPath();
      ctx.arc(drift + sway, yy, (5 + p * 24) * w, .25 + p * .4, 2.75 + p * .5);
      ctx.stroke();
    }
    ctx.globalAlpha = alpha * .62;
    ctx.fillStyle = PAL.haze;
    for (let i = 0; i < 4; i++) {
      const p = mod(T * .014 + i / 4 + phase, 1);
      const yy = y - p * height;
      const xx = Math.sin(p * 4.4 + phase) * (8 + p * 28) * w;
      ctx.beginPath();
      ctx.ellipse(xx, yy, (9 + p * 27) * w, (4 + p * 11) * w, .2, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function buildDistantTrees() {
    const R = rng(661);
    const trees = [];
    for (let i = 0; i < 190; i++) {
      const x = -60 + R() * (WORLD_W + 120);
      const y = 518 + R() * 34;
      const s = .35 + R() * .7;
      trees.push({ x, y, s, kind: R() > .5 ? 'pine' : 'willow', a: .22 + R() * .19 });
    }
    return trees;
  }
  const distantTrees = buildDistantTrees();

  function drawDistantTrees() {
    for (const tr of distantTrees) drawSmallTree(tr);
  }
  function drawSmallTree(tr) {
    const { x, y, s, kind, a } = tr;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.globalAlpha = a;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.fillStyle = PAL.jade;
    ctx.lineWidth = 1.1;
    if (kind === 'pine') {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -34); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const yy = -12 - i * 7;
        ctx.beginPath(); ctx.moveTo(0, yy);
        ctx.lineTo(-8 - i * 2, yy + 5); ctx.lineTo(-3, yy + 3);
        ctx.lineTo(0, yy + 8); ctx.lineTo(3, yy + 3);
        ctx.lineTo(8 + i * 2, yy + 5); ctx.closePath();
        ctx.fillStyle = 'rgba(89,112,101,.26)'; ctx.fill();
        ctx.strokeStyle = 'rgba(60,80,74,.26)'; ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-2, -16, 1, -28); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const bx = -11 + i * 5.5;
        ctx.beginPath(); ctx.moveTo(0, -18 - i * 2);
        ctx.quadraticCurveTo(bx * .6, -23 - i * 2, bx, -29 + Math.abs(i - 2) * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = a * .7;
      ctx.fillStyle = 'rgba(105,125,104,.24)';
      ctx.beginPath(); ctx.ellipse(-2, -30, 16, 7, -.1, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawGround(t) {
    const g = ctx.createLinearGradient(0, 450, 0, 1080);
    g.addColorStop(0, 'rgba(232,221,197,0)');
    g.addColorStop(.035, 'rgba(232,221,197,.42)');
    g.addColorStop(.11, 'rgba(235,225,202,.94)');
    g.addColorStop(.16, '#ebe1ca');
    g.addColorStop(.6, '#e7dcc3');
    g.addColorStop(1, '#e2d4b8');
    ctx.fillStyle = g;
    ctx.fillRect(-400, 450, WORLD_W + 800, 650);

    // a soft band of plain mist above the first fields
    const horizonFade = ctx.createLinearGradient(0, 430, 0, 610);
    horizonFade.addColorStop(0, 'rgba(238,229,211,0)');
    horizonFade.addColorStop(.35, 'rgba(238,229,211,.3)');
    horizonFade.addColorStop(.6, 'rgba(238,229,211,.16)');
    horizonFade.addColorStop(1, 'rgba(238,229,211,0)');
    ctx.fillStyle = horizonFade;
    ctx.fillRect(-400, 430, WORLD_W + 800, 180);

    // Broad, dry field washes.
    ctx.save();
    ctx.globalAlpha = .13;
    ctx.fillStyle = PAL.ochrePale;
    ctx.beginPath();
    ctx.moveTo(-300, 590);
    ctx.bezierCurveTo(700, 575, 1250, 602, 2000, 590);
    ctx.bezierCurveTo(2800, 578, 3400, 603, 4300, 584);
    ctx.lineTo(4300, 690); ctx.bezierCurveTo(3300, 708, 2400, 680, 1600, 700);
    ctx.bezierCurveTo(760, 718, 200, 690, -300, 706);
    ctx.closePath(); ctx.fill();

    ctx.globalAlpha = .08;
    ctx.fillStyle = PAL.jade;
    ctx.beginPath();
    ctx.moveTo(-300, 780);
    ctx.bezierCurveTo(900, 750, 1600, 792, 2300, 768);
    ctx.bezierCurveTo(3100, 742, 3650, 780, 4300, 758);
    ctx.lineTo(4300, 910); ctx.bezierCurveTo(3300, 930, 2600, 894, 1900, 918);
    ctx.bezierCurveTo(1100, 942, 300, 900, -300, 922);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // Field contours.
    const R = rng(302);
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .65;
    for (let i = 0; i < 21; i++) {
      const y0 = 548 + i * 26 + R() * 9;
      ctx.globalAlpha = .045 + R() * .035;
      ctx.beginPath();
      ctx.moveTo(-200, y0);
      for (let x = -200; x < WORLD_W + 300; x += 140) {
        const yy = y0 + Math.sin(x * .007 + i) * 4 + Math.sin(x * .0023 - i * 1.7) * 7;
        ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Cart ruts and bare earth.
    drawRut(1300, 1010, 2400, 870, .06);
    drawRut(1360, 990, 2460, 858, .05);
    drawRut(2450, 1050, 3400, 930, .055);
    drawRut(2520, 1028, 3460, 912, .045);

    // Churned earth under the press of men, horses and wheels.
    const M = rng(1442);
    for (let i = 0; i < 54; i++) {
      const x = 1180 + M() * 1780;
      const y = 760 + M() * 280;
      const rx = 16 + M() * 44, ry = 3 + M() * 8;
      ctx.globalAlpha = .035 + M() * .045;
      ctx.fillStyle = M() > .35 ? PAL.ochre : PAL.inkSoft;
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, (M() - .5) * .12, 0, TAU); ctx.fill();
      ctx.globalAlpha = .09 + M() * .08;
      ctx.strokeStyle = PAL.ochre;
      ctx.lineWidth = .6;
      ctx.beginPath();
      ctx.moveTo(x - rx * .8, y + 1);
      ctx.quadraticCurveTo(x, y + 4, x + rx * .8, y + 1);
      ctx.stroke();
    }
    // hoofprints around the chariot and horse lines
    ctx.globalAlpha = .13;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .65;
    for (let i = 0; i < 70; i++) {
      const x = 1250 + M() * 1900;
      const y = 820 + M() * 230;
      ctx.beginPath(); ctx.arc(x, y, 1.3, .25, 2.6); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Grass and stones.
    const G = rng(908);
    for (let i = 0; i < 430; i++) {
      const x = G() * WORLD_W;
      const y = 535 + Math.pow(G(), 1.55) * 520;
      const depth = clamp((y - 520) / 550, 0, 1);
      const s = .35 + depth * 1.7 + G() * .5;
      ctx.globalAlpha = .17 + G() * .19;
      ctx.strokeStyle = G() > .25 ? PAL.inkSoft : PAL.ochre;
      ctx.lineWidth = .55 + depth * .35;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let b = 0; b < 3 + (G() * 3 | 0); b++) {
        const bx = x + (G() - .5) * 5 * s;
        const by = y - (2 + G() * 7) * s;
        ctx.moveTo(x + (G() - .5) * 1.5, y);
        ctx.quadraticCurveTo(x + (G() - .5) * 4, y - 4 * s, bx, by);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Low scrub and stones at the horizon.
    for (let i = 0; i < 90; i++) {
      const x = G() * WORLD_W, y = 526 + G() * 28, s = .4 + G() * .5;
      ellipse(x, y, 3 * s, 1.2 * s, 'rgba(75,85,74,.10)', 'rgba(60,70,63,.12)', .5);
    }

    // Faint red stains already soaked into the earth.
    const B = rng(551);
    for (let i = 0; i < 26; i++) {
      const x = 900 + B() * 2750;
      const y = 760 + B() * 290;
      const s = .4 + B() * 1.2;
      ctx.globalAlpha = .06 + B() * .07;
      ctx.fillStyle = PAL.blood;
      ctx.beginPath(); ctx.ellipse(x, y, 14 * s, 4.2 * s, (B() - .5) * .3, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRut(x1, y1, x2, y2, a) {
    ctx.globalAlpha = a;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(lerp(x1, x2, .35), y1 + 12, lerp(x1, x2, .7), y2 - 10, x2, y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ---------------------------------- figures ------------------------- */

  function drawFarFootman(cfg) {
    const T = state.sceneTime;
    const x = cfg.x, y = cfg.y, s = cfg.s || 1, dir = cfg.dir || 1;
    const side = cfg.side || 'jin';
    const pal = SIDE[side];
    const role = cfg.role || 'spear';
    const phase = cfg.phase || 0;
    const death = cfg.death || 0;
    const shield = cfg.shield !== false;
    const thrust = cfg.thrust || 0;
    const gait = Math.sin(T * 2.8 + phase);
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = .1;
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.ellipse(0, 1, 9 * s, 1.6 * s, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    if (death > 0) {
      ctx.translate(0, -1.5 * death);
      ctx.rotate(-(cfg.fallDir || 1) * dir * 1.46 * easeOut(death));
    }
    ctx.scale(dir * s, s);
    const bob = Math.abs(gait) * .6;
    // legs
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(-1, -34); ctx.lineTo(-4 + gait * 5, -18); ctx.lineTo(-7 + gait * 8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1, -34); ctx.lineTo(4 - gait * 4, -17); ctx.lineTo(8 - gait * 8, 0); ctx.stroke();
    // torso
    ctx.fillStyle = side === 'jin' ? '#769194' : '#b06b54';
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .9;
    ctx.beginPath();
    ctx.moveTo(-6, -55 + bob); ctx.lineTo(6, -55 + bob);
    ctx.lineTo(4.5, -32); ctx.lineTo(-4.5, -32); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.globalAlpha = .5;
    ctx.beginPath(); ctx.moveTo(-4, -48); ctx.lineTo(4, -48); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3.7, -41); ctx.lineTo(3.7, -41); ctx.stroke();
    ctx.globalAlpha = 1;
    // head / helmet silhouette
    ctx.fillStyle = PAL.skin; ctx.strokeStyle = PAL.ink; ctx.lineWidth = .65;
    ctx.beginPath(); ctx.ellipse(1, -63 + bob, 4.2, 5.4, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = pal.cloth;
    ctx.beginPath();
    if (side === 'jin') {
      ctx.moveTo(-4.5, -64 + bob); ctx.lineTo(-3.5, -72 + bob); ctx.lineTo(2, -75 + bob);
      ctx.lineTo(6, -70 + bob); ctx.lineTo(5, -63 + bob); ctx.closePath();
    } else {
      ctx.arc(1, -67 + bob, 4.8, Math.PI * .9, Math.PI * 2.15); ctx.closePath();
    }
    ctx.fill(); ctx.stroke();
    if (side === 'chi') {
      ctx.strokeStyle = PAL.rustDark; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-1, -71 + bob); ctx.quadraticCurveTo(-9, -80, -16, -76 + bob); ctx.stroke();
    }
    // weapon
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1;
    if (role === 'archer' || role === 'crossbow') {
      ctx.beginPath(); ctx.arc(12, -50 + bob, 11, 1.4, 4.9); ctx.stroke();
    } else if (role === 'dao' || role === 'mace') {
      ctx.beginPath(); ctx.moveTo(8, -47 + bob); ctx.lineTo(22, -58 + bob); ctx.stroke();
      ctx.fillStyle = '#b9c2b8';
      ctx.beginPath(); ctx.moveTo(22, -58 + bob); ctx.lineTo(29, -54 + bob); ctx.lineTo(23, -51 + bob); ctx.closePath(); ctx.fill();
    } else {
      const tilt = role === 'halberd' ? 18 : 10;
      ctx.beginPath(); ctx.moveTo(-8, -32 + bob); ctx.lineTo(44 + thrust * 10, -48 - tilt + bob); ctx.stroke();
      poly([[44 + thrust * 10, -48 - tilt + bob], [50 + thrust * 10, -50 - tilt + bob], [45 + thrust * 10, -45 - tilt + bob]], '#b9c2b8', PAL.ink, .5, .9);
    }
    if (shield) {
      ctx.fillStyle = pal.cloth; ctx.strokeStyle = PAL.ink; ctx.lineWidth = .7;
      if (side === 'jin') {
        ctx.beginPath(); ctx.rect(4, -50 + bob, 7, 17); ctx.fill(); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(8, -43 + bob, 7.2, 0, TAU); ctx.fill(); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawFootman(cfg) {
    const s0 = cfg.s || 1;
    if (s0 < .52 && cfg.role !== 'standard' && cfg.role !== 'drummer' && !cfg.officer) {
      drawFarFootman(cfg);
      return;
    }
    const T = state.sceneTime;
    const x = cfg.x, y = cfg.y, s = cfg.s || 1, dir = cfg.dir || 1;
    const side = cfg.side || 'jin';
    const pal = SIDE[side];
    const role = cfg.role || 'spear';
    const phase = cfg.phase || 0;
    const stance = cfg.stance || 'march';
    const death = cfg.death || 0;
    const shield = cfg.shield !== false;
    const officer = !!cfg.officer;
    const thrust = cfg.thrust || 0;
    const swing = cfg.swing || 0;
    const drawAmt = cfg.drawAmt != null ? cfg.drawAmt : 0;
    const recoil = cfg.recoil || 0;
    const seed = cfg.seed || 1;
    const R = rng(seed);
    const fallDir = cfg.fallDir || (R() > .5 ? 1 : -1);

    ctx.save();
    ctx.translate(x, y);
    // shadow and blood pool stay on the ground
    if (death > .02) {
      ctx.globalAlpha = .10 + .06 * death;
      ctx.fillStyle = PAL.blood;
      ctx.beginPath(); ctx.ellipse(-dir * 30 * s, 1.5, 30 * s, 5 * s, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = .10;
      ctx.fillStyle = PAL.ink;
      ctx.beginPath(); ctx.ellipse(0, 1.5, 13 * s, 2.6 * s, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (death > 0) {
      ctx.translate(0, -2 * death);
      ctx.rotate(-fallDir * dir * 1.48 * easeOut(death));
      ctx.globalAlpha = 1 - Math.max(0, (death - .88) / .12) * .35;
    }
    ctx.scale(dir * s, s);

    const walking = stance === 'march' || stance === 'run';
    const gait = walking ? Math.sin(T * (stance === 'run' ? 4.2 : 2.8) + phase) : Math.sin(T * 1.05 + phase) * .12;
    const bob = walking ? Math.abs(Math.sin(T * (stance === 'run' ? 4.2 : 2.8) + phase)) * .9 : Math.sin(T * 1.1 + phase) * .25;
    const brace = stance === 'brace' || stance === 'fight' || role === 'archer' || role === 'crossbow';
    const lean = (brace ? .15 : .05) + (role === 'spear' && stance === 'thrust' ? .16 * thrust : 0) - recoil * .12;
    const hipY = -34 + bob;
    const hip = { x: 0, y: hipY };
    let fx = 8, bx = -8;
    if (brace) { fx = 10 + recoil * 4; bx = -9; }
    if (walking) { fx = 8 - gait * 8; bx = -8 + gait * 8; }
    if (stance === 'run') { fx = 11 - gait * 12; bx = -10 + gait * 12; }
    const footF = { x: fx, y: 0 };
    const footB = { x: bx, y: 0 };
    if (death > .3) {
      footF.x = 12; footB.x = -13; footF.y = -1; footB.y = -1;
    }
    const kneeF = ik(hip, footF, 19.5, 18.5, 1);
    const kneeB = ik(hip, footB, 19.5, 18.5, 1);

    const shoulderY = -58 + bob - (death > .3 ? 0 : 0);
    const sh = { x: lean * 21, y: shoulderY };
    const shF = { x: sh.x + 5.2, y: sh.y };
    const shB = { x: sh.x - 5.2, y: sh.y };
    const head = { x: sh.x + 1.7 + recoil * 2, y: sh.y - 8.2 };

    // arms & weapon targets
    let frontHand, backHand, weapon = null;
    if (role === 'spear') {
      const naturalTilt = stance === 'march'
        ? .06 + (hash(seed * 7 + 13) % 100) / 100 * .34
        : .03;
      const spearTilt = cfg.spearTilt != null ? cfg.spearTilt : naturalTilt;
      const tip = { x: 45 + thrust * 17, y: -55 - spearTilt * 44 + thrust * 4 + (death > .3 ? 3 : 0) };
      const butt = { x: -16 - thrust * 3, y: -27 + spearTilt * 7 };
      frontHand = pointOn(butt, tip, .60 + thrust * .05);
      backHand = pointOn(butt, tip, .30);
      weapon = { kind: 'spear', butt, tip, banner: officer && cfg.pennant };
    } else if (role === 'halberd') {
      const tip = { x: 33 + thrust * 16, y: -84 + thrust * 15 };
      const butt = { x: -13, y: -22 };
      frontHand = pointOn(butt, tip, .58);
      backHand = pointOn(butt, tip, .33);
      weapon = { kind: 'halberd', butt, tip };
    } else if (role === 'archer') {
      const pull = drawAmt;
      frontHand = { x: 18, y: -51 + bob };
      backHand = { x: 3 - pull * 8, y: -50 + bob };
      weapon = { kind: 'bow', pull, hand: frontHand };
    } else if (role === 'crossbow') {
      frontHand = { x: 17, y: -49 + bob };
      backHand = { x: 7, y: -44 + bob };
      weapon = { kind: 'crossbow', hand: frontHand, pull: drawAmt };
    } else if (role === 'mace') {
      frontHand = { x: 17 + swing * 8, y: -54 + swing * 14 + bob };
      backHand = { x: 2, y: -47 + bob };
      weapon = { kind: 'mace', hand: frontHand, swing };
    } else if (role === 'standard') {
      frontHand = { x: 13, y: -54 + bob };
      backHand = { x: -2, y: -41 + bob };
      weapon = { kind: 'standard', hand: frontHand, seed, torn: cfg.torn, h: cfg.flagH || 118, broken: cfg.broken };
    } else if (role === 'drummer') {
      frontHand = { x: 14, y: -38 + bob };
      backHand = { x: 9, y: -42 + bob };
      weapon = { kind: 'drummer' };
    } else if (role === 'shield' || role === 'dao' || role === 'officer') {
      const reach = role === 'officer' ? 5 : 0;
      frontHand = { x: 18 + reach + swing * 5, y: -49 - swing * 10 + bob };
      backHand = { x: 4, y: -43 + bob };
      weapon = {
        kind: 'dao',
        hand: frontHand,
        angle: -.35 + swing * 1.9 + (role === 'shield' ? -.3 : 0),
        blood: cfg.bloodBlade,
      };
    } else {
      frontHand = { x: 13, y: -45 + bob };
      backHand = { x: -2, y: -42 + bob };
    }

    if (death > .3) {
      frontHand = { x: 16, y: -36 };
      backHand = { x: -7, y: -40 };
    }

    // back arm
    const backElbow = ik(shB, backHand, 11.5, 12.5, -1);
    limb(shB, backElbow, backHand, role === 'archer' ? 2.5 : 2.8, pal.trousers, PAL.ink, .95);
    drawHand(backHand, side);

    // back leg
    drawLeg(hip, kneeB, footB, pal.trousers, .78);
    // trailing cloth / cape
    if (officer || role === 'standard') drawCape(T, sh, pal, phase);
    // torso
    drawTorso(sh, hip, pal, side, lean, officer, T, phase, death);
    // front leg
    drawLeg(hip, kneeF, footF, pal.trousers, 1);
    // skirt/tassets
    drawSkirt(hip, pal, side, gait, T, phase);

    // weapon behind front arm for long shafts
    if (weapon && weapon.kind === 'spear') drawSpear(weapon, pal, side);
    if (weapon && weapon.kind === 'halberd') drawHalberd(weapon, pal, side);
    if (weapon && weapon.kind === 'standard') drawStandardWeapon(weapon, side, pal, T, phase);

    // front arm
    const frontElbow = ik(shF, frontHand, 11.5, 12.5, 1);
    limb(shF, frontElbow, frontHand, role === 'archer' ? 2.7 : 3, pal.clothMid, PAL.ink, 1);
    drawHand(frontHand, side);

    // shield in front arm / beside body
    if (shield && role !== 'archer' && role !== 'crossbow' && role !== 'standard' && role !== 'drummer') {
      drawShield(role === 'shield' ? frontHand : { x: 11 + recoil * 5, y: -42 }, side, role === 'shield', T, phase);
    }

    if (death > .3) {
      // arms limp, no active weapon flourish
      if (weapon && weapon.kind === 'bow') drawBow(weapon, side, .2);
    } else if (weapon && weapon.kind === 'bow') {
      drawBow(weapon, side, weapon.pull);
    } else if (weapon && weapon.kind === 'crossbow') {
      drawCrossbow(weapon, side);
    } else if (weapon && weapon.kind === 'dao') {
      drawDao(weapon, side);
    } else if (weapon && weapon.kind === 'mace') {
      drawMace(weapon, side);
    } else if (weapon && weapon.kind === 'drummer') {
      drawDrummerArms(frontHand, backHand);
    }

    // head and helmet last
    drawHead(head, side, pal, T, phase, officer, death, recoil);

    // arrows stuck in shield/body for corpses or unlucky soldiers
    if (cfg.arrow) {
      ctx.save();
      ctx.translate(8, -47);
      ctx.rotate(-.34);
      ctx.globalAlpha = .6;
      ctx.fillStyle = PAL.blood;
      ctx.beginPath(); ctx.arc(0, 0, 3.1, 0, TAU); ctx.fill();
      ctx.globalAlpha = .9;
      ctx.strokeStyle = PAL.blood;
      ctx.lineWidth = .75;
      ctx.beginPath(); ctx.moveTo(-1, 2); ctx.quadraticCurveTo(-2, 8, -4, 12); ctx.stroke();
      ctx.globalAlpha = .95;
      inkLine(-19, 0, 8, 0, 1.2, .95);
      poly([[9, 0], [3, -2.1], [4, 0], [3, 2.1]], PAL.ink, null, .8, .95);
      ctx.strokeStyle = PAL.ochre; ctx.lineWidth = .55;
      ctx.beginPath(); ctx.moveTo(-19, 0); ctx.lineTo(-23, -2.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-19, 0); ctx.lineTo(-23, 2.5); ctx.stroke();
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawLeg(hip, knee, foot, fill, alpha) {
    limb(hip, knee, foot, 3.1, fill, PAL.ink, alpha);
    // boot
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAL.ink;
    ctx.beginPath();
    ctx.moveTo(foot.x - 1.6, foot.y);
    ctx.lineTo(foot.x - 2.6, foot.y - 2.1);
    ctx.lineTo(foot.x + 3.6, foot.y - 2);
    ctx.lineTo(foot.x + 5.2, foot.y);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawHand(p, side) {
    const pal = SIDE[side];
    ellipse(p.x, p.y, 1.9, 1.7, PAL.skin, PAL.ink, .6, 1);
  }

  function drawTorso(sh, hip, pal, side, lean, officer, T, phase, death) {
    const top = sh.y, bot = hip.y;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(sh.x - 6.2, top + 1);
    ctx.quadraticCurveTo(sh.x - 8.2, top + 7, sh.x - 6.3, top + 13);
    ctx.quadraticCurveTo(sh.x - 5.6, bot - 4, hip.x - 4.7, bot + 1);
    ctx.quadraticCurveTo(hip.x, bot + 3, hip.x + 4.7, bot + 1);
    ctx.quadraticCurveTo(sh.x + 5.6, bot - 4, sh.x + 6.4, top + 12);
    ctx.quadraticCurveTo(sh.x + 8.3, top + 5, sh.x + 6.2, top + 1);
    ctx.quadraticCurveTo(sh.x, top - 2, sh.x - 6.2, top + 1);
    ctx.closePath();
    ctx.fillStyle = side === 'jin' ? '#769194' : '#b06b54';
    ctx.fill();
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1;
    ctx.stroke();

    // shaded side, kept as a flat ink wash
    ctx.globalAlpha = .16;
    ctx.fillStyle = PAL.ink;
    ctx.beginPath();
    ctx.moveTo(sh.x - 6.2, top + 2);
    ctx.quadraticCurveTo(sh.x - 7.5, top + 14, hip.x - 4.7, bot);
    ctx.lineTo(hip.x - .5, bot + 1.5);
    ctx.quadraticCurveTo(sh.x - 2.5, bot - 8, sh.x - 1.2, top + 3);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    // collar and chest plate
    ctx.globalAlpha = .9;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .65;
    ctx.beginPath();
    ctx.moveTo(sh.x - 5.7, top + 6);
    ctx.quadraticCurveTo(sh.x, top + 10, sh.x + 5.7, top + 6);
    ctx.stroke();

    if (side === 'jin') {
      // lacquered rectangular lamellae
      ctx.globalAlpha = .55;
      ctx.strokeStyle = PAL.indigoDark;
      ctx.lineWidth = .55;
      for (let r = 0; r < 4; r++) {
        const yy = top + 10 + r * 4.3;
        ctx.beginPath();
        ctx.moveTo(sh.x - 5.6 + r * .15, yy);
        ctx.lineTo(sh.x + 5.6 - r * .2, yy);
        ctx.stroke();
        for (let c = -2; c <= 2; c++) {
          const xx = sh.x + c * 2.1;
          ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + 4.2); ctx.stroke();
        }
      }
      // shoulder guards
      poly([[sh.x - 8, top + 1], [sh.x - 13, top + 8], [sh.x - 11, top + 14], [sh.x - 5, top + 8]], pal.cloth, PAL.ink, .9, .95);
      poly([[sh.x + 8, top + 1], [sh.x + 13, top + 8], [sh.x + 11, top + 14], [sh.x + 5, top + 8]], pal.cloth, PAL.ink, .9, .95);
    } else {
      // cross-laced leather lamellae
      ctx.globalAlpha = .55;
      ctx.strokeStyle = PAL.rustDark;
      ctx.lineWidth = .55;
      for (let r = 0; r < 4; r++) {
        const yy = top + 9 + r * 4.2;
        ctx.beginPath(); ctx.moveTo(sh.x - 5.4, yy); ctx.lineTo(sh.x + 5.4, yy); ctx.stroke();
      }
      for (let c = -2; c <= 2; c++) {
        ctx.beginPath();
        ctx.moveTo(sh.x + c * 2.2 - 2, top + 9);
        ctx.lineTo(sh.x + c * 2.2 + 2, top + 27);
        ctx.stroke();
      }
      // round shoulder caps
      ellipse(sh.x - 8.2, top + 7.5, 4.4, 3.6, pal.cloth, PAL.ink, .8, .95, -.35);
      ellipse(sh.x + 8.2, top + 7.5, 4.4, 3.6, pal.cloth, PAL.ink, .8, .95, .35);
    }

    // belt
    ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.45;
    ctx.beginPath(); ctx.moveTo(sh.x - 5.2, bot - 4.5); ctx.lineTo(sh.x + 5.2, bot - 4.5); ctx.stroke();
    ctx.fillStyle = PAL.ochre;
    ctx.beginPath(); ctx.arc(sh.x + 1, bot - 4.5, 1.4, 0, TAU); ctx.fill();

    if (officer) {
      // jade/ochre pectoral
      ctx.strokeStyle = PAL.ochre;
      ctx.lineWidth = .9;
      ctx.beginPath(); ctx.arc(sh.x, top + 18, 3.2, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawSkirt(hip, pal, side, gait, T, phase) {
    const sway = gait * 1.1;
    ctx.globalAlpha = .92;
    ctx.fillStyle = side === 'jin' ? pal.cloth : pal.trousers;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .8;
    ctx.beginPath();
    ctx.moveTo(hip.x - 5.2, hip.y - 2);
    ctx.quadraticCurveTo(hip.x - 5.7, hip.y + 8, hip.x - 8.4 - sway, hip.y + 14);
    ctx.quadraticCurveTo(hip.x, hip.y + 17, hip.x + 8.2 + sway, hip.y + 14);
    ctx.quadraticCurveTo(hip.x + 5.7, hip.y + 8, hip.x + 5.2, hip.y - 2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = .38;
    ctx.strokeStyle = PAL.ink;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(hip.x + i * 3.2, hip.y + 1);
      ctx.lineTo(hip.x + i * 3.7 + sway, hip.y + 13);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawCape(t, sh, pal, phase) {
    const w = Math.sin(t * 2.2 + phase) * 2.2;
    ctx.globalAlpha = .65;
    ctx.fillStyle = pal.cloth;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .7;
    ctx.beginPath();
    ctx.moveTo(sh.x - 5, sh.y + 2);
    ctx.quadraticCurveTo(sh.x - 20 + w, sh.y + 9, sh.x - 27 + w * 2, sh.y + 22);
    ctx.quadraticCurveTo(sh.x - 15, sh.y + 30, sh.x - 5, sh.y + 21);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawHead(head, side, pal, T, phase, officer, death, recoil) {
    const hx = head.x, hy = head.y;
    const tilt = death > .3 ? .5 : recoil * .12;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(tilt);
    // neck
    inkLine(-.8, 6.2, -.2, 10.5, 2.4, 1, PAL.skin);
    inkLine(-1.2, 6.2, -.5, 10.5, .7, .8);
    // face
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.skin;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .8;
    ctx.beginPath();
    ctx.ellipse(0, 0, 4.55, 5.9, .04, 0, TAU);
    ctx.fill(); ctx.stroke();
    // profile nose, brow, eye, moustache
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .65;
    ctx.beginPath(); ctx.moveTo(3.6, -1.8); ctx.quadraticCurveTo(5.8, .1, 3.7, 1.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(.8, -2.2); ctx.lineTo(3.1, -1.7); ctx.stroke();
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(2.1, -.9, .45, 0, TAU); ctx.fill();
    ctx.strokeStyle = PAL.ink;
    ctx.beginPath(); ctx.moveTo(1.2, 3.0); ctx.lineTo(3.5, 3.4); ctx.stroke();
    ctx.globalAlpha = .6;
    ctx.beginPath(); ctx.moveTo(-.5, 4.1); ctx.quadraticCurveTo(1.2, 6.4, 3.4, 4.5); ctx.stroke();
    ctx.globalAlpha = 1;
    if (side === 'jin') {
      // thin dark beard and cheek strap
      ctx.globalAlpha = .45;
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = .45;
      ctx.beginPath(); ctx.moveTo(-2.8, 2.3); ctx.quadraticCurveTo(-4, 5.2, -1.6, 5.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3.2, 1.2); ctx.lineTo(2.2, 6.2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if (side === 'jin') {
      // tall lacquered helmet with nape guard
      ctx.fillStyle = pal.cloth;
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = .85;
      ctx.beginPath();
      ctx.moveTo(-6.2, -2.5);
      ctx.quadraticCurveTo(-7.4, -8.4, -2, -10.8);
      ctx.quadraticCurveTo(2.8, -12.5, 5.8, -8);
      ctx.quadraticCurveTo(7.1, -4.8, 5.5, -2.2);
      ctx.quadraticCurveTo(2, -5.2, -6.2, -2.5);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // neck/cheek guard
      ctx.globalAlpha = .92;
      poly([[-6.2, -3.2], [-7.5, 4.2], [-3.8, 5.9], [-1.8, 1.1]], pal.cloth, PAL.ink, .7, .9);
      ctx.globalAlpha = 1;
      // helmet ribs
      ctx.strokeStyle = PAL.indigoDark;
      ctx.lineWidth = .55;
      ctx.beginPath(); ctx.moveTo(-4.4, -8.7); ctx.quadraticCurveTo(0, -10.7, 4.3, -7.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-3.7, -5.4); ctx.lineTo(4.4, -4.8); ctx.stroke();
      // small crest / fin
      if (officer) {
        ctx.strokeStyle = PAL.ochre;
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-1, -11.5); ctx.quadraticCurveTo(-2.5, -20, 1.3, -24.5); ctx.stroke();
        poly([[-1, -15], [1.2, -24], [3, -14]], PAL.jadePale, PAL.ink, .6, .9);
      } else {
        ctx.strokeStyle = PAL.inkSoft;
        ctx.lineWidth = .9;
        ctx.beginPath(); ctx.moveTo(-1.3, -10.5); ctx.lineTo(-2.4, -16); ctx.stroke();
      }
    } else {
      // leather cap with two pheasant feathers
      ctx.fillStyle = pal.cloth;
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = .8;
      ctx.beginPath();
      ctx.moveTo(-5.8, -2.8);
      ctx.quadraticCurveTo(-5.4, -8.7, 0, -9.8);
      ctx.quadraticCurveTo(5.4, -9.1, 5.4, -2.2);
      ctx.quadraticCurveTo(1.5, -4.7, -5.8, -2.8);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // feathers
      const sway = Math.sin(T * 1.7 + phase) * 1.2;
      ctx.strokeStyle = PAL.rustDark;
      ctx.lineWidth = 1.1;
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.moveTo(-.5 + i * 1.6, -8.4);
        ctx.bezierCurveTo(-8 + i * 2 + sway, -15, -14 + i * 3 + sway, -19, -19 + i * 4 + sway, -16);
        ctx.stroke();
      }
      poly([[-1.5, -8.7], [-8, -15], [-13, -17], [-9, -11]], PAL.rustPale, PAL.ink, .45, .72);
      // headband
      ctx.strokeStyle = PAL.ochre;
      ctx.lineWidth = .9;
      ctx.beginPath(); ctx.moveTo(-5.2, -4.2); ctx.quadraticCurveTo(0, -6, 5.1, -3.8); ctx.stroke();
    }
    ctx.restore();
  }

  function drawShield(p, side, big, T, phase) {
    const pal = SIDE[side];
    ctx.save();
    ctx.translate(p.x + 1, p.y - 2);
    if (side === 'jin') {
      ctx.rotate(-.04);
      const w = big ? 13.5 : 11.5, h = big ? 29 : 24;
      ctx.globalAlpha = .96;
      ctx.fillStyle = pal.cloth;
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-w *.55, -h *.5);
      ctx.quadraticCurveTo(0, -h *.58, w *.55, -h *.5);
      ctx.lineTo(w *.6, h *.36);
      ctx.quadraticCurveTo(0, h *.54, -w *.6, h *.36);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = .55;
      ctx.strokeStyle = PAL.indigoDark;
      ctx.lineWidth = .6;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(i * w * .35, -h * .45); ctx.lineTo(i * w * .38, h * .4); ctx.stroke();
      }
      ctx.globalAlpha = .85;
      ctx.strokeStyle = PAL.ochre;
      ctx.lineWidth = .8;
      ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.stroke();
      // little bird device
      ctx.globalAlpha = .6;
      ctx.beginPath();
      ctx.moveTo(-2.5, -1.2); ctx.quadraticCurveTo(0, -4, 3, -1.8);
      ctx.quadraticCurveTo(.8, 1.2, -2.5, -1.2);
      ctx.stroke();
    } else {
      ctx.rotate(.08);
      const r = big ? 14 : 12;
      ctx.globalAlpha = .96;
      ellipse(0, 0, r, r * 1.05, pal.cloth, PAL.ink, 1.1);
      ctx.globalAlpha = .5;
      ctx.strokeStyle = PAL.rustDark;
      ctx.lineWidth = .65;
      ctx.beginPath(); ctx.arc(0, 0, r * .72, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * .72, 0); ctx.lineTo(r * .72, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -r * .72); ctx.lineTo(0, r * .72); ctx.stroke();
      ctx.globalAlpha = .8;
      ctx.strokeStyle = PAL.ochrePale;
      ctx.lineWidth = .7;
      for (let i = 0; i < 4; i++) {
        const a = i * TAU / 4 + .78;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r * .48, Math.sin(a) * r * .48, .9, 0, TAU); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawSpear(w, pal, side) {
    const { butt, tip } = w;
    const a = Math.atan2(tip.y - butt.y, tip.x - butt.x);
    ctx.globalAlpha = .96;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.moveTo(butt.x, butt.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    ctx.globalAlpha = .45;
    ctx.strokeStyle = PAL.ochre;
    ctx.lineWidth = .45;
    ctx.beginPath(); ctx.moveTo(butt.x + 1, butt.y + 1); ctx.lineTo(tip.x - 2, tip.y + 1); ctx.stroke();
    ctx.globalAlpha = 1;
    // leaf blade
    ctx.save();
    ctx.translate(tip.x, tip.y);
    ctx.rotate(a);
    ctx.fillStyle = '#b9c2b8';
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .7;
    ctx.beginPath();
    ctx.moveTo(-1, 0); ctx.quadraticCurveTo(4, -2.2, 11, 0);
    ctx.quadraticCurveTo(4, 2.2, -1, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // tassel
    const tx = tip.x - Math.cos(a) * 8, ty = tip.y - Math.sin(a) * 8;
    ctx.globalAlpha = .9;
    ctx.strokeStyle = pal.flag;
    ctx.lineWidth = 1.4;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx - 3 + i, ty + 4, tx - 5 + i * 1.5, ty + 8);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawHalberd(w, pal) {
    const { butt, tip } = w;
    const a = Math.atan2(tip.y - butt.y, tip.x - butt.x);
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(butt.x, butt.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    ctx.save();
    ctx.translate(tip.x, tip.y);
    ctx.rotate(a);
    // spear point
    poly([[-1, 0], [10, 0], [1, 2.2]], '#b9c2b8', PAL.ink, .65);
    // axe crescent
    ctx.fillStyle = '#b9c2b8';
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .7;
    ctx.beginPath();
    ctx.moveTo(1, -1);
    ctx.quadraticCurveTo(-5, -8, -11, -4);
    ctx.quadraticCurveTo(-7, -1, -10, 5);
    ctx.quadraticCurveTo(-4, 6.2, 1, 1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = .9;
    ctx.strokeStyle = pal.flag;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(tip.x - Math.cos(a) * 8, tip.y - Math.sin(a) * 8);
    ctx.quadraticCurveTo(tip.x - 11, tip.y + 7, tip.x - 4, tip.y + 12); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawDao(w, side) {
    const { hand, angle } = w;
    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.rotate(angle);
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = '#b9c2b8';
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .7;
    ctx.beginPath();
    ctx.moveTo(10, -1.4);
    ctx.quadraticCurveTo(21, -8, 29, -5);
    ctx.quadraticCurveTo(22, -1.6, 13, 1.3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = .7;
    ctx.strokeStyle = side === 'jin' ? PAL.indigoDark : PAL.rustDark;
    ctx.lineWidth = .45;
    ctx.beginPath(); ctx.moveTo(11, -.5); ctx.quadraticCurveTo(20, -5, 27, -4); ctx.stroke();
    if (w.blood) {
      ctx.globalAlpha = .85;
      ctx.fillStyle = PAL.blood;
      ctx.beginPath(); ctx.arc(26, -4.5, 1.1, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawMace(w, side) {
    const { hand, swing } = w;
    const a = -.8 + swing * 2.6;
    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.rotate(a);
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(18, 0); ctx.stroke();
    ctx.fillStyle = '#a9b2a8';
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .7;
    ctx.beginPath(); ctx.arc(22, 0, 5.2, 0, TAU); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 7; i++) {
      const ang = i * TAU / 7;
      ctx.beginPath();
      ctx.moveTo(22 + Math.cos(ang) * 4.8, Math.sin(ang) * 4.8);
      ctx.lineTo(22 + Math.cos(ang) * 8.2, Math.sin(ang) * 8.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBow(w, side, pull) {
    const h = w.hand;
    const p = clamp(pull, 0, 1);
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.25;
    const bowR = 18;
    ctx.beginPath();
    ctx.moveTo(-1, -bowR);
    ctx.quadraticCurveTo(8, 0, -1, bowR);
    ctx.stroke();
    // recurve tips
    ctx.beginPath(); ctx.moveTo(-1, -bowR); ctx.quadraticCurveTo(4, -bowR - 2, 5, -bowR + 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1, bowR); ctx.quadraticCurveTo(4, bowR + 2, 5, bowR - 2); ctx.stroke();
    // string
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .55;
    ctx.beginPath();
    ctx.moveTo(-1, -bowR);
    ctx.lineTo(-3 - p * 7, 0);
    ctx.lineTo(-1, bowR);
    ctx.stroke();
    // arrow
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .7;
    ctx.beginPath(); ctx.moveTo(-4 - p * 7, 0); ctx.lineTo(18, 0); ctx.stroke();
    poly([[18, 0], [14, -1.4], [15, 0], [14, 1.4]], PAL.ink, null, .5, .9);
    ctx.globalAlpha = .7;
    ctx.strokeStyle = SIDE[side].flag;
    ctx.lineWidth = .5;
    ctx.beginPath(); ctx.moveTo(-4 - p * 7, 0); ctx.lineTo(-8 - p * 7, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4 - p * 7, 0); ctx.lineTo(-8 - p * 7, 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawCrossbow(w, side) {
    const h = w.hand;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(14, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -8); ctx.quadraticCurveTo(13, 0, 8, 8); ctx.stroke();
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .5;
    ctx.beginPath(); ctx.moveTo(8, -8); ctx.lineTo(2 - w.pull * 4, 0); ctx.lineTo(8, 8); ctx.stroke();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .65;
    ctx.beginPath(); ctx.moveTo(2 - w.pull * 4, 0); ctx.lineTo(16, 0); ctx.stroke();
    ctx.restore();
  }

  function drawDrummerArms(front, back) {
    // subtle drumsticks are drawn by the drum cart
    inkLine(back.x, back.y, back.x + 3, back.y - 5, 1.1, .8);
    inkLine(front.x, front.y, front.x + 3, front.y - 4, 1.1, .8);
  }

  function drawStandardWeapon(w, side, pal, T, phase) {
    const h = w.hand;
    const H = w.h || 118;
    const sway = Math.sin(T * 1.1 + phase) * 2.2;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(h.x - 2, 1); ctx.lineTo(h.x, -H); ctx.stroke();
    // pole finial
    ctx.fillStyle = PAL.ochre;
    ctx.beginPath(); ctx.moveTo(h.x, -H - 8); ctx.lineTo(h.x - 2.5, -H); ctx.lineTo(h.x + 2.5, -H); ctx.closePath(); ctx.fill();
    const topY = -H + 7;
    const len = w.broken ? 34 : 56;
    const droop = w.broken ? 12 : 0;
    ctx.save();
    ctx.translate(h.x, topY);
    ctx.rotate(w.broken ? .22 : 0);
    ctx.globalAlpha = .86;
    ctx.fillStyle = pal.flag;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .8;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * .45, -4 + sway, len, -2 + droop);
    ctx.lineTo(len * .82, 15 + droop);
    if (w.torn) {
      ctx.lineTo(len * .58, 11);
      ctx.lineTo(len * .48, 18);
      ctx.lineTo(len * .27, 12);
    } else {
      ctx.lineTo(len * .55, 16);
    }
    ctx.quadraticCurveTo(len * .3, 14 + sway, 0, 28);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // emblem
    ctx.globalAlpha = .62;
    ctx.strokeStyle = PAL.paperHigh;
    ctx.lineWidth = 1;
    if (w.glyph) {
      ctx.save();
      ctx.translate(len * .44, 9);
      ctx.font = '700 11px "STKaiti","KaiTi","FangSong",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = PAL.paperHigh;
      ctx.fillText(w.glyph, 0, 0);
      ctx.restore();
    } else if (side === 'jin') {
      ctx.beginPath(); ctx.arc(len * .44, 8, 5.2, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(len * .44 - 4, 8); ctx.quadraticCurveTo(len * .44, 2, len * .44 + 4, 8);
      ctx.quadraticCurveTo(len * .44, 12, len * .44 - 4, 8); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(len * .43, 8, 4.2, 0, TAU); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const a = i * TAU / 4 + .78;
        ctx.beginPath(); ctx.moveTo(len * .43 + Math.cos(a) * 5, 8 + Math.sin(a) * 5);
        ctx.lineTo(len * .43 + Math.cos(a) * 8, 8 + Math.sin(a) * 8); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ---------------------------------- horses & riders ----------------- */

  function drawHorse(cfg) {
    const T = state.sceneTime;
    const x = cfg.x, y = cfg.y, s = cfg.s || 1, dir = cfg.dir || 1;
    const side = cfg.side || 'jin';
    const pal = SIDE[side];
    const phase = cfg.phase || 0;
    const gallop = cfg.gallop == null ? 1 : cfg.gallop;
    const rear = cfg.rear || 0;
    const bob = Math.sin(T * 4.2 + phase) * 1.4 * gallop;
    const g = T * 4.4 + phase;

    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = .1;
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.ellipse(0, 1.5, 37 * s, 4.2 * s, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.scale(dir * s, s);

    // far legs
    drawHorseLeg(-27, -40 + bob, g + Math.PI, true, cfg);
    drawHorseLeg(23, -41 + bob, g + Math.PI * .55, true, cfg);
    // tail
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-38, -55 + bob);
    ctx.bezierCurveTo(-49, -52 + bob, -53 + Math.sin(T * 2 + phase) * 3, -38 + bob, -48, -30 + bob);
    ctx.stroke();
    ctx.globalAlpha = .6;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-40 - i * 2, -54 + bob);
      ctx.quadraticCurveTo(-50 - i * 2, -48 + bob, -47 - i * 3, -34 + bob);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // hind leg near
    drawHorseLeg(-30, -40 + bob, g + Math.PI * .12, false, cfg);
    // front near leg
    drawHorseLeg(26, -41 + bob, g + Math.PI * 1.45, false, cfg);

    // barrel
    ctx.fillStyle = cfg.horseColor || (side === 'jin' ? '#9d8061' : '#a67c5f');
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-40, -51 + bob);
    ctx.quadraticCurveTo(-44, -67 + bob, -25, -70 + bob);
    ctx.quadraticCurveTo(0, -75 + bob, 24, -69 + bob);
    ctx.quadraticCurveTo(40, -65 + bob, 39, -52 + bob);
    ctx.quadraticCurveTo(34, -39 + bob, 8, -40 + bob);
    ctx.quadraticCurveTo(-22, -39 + bob, -40, -51 + bob);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // chest shading
    ctx.globalAlpha = .18;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .65;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-26 + i * 4, -65 + bob); ctx.quadraticCurveTo(-32 + i * 3, -52 + bob, -29 + i * 3, -44 + bob); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // neck
    ctx.fillStyle = cfg.horseColor || (side === 'jin' ? '#9d8061' : '#a67c5f');
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(20, -66 + bob);
    ctx.quadraticCurveTo(32, -77 + bob, 39, -96 + bob);
    ctx.quadraticCurveTo(44, -104 + bob, 51, -101 + bob);
    ctx.quadraticCurveTo(57, -98 + bob, 57, -89 + bob);
    ctx.quadraticCurveTo(51, -84 + bob, 46, -81 + bob);
    ctx.quadraticCurveTo(42, -68 + bob, 35, -57 + bob);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // head
    ctx.beginPath();
    ctx.moveTo(49, -102 + bob);
    ctx.quadraticCurveTo(58, -106 + bob, 65, -99 + bob);
    ctx.quadraticCurveTo(70, -94 + bob, 66, -88 + bob);
    ctx.quadraticCurveTo(61, -84 + bob, 55, -86 + bob);
    ctx.quadraticCurveTo(50, -90 + bob, 47, -94 + bob);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // ears
    poly([[48, -103 + bob], [46, -111 + bob], [51, -106 + bob]], cfg.horseColor || '#9d8061', PAL.ink, .7);
    poly([[54, -104 + bob], [56, -112 + bob], [58, -104 + bob]], cfg.horseColor || '#9d8061', PAL.ink, .7);
    // eye & nostril
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(57, -97 + bob, .9, 0, TAU); ctx.fill();
    ctx.globalAlpha = .6;
    ctx.beginPath(); ctx.arc(65, -90 + bob, .7, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    // mane
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .8;
    for (let i = 0; i < 9; i++) {
      const mx = 24 + i * 2.4, my = -72 - i * 3.1 + bob;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.quadraticCurveTo(mx - 5, my - 1, mx - 2, my - 5); ctx.stroke();
    }

    // horse armour / trappings
    if (cfg.barded !== false) {
      ctx.globalAlpha = .92;
      ctx.fillStyle = side === 'jin' ? PAL.indigo : PAL.rust;
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = .75;
      // caparison over hindquarters
      ctx.beginPath();
      ctx.moveTo(-37, -62 + bob);
      ctx.quadraticCurveTo(-20, -72 + bob, -5, -68 + bob);
      ctx.lineTo(-2, -49 + bob);
      ctx.quadraticCurveTo(-18, -43 + bob, -36, -50 + bob);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // saddle blanket
      ctx.beginPath();
      ctx.moveTo(2, -70 + bob);
      ctx.quadraticCurveTo(15, -73 + bob, 27, -68 + bob);
      ctx.lineTo(25, -51 + bob);
      ctx.quadraticCurveTo(14, -46 + bob, 1, -53 + bob);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // neck guard
      ctx.globalAlpha = .8;
      ctx.beginPath();
      ctx.moveTo(29, -67 + bob);
      ctx.quadraticCurveTo(38, -77 + bob, 43, -90 + bob);
      ctx.lineTo(49, -87 + bob);
      ctx.quadraticCurveTo(40, -67 + bob, 33, -57 + bob);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // tassels
      ctx.strokeStyle = PAL.ochre;
      ctx.lineWidth = .65;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-22 + i * 7, -45 + bob);
        ctx.quadraticCurveTo(-24 + i * 7, -39 + bob, -26 + i * 7, -35 + bob);
        ctx.stroke();
      }
    }

    // bridle / reins
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .55;
    ctx.beginPath();
    ctx.moveTo(53, -98 + bob); ctx.lineTo(60, -96 + bob); ctx.lineTo(63, -89 + bob);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(53, -99 + bob);
    ctx.quadraticCurveTo(25, -82 + bob, 4, -72 + bob);
    ctx.stroke();

    // near legs
    drawHorseLeg(28, -42 + bob, g, false, cfg);
    drawHorseLeg(-24, -42 + bob, g + Math.PI * .62, false, cfg);

    if (cfg.rider) {
      drawRider(cfg.rider, side, T, phase, cfg);
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawHorseLeg(sx, sy, phase, far, cfg) {
    const lift = Math.max(0, Math.sin(phase)) * 11;
    const foot = {
      x: sx + Math.sin(phase) * 17,
      y: -lift,
    };
    const knee = ik({ x: sx, y: sy }, foot, 22, 20, far ? -1 : 1);
    ctx.globalAlpha = far ? .52 : 1;
    const fill = cfg.legColor || '#9a7b5d';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 5.2;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(knee.x, knee.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();
    ctx.strokeStyle = fill; ctx.lineWidth = 3.8;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(knee.x, knee.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();
    // hoof
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(foot.x - 1.6, foot.y); ctx.lineTo(foot.x + 2.6, foot.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawRider(r, side, T, phase, horseCfg) {
    const pal = SIDE[side];
    const dir = 1;
    const R = rng(r.seed || 31);
    const bob = Math.sin(T * 4.2 + phase) * 1.2;
    const hip = { x: 0, y: -73 + bob };
    const sh = { x: 1 + (r.lean || 0), y: -96 + bob };
    const head = { x: sh.x + 1.2, y: sh.y - 8 };
    const role = r.role || 'lance';
    const swing = r.swing || 0;

    // far leg
    const footB = { x: 8, y: -53 + bob };
    const kneeB = ik(hip, footB, 15, 16, 1);
    limb(hip, kneeB, footB, 3, pal.trousers, PAL.ink, .7);
    // cape
    if (r.cape) drawCape(T, sh, pal, phase);

    // torso
    drawTorso(sh, hip, pal, side, .04, false, T, phase, 0);
    // near leg
    const footF = { x: 17, y: -49 + bob };
    const kneeF = ik(hip, footF, 15, 16, 1);
    limb(hip, kneeF, footF, 3.3, pal.trousers, PAL.ink, 1);
    // stirrup
    inkLine(footF.x, footF.y, footF.x + 1, footF.y + 5, .7, .8);

    let hand, backHand, weapon = null;
    if (role === 'lance') {
      hand = { x: 26, y: -91 + bob };
      backHand = { x: 5, y: -82 + bob };
      weapon = { kind: 'lance', hand, swing };
    } else if (role === 'dao') {
      hand = { x: 23 + swing * 6, y: -95 - swing * 9 + bob };
      backHand = { x: 6, y: -84 + bob };
      weapon = { kind: 'daoR', hand, angle: -.5 + swing * 2.1, swing };
    } else if (role === 'mace') {
      hand = { x: 20 + swing * 4, y: -102 - swing * 8 + bob };
      backHand = { x: 3, y: -84 + bob };
      weapon = { kind: 'maceR', hand, swing };
    } else if (role === 'bow') {
      hand = { x: 25, y: -94 + bob };
      backHand = { x: 6, y: -92 + bob };
      weapon = { kind: 'bowR', hand, pull: r.pull || .4 };
    }
    // back arm
    const be = ik({ x: sh.x - 4, y: sh.y + 1 }, backHand, 10, 12, -1);
    limb({ x: sh.x - 4, y: sh.y + 1 }, be, backHand, 2.7, pal.clothMid, PAL.ink, .95);
    // shield on far arm
    if (r.shield) {
      ctx.save(); ctx.globalAlpha = .9;
      drawShield({ x: -9, y: -83 + bob }, side, false, T, phase);
      ctx.restore();
    }
    // front arm
    const fe = ik({ x: sh.x + 4, y: sh.y + 1 }, hand, 10, 12, 1);
    limb({ x: sh.x + 4, y: sh.y + 1 }, fe, hand, 2.9, pal.clothMid, PAL.ink, 1);
    drawHand(hand, side);
    drawHead(head, side, pal, T, phase, r.officer, 0, 0);

    if (weapon) {
      if (weapon.kind === 'lance') drawLance(weapon, side, pal);
      if (weapon.kind === 'daoR') drawDao(weapon, side);
      if (weapon.kind === 'maceR') drawMace({ hand, swing }, side);
      if (weapon.kind === 'bowR') {
        // rotate bow vertical for a mounted archer
        ctx.save(); ctx.translate(hand.x, hand.y); ctx.rotate(-.2);
        drawBow({ hand: { x: 0, y: 0 }, pull: weapon.pull }, side, weapon.pull);
        ctx.restore();
      }
    }
  }

  function drawLance(w, side, pal) {
    const h = w.hand;
    const a = -.12;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(a);
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-38, 3); ctx.lineTo(62, 0); ctx.stroke();
    // lance pennant
    ctx.globalAlpha = .82;
    ctx.fillStyle = pal.flag;
    ctx.beginPath();
    ctx.moveTo(37, -1);
    ctx.quadraticCurveTo(45, -8, 54, -4);
    ctx.lineTo(46, 2);
    ctx.quadraticCurveTo(42, 7, 36, 6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .55; ctx.stroke();
    // point
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#b9c2b8';
    ctx.strokeStyle = PAL.ink;
    ctx.beginPath(); ctx.moveTo(61, 0); ctx.lineTo(72, 1.5); ctx.lineTo(61, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  /* ---------------------------------- chariot ------------------------- */

  function drawChariot(cfg) {
    const T = state.sceneTime;
    const x = cfg.x, y = cfg.y, s = cfg.s || 1, dir = cfg.dir || 1;
    const side = cfg.side || 'jin';
    const pal = SIDE[side];
    const phase = cfg.phase || 0;
    const moving = cfg.moving !== false;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir * s, s);

    // dust
    drawDustPuff(-70, -12, 1.3, phase, .28);
    drawDustPuff(-118, -8, 1.9, phase + 2, .22);

    // far horse of the pair, set higher and further ahead so both heads read
    drawHorse({
      x: 128, y: -19, s: .8, dir: 1, side,
      phase: phase + .62, gallop: moving ? 1 : .15,
      rider: null, barded: cfg.barded, horseColor: side === 'jin' ? '#80684f' : '#916b52',
    });
    // near horse
    drawHorse({
      x: 80, y: 0, s: 1.02, dir: 1, side,
      phase, gallop: moving ? 1 : .15,
      rider: null, barded: cfg.barded, horseColor: side === 'jin' ? '#a28563' : '#aa7f60',
    });

    // shafts / traces
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-8, -32); ctx.quadraticCurveTo(64, -47, 124, -50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8, -28); ctx.quadraticCurveTo(66, -22, 126, -36); ctx.stroke();
    ctx.strokeStyle = PAL.inkSoft; ctx.lineWidth = .7;
    ctx.beginPath(); ctx.moveTo(8, -41); ctx.quadraticCurveTo(55, -45, 94, -66); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, -38); ctx.quadraticCurveTo(50, -60, 86, -92); ctx.stroke();

    // far wheel
    drawWheel(-18, -26, 25, T, phase, .48, side);
    // shallow car box with an open rail
    ctx.globalAlpha = .96;
    ctx.fillStyle = pal.cloth;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-38, -46);
    ctx.quadraticCurveTo(-8, -50, 21, -46);
    ctx.lineTo(22, -29);
    ctx.quadraticCurveTo(-8, -26, -37, -29);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // decorative side panel
    ctx.globalAlpha = .55;
    ctx.strokeStyle = PAL.ochre;
    ctx.lineWidth = .8;
    ctx.beginPath(); ctx.arc(-8, -38, 5, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16, -38); ctx.lineTo(0, -38); ctx.stroke();
    ctx.globalAlpha = .35;
    ctx.strokeStyle = PAL.indigoDark;
    ctx.lineWidth = .55;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-32 + i * 17, -45); ctx.lineTo(-30 + i * 16, -30); ctx.stroke();
    }
    ctx.globalAlpha = .9;
    ctx.strokeStyle = PAL.ochre;
    ctx.lineWidth = .9;
    ctx.beginPath(); ctx.moveTo(-37, -31); ctx.lineTo(22, -31); ctx.stroke();
    // rail and posts
    ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-39, -57); ctx.quadraticCurveTo(-8, -62, 23, -57); ctx.stroke();
    ctx.lineWidth = .9;
    for (let i = 0; i < 5; i++) {
      const px = -34 + i * 14;
      ctx.beginPath(); ctx.moveTo(px, -57); ctx.lineTo(px + 1, -46); ctx.stroke();
    }
    // near wheel
    drawWheel(13, -28, 28, T, phase + .6, 1, side);
    // axle caps
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(-18, -26, 2.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -28, 2.2, 0, TAU); ctx.fill();

    // driver and warrior standing in the car
    drawChariotFigure({ x: -17, y: -47, side, role: 'driver', T, phase, seed: (cfg.seed || 1) + 3 });
    drawChariotFigure({ x: 5, y: -47, side, role: cfg.warrior || 'halberd', T, phase, seed: (cfg.seed || 1) + 8, swing: cfg.swing || 0 });

    // a narrow commander's parasol, kept high so the crew stays visible
    if (cfg.canopy) {
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(-15, -52); ctx.lineTo(-27, -116); ctx.stroke();
      ctx.fillStyle = side === 'jin' ? PAL.indigo : PAL.rust;
      ctx.globalAlpha = .82;
      ctx.beginPath();
      ctx.moveTo(-47, -108);
      ctx.quadraticCurveTo(-26, -124, -7, -108);
      ctx.quadraticCurveTo(-27, -112, -47, -108);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = .8; ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = PAL.ochre; ctx.lineWidth = .55;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(-42 + i * 13, -109); ctx.lineTo(-44 + i * 13, -103); ctx.stroke();
      }
    }

    // banner at the back of the car
    drawStandardWeapon({ hand: { x: -38, y: -48 }, flagH: 102, seed: (cfg.seed || 1) + 2, torn: cfg.torn, glyph: cfg.glyph }, side, pal, T, phase);

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawWheel(x, y, r, T, phase, alpha, side) {
    const ang = state.sceneTime * 3.1 + phase;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = alpha > .7 ? '#3f4a44' : '#66736b';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, r - 2.4, 0, TAU); ctx.stroke();
    for (let i = 0; i < 12; i++) {
      const a = ang + i * TAU / 12;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * (r - 2), Math.sin(a) * (r - 2)); ctx.stroke();
    }
    ctx.fillStyle = PAL.ochre;
    ctx.beginPath(); ctx.arc(0, 0, 2.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = .5; ctx.stroke();
    ctx.restore();
  }

  function drawChariotFigure(cfg) {
    const T = cfg.T, phase = cfg.phase, side = cfg.side;
    const pal = SIDE[side];
    ctx.save();
    ctx.translate(cfg.x, cfg.y);
    const hip = { x: 0, y: -30 };
    const sh = { x: 0, y: -52 };
    const head = { x: 1, y: -60 };
    // legs braced in the car
    const f1 = { x: 8, y: 0 }, f2 = { x: -8, y: 0 };
    limb(hip, ik(hip, f2, 15, 15, 1), f2, 2.8, pal.trousers, PAL.ink, .8);
    drawTorso(sh, hip, pal, side, .03, false, T, phase, 0);
    limb(hip, ik(hip, f1, 15, 15, 1), f1, 3, pal.trousers, PAL.ink, 1);
    let hand, backHand, weapon = null;
    if (cfg.role === 'driver') {
      hand = { x: 13, y: -46 };
      backHand = { x: -8, y: -44 };
      weapon = null;
    } else if (cfg.role === 'halberd') {
      hand = { x: 16, y: -49 };
      backHand = { x: 1, y: -43 };
      weapon = { kind: 'halberd', butt: { x: -8, y: -16 }, tip: { x: 42, y: -78 } };
    } else {
      hand = { x: 15, y: -47 };
      backHand = { x: 2, y: -41 };
      weapon = { kind: 'dao', hand, angle: -.4 + (cfg.swing || 0) * 1.6 };
    }
    const be = ik({ x: -4, y: -51 }, backHand, 9, 11, -1);
    limb({ x: -4, y: -51 }, be, backHand, 2.4, pal.trousers, PAL.ink, .85);
    const fe = ik({ x: 4, y: -51 }, hand, 9, 11, 1);
    limb({ x: 4, y: -51 }, fe, hand, 2.6, pal.clothMid, PAL.ink, 1);
    drawHead(head, side, pal, T, phase, false, 0, 0);
    if (weapon && weapon.kind === 'halberd') drawHalberd(weapon, pal);
    if (weapon && weapon.kind === 'dao') drawDao(weapon, side);
    if (cfg.role === 'driver') {
      // reins
      ctx.strokeStyle = PAL.inkSoft; ctx.lineWidth = .55;
      ctx.beginPath(); ctx.moveTo(13, -46); ctx.quadraticCurveTo(50, -45, 84, -58); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------------------------- standards, tents, props --------- */

  function drawStandingStandard(cfg) {
    const T = state.sceneTime;
    const x = cfg.x, y = cfg.y, s = cfg.s || 1, dir = cfg.dir || 1;
    const side = cfg.side || 'jin';
    const pal = SIDE[side];
    const phase = cfg.phase || 0;
    const H = cfg.h || 150;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir * s, s);
    // shadow
    ctx.globalAlpha = .1; ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.ellipse(0, 1, 10, 2.4, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    // pole
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -H); ctx.stroke();
    // finial
    ctx.fillStyle = PAL.ochre;
    ctx.beginPath(); ctx.moveTo(0, -H - 11); ctx.lineTo(-3, -H); ctx.lineTo(3, -H); ctx.closePath(); ctx.fill();
    // socket
    ctx.fillStyle = PAL.ink;
    ctx.fillRect(-1.4, -H + 4, 2.8, 4);
    // cloth
    const sway = Math.sin(T * .9 + phase) * 4;
    const len = cfg.len || 92;
    const top = -H + 12;
    ctx.save();
    ctx.translate(0, top);
    if (cfg.fallen) { ctx.rotate(1.32); ctx.translate(0, 8); }

    // long secondary ribbon, behind the main banner
    ctx.globalAlpha = .34;
    ctx.fillStyle = cfg.faded ? pal.clothPale : pal.clothMid;
    ctx.strokeStyle = PAL.inkSoft;
    ctx.lineWidth = .55;
    ctx.beginPath();
    ctx.moveTo(2, 16);
    ctx.bezierCurveTo(len * .35, 13 + sway * .7, len * .78, 17 + sway, len * 1.06, 10 + sway);
    ctx.lineTo(len * 1.02, 19 + sway);
    ctx.bezierCurveTo(len * .7, 24 + sway * .8, len * .36, 20 + sway * .3, 2, 25);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // main swallow-tail cloth
    ctx.globalAlpha = cfg.faded ? .62 : .9;
    ctx.fillStyle = cfg.faded ? pal.clothMid : pal.flag;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * .22, -4 + sway * .25, len * .62, -6 + sway * .7, len, -7 + sway);
    ctx.lineTo(len * .92, 17 + sway * .5);
    ctx.lineTo(len * .78, 11 + sway * .3);
    ctx.lineTo(len * .68, 28 + sway * .2);
    ctx.lineTo(len * .52, 17);
    ctx.lineTo(len * .4, 34);
    ctx.lineTo(len * .26, 20 + sway * .1);
    ctx.quadraticCurveTo(len * .12, 30, 0, 34);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // top sleeve and inner border
    ctx.globalAlpha = .72;
    ctx.fillStyle = pal.dark;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * .24, -4 + sway * .25, len * .64, -6 + sway * .7, len, -7 + sway);
    ctx.lineTo(len * .97, -1 + sway);
    ctx.bezierCurveTo(len * .62, 0 + sway * .7, len * .24, 2 + sway * .25, 0, 6);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .55;
    ctx.strokeStyle = pal.accent;
    ctx.lineWidth = .7;
    ctx.beginPath();
    ctx.moveTo(len * .06, 6);
    ctx.bezierCurveTo(len * .32, 4 + sway * .35, len * .68, 2 + sway * .8, len * .95, 1 + sway);
    ctx.stroke();

    // folds
    ctx.globalAlpha = .3;
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = .55;
    for (let i = 1; i <= 3; i++) {
      const p = i / 4;
      ctx.beginPath();
      ctx.moveTo(len * p, 2);
      ctx.quadraticCurveTo(len * p + sway * .4, 14, len * (p - .03), 24 + (i % 2) * 3);
      ctx.stroke();
    }

    // emblem
    ctx.globalAlpha = .72;
    ctx.strokeStyle = PAL.paperHigh;
    ctx.fillStyle = PAL.paperHigh;
    ctx.lineWidth = 1;
    if (cfg.glyph) {
      ctx.save();
      ctx.translate(len * .44, 9);
      ctx.font = '700 14px "STKaiti","KaiTi","FangSong",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = PAL.paperHigh;
      ctx.fillText(cfg.glyph, 0, 0);
      ctx.globalAlpha = .55;
      ctx.strokeRect(-7, -8, 14, 16);
      ctx.restore();
    } else if (side === 'jin') {
      // a ringed bird, the device of the dark-armoured host
      ctx.beginPath(); ctx.arc(len * .45, 11, 6.5, 0, TAU); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(len * .45 - 5, 11);
      ctx.quadraticCurveTo(len * .45 - 1, 4, len * .45 + 5, 9);
      ctx.quadraticCurveTo(len * .45 + 1, 13, len * .45 - 5, 11);
      ctx.fill();
    } else {
      // a sun with four rays, the device of the red host
      ctx.beginPath(); ctx.arc(len * .44, 11, 5, 0, TAU); ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const a = i * TAU / 8 + .4;
        ctx.beginPath();
        ctx.moveTo(len * .44 + Math.cos(a) * 7, 11 + Math.sin(a) * 7);
        ctx.lineTo(len * .44 + Math.cos(a) * 11, 11 + Math.sin(a) * 11);
        ctx.stroke();
      }
    }

    // hanging tassels at the lower edge
    ctx.globalAlpha = .65;
    ctx.strokeStyle = PAL.ochre;
    ctx.lineWidth = .55;
    for (let i = 0; i < 5; i++) {
      const tx = len * (.12 + i * .17);
      ctx.beginPath();
      ctx.moveTo(tx, 30);
      ctx.quadraticCurveTo(tx - 2, 36, tx - 4, 41 + (i % 2) * 3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();
  }

  function drawRampart(cfg) {

    ctx.beginPath(); ctx.moveTo(gx + 24, -h - 26); ctx.lineTo(gx + 24, -h - 43); ctx.stroke();
    ctx.fillStyle = pal.cloth;
    ctx.beginPath(); ctx.ellipse(gx - 17, -h - 39, 3.4, 2.2, 0, 0, TAU); ctx.fill();
