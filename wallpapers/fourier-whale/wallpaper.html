<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040b">
<title>跃海之鲸 · Breaching Whale</title>
<style>
  :root {
    --bg: #02040b;
    --ink: #eaf5ff;
    --ink-soft: rgba(208, 228, 255, 0.62);
    --ink-faint: rgba(162, 190, 235, 0.34);
    --blue: #4d6bfe;
    --cyan: #9fdcff;
    --line: rgba(134, 170, 240, 0.16);
    --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: "Segoe UI", "Helvetica Neue", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    --serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    position: relative;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    user-select: none;
    cursor: default;
  }

  /* ------------------------------------------------------------------ */
  /* abyss                                                               */
  /* ------------------------------------------------------------------ */

  .atmosphere {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 48% 24% at 61% 69%, rgba(47, 108, 180, 0.19) 0%, rgba(18, 52, 102, 0.08) 44%, rgba(2, 4, 11, 0) 74%),
      radial-gradient(ellipse 56% 46% at 50% 42%, rgba(34, 63, 164, 0.16) 0%, rgba(14, 28, 80, 0.08) 40%, rgba(2, 4, 11, 0) 70%),
      radial-gradient(ellipse 68% 30% at 50% 102%, rgba(7, 39, 77, 0.54) 0%, rgba(3, 13, 30, 0.20) 48%, rgba(2, 4, 11, 0) 78%),
      linear-gradient(180deg, #010309 0%, #030712 38%, #061020 62%, #08182c 72%, #02050d 100%);
  }

  .aura {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
    mix-blend-mode: screen;
  }

  .aura-a {
    left: 4%;
    top: -34%;
    width: 92vmax;
    height: 92vmax;
    opacity: 0.72;
    background: radial-gradient(circle, rgba(45, 77, 214, 0.15) 0%, rgba(24, 43, 124, 0.055) 38%, rgba(2, 4, 11, 0) 68%);
    animation: drift-a 38s cubic-bezier(.45, 0, .55, 1) infinite alternate;
  }

  .aura-b {
    right: -30%;
    bottom: -50%;
    width: 84vmax;
    height: 84vmax;
    opacity: 0.64;
    background: radial-gradient(circle, rgba(24, 92, 150, 0.12) 0%, rgba(13, 46, 87, 0.045) 42%, rgba(2, 4, 11, 0) 70%);
    animation: drift-b 52s cubic-bezier(.45, 0, .55, 1) infinite alternate;
  }

  .aura-c {
    left: 28%;
    top: 12%;
    width: 54vmax;
    height: 54vmax;
    opacity: 0.48;
    background: radial-gradient(circle, rgba(103, 113, 255, 0.075) 0%, rgba(42, 50, 150, 0.025) 46%, rgba(2, 4, 11, 0) 72%);
    animation: drift-c 44s cubic-bezier(.45, 0, .55, 1) infinite alternate;
  }

  @keyframes drift-a {
    from { transform: translate3d(-2.8%, -2.0%, 0) scale(0.94); }
    to   { transform: translate3d(3.2%, 2.6%, 0) scale(1.08); }
  }
  @keyframes drift-b {
    from { transform: translate3d(2.2%, 2.4%, 0) scale(1.04); }
    to   { transform: translate3d(-3.4%, -2.0%, 0) scale(0.93); }
  }
  @keyframes drift-c {
    from { transform: translate3d(1.6%, -2.2%, 0) scale(0.97); }
    to   { transform: translate3d(-2.6%, 3.0%, 0) scale(1.07); }
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      radial-gradient(ellipse 74% 68% at 50% 47%, rgba(1, 3, 9, 0) 33%, rgba(1, 3, 9, 0.16) 67%, rgba(1, 3, 9, 0.62) 100%),
      linear-gradient(180deg, rgba(1, 3, 9, 0.34) 0%, rgba(1, 3, 9, 0) 17%, rgba(1, 3, 9, 0) 72%, rgba(1, 3, 9, 0.54) 100%);
  }

  .grain {
    position: fixed;
    inset: -38%;
    z-index: 4;
    pointer-events: none;
    opacity: 0.048;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.72'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    animation: grain-shift 1.6s steps(2) infinite;
  }

  @keyframes grain-shift {
    0%   { transform: translate3d(0, 0, 0); }
    25%  { transform: translate3d(-1.1%, 0.7%, 0); }
    50%  { transform: translate3d(0.8%, -1.0%, 0); }
    75%  { transform: translate3d(-0.4%, -0.6%, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  /* ------------------------------------------------------------------ */
  /* canvas                                                              */
  /* ------------------------------------------------------------------ */

  #scene {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 2.6s cubic-bezier(.22, 1, .36, 1);
    pointer-events: none;
  }

  body.ready #scene { opacity: 1; }
  body.still #scene { opacity: 1; transition: none; }

  /* ------------------------------------------------------------------ */
  /* typographic instruments                                             */
  /* ------------------------------------------------------------------ */

  .hud {
    position: fixed;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transform: translateY(7px);
    transition: opacity 1.7s ease 0.25s, transform 1.7s cubic-bezier(.22, 1, .36, 1) 0.25s;
  }

  body.ready .hud { opacity: 1; transform: none; }
  body.still .hud { opacity: 1; transform: none; transition: none; }
  body.clean .hud { display: none; }

  .mark {
    top: clamp(22px, 4.6vh, 58px);
    left: clamp(22px, 4.4vw, 74px);
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.26em;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .mark-right {
    left: auto;
    right: clamp(22px, 4.4vw, 74px);
    gap: 10px;
  }

  .mark-index {
    color: rgba(190, 217, 255, 0.62);
    letter-spacing: 0.14em;
  }

  .mark-rule {
    width: clamp(24px, 3.2vw, 52px);
    height: 1px;
    background: linear-gradient(90deg, rgba(142, 177, 244, 0.36), rgba(142, 177, 244, 0.06));
  }

  .mark-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(143, 194, 255, 0.8);
    box-shadow: 0 0 9px rgba(89, 142, 255, 0.8);
  }

  .caption {
    left: clamp(22px, 4.4vw, 74px);
    bottom: clamp(26px, 5.4vh, 66px);
    display: flex;
    align-items: flex-start;
    gap: clamp(12px, 1.4vw, 22px);
  }

  .caption-rail {
    width: 1px;
    height: clamp(50px, 7.4vh, 88px);
    margin-top: 3px;
    background: linear-gradient(180deg, rgba(135, 178, 255, 0.62), rgba(135, 178, 255, 0.04));
  }

  .eyebrow {
    margin: 0 0 11px;
    font-family: var(--mono);
    font-size: clamp(7px, 0.55vw, 9.5px);
    line-height: 1;
    letter-spacing: 0.32em;
    color: rgba(159, 192, 245, 0.48);
  }

  .caption h1 {
    margin: 0 0 10px;
    font-family: var(--serif);
    font-size: clamp(25px, 2.35vw, 42px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.17em;
    color: rgba(235, 246, 255, 0.9);
    text-shadow: 0 0 32px rgba(88, 139, 255, 0.22);
  }

  .caption .sub {
    margin: 0;
    font-family: var(--mono);
    font-size: clamp(7px, 0.55vw, 9.5px);
    line-height: 1.8;
    letter-spacing: 0.19em;
    color: rgba(165, 193, 240, 0.4);
  }

  .caption .sub em {
    font-style: normal;
    color: rgba(204, 226, 255, 0.62);
  }

  .spectrum {
    right: clamp(22px, 4.4vw, 74px);
    bottom: clamp(28px, 5.8vh, 70px);
    display: flex;
    align-items: flex-end;
    gap: clamp(12px, 1.3vw, 20px);
  }

  .spectrum-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: clamp(26px, 4.3vh, 46px);
    opacity: 0.78;
  }

  .spectrum-bars i {
    display: block;
    width: 1.5px;
    min-height: 3px;
    border-radius: 1px;
    background: linear-gradient(180deg, rgba(196, 232, 255, 0.86), rgba(77, 107, 254, 0.12));
    transform-origin: 50% 100%;
    animation: bar-breathe 6.5s ease-in-out infinite alternate;
    animation-delay: calc(var(--i) * -0.37s);
  }

  @keyframes bar-breathe {
    from { transform: scaleY(0.72); opacity: 0.42; }
    to   { transform: scaleY(1); opacity: 0.94; }
  }

  .spectrum-meta {
    font-family: var(--mono);
    font-size: 8px;
    line-height: 1.8;
    letter-spacing: 0.2em;
    text-align: right;
    color: rgba(158, 190, 240, 0.34);
  }

  .spectrum-meta b {
    display: block;
    font-weight: 400;
    color: rgba(201, 225, 255, 0.64);
    letter-spacing: 0.15em;
  }

  @media (max-width: 760px), (max-aspect-ratio: 1/1) {
    .mark { top: 20px; left: 20px; }
    .mark-right { display: none; }
    .caption { left: 20px; bottom: 24px; gap: 11px; }
    .caption h1 { font-size: 25px; }
    .eyebrow { margin-bottom: 8px; }
    .sub { display: none; }
    .spectrum { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .aura, .grain, .spectrum-bars i { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="巨鲸跃出海面，傅里叶行星轮牵引蓝色边缘光沿鲸身游走，直到下一次描绘才熄灭。"></canvas>
<div class="atmosphere" aria-hidden="true"></div>
<div class="aura aura-a" aria-hidden="true"></div>
<div class="aura aura-b" aria-hidden="true"></div>
<div class="aura aura-c" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="hud mark" aria-hidden="true">
  <span class="mark-index">012</span>

  <span>ORBITAL FOURIER</span>
</div>

<div class="hud mark mark-right" aria-hidden="true">
  <span class="mark-dot"></span>
  <span>BREACHING WHALE</span>
  <span class="mark-rule"></span>
  <span>DFT / 720</span>
</div>

<div class="hud caption" aria-hidden="true">
  <span class="caption-rail"></span>
  <div>

  </div>
</div>

<div class="hud spectrum" aria-hidden="true">
  <span class="spectrum-bars" id="spectrumBars"></span>

</div>

    for (let k = 0; k < n; k++) {

      let im = 0;
      for (let i = 0; i < n; i++) {

  function makeWhalePath() {
    const path = new Path2D();
    for (const contour of [OUTER, ...INNER]) {

    canvasEl.height = Math.ceil(BODY_EXT_H * ps);

    ctx.globalCompositeOperation = 'lighter';
    for (const p of dust) {
      const y = mod(p.y + time * p.speed * 0.018, 1.08) - 0.04;
      const x = mod(p.x + Math.sin(time * 0.07 + p.tw) * p.drift, 1.04) - 0.02;
      const alpha = p.a * (0.55 + 0.45 * Math.sin(time * 0.75 + p.tw));
      ctx.fillStyle = `rgba(157, 194, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(x * W, y * H, p.r * p.z, 0, TAU);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------------------------------------------------------------------
     The orrery behind the whale
     --------------------------------------------------------------------- */

  function drawMoon(time) {
    const mx = W * 0.80;
    const my = H * 0.185;
    const r = Math.min(W, H) * 0.026;
    const breathe = 1 + Math.sin(time * 0.07) * 0.012;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const halo = ctx.createRadialGradient(mx, my, r * 0.2, mx, my, r * 4.8 * breathe);
    halo.addColorStop(0, 'rgba(203, 228, 255, 0.045)');
    halo.addColorStop(0.42, 'rgba(137, 178, 238, 0.018)');
    halo.addColorStop(1, 'rgba(55, 90, 160, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(mx, my, r * 4.8 * breathe, 0, TAU);
    ctx.fill();

    // The crescent is built from two arcs, not a blurred disc.
    ctx.beginPath();
    ctx.arc(mx, my, r, Math.PI * 0.52, Math.PI * 1.86, false);
    ctx.arc(mx + r * 0.46, my - r * 0.10, r * 0.94, Math.PI * 1.76, Math.PI * 0.62, true);
    ctx.closePath();
    ctx.fillStyle = 'rgba(214, 236, 255, 0.065)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(226, 243, 255, 0.19)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // One very small companion star.
    ctx.fillStyle = 'rgba(218, 239, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(mx + r * 1.9, my - r * 0.9, 0.9, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawOrrery(time, theta) {
    const baseR = Math.max(scaleBase * 565, Math.min(W, H) * 0.37);
    const rings = [
      { r: baseR, rot: time * 0.012, dash: [1, 9], a: 0.11, moon: 0.8 },
      { r: baseR * 1.22, rot: -time * 0.008, dash: [1, 15], a: 0.075, moon: 2.15 },
      { r: baseR * 1.48, rot: time * 0.005, dash: [1, 21], a: 0.045, moon: 4.4 }
    ];

    ctx.save();
    ctx.translate(cx, cy + Math.sin(time * 0.16) * 5 * unit);

    for (const ring of rings) {
      ctx.beginPath();
      ctx.setLineDash(ring.dash.map(v => v * unit));
      ctx.lineDashOffset = ring.rot * 28 * unit;
      ctx.strokeStyle = `rgba(133, 171, 244, ${ring.a})`;
      ctx.lineWidth = 0.8;
      ctx.arc(0, 0, ring.r, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      const mx = Math.cos(ring.moon) * ring.r;
      const my = Math.sin(ring.moon) * ring.r;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(202, 233, 255, 0.78)';
      ctx.arc(mx, my, 1.6 * unit + 0.4, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(106, 150, 255, 0.10)';
      ctx.arc(mx, my, 8 * unit, 0, TAU);
      ctx.fill();
    }

    // A ring of fine gear teeth, turning very slowly.
    const tickR = baseR * 0.94;
    const ticks = 120;
    ctx.save();
    ctx.rotate(time * 0.01);
    ctx.beginPath();
    for (let i = 0; i < ticks; i++) {
      if (i % 5 !== 0) continue;
      const a = i / ticks * TAU;
      const inner = tickR + 3 * unit;
      const outer = tickR + 13 * unit;
      ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
    }
    ctx.strokeStyle = 'rgba(138, 178, 245, 0.13)';
    ctx.lineWidth = 0.9;
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < ticks; i++) {
      if (i % 5 === 0) continue;
      const a = i / ticks * TAU;
      const inner = tickR + 1 * unit;
      const outer = tickR + 7 * unit;
      ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
    }
    ctx.strokeStyle = 'rgba(138, 178, 245, 0.055)';
    ctx.lineWidth = 0.65;
    ctx.stroke();
    ctx.restore();

    // A single long measure arc, to give the composition a horizon.
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(120, 164, 242, 0.075)';
    ctx.lineWidth = 0.7;
    ctx.arc(0, 0, baseR * 1.05, -Math.PI * 0.78 + theta * 0.4, -Math.PI * 0.22 + theta * 0.4);
    ctx.stroke();

    ctx.restore();
  }

  /* ---------------------------------------------------------------------
     Whale fill and line paths
     --------------------------------------------------------------------- */

  function placeFrame(time) {
    if (STILL || REDUCED) {
      cx = baseCx;
      cy = baseCy;
      return;
    }
    cx = baseCx + Math.sin(time * 0.055) * 7 * unit;
    cy = baseCy + Math.sin(time * 0.13) * 3.2 * unit;
  }

  function drawWhaleBody(time, theta, sc, bob) {
    if (!bodyTexture) return;
    ctx.save();
    ctx.translate(cx, cy + bob);
    ctx.rotate(theta);
    const w = BODY_EXT_W * sc;
    const h = BODY_EXT_H * sc;
    // A low, readable baseline with one gentle six-second shimmer per 31s.
    // The squared sine has zero slope at both ends, so no sudden flashing.
    const shimmerTime = mod(time + 7, 31);
    const shimmer = shimmerTime < 6 ? Math.pow(Math.sin(Math.PI * shimmerTime / 6), 2) : 0;
    ctx.globalAlpha = 0.36 + 0.40 * shimmer;
    ctx.drawImage(bodyTexture, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function projectPoint(x, y, theta, sc, bob) {
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    return [
      cx + (x * c - y * s) * sc,
      cy + bob + (x * s + y * c) * sc
    ];
  }

  function makeScreenPoints(theta, sc, bob) {
    const pts = new Array(N);
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    for (let i = 0; i < N; i++) {
      const x = OUTER[i][0];
      const y = OUTER[i][1] + tailWeight(x) * 64 * tailBeat;
      pts[i] = [
        cx + (x * c - y * s) * sc,
        cy + bob + (x * s + y * c) * sc
      ];
    }
    return pts;
  }

  function pointAtPhase(phase, pts) {
    const u = mod(phase, 1) * N;
    const i = Math.floor(u) % N;
    const j = (i + 1) % N;
    const t = u - Math.floor(u);
    return [lerp(pts[i][0], pts[j][0], t), lerp(pts[i][1], pts[j][1], t)];
  }

  function drawRim(pts, reveal, alpha) {
    if (alpha <= 0.002 || reveal <= 0.002) return;
    const count = Math.min(N, Math.max(2, Math.ceil(reveal * N)));
    const closed = reveal >= 0.999;

    const trace = () => {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < count; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      if (closed) ctx.closePath();
    };

    const ink = ctx.createLinearGradient(0, cy - 390 * scaleBase, 0, cy + 390 * scaleBase);
    ink.addColorStop(0, `rgba(229, 249, 255, ${0.82 * alpha})`);
    ink.addColorStop(0.52, `rgba(167, 215, 255, ${0.72 * alpha})`);
    ink.addColorStop(1, `rgba(104, 145, 255, ${0.62 * alpha})`);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    trace();
    ctx.strokeStyle = `rgba(54, 103, 255, ${0.055 * alpha})`;
    ctx.lineWidth = 11;
    ctx.stroke();

    trace();
    ctx.strokeStyle = `rgba(111, 172, 255, ${0.16 * alpha})`;
    ctx.lineWidth = 3.6;
    ctx.stroke();

    trace();
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.25;
    ctx.stroke();

    ctx.restore();
  }

  function drawTrail(pts, phase) {
    const steps = 120;
    const trail = [];
    for (let i = 0; i <= steps; i++) {
      const freshness = i / steps;
      trail.push(pointAtPhase(phase - TRAIL_SPAN * (1 - freshness), pts));
    }

    const first = trail[0];
    const last = trail[trail.length - 1];
    const g = ctx.createLinearGradient(first[0], first[1], last[0], last[1]);
    g.addColorStop(0, 'rgba(60, 112, 255, 0)');
    g.addColorStop(0.46, 'rgba(105, 173, 255, 0.34)');
    g.addColorStop(0.82, 'rgba(195, 231, 255, 0.78)');
    g.addColorStop(1, 'rgba(255, 255, 255, 1)');

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(first[0], first[1]);
    for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i][0], trail[i][1]);

    ctx.strokeStyle = g;
    ctx.globalAlpha = 0.11;
    ctx.lineWidth = 12;
    ctx.stroke();

    ctx.globalAlpha = 0.38;
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = 1.45;
    ctx.stroke();
    ctx.restore();
  }

  function drawEpicycles(phase, theta, sc, bob, head) {
    let px = DC.x;
    let py = DC.y;
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    const toScreen = (x, y) => [
      cx + (x * c - y * s) * sc,
      cy + bob + (x * s + y * c) * sc
    ];

    const origin = toScreen(px, py);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    let last = origin;
    let lastRadius = 0;

    for (let i = 0; i < SHOWN.length; i++) {
      const term = SHOWN[i];
      const radius = term.amp * sc;
      if (radius < 1.2) break;
      const angle = TAU * term.freq * phase + term.phase;
      const nx = px + term.amp * Math.cos(angle);
      const ny = py + term.amp * Math.sin(angle);
      const next = toScreen(nx, ny);

      const strength = Math.pow(term.amp / largestAmp, 0.32);
      const alpha = 0.055 + strength * 0.25;
      const brass = i < 12;

      // Orbit ring. The strong, low harmonics read as solid planetary
      // gears; the faster outer circles are dotted.
      if (brass) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(194, 154, 91, ${alpha * 0.16})`;
        ctx.lineWidth = 5.5;
        ctx.arc(last[0], last[1], radius, 0, TAU);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.setLineDash(i > 6 && radius > 16 ? [1, 5.5] : []);
      ctx.lineDashOffset = -angle * 3;
      ctx.strokeStyle = brass
        ? `rgba(226, 197, 143, ${alpha * 1.5})`
        : `rgba(128, 171, 255, ${alpha})`;
      ctx.lineWidth = i < 7 ? 1.05 : 0.7;
      ctx.arc(last[0], last[1], radius, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      // A bright arc marks the current turning direction.
      ctx.beginPath();
      ctx.strokeStyle = brass
        ? `rgba(255, 231, 183, ${0.23 + strength * 0.4})`
        : `rgba(199, 231, 255, ${0.2 + strength * 0.34})`;
      ctx.lineWidth = i < 8 ? 1.35 : 0.9;
      ctx.arc(last[0], last[1], radius, angle - 0.38, angle + 0.38);
      ctx.stroke();

      // The arm to the next centre.
      ctx.beginPath();
      ctx.strokeStyle = `rgba(142, 183, 255, ${0.16 + strength * 0.28})`;
      ctx.lineWidth = 0.8;
      ctx.moveTo(last[0], last[1]);
      ctx.lineTo(next[0], next[1]);
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = brass
        ? `rgba(255, 242, 209, ${0.3 + strength * 0.5})`
        : `rgba(210, 237, 255, ${0.26 + strength * 0.5})`;
      ctx.arc(last[0], last[1], i === 0 ? 1.9 : 1.15, 0, TAU);
      ctx.fill();

      px = nx;
      py = ny;
      last = next;
      lastRadius = radius;
    }

    // The rest of the 720 phasors are still turning; indicate their
    // contribution with a fine, almost invisible tether to the real head.
    if (lastRadius > 0) {
      ctx.beginPath();
      ctx.setLineDash([2, 5]);
      ctx.strokeStyle = 'rgba(173, 212, 255, 0.20)';
      ctx.lineWidth = 0.7;
      ctx.moveTo(last[0], last[1]);
      ctx.lineTo(head[0], head[1]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  function drawHead(head, time) {
    const [x, y] = head;
    const pulse = 1 + 0.08 * Math.sin(time * 2.1);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const halo = ctx.createRadialGradient(x, y, 0, x, y, 42 * pulse);
    halo.addColorStop(0, 'rgba(255, 255, 255, 0.94)');
    halo.addColorStop(0.09, 'rgba(222, 242, 255, 0.72)');
    halo.addColorStop(0.32, 'rgba(115, 172, 255, 0.22)');
    halo.addColorStop(0.68, 'rgba(65, 104, 255, 0.07)');
    halo.addColorStop(1, 'rgba(30, 60, 200, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, 42 * pulse, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
    ctx.beginPath();
    ctx.arc(x, y, 2.15, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = 'rgba(220, 243, 255, 0.52)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(x, y, 7.5 + Math.sin(time * 2.1) * 1.1, 0, TAU);
    ctx.stroke();

    ctx.globalAlpha = 0.36;
    ctx.strokeStyle = 'rgba(160, 208, 255, 0.8)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(x - 15, y);
    ctx.lineTo(x - 6, y);
    ctx.moveTo(x + 6, y);
    ctx.lineTo(x + 15, y);
    ctx.moveTo(x, y - 15);
    ctx.lineTo(x, y - 6);
    ctx.moveTo(x, y + 6);
    ctx.lineTo(x, y + 15);
    ctx.stroke();

    ctx.restore();
  }

  /* ---------------------------------------------------------------------
     Sparks from the drawing head
     --------------------------------------------------------------------- */

  const sparks = [];
  let sparkAccum = 0;

  function spawnSpark(x, y, ageBias = 0) {
    const angle = random() * TAU;
    const speed = 7 + random() * 22;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      age: ageBias,
      life: 1.2 + random() * 2.1,
      size: 0.55 + random() * 1.45,
      tone: random()
    });
  }

  function seedStillSparks(pts, phase) {
    if (sparks.length) return;
    for (let i = 0; i < 28; i++) {
      const p = pointAtPhase(phase - random() * TRAIL_SPAN, pts);
      spawnSpark(
        p[0] + (random() - 0.5) * 7,
        p[1] + (random() - 0.5) * 7,
        random() * 1.5
      );
    }
  }

  function updateSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.age += dt;
      if (p.age >= p.life) { sparks.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 1 - 0.55 * dt;
      p.vy *= 1 - 0.55 * dt;
      p.vy -= 5 * dt;
    }
  }

  function drawSparks() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of sparks) {
      const fade = 1 - p.age / p.life;
      const a = fade * fade * 0.66;
      const color = p.tone > 0.72
        ? `rgba(178, 212, 255, ${a})`
        : p.tone > 0.32
          ? `rgba(113, 168, 255, ${a})`
          : `rgba(236, 249, 255, ${a})`;
      ctx.strokeStyle = color;
      ctx.lineWidth = p.size * 0.8;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.028, p.y - p.vy * 0.028);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------------------------------------------------------------
     Render loop
     --------------------------------------------------------------------- */

  let simTime = 0;
  let lastTime = 0;
  let lastPhase = 0;
  let pulses = [];

  function cycleState(time) {
    const elapsed = mod(time, LOOP_SECONDS);
    const drawing = elapsed < DRAW_SECONDS;
    const drawProgress = clamp(elapsed / DRAW_SECONDS, 0, 1);
    const holdElapsed = Math.max(0, elapsed - DRAW_SECONDS);
    // During the hold the chain keeps moving through one complete extra
    // lap, so the loop boundary is phasor-identical and never jumps.
    const phase = drawing
      ? drawProgress
      : 1 + holdElapsed / HOLD_SECONDS;
    const fadeStart = LOOP_SECONDS - RIM_FADE_SECONDS;
    const rimAlpha = elapsed <= fadeStart
      ? 1
      : clamp(1 - (elapsed - fadeStart) / RIM_FADE_SECONDS, 0, 1);
    return {
      elapsed,
      drawing,
      drawProgress,
      reveal: drawProgress,
      rimAlpha,
      phase: mod(phase, 1),
      holding: !drawing
    };
  }

  function drawPulses(time) {
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      const age = (time - p.born) / 2.8;
      if (age >= 1) { pulses.splice(i, 1); continue; }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(131, 187, 255, ${(1 - age) * 0.18})`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8 + age * 74, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  function splashAnchor(pts) {
    let bestX = null;
    let bestY = -Infinity;
    for (const p of pts) {
      const dy = p[1] - waterY;
      if (dy > -14 * unit && dy < 58 * unit && p[0] > bestX) {
        bestX = p[0];
        bestY = p[1];
      }
    }
    if (bestX === null) {
      let nearest = Infinity;
      for (const p of pts) {
        const d = Math.abs(p[1] - waterY);
        if (d < nearest) { nearest = d; bestX = p[0]; bestY = p[1]; }
      }
    }
    void bestY;
    return bestX === null ? cx + W * 0.18 : bestX;
  }

  function drawSplash(time, ax, activity) {
    const u = unit;
    const surface = waterY;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Light pooling under the breach.
    const pool = ctx.createRadialGradient(ax, surface, 0, ax, surface, 180 * u);
    pool.addColorStop(0, `rgba(117, 184, 255, ${0.10 * activity})`);
    pool.addColorStop(0.42, `rgba(54, 113, 210, ${0.045 * activity})`);
    pool.addColorStop(1, 'rgba(22, 42, 105, 0)');
    ctx.fillStyle = pool;
    ctx.beginPath();
    ctx.ellipse(ax, surface + 24 * u, 180 * u, 86 * u, 0, 0, TAU);
    ctx.fill();

    // Expanding ripples on the surface.
    for (let k = 0; k < 3; k++) {
      const age = mod(time * 0.18 + k / 3, 1);
      const rx = (22 + age * 160) * u;
      const ry = (2.5 + age * 12) * u;
      ctx.strokeStyle = `rgba(148, 207, 255, ${(1 - age) * 0.11 * activity})`;
      ctx.lineWidth = 0.85;
      ctx.beginPath();
      ctx.ellipse(ax, surface + 12 * u + k * 5 * u, rx, ry, 0, 0, TAU);
      ctx.stroke();
    }

    // Foam collar around the exit point.
    ctx.beginPath();
    for (let i = 0; i <= 16; i++) {
      const a = i / 16 * TAU;
      const r = (28 + Math.sin(i * 2.7 + time * 1.5) * 11) * u;
      const x = ax + Math.cos(a) * r;
      const y = surface + 8 * u + Math.sin(a) * 4 * u;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(192, 229, 255, ${0.15 * activity})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Foam lines pushed sideways across the surface.
    ctx.strokeStyle = `rgba(184, 224, 255, ${0.10 * activity})`;
    ctx.lineWidth = 1.05;
    for (const dir of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(ax + dir * 18 * u, surface + 6 * u);
      ctx.bezierCurveTo(
        ax + dir * 70 * u, surface - 4 * u,
        ax + dir * 120 * u, surface + 6 * u,
        ax + dir * 180 * u, surface + 2 * u
      );
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(ax - 62 * u, surface + 3 * u);
    ctx.quadraticCurveTo(ax, surface - 18 * u, ax + 62 * u, surface + 3 * u);
    ctx.strokeStyle = `rgba(201, 233, 255, ${0.13 * activity})`;
    ctx.lineWidth = 1.15;
    ctx.stroke();

    // Fine crown of spray.
    for (let i = 0; i < 6; i++) {
      const spread = (i - 2.5) * 13 * u;
      const height = (32 + Math.sin(time * 1.45 + i * 1.1) * 12) * u;
      const sway = Math.sin(time * 1.1 + i * 1.7) * 4 * u;
      ctx.beginPath();
      ctx.moveTo(ax + spread, surface + 4 * u);
      ctx.quadraticCurveTo(ax + spread + sway * 0.5, surface - height * 0.6, ax + spread + sway, surface - height);
      ctx.strokeStyle = `rgba(196, 232, 255, ${0.12 * activity})`;
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }

    // Rising and falling droplets, deterministic so they never flicker.
    for (const d of splashDrops) {
      const t = mod(time * d.speed + d.phase, 1);
      const arc = Math.sin(t * Math.PI);
      const x = ax + d.drift * u + Math.sin(t * TAU * d.phase + d.phase) * d.spread * u * 0.5 + (t - 0.5) * d.drift * u * 0.6;
      const y = surface - arc * d.height * u + Math.pow(t, 2.4) * 20 * u;
      const a = arc * d.alpha * activity;
      if (a < 0.01) continue;
      ctx.fillStyle = `rgba(207, 238, 255, ${a})`;
      ctx.beginPath();
      ctx.arc(x, y, d.size * u, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = `rgba(171, 219, 255, ${a * 0.5})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - d.drift * u * 0.006, y + (arc < 0.6 ? 3 : -2) * u);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawSea(time, pts, head, cycle) {
    const u = unit;
    const surface = waterY;
    const activity = cycle ? (cycle.holding ? 1 : 0.55 + 0.45 * cycle.drawProgress) : 1;

    // A cold bloom in the air just above the water.
    const haze = ctx.createLinearGradient(0, surface - 160 * u, 0, surface + 8 * u);
    haze.addColorStop(0, 'rgba(22, 55, 102, 0)');
    haze.addColorStop(0.62, 'rgba(33, 83, 142, 0.045)');
    haze.addColorStop(0.9, 'rgba(67, 128, 190, 0.13)');
    haze.addColorStop(1, 'rgba(92, 150, 210, 0.20)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, surface - 160 * u, W, 168 * u);

    // The water plane occludes the submerged part of the whale, but not
    // completely: the rim light still breathes through the surface.
    const water = ctx.createLinearGradient(0, surface, 0, H);
    water.addColorStop(0, 'rgba(5, 18, 36, 0.60)');
    water.addColorStop(0.12, 'rgba(4, 15, 32, 0.74)');
    water.addColorStop(0.38, 'rgba(3, 11, 24, 0.90)');
    water.addColorStop(1, 'rgba(1, 3, 9, 0.985)');
    ctx.fillStyle = water;
    ctx.fillRect(0, surface, W, H - surface);

    const deep = ctx.createRadialGradient(W * 0.52, surface + 90 * u, 10, W * 0.52, surface + 90 * u, W * 0.55);
    deep.addColorStop(0, 'rgba(24, 66, 120, 0.12)');
    deep.addColorStop(0.5, 'rgba(12, 37, 78, 0.04)');
    deep.addColorStop(1, 'rgba(2, 7, 18, 0)');
    ctx.fillStyle = deep;
    ctx.fillRect(0, surface, W, H - surface);

    // Long, slow wave bands.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let band = 0; band < 7; band++) {
      const depth = band / 6;
      const base = surface + 6 * u + Math.pow(depth, 1.7) * (H - surface) * 0.9;
      const amp = (1.1 + depth * 6) * u;
      const step = Math.max(8, W / 180);
      ctx.beginPath();
      for (let x = -step; x <= W + step; x += step) {
        const y = base
          + Math.sin(x * 0.0042 + time * (0.24 + depth * 0.28) + band * 0.9) * amp
          + Math.sin(x * 0.013 - time * (0.16 + depth * 0.12) + band * 0.55) * amp * 0.32;
        if (x <= 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(116, 177, 236, ${0.040 + depth * 0.070})`;
      ctx.lineWidth = 0.65 + depth * 0.45;
      ctx.stroke();
    }

    // Small specular glints on the swells.
    for (const g of seaGlints) {
      const x0 = g.x * W;
      const y0 = surface + 10 * u + g.y * (H - surface) * 0.83;
      const shimmer = 0.5 + 0.5 * Math.sin(time * g.speed + g.phase);
      const a = (0.018 + shimmer * 0.075) * (1 - g.y * 0.35);
      const len = (6 + g.len * W) * (0.6 + 0.4 * shimmer);
      ctx.strokeStyle = g.tone > 0.72
        ? `rgba(224, 242, 255, ${a})`
        : g.tone > 0.3
          ? `rgba(142, 201, 255, ${a})`
          : `rgba(104, 164, 255, ${a * 0.8})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x0 - len / 2, y0);
      ctx.lineTo(x0 + len / 2, y0 + Math.sin(time * 0.2 + x0) * 0.6);
      ctx.stroke();
    }
    ctx.restore();

    // The horizon seam itself.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const seam = ctx.createLinearGradient(0, 0, W, 0);
    seam.addColorStop(0, 'rgba(70, 130, 200, 0)');
    seam.addColorStop(0.35, 'rgba(99, 166, 230, 0.055)');
    seam.addColorStop(0.56, 'rgba(150, 207, 255, 0.18)');
    seam.addColorStop(0.78, 'rgba(99, 166, 230, 0.06)');
    seam.addColorStop(1, 'rgba(70, 130, 200, 0)');
    ctx.beginPath();
    const seamStep = Math.max(6, W / 220);
    for (let x = 0; x <= W; x += seamStep) {
      const y = surface + Math.sin(x * 0.0048 + time * 0.72) * 2.2 * u + Math.sin(x * 0.011 - time * 0.33) * 1.1 * u;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = seam;
    ctx.lineWidth = 1.15;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(145, 196, 255, 0.05)';
    ctx.lineWidth = 9;
    ctx.stroke();
    ctx.restore();

    // Splash follows the point where the whale leaves the water.
    const target = splashAnchor(pts);
    if (splashX === null || STILL || REDUCED) splashX = target;
    else splashX += (target - splashX) * 0.075;
    drawSplash(time, splashX, activity);

    // Two foreground crests, deliberately faint.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let layer = 0; layer < 2; layer++) {
      const off = (14 + layer * 26) * u;
      const step = Math.max(8, W / 140);
      ctx.beginPath();
      for (let x = 0; x <= W; x += step) {
        const y = surface + off
          + Math.sin(x * 0.006 + time * (0.5 + layer * 0.15) + layer * 1.7) * (2.5 + layer * 2) * u
          + Math.sin(x * 0.018 - time * 0.3) * 1.2 * u;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = layer === 0 ? 'rgba(126, 190, 255, 0.055)' : 'rgba(92, 144, 210, 0.03)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
    void head;
  }

  function render(nowMs) {
    const dt = lastTime ? Math.min(0.05, (nowMs - lastTime) / 1000) : 0;
    lastTime = nowMs;
    const time = STILL
      ? STILL_T * LOOP_SECONDS
      : REDUCED
        ? 0.78 * LOOP_SECONDS
        : simTime;
    if (!STILL && !REDUCED) simTime += dt;

    const cycle = cycleState(STILL || REDUCED ? time : time + START_CYCLE * LOOP_SECONDS);
    const phase = cycle.phase;

    if (lastPhase > 0.97 && phase < 0.04 && !STILL) {
      const p = projectPoint(DC.x, DC.y, LEAP_THETA, scaleBase, 0);
      pulses.push({ x: p[0], y: p[1], born: time });
    }
    lastPhase = phase;

    const theta = LEAP_THETA + (STILL || REDUCED ? 0 : Math.sin(time * 0.16) * 0.012);
    const sc = scaleBase * (STILL || REDUCED ? 1 : 1 + Math.sin(time * 0.19) * 0.0045);
    const bob = STILL || REDUCED ? 0 : Math.sin(time * 0.21) * 5.5 * unit;
    swim(time);
    placeFrame(time);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawDust(time);
    drawMoon(time);
    drawOrrery(time, theta);
    drawWhaleBody(time, theta, sc, bob);

    const pts = makeScreenPoints(theta, sc, bob);

    drawRim(pts, cycle.reveal, cycle.rimAlpha);

    const head = pointAtPhase(phase, pts);
    drawEpicycles(phase, theta, sc, bob, head);
    drawTrail(pts, phase);

    if (STILL && !REDUCED) seedStillSparks(pts, phase);
    if (!STILL && !REDUCED) {
      sparkAccum += dt;
      if (sparkAccum > 0.045) {
        sparkAccum = 0;
        spawnSpark(head[0], head[1]);
        if (sparks.length > 92) sparks.shift();
      }
      updateSparks(dt);
    }
    drawSparks();
    drawPulses(time);
    drawHead(head, time);
    drawSea(time, pts, head, cycle);

    if (!STILL && !REDUCED) requestAnimationFrame(render);
  }

  /* ---------------------------------------------------------------------
     Spectrum bars
     --------------------------------------------------------------------- */

  function buildSpectrumBars() {
    if (!spectrumHost) return;
    const top = TERMS.slice(0, 26);
    for (let i = 0; i < top.length; i++) {
      const bar = document.createElement('i');
      const h = 8 + Math.pow(top[i].amp / top[0].amp, 0.58) * 92;
      bar.style.height = h.toFixed(1) + '%';
      bar.style.setProperty('--i', String(i));
      spectrumHost.appendChild(bar);
    }
  }

  /* ---------------------------------------------------------------------
     Boot
     --------------------------------------------------------------------- */

  window.addEventListener('resize', () => {
    resize();
    if (STILL) render(performance.now());
  }, { passive: true });

  resize();
  buildSpectrumBars();
  requestAnimationFrame((t) => {
    lastTime = t;
    render(t);
    requestAnimationFrame(() => document.body.classList.add('ready'));
  });
})();
</script>
</body>
</html>
