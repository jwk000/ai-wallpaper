    const top = c.createLinearGradient(0, 0, 0, h * .16);
    top.addColorStop(0, 'rgba(0,3,1,.55)');
    top.addColorStop(1, 'rgba(0,3,1,0)');
    c.fillStyle = top;
    c.fillRect(0, 0, w, h * .16);
    // The thinnest brass frame, mostly read as a glass edge.
    c.strokeStyle = 'rgba(201,155,92,.10)';
    c.lineWidth = 1;
    c.strokeRect(Math.max(6, w * .006), Math.max(6, h * .010), w - Math.max(12, w * .012), h - Math.max(12, h * .020));
  }

  /* ------------------------------ state, loop & HUD ------------------------------ */

  const el = {
    panel: document.getElementById('panel'),
    settings: document.getElementById('settings'),
    pause: document.getElementById('pauseBtn'),
    full: document.getElementById('fullBtn'),
    service: document.getElementById('serviceBtn'),
    liveBloom: document.getElementById('liveBloom'),
    roMain: document.getElementById('roMain'),
    roService: document.getElementById('roService'),
    toast: document.getElementById('toast'),
    standButtons: Array.from(document.querySelectorAll('[data-stand]')),
  };

  let booted = false;

  function initState() {
    service = serviceState(time);
    cam = cameraAt(time);
    for (const p of plants) {
      p.gearPhase = time / p.period * TAU;
      p.open = autoOpen(p, time);
      p.fold = service.active && service.index === p.index ? serviceFold(service.progress) : 0;
      p.open *= (1 - p.fold * .95);
      p.wound = 0;
      p.woundTarget = 0;
      p.pulseUntil = -1;
      p.manualUntil = -1;
      p.manualTarget = null;
      p.steamBudget = 0;
    }
    steam = [];
  }

  function update(dt) {
    time += dt;
    service = serviceState(time);
    for (const p of plants) {
      const active = service.active && service.index === p.index;
      const foldTarget = active ? serviceFold(service.progress) : 0;
      p.fold += (foldTarget - p.fold) * Math.min(1, dt * 3.1);
      const pulse = p.pulseUntil > time ? 1 : 0;
      const targetWound = Math.max(p.woundTarget, pulse);
      if (targetWound > p.wound) p.wound += (targetWound - p.wound) * Math.min(1, dt * 1.5);
      else p.wound *= Math.exp(-dt / 4.2);
      p.wound = clamp(p.wound, 0, 1);
      p.gearPhase += dt * (TAU / p.period) * (1 + .4 * p.wound) * (active ? .16 : 1);
      let target = autoOpen(p, time);
      if (p.manualUntil > time && p.manualTarget !== null) target = p.manualTarget;
      target *= (1 - p.fold * .95);
      p.open += (target - p.open) * Math.min(1, dt * 3.5);
      p.open = clamp(p.open, 0, 1);
      if (p.pulseUntil > -1 && p.pulseUntil < time - 4) p.pulseUntil = -1;
    }
    if (service.active) {
      const p = plants[service.index];
      if (service.progress > .12 && service.progress < .74) spawnSteam(p, dt);
    }
    for (const s of steam) {
      s.life += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy -= 5 * dt;
      s.vx *= Math.exp(-dt * .4);
      s.size += dt * 4;
    }
    steam = steam.filter((s) => s.life < s.max);
  }

  function render() {
    if (!w || !h) return;
    cam = cameraAt(time);
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#040906';
    c.fillRect(0, 0, w, h);

    // Background drifts at a third of the camera speed.
    const bz = 1.035 + (cam.zoom - 1) * .35;
    c.save();
    c.translate(w / 2 + cam.x * .35, h / 2 + cam.y * .35);
    c.scale(bz, bz);
    c.translate(-w / 2, -h / 2);
    c.drawImage(bgLayer, 0, 0, w, h);
    c.restore();

    drawFloor();
    drawDistantStands();
    drawBeamAndDust();

    c.save();
    c.translate(w / 2, h / 2);
    c.scale(cam.zoom, cam.zoom);
    c.translate(-w / 2, -h / 2);
    c.translate(-cam.x, -cam.y);
    for (const p of plants) {
      if (p.shelf) drawShelf(p);
      else drawPedestal(p);
      drawPlant(p);
    }
    c.restore();

    drawSteam();

    // Foreground glass and railing move faster than anything behind them.
    c.save();
    c.translate(w / 2 + cam.x * 1.35, h / 2 + cam.y * 1.35);
    c.scale(1.012, 1.012);
    c.translate(-w / 2, -h / 2);
    c.drawImage(fgLayer, 0, 0, w, h);
    c.restore();

    drawVignette();
    frames++;
    if (frames % 5 === 0) updateHud();
  }

  function updateHud() {
    const main = plants[0];
    const pct = Math.round(main.open * 100) + '%';
    if (el.liveBloom.textContent !== pct) el.liveBloom.textContent = pct;
    const mainText = 'CAMELLIA · ' + String(Math.round(main.open * 100)).padStart(2, '0') + '%';
    if (el.roMain.textContent !== mainText) el.roMain.textContent = mainText;
    let serviceText;
    if (service.active) {
      serviceText = 'IN SERVICE · ' + plants[service.index].label;
    } else {
      const sec = Math.max(0, Math.floor(nextServiceIn(time)));
      const mm = Math.floor(sec / 60);
      const ss = sec % 60;
      serviceText = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    }
    if (el.roService.textContent !== serviceText) el.roService.textContent = serviceText;
    el.standButtons.forEach((b, i) => b.classList.toggle('active', i === hoverIndex || (i === focusStand && focusUntil > time)));
  }

  function showToast(message) {
    el.toast.textContent = message;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
    scheduleQuiet();
  }

  function scheduleQuiet() {
    clearTimeout(quietTimer);
    document.body.classList.remove('quiet');
    quietTimer = setTimeout(() => document.body.classList.add('quiet'), 16000);
  }

  function toggleHud() {
    document.body.classList.toggle('hud-off');
    scheduleQuiet();
  }

  function togglePause() {
    paused = !paused;
    syncPlayback();
    if (paused) render();
    showToast(paused ? '时间停止 · 发条仍在弦上' : '时间继续');
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* Wallpaper hosts often do not expose fullscreen. */ }
  }

  function syncPlayback() {
    cancelAnimationFrame(raf);
    raf = 0;
    last = 0;
    accumulator = 0;
    el.pause.textContent = paused ? '继续' : '暂停';
    if (!paused && !document.hidden) raf = requestAnimationFrame(frame);
    if (paused) render();
  }

  function frame(now) {
    raf = 0;
    if (paused || document.hidden) { last = 0; return; }
    if (!last) last = now;
    accumulator += Math.min((now - last) / 1000, .1);
    last = now;
    if (accumulator >= 1 / 30) {
      const dt = Math.min(accumulator, .1);
      accumulator = 0;
      update(dt);
      render();
    }
    raf = requestAnimationFrame(frame);
  }

  function worldAt(sx, sy) {
    return {
      x: w / 2 + (sx - w / 2) / cam.zoom + cam.x,
      y: h / 2 + (sy - h / 2) / cam.zoom + cam.y,
    };
  }

  function hitTest(sx, sy) {
    const p = worldAt(sx, sy);
    for (let i = plants.length - 1; i >= 0; i--) {
      const q2 = plants[i].hit;
      if (q2 && p.x >= q2.x && p.x <= q2.x + q2.w && p.y >= q2.y && p.y <= q2.y + q2.h) return i;
    }
    return -1;
  }

  function focusOn(index, wind = true) {
    const i = clamp(Math.round(index), 0, 2);
    focusStand = i;
    focusUntil = time + 24;
    if (wind) plants[i].pulseUntil = time + 3.2;
    render();
    updateHud();
  }

  function toggleBloom(index) {
    const p = plants[clamp(index, 0, 2)];
    if (!p) return;
    if (paused) {
      p.open = p.open > .45 ? 0 : 1;
      render();
      showToast(p.label + (p.open > .5 ? ' · 已开花' : ' · 已收拢'));
      return;
    }
    const target = p.open > .45 ? 0 : 1;
    p.manualTarget = target;
    p.manualUntil = time + 24;
    p.pulseUntil = time + 2.5;
    showToast(p.label + (target ? ' · 开花' : ' · 收拢'));
  }

  function triggerService(index) {
    const i = clamp(Math.round(index), 0, 2);
    manualService = { index: i, start: time };
    service = serviceState(time);
    showToast(plants[i].label + ' · 检修开始');
    render();
  }

  function reseed(nextSeed) {
    seed = (Number.isFinite(nextSeed) ? nextSeed : 1 + Math.floor(Math.random() * 2147483645)) >>> 0;
    for (const p of plants) buildPlant(p);
    plants.forEach((p) => { p.wound = 0; p.woundTarget = 0; p.open = autoOpen(p, time); });
    layout();
    initState();
    bakeBackground();
    bakeForeground();
    buildDust();
    render();
    updateHud();
    showToast('新的温室已布置');
  }

  /* ------------------------------ resize & boot ------------------------------ */

  function resizeCanvas() {
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 1.5, Math.sqrt(2600000 / (w * h)));
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function resize() {
    resizeCanvas();
    layout();
    if (!booted) {
      booted = true;
      initState();
    }
    steam = [];
    bakeBackground();
    bakeForeground();
    buildDust();
    render();
    updateHud();
  }

  /* ------------------------------ events ------------------------------ */

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function onPointerMove(e) {
    const p = pointerPos(e);
    pointer.x = p.x; pointer.y = p.y; pointer.inside = true;
    const hit = hitTest(p.x, p.y);
    hoverIndex = hit;
    canvas.style.cursor = hit >= 0 ? 'pointer' : 'default';
    plants.forEach((pl, i) => { pl.woundTarget = i === hit ? 1 : 0; });
    scheduleQuiet();
  }

  function onPointerDown(e) {
    const p = pointerPos(e);
    pointer.down = true;
    pointer.downX = p.x; pointer.downY = p.y; pointer.downTime = Date.now();
    pointer.x = p.x; pointer.y = p.y;
    const hit = hitTest(p.x, p.y);
    if (hit >= 0) {
      hoverIndex = hit;
      plants[hit].woundTarget = 1;
    }
    scheduleQuiet();
  }

  function onPointerUp(e) {
    if (!pointer.down) return;
    pointer.down = false;
    const p = pointerPos(e);
    const moved = Math.hypot(p.x - pointer.downX, p.y - pointer.downY);
    const quick = Date.now() - pointer.downTime < 900;
    const hit = hitTest(p.x, p.y);
    if (moved < 12 && quick && hit >= 0) toggleBloom(hit);
    else if (hit >= 0) plants[hit].pulseUntil = time + 2.4;
    pointer.x = p.x; pointer.y = p.y;
    scheduleQuiet();
  }

  function onPointerLeave() {
    pointer.inside = false;
    pointer.down = false;
    hoverIndex = -1;
    canvas.style.cursor = 'default';
    plants.forEach((pl) => { pl.woundTarget = 0; });
    if (paused) render();
  }

  function installEvents() {
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerLeave);
    canvas.addEventListener('pointerleave', onPointerLeave);

    el.settings.addEventListener('click', () => {
      const open = el.panel.hidden;
      el.panel.hidden = !open;
      el.settings.setAttribute('aria-expanded', String(open));
      if (open) scheduleQuiet();
    });
    el.pause.addEventListener('click', togglePause);
    el.full.addEventListener('click', toggleFullscreen);
    el.service.addEventListener('click', () => triggerService(focusUntil > time ? focusStand : hoverIndex >= 0 ? hoverIndex : 0));
    el.standButtons.forEach((b) => b.addEventListener('click', () => focusOn(Number(b.dataset.stand) || 0)));

    addEventListener('keydown', (e) => {
      if (e.target && e.target.matches && e.target.matches('input, select, button')) return;
      if (e.repeat) return;
      if (e.code === 'Space') { e.preventDefault(); togglePause(); }
      else if (e.key === '1' || e.key === '2' || e.key === '3') focusOn(Number(e.key) - 1);
      else if (e.key && e.key.toLowerCase() === 'h') toggleHud();
      else if (e.key && e.key.toLowerCase() === 'f') toggleFullscreen();
      scheduleQuiet();
    });

    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) last = 0;
      syncPlayback();
    });
    reducedMotion.addEventListener('change', (e) => {
      if (!q.has('still')) {
        paused = e.matches;
        syncPlayback();
        render();
      }
    });
    if (q.get('hud') === '0') document.body.classList.add('hud-off');
    scheduleQuiet();
  }

  /* ------------------------------ debug API ------------------------------ */

  window.__lumenGarden = {
    snapshot: () => ({
      t: time, w, h, dpr, paused, frames,
      cam: { x: cam.x, y: cam.y, zoom: cam.zoom },
      focus: focusStand, focusUntil,
      hover: hoverIndex,
      service: { ...service },
      steam: steam.length,
      nextService: nextServiceIn(time),
      plants: plants.map((p) => ({
        id: p.id, x: p.x, y: p.y, scale: p.scale,
        open: p.open, wound: p.wound, fold: p.fold,
        gearPhase: p.gearPhase, manualUntil: p.manualUntil, manualTarget: p.manualTarget,
        petals: p.petals, gears: p.gearCount, blooms: p.blooms.length,
        hit: p.hit,
      })),
      totalPetals: plants.reduce((s, p) => s + p.petals, 0),
      totalGears: plants.reduce((s, p) => s + p.gearCount, 0),
      dust: dust.length,
    }),
    audit: () => {
      let bad = 0;
      for (const p of plants) {
        const values = [p.x, p.y, p.scale, p.open, p.wound, p.fold, p.gearPhase];
        if (values.some((v) => !Number.isFinite(v))) bad++;
        if (p.open < -.001 || p.open > 1.001 || p.fold < -.001 || p.fold > 1.001) bad++;
        if (p.petals > 120 || p.gearCount > 40) bad++;
        if (p.blooms.length > 8) bad++;
      }
      for (const s of steam) {
        if (![s.x, s.y, s.vx, s.vy, s.life, s.max, s.size].every(Number.isFinite)) bad++;
      }
      return {
        bad,
        steam: steam.length,
        totalPetals: plants.reduce((s, p) => s + p.petals, 0),
        totalGears: plants.reduce((s, p) => s + p.gearCount, 0),
        serviceActive: service.active,
        serviceIndex: service.index,
        serviceProgress: service.progress,
        paused,
        hidden: document.hidden,
        frames,
      };
    },
    advance: (seconds) => {
      const n = Math.max(1, Math.round(seconds * 30));
      for (let i = 0; i < n; i++) update(1 / 30);
      render();
      return window.__lumenGarden.snapshot();
    },
    setTime: (t) => {
      time = clamp(Number(t) || 0, 0, 86400);
      initState();
      render();
      return window.__lumenGarden.snapshot();
    },
    focusStand: (i) => { focusOn(i); return focusStand; },
    windUp: (i) => {
      const p = plants[clamp(i, 0, 2)];
      p.pulseUntil = time + 3.2;
      render();
      return p.wound;
    },
    toggleBloom: (i) => { toggleBloom(i); return plants[clamp(i, 0, 2)].open; },
    setOpen: (i, v) => {
      const p = plants[clamp(i, 0, 2)];
      p.open = clamp(Number(v) || 0, 0, 1);
      p.manualTarget = p.open;
      p.manualUntil = time + 30;
      render();
      return p.open;
    },
    setWound: (i, v) => {
      const p = plants[clamp(i, 0, 2)];
      p.wound = clamp(Number(v) || 0, 0, 1);
      render();
      return p.wound;
    },
    triggerService: (i) => { triggerService(i); return window.__lumenGarden.snapshot(); },
    togglePause,
    reseed,
    render,
    update,
    layout,
    steamBudget: () => MAX_STEAM,
  };

  /* ------------------------------ boot ------------------------------ */

  buildSprites();
  buildDust();
  resizeCanvas();
  layout();
  installEvents();
  booted = true;
  initState();
  bakeBackground();
  bakeForeground();
  render();
  updateHud();
  syncPlayback();
})();
</script>
</body>
</html>
