<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#020307" />
<title>HYDROGEN — 热核 · 动态壁纸</title>
<style>
  :root {
    color-scheme: dark;
    --ink: rgba(255, 239, 218, 0.72);
    --ink-dim: rgba(255, 232, 208, 0.32);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020307;
  }
  body {
    font-family: "Helvetica Neue", "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body.idle { cursor: none; }
  #stage {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 62%, rgba(75, 25, 10, 0.16), transparent 48%),
      linear-gradient(180deg, #020307 0%, #05080e 62%, #010203 100%);
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #gl { z-index: 1; }
  #fx {
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  #vignette {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, transparent 22%, transparent 74%, rgba(0, 0, 0, 0.42) 100%),
      radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.34) 100%);
    opacity: 0.75;
  }
  #hint {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: clamp(22px, 4.2vh, 48px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 15px 9px 13px;
    border: 1px solid rgba(255, 229, 201, 0.12);
    border-radius: 999px;
    background: rgba(4, 6, 10, 0.34);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    color: var(--ink-dim);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.26em;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 1.1s ease, color 0.4s ease, border-color 0.4s ease;
    pointer-events: none;
  }
  #hint.show { opacity: 0.92; }
  #hint .pulse {
    width: 5px;
    height: 5px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #ffb36b;
    box-shadow: 0 0 8px 2px rgba(255, 130, 48, 0.65);
    animation: pulse 2.8s ease-in-out infinite;
  }
  #hint .cn { color: rgba(255, 239, 218, 0.76); letter-spacing: 0.2em; }
  #hint .bar { width: 1px; height: 10px; background: rgba(255, 228, 200, 0.16); }
  #hint .en { font-size: 9px; letter-spacing: 0.28em; }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  #brand {
    position: fixed;
    z-index: 5;
    left: clamp(20px, 3vw, 44px);
    top: clamp(18px, 3vh, 36px);
    color: rgba(255, 238, 218, 0.28);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.5em;
    line-height: 1.6;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    animation: brandIn 2.4s 0.6s ease forwards;
  }
  #brand b {
    display: block;
    color: rgba(255, 241, 226, 0.52);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.42em;
    margin-bottom: 5px;
  }
  #brand .rule {
    display: block;
    width: 34px;
    height: 1px;
    margin-top: 9px;
    background: linear-gradient(90deg, rgba(255, 190, 130, 0.5), transparent);
  }
  @keyframes brandIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  #fallback {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    place-items: center;
    text-align: center;
    background:
      radial-gradient(circle at 50% 48%, rgba(255, 92, 25, 0.11), transparent 34%),
      #020307;
    color: rgba(255, 236, 215, 0.66);
    letter-spacing: 0.15em;
    line-height: 2;
    font-size: 13px;
    padding: 24px;
  }
  #fallback strong {
    display: block;
    color: rgba(255, 244, 230, 0.85);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.3em;
    margin-bottom: 10px;
  }
  @media (max-width: 640px) {
    #brand { display: none; }
    #hint { font-size: 9px; letter-spacing: 0.16em; bottom: 18px; padding: 8px 12px; gap: 9px; }
    #hint .en { display: none; }
    #hint .bar { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="氢弹爆炸动态壁纸"></canvas>
  <canvas id="fx"></canvas>
  <div id="vignette"></div>
  <div id="brand" aria-hidden="true">
    <b>HYDROGEN</b>
    THERMONUCLEAR<br />OBSERVATION 07
    <span class="rule"></span>
  </div>
  <div id="hint" role="note">
    <span class="pulse"></span>
    <span class="cn">点击引爆</span>
    <span class="bar"></span>
    <span class="en">SPACE TO DETONATE</span>
  </div>
  <div id="fallback">
    <div>
      <strong>需要 WebGL 2</strong>
      当前浏览器或显卡不支持此动态壁纸。<br />
      请使用最新版 Chrome / Edge / Firefox 打开。
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('gl');
  const fxCanvas = document.getElementById('fx');
  const hintEl = document.getElementById('hint');
  const fallbackEl = document.getElementById('fallback');

  const gl = canvas.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: false
  });

  if (!gl) {
    fallbackEl.style.display = 'grid';
    document.getElementById('brand').style.display = 'none';
    return;
  }

  // ---------------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------------
  const CYCLE = 30.0;                 // 秒：一次完整循环
  const INTRO_AGE = 27.05;            // 开场先留约 3 秒静夜，再引爆
  const HORIZON = -0.52;
  const params = new URLSearchParams(location.search);
  const FIXED_AGE = params.has('t') ? Math.max(0, Math.min(CYCLE - 0.001, parseFloat(params.get('t')) || 0)) : null;
  const FREEZE = params.get('freeze') === '1' || FIXED_AGE !== null;
  const HIDE_UI = params.get('ui') === '0';
  const AUTO = params.get('auto') !== '0';
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (HIDE_UI) {
    hintEl.style.display = 'none';
    document.getElementById('brand').style.display = 'none';
  }
  if (reducedMotion) {
    // 尊重系统的“减少动态效果”，仍保留爆炸本身，只去掉镜头晃动。
    window.__REDUCED_MOTION__ = true;
  }

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

  // ---------------------------------------------------------------------------
  // WebGL helpers
  // ---------------------------------------------------------------------------
  const extColorFloat = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
  const useHalfFloat = !!extColorFloat;
  const SCENE_FORMAT = useHalfFloat ? gl.RGBA16F : gl.RGBA8;
  const SCENE_TYPE = useHalfFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  function compile(type, source) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      console.error('Shader compile error:', log, '\n', source);
      throw new Error(log || 'shader compile failed');
    }
    return sh;
  }

  function program(vsSource, fsSource) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(p);
      console.error('Program link error:', log);
      throw new Error(log || 'program link failed');
    }
    return p;
  }

  const VERT = `#version 300 es
  precision highp float;
  layout(location = 0) in vec2 aPos;
  void main() {
    gl_Position = vec4(aPos, 0.0, 1.0);
  }`;

  // ---------------------------------------------------------------------------
  // Scene shader — everything is generated procedurally in one pass.
  // Coordinates: x = [-aspect, aspect], y = [-1, 1], one unit = half screen height.
  // ---------------------------------------------------------------------------
  const SCENE_FS = `#version 300 es
  precision highp float;
  out vec4 fragColor;

  uniform vec2  uRes;
  uniform float uTime;
  uniform float uAge;
  uniform vec2  uParallax;
  uniform vec2  uShake;
  uniform float uFlash;
  uniform float uHeat;
  uniform float uThermal;
  uniform float uSmoke;
  uniform float uCapY;
  uniform float uCapW;
  uniform float uCapH;
  uniform float uStemW;
  uniform float uFireY;
  uniform float uFireR;
  uniform float uShockR;
  uniform float uShockA;
  uniform float uDustR;
  uniform float uDustA;
  uniform float uHalo;

  const float HORIZON = -0.52;
  const float PI = 3.14159265359;

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
    for (int i = 0; i < 4; i++) {
      v += a * vnoise(p);
      p = rot * p * 2.03 + vec2(11.3, 7.7);
      a *= 0.5;
    }
    return v;
  }

  float fbm5(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
    for (int i = 0; i < 5; i++) {
      v += a * vnoise(p);
      p = rot * p * 2.01 + vec2(7.1, 13.7);
      a *= 0.5;
    }
    return v;
  }

  // Smoothstep that also accepts reversed edges (GLSL's built-in is undefined
  // for edge0 > edge1 on some drivers).
  float sstep(float a, float b, float x) {
    float t = clamp((x - a) / (b - a), 0.0, 1.0);
    return t * t * (3.0 - 2.0 * t);
  }

  // ---------------------------------------------------------------------------
  // Background
  // ---------------------------------------------------------------------------
  vec3 skyColor(vec2 p) {
    float t = clamp((p.y - HORIZON) / (1.0 - HORIZON), 0.0, 1.0);
    vec3 top = vec3(0.0018, 0.0032, 0.0085);
    vec3 mid = vec3(0.0042, 0.0080, 0.0180);
    vec3 low = vec3(0.0300, 0.0125, 0.0140);
    vec3 col = mix(low, mid, smoothstep(0.00, 0.42, t));
    col = mix(col, top, smoothstep(0.40, 1.00, t));

    // A faint, dust-stained band of air at the horizon.
    float haze = fbm(vec2(p.x * 1.15 + 4.0, p.y * 11.0 + uTime * 0.004));
    col += vec3(0.017, 0.011, 0.012) * pow(1.0 - t, 3.0) * (0.35 + haze);

    // Faint high cloud / milky way structure.
    float band = exp(-pow((p.y - 0.34 - p.x * 0.055) * 2.2, 2.0));
    float mw = fbm5(p * vec2(1.05, 1.45) + vec2(2.1, -1.4));
    col += vec3(0.011, 0.014, 0.026) * band * smoothstep(0.25, 0.85, mw);
    return col;
  }

  vec3 starField(vec2 p) {
    vec3 col = vec3(0.0);
    float horizonFade = smoothstep(HORIZON - 0.02, HORIZON + 0.17, p.y);
    for (int i = 0; i < 3; i++) {
      float fi = float(i);
      float scale = 118.0 + fi * 83.0;
      vec2 sp = p * scale + vec2(fi * 17.0, fi * 9.0);
      vec2 id = floor(sp);
      vec2 f = fract(sp) - 0.5;
      float h = hash21(id + fi * 41.7);
      float cut = 0.972 + fi * 0.006;
      float star = step(cut, h);
      float radius = 0.045 + 0.035 * hash21(id + 7.3);
      float core = sstep(radius, 0.0, length(f));
      float twinkle = 0.55 + 0.45 * sin(uTime * (0.7 + h * 2.8) + h * 6.2831);
      vec3 tint = mix(vec3(0.62, 0.76, 1.0), vec3(1.0, 0.78, 0.56), hash21(id + 3.9));
      float mag = 0.35 + 0.9 * hash21(id + 9.1);
      col += tint * core * star * twinkle * mag * horizonFade * (0.55 - fi * 0.12);
    }
    return col;
  }

  float ridgeLine(float x) {
    float base = HORIZON + 0.032;
    float broad = fbm(vec2(x * 0.78 + 3.1, 8.4));
    float detail = vnoise(vec2(x * 5.3 + 1.7, 2.2));
    float ridge = base + 0.085 * broad + 0.022 * detail + 0.015 * sin(x * 3.15 + 0.8);
    ridge -= 0.060 * exp(-pow(x * 2.35, 2.0));
    return ridge;
  }

  vec3 groundColor(vec2 p) {
    float d = HORIZON - p.y;
    vec3 near = vec3(0.0024, 0.0027, 0.0038);
    vec3 far = vec3(0.0080, 0.0068, 0.0076);
    vec3 col = mix(far, near, smoothstep(0.0, 0.46, d));

    float rip = fbm(vec2(p.x * 2.1, 18.0 / (d + 0.16)) + vec2(0.0, uTime * 0.006));
    col += vec3(0.010, 0.0075, 0.0060) * smoothstep(0.42, 0.8, rip) * (0.35 + 0.65 * (1.0 - smoothstep(0.0, 0.32, d)));

    // Light cast on the ground by the burst.
    vec2 gp = vec2(p.x * 0.62, (p.y - HORIZON) * 2.7);
    float glow = exp(-length(gp) * 2.4);
    col += vec3(1.0, 0.22, 0.035) * glow * (uHalo * 0.18 + uFlash * 0.55);

    // Heat shimmer near the base.
    col += vec3(0.34, 0.075, 0.012) * uHeat * exp(-length(vec2(p.x * 0.9, (p.y - HORIZON) * 5.0)) * 3.1) * 0.16;

    // Firelight washing across the flats beneath the cloud.
    float baseLight = exp(-length(vec2(p.x * 0.58, (p.y - HORIZON) * 3.4)) * 2.3);
    col += vec3(1.0, 0.24, 0.035) * baseLight * (uHeat * 0.11 + uHalo * 0.07);
    return col;
  }

  float rectMask(vec2 p, vec2 c, vec2 hs) {
    vec2 aa = fwidth(p) * 1.15 + 0.0006;
    vec2 h = max(hs, vec2(0.0008));
    float mx = sstep(h.x + aa.x, h.x - aa.x, abs(p.x - c.x));
    float my = sstep(h.y + aa.y, h.y - aa.y, abs(p.y - c.y));
    return mx * my;
  }

  // ---------------------------------------------------------------------------
  // Ground structures — a line of industrial buildings that are hit by the
  // shock front in sequence, shed facade sections, and raise dust columns.
  // ---------------------------------------------------------------------------
  void cityLayer(vec2 p, out vec3 cityCol, out float cityAlpha, out float cityDust) {
    cityCol = vec3(0.002, 0.0025, 0.004);
    cityAlpha = 0.0;
    cityDust = 0.0;

    float aspect = uRes.x / uRes.y;
    float spread = clamp(aspect / 1.78, 0.55, 1.24);
    float cityAge = uAge > 26.6 ? 0.0 : uAge;

    // x, width, height, depth below the horizon
    const vec4 B[9] = vec4[9](
      vec4(-1.46, 0.100, 0.235, 0.026),
      vec4(-1.18, 0.180, 0.310, 0.032),
      vec4(-0.90, 0.100, 0.170, 0.016),
      vec4(-0.65, 0.088, 0.086, 0.008),
      vec4( 0.63, 0.088, 0.090, 0.008),
      vec4( 0.88, 0.110, 0.180, 0.016),
      vec4( 1.14, 0.170, 0.330, 0.028),
      vec4( 1.42, 0.185, 0.200, 0.018),
      vec4( 1.64, 0.105, 0.270, 0.012)
    );

    for (int i = 0; i < 9; i++) {
      float fi = float(i);
      vec4 b = B[i];
      float bx = b.x * spread;
      float bw = b.y * (0.70 + 0.30 * spread);
      float bh = b.z;
      float baseY = HORIZON - b.w;
      float arrival = max(0.0, abs(bx) - 0.28) * 1.35 + b.w * 2.0;
      float dt = cityAge - arrival;
      float hit = smoothstep(0.0, 0.10, dt);

      vec3 bCol = vec3(0.0030, 0.0037, 0.0058);
      float bMask = 0.0;

      // Three facade columns collapse with different delays.
      for (int k = 0; k < 3; k++) {
        float fk = float(k);
        float cw = bw * 0.34;
        float cx = bx + (fk - 1.0) * bw * 0.34;
        float delay = 0.05 * fk + 0.09 * hash21(vec2(fi * 3.1 + 7.0, fk + 1.0));
        float cd = smoothstep(0.0, 1.35, dt - delay);
        float loss = 0.40 + 0.22 * hash21(vec2(fi + 1.0, fk + 3.0));
        float remain = bh * (1.0 - loss * cd);
        float jag = (hash21(vec2(fi + 9.0, fk + 4.0)) - 0.5) * 0.040 * cd;
        float top = baseY + max(remain + jag, 0.002);
        float lean = (hash21(vec2(fi * 4.7 + 2.0, fk + 6.0)) - 0.5) * 0.95 * cd;
        vec2 sp = p;
        sp.x -= (p.y - baseY) * lean;
        float alpha = rectMask(sp, vec2(cx, (baseY + top) * 0.5),
                               vec2(cw, (top - baseY) * 0.5 + 0.001));
        float damageN = vnoise(sp * vec2(16.0, 22.0) + vec2(fi * 13.1, fk * 7.7));
        float damaged = smoothstep(0.30, 0.72, damageN) * smoothstep(0.0, 0.45, dt);
        alpha *= 1.0 - damaged * 0.85;

        // Lit window grid; the lights die as the shock reaches the facade.
        vec2 wuv = (sp - vec2(cx, baseY)) / vec2(0.019, 0.026);
        vec2 wid = floor(wuv);
        vec2 wf = fract(wuv);
        float win = smoothstep(0.20, 0.74, wf.x) * smoothstep(0.24, 0.70, wf.y);
        float lit = step(0.60, hash21(wid + vec2(fi * 17.3 + 2.1, fk * 5.7 + 9.4)));
        float flick = 0.70 + 0.30 * sin(uAge * 13.0 + hash21(wid + fi) * 8.0);
        float lightLife = 1.0 - smoothstep(0.05, 0.90, dt);
        float windows = win * lit * flick * lightLife;

        vec3 fc = vec3(0.0080, 0.0090, 0.0125);
        float face = clamp((sp.x - (cx - cw)) / (2.0 * cw), 0.0, 1.0);
        fc *= 0.72 + 0.52 * face;
        fc *= 0.76 + 0.48 * damageN;
        float floorLine = sstep(0.055, 0.0, abs(fract((sp.y - baseY) * 38.0) - 0.5));
        fc += vec3(0.010, 0.0075, 0.0060) * floorLine * 0.35;
        fc += vec3(1.0, 0.52, 0.18) * windows * (0.16 + 0.20 * hash21(wid + 2.3));
        fc += vec3(1.0, 0.22, 0.035) * uHalo * 0.055;
        float topRim = sstep(0.0042, 0.0, abs(sp.y - top)) * alpha;
        fc += (vec3(0.020, 0.015, 0.012) + vec3(1.0, 0.27, 0.055) * uHalo * 0.14) * topRim;
        fc += vec3(1.0, 0.32, 0.06) * topRim * uHeat * 0.20;
        float sideRim = sstep(0.0036, 0.0, abs(abs(sp.x - cx) - cw)) * alpha;
        fc += (vec3(0.009, 0.007, 0.006) + vec3(1.0, 0.24, 0.045) * uHalo * 0.075) * sideRim;
        float roofLip = rectMask(sp, vec2(cx, top - 0.004), vec2(cw * 1.05, 0.004)) * alpha;
        fc += vec3(0.020, 0.015, 0.012) * roofLip;

        bCol = mix(bCol, fc, alpha);
        bMask = max(bMask, alpha);
      }

      // Rooftop plant and an antenna mast on some of the buildings.
      float roofSeed = step(0.35, hash21(vec2(fi, 11.3)));
      float roofH = (0.012 + 0.020 * hash21(vec2(fi, 4.2))) * roofSeed;
      float roofAlive = 1.0 - smoothstep(0.0, 0.30, dt);
      float roofMask = rectMask(p, vec2(bx, baseY + bh + roofH * 0.5),
                                vec2(bw * 0.30, roofH * 0.5 + 0.001)) * roofAlive;
      vec3 roofCol = vec3(0.009, 0.010, 0.014) + vec3(1.0, 0.20, 0.030) * uHalo * 0.05;
      bCol = mix(bCol, roofCol, roofMask);
      bMask = max(bMask, roofMask);

      float antSeed = step(0.62, hash21(vec2(fi, 14.7)));
      float antH = (0.028 + 0.030 * hash21(vec2(fi, 6.9))) * antSeed;
      float antAlive = 1.0 - smoothstep(0.0, 0.16, dt);
      float antBase = baseY + bh + roofH;
      float antMask = rectMask(p, vec2(bx + bw * 0.10, antBase + antH * 0.5),
                               vec2(0.0012, antH * 0.5)) * antAlive;
      bCol = mix(bCol, vec3(0.012, 0.011, 0.013), antMask);
      bMask = max(bMask, antMask);
      vec2 beaconP = p - vec2(bx + bw * 0.10, antBase + antH);
      float beacon = exp(-dot(beaconP * 58.0, beaconP * 58.0)) * antAlive * antSeed *
                     (0.35 + 0.65 * sin(uAge * 4.0 + fi));
      bCol += vec3(1.0, 0.07, 0.015) * beacon * 0.7;
      bMask = max(bMask, clamp(beacon * 0.55, 0.0, 1.0));

      // Low rubble silhouette.
      float rubbleH = 0.016 + 0.025 * hash21(vec2(fi, 7.7));
      float rub = rectMask(p, vec2(bx, baseY + rubbleH * 0.5), vec2(bw * 1.06, rubbleH * 0.5));
      rub *= smoothstep(0.05, 0.70, dt);
      vec3 rubCol = vec3(0.008, 0.007, 0.009) + vec3(0.022, 0.011, 0.006) * uHeat;
      bCol = mix(bCol, rubCol, rub);
      bMask = max(bMask, rub);

      // Fires smouldering in the wreckage.
      vec2 fireP = p - vec2(bx + 0.012 * sin(fi * 3.1), baseY + 0.012);
      float fire = exp(-dot(fireP * vec2(17.0, 42.0), fireP * vec2(17.0, 42.0)));
      fire *= hit * smoothstep(0.30, 1.10, dt) * (0.55 + 0.45 * sin(uAge * 17.0 + fi * 2.0));
      float fireA = clamp(fire * 0.62, 0.0, 1.0);
      bCol += vec3(1.0, 0.26, 0.022) * fireA * 0.45;
      bMask = max(bMask, fireA * 0.42);

      // A brief impact flash of dust and hot air at the base.
      float impact = smoothstep(0.0, 0.04, dt) * exp(-dt * 5.5);
      bCol += vec3(1.0, 0.48, 0.14) * impact * 0.55;
      bMask = max(bMask, impact * 0.38);

      // Two large facade sections shear off and tumble down.
      for (int k = 0; k < 2; k++) {
        float fk = float(k);
        float h1 = hash21(vec2(fi * 8.1 + fk, 3.9));
        float h2 = hash21(vec2(fi * 2.3 + fk, 9.4));
        float h3 = hash21(vec2(fi * 5.9 + fk, 1.7));
        float delay = 0.10 + 0.14 * h1;
        float ct = dt - delay;
        if (ct > 0.0 && ct < 2.2) {
          float side = h3 > 0.5 ? 1.0 : -1.0;
          vec2 cp = vec2(
            bx + side * (bw * 0.10 + 0.10 * ct),
            baseY + bh * (0.46 + 0.30 * h2) + 0.12 * ct - 0.38 * ct * ct
          );
          float ang = side * ct * (1.0 + 2.2 * h1);
          vec2 l = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * (p - cp);
          float cm = rectMask(l, vec2(0.0),
                              vec2(bw * (0.22 + 0.16 * h1), bh * (0.075 + 0.080 * h2)));
          cm *= 1.0 - smoothstep(1.4, 2.2, ct);
          vec3 cc = vec3(0.010, 0.009, 0.010) +
                    vec3(1.0, 0.30, 0.04) * (uHalo * 0.12 + (1.0 - smoothstep(0.0, 0.65, ct)) * 0.22);
          bCol = mix(bCol, cc, cm);
          bMask = max(bMask, cm);

          vec2 tq = (p - cp) / vec2(0.045, 0.038);
          cityDust += exp(-2.4 * dot(tq, tq)) * 0.18 * (1.0 - smoothstep(1.2, 2.2, ct));
        }
      }

      // Tumbling fragments.
      for (int k = 0; k < 3; k++) {
        float fk = float(k);
        float delay = 0.06 + 0.08 * hash21(vec2(fi * 2.7 + 1.0, fk + 5.0));
        float ct = dt - delay;
        if (ct > 0.0 && ct < 2.0) {
          float h1 = hash21(vec2(fi * 4.3 + fk, 8.1));
          float h2 = hash21(vec2(fi * 5.1 + fk, 2.7));
          float h3 = hash21(vec2(fi * 6.7 + fk, 6.3));
          vec2 cp = vec2(
            bx + (h1 - 0.5) * bw * 1.7 + (h3 - 0.5) * 0.14 * ct,
            baseY + bh * (0.35 + 0.40 * h2) + 0.10 * ct - 0.30 * ct * ct
          );
          float ang = ct * (2.0 + 5.0 * h3);
          vec2 l = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * (p - cp);
          float cm = rectMask(l, vec2(0.0), vec2(0.010 + 0.008 * h1, 0.006 + 0.007 * h2));
          cm *= 1.0 - smoothstep(1.2, 2.0, ct);
          vec3 cc = vec3(0.008, 0.008, 0.011) +
                    vec3(1.0, 0.25, 0.04) * (uHalo * 0.16 + (1.0 - smoothstep(0.0, 0.50, ct)) * 0.12);
          bCol = mix(bCol, cc, cm);
          bMask = max(bMask, cm);
        }
      }

      cityCol = mix(cityCol, bCol, bMask);
      cityAlpha = max(cityAlpha, bMask);

      // Expanding dust at the base and a slower rising plume.
      float dusty = smoothstep(0.0, 0.15, dt) * (1.0 - smoothstep(17.0, 26.5, cityAge));
      if (dusty > 0.001) {
        float t = min(dt, 7.0);
        float r = min(t, 4.0);
        vec2 c1 = vec2(bx + 0.010 * sin(fi * 2.7 + t * 0.45),
                       baseY + 0.018 + 0.030 * r);
        vec2 r1 = vec2(0.040 + bw * 0.48 + 0.015 * r, 0.025 + 0.019 * r);
        vec2 q1 = (p - c1) / r1;
        float d1 = exp(-2.4 * dot(q1, q1));

        vec2 c2 = vec2(bx + 0.015 * sin(fi * 4.1 + t * 0.28),
                       baseY + bh * 0.42 + 0.036 * min(t, 6.0));
        vec2 r2 = vec2(0.040 + bw * 0.30 + 0.016 * min(t, 5.0),
                       0.050 + 0.025 * min(t, 6.0));
        vec2 q2 = (p - c2) / r2;
        float d2 = exp(-2.5 * dot(q2, q2));

        vec2 c3 = vec2(bx + 0.020 * sin(fi * 5.3 + t * 0.35),
                       baseY + 0.050 + 0.026 * r);
        vec2 r3 = vec2(0.075 + bw * 0.58 + 0.030 * r, 0.045 + 0.022 * r);
        vec2 q3 = (p - c3) / r3;
        float d3 = exp(-2.6 * dot(q3, q3));

        float burst = smoothstep(0.0, 0.08, dt) * exp(-dt * 0.30);
        cityDust += (d1 * (0.72 + 0.75 * burst) + d2 * 0.38 + d3 * (0.50 + 0.55 * burst)) *
                    dusty * exp(-dt * 0.12);
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Explosion
  // ---------------------------------------------------------------------------
  // The cloud is a sum of soft, overlapping smoke parcels rather than a single
  // ellipse. The field gradient doubles as a surface normal, which gives the
  // canopy readable billows and a sense of volume.
  void capCloud(vec2 p, out float density, out vec3 nrm, out float radius,
                out vec2 qn, out float detail) {
    vec2 q = p - vec2(0.0, uCapY);
    vec2 denom = vec2(max(uCapW, 0.012), max(uCapH, 0.012));
    qn = q / denom;

    vec2 flow = vec2(0.0, -uAge * 0.050);
    vec2 wq = q * vec2(3.0, 4.4) + flow;
    vec2 warp = vec2(
      fbm(wq + vec2(1.7, 9.2)),
      fbm(wq + vec2(8.3, 2.8))
    ) - 0.5;

    vec2 qw = qn + warp * 0.21;
    qw.x += 0.016 * sin(qn.y * 3.6 + 0.8) + 0.008 * sin(qn.y * 8.1 - 1.2);
    qw.x /= mix(0.88, 1.02, smoothstep(-0.85, 0.75, qn.y));

    // Ragged, churning silhouette.
    vec2 curl = vec2(
      vnoise(q * 10.5 + vec2(1.3, -uAge * 0.18)),
      vnoise(q * 10.5 + vec2(7.1, 4.2))
    ) - 0.5;
    qw += curl * 0.095;

    // Eleven parcels: a broad dome, curled shoulders and a denser lower skirt.
    const vec4 P[11] = vec4[11](
      vec4(-0.68, -0.06, 0.40, 0.42),
      vec4(-0.38,  0.20, 0.47, 0.48),
      vec4(-0.03,  0.35, 0.53, 0.51),
      vec4( 0.34,  0.24, 0.48, 0.47),
      vec4( 0.67,  0.01, 0.38, 0.42),
      vec4(-0.58, -0.34, 0.37, 0.37),
      vec4(-0.24, -0.43, 0.41, 0.35),
      vec4( 0.18, -0.43, 0.42, 0.35),
      vec4( 0.56, -0.32, 0.36, 0.37),
      vec4( 0.02,  0.02, 0.60, 0.54),
      vec4( 0.02,  0.48, 0.35, 0.31)
    );

    float field = 0.0;
    vec2 grad = vec2(0.0);
    for (int i = 0; i < 11; i++) {
      float fi = float(i);
      vec4 pf = P[i];
      vec2 center = pf.xy + 0.023 * vec2(
        sin(uAge * 0.19 + fi * 1.73),
        cos(uAge * 0.15 + fi * 2.31)
      );
      vec2 pr = pf.zw * (1.0 + 0.045 * sin(uAge * 0.12 + fi * 1.17));
      vec2 d = (qw - center) / pr;
      float g = exp(-2.25 * dot(d, d));
      if (g > field) {
        field = g;
        grad = g * (-2.25) * d / pr;
      }
    }

    // A second, finer generation of parcels breaks up the large lobes into a
    // cauliflower surface. They sit on the outer canopy, where smoke curls.
    for (int j = 0; j < 15; j++) {
      float fj = float(j);
      float h1 = fract(sin(fj * 127.1 + 31.7) * 43758.5453);
      float h2 = fract(sin(fj * 269.5 + 11.3) * 24634.6345);
      float ang = fj * 2.39996 + 0.42 * sin(uAge * 0.16 + fj);
      float ring = 0.52 + 0.36 * h1;
      vec2 center = vec2(cos(ang) * ring, 0.10 + sin(ang) * ring * 0.82);
      center += 0.035 * vec2(sin(uAge * 0.21 + fj * 1.9), cos(uAge * 0.17 + fj * 1.3));
      float sr = 0.13 + 0.095 * h2;
      vec2 pr = vec2(sr, sr * (0.78 + 0.34 * h1));
      vec2 d = (qw - center) / pr;
      float g = exp(-2.6 * dot(d, d));
      field += g * 0.38;
      grad += g * 0.38 * (-2.6) * d / pr;
    }

    field *= 0.86 + 0.28 * vnoise(q * 22.0 + vec2(0.0, -uAge * 0.26));

    detail = fbm(q * 11.0 + vec2(3.1, -uAge * 0.09) + warp * 1.8);
    float shape = smoothstep(0.18, 0.72, field);
    float erosion = smoothstep(0.18, 0.72, detail);
    density = shape * mix(0.52, 1.0, erosion) * (0.80 + 0.28 * smoothstep(0.28, 0.78, detail));

    radius = length(qw);
    vec3 baseN = normalize(vec3(-grad.x * 0.38, -grad.y * 0.38, 1.0));
    vec2 bump = vec2(dFdx(detail), dFdy(detail)) * 12.0;
    nrm = normalize(baseN + vec3(-bump, 0.0));
  }

  void stemCloud(vec2 p, out float density, out vec3 nrm, out float detail) {
    float bottom = HORIZON - 0.025;
    float top = uCapY - uCapH * 0.30;
    float span = max(top - bottom, 0.04);

    const int N = 9;
    float field = 0.0;
    vec2 grad = vec2(0.0);
    for (int i = 0; i < N; i++) {
      float f = float(i) / float(N - 1);
      float y = mix(bottom + 0.03, top, f);
      float x = span * (0.038 * sin(f * 5.3 + uAge * 0.28) +
                        0.017 * sin(f * 13.1 - uAge * 0.17) +
                        0.008 * sin(f * 27.0 + uAge * 0.11));
      float topFlare = 0.060 * smoothstep(0.55, 1.0, f);
      float rw = (uStemW * (1.16 - 0.40 * f) + 0.032 * exp(-f * 4.8) + 0.012 + topFlare) *
                 (0.84 + 0.32 * vnoise(vec2(f * 4.2, uAge * 0.35)));
      float rh = span * 0.17;
      vec2 d = vec2((p.x - x) / rw, (p.y - y) / rh);
      float g = exp(-1.95 * dot(d, d));
      field += g;
      grad += g * (-1.95) * d / vec2(rw, rh);
    }

    // Side curls keep the column from reading as a smooth tube.
    for (int j = 0; j < 7; j++) {
      float f = (float(j) + 0.5) / 7.0;
      float side = (j - (j / 2) * 2 == 0) ? 1.0 : -1.0;
      float y = mix(bottom + 0.08, top - 0.03, f);
      float x = span * (0.038 * sin(f * 5.3 + uAge * 0.28)) +
                side * (uStemW * (0.55 + 0.30 * f) + 0.030);
      float rw = 0.050 + 0.030 * (1.0 - f) + 0.012 * sin(uAge * 0.4 + f * 8.0);
      float rh = span * 0.115;
      vec2 d = vec2((p.x - x) / rw, (p.y - y) / rh);
      float g = exp(-2.15 * dot(d, d));
      field += g * 0.72;
      grad += g * 0.72 * (-2.15) * d / vec2(rw, rh);
    }

    // A wide, ragged foot connects the column to the ground.
    vec2 footD = vec2(
      (p.x - 0.018 * sin(uAge * 0.5)) / 0.26,
      (p.y - (HORIZON - 0.035)) / 0.090
    );
    float foot = exp(-1.35 * dot(footD, footD)) * 0.88;
    field += foot;
    grad += foot * (-1.35) * footD / vec2(0.26, 0.090);

    field *= 0.84 + 0.30 * vnoise(vec2(p.y * 15.0, uAge * 0.32 + 2.0));
    detail = fbm(vec2(p.x * 27.0, p.y * 9.0) + vec2(0.0, -uAge * 0.24));
    float stemSurf = fbm(vec2(p.x * 20.0, p.y * 16.0) + vec2(3.4, -uAge * 0.18));
    density = smoothstep(0.20, 0.72, field) *
              (0.68 + 0.32 * smoothstep(0.16, 0.74, detail)) *
              (0.80 + 0.20 * smoothstep(0.24, 0.72, stemSurf));
    vec3 baseN = normalize(vec3(-grad.x * 0.26, -grad.y * 0.20, 1.0));
    vec2 bump = vec2(dFdx(stemSurf), dFdy(stemSurf)) * 5.0;
    nrm = normalize(baseN + vec3(-bump, 0.0));
  }

  void main() {
    vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
    vec2 parallax = uParallax + uShake;

    // Slow, barely perceptible camera drift keeps the wallpaper alive.
    parallax.x += 0.0032 * sin(uTime * 0.047);
    parallax.y += 0.0024 * sin(uTime * 0.061 + 1.3);
    p += parallax;
    vec2 pBg = p;

    // ---- sky, stars, ridge, ground -----------------------------------------
    vec3 col = skyColor(p);
    col += starField(p);

    // Distant ridge, two tones for a little aerial perspective.
    float ridge = ridgeLine(p.x);
    float ridgeGlow = exp(-abs(p.y - ridge) * 85.0) * smoothstep(HORIZON - 0.02, ridge, p.y);
    col += vec3(1.0, 0.24, 0.06) * ridgeGlow * (uHalo * 0.22 + uFlash * 0.35);
    if (p.y < ridge) {
      float depth = sstep(ridge, HORIZON, p.y);
      vec3 rock = mix(vec3(0.0048, 0.0052, 0.0080), vec3(0.0018, 0.0020, 0.0030), depth);
      rock += vec3(0.018, 0.010, 0.008) * (1.0 - depth) * (0.2 + 0.8 * uHeat);
      col = mix(col, rock, 1.0);
    }

    if (p.y < HORIZON) {
      col = groundColor(p);
    }

    // ---- shattered industrial buildings ------------------------------------
    vec3 cityCol;
    float cityA;
    float cityDust;
    cityLayer(p, cityCol, cityA, cityDust);
    col = mix(col, cityCol, cityA);

    if (cityDust > 0.001) {
      float cdNoise = fbm(vec2(p.x * 6.5, p.y * 10.0) + vec2(-uAge * 0.06, -uAge * 0.09));
      float cdNoise2 = fbm(vec2(p.x * 17.0, p.y * 23.0) + vec2(uAge * 0.04, -uAge * 0.12));
      float cdMask = clamp(cityDust * 0.70, 0.0, 0.92) *
                     smoothstep(0.10, 0.68, cdNoise) *
                     (0.48 + 0.72 * smoothstep(0.18, 0.78, cdNoise2));
      vec3 cdCol = mix(vec3(0.055, 0.050, 0.048), vec3(0.130, 0.095, 0.075),
                       clamp(uHeat * 1.1, 0.0, 1.0));
      col = mix(col, cdCol, cdMask);
      col += vec3(1.0, 0.24, 0.030) * cdMask * uHeat * 0.24;
    }

    // Broad halo around the developing cloud.
    vec2 hc = vec2(0.0, mix(uFireY, uCapY + 0.03, 0.72));
    float haloD = length((p - hc) * vec2(0.72, 1.0));
    float halo = exp(-haloD * 2.55) * uHalo;
    col += vec3(1.0, 0.23, 0.045) * halo * 0.105;
    col += vec3(1.0, 0.34, 0.10) * exp(-abs(p.y - HORIZON) * 11.0) * uHalo * 0.18;

    // Thermal bloom in the air around the burst.
    col += vec3(0.60, 0.31, 0.14) * uThermal * 0.035 * exp(-length((p - vec2(0.0, -0.24)) * vec2(0.75, 1.1)) * 2.2);

    // ---- fireball ----------------------------------------------------------
    vec2 fq = p - vec2(0.0, uFireY);
    float frad = length(fq);
    float fnoise = fbm(fq * vec2(13.0, 13.0) + vec2(0.0, uTime * 0.25));
    float fnoise2 = fbm(fq * vec2(31.0, 31.0) + vec2(7.3, -uTime * 0.18));
    float fang = atan(fq.y, fq.x);
    float flame = fbm(vec2(cos(fang), sin(fang)) * 2.15 + vec2(1.7, uTime * 0.04));
    float fEdge = uFireR * (0.68 + 0.42 * flame + 0.27 * fnoise + 0.08 * fnoise2);
    float fball = sstep(fEdge, fEdge * 0.44, frad);
    float fcore = sstep(fEdge * 0.68, 0.0, frad);
    float fireFade = exp(-uAge * 0.95);
    float fireBright = fball * (0.55 + 0.45 * fnoise) * fireFade;
    vec3 fireCol = mix(vec3(0.95, 0.075, 0.005), vec3(1.0, 0.44, 0.045), smoothstep(0.03, 0.55, fball));
    fireCol = mix(fireCol, vec3(1.0, 0.92, 0.63), fcore * smoothstep(0.0, 0.85, uFlash + 0.22));
    fireCol *= 0.76 + 0.52 * fnoise;
    col += fireCol * fireBright * (3.0 + 4.5 * uFlash);
    col += vec3(1.0, 0.82, 0.52) * smoothstep(0.0, 0.35, uFlash) * clamp(fball * 2.0, 0.0, 1.0) * 2.2;

    // ---- stem --------------------------------------------------------------
    float stemD;
    vec3 stemN;
    float stemDetail;
    stemCloud(p, stemD, stemN, stemDetail);
    float stemA = smoothstep(0.020, 0.45, stemD) * uSmoke;

    if (stemA > 0.003) {
      float sNdl = clamp(dot(stemN, normalize(vec3(-0.65, 0.55, 0.62))), 0.0, 1.0);
      float sRim = pow(1.0 - clamp(stemN.z, 0.0, 1.0), 2.0);
      float sDet = smoothstep(0.18, 0.76, stemDetail);
      vec3 stemCol = vec3(0.0025, 0.0032, 0.0060);
      stemCol += vec3(0.052, 0.054, 0.067) * pow(sNdl, 1.35) * (0.42 + 0.58 * sDet);
      stemCol += vec3(0.085, 0.105, 0.155) * sRim * 0.10;
      stemCol += vec3(1.0, 0.185, 0.018) * uHeat * 0.30 * (0.25 + 0.75 * sDet) *
                 sstep(uCapY - uCapH * 0.42, HORIZON - 0.008, p.y);
      col = mix(col, stemCol, stemA);

      float sEmit = uHeat * (0.22 + 0.78 * stemDetail) *
                    sstep(uCapY - uCapH * 0.42, HORIZON - 0.008, p.y);
      col += vec3(1.0, 0.18, 0.020) * sEmit * stemA * 0.12;

      float sFissure = pow(1.0 - clamp(abs(stemDetail * 2.0 - 1.0), 0.0, 1.0), 8.0);
      col += vec3(1.0, 0.10, 0.004) * sFissure * uHeat * stemA *
             sstep(uCapY - uCapH * 0.35, HORIZON - 0.02, p.y) * 0.26;
    }

    // ---- mushroom cap ------------------------------------------------------
    float capD;
    vec3 capN;
    float cr;
    vec2 cqn;
    float capDetail;
    capCloud(p, capD, capN, cr, cqn, capDetail);
    float capA = smoothstep(0.015, 0.40, capD) * uSmoke;
    capA = clamp(capA, 0.0, 1.0);

    if (capA > 0.003) {
      float ndl = clamp(dot(capN, normalize(vec3(-0.62, 0.56, 0.68))), 0.0, 1.0);
      float lowLight = clamp(dot(capN, normalize(vec3(0.25, -0.88, 0.36))), 0.0, 1.0);
      float rim = pow(1.0 - clamp(capN.z, 0.0, 1.0), 2.0);
      float under = sstep(0.12, -0.82, cqn.y);

      vec3 smokeCol = vec3(0.0018, 0.0023, 0.0045);
      smokeCol += vec3(0.062, 0.065, 0.080) * pow(ndl, 1.35) * (0.40 + 0.60 * smoothstep(0.18, 0.78, capDetail));
      smokeCol += vec3(0.15, 0.18, 0.27) * rim * 0.11;
      smokeCol += vec3(1.0, 0.175, 0.012) * under * lowLight * uHeat *
                  (0.22 + 0.78 * capDetail) * 1.10;
      smokeCol *= mix(0.48, 1.0, smoothstep(-0.98, 0.42, cqn.y));

      col = mix(col, smokeCol, capA);

      float coreGlow = uHeat * pow(max(0.0, 1.0 - cr), 1.40) * (0.24 + 1.05 * capDetail);
      vec3 glowCol = mix(vec3(0.75, 0.035, 0.002), vec3(1.0, 0.31, 0.025), smoothstep(0.0, 0.48, coreGlow));
      glowCol = mix(glowCol, vec3(1.0, 0.76, 0.40), smoothstep(0.62, 1.15, coreGlow));
      col += glowCol * coreGlow * capA * 1.65;

      // Crevices on the cap retain a hot orange internal light.
      float crack = smoothstep(0.56, 0.78, fbm((p - vec2(0.0, uCapY)) * 7.0 + vec2(uAge * 0.12, 1.3))) *
                    smoothstep(0.0, 0.55, under);
      col += vec3(1.0, 0.17, 0.018) * crack * uHeat * capA * 0.24;

      // Thin incandescent fissures glow through the soot.
      float fissure = pow(1.0 - clamp(abs(capDetail * 2.0 - 1.0), 0.0, 1.0), 8.0);
      col += vec3(1.0, 0.115, 0.008) * fissure * uHeat * capA *
             (0.32 + 0.68 * under) * 0.40;
    }

    // ---- ground dust and shock front --------------------------------------
    vec2 dq = p - vec2(0.0, HORIZON + 0.025);
    dq.y /= 0.235;
    float dr = length(dq);
    float dNoise = fbm(vec2(p.x * 3.0, p.y * 14.0) + vec2(-uAge * 0.12, uAge * 0.045));
    float dustBandR = uDustR * (0.86 + 0.30 * dNoise);
    float disk = sstep(uDustR + 0.36, 0.02, dr);
    float dustRing = sstep(0.32, 0.0, abs(dr - dustBandR));
    dustRing *= smoothstep(0.18, 0.62, fbm(vec2(p.x * 8.0, p.y * 24.0) + uAge * 0.2));
    float baseBand = exp(-pow((p.y - HORIZON + 0.030) * 4.3, 2.0)) * exp(-pow(p.x * 1.55, 2.0));
    float baseDust = baseBand * (0.28 + 0.72 * dNoise) * uDustA;
    float dust = (disk * 0.075 + dustRing * 0.36) * smoothstep(0.24, 0.72, dNoise);
    dust = max(dust, baseDust * 0.78);
    dust *= uDustA * sstep(HORIZON + 0.24, HORIZON - 0.04, p.y);
    vec3 dustCol = mix(vec3(0.016, 0.014, 0.015), vec3(0.092, 0.047, 0.028), uHeat * 0.75);
    if (dust > 0.002) {
      col = mix(col, dustCol, clamp(dust * 0.78, 0.0, 0.82));
      col += vec3(1.0, 0.23, 0.030) * dust * uHeat * 0.075;
    }

    // A low, turbulent dust skirt hides the foot of the column and grounds it.
    float footCloud = exp(-pow((p.y - HORIZON + 0.022) * 5.4, 2.0)) *
                      exp(-pow(p.x * 1.35, 2.0)) *
                      (0.34 + 0.66 * dNoise) * uSmoke;
    col = mix(col, dustCol * 1.15, clamp(footCloud * 0.62, 0.0, 0.72));
    col += vec3(1.0, 0.24, 0.030) * footCloud * uHeat * 0.18;

    // Contact shadow on the ground keeps the column from floating.
    float contact = exp(-pow(length(vec2(p.x * 2.6, (p.y - HORIZON + 0.025) * 8.5)), 2.0));
    contact *= sstep(HORIZON + 0.020, HORIZON - 0.055, p.y) * uSmoke;
    col *= 1.0 - contact * 0.30;

    // ---- spherical shockwave ----------------------------------------------
    vec2 sc = vec2(0.0, mix(HORIZON, uFireY, 0.55));
    vec2 sr = (p - sc) * vec2(1.0, 1.22);
    float rr = length(sr);
    float ang = atan(sr.y, sr.x);
    float ringWobble = 0.006 + 0.010 * fbm(vec2(cos(ang), sin(ang)) * 2.3 + uAge * 0.25);
    float shockRadiusS = uShockR * (1.0 + 0.040 * (fbm(vec2(cos(ang), sin(ang)) * 2.7 + uAge * 0.35) - 0.5)
                                        + 0.012 * sin(ang * 13.0 + uAge * 2.0));
    float shockRing = sstep(ringWobble, 0.0, abs(rr - shockRadiusS));
    shockRing *= 0.42 + 0.58 * sin(ang * 19.0 + uAge * 3.0);
    col += vec3(1.0, 0.56, 0.26) * shockRing * uShockA * 0.16;

    // ---- atmospheric flash -------------------------------------------------
    col += vec3(0.52, 0.43, 0.33) * uThermal * 0.008;

    // A little blue-black lift keeps the shadows from clipping to pure black.
    col += vec3(0.0008, 0.0011, 0.0018);

    fragColor = vec4(max(col, 0.0), 1.0);
  }`;

  // ---------------------------------------------------------------------------
  // Post-processing shaders
  // ---------------------------------------------------------------------------
  const BRIGHT_FS = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D uScene;
  uniform float uThreshold;
  uniform vec2 uOutRes;
  void main() {
    vec2 uv = gl_FragCoord.xy / uOutRes;
    vec3 c = texture(uScene, uv).rgb;
    float l = max(c.r, max(c.g, c.b));
    float knee = 0.38;
    float soft = clamp(l - uThreshold + knee, 0.0, 2.0 * knee);
    soft = soft * soft / (4.0 * knee + 0.0001);
    float contrib = max(soft, l - uThreshold) / max(l, 0.0001);
    fragColor = vec4(c * contrib, 1.0);
  }`;

  const BLUR_FS = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D uTex;
  uniform vec2 uDir;
  void main() {
    vec2 uv = gl_FragCoord.xy / vec2(textureSize(uTex, 0));
    vec3 c = texture(uTex, uv).rgb * 0.227027;
    c += (texture(uTex, uv + uDir * 1.384615).rgb + texture(uTex, uv - uDir * 1.384615).rgb) * 0.316216;
    c += (texture(uTex, uv + uDir * 3.230769).rgb + texture(uTex, uv - uDir * 3.230769).rgb) * 0.070270;
    fragColor = vec4(c, 1.0);
  }`;

  const COPY_FS = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D uTex;
  uniform vec2 uOutRes;
  void main() {
    vec2 uv = gl_FragCoord.xy / uOutRes;
    fragColor = texture(uTex, uv);
  }`;

  const COMPOSITE_FS = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D uScene;
  uniform sampler2D uBloomA;
  uniform sampler2D uBloomB;
  uniform vec2  uRes;
  uniform float uTime;
  uniform float uFlash;
  uniform float uThermal;
  uniform float uHeat;

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  vec3 aces(vec3 x) {
    return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
  }

  float sstep(float a, float b, float x) {
    float t = clamp((x - a) / (b - a), 0.0, 1.0);
    return t * t * (3.0 - 2.0 * t);
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 centered = uv - 0.5;

    // Heat haze, confined to the air around the fireball.
    vec2 warp = vec2(
      vnoise(uv * vec2(9.0, 7.0) + vec2(uTime * 0.30, 0.0)),
      vnoise(uv * vec2(9.0, 7.0) + vec2(13.0, -uTime * 0.24))
    ) - 0.5;
    float hazeMask = exp(-length((uv - vec2(0.5, 0.57)) * vec2(1.18, 1.0)) * 4.3) *
                     (uThermal + uHeat * 0.55);
    vec2 suv = uv + warp * 0.0048 * hazeMask;

    float ca = (0.00045 + 0.0018 * uThermal + 0.00055 * uHeat) * length(centered);
    vec3 col;
    col.r = texture(uScene, suv + centered * ca).r;
    col.g = texture(uScene, suv).g;
    col.b = texture(uScene, suv - centered * ca).b;

    vec3 bloomA = texture(uBloomA, uv).rgb;
    vec3 bloomB = texture(uBloomB, uv).rgb;
    col += bloomA * 0.22 + bloomB * 0.46;

    // Warm anamorphic veil around the blast.
    vec3 streak = texture(uBloomA, uv + vec2(0.018, 0.0)).rgb
                + texture(uBloomA, uv - vec2(0.018, 0.0)).rgb
                + texture(uBloomA, uv + vec2(0.045, 0.0)).rgb * 0.55
                + texture(uBloomA, uv - vec2(0.045, 0.0)).rgb * 0.55;
    col += streak * vec3(1.0, 0.55, 0.22) * 0.06;

    col += vec3(1.0, 0.90, 0.76) * uFlash * 2.2;
    col += vec3(0.55, 0.21, 0.07) * uThermal * 0.045;

    col *= 1.24;
    col = aces(col);
    col = pow(col, vec3(1.0 / 2.2));

    // Vignette and a soft, organic film grain.
    float vig = sstep(0.98, 0.24, length(centered * vec2(1.0, 1.12)));
    col *= mix(0.50, 1.0, vig);
    float grain = hash21(gl_FragCoord.xy + fract(uTime) * 137.0) - 0.5;
    col += grain * 0.021;
    col += vec3(0.0015, 0.0022, 0.0045) * (1.0 - vig);

    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
  }`;

  let sceneProgram, brightProgram, blurProgram, copyProgram, compositeProgram;
  try {
    sceneProgram = program(VERT, SCENE_FS);
    brightProgram = program(VERT, BRIGHT_FS);
    blurProgram = program(VERT, BLUR_FS);
    copyProgram = program(VERT, COPY_FS);
    compositeProgram = program(VERT, COMPOSITE_FS);
  } catch (err) {
    console.error(err);
    fallbackEl.style.display = 'grid';
    return;
  }

  // Fullscreen triangle.
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  function draw() {
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  const U = (prog, name) => gl.getUniformLocation(prog, name);

  const sceneUniforms = {
    res: U(sceneProgram, 'uRes'),
    time: U(sceneProgram, 'uTime'),
    age: U(sceneProgram, 'uAge'),
    parallax: U(sceneProgram, 'uParallax'),
    shake: U(sceneProgram, 'uShake'),
    flash: U(sceneProgram, 'uFlash'),
    heat: U(sceneProgram, 'uHeat'),
    thermal: U(sceneProgram, 'uThermal'),
    smoke: U(sceneProgram, 'uSmoke'),
    capY: U(sceneProgram, 'uCapY'),
    capW: U(sceneProgram, 'uCapW'),
    capH: U(sceneProgram, 'uCapH'),
    stemW: U(sceneProgram, 'uStemW'),
    fireY: U(sceneProgram, 'uFireY'),
    fireR: U(sceneProgram, 'uFireR'),
    shockR: U(sceneProgram, 'uShockR'),
    shockA: U(sceneProgram, 'uShockA'),
    dustR: U(sceneProgram, 'uDustR'),
    dustA: U(sceneProgram, 'uDustA'),
    halo: U(sceneProgram, 'uHalo')
  };
  const brightUniforms = {
    scene: U(brightProgram, 'uScene'),
    threshold: U(brightProgram, 'uThreshold'),
    outRes: U(brightProgram, 'uOutRes')
  };
  const blurUniforms = {
    tex: U(blurProgram, 'uTex'),
    dir: U(blurProgram, 'uDir')
  };
  const copyUniforms = {
    tex: U(copyProgram, 'uTex'),
    outRes: U(copyProgram, 'uOutRes')
  };
  const compositeUniforms = {
    scene: U(compositeProgram, 'uScene'),
    bloomA: U(compositeProgram, 'uBloomA'),
    bloomB: U(compositeProgram, 'uBloomB'),
    res: U(compositeProgram, 'uRes'),
    time: U(compositeProgram, 'uTime'),
    flash: U(compositeProgram, 'uFlash'),
    thermal: U(compositeProgram, 'uThermal'),
    heat: U(compositeProgram, 'uHeat')
  };

  // ---------------------------------------------------------------------------
  // Render targets
  // ---------------------------------------------------------------------------
  const targets = {
    scene: null,
    brightA: null,
    blurA: null,
    bloomA: null,
    brightB: null,
    blurB: null,
    bloomB: null
  };

  function createTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, SCENE_FORMAT, w, h, 0, gl.RGBA, SCENE_TYPE, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    return { tex, fbo, w, h };
  }

  function destroyTarget(t) {
    if (!t) return;
    gl.deleteTexture(t.tex);
    gl.deleteFramebuffer(t.fbo);
  }

  let viewW = 1, viewH = 1;
  let sceneW = 1, sceneH = 1;
  let dpr = 1;
  let quality = 1.0;

  function resize() {
    const cssW = Math.max(1, window.innerWidth);
    const cssH = Math.max(1, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 1.6);

    // Keep the final composite sharp but bounded on high-DPI / 4K panels.
    let outW = Math.min(Math.round(cssW * dpr), 2880);
    let outH = Math.round(outW * cssH / cssW);
    if (outH > 1620) {
      outH = 1620;
      outW = Math.round(outH * cssW / cssH);
    }
    viewW = outW;
    viewH = outH;
    canvas.width = outW;
    canvas.height = outH;

    // The volumetric-looking scene is rendered a little softer than the output;
    // the grain and bloom hide the difference and it keeps the wallpaper light.
    const sceneScale = Math.min(0.72, Math.max(0.50, 1380 / Math.max(outW, 1))) * quality;
    sceneW = Math.max(2, Math.round(outW * sceneScale));
    sceneH = Math.max(2, Math.round(outH * sceneScale));

    fxCanvas.width = outW;
    fxCanvas.height = outH;
    fxCanvas.style.width = cssW + 'px';
    fxCanvas.style.height = cssH + 'px';
    fxCanvas.style.position = 'absolute';
    fxCanvas.style.inset = '0';

    Object.keys(targets).forEach(k => { destroyTarget(targets[k]); targets[k] = null; });

    const halfW = Math.max(2, Math.round(sceneW / 2));
    const halfH = Math.max(2, Math.round(sceneH / 2));
    const quarterW = Math.max(2, Math.round(sceneW / 4));
    const quarterH = Math.max(2, Math.round(sceneH / 4));

    targets.scene = createTarget(sceneW, sceneH);
    targets.brightA = createTarget(halfW, halfH);
    targets.blurA = createTarget(halfW, halfH);
    targets.bloomA = createTarget(halfW, halfH);
    targets.brightB = createTarget(quarterW, quarterH);
    targets.blurB = createTarget(quarterW, quarterH);
    targets.bloomB = createTarget(quarterW, quarterH);

    ctxScaleX = outW / cssW;
    ctxScaleY = outH / cssH;
    fx.setTransform(ctxScaleX, 0, 0, ctxScaleY, 0, 0);
  }

  // ---------------------------------------------------------------------------
  // Simulation state
  // ---------------------------------------------------------------------------
  let age = FIXED_AGE !== null ? FIXED_AGE : INTRO_AGE;
  let simTime = 0;
  let lastAge = age;
  let paused = false;
  let last = performance.now();
  let blastSerial = 0;
  let shakeSeed = 0;
  let parallaxX = 0, parallaxY = 0;
  let targetParallaxX = 0, targetParallaxY = 0;
  let hintTimer = 0;
  let hintVisible = true;
  let uiHidden = false;
  let lastPointerMove = performance.now();
  let perfAccum = 0;
  let perfTime = 0;
  let qualityCooldown = 0;

  if (FIXED_AGE !== null) {
    paused = true;
  }

  function computeState() {
    const t = age;
    const death = smoothstep(22.8, 26.9, t);
    const ign = smoothstep(0.0, 0.06, t);
    const life = ign * (1.0 - death);
    const grow = easeOutCubic(clamp((t - 1.15) / 7.5, 0, 1));
    const lift = easeOutCubic(clamp((t - 0.90) / 9.0, 0, 1));
    const settle = smoothstep(7.0, 19.0, t);

    const capY = -0.335 + 0.735 * lift + 0.020 * settle;
    const capW = 0.085 + 0.665 * grow + 0.022 * settle;
    const capH = 0.050 + 0.375 * grow;
    const stemW = (0.048 + 0.050 * smoothstep(0.0, 1.4, t)) * (1.0 - 0.30 * smoothstep(12.0, 22.0, t));
    const fireR = 0.024 + 0.465 * (1.0 - Math.exp(-t * 2.35));
    const fireY = -0.405 + 0.195 * (1.0 - Math.exp(-t * 1.65));

    const heat = Math.exp(-t * 0.175) * ign * (1.0 - 0.35 * death);
    const smoke = smoothstep(0.90, 2.40, t) * (1.0 - death) * (1.0 - 0.42 * smoothstep(20.0, 27.0, t));
    const shockR = 3.7 * (1.0 - Math.exp(-t * 1.35));
    const shockA = Math.exp(-t * 1.58) * ign;
    const dustR = 0.10 + 0.96 * (1.0 - Math.exp(-t * 0.68));
    const dustA = Math.exp(-t * 0.170) * ign * (1.0 - death) * smoothstep(0.0, 0.25, t);
    const flash = t < 0.024 ? 1.0 : Math.exp(-(t - 0.024) * 22.0);
    const thermal = Math.exp(-t * 2.1) * ign;
    const halo = life * (0.22 * Math.exp(-t * 0.085) + 1.10 * Math.exp(-t * 0.72));
    const shakeAmp = reducedMotion ? 0.0 : 0.012 * Math.exp(-t * 2.4) * smoothstep(0.0, 0.06, t);
    const shakeX = shakeAmp * (0.65 * Math.sin(t * 83.0 + shakeSeed) + 0.35 * Math.sin(t * 137.0 + 2.1));
    const shakeY = shakeAmp * (0.55 * Math.cos(t * 71.0 + 1.7) + 0.45 * Math.sin(t * 119.0 + 0.3));

    return {
      capY, capW, capH, stemW, fireY, fireR,
      heat, smoke, shockR, shockA, dustR, dustA,
      flash, thermal, halo, life, shakeX, shakeY
    };
  }

  function detonate() {
    age = 0.0001;
    lastAge = 0.0001;
    blastSerial++;
    shakeSeed = Math.random() * 6.283;
    spawnBlastParticles();
  }

  function updateQuality(dt, now) {
    if (now < qualityCooldown || document.hidden) return;
    perfAccum += dt;
    perfTime += dt;
    if (perfTime < 3.0) return;
    const avg = perfAccum / perfTime;
    perfAccum = 0;
    perfTime = 0;
    if (avg > 0.045 && quality > 0.62) {
      quality = Math.max(0.62, quality - 0.12);
      resize();
      qualityCooldown = now + 3200;
    } else if (avg < 0.024 && quality < 1.0) {
      quality = Math.min(1.0, quality + 0.07);
      resize();
      qualityCooldown = now + 8000;
    }
  }

  // ---------------------------------------------------------------------------
  // Render loop
  // ---------------------------------------------------------------------------
  function render(now) {
    requestAnimationFrame(render);

    const dtRaw = (now - last) / 1000;
    const dt = Math.min(Math.max(dtRaw, 0), 0.20);
    last = now;

    if (!FREEZE && !paused) {
      simTime += dt;
      age += dt;
      if (age >= CYCLE) {
        if (AUTO) {
          age -= CYCLE;
          detonate();
        } else {
          age = INTRO_AGE;
          lastAge = age;
        }
      }
      updateQuality(Math.min(Math.max(dtRaw, 0), 1.0), now);
    }

    // Detect manual / automatic wrap even if the frame was skipped.
    if (age < lastAge - 0.1) {
      onCycleRestart();
    }
    lastAge = age;

    if (!FREEZE && !paused) {
      parallaxX += (targetParallaxX - parallaxX) * Math.min(1, dt * 2.2);
      parallaxY += (targetParallaxY - parallaxY) * Math.min(1, dt * 2.2);
      updateParticles(dt);
    }

    const s = computeState();
    renderScene(s);
    renderComposite(s);

    if (!FREEZE && !paused) {
      drawParticles();
      updateHint(dt);
      if (performance.now() - lastPointerMove > 2600) {
        document.body.classList.add('idle');
      }
    }
  }

  function renderScene(s) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, targets.scene.fbo);
    gl.viewport(0, 0, sceneW, sceneH);
    gl.useProgram(sceneProgram);

    gl.uniform2f(sceneUniforms.res, sceneW, sceneH);
    gl.uniform1f(sceneUniforms.time, simTime);
    gl.uniform1f(sceneUniforms.age, age);
    gl.uniform2f(sceneUniforms.parallax, parallaxX, parallaxY);
    gl.uniform2f(sceneUniforms.shake, s.shakeX, s.shakeY);
    gl.uniform1f(sceneUniforms.flash, s.flash);
    gl.uniform1f(sceneUniforms.heat, s.heat);
    gl.uniform1f(sceneUniforms.thermal, s.thermal);
    gl.uniform1f(sceneUniforms.smoke, s.smoke);
    gl.uniform1f(sceneUniforms.capY, s.capY);
    gl.uniform1f(sceneUniforms.capW, s.capW);
    gl.uniform1f(sceneUniforms.capH, s.capH);
    gl.uniform1f(sceneUniforms.stemW, s.stemW);
    gl.uniform1f(sceneUniforms.fireY, s.fireY);
    gl.uniform1f(sceneUniforms.fireR, s.fireR);
    gl.uniform1f(sceneUniforms.shockR, s.shockR);
    gl.uniform1f(sceneUniforms.shockA, s.shockA);
    gl.uniform1f(sceneUniforms.dustR, s.dustR);
    gl.uniform1f(sceneUniforms.dustA, s.dustA);
    gl.uniform1f(sceneUniforms.halo, s.halo);
    draw();

    // Bloom level 1 (half resolution).
    gl.bindFramebuffer(gl.FRAMEBUFFER, targets.brightA.fbo);
    gl.viewport(0, 0, targets.brightA.w, targets.brightA.h);
    gl.useProgram(brightProgram);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
    gl.uniform1i(brightUniforms.scene, 0);
    gl.uniform1f(brightUniforms.threshold, 0.66);
    gl.uniform2f(brightUniforms.outRes, targets.brightA.w, targets.brightA.h);
    draw();

    blurPass(targets.brightA, targets.blurA, 1.0, 0.0);
    blurPass(targets.blurA, targets.bloomA, 0.0, 1.0);

    // Bloom level 2 (quarter resolution, wider veil).
    gl.bindFramebuffer(gl.FRAMEBUFFER, targets.brightB.fbo);
    gl.viewport(0, 0, targets.brightB.w, targets.brightB.h);
    gl.useProgram(copyProgram);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, targets.bloomA.tex);
    gl.uniform1i(copyUniforms.tex, 0);
    gl.uniform2f(copyUniforms.outRes, targets.brightB.w, targets.brightB.h);
    draw();

    blurPass(targets.brightB, targets.blurB, 1.4, 0.0);
    blurPass(targets.blurB, targets.bloomB, 0.0, 1.4);
  }

  function blurPass(src, dst, dx, dy) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.useProgram(blurProgram);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(blurUniforms.tex, 0);
    gl.uniform2f(blurUniforms.dir, dx / src.w, dy / src.h);
    draw();
  }

  function renderComposite(s) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, viewW, viewH);
    gl.useProgram(compositeProgram);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, targets.bloomA.tex);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, targets.bloomB.tex);
    gl.uniform1i(compositeUniforms.scene, 0);
    gl.uniform1i(compositeUniforms.bloomA, 1);
    gl.uniform1i(compositeUniforms.bloomB, 2);
    gl.uniform2f(compositeUniforms.res, viewW, viewH);
    gl.uniform1f(compositeUniforms.time, simTime);
    gl.uniform1f(compositeUniforms.flash, s.flash);
    gl.uniform1f(compositeUniforms.thermal, s.thermal);
    gl.uniform1f(compositeUniforms.heat, s.heat);
    draw();
  }

  // ---------------------------------------------------------------------------
  // Particle overlay: sparks, rising embers, ash.
  // ---------------------------------------------------------------------------
  const fx = fxCanvas.getContext('2d');
  let fxDpr = 1;
  let ctxScaleX = 1, ctxScaleY = 1;
  let particles = [];
  let emberAccumulator = 0;
  let ashAccumulator = 0;

  function resetParticles() {
    particles.length = 0;
    emberAccumulator = 0;
    ashAccumulator = 0;
  }

  function spawnBlastParticles() {
    resetParticles();
    for (let i = 0; i < 130; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 0.18 + Math.random() * 0.95;
      const life = 0.7 + Math.random() * 2.6;
      particles.push({
        type: 'spark',
        x: (Math.random() - 0.5) * 0.08,
        y: -0.40 + (Math.random() - 0.5) * 0.05,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed * 0.55 + 0.22,
        life,
        maxLife: life,
        size: 0.6 + Math.random() * 1.6,
        hue: 22 + Math.random() * 28,
        phase: Math.random() * 6.2832
      });
    }
  }

  function spawnEmber(s) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const capSide = Math.random() < 0.68;
    let x, y;
    if (capSide) {
      const ang = Math.PI * (0.08 + Math.random() * 0.84) * (side > 0 ? 1 : 1);
      x = Math.cos(ang) * s.capW * (0.62 + Math.random() * 0.38) * side;
      y = s.capY + Math.sin(ang) * s.capH * 0.75;
    } else {
      x = (Math.random() - 0.5) * s.stemW * 3.6;
      y = HORIZON + Math.random() * Math.max(0.02, s.capY - HORIZON) * 0.62;
    }
    const life = 2.0 + Math.random() * 4.0;
    particles.push({
      type: 'ember',
      x, y,
      vx: (Math.random() - 0.5) * 0.07 + x * 0.05,
      vy: 0.045 + Math.random() * 0.14,
      life,
      maxLife: life,
      size: 0.5 + Math.random() * 1.5,
      hue: 18 + Math.random() * 28,
      phase: Math.random() * 6.2832
    });
  }

  function spawnAsh(s) {
    const x = (Math.random() - 0.5) * s.capW * 1.7;
    const y = s.capY - s.capH * (0.3 + Math.random() * 0.7);
    const life = 4.0 + Math.random() * 5.0;
    particles.push({
      type: 'ash',
      x, y,
      vx: (Math.random() - 0.5) * 0.045 + 0.02,
      vy: -0.025 - Math.random() * 0.055,
      life,
      maxLife: life,
      size: 0.4 + Math.random() * 1.1,
      hue: 20 + Math.random() * 18,
      phase: Math.random() * 6.2832
    });
  }

  function updateParticles(dt) {
    const s = computeState();

    if (age > 1.5 && age < 20.5) {
      const rate = 22 * smoothstep(1.5, 4.0, age) * (1.0 - smoothstep(16.0, 20.5, age));
      emberAccumulator += rate * dt;
      while (emberAccumulator >= 1) {
        spawnEmber(s);
        emberAccumulator -= 1;
      }
    }

    if (age > 7.0 && age < 24.0) {
      ashAccumulator += 5.0 * dt;
      while (ashAccumulator >= 1) {
        spawnAsh(s);
        ashAccumulator -= 1;
      }
    }

    const maxParticles = 420;
    if (particles.length > maxParticles) particles.splice(0, particles.length - maxParticles);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      if (p.type === 'spark') {
        p.vx *= Math.pow(0.11, dt);
        p.vy = p.vy * Math.pow(0.25, dt) + 0.05 * dt;
      } else if (p.type === 'ember') {
        p.vx += Math.sin(simTime * 1.7 + p.phase) * 0.018 * dt;
        p.vy += 0.005 * dt;
      } else {
        p.vx += Math.sin(simTime * 0.7 + p.phase) * 0.012 * dt;
        p.vy -= 0.004 * dt;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function toScreen(x, y) {
    const aspect = viewW / viewH;
    return [
      (x / aspect * 0.5 + 0.5) * (viewW / ctxScaleX),
      (0.5 - y * 0.5) * (viewH / ctxScaleY)
    ];
  }

  function drawParticles() {
    fx.clearRect(0, 0, viewW / ctxScaleX, viewH / ctxScaleY);
    if (!particles.length) return;

    // Ash first, normal blending and very dim.
    fx.globalCompositeOperation = 'source-over';
    for (const p of particles) {
      if (p.type !== 'ash') continue;
      const a = clamp(p.life / p.maxLife, 0, 1);
      const [sx, sy] = toScreen(p.x, p.y);
      fx.fillStyle = `rgba(184, 157, 135, ${0.16 * a})`;
      fx.fillRect(sx, sy, p.size, p.size);
    }

    // Embers and sparks, additive.
    fx.globalCompositeOperation = 'lighter';
    fx.lineCap = 'round';
    for (const p of particles) {
      if (p.type === 'ash') continue;
      const lifeT = clamp(p.life / p.maxLife, 0, 1);
      const a = Math.pow(lifeT, 0.7);
      const [sx, sy] = toScreen(p.x, p.y);
      const flicker = 0.7 + 0.3 * Math.sin(simTime * 9.0 + (p.phase || 0));
      const coreA = clamp(a * flicker, 0, 1);

      if (p.type === 'spark') {
        fx.strokeStyle = `hsla(${p.hue}, 100%, 68%, ${0.10 * coreA})`;
        fx.lineWidth = p.size * 3.0;
        fx.beginPath();
        fx.moveTo(sx, sy);
        fx.lineTo(sx - p.vx * 7, sy + p.vy * 7);
        fx.stroke();
        fx.fillStyle = `hsla(${p.hue + 10}, 100%, 82%, ${0.8 * coreA})`;
        fx.fillRect(sx - p.size * 0.5, sy - p.size * 0.5, p.size, p.size);
      } else {
        const glow = p.size * 4.0;
        fx.fillStyle = `hsla(${p.hue}, 100%, 55%, ${0.055 * coreA})`;
        fx.beginPath();
        fx.arc(sx, sy, glow, 0, 6.2832);
        fx.fill();
        fx.fillStyle = `hsla(${p.hue + 14}, 100%, 74%, ${0.62 * coreA})`;
        fx.beginPath();
        fx.arc(sx, sy, p.size, 0, 6.2832);
        fx.fill();
      }
    }
    fx.globalCompositeOperation = 'source-over';
  }

  // ---------------------------------------------------------------------------
  // Interaction & UI
  // ---------------------------------------------------------------------------
  function onCycleRestart() {
    resetParticles();
    blastSerial++;
    shakeSeed = Math.random() * 6.283;
    spawnBlastParticles();
  }

  function triggerBlast() {
    if (FREEZE) return;
    detonate();
    paused = false;
    showHint(2600);
  }

  function showHint(ms = 4200) {
    if (HIDE_UI) return;
    hintVisible = true;
    hintTimer = ms / 1000;
    hintEl.classList.add('show');
  }

  function updateHint(dt) {
    if (hintTimer > 0) {
      hintTimer -= dt;
      if (hintTimer <= 0) {
        hintEl.classList.remove('show');
        hintVisible = false;
      }
    }
  }

  window.addEventListener('pointerdown', (e) => {
    if (e.target !== canvas && e.target !== fxCanvas && e.target !== document.body && e.target !== document.getElementById('stage')) return;
    triggerBlast();
  }, { passive: true });

  document.getElementById('stage').addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('pointermove', (e) => {
    targetParallaxX = (e.clientX / window.innerWidth - 0.5) * 0.013;
    targetParallaxY = (e.clientY / window.innerHeight - 0.5) * -0.010;
    lastPointerMove = performance.now();
    document.body.classList.remove('idle');
    if (!hintVisible && !uiHidden) showHint(2100);
  }, { passive: true });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') {
      e.preventDefault();
      triggerBlast();
    } else if (k === 'f') {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    } else if (k === 'p') {
      paused = !paused;
      showHint(paused ? 2600 : 1600);
    } else if (k === 'h') {
      if (HIDE_UI) return;
      uiHidden = !uiHidden;
      document.getElementById('brand').style.display = uiHidden ? 'none' : '';
      if (uiHidden) {
        hintEl.classList.remove('show');
        hintVisible = false;
      } else {
        showHint(2000);
      }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      last = performance.now();
    } else {
      last = performance.now();
    }
  });

  window.addEventListener('resize', () => {
    resize();
    // Re-seed ash/embers so the composition doesn't jump after a resize.
    if (particles.length) {
      for (const p of particles) { p.x = clamp(p.x, -2.0, 2.0); p.y = clamp(p.y, -0.6, 1.0); }
    }
  });

  window.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    fallbackEl.style.display = 'grid';
    fallbackEl.querySelector('strong').textContent = '图形上下文已丢失';
  });

  // Expose a tiny controller for debugging and for embedding in wallpaper hosts.
  window.hydrogen = {
    detonate: triggerBlast,
    setTime: (t) => { age = clamp(t, 0, CYCLE - 0.0001); lastAge = age; },
    pause: (v = true) => { paused = !!v; },
    get age() { return age; },
    get cycle() { return CYCLE; },
    get quality() { return quality; },
    get renderSize() { return [sceneW, sceneH]; }
  };

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  resize();
  showHint(7000);
  requestAnimationFrame((t) => {
    last = t;
    render(t);
  });
})();
</script>
</body>
</html>
