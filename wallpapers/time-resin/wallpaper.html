<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>时间的树脂 · Amber, Keeping Time</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;color:#f2eadb;font-family:system-ui,"Microsoft YaHei",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button,select,input{font:inherit;accent-color:#d9a553}button,select{color:inherit;background:#ffffff0c;border:1px solid #ffffff24;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover{background:#ffffff1c}button:focus-visible,select:focus-visible{outline:2px solid #d9a553;outline-offset:4px}#settings{position:fixed;right:20px;bottom:20px;opacity:0;transition:opacity .3s;background:#111820b8;backdrop-filter:blur(12px)}body:hover #settings,body:focus-within #settings,body.intro #settings{opacity:.75}#panel{position:fixed;bottom:72px;right:20px;width:min(330px,calc(100vw - 40px));max-height:calc(100vh - 100px);overflow:auto;background:#10151eea;border:1px solid #ffffff25;border-radius:14px;padding:22px;backdrop-filter:blur(20px);box-shadow:0 18px 70px #0006}#panel[hidden]{display:none}h1{font-family:serif;font-size:23px;font-weight:400;margin:0 0 5px}small{font-size:10px;letter-spacing:2px;color:#d9a553}p{font-size:12px;line-height:1.8;color:#c3c6cd}.controls{display:flex;flex-wrap:wrap;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;margin:14px 0;font-size:12px}#status{display:block;margin-top:14px;color:#a4b1c1;font-size:11px}kbd{font-family:inherit;color:#eee}body.clean #settings{opacity:0;pointer-events:none}body.clean #panel{display:none}
</style></head><body class="intro"><canvas id="scene" aria-label="时间的树脂：气泡、植物残片和晶体悬浮在琥珀中，每一分钟活跃运行都会沉积一层日夜色泽，留存在本机。"></canvas>
<button id="settings" type="button" aria-controls="panel" aria-expanded="false" title="显示设置（H）">☷ 设置</button>
<aside id="panel" hidden aria-label="壁纸设置"><h1>时间的树脂</h1><small>Amber, Keeping Time</small><p>气泡、植物残片和晶体悬浮在琥珀中，每一分钟活跃运行都会沉积一层日夜色泽，留存在本机。</p><div class="controls"><button id="pause" type="button">暂停</button><button id="event" type="button">晶体闪光</button><button id="reseed" type="button">变换构图</button></div><label class="row">时间流速<select id="speed"><option value="0.5">舒缓 · ½</option><option value="1" selected>自然 · 1</option><option value="2">轻快 · 2</option></select></label><label class="row">画质<select id="quality"><option value="high">精细</option><option value="low">节能</option></select></label><p><kbd>空格</kbd> 暂停 / 继续 · <kbd>H</kbd> 设置<br><kbd>E</kbd> 特殊事件 · <kbd>R</kbd> 变换构图</p><output id="status" aria-live="polite"></output></aside>
<script>(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const params = new URLSearchParams(location.search);
  const TAU = Math.PI * 2;
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const mix = (a, b, x) => a + (b - a) * x;
  const smooth = (a, b, x) => { const v = clamp((x - a) / (b - a)); return v * v * (3 - 2 * v); };
  const mod = (x, n) => ((x % n) + n) % n;
  function numberParam(key, fallback, lo, hi) {
    const v = params.has(key) ? Number(params.get(key)) : NaN;
    return Number.isFinite(v) ? clamp(v, lo, hi) : fallback;
  }
  let seed = numberParam('seed', 20261111, 1, 4294967295) >>> 0;
  function randomSource(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let v = Math.imul(s ^ s >>> 15, 1 | s); v ^= v + Math.imul(v ^ v >>> 7, 61 | v); return ((v ^ v >>> 14) >>> 0) / 4294967296; }; }
  let rand = randomSource(seed);
  // Smooth, bounded harmonic field: no texture or network input.
  const field = (x, y = 0) => Math.sin(x * 1.73 + y * .73) * .5 + Math.sin(x * 3.17 - y * 1.37) * .27 + Math.sin(x * 7.13 + y * 2.71) * .13 + Math.cos(x * 13.31 - y) * .1;
  const rgba = (r, g, b, a) => `rgba(${r},${g},${b},${clamp(a)})`;
  let w = 1, h = 1, unit = 1, dpr = 1;
  let t = numberParam('t', 24, 0, 1e8), speed = 1, frames = 0, raf = 0, last = null;
  let quality = params.get('quality') === 'low' ? 'low' : 'high';
  const media = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = params.has('still') ? params.get('still') !== '0' : media.matches;
  let manualMotion = params.has('still');
  let specialStart = -1e9, drawMs = 0, clockDate = new Date();
  const pointer = { x: 0, y: 0, active: false };
  const panel = document.getElementById('panel');
  const status = document.getElementById('status');
  function circle(x, y, r, color) { if (r <= 0) return; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function ellipse(x, y, rx, ry, color, rotation = 0) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rotation, 0, TAU); ctx.fill(); }
  function glow(x, y, r, color) { const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(.1, r)); g.addColorStop(0, color); g.addColorStop(1, 'transparent'); circle(x, y, r, g); }
  function background(top, bottom) { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, top); g.addColorStop(1, bottom); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }
  function stroke(color, width = 1) { ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(); }
  function eventPhase(time, period, duration, offset = 0) {
    const manual = time - specialStart;
    if (manual >= 0 && manual <= duration) return manual / duration;
    const cycle = mod(time + offset, period);
    return cycle < duration ? cycle / duration : -1;
  }
  const bell = p => p < 0 ? 0 : Math.sin(clamp(p) * Math.PI) ** 2;
  function stars(list, time, alpha = .6) {
    for (const p of list) circle(p.x * w, p.y * h, p.r, rgba(174, 191, 214, alpha * (.65 + .35 * Math.sin(time * .25 + p.a))));
  }
  function makeStars(count) { return Array.from({ length: count }, () => ({ x: rand(), y: rand(), r: .3 + rand() * 1.1, a: rand() * TAU })); }
  function vignette(alpha = .35) { const g = ctx.createRadialGradient(w / 2, h * .46, unit * .2, w / 2, h / 2, Math.hypot(w, h) * .55); g.addColorStop(0, 'transparent'); g.addColorStop(1, `rgba(0,0,0,${alpha})`); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }

  function createArtwork() {
  const key = 'lumen-dream-atlas-resin-v1';
  let history = { version: 1, seconds: 0, layers: [] }, storageOK = true, dirty = false, sinceSave = 0;
  try {
    const stored = JSON.parse(localStorage.getItem(key) || 'null');
    if (stored && stored.version === 1 && Number.isFinite(stored.seconds) && stored.seconds >= 0 && stored.seconds < 1e12 && Array.isArray(stored.layers)) {
      history = { version: 1, seconds: stored.seconds, layers: stored.layers.filter(x => Number.isFinite(x.minute) && x.minute > 0 && typeof x.night === 'boolean').slice(-240) };
    }
  } catch { storageOK = false; }
  let bubbles, shards, dust;
  function reset() {
    bubbles = Array.from({ length: 52 }, () => ({ x: (rand() - .5) * 1.4, y: (rand() - .5) * 1.6, r: .004 + rand() ** 3 * .045, phase: rand() * TAU }));
    shards = Array.from({ length: 14 }, () => ({ x: (rand() - .5) * 1.2, y: (rand() - .5) * 1.4, r: .012 + rand() * .025, a: rand() * TAU }));
    dust = Array.from({ length: 600 }, () => ({ x: (rand() - .5) * 1.5, y: (rand() - .5) * 1.8, a: rand() }));
  }
  reset();
  function flush() { if (!dirty) return; try { localStorage.setItem(key, JSON.stringify(history)); dirty = false; storageOK = true; } catch { storageOK = false; } sinceSave = 0; }
  function outline(s) {
    ctx.beginPath(); ctx.moveTo(-s * .51, -s * .91); ctx.bezierCurveTo(-s * .85, -s * .77, -s * .87, s * .12, -s * .64, s * .67);
    ctx.lineTo(-s * .3, s * .89); ctx.bezierCurveTo(s * .1, s * 1.03, s * .63, s * .78, s * .73, s * .46);
    ctx.bezierCurveTo(s * .88, s * .02, s * .73, -s * .63, s * .47, -s * .82); ctx.closePath();
  }
  function fern(x, y, length, angle, level) {
    if (!level) return;
    const xx = x + Math.sin(angle) * length, yy = y - Math.cos(angle) * length;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + length * .08, y - length * .6, xx, yy); stroke('rgba(53,35,20,.65)', Math.max(.65, level * .42));
    for (let i = 1; i <= 5; i++) {
      const f = i / 6;
      if (level > 1) {
        fern(mix(x, xx, f), mix(y, yy, f), length * (.34 - f * .18), angle - .72, level - 1);
        fern(mix(x, xx, f), mix(y, yy, f), length * (.34 - f * .18), angle + .72, level - 1);
      }
    }
  }
  return {
    reset, flush, eventDuration: 18,
    update(dt) {
      const previous = Math.floor(history.seconds / 60); history.seconds += dt; sinceSave += dt; dirty = true;
      const minute = Math.floor(history.seconds / 60), hour = new Date().getHours();
      for (let i = Math.max(previous + 1, minute - 239); i <= minute; i++) history.layers.push({ minute: i, night: hour < 6 || hour >= 19 });
      history.layers = history.layers.slice(-240);
      if (minute !== previous || sinceSave >= 15) flush();
    },
    status: () => `已沉积 ${Math.floor(history.seconds / 60)} 分钟 · 保存最近 ${history.layers.length} 层${storageOK ? ' · 本机记忆' : ' · 本地保存不可用'}`,
    snapshot: () => ({ activeSeconds: history.seconds, layers: history.layers.length, storageOK, particles: dust.length + bubbles.length }),
    draw(time) {
      background('#14110f', '#080b10');
      const cx = w * .53, cy = h * .48, s = Math.min(w * .43, h * .46);
      glow(cx, cy, s * 1.55, 'rgba(133,86,37,.18)');
      ellipse(cx, h * .94, s * .74, s * .08, 'rgba(0,0,0,.45)');
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.13 + Math.sin(time * .021) * .012);
      outline(s);
      const amber = ctx.createLinearGradient(-s * .8, -s, s * .7, s);
      amber.addColorStop(0, '#544522'); amber.addColorStop(.21, '#c0903c'); amber.addColorStop(.44, '#6d431e'); amber.addColorStop(.68, '#b67b2e'); amber.addColorStop(1, '#39291e');
      ctx.fillStyle = amber; ctx.fill();
      ctx.save(); ctx.clip();
      glow(-s * .3, -s * .42, s * .95, 'rgba(255,211,111,.43)');
      glow(s * .49, s * .31, s * .8, 'rgba(244,149,38,.27)');
      // Primordial bands are always present. Earned layers carry their day/night color.
      const earned = history.layers;
      for (let i = 0; i < 68 + earned.length; i++) {
        const real = i >= 68, layer = earned[i - 68];
        const z = i / (68 + earned.length), y = s * (-.98 + z * 1.98);
        ctx.beginPath();
        for (let j = 0; j <= 100; j++) {
          const x = -s + j / 100 * 2 * s;
          const yy = y + field(x / s * 2.4 + z * 2, z * 7 + time * .001) * s * .038;
          j ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
        }
        stroke(real ? (layer.night ? 'rgba(75,103,137,.38)' : 'rgba(255,214,126,.43)') : 'rgba(255,208,117,.12)', real ? 1.15 : .6);
      }
      fern(-s * .14, s * .48, s * .91, -.24, 3);
      ctx.save(); ctx.translate(s * .26, -s * .1); ctx.rotate(.65);
      ellipse(0, 0, s * .043, s * .15, 'rgba(68,42,19,.35)');
      ctx.beginPath(); ctx.moveTo(0, s * .15); ctx.lineTo(0, -s * .14); stroke('rgba(49,36,20,.5)', 1); ctx.restore();
      ctx.fillStyle = 'rgba(255,226,163,.34)'; ctx.beginPath();
      for (const p of dust) ctx.rect(p.x * s + Math.sin(time * .025 + p.a * 10) * 1.3, p.y * s, p.a > .9 ? 1.2 : .55, .8);
      ctx.fill();
      for (const b of bubbles) {
        const x = b.x * s, y = b.y * s + Math.sin(time * .035 + b.phase) * s * .002;
        ctx.beginPath(); ctx.arc(x, y, b.r * s, 0, TAU); stroke('rgba(255,225,155,.37)', .7);
        circle(x - b.r * s * .35, y - b.r * s * .4, Math.max(.5, b.r * s * .16), '#ffe6b385');
      }
      const flash = bell(eventPhase(time, 180, 18, 60));
      for (const p of shards) {
        ctx.save(); ctx.translate(p.x * s, p.y * s); ctx.rotate(p.a);
        ctx.beginPath(); ctx.moveTo(0, -p.r * s * 2); ctx.lineTo(p.r * s * .55, 0); ctx.lineTo(0, p.r * s); ctx.lineTo(-p.r * s * .5, 0); ctx.closePath();
        ctx.fillStyle = 'rgba(255,226,161,.14)'; ctx.fill(); stroke('rgba(255,229,174,.53)', .65);
        if (flash) glow(0, -p.r * s, s * .08, `rgba(255,230,160,${flash * .42})`);
        ctx.restore();
      }
      ctx.restore(); outline(s); stroke('rgba(248,220,158,.65)', 1.4);
      ctx.save(); ctx.scale(.974, .974); outline(s); stroke('rgba(255,211,124,.22)', 3); ctx.restore();
      ctx.beginPath(); ctx.moveTo(-s * .51, -s * .89); ctx.bezierCurveTo(-s * .76, -s * .64, -s * .77, -s * .16, -s * .72, s * .12); stroke('rgba(255,238,191,.65)', 2);
      ctx.restore(); vignette(.42);
    },
  };
}


  const art = createArtwork();
  function draw() {
    const begin = performance.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    art.draw(t);
    drawMs = performance.now() - begin;
    frames++;
  }
  function resize() {
    w = Math.max(1, innerWidth); h = Math.max(1, innerHeight); unit = Math.min(w, h);
    const budget = quality === 'low' ? 1200000 : 2600000;
    dpr = Math.min(devicePixelRatio || 1, 2, Math.sqrt(budget / (w * h)));
    canvas.width = Math.max(1, Math.floor(w * dpr)); canvas.height = Math.max(1, Math.floor(h * dpr));
    art.resize?.(); draw();
  }
  function syncPanel() {
    document.getElementById('pause').textContent = paused ? '继续' : '暂停';
    document.getElementById('pause').setAttribute('aria-pressed', String(paused));
    document.getElementById('settings').setAttribute('aria-expanded', String(!panel.hidden));
    status.textContent = art.status?.() || (paused ? '画面已暂停' : '离线绘制 · 30 FPS');
  }
  function loop(now) {
    raf = 0;
    if (paused || document.hidden) { last = null; return; }
    if (last === null) last = now;
    if (now - last >= 1000 / 30 - .5) {
      const dt = Math.min(.1, (now - last) / 1000); last = now;
      t += dt * speed; clockDate = new Date(); art.update?.(dt, t); draw();
      if (!panel.hidden) syncPanel();
    }
    raf = requestAnimationFrame(loop);
  }
  function schedule() { if (!raf && !paused && !document.hidden) { last = null; raf = requestAnimationFrame(loop); } }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; last = null; }
  function togglePause() { paused = !paused; manualMotion = true; if (paused) { stop(); art.flush?.(); } else { clockDate = new Date(); schedule(); } syncPanel(); }
  function trigger() { specialStart = t - (paused ? (art.eventDuration || 20) * .5 : 0); draw(); syncPanel(); }
  function reseed() { seed = (seed + 2654435761) >>> 0; rand = randomSource(seed); art.reset?.(); art.resize?.(); draw(); }
  function togglePanel() { document.body.classList.remove('clean'); panel.hidden = !panel.hidden; syncPanel(); }
  document.getElementById('settings').addEventListener('click', togglePanel);
  document.getElementById('pause').addEventListener('click', togglePause);
  document.getElementById('event').addEventListener('click', trigger);
  document.getElementById('reseed').addEventListener('click', reseed);
  document.getElementById('speed').addEventListener('change', e => { speed = Number(e.target.value); });
  document.getElementById('quality').value = quality;
  document.getElementById('quality').addEventListener('change', e => { quality = e.target.value; resize(); });
  addEventListener('keydown', e => {
    if (e.repeat || /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key.toLowerCase() === 'h') togglePanel();
    else if (e.key.toLowerCase() === 'e') trigger();
    else if (e.key.toLowerCase() === 'r') reseed();
  });
  canvas.addEventListener('pointermove', e => { pointer.x = (e.clientX / w - .5) * 2; pointer.y = (e.clientY / h - .5) * 2; pointer.active = true; });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.x = pointer.y = 0; });
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); art.flush?.(); } else { clockDate = new Date(); if (!paused) draw(); schedule(); } });
  addEventListener('pagehide', () => { stop(); art.flush?.(); });
  media.addEventListener('change', e => { if (!manualMotion) { paused = e.matches; if (paused) stop(); else schedule(); syncPanel(); } });
  if (params.get('hud') === '0') document.body.classList.add('clean');
  setTimeout(() => document.body.classList.remove('intro'), 4500);
  // Small diagnostics surface for deterministic captures and long-duration checks.
  window.__dreamAtlas = {
    snapshot: () => ({ id: 'time-resin', seed, t, paused, frames, w, h, dpr, quality, speed, drawMs, scheduled: !!raf, specialStart, ...art.snapshot?.() }),
    seek(time) { if (!Number.isFinite(time) || time < 0) throw new Error('Invalid time'); t = time; draw(); },
    render: draw,
    trigger,
    // Advance active time only for persistence verification; normal playback uses RAF.
    advance(seconds) { if (!Number.isFinite(seconds) || seconds < 0 || seconds > 86400) throw new Error('Invalid duration'); t += seconds * speed; art.update?.(seconds, t); draw(); },
    flush() { art.flush?.(); },
  };
  resize(); syncPanel(); schedule();
})();
</script></body></html>
